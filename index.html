<style>
/* ============================================================
   PALETTE + TYPE (Optus Themed)
   ============================================================ */
:root {
  --bg-main:      #090C0D;
  --bg-panel:     #12181A;
  --bg-card:      #161e21;
  --bg-card-hover:#1F2E32;
  --line:         rgba(255,255,255,0.09);
  
  --optus-teal:   #00A3AD;
  --optus-aqua:   #2BDCE8;
  --optus-yellow: #FFD100;
  
  --text-main:    #EAF2F3;
  --text-muted:   #8CA0A4;
  --text-bright:  #ffffff;

  --display: "Arial Black", "Helvetica Neue", Impact, sans-serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;

  --r: 8px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: var(--body);
  background: var(--bg-main);
  color: var(--text-main);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;
  background-image: radial-gradient(rgba(255,255,255,0.035) 1px, transparent 1px);
  background-size: 26px 26px;
}

a { color: inherit; text-decoration: none; }

/* ============================================================
   MASTHEAD & CONTROLS
   ============================================================ */
.masthead {
  padding: 40px 5vw 20px;
  background: radial-gradient(120% 150% at 12% -30%, rgba(0,163,173,0.15) 0%, transparent 60%),
              linear-gradient(180deg, #0B1113 0%, var(--bg-main) 100%);
  border-bottom: 1px solid var(--line);
}
.wordmark {
  font-family: var(--display);
  font-style: italic;
  font-size: clamp(2rem, 5vw, 4rem);
  text-transform: uppercase;
  color: var(--optus-aqua);
}
.wordmark span { color: var(--optus-yellow); }

.controls {
  position: sticky;
  top: 0;
  z-index: 30;
  padding: 15px 5vw;
  background: rgba(9, 12, 13, 0.86);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
  display: flex;
  gap: 15px;
  align-items: center;
  flex-wrap: wrap;
}

.searchwrap input {
  padding: 10px 15px;
  border-radius: 4px;
  border: 1px solid var(--line);
  background: var(--bg-panel);
  color: var(--text-bright);
  min-width: 250px;
  transition: border-color 0.2s ease;
}
.searchwrap input:focus { outline: none; border-color: var(--optus-aqua); }

.chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
}
.chip {
  padding: 6px 12px;
  border-radius: 4px;
  background: var(--bg-panel);
  color: var(--text-muted);
  border: 1px solid transparent;
  cursor: pointer;
  font-size: 0.85rem;
  font-weight: 600;
  transition: all 0.2s ease;
}
.chip:hover { background: var(--bg-card-hover); color: var(--text-bright); }
.chip[aria-pressed="true"] { background: var(--optus-yellow); color: #000; }

/* ============================================================
   FEATURED SECTION
   ============================================================ */
.featured-container {
  padding: 30px 5vw;
  max-width: 1400px;
  margin: 0 auto;
  width: 100%;
}
.featured-header {
  font-size: 1.2rem;
  color: var(--optus-aqua);
  margin-bottom: 15px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-family: var(--mono);
}
.featured-card {
  position: relative;
  border-radius: var(--r);
  overflow: hidden;
  display: flex;
  background: var(--bg-panel);
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  border: 1px solid var(--line);
  min-height: 350px;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.featured-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 15px 40px rgba(0,0,0,0.7);
  border-color: rgba(43, 220, 232, 0.3);
}
.featured-img {
  flex: 2;
  position: relative;
}
.featured-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.featured-img::after {
  content: '';
  position: absolute;
  top: 0; right: 0; bottom: 0;
  width: 30%;
  background: linear-gradient(to right, transparent, var(--bg-panel));
}
.featured-info {
  flex: 1;
  padding: 40px 30px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  z-index: 2;
}
.featured-info h2 {
  font-family: var(--display);
  font-style: italic;
  font-size: 2.5rem;
  color: var(--text-bright);
  margin-bottom: 10px;
  line-height: 1.1;
  text-transform: uppercase;
}
.featured-info p {
  color: var(--text-muted);
  font-size: 1rem;
  line-height: 1.5;
  margin-bottom: 20px;
}
.play-btn {
  display: inline-block;
  background: var(--optus-yellow);
  color: #000;
  padding: 12px 24px;
  border-radius: 4px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  width: max-content;
  transition: filter 0.2s ease, transform 0.2s ease;
}
.play-btn:hover { filter: brightness(1.1); transform: scale(1.05); }

/* ============================================================
   LIST VIEW (STEAM STYLE WITH OPTUS COLORS)
   ============================================================ */
main { flex: 1; width: 100%; max-width: 1400px; margin: 0 auto; padding: 0 5vw 60px; }

.list-view {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.list-item {
  display: flex;
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 4px;
  height: 140px;
  transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
  position: relative;
  overflow: hidden;
  animation: fadeUp 0.4s ease forwards;
  opacity: 0;
  transform: translateY(10px);
}
@keyframes fadeUp {
  to { opacity: 1; transform: translateY(0); }
}

.list-item:hover {
  background: var(--bg-card-hover);
  border-color: rgba(43, 220, 232, 0.4);
  transform: translateX(4px);
}

.item-thumb {
  width: 250px;
  flex-shrink: 0;
  position: relative;
}
.item-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.item-content {
  padding: 15px 20px;
  display: flex;
  flex: 1;
  justify-content: space-between;
}

.item-main {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  max-width: 60%;
}
.item-main h3 {
  font-family: var(--display);
  font-style: italic;
  font-size: 1.2rem;
  color: var(--text-bright);
  margin-bottom: 5px;
  text-transform: uppercase;
  letter-spacing: -0.02em;
}
.item-main p {
  font-size: 0.85rem;
  color: var(--text-muted);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.item-tags { display: flex; gap: 6px; margin-top: 10px; }
.item-tags span {
  background: rgba(0, 163, 173, 0.1);
  border: 1px solid rgba(0, 163, 173, 0.3);
  padding: 4px 8px;
  border-radius: 4px;
  font-size: 0.7rem;
  font-weight: 600;
  color: var(--optus-aqua);
  text-transform: uppercase;
}

.item-meta {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  justify-content: space-between;
  font-size: 0.8rem;
  color: var(--text-muted);
  text-align: right;
  font-family: var(--mono);
}
.meta-row { display: flex; gap: 15px; margin-bottom: 5px;}
.meta-label { color: #5D6F73; font-size: 0.7rem; text-transform: uppercase; }
.meta-value { color: var(--text-main); }

.stretch-link { position: absolute; inset: 0; z-index: 10; }

/* ============================================================
   RESPONSIVE DESIGN
   ============================================================ */
@media (max-width: 900px) {
  .featured-card { flex-direction: column; min-height: auto; }
  .featured-img::after { background: linear-gradient(to bottom, transparent, var(--bg-panel)); width: 100%; height: 30%; top: auto; }
  .featured-img { height: 250px; }
  
  .list-item { height: auto; flex-direction: column; }
  .item-thumb { width: 100%; height: 200px; }
  .item-content { flex-direction: column; gap: 15px; }
  .item-main { max-width: 100%; }
  .item-meta { align-items: flex-start; text-align: left; }
}
</style>

/* ============================================================================
   ENGINE LOGIC
   ============================================================================ */
let query = "";
let activeTag = "All";

const listView = document.getElementById("list-view");
const chipBar = document.getElementById("chips");
const searchEl = document.getElementById("search");
const featuredContainer = document.getElementById("featured-container");

function buildChips() {
  const tags = ["All", ...[...new Set(myGames.flatMap(g => g.tags || []))].sort()];
  chipBar.innerHTML = "";
  tags.forEach(tag => {
    const b = document.createElement("button");
    b.className = "chip";
    b.textContent = tag;
    b.setAttribute("aria-pressed", String(tag === activeTag));
    b.addEventListener("click", () => {
      activeTag = tag;
      [...chipBar.children].forEach(c => c.setAttribute("aria-pressed", String(c === b)));
      renderList();
    });
    chipBar.appendChild(b);
  });
}

function renderFeatured() {
  const featured = myGames.find(g => g.title === FEATURED_GAME_TITLE) || myGames[0];
  
  if(!featured) return;

  featuredContainer.innerHTML = `
    <h2 class="featured-header">Featured & Recommended</h2>
    <div class="featured-card">
      <div class="featured-img">
        <img src="${featured.image}" alt="${featured.title}" onerror="this.src='data:image/svg+xml;charset=utf-8,%3Csvg xmlns=\\'http://www.w3.org/2000/svg\\' viewBox=\\'0 0 320 180\\'%3E%3Crect width=\\'320\\' height=\\'180\\' fill=\\'%2312181A\\'/%3E%3C/svg%3E'">
      </div>
      <div class="featured-info">
        <h2>${featured.title}</h2>
        <p>${featured.description}</p>
        <a href="${featured.url}" class="play-btn" target="_blank" rel="noopener">Play Now</a>
      </div>
    </div>
  `;
}

function renderList() {
  const q = query.trim().toLowerCase();
  const list = myGames.filter(g => {
    const hay = (g.title + " " + g.description + " " + (g.tags || []).join(" ")).toLowerCase();
    if (q && !hay.includes(q)) return false;
    if (activeTag !== "All" && !(g.tags || []).includes(activeTag)) return false;
    return true;
  });

  listView.innerHTML = "";

  list.forEach((game, index) => {
    const rDate = game.releaseDate || "TBD";
    const ver = game.version || "1.0.0";
    const creator = game.creator || "Unknown";

    const item = document.createElement("article");
    item.className = "list-item";
    item.style.animationDelay = `${index * 0.05}s`;

    item.innerHTML = `
      <div class="item-thumb">
        <img src="${game.image}" alt="${game.title}" onerror="this.src='data:image/svg+xml;charset=utf-8,%3Csvg xmlns=\\'http://www.w3.org/2000/svg\\' viewBox=\\'0 0 320 180\\'%3E%3Crect width=\\'320\\' height=\\'180\\' fill=\\'%2312181A\\'/%3E%3C/svg%3E'">
      </div>
      <div class="item-content">
        <div class="item-main">
          <div>
            <h3>${game.title}</h3>
            <p>${game.description}</p>
          </div>
          <div class="item-tags">
            ${(game.tags || []).map(t => `<span>${t}</span>`).join("")}
          </div>
        </div>
        <div class="item-meta">
          <div>
            <div class="meta-row"><span class="meta-label">Release Date:</span> <span class="meta-value">${rDate}</span></div>
            <div class="meta-row"><span class="meta-label">Version:</span> <span class="meta-value">${ver}</span></div>
            <div class="meta-row"><span class="meta-label">Creator:</span> <span class="meta-value">${creator}</span></div>
          </div>
        </div>
      </div>
      <a href="${game.url}" class="stretch-link" target="_blank" rel="noopener" aria-label="Play ${game.title}"></a>
    `;
    
    listView.appendChild(item);
  });
}

searchEl.addEventListener("input", e => { query = e.target.value; renderList(); });

buildChips();
renderFeatured();
renderList();
</script>
</body>
</html>
