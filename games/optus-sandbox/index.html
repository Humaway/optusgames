<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Optus Sandbox - Simplified</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #e0e0e0; 
            font-family: sans-serif;
        }
        canvas { 
            display: block; 
            width: 100vw; 
            height: 100vh; 
        }
        #ui { 
            position: absolute; 
            top: 20px; 
            left: 20px; 
            color: #333; 
            pointer-events: none; /* Lets clicks pass through to the 3D canvas */
        }
    </style>

    <!-- Import Maps allow us to use ES6 'import' syntax directly in the browser -->
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
                "firebase/database": "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js"
            }
        }
    </script>
</head>
<body>
    <div id="ui">
        <h2>Optus Sandbox</h2>
        <p id="status">Connecting to Firebase...</p>
    </div>
    
    <canvas id="gameCanvas"></canvas>
    
    <!-- Load our combined game logic -->
    <script type="module" src="./app.js"></script>
</body>
</html>
