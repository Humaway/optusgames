    setZoom(UI.ppb * (e.deltaY < 0 ? 1.15 : 1 / 1.15), (sc.scrollLeft + ax) / UI.ppb, ax);
  }, { passive:false });
  $('#arrScroll').addEventListener('pointerdown', () => { UI.focus = 'arr'; });
  document.addEventListener('pointerdown', e => {
    if (CTX && !CTX.contains(e.target)) closeCtx();
    if (openMenu && !openMenu.contains(e.target)) closeMenus();
  });
  document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('button'); if (b && e.detail > 0) b.blur(); });
  document.addEventListener('pointerover', e => { const t = e.target.closest && e.target.closest('[data-tip]'); if (t) tip(t.dataset.tip); });
  window.addEventListener('keydown', onKey);
  window.addEventListener('keyup', e => { if (kbUp(e)) e.preventDefault(); });
  window.addEventListener('blur', kbRelease);
  window.addEventListener('resize', () => { PR.dirty = true; if (UI.dock === 'smp' && SE.draw) SE.draw(); });
  window.addEventListener('beforeunload', e => { if (dirty){ e.preventDefault(); e.returnValue = ''; } });
}
function onKey(e){
  if ($('.modal-bg')) return;
  const a = document.activeElement, typing = a && (a.tagName === 'TEXTAREA' || a.isContentEditable || (a.tagName === 'INPUT' && !/range|checkbox|button/.test(a.type)));
  if (typing) return;
  const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
  if (e.key === 'Escape'){
    closeCtx(); closeMenus();
    if (LEARN){ LEARN.el.classList.remove('learn'); LEARN = null; toast('MIDI learn cancelled', 'warn'); }
    if (UI.focus === 'roll') rollKey(e); else { UI.sel.clear(); paintSel(); }
    return;
  }
  if (!mod && !e.altKey && kbDown(e)){ e.preventDefault(); return; }
  const go = fn => { e.preventDefault(); fn(); };
  if (e.code === 'Space') return go(() => togglePlay(e.shiftKey));
  if (e.key === 'F9') return go(toggleRecord);
  if (e.key === 'Home') return go(() => seek(0));
  if (/^F[5-8]$/.test(e.key)) return go(() => setDock(['roll', 'dev', 'mix', 'smp'][+e.key[1] - 5]));
  if (!mod && k === 'm') return go(toggleKeys);
  if (!mod && (e.key === '?' || (e.shiftKey && e.key === '/'))) return go(shortcutsDialog);
  if (mod && k === 'z') return go(() => e.shiftKey ? redo() : undo());
  if (mod && k === 'y') return go(redo);
  if (mod && k === 's') return go(saveProject);
  if (mod && k === 'o') return go(() => pickFiles('.ollie,.json', f => openProject(f[0])));
  if (mod && e.shiftKey && k === 'e') return go(exportWav);
  if (mod && e.shiftKey && k === 'l') return go(toggleLoop);
  if (mod && e.altKey && k === 'b') return go(toggleBrowser);
  if (UI.focus === 'roll' && UI.dock === 'roll' && rollKey(e)) return e.preventDefault();
  if (mod && k === 'u') return go(quantizeCmd);
  if (e.key === 'Delete' || e.key === 'Backspace') return go(deleteClips);
  if (mod && k === 'd') return go(duplicateClips);
  if (mod && k === 'c') return go(copyClips);
  if (mod && k === 'v') return go(() => pasteClips(trackOf(S.sel), S.pos));
  if (mod && k === 'e') return go(splitAtPlayhead);
  if (mod && k === 'a') return go(selectAllCmd);
  if (mod && k === 'l') return go(loopSelection);
  if (!mod && (e.key === '=' || e.key === '+')) return go(() => setZoom(UI.ppb * 1.4));
  if (!mod && e.key === '-') return go(() => setZoom(UI.ppb / 1.4));
}

/* ============================================================================
   BUILT-IN SAMPLES + DEMO SONG
   Every built-in sample is rendered by the engines themselves, so the file
   ships no audio and the demo exercises the sampler, slicer and audio tracks.
   ========================================================================== */
async function renderBuiltins(){
  const sr = ctx.sampleRate;
  const mk = async (name, kind, p, notes, secs) => {
    const oc = new OfflineAudioContext(2, Math.ceil(secs * sr), sr), Gx = { c:oc, offline:true, wait:[], st:{ bpm:120 } };
    const inst = makeInstrument(oc, { kind, p:{ ...defaults(ENG[kind].params), ...p } }, oc.destination, Gx);
    notes.forEach(([n, t, d, v], i) => { inst.noteOn(n, v, t, 'b' + i); inst.noteOff(n, t + d, 'b' + i); });
    return addBuffer(await oc.startRendering(), name, 'builtin');
  };
  const k8 = PRESET_BY['808 Kit'].p, k9 = PRESET_BY['909 Kit'].p, ids = {};
  for (const [name, p, n, s] of [['Kick 808', k8, 36, 1.6], ['Kick 909', k9, 36, 0.8], ['Snare', k9, 38, 0.6], ['Clap', k8, 39, 0.6], ['Closed Hat', k9, 42, 0.3],
    ['Open Hat', k9, 46, 0.9], ['Crash', k9, 49, 2.6], ['Ride', k9, 51, 2.6], ['Rim', k8, 37, 0.3], ['Cowbell', k8, 47, 0.6], ['Shaker', k8, 50, 0.3], ['Tom', k8, 45, 0.9]])
    await mk(name, 'drums', p, [[n, 0, 0.1, 118]], s);
  const br = [], kick = [0, 2, 10, 11, 16, 18, 26], snare = [4, 7, 9, 12, 15, 20, 23, 25, 28, 30];
  kick.forEach(s => br.push([36, s * 0.125, 0.1, 120]));
  snare.forEach((s, i) => br.push([38, s * 0.125, 0.1, i % 3 === 1 ? 72 : 114]));
  for (let s = 0; s < 32; s += 2) br.push([s % 8 === 6 ? 46 : 42, s * 0.125, 0.05, s % 4 ? 70 : 96]);
  br.push([49, 0, 0.1, 90]);
  ids.brk = await mk('Breakbeat 120', 'drums', k9, br, 4);
  ids.chord = await mk('Piano Chord Cmaj7', 'piano', {}, [[48, 0, 2.6, 92], [55, 0.012, 2.6, 84], [59, 0.024, 2.6, 84], [64, 0.036, 2.6, 90]], 3.2);
  ids.rev = addBuffer(reverseBuf(BUF.get(ids.chord).buf), 'Reverse Piano', 'builtin');
  await mk('EP Stab Am7', 'fm', PRESET_BY['Electric Piano'].p, [[57, 0, 0.8, 104], [60, 0, 0.8, 92], [64, 0, 0.8, 92], [67, 0, 0.8, 98]], 2);
  await mk('Guitar C3', 'pluck', PRESET_BY['Nylon Guitar'].p, [[60, 0, 1.6, 104]], 2.8);
  await mk('Choir Aah', 'vox', PRESET_BY['Choir Aahs'].p, [[57, 0, 1.8, 92], [64, 0, 1.8, 86], [69, 0, 1.8, 86]], 3);
  await mk('Bell C4', 'mallet', { model:'Bells' }, [[72, 0, 0.5, 112]], 5);
  await mk('Sub Boom', 'drums', { ...k8, kDec:2.4, kPunch:1, kDrive:0.3 }, [[36, 0, 0.1, 127]], 2.6);
  return ids;
}
function demoProject(ids){
  const s = newProject();
  s.name = 'Ollie Demo'; s.bpm = 122; s.loop = { on:true, start:0, end:32 };
  const T_ = (preset, name, vol = 0) => { const t = newInstTrack(PRESET_BY[preset], name); t.vol = vol; return t; };
  const clip = (tr, start, len, notes, name) => tr.clips.push({ id:uid('c'), start, len, offset:0, name, notes });
  const chords = [[57, 60, 64, 67], [53, 57, 60, 64], [55, 59, 60, 64], [55, 59, 62, 64]], roots = [45, 41, 36, 43];
  const keys = T_('Electric Piano', 'Keys', -6), kn = [];
  chords.forEach((c, bar) => [[0, 1.4, 96], [1.5, 0.45, 72], [2.5, 1.3, 86]].forEach(([o, d, v]) => c.forEach((p, i) => kn.push({ p, t:bar * 4 + o + i * 0.012, d, v:v - i * 3 }))));
  clip(keys, 0, 16, kn, 'Chords'); clip(keys, 16, 16, deep(kn), 'Chords');
  const pad = T_('Warm Pad', 'Pad', -8), pn = [];
  chords.forEach((c, bar) => c.slice(1).forEach(p => pn.push({ p:p + 12, t:bar * 4, d:4, v:62 })));
  clip(pad, 0, 16, pn, 'Pad'); clip(pad, 16, 16, deep(pn), 'Pad');
  const brk = T_('Slicer', 'Breaks', -4), E = BUF.get(ids.brk);
  brk.inst.p.buf = ids.brk; brk.inst.p.slices = detectOnsets(E.buf, 0.55);
  const k = 8 / E.buf.duration, sl = brk.inst.p.slices;
  const bn = sl.map((x, i) => ({ p:36 + i, t:x * k, d:Math.max(0.05, ((sl[i + 1] ?? E.buf.duration) - x) * k * 0.98), v:104 }));
  clip(brk, 0, 8, bn, 'Breakbeat'); clip(brk, 8, 8, deep(bn), 'Breakbeat');
  brk.fx = [fxDef('autofilter', { type:'lowpass', freq:600, res:3, depth:0 }), fxDef('eq', { hpF:70 })];
  brk.sends = [0.12, 0];
  const fspec = specOf(FX.autofilter.params, 'freq');
  brk.auto = [{ target:`f|${brk.id}|${brk.fx[0].id}|freq`, pts:[{ t:0, v:toNorm(fspec, 350) }, { t:14, v:toNorm(fspec, 7000) }, { t:16, v:toNorm(fspec, 19000) }] }];
  const dr = T_('808 Kit', 'Drums', 0), dn = [];
  for (let bar = 0; bar < 4; bar++){
    const b = bar * 4;
    [0, 0.75, 2.5].forEach(o => dn.push({ p:36, t:b + o, d:0.25, v:o ? 104 : 124 }));
    [1, 3].forEach(o => dn.push({ p:39, t:b + o, d:0.25, v:112 }));
    for (let st = 0; st < 16; st++){
      const o = st * 0.25;
      if (bar === 3 && o >= 3) continue;
      dn.push(o === 1.5 || o === 3.5 ? { p:46, t:b + o, d:0.25, v:88 } : { p:42, t:b + o, d:0.1, v:st % 2 ? 60 : 94 });
    }
  }
  [[48, 15], [48, 15.25], [45, 15.5], [41, 15.75]].forEach(([p, t]) => dn.push({ p, t, d:0.25, v:108 }));
  dn.push({ p:49, t:0, d:0.5, v:100 });
  clip(dr, 16, 16, dn, 'Beat');
  const bass = T_('Moog Bass', 'Bass', 0), bl = [];
  roots.forEach((r, bar) => [[0, 0.5, 118, 0], [0.75, 0.25, 90, 0], [1.5, 0.5, 104, 12], [2.5, 0.5, 110, 0], [3, 0.25, 88, 0], [3.5, 0.5, 100, 12]]
    .forEach(([o, d, v, oc]) => bl.push({ p:r + oc, t:bar * 4 + o, d, v })));
  clip(bass, 16, 16, bl, 'Bassline');
  const arp = T_('Kalimba', 'Arp', -5), an = [];
  chords.forEach((c, bar) => [0, 1, 2, 3, 2, 1, 3, 2].forEach((ix, st) => an.push({ p:c[ix] + 12, t:bar * 4 + st * 0.5, d:0.45, v:st % 2 ? 78 : 102 })));
  clip(arp, 16, 16, an, 'Arp');
  arp.sends = [0.3, 0.35];
  const fx = newTrack('audio', 'FX'), R = BUF.get(ids.rev), len = R.buf.duration / (60 / s.bpm);
  fx.clips.push({ id:uid('c'), start:16 - len, len, offset:0, buf:ids.rev, gain:-5, name:'Reverse Piano' });
  fx.sends = [0.3, 0]; fx.vol = 0;
  s.tracks = [dr, brk, bass, keys, pad, arp, fx];
  s.sel = keys.id;
  return s;
}
let DEMO_IDS = null;
async function loadDemo(){
  if (dirty && !(await confirmBox('Load the demo song?', 'Unsaved changes in this project will be lost.', 'Load demo'))) return;
  if (T.playing) stop();
  S = demoProject(DEMO_IDS);
  UNDO.length = 0; REDO.length = 0; dirty = false;
  UI.clip = S.tracks.find(t => t.id === S.sel).clips[0].id;
  reloadProject();
}

/* ============================================================================
   SELF-TEST  (open with ?test, or Help → Run self-test)
   ========================================================================== */
async function selfTest(){
  const ok = [], bad = [], check = (name, cond) => (cond ? ok : bad).push(name);
  const sp = N('x', 'x', 20, 20000, 1000, { c:'exp' });
  check('exp taper round-trips', Math.abs(fromNorm(sp, toNorm(sp, 440)) - 440) < 0.01);
  const smf = [0x4D,0x54,0x68,0x64,0,0,0,6,0,0,0,1,0x01,0xE0, 0x4D,0x54,0x72,0x6B,0,0,0,13, 0x00,0x90,60,100, 0x83,0x60,0x80,60,0, 0x00,0xFF,0x2F,0x00];
  const m = parseMidi(new Uint8Array(smf).buffer);
  check('MIDI file parses', m.length === 1 && m[0].notes[0].p === 60 && Math.abs(m[0].notes[0].d - 1) < 1e-9);
  const b = newBuf(1, 88200, 44100), d = b.getChannelData(0);
  for (const t of [0.5, 1.25]) for (let i = 0; i < 2000; i++) d[Math.floor(t * 44100) + i] = Math.sin(i * 0.3) * Math.exp(-i / 400);
  const on = detectOnsets(b, 0.55);
  check('transients found', on.length === 3 && Math.abs(on[1] - 0.5) < 0.012 && Math.abs(on[2] - 1.25) < 0.012);
  const calls = [], fake = { noteOn:(n, v, t) => calls.push(['on', n, t]), noteOff:(n, t) => calls.push(['off', n, t]) };
  const st = { bpm:120, metro:false, tracks:[{ id:'x', type:'inst', auto:[], clips:[{ start:0, len:4, offset:0, notes:[{ p:60, t:0, d:1, v:100 }, { p:62, t:3.5, d:1, v:100 }] }] }], returns:[], master:{} };
  const pend = [];
  for (let x = 0; x < 4;){ const x1 = Math.min(4, x + 0.37); scheduleRange({ tracks:{ x:{ inst:fake } } }, st, x, x1, x * 0.5, 0.5, x === 0, 4, pend, false); x = x1; }
  runNotes([], pend, Infinity);
  const offs = calls.filter(c => c[0] === 'off');
  check('scheduler: each note once, clipped at clip end', calls.filter(c => c[0] === 'on').length === 2 && offs.length === 2 && Math.abs(offs.find(o => o[1] === 62)[2] - 2) < 1e-9);
  check('WAV encoder size', wavBlob(newBuf(2, 10, 44100)).size === 84);
  let pk = 0;
  try {
    const buf = await renderMix(deep(S), 16, 18);
    for (let c = 0; c < 2; c++) for (const v of buf.getChannelData(c)) pk = Math.max(pk, Math.abs(v));
  } catch (e){ console.error(e); }
  check('offline render has signal', pk > 0.05);
  console.log('Ollie self-test:', ok.length, 'passed', bad.length ? 'FAILED: ' + bad.join(', ') : '');
  toast('Self-test: ' + ok.length + ' passed' + (bad.length ? ', failed: ' + bad.join(', ') : ''), bad.length ? 'err' : 'ok');
  window.__selftest = { ok, bad, peak:pk };
}

$('#bootBtn').addEventListener('click', async () => {
  const btn = $('#bootBtn'), note = $('#bootNote');
  btn.disabled = true; btn.textContent = 'Starting audio…';
  try {
    ctx = new AudioContext({ latencyHint:'interactive' });
    await ctx.resume();
    await ensureWorklet(ctx);
    btn.textContent = 'Rendering built-in sounds…';
    DEMO_IDS = await renderBuiltins();
    S = demoProject(DEMO_IDS);
    UI.clip = S.tracks.find(t => t.id === S.sel).clips[0].id;
    $('#app').hidden = false;
    wire();
    reloadAudio();
    renderAll();
    S.tracks.forEach(prewarmTrack);
    requestAnimationFrame(frame);
    initMidi();
    $('#boot').classList.add('gone');
    toast('Ready. Space plays the demo · drop in audio · plug in a MIDI keyboard', 'ok');
    if (/[?&]test\b/.test(location.search)) setTimeout(selfTest, 400);
  } catch (e){
    console.error(e);
    btn.textContent = 'Audio could not start';
    note.textContent = String(e.message || e);
  }
});
