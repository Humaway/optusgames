<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ollie Studio</title>
<meta name="description" content="Ollie Studio: a single-file browser DAW. Arrangement, piano roll, 40+ instruments, sampler and slicer, audio and MIDI recording, WAM 2 plugins." />
<style>
/* ============================================================================
   THEME. Optus teal and yellow on a dark studio desk.
   ========================================================================== */
:root{
  --bg0:#05080B; --bg1:#0A1016; --bg2:#0F171E; --bg3:#141F28; --bg4:#1B2833; --bg5:#233441;
  --line:#16212B; --line2:#223039; --line3:#2F4250;
  --text:#DCE9EE; --muted:#8AA1AB; --dim:#566B76;
  --teal:#00A3AD; --teal2:#2FD3DC; --tealD:#00737A; --tealBg:rgba(0,163,173,.16);
  --yel:#FFD100; --yelD:#C9A400; --yelBg:rgba(255,209,0,.13);
  --red:#FF4757; --green:#34D399;
  --font:"Inter","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --mono:"JetBrains Mono","Cascadia Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --hdrW:214px; --brW:230px; --dockH:340px;
}
*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; margin:0; }
body{ font:12px/1.35 var(--font); color:var(--text); background:var(--bg0); overflow:hidden;
  -webkit-font-smoothing:antialiased; user-select:none; -webkit-user-select:none; }
input,select,button,textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; }
.spacer{ flex:1 1 auto; }
[hidden]{ display:none !important; }
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-track{ background:var(--bg1); }
::-webkit-scrollbar-thumb{ background:var(--bg5); border:2px solid var(--bg1); border-radius:6px; }
::-webkit-scrollbar-thumb:hover{ background:var(--line3); }
::-webkit-scrollbar-corner{ background:var(--bg1); }
:focus-visible{ outline:2px solid var(--yel); outline-offset:1px; }

/* ---------------- boot ---------------- */
#boot{ position:fixed; inset:0; z-index:5000; display:grid; place-items:center;
  background:radial-gradient(900px 600px at 15% -10%, rgba(0,163,173,.25), transparent 60%),
             radial-gradient(700px 500px at 95% 5%, rgba(255,209,0,.10), transparent 60%), var(--bg0);
  transition:opacity .4s, visibility .4s; }
#boot.gone{ opacity:0; visibility:hidden; }
.boot-card{ width:min(480px,calc(100vw - 32px)); padding:38px 34px 30px; text-align:center; border-radius:22px;
  background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02)); border:1px solid rgba(255,255,255,.14);
  box-shadow:0 30px 70px rgba(0,0,0,.6); }
.mark{ width:72px; height:72px; margin:0 auto 18px; border-radius:50%; position:relative; display:grid; place-items:center;
  background:conic-gradient(from 210deg,var(--teal),var(--teal2),var(--yel),var(--teal)); animation:spin 9s linear infinite; }
.mark::after{ content:""; position:absolute; inset:7px; border-radius:50%; background:radial-gradient(circle at 32% 28%,#14202a,#080d12); }
.mark span{ position:relative; z-index:1; width:14px; height:14px; border-radius:50%; background:var(--yel); box-shadow:0 0 16px rgba(255,209,0,.8); }
@keyframes spin{ to{ transform:rotate(360deg); } }
.boot-card h1{ margin:0 0 6px; font-size:30px; font-weight:800; letter-spacing:-.02em; }
.boot-card h1 em{ font-style:normal; color:var(--teal2); }
.boot-card p{ margin:0 0 22px; color:var(--muted); font-size:13.5px; line-height:1.55; }
#bootBtn{ width:100%; padding:14px; font-size:15px; font-weight:700; color:#03181A; border:0; border-radius:12px;
  background:linear-gradient(135deg,var(--teal2),var(--teal) 55%,var(--tealD)); box-shadow:0 10px 26px rgba(0,163,173,.35); }
#bootBtn:disabled{ filter:grayscale(.6) brightness(.75); cursor:progress; }
#bootNote{ margin-top:12px; font-size:11.5px; color:var(--dim); min-height:15px; }

/* ---------------- shell ---------------- */
#app{ height:100vh; height:100dvh; display:grid; grid-template-columns:minmax(0,1fr);
  grid-template-rows:28px 48px minmax(0,1fr) 5px var(--dockH) 22px; }
.menubar{ display:flex; align-items:center; gap:2px; padding:0 8px; background:var(--bg1); border-bottom:1px solid var(--line); position:relative; z-index:900; }
.logo{ display:flex; align-items:center; gap:8px; padding-right:10px; margin-right:4px; border-right:1px solid var(--line2); height:18px; }
.logo i{ width:16px; height:16px; border-radius:50%; background:conic-gradient(from 210deg,var(--teal),var(--teal2),var(--yel),var(--teal)); display:grid; place-items:center; }
.logo i::after{ content:""; width:6px; height:6px; border-radius:50%; background:var(--bg0); }
.logo b{ font-weight:800; font-size:12.5px; letter-spacing:-.01em; }
.logo b em{ font-style:normal; color:var(--teal2); }
.mb{ position:relative; }
.mb > button{ background:none; border:0; color:var(--muted); padding:4px 9px; border-radius:4px; font-size:12px; }
.mb > button:hover,.mb.open > button{ background:var(--bg4); color:var(--text); }
.mdrop{ position:absolute; top:100%; left:0; margin-top:2px; min-width:250px; padding:4px; display:none; flex-direction:column;
  background:#101a22; border:1px solid var(--line3); border-radius:6px; box-shadow:0 16px 40px rgba(0,0,0,.6); }
.mb.open .mdrop{ display:flex; }
.mi{ display:flex; align-items:center; gap:10px; padding:6px 10px; border-radius:4px; background:none; border:0; text-align:left; color:var(--text); white-space:nowrap; }
.mi:hover{ background:var(--tealD); }
.mi .ck{ width:12px; color:var(--yel); }
.mi .sc{ margin-left:auto; padding-left:18px; font-family:var(--mono); font-size:10.5px; color:var(--dim); }
.mi:hover .sc{ color:#bfe9ec; }
.mi.dis{ opacity:.4; pointer-events:none; }
.msep{ height:1px; background:var(--line2); margin:4px 6px; }
.projname{ color:var(--dim); font-size:11.5px; margin-left:auto; padding-right:6px; }
.projname b{ color:var(--muted); font-weight:600; }

/* ---------------- transport ---------------- */
.transport{ display:flex; align-items:center; gap:8px; padding:0 10px; background:linear-gradient(180deg,var(--bg2),var(--bg1)); border-bottom:1px solid var(--line); overflow:hidden; }
.tg{ display:flex; align-items:center; gap:3px; padding:3px; border-radius:6px; background:var(--bg0); border:1px solid var(--line2); }
.tb{ height:28px; min-width:30px; padding:0 7px; display:grid; place-items:center; border-radius:4px; border:1px solid transparent; background:transparent; color:var(--muted); }
.tb:hover{ background:var(--bg4); color:var(--text); }
.tb svg{ width:14px; height:14px; fill:currentColor; }
.tb.txt{ font-size:10.5px; font-weight:700; letter-spacing:.06em; }
.tb.on{ background:var(--tealBg); color:var(--teal2); border-color:rgba(47,211,220,.35); }
.tb.play.on{ background:var(--teal); color:#021416; }
.tb.rec{ color:#c86a73; }
.tb.rec.on{ background:var(--red); color:#fff; animation:blink 1s steps(2) infinite; }
@keyframes blink{ 50%{ filter:brightness(1.35); } }
.lcd{ height:36px; display:flex; flex-direction:column; justify-content:center; padding:0 10px; border-radius:5px;
  background:#020405; border:1px solid var(--line2); box-shadow:inset 0 1px 6px rgba(0,0,0,.8); font-family:var(--mono); color:var(--yel); }
.lcd .big{ font-size:17px; font-weight:600; letter-spacing:.04em; line-height:1; text-shadow:0 0 10px rgba(255,209,0,.35); }
.lcd .sm{ font-size:10px; color:#a58a13; margin-top:2px; line-height:1; }
.lcd.bpm{ cursor:ns-resize; min-width:84px; }
.lcd.bpm input{ width:66px; background:none; border:0; outline:0; color:var(--yel); font:600 17px var(--mono); padding:0; cursor:ns-resize; }
.tlbl{ display:flex; align-items:center; gap:5px; color:var(--dim); font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
select.sel{ height:24px; padding:0 4px; border-radius:4px; background:var(--bg3); border:1px solid var(--line3); color:var(--text); font-size:11.5px; }
select.sel option{ background:var(--bg2); }
.kinfo{ font-family:var(--mono); font-size:10.5px; color:var(--muted); white-space:nowrap; }
.led{ width:8px; height:8px; border-radius:50%; background:#1a2a30; box-shadow:inset 0 0 2px #000; }
.led.on{ background:var(--yel); box-shadow:0 0 8px var(--yel); }
#masterMeter{ width:130px; height:18px; border-radius:3px; background:#020405; border:1px solid var(--line2); }

/* ---------------- main ---------------- */
.main{ display:grid; grid-template-columns:var(--brW) minmax(0,1fr); min-height:0; }
.main.nobrowser{ grid-template-columns:0 minmax(0,1fr); }
.main.nobrowser .browser{ display:none; }

/* browser */
.browser{ display:flex; flex-direction:column; min-height:0; background:var(--bg1); border-right:1px solid var(--line); }
.bsearch{ margin:8px; height:26px; padding:0 8px; border-radius:5px; background:var(--bg0); border:1px solid var(--line2); outline:0; }
.bsearch:focus{ border-color:var(--teal); }
.btree{ flex:1 1 auto; overflow:auto; padding:0 4px 8px; }
.bcat{ display:flex; align-items:center; gap:6px; padding:5px 6px; font-weight:700; color:var(--muted); border-radius:4px; cursor:pointer; font-size:11px; letter-spacing:.06em; text-transform:uppercase; }
.bcat:hover{ color:var(--text); background:var(--bg3); }
.bcat .tw{ width:10px; transition:transform .12s; color:var(--dim); }
.bcat.open .tw{ transform:rotate(90deg); }
.bcat .n{ margin-left:auto; font-weight:500; color:var(--dim); letter-spacing:0; font-family:var(--mono); font-size:10px; }
.bsub{ padding:4px 6px 2px 22px; font-size:10px; font-weight:700; color:var(--dim); letter-spacing:.1em; text-transform:uppercase; }
.bi{ display:flex; align-items:center; gap:7px; padding:3px 6px 3px 22px; border-radius:4px; cursor:grab; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#c2d3d9; }
.bi:hover{ background:var(--bg3); color:var(--text); }
.bi.sel{ background:var(--tealD); color:#fff; }
.bi i{ width:7px; height:7px; border-radius:2px; flex:none; }
.bi .x{ margin-left:auto; color:var(--dim); font-size:10px; font-family:var(--mono); }
.bfoot{ display:flex; gap:4px; padding:6px; border-top:1px solid var(--line); }
.btn{ height:24px; padding:0 9px; border-radius:4px; background:var(--bg3); border:1px solid var(--line3); color:var(--text); font-size:11.5px; white-space:nowrap; display:inline-flex; align-items:center; gap:5px; }
.btn:hover{ background:var(--bg5); }
.btn.pri{ background:var(--teal); color:#021416; border-color:transparent; font-weight:700; }
.btn.pri:hover{ background:var(--teal2); }
.btn.y{ background:var(--yel); color:#1d1700; border-color:transparent; font-weight:700; }
.btn.danger:hover{ background:#4a1d22; border-color:#7a2a33; }
.btn.on{ background:var(--tealBg); border-color:var(--teal); color:var(--teal2); }
.btn.rec.on{ background:var(--red); color:#fff; border-color:transparent; }
.btn.sm{ height:20px; padding:0 6px; font-size:10.5px; }

/* arrangement */
.arr{ position:relative; min-width:0; min-height:0; display:flex; flex-direction:column; background:var(--bg0); }
.arr-scroll{ flex:1 1 auto; overflow:auto; position:relative; }
.arr-inner{ position:relative; min-height:100%; }
.arr-top{ position:sticky; top:0; z-index:6; display:flex; height:40px; background:var(--bg1); border-bottom:1px solid var(--line2); }
.corner{ position:sticky; left:0; z-index:7; width:var(--hdrW); flex:none; display:flex; align-items:center; gap:4px; padding:0 6px;
  background:var(--bg1); border-right:1px solid var(--line2); }
.timeline{ position:relative; flex:none; }
.loopbar{ position:absolute; left:0; right:0; top:0; height:14px; cursor:crosshair; background:#070c10; border-bottom:1px solid var(--line); }
.brace{ position:absolute; top:1px; bottom:1px; border-radius:2px; background:rgba(255,209,0,.55); border:1px solid var(--yel); cursor:grab; }
.brace.off{ background:rgba(140,160,170,.25); border-color:rgba(160,180,190,.5); }
.brace .h{ position:absolute; top:0; bottom:0; width:7px; cursor:ew-resize; }
.brace .h.l{ left:-3px; } .brace .h.r{ right:-3px; }
.ruler{ position:absolute; left:0; right:0; top:14px; bottom:0; cursor:text; overflow:hidden; }
.ruler span{ position:absolute; top:2px; font-family:var(--mono); font-size:10px; color:var(--dim); padding-left:3px; border-left:1px solid var(--line3); height:22px; pointer-events:none; }
.ruler span.q{ color:var(--muted); }
.posmark{ position:absolute; top:14px; width:0; height:26px; pointer-events:none; }
.posmark::before{ content:""; position:absolute; left:-5px; top:0; border:5px solid transparent; border-top:7px solid var(--teal2); }
.trow{ display:flex; position:relative; }
.thead{ position:sticky; left:0; z-index:4; width:var(--hdrW); flex:none; display:grid; grid-template-columns:4px 1fr auto;
  background:var(--bg2); border-bottom:1px solid var(--line); border-right:1px solid var(--line2); cursor:pointer; }
.thead.sel{ background:#15242d; }
.thead .cbar{ background:var(--tc); }
.thead .tmain{ min-width:0; padding:5px 6px 4px 8px; display:flex; flex-direction:column; gap:4px; }
.thead .tname{ font-weight:700; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.thead .tname input{ width:100%; font-weight:700; background:var(--bg0); border:1px solid var(--teal); border-radius:3px; padding:0 3px; outline:0; }
.thead .tinst{ font-size:10.5px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:-3px; }
.thead.sel .tinst{ color:var(--teal2); }
.tbtns{ display:flex; gap:3px; align-items:center; }
.tbtns input[type=range]{ flex:1 1 auto; min-width:30px; }
.mbtn{ width:19px; height:17px; padding:0; border-radius:3px; font-size:9.5px; font-weight:800; background:var(--bg4); border:1px solid var(--line3); color:var(--muted); display:grid; place-items:center; }
.mbtn:hover{ color:var(--text); }
.mbtn.mute.on{ background:#8a6a00; color:#fff3c0; border-color:transparent; }
.mbtn.mute.on{ background:var(--yel); color:#221a00; }
.mbtn.solo.on{ background:var(--teal2); color:#021416; border-color:transparent; }
.mbtn.arm.on{ background:var(--red); color:#fff; border-color:transparent; }
.mbtn.mon.on{ background:#6b8bff; color:#fff; border-color:transparent; }
.mbtn.aut.on{ background:var(--bg5); color:var(--yel); border-color:var(--yelD); }
.tmeter{ width:6px; margin:5px 5px 5px 0; background:#020405; border-radius:2px; position:relative; overflow:hidden; }
.tmeter i{ position:absolute; left:0; right:0; bottom:0; height:0; background:linear-gradient(0deg,var(--teal) 0%,var(--teal2) 65%,var(--yel) 88%,var(--red) 100%); background-size:100% var(--mh,60px); background-position:bottom; }
.lane{ position:relative; flex:none; border-bottom:1px solid var(--line); background-color:#0b1116; }
.lane.audio{ background-color:#0a0f13; }
.trow.dim .lane{ opacity:.55; }
.clip{ position:absolute; top:2px; bottom:2px; border-radius:4px; overflow:hidden; cursor:grab;
  background:color-mix(in srgb, var(--cc) 28%, #0a1116); border:1px solid color-mix(in srgb, var(--cc) 70%, #000); }
.clip.sel{ border-color:#fff; box-shadow:0 0 0 1px #fff; z-index:2; }
.clip .chead{ height:15px; padding:0 5px; font-size:10.5px; font-weight:700; line-height:15px; color:#071014; background:var(--cc); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.clip canvas{ position:absolute; left:0; top:15px; width:100%; height:calc(100% - 15px); }
.clip .edge{ position:absolute; top:0; bottom:0; width:7px; cursor:ew-resize; z-index:3; }
.clip .edge.l{ left:0; } .clip .edge.r{ right:0; }
.clip.drag{ opacity:.8; z-index:5; }
.clip.ghost{ opacity:.4; pointer-events:none; }
.loopshade{ position:absolute; top:0; bottom:0; background:rgba(255,209,0,.035); border-left:1px solid rgba(255,209,0,.25); border-right:1px solid rgba(255,209,0,.25); pointer-events:none; z-index:1; }
.phead{ position:absolute; top:0; bottom:0; width:0; z-index:5; pointer-events:none; }
.phead::before{ content:""; position:absolute; top:0; bottom:0; left:-1px; width:2px; background:var(--yel); box-shadow:0 0 8px rgba(255,209,0,.6); }
.phead.stopped::before{ background:var(--teal2); box-shadow:none; opacity:.7; }
.arow .thead{ grid-template-columns:4px 1fr; background:var(--bg1); cursor:default; }
.arow .thead .tmain{ justify-content:center; }
.arow .lane{ background:#070b0e; }
.arow svg{ position:absolute; inset:0; overflow:visible; }
.arow .aline{ fill:none; stroke:var(--yel); stroke-width:1.5; }
.arow .afill{ fill:rgba(255,209,0,.08); }
.arow .aflat{ stroke:var(--dim); stroke-dasharray:4 4; }
.arow circle{ fill:var(--bg0); stroke:var(--yel); stroke-width:1.5; cursor:grab; }
.arow circle:hover{ fill:var(--yel); }
.dropzone{ display:flex; }
.dropzone .thead{ background:transparent; border:0; cursor:default; }
.dropzone .lane{ height:90px; border:0; background:transparent; display:flex; align-items:center; padding-left:18px; color:var(--dim); font-size:11.5px; }
.dropzone.over .lane,.lane.over{ background:rgba(0,163,173,.12) !important; outline:1px dashed var(--teal); outline-offset:-3px; }

/* splitter & dock */
.splitter{ background:var(--bg1); border-top:1px solid var(--line); border-bottom:1px solid var(--line); cursor:row-resize; }
.splitter:hover{ background:var(--tealD); }
.dock{ display:flex; flex-direction:column; min-height:0; background:var(--bg1); }
.dtabs{ display:flex; align-items:center; gap:2px; padding:0 6px; height:30px; flex:none; border-bottom:1px solid var(--line2); background:var(--bg1); }
.dtab{ height:22px; padding:0 12px; border-radius:4px; border:0; background:none; color:var(--muted); font-weight:600; }
.dtab:hover{ color:var(--text); background:var(--bg3); }
.dtab.on{ background:var(--teal); color:#021416; }
.dtitle{ font-size:11.5px; color:var(--muted); display:flex; align-items:center; gap:6px; }
.dtitle i{ width:9px; height:9px; border-radius:2px; }
.dpane{ flex:1 1 auto; min-height:0; display:none; }
.dpane.on{ display:flex; flex-direction:column; }
.empty{ margin:auto; color:var(--dim); text-align:center; font-size:12.5px; line-height:1.6; padding:20px; }

/* piano roll */
.prbar{ display:flex; align-items:center; gap:6px; padding:5px 8px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
.prbar .lbl{ color:var(--dim); font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; }
.prwrap{ flex:1 1 auto; position:relative; min-height:0; }
.prwrap canvas{ position:absolute; inset:0; width:100%; height:100%; cursor:crosshair; }

/* devices */
.dvhead{ display:flex; align-items:center; gap:8px; padding:5px 8px; border-bottom:1px solid var(--line); }
.chain{ flex:1 1 auto; display:flex; gap:6px; padding:8px; overflow-x:auto; overflow-y:hidden; min-height:0; align-items:stretch; }
.dev{ flex:none; display:flex; flex-direction:column; min-width:120px; border-radius:6px; background:var(--bg2); border:1px solid var(--line2); overflow:hidden; }
.dev.off{ opacity:.55; }
.dev.inst{ border-color:rgba(0,163,173,.45); }
.dev.drag-over{ outline:2px solid var(--yel); }
.devbar{ display:flex; align-items:center; gap:6px; height:22px; padding:0 4px 0 6px; background:var(--bg4); border-bottom:1px solid var(--line2); cursor:grab; }
.dev.inst .devbar{ background:linear-gradient(90deg,rgba(0,163,173,.4),var(--bg4)); }
.devbar b{ font-size:11.5px; white-space:nowrap; }
.devbar .pwr{ width:12px; height:12px; border-radius:50%; border:0; padding:0; background:var(--yel); box-shadow:0 0 6px rgba(255,209,0,.6); }
.dev.off .pwr{ background:#3b4a53; box-shadow:none; }
.devbar .x{ width:16px; height:16px; padding:0; border:0; background:none; color:var(--dim); border-radius:3px; }
.devbar .x:hover{ color:var(--text); background:var(--bg5); }
.devbar select{ height:18px; font-size:10.5px; max-width:150px; }
.devbody{ flex:1 1 auto; display:flex; gap:10px; padding:6px 8px 8px; overflow:auto; }
.dsec{ display:flex; flex-direction:column; gap:3px; }
.dsec h5{ margin:0 0 2px; font-size:9.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--dim); white-space:nowrap; }
.kgrid{ display:grid; grid-auto-flow:column; grid-template-rows:repeat(2,auto); gap:2px 4px; }
.kgrid.r3{ grid-template-rows:repeat(3,auto); }
.dadd{ flex:none; width:150px; border:1px dashed var(--line3); border-radius:6px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; color:var(--dim); text-align:center; padding:10px; }
.dadd.over{ border-color:var(--teal); background:var(--tealBg); color:var(--teal2); }
.knob{ width:50px; display:flex; flex-direction:column; align-items:center; cursor:ns-resize; border-radius:5px; padding:1px 0; touch-action:none; }
.knob:hover{ background:rgba(255,255,255,.04); }
.knob svg{ width:32px; height:32px; }
.knob .kt{ fill:none; stroke:#26343f; stroke-width:3.5; stroke-linecap:round; }
.knob .kv{ fill:none; stroke:var(--teal2); stroke-width:3.5; stroke-linecap:round; }
.knob.y .kv{ stroke:var(--yel); }
.knob .kb{ fill:#0c151c; stroke:#34485a; }
.knob .kp{ stroke:#fff; stroke-width:2; stroke-linecap:round; }
.knob .kval{ font-family:var(--mono); font-size:9.5px; color:var(--yel); white-space:nowrap; line-height:1.2; }
.knob .klbl{ font-size:9.5px; color:var(--muted); white-space:nowrap; max-width:52px; overflow:hidden; text-overflow:ellipsis; line-height:1.2; }
.knob.learn{ outline:1px solid var(--yel); animation:blink .6s steps(2) infinite; }
.knob.mapped .klbl{ color:var(--yel); }
.ctlsel{ display:flex; flex-direction:column; gap:1px; min-width:74px; }
.ctlsel span{ font-size:9.5px; color:var(--muted); }
.ctlsel select{ height:20px; font-size:10.5px; padding:0 2px; }
.ctltog{ height:20px; margin-top:12px; font-size:10.5px; }
.viz{ background:#04080a; border:1px solid var(--line2); border-radius:4px; display:block; }
.drawbars{ display:flex; gap:4px; padding-top:2px; }
.dbar{ width:18px; height:112px; border-radius:3px; background:#04080a; border:1px solid var(--line2); position:relative; cursor:ns-resize; touch-action:none; }
.dbar i{ position:absolute; left:2px; right:2px; top:2px; border-radius:2px; background:var(--dc,#ddd); }
.dbar b{ position:absolute; bottom:-14px; left:0; right:0; text-align:center; font:9px var(--mono); color:var(--muted); }
.pads{ display:grid; grid-template-columns:repeat(4,62px); gap:3px; }
.pad{ height:30px; border-radius:4px; background:linear-gradient(160deg,#1f2d38,#141e26); border:1px solid var(--line3); font-size:9.5px; font-weight:700; color:var(--muted); padding:3px; text-align:left; display:flex; flex-direction:column; justify-content:space-between; touch-action:none; }
.pad small{ font-family:var(--mono); font-weight:400; color:var(--dim); }
.pad:hover{ border-color:var(--teal); color:var(--text); }
.pad.hit{ background:var(--teal); color:#021416; }
.wavebox{ position:relative; }
.wavebox canvas{ display:block; cursor:crosshair; }
.kbd{ flex:none; height:58px; position:relative; border-top:1px solid var(--line2); background:#020405; overflow:hidden; touch-action:none; }
.kbd .w,.kbd .b{ position:absolute; top:0; border-radius:0 0 3px 3px; }
.kbd .w{ height:100%; background:linear-gradient(180deg,#cfdade,#f2f7f8); border:1px solid #6d7e86; }
.kbd .b{ height:60%; background:linear-gradient(180deg,#141c22,#2b3943); border:1px solid #000; z-index:1; }
.kbd .w.on{ background:linear-gradient(180deg,#7fe8ee,var(--teal2)); }
.kbd .b.on{ background:linear-gradient(180deg,var(--tealD),var(--teal)); }
.kbd .w.kz{ box-shadow:inset 0 -4px 0 var(--yel); }
.kbd .w span{ position:absolute; bottom:2px; left:0; right:0; text-align:center; font:9px var(--mono); color:#5d6e75; }

/* mixer */
.mixer{ flex:1 1 auto; display:flex; gap:3px; padding:6px; overflow:auto; min-height:0; }
.strip{ flex:none; width:86px; display:flex; flex-direction:column; align-items:center; gap:4px; padding:5px 4px; border-radius:5px; background:var(--bg2); border:1px solid var(--line2); }
.strip.sel{ border-color:var(--teal); background:#12212a; }
.strip > *:not(.fz){ flex:none; }
.strip.ret{ background:#11181f; }
.strip.master{ background:linear-gradient(180deg,rgba(255,209,0,.08),var(--bg2)); border-color:rgba(255,209,0,.35); width:96px; }
.strip .sname{ width:100%; font-weight:700; font-size:11px; text-align:center; padding:2px 3px; border-radius:3px; background:var(--tc,var(--bg4)); color:#061014; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; }
.strip .ins{ width:100%; display:flex; flex-direction:column; gap:1px; min-height:44px; }
.strip .ins div{ font-size:9.5px; padding:1px 4px; border-radius:2px; background:var(--bg0); color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; }
.strip .ins div.off{ opacity:.45; text-decoration:line-through; }
.strip .knob{ width:40px; }
.strip .knob svg{ width:26px; height:26px; }
.sends{ display:flex; }
.fz{ flex:1 1 auto; display:flex; gap:4px; min-height:80px; width:100%; justify-content:center; }
.fader{ position:relative; width:22px; cursor:ns-resize; touch-action:none; }
.fader .ft{ position:absolute; left:9px; width:4px; top:6px; bottom:6px; border-radius:2px; background:#020405; }
.fader .fc{ position:absolute; left:1px; width:20px; height:12px; margin-top:-6px; border-radius:2px; background:linear-gradient(180deg,#dfe8eb,#8a9ba2); box-shadow:0 2px 4px rgba(0,0,0,.6); }
.fader .fc::after{ content:""; position:absolute; left:2px; right:2px; top:5px; height:2px; background:#1c252a; }
.fader .f0{ position:absolute; left:0; right:0; height:1px; background:var(--dim); }
canvas.smeter{ width:14px; border-radius:2px; background:#020405; }
.sdb{ font-family:var(--mono); font-size:10px; color:var(--yel); }
.sbtn{ display:flex; gap:3px; }

/* sample editor */
.sebar{ display:flex; align-items:center; gap:6px; padding:5px 8px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
.sewrap{ flex:1 1 auto; position:relative; min-height:0; }
.sewrap canvas{ position:absolute; inset:0; width:100%; height:100%; cursor:text; }

/* status */
.status{ display:flex; align-items:center; gap:10px; padding:0 10px; background:var(--bg1); border-top:1px solid var(--line); color:var(--dim); font-size:11px; white-space:nowrap; overflow:hidden; }
#tip{ overflow:hidden; text-overflow:ellipsis; color:var(--muted); }
#stat{ font-family:var(--mono); font-size:10.5px; }

/* menus, modals, toasts */
.ctx{ position:fixed; z-index:3000; min-width:190px; padding:4px; display:flex; flex-direction:column;
  background:#101a22; border:1px solid var(--line3); border-radius:6px; box-shadow:0 16px 40px rgba(0,0,0,.6); }
.modal-bg{ position:fixed; inset:0; z-index:2500; display:grid; place-items:center; background:rgba(2,5,7,.66); backdrop-filter:blur(4px); }
.modal{ width:min(560px,calc(100vw - 32px)); max-height:calc(100vh - 60px); display:flex; flex-direction:column; border-radius:10px; background:var(--bg2); border:1px solid var(--line3); box-shadow:0 30px 70px rgba(0,0,0,.7); }
.modal h3{ margin:0; padding:12px 16px; font-size:14px; border-bottom:1px solid var(--line2); display:flex; align-items:center; }
.modal h3 button{ margin-left:auto; }
.modal .mbody{ padding:14px 16px; overflow:auto; line-height:1.55; color:#c6d6dc; }
.modal .mbody p{ margin:0 0 10px; }
.modal .mfoot{ padding:10px 16px; border-top:1px solid var(--line2); display:flex; gap:6px; justify-content:flex-end; }
.modal input[type=text],.modal input[type=url],.modal input[type=number]{ width:100%; height:28px; padding:0 8px; border-radius:4px; background:var(--bg0); border:1px solid var(--line3); outline:0; }
.modal input:focus{ border-color:var(--teal); }
.modal table{ width:100%; border-collapse:collapse; }
.modal td{ padding:4px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
.modal td:first-child{ font-family:var(--mono); color:var(--yel); white-space:nowrap; width:1%; }
.modal .row{ display:flex; gap:8px; align-items:center; margin-bottom:10px; }
.modal .row > label{ width:150px; flex:none; color:var(--muted); }
.plist{ max-height:260px; overflow:auto; border:1px solid var(--line2); border-radius:5px; }
.plist div{ padding:5px 8px; border-bottom:1px solid var(--line); display:flex; gap:8px; align-items:center; }
.plist div:hover{ background:var(--bg3); }
.plist small{ color:var(--dim); }
.wamwin{ position:fixed; z-index:2000; background:var(--bg2); border:1px solid var(--line3); border-radius:8px; box-shadow:0 24px 60px rgba(0,0,0,.7); display:flex; flex-direction:column; max-width:calc(100vw - 20px); max-height:calc(100vh - 20px); }
.wamwin .wbar{ display:flex; align-items:center; gap:8px; padding:6px 8px; background:var(--bg4); border-radius:8px 8px 0 0; cursor:grab; }
.wamwin .wbody{ overflow:auto; background:#000; }
#toasts{ position:fixed; z-index:4000; left:50%; bottom:34px; transform:translateX(-50%); display:flex; flex-direction:column; gap:6px; align-items:center; pointer-events:none; }
.toast{ padding:8px 14px; border-radius:6px; font-weight:600; background:#0f1a21; border:1px solid var(--line3); box-shadow:0 10px 30px rgba(0,0,0,.6); animation:pop .25s ease both; }
.toast.ok{ border-color:var(--teal); color:var(--teal2); }
.toast.warn{ border-color:var(--yelD); color:var(--yel); }
.toast.err{ border-color:#a83340; color:#ff9aa5; }
@keyframes pop{ from{ opacity:0; transform:translateY(8px); } }
.dragghost{ position:fixed; z-index:4500; pointer-events:none; padding:4px 8px; border-radius:4px; background:var(--teal); color:#021416; font-weight:700; }
@media (prefers-reduced-motion:reduce){ *{ animation-duration:.01ms !important; transition-duration:.01ms !important; } }
@media (max-width:1180px){ #tTap, #kInfo { display:none; } }
@media (max-width:1020px){ #midiInfo { display:none; } #masterMeter{ width:90px; } }
@media (max-width:900px){ :root{ --brW:180px; --hdrW:170px; } .transport{ overflow-x:auto; } }
</style>

<body>

<div id="boot">
  <div class="boot-card">
    <div class="mark"><span></span></div>
    <h1>Ollie <em>Studio</em></h1>
    <p>Arrangement and piano roll, 40+ built-in instruments, a sampler and slicer, audio and MIDI recording, controller support and WAM&nbsp;2 plugins. One browser tab.</p>
    <button id="bootBtn">Start Ollie Studio</button>
    <div id="bootNote">Audio starts on your click. That's a browser rule.</div>
  </div>
</div>

<div id="app" hidden>
  <header class="menubar" id="menubar">
    <div class="logo"><i></i><b>Ollie <em>Studio</em></b></div>
    <div id="menus" style="display:flex;gap:1px"></div>
    <div class="projname" id="projName"></div>
  </header>

  <div class="transport">
    <div class="tg">
      <button class="tb" id="tHome" data-tip="Go to start (Home). Stop twice also returns to the start."><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM9.5 12 19 5v14z"/></svg></button>
      <button class="tb play" id="tPlay" data-tip="Play or stop (Space). Shift+Space continues from where you stopped."><svg viewBox="0 0 24 24"><path d="M7 4.5v15L19.5 12z"/></svg></button>
      <button class="tb" id="tStop" data-tip="Stop. Press again to return to the start."><svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg></button>
      <button class="tb rec" id="tRec" data-tip="Record (F9). Audio goes to armed audio tracks, MIDI to the selected armed instrument track."><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6.5"/></svg></button>
    </div>
    <div class="tg">
      <button class="tb" id="tLoop" data-tip="Loop the yellow brace (Ctrl+Shift+L). Ctrl+L loops the selected clips."><svg viewBox="0 0 24 24"><path d="M7 7h9.2l-2-2L15.6 3.6 20 8l-4.4 4.4-1.4-1.4 2-2H7a3 3 0 0 0-3 3v1H2v-1a5 5 0 0 1 5-5zm10 10H7.8l2 2-1.4 1.4L4 16l4.4-4.4 1.4 1.4-2 2H17a3 3 0 0 0 3-3v-1h2v1a5 5 0 0 1-5 5z"/></svg></button>
      <button class="tb" id="tMetro" data-tip="Metronome click"><svg viewBox="0 0 24 24"><path d="M10 2h4l5 20H5zm1.5 2-1 4h3l-1-4zM9.9 10 7.6 20h8.8l-1-4.1-3.3-3.3 1.4-1.4 1.1 1.1-.5-2.3z"/></svg></button>
      <button class="tb" id="tFollow" data-tip="Follow the playhead"><svg viewBox="0 0 24 24"><path d="M3 5h2v14H3zm6 7 8-6v4h4v4h-4v4z"/></svg></button>
    </div>
    <div class="lcd" data-tip="Position: bars . beats . sixteenths, and elapsed time"><div class="big" id="lcdPos">1. 1. 1</div><div class="sm" id="lcdTime">0:00.000</div></div>
    <div class="lcd bpm" data-tip="Tempo. Drag up or down, scroll, or type a value."><input id="bpm" value="120.00" aria-label="Tempo" /><div class="sm">BPM · 4/4</div></div>
    <button class="tb txt" id="tTap" data-tip="Tap tempo">TAP</button>
    <label class="tlbl" data-tip="Grid snap for clips, notes and automation">Snap
      <select class="sel" id="snap">
        <option value="4">Bar</option><option value="2">1/2</option><option value="1">1/4</option><option value="0.5">1/8</option>
        <option value="0.25" selected>1/16</option><option value="0.125">1/32</option><option value="0.3333333">1/8T</option><option value="0.1666667">1/16T</option><option value="0">Off</option>
      </select>
    </label>
    <div class="spacer"></div>
    <button class="tb txt" id="tKeys" data-tip="Computer MIDI keyboard (M). A–L play notes, W E T Y U O P the sharps, Z/X octave, C/V velocity.">⌨ KEYS</button>
    <span class="kinfo" id="kInfo">C3 · vel 100</span>
    <div class="led" id="midiLed"></div><span class="kinfo" id="midiInfo" data-tip="MIDI input. Plug in a controller: every input plays the selected track.">MIDI</span>
    <canvas id="masterMeter" width="130" height="18" data-tip="Master output level"></canvas>
  </div>

  <div class="main" id="main">
    <aside class="browser" id="browser">
      <input class="bsearch" id="bsearch" placeholder="Search instruments, effects, samples…" aria-label="Search the browser" />
      <div class="btree" id="btree"></div>
      <div class="bfoot">
        <button class="btn" id="bImpAudio" data-tip="Import audio files into Samples (you can also drop them anywhere)">+ Audio</button>
        <button class="btn" id="bImpMidi" data-tip="Import a MIDI file as new instrument tracks">+ MIDI</button>
        <button class="btn" id="bPlugin" data-tip="Load a WAM 2 plugin from a URL">+ Plugin</button>
      </div>

    <section class="arr" id="arr">
      <div class="arr-scroll" id="arrScroll"><div class="arr-inner" id="arrInner"></div></div>
    </section>
  </div>

  <div class="splitter" id="splitter" data-tip="Drag to resize the editor panel"></div>

  <section class="dock" id="dock">
    <nav class="dtabs">
      <button class="dtab on" data-tab="roll">Piano Roll</button>
      <button class="dtab" data-tab="dev">Devices</button>
      <button class="dtab" data-tab="mix">Mixer</button>
      <button class="dtab" data-tab="smp">Sample Editor</button>
      <span class="spacer"></span>
      <span class="dtitle" id="dockTitle"></span>
    </nav>
    <div class="dpane on" id="pane-roll"></div>
    <div class="dpane" id="pane-dev"></div>
    <div class="dpane" id="pane-mix"></div>
    <div class="dpane" id="pane-smp"></div>
  </section>

  <footer class="status"><span id="tip">Ready</span><span class="spacer"></span><span id="stat"></span></footer>
</div>

<div id="toasts" aria-live="polite"></div>
<input type="file" id="fileIn" hidden multiple />
<script>
'use strict';
/* ============================================================================
   OLLIE STUDIO 4
   Raw Web Audio, no libraries.
   STATE   S is the whole project as plain JSON, so undo is a JSON snapshot.
           Audio buffers live outside S in BUF and are referenced by id.
   AUDIO   G is the live node graph built from S. buildGraph() runs the same
           code on an OfflineAudioContext for export.
   TIME    Timeline positions and lengths are in beats. Audio clip offsets are
           in seconds, because audio isn't time-stretched.
   ========================================================================== */

/* ------------------------------------------------------------------ helpers */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
function h(tag, a, ...kids){
  const n = document.createElement(tag);
  if (a) for (const k in a){
    const v = a[k];
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'style') n.style.cssText = v;
    else if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2).toLowerCase(), v);
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat(9)) if (k != null && k !== false) n.append(k.nodeType ? k : String(k));
  return n;
}
const SVGNS = 'http://www.w3.org/2000/svg';
function sv(tag, a){ const n = document.createElementNS(SVGNS, tag); for (const k in a) n.setAttribute(k, a[k]); return n; }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const uid = p => p + Math.random().toString(36).slice(2, 9);
const deep = o => JSON.parse(JSON.stringify(o));
const mtof = n => 440 * Math.pow(2, (n - 69) / 12);
const db2g = db => db <= -69.9 ? 0 : Math.pow(10, db / 20);
const NOTES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const nname = n => NOTES[((n % 12) + 12) % 12] + (Math.floor(n / 12) - 2);   // C3 = 60, like Ableton/Logic
const isBlack = n => [1, 3, 6, 8, 10].includes(((n % 12) + 12) % 12);
const TRACK_COLORS = ['#00A3AD','#FFD100','#2FD3DC','#FF8A3D','#7FE3C4','#B48CFF','#FF6B8B','#5BA8FF','#C9E265','#E0B800','#46C7CF','#FF9EC7'];
let dirty = false;

/* ------------------------------------------------------------- param specs
   N number, C choice, B bool. The same spec drives knobs, automation, MIDI
   learn and presets. c:'exp' = log taper, u = unit, st = step, sec = panel section. */
const N = (k, l, min, max, def, o = {}) => ({ k, l, min, max, def, t:'n', ...o });
const C = (k, l, opts, def, o = {}) => ({ k, l, opts, def, t:'c', ...o });
const B = (k, l, def, o = {}) => ({ k, l, def, t:'b', ...o });
const faderToDb = x => x <= 0.056 ? -70 : 6 + 60 * Math.log10(x);      // fader law: 0 dB sits at ~80% travel
const dbToFader = db => db <= -69.9 ? 0 : clamp(Math.pow(10, (db - 6) / 60), 0, 1);
function toNorm(s, v){
  if (s.c === 'fader') return dbToFader(v);
  if (s.t === 'b') return v ? 1 : 0;
  if (s.t === 'c') return Math.max(0, s.opts.indexOf(v)) / Math.max(1, s.opts.length - 1);
  return clamp(s.c === 'exp' ? Math.log(v / s.min) / Math.log(s.max / s.min) : (v - s.min) / (s.max - s.min), 0, 1);
}
function fromNorm(s, x){
  x = clamp(x, 0, 1);
  if (s.t === 'b') return x >= 0.5;
  if (s.t === 'c') return s.opts[Math.round(x * (s.opts.length - 1))];
  if (s.c === 'fader') return faderToDb(x);
  let v = s.c === 'exp' ? s.min * Math.pow(s.max / s.min, x) : s.min + x * (s.max - s.min);
  if (s.st) v = Math.round(v / s.st) * s.st;
  return clamp(v, s.min, s.max);
}
function fmtVal(s, v){
  if (s.f) return s.f(v);
  if (s.t === 'b') return v ? 'On' : 'Off';
  if (s.t === 'c') return String(v);
  const u = s.u || '';
  if (u === 'Hz') return v >= 1000 ? (v / 1000).toFixed(v >= 10000 ? 1 : 2) + 'k' : Math.round(v) + ' Hz';
  if (u === 's') return v < 1 ? Math.round(v * 1000) + ' ms' : v.toFixed(2) + ' s';
  if (u === '%') return Math.round(v * 100) + '%';
  if (u === 'dB') return v <= -69.9 ? '-∞' : (v > 0 ? '+' : '') + v.toFixed(1) + ' dB';
  if (u === 'st') return (v > 0 ? '+' : '') + Math.round(v) + ' st';
  if (u === 'ct') return Math.round(v) + ' ct';
  if (u === 'oct') return (v > 0 ? '+' : '') + v.toFixed(1) + ' oct';
  if (s.st >= 1) return String(Math.round(v)) + (u ? ' ' + u : '');
  return v.toFixed(2) + (u ? ' ' + u : '');
}
const defaults = specs => Object.fromEntries(specs.map(s => [s.k, s.def]));
const specOf = (specs, k) => specs.find(s => s.k === k);

/* ------------------------------------------------------------------ buffers */
const BUF = new Map();          // id -> { buf, name, origin, peaks, rev }
function computePeaks(buf, bucket = 256){
  const n = Math.ceil(buf.length / bucket), pk = new Float32Array(n * 2), chs = [];
  for (let c = 0; c < buf.numberOfChannels; c++) chs.push(buf.getChannelData(c));
  for (let i = 0; i < n; i++){
    let mn = 0, mx = 0;
    const e = Math.min(buf.length, (i + 1) * bucket);
    for (const d of chs) for (let j = i * bucket; j < e; j++){ const v = d[j]; if (v < mn) mn = v; else if (v > mx) mx = v; }
    pk[i * 2] = mn; pk[i * 2 + 1] = mx;
  }
  return pk;
}
function addBuffer(buf, name, origin = 'user', id){
  id = id || uid('b');
  BUF.set(id, { buf, name, origin, peaks:computePeaks(buf) });
  return id;
}
function newBuf(ch, len, sr){ return new AudioBuffer({ numberOfChannels:ch, length:Math.max(1, len), sampleRate:sr }); }
function bufMap(b, fn){
  const out = newBuf(b.numberOfChannels, b.length, b.sampleRate);
  for (let c = 0; c < b.numberOfChannels; c++){ const d = new Float32Array(b.getChannelData(c)); fn(d, c); out.copyToChannel(d, c); }
  return out;
}
const reverseBuf = b => bufMap(b, d => d.reverse());
function normalizeBuf(b){
  let pk = 0;
  for (let c = 0; c < b.numberOfChannels; c++) for (const v of b.getChannelData(c)) pk = Math.max(pk, Math.abs(v));
  const g = pk > 0 ? 0.98 / pk : 1;
  return bufMap(b, d => { for (let i = 0; i < d.length; i++) d[i] *= g; });
}
function sliceBuf(b, s0, s1){

function samplerVoice(c, dest, n, v, amp, t, p){
  const E = BUF.get(p.buf);

  const buf = p.rev ? (E.rev || (E.rev = reverseBuf(E.buf))) : E.buf, dur = buf.duration;
  const s0 = clamp(p.start, 0, 0.999) * dur, s1 = Math.max(s0 + 0.002, clamp(p.end, 0, 1) * dur);

  const rate = Math.pow(2, (n - p.root + p.tune) / 12); s.playbackRate.value = rate;
  if (p.loop){ s.loop = true; s.loopStart = s0; s.loopEnd = s1; }
  const cut0 = p.cut, fl = biq(c, 'lowpass', clamp(cut0 * Math.pow(2, (p.velCut ?? 0.3) * (v - 1) * 3), 30, 19000), p.res);
  const g = gainN(c, 0);

  const env = envAttack(g.gain, t, p.a, p.d, p.s, amp);
  if (p.loop) s.start(t, s0); else s.start(t, s0, s1 - s0);

  return vo;
}

/* Render the cache for pitches a project actually uses, off the main path. */
function prewarm(inst, notes){
  const eng = ENG[inst.kind];
  if (!eng || !eng.render || !ctx) return;
  const todo = [];
  for (const n of new Set(notes)) for (let l = 0; l < eng.layers; l++) todo.push([n + (inst.p.tr || 0), l]);
  const step = () => {
    const t0 = performance.now();
    while (todo.length && performance.now() - t0 < 12){ const [n, l] = todo.shift(); rendered(eng, ctx.sampleRate, n, l, inst.p); }
    if (todo.length) setTimeout(step, 30);
  };
  setTimeout(step, 50);
}

function setDrive(ws, d){ ws.curve = d > 0.005 ? shapeCurve('Drive', 1 + d * 18) : null; }

  if (bus && bus.attach) bus.attach(poly);
  return {
    kind:I.kind, poly,
    noteOn:(n, v, t, k) => poly.noteOn(n, v, t, k), noteOff:(n, t, k) => poly.noteOff(n, t, k),
    allOff:t => poly.allOff(t), bend:(x, t) => poly.bend(x, t), mod:(x, t) => poly.mod(x, t), sustain:(on, t) => poly.sustain(on, t),

const WAM_SDK = 'https://cdn.jsdelivr.net/npm/@webaudiomodules/sdk@0.0.12/dist/index.js';
const WAM_BASE = 'https://www.webaudiomodules.com/community/plugins/';
const WAMHOST = new WeakMap();
const WAMS = new Map();                    // realtime instances by device id, kept across graph rebuilds
function wamHost(c){
  let p = WAMHOST.get(c);

async function wamCreate(c, url, state){

}
function wamGet(c, D, Gx){
  if (Gx.offline) return wamCreate(c, D.url, D.state);
  let p = WAMS.get(D.id);

}
function wamDevice(c, D, Gx){
  const input = gainN(c), output = gainN(c);

  dev.ready = wamGet(c, D, Gx).then(inst => {
    dev.wam = inst;
    try { inst.audioNode.disconnect(); } catch (e) {}
    input.disconnect(); input.connect(inst.audioNode); inst.audioNode.connect(output);
    if (!D.name && inst.descriptor) D.name = inst.descriptor.name;
    D.err = null;
  }).catch(e => { D.err = String(e && e.message || e); if (!Gx.offline) toast('Plugin failed to load: ' + D.err, 'err'); });

  const out = gainN(c, db2g((I.p && I.p.vol) || 0)); out.connect(dest);
  let node = null;
  const q = [], held = new Set();
  const send = (bytes, t) => { const ev = { type:'wam-midi', time:t, data:{ bytes } }; if (node) node.scheduleEvents(ev); else q.push(ev); };
  const ready = wamGet(c, I, Gx).then(inst => {
    try { inst.audioNode.disconnect(); } catch (e) {}
    node = inst.audioNode; node.connect(out);
    if (!I.name && inst.descriptor) I.name = inst.descriptor.name;
    q.forEach(ev => node.scheduleEvents(ev)); q.length = 0;
    I.err = null;
    return inst;
  }).catch(e => { I.err = String(e && e.message || e); if (!Gx.offline) toast('Plugin failed to load: ' + I.err, 'err'); });
  if (Gx.wait) Gx.wait.push(ready);

    kind:'wam', ready,
    noteOn(n, v, t){ held.add(n); send([0x90, n & 127, clamp(v | 0, 1, 127)], t); },
    noteOff(n, t){ held.delete(n); send([0x80, n & 127, 0], t); },
    allOff(t){                               // again after the lookahead: note-ons already queued must not stick
      for (const tt of [t, t + LOOKAHEAD + 0.02]){ for (const n of held) send([0x80, n, 0], tt); send([0xB0, 123, 0], tt); }
      held.clear();
    },
    bend(x, t){ const v = Math.round((x + 1) * 8191.5); send([0xE0, v & 127, (v >> 7) & 127], t); },
    mod(x, t){ send([0xB0, 1, Math.round(x * 127)], t); },
    sustain(on, t){ send([0xB0, 64, on ? 127 : 0], t); },
    set(k, v){ if (k === 'vol') out.gain.setTargetAtTime(db2g(v), c.currentTime, 0.02); },
    dispose(){ try { if (node) node.disconnect(); out.disconnect(); } catch (e) {} },
    get voices(){ return held.size; }
  };
}
function gcWams(){
  const live = new Set();
  const walk = ch => { (ch.fx || []).forEach(d => live.add(d.id)); if (ch.inst) live.add(ch.inst.id); };
  S.tracks.forEach(walk); S.returns.forEach(walk); walk(S.master);
  for (const [id, p] of WAMS) if (!live.has(id)){
    WAMS.delete(id);
    p.then(inst => { try { inst.audioNode.disconnect(); if (inst.audioNode.destroy) inst.audioNode.destroy(); } catch (e) {} }).catch(() => {});
  }
}

  };

    ['thresh','atk','rel','floor'].forEach(k => { n.parameters.get(k).value = p[k]; });

function autoApply(Gx, lane, b0, b1, tt, jump){
  if (!lane.pts.length) return;
  const R = resolveBind(lane.target, Gx.st);
  if (!R) return;
  const [kind, chId, a, b] = lane.target.split('|'), n = gChan(Gx, chId);
  if (!n) return;
  const v0 = fromNorm(R.spec, autoVal(lane.pts, b0)), v1 = fromNorm(R.spec, autoVal(lane.pts, b1));
  let prm = null, map = v => v;
  if (kind === 'm'){ prm = a === 'vol' ? n.vol.gain : a === 'pan' ? n.pan.pan : n.sends[+a[1]] && n.sends[+a[1]].gain; if (a === 'vol') map = db2g; }
  else if (kind === 'f'){ const dev = n.fx.get(a); if (dev && dev.ap && dev.ap[b]) prm = dev.ap[b].param; }
  if (!prm){ R.set(v1, Gx); return; }
  if (jump){ prm.cancelScheduledValues(tt(b0)); prm.setValueAtTime(map(v0), tt(b0)); }
  prm.linearRampToValueAtTime(map(v1), tt(b1));
  const ch = chanOf(Gx.st, chId);                  // mirror into state so faders and knobs follow
  if (kind === 'm'){ if (a === 'vol') ch.vol = v1; else if (a === 'pan') ch.pan = v1; else ch.sends[+a[1]] = v1; }
  else if (R.D) R.D.p[b] = v1;
}
/* After stop: drop pending ramps and put every param back on its state value. */
function settleParams(Gx){
  const t = Gx.c.currentTime;
  const hold = (prm, v) => { prm.cancelScheduledValues(t); prm.setValueAtTime(v, t); };
  const each = (ch, n) => {
    if (!n) return;
    hold(n.vol.gain, db2g(ch.vol)); hold(n.pan.pan, ch.pan || 0);
    (ch.sends || []).forEach((v, i) => n.sends[i] && hold(n.sends[i].gain, v));
    for (const D of ch.fx || []){ const dev = n.fx.get(D.id); if (dev && dev.ap) for (const k in dev.ap){ dev.ap[k].param.cancelScheduledValues(t); dev.set(k, D.p[k]); } }
  };
  Gx.st.tracks.forEach(tr => each(tr, Gx.tracks[tr.id]));
}
const chanOf = (st, id) => id === 'master' ? st.master : (st.returns.find(r => r.id === id) || st.tracks.find(t => t.id === id));

/* ============================================================================
   PROJECT MODEL
   ========================================================================== */
let S = null;
let colorIx = 0;
const nextColor = () => TRACK_COLORS[colorIx++ % TRACK_COLORS.length];
function fxDef(kind, over){ return { id:uid('d'), kind, on:true, p:{ ...defaults(FX[kind].params), ...(over || {}) } }; }
function instFromPreset(pr){ return { id:uid('i'), kind:pr.kind, preset:pr.name, p:{ ...defaults(ENG[pr.kind].params), ...deep(pr.p || {}) } }; }
function newProject(){
  return {
    v:4, name:'Untitled', bpm:120, loop:{ on:false, start:0, end:16 }, pos:0, metro:false,
    tracks:[], sel:null, midiMap:{},
    returns:[
      { id:'rA', name:'A · Reverb', vol:0, pan:0, mute:false, fx:[fxDef('reverb', { mix:1 })] },
      { id:'rB', name:'B · Delay', vol:0, pan:0, mute:false, fx:[fxDef('delay', { mix:1 })] }
    ],
    master:{ id:'master', name:'Master', vol:0, pan:0, fx:[fxDef('comp', { thresh:-14, ratio:2, atk:0.01, rel:0.2, makeup:2 }), fxDef('limiter', { gain:3 })] }
  };
}
function newTrack(type, name, inst){
  return { id:uid('t'), type, name, color:nextColor(), vol:0, pan:0, mute:false, solo:false, arm:false, mon:false,
           sends:[0, 0], inst:inst || null, fx:[], clips:[], auto:[], showAuto:false, autoSel:null };
}
function newInstTrack(pr, name){
  const tr = newTrack('inst', name || pr.name, instFromPreset(pr));
  tr.fx = (pr.fx || []).map(([k, o]) => fxDef(k, o));
  tr.sends = (pr.sends || [0, 0]).slice();
  return tr;
}
function normalizeProject(o){
  const d = newProject(), s = { ...d, ...o };
  s.loop = { ...d.loop, ...(o.loop || {}) };
  s.returns = Array.isArray(o.returns) && o.returns.length === 2 ? o.returns : d.returns;
  s.master = o.master || d.master;
  s.midiMap = o.midiMap || {};
  s.tracks = (o.tracks || []).filter(t => t && (t.type === 'inst' || t.type === 'audio'));
  for (const t of s.tracks){ t.sends = t.sends || [0, 0]; t.fx = t.fx || []; t.clips = t.clips || []; t.auto = t.auto || []; }
  return s;
}

/* ---------------------------------------------------------------- undo */
const UNDO = [], REDO = [];
let snapKey = '', snapAt = 0;
function snap(key){                      // call BEFORE a change; repeated keys within 1 s merge into one step
  const now = performance.now();
  if (key && key === snapKey && now - snapAt < 1000){ snapAt = now; return; }
  snapKey = key || ''; snapAt = now;
  UNDO.push(JSON.stringify(S));
  if (UNDO.length > 150) UNDO.shift();
  REDO.length = 0; dirty = true;
}
function undo(){
  if (!UNDO.length) return toast('Nothing to undo', 'warn');
  REDO.push(JSON.stringify(S)); S = JSON.parse(UNDO.pop()); snapKey = ''; reloadProject(); toast('Undo', 'ok');
}
function redo(){
  if (!REDO.length) return toast('Nothing to redo', 'warn');
  UNDO.push(JSON.stringify(S)); S = JSON.parse(REDO.pop()); snapKey = ''; reloadProject(); toast('Redo', 'ok');
}

/* ------------------------------------------------------------ preferences */
const PREFS = (() => { try { return JSON.parse(localStorage.getItem('ollie.prefs')) || {}; } catch (e) { return {}; } })();
const savePrefs = () => { try { localStorage.setItem('ollie.prefs', JSON.stringify(PREFS)); } catch (e) {} };

/* ============================================================================
   TRANSPORT & SCHEDULER
   A 20 ms timer schedules everything in the next 120 ms on the audio clock.
   Windows split at the loop end, so loops are sample accurate. Note-offs are
   queued as absolute times, which keeps legato and loop wraps correct.
   ========================================================================== */
const LOOKAHEAD = 0.12;
const T = { playing:false, rec:false, cursorB:0, cursorT:0, anchors:[{ time:0, beat:0, spb:0.5 }], timer:0, startB:0, stopB:0,
            jump:false, pending:[], keyN:0, recStartB:0, recNotes:[], recHeld:new Map(), audioRec:null };
const spbNow = () => 60 / S.bpm;
function songEnd(st = S){ let e = 0; for (const tr of st.tracks) for (const c of tr.clips) e = Math.max(e, c.start + c.len); return e; }
function pushAnchor(time, beat, spb){ T.anchors.push({ time, beat, spb }); if (T.anchors.length > 16) T.anchors.splice(0, T.anchors.length - 16); }
function beatAtTime(t){ let a = T.anchors[0]; for (const x of T.anchors) if (x.time <= t) a = x; return a.beat + (t - a.time) / a.spb; }
const outLat = () => (ctx.outputLatency || 0) + (ctx.baseLatency || 0);
function heardBeat(){ return T.playing ? Math.max(0, beatAtTime(ctx.currentTime - outLat())) : S.pos; }

function play(from = S.pos){
  if (T.playing) return;
  if (ctx.state !== 'running') ctx.resume();
  T.playing = true; T.startB = from; T.cursorB = from; T.cursorT = ctx.currentTime + 0.06;
  T.anchors = [{ time:T.cursorT, beat:from, spb:spbNow() }]; T.jump = true; T.pending = [];
  tick(); T.timer = setInterval(tick, 20);
  uiTransport();
}
function tick(){
  if (!T.playing) return;
  const until = ctx.currentTime + LOOKAHEAD;
  let guard = 0;
  while (T.cursorT < until && guard++ < 32){
    const spb = spbNow();
    if (T.anchors[T.anchors.length - 1].spb !== spb) pushAnchor(T.cursorT, T.cursorB, spb);
    const L = S.loop, looping = L.on && !T.rec && L.end - L.start >= 0.25 && T.cursorB < L.end;
    const b0 = T.cursorB;
    let b1 = b0 + (until - T.cursorT) / spb;
    if (looping && b1 >= L.end) b1 = L.end;
    scheduleRange(G, S, b0, b1, T.cursorT, spb, T.jump, looping ? L.end : Infinity, T.pending, true);
    T.jump = false;
    T.cursorT += (b1 - b0) * spb; T.cursorB = b1;
    if (looping && b1 >= L.end){ T.cursorB = L.start; T.jump = true; pushAnchor(T.cursorT, L.start, spb); }
  }
}
function scheduleRange(Gx, st, b0, b1, t0, spb, jump, stopB, pending, live){
  const tt = b => t0 + (b - b0) * spb, ons = [];
  for (const tr of st.tracks){
    const n = Gx.tracks[tr.id];
    if (!n) continue;
    for (const cl of tr.clips){
      const cs = cl.start, ce = cs + cl.len;
      if (ce <= b0 || cs >= b1) continue;
      if (tr.type === 'inst'){
        if (!n.inst) continue;
        for (const nt of cl.notes){
          if (nt.t < cl.offset || nt.t >= cl.offset + cl.len) continue;
          const ab = cs + nt.t - cl.offset;
          if (ab < b0 || ab >= b1) continue;
          const offB = Math.min(ab + nt.d, ce, stopB), ton = tt(ab);
          ons.push({ t:ton, off:ton + Math.max(0.005, (offB - ab) * spb), inst:n.inst, n:nt.p, v:nt.v, key:'k' + (++T.keyN) });
        }
      } else {
        const E = BUF.get(cl.buf);
        if (!E) continue;
        const sb = cs >= b0 ? cs : (jump ? b0 : null);
        if (sb === null) continue;
        const endB = Math.min(ce, stopB), off = cl.offset + (sb - cs) * spb, dur = (endB - sb) * spb;
        if (dur > 0.004 && off < E.buf.duration) startAudio(Gx, n, cl, E, tt(sb), off, dur);
      }
    }
    if (tr.auto) for (const lane of tr.auto) autoApply(Gx, lane, b0, b1, tt, jump);
  }
  runNotes(ons, pending, tt(b1));
  if (live && st.metro && Gx.metro) for (let k = Math.ceil(b0 - 1e-9); k < b1; k++) metroClick(Gx, tt(k), k % 4 === 0);
}
/* Note-ons and every note-off due before tEnd, in time order (offs first on a tie):
   that ordering is what makes mono legato vs retrigger come out right. */
function runNotes(ons, pending, tEnd){
  const evs = [];
  for (const o of ons){ evs.push(o); const off = { t:o.off, inst:o.inst, n:o.n, key:o.key, isOff:true }; if (off.t < tEnd) evs.push(off); else pending.push(off); }
  for (let i = pending.length - 1; i >= 0; i--) if (pending[i].t < tEnd) evs.push(pending.splice(i, 1)[0]);
  evs.sort((a, b) => a.t - b.t || (a.isOff ? -1 : 1) - (b.isOff ? -1 : 1));
  for (const e of evs) e.isOff ? e.inst.noteOff(e.n, e.t, e.key) : e.inst.noteOn(e.n, e.v, e.t, e.key);
}
function startAudio(Gx, n, cl, E, t, off, dur){
  const c = Gx.c, s = c.createBufferSource(), g = gainN(c, 0), gv = db2g(cl.gain || 0), f = Math.min(0.004, dur / 3);
  s.buffer = E.buf;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gv, t + f);           // micro-fades: splices never click
  g.gain.setValueAtTime(gv, t + dur - f); g.gain.linearRampToValueAtTime(0, t + dur);
  s.connect(g); g.connect(n.input); s.start(t, off, dur);
  const a = { s, g };
  Gx.active.add(a);
  s.onended = () => { Gx.active.delete(a); try { g.disconnect(); } catch (e) {} };
}
function metroClick(Gx, t, accent){
  const c = Gx.c, o = osc(c, 'sine', accent ? 1760 : 1175), g = gainN(c, 0);
  o.connect(g); g.connect(Gx.metro); envPerc(g, t, accent ? 0.6 : 0.35, 0.05); o.start(t); o.stop(t + 0.1);
}
function stop(){
  if (!T.playing){ S.pos = 0; uiTransport(); return; }       // stop twice: back to the top
  T.stopB = heardBeat();
  T.playing = false; clearInterval(T.timer);
  const now = ctx.currentTime;
  for (const n of Object.values(G.tracks)) if (n.inst) n.inst.allOff(now);
  for (const a of G.active){ try { a.g.gain.cancelScheduledValues(now); a.g.gain.setTargetAtTime(0, now, 0.008); a.s.stop(now + 0.05); } catch (e) {} }
  T.pending = [];
  settleParams(G);
  if (T.rec) finishRecording();
  uiTransport();
}
function togglePlay(cont){ if (T.playing) stop(); else play(cont ? T.stopB : S.pos); }
function seek(b){
  b = Math.max(0, b);
  if (T.playing){ const r = T.rec; stop(); S.pos = b; if (!r) play(b); }
  else S.pos = b;
  uiTransport();
}

/* ============================================================================
   RECORDING  (audio in, MIDI in, sampling, resampling)
   One capture worklet serves all of them. Audio takes are placed using the
   audio clock of the first captured sample minus round-trip latency.
   ========================================================================== */
let micStream = null, micSrc = null;
async function getMic(){
  if (micStream && micStream.active && micSrc) return micSrc;
  const dev = PREFS.input;
  micStream = await navigator.mediaDevices.getUserMedia({ audio:{
    deviceId:dev ? { exact:dev } : undefined, echoCancellation:false, noiseSuppression:false, autoGainControl:false, channelCount:{ ideal:2 } } });
  micSrc = ctx.createMediaStreamSource(micStream);
  updateMonitors();
  return micSrc;
}
function autoLatency(){
  const tr = micStream && micStream.getAudioTracks()[0], st = tr && tr.getSettings ? tr.getSettings() : {};
  return outLat() + (st.latency || 0.01);
}
const recLatency = () => PREFS.lat != null && PREFS.lat !== '' ? PREFS.lat / 1000 : autoLatency();
function capture(srcNode){
  const node = new AudioWorkletNode(ctx, 'os-rec', { numberOfInputs:1, numberOfOutputs:1, outputChannelCount:[1] });
  const sink = gainN(ctx, 0), chunks = [];
  let t0 = null;
  node.connect(sink); sink.connect(ctx.destination);
  node.port.onmessage = e => { if (t0 === null) t0 = e.data.t; chunks.push(e.data.ch); };
  srcNode.connect(node); node.port.postMessage(true);
  return {
    get secs(){ return chunks.length * 128 / ctx.sampleRate; },
    stop:() => new Promise(res => {
      node.port.postMessage(false);
      setTimeout(() => {
        try { srcNode.disconnect(node); } catch (e) {}
        node.disconnect(); sink.disconnect();
        const len = chunks.reduce((a, c) => a + c[0].length, 0);
        if (!len) return res(null);
        const nch = Math.max(...chunks.map(c => c.length)), buf = newBuf(nch, len, ctx.sampleRate);
        for (let ch = 0; ch < nch; ch++){ const d = buf.getChannelData(ch); let o = 0; for (const c of chunks){ d.set(c[ch] || c[0], o); o += c[0].length; } }
        res({ buf, t0 });
      }, 80);
    })
  };
}
function updateMonitors(){
  if (!micSrc) return;
  try { micSrc.disconnect(); } catch (e) {}
  for (const tr of S.tracks) if (tr.type === 'audio' && tr.mon && G.tracks[tr.id]) micSrc.connect(G.tracks[tr.id].input);
}
async function toggleRecord(){
  if (T.rec){ finishRecording(); return; }                       // punch out, keep playing
  const audio = S.tracks.filter(t => t.type === 'audio' && t.arm), midi = S.tracks.filter(t => t.type === 'inst' && t.arm);
  if (!audio.length && !midi.length) return toast('Arm a track first with its ● button', 'warn');
  if (audio.length){
    try { T.audioRec = capture(await getMic()); }
    catch (e){ return toast('Microphone unavailable: ' + (e.message || e.name), 'err'); }
  }
  T.rec = true; T.recNotes = []; T.recHeld.clear();
  if (!T.playing) play();
  T.recStartB = T.playing ? Math.max(T.startB, heardBeat()) : S.pos;
  uiTransport();
}
async function finishRecording(){
  if (!T.rec) return;
  T.rec = false;
  uiTransport();
  const endB = T.playing ? heardBeat() : T.stopB, spb = spbNow();
  for (const h of T.recHeld.values()){ h.d = Math.max(0.05, endB - h.t); T.recNotes.push(h); }
  T.recHeld.clear();
  const midiT = S.tracks.filter(t => t.type === 'inst' && t.arm);
  let made = 0;
  if (T.recNotes.length && midiT.length){
    snap();
    const first = Math.min(...T.recNotes.map(n => n.t)), last = Math.max(endB, ...T.recNotes.map(n => n.t + n.d));
    const start = Math.floor(Math.min(first, T.recStartB) / 4) * 4, len = Math.max(4, Math.ceil((last - start) / 4) * 4);
    for (const tr of midiT){
      tr.clips.push({ id:uid('c'), start, len, offset:0, name:'MIDI Take', notes:T.recNotes.map(n => ({ p:n.p, t:n.t - start, d:n.d, v:n.v })) });
      made++;
    }
  }
  T.recNotes = [];
  if (T.audioRec){
    const cap = T.audioRec; T.audioRec = null;
    const r = await cap.stop();
    if (r){
      let startB = beatAtTime(r.t0 - recLatency()), offset = 0;
      if (startB < 0){ offset = -startB * spb; startB = 0; }
      const id = addBuffer(r.buf, 'Audio Take ' + (BUF.size + 1), 'rec');
      if (!made) snap();
      for (const tr of S.tracks.filter(t => t.type === 'audio' && t.arm)){
        tr.clips.push({ id:uid('c'), start:startB, len:Math.max(0.05, (r.buf.duration - offset) / spb), offset, buf:id, gain:0, name:'Audio Take' });
        made++;
      }
    }
  }
  if (made){ renderArr(); renderBrowser(); toast('Recorded ' + made + ' take' + (made > 1 ? 's' : ''), 'ok'); }
}
/* Sampling: record the mic (or the master output) straight into a Sampler/Slicer. */
const SAMPLING = { cap:null, tr:null };
async function toggleSampling(tr, source){
  if (SAMPLING.cap){
    const cap = SAMPLING.cap, target = SAMPLING.tr;
    SAMPLING.cap = null; SAMPLING.tr = null;
    const r = await cap.stop();
    renderDevices();
    if (!r) return toast('Nothing was captured', 'warn');
    const buf = trimSilence(r.buf), id = addBuffer(buf, (source === 'master' ? 'Resample ' : 'Sample ') + (BUF.size + 1), 'rec');
    loadSampleInto(target, id);
    return;
  }
  try {
    const node = source === 'master' ? G.out : await getMic();
    SAMPLING.cap = capture(node); SAMPLING.tr = tr;
    toast(source === 'master' ? 'Resampling the master output. Press again to stop.' : 'Sampling the input. Press again to stop.', 'warn');
    if (source === 'master' && !T.playing) play();
    renderDevices();
  } catch (e){ toast('Input unavailable: ' + (e.message || e.name), 'err'); }
}
function trimSilence(buf, thr = 0.004){
  const d = monoData(buf);
  let a = 0, e = d.length - 1;
  while (a < e && Math.abs(d[a]) < thr) a++;
  while (e > a && Math.abs(d[e]) < thr) e--;
  const sr = buf.sampleRate;
  return sliceBuf(buf, Math.max(0, a / sr - 0.005), Math.min(buf.duration, e / sr + 0.05));
}
function loadSampleInto(tr, id){
  if (!tr || !tr.inst) return;
  snap();
  const p = tr.inst.p, E = BUF.get(id);
  p.buf = id;
  if (tr.inst.kind === 'slicer') p.slices = detectOnsets(E.buf, p.sens);
  else { p.start = 0; p.end = 1; }
  tr.name = tr.name === 'Sampler' || tr.name === 'Slicer' ? E.name : tr.name;
  renderArr(); renderDevices(); renderSampleEditor();
  toast('Loaded ' + E.name + (p.slices ? ' · ' + p.slices.length + ' slices' : ''), 'ok');
}

/* ============================================================================
   LIVE INPUT: Web MIDI + computer keyboard + on-screen keys
   Plays the armed instrument tracks, or the selected one if none are armed.
   ========================================================================== */
function midiTargets(){
  const armed = S.tracks.filter(t => t.type === 'inst' && t.arm);
  if (armed.length) return armed;
  const t = S.tracks.find(x => x.id === S.sel);
  return t && t.type === 'inst' ? [t] : [];
}
const liveInsts = () => midiTargets().map(tr => G.tracks[tr.id] && G.tracks[tr.id].inst).filter(Boolean);
function liveOn(n, v){
  if (!ctx || n < 0 || n > 127) return;
  const t = ctx.currentTime;
  liveInsts().forEach(i => i.noteOn(n, v, t, 'L' + n));
  markKey(n, true);
  if (T.rec && T.playing) T.recHeld.set(n, { p:n, t:heardBeat(), v });
}
function liveOff(n){
  if (!ctx) return;
  const t = ctx.currentTime;
  for (const tr of S.tracks){ const g = tr.type === 'inst' && G.tracks[tr.id]; if (g && g.inst) g.inst.noteOff(n, t, 'L' + n); }
  markKey(n, false);
  const hd = T.recHeld.get(n);
  if (hd){ T.recHeld.delete(n); hd.d = Math.max(0.05, heardBeat() - hd.t); T.recNotes.push(hd); }
}
const liveEach = fn => { const t = ctx.currentTime; liveInsts().forEach(i => fn(i, t)); };
let MIDI = null, LEARN = null, midiFlash = 0;
async function initMidi(){
  const info = $('#midiInfo');
  if (!navigator.requestMIDIAccess){ info.textContent = 'MIDI n/a'; info.dataset.tip = 'This browser has no Web MIDI. Chrome and Edge do.'; return; }
  try { MIDI = await navigator.requestMIDIAccess({ sysex:false }); }
  catch (e){ info.textContent = 'MIDI blocked'; info.dataset.tip = 'MIDI access was blocked. Allow it in the site settings, then reload.'; return; }
  const hook = () => {
    const ins = [...MIDI.inputs.values()];
    ins.forEach(i => { i.onmidimessage = onMidi; });
    info.textContent = ins.length ? 'MIDI · ' + ins.length : 'MIDI · none';
    info.dataset.tip = ins.length ? 'MIDI inputs: ' + ins.map(i => i.name).join(', ') : 'No MIDI controller connected. Plug one in, it appears here.';
  };
  MIDI.onstatechange = hook; hook();
}
function onMidi(e){
  const [st, d1 = 0, d2 = 0] = e.data, cmd = st & 0xF0;
  midiFlash = performance.now();
  if (cmd === 0x90 && d2 > 0) liveOn(d1, d2);
  else if (cmd === 0x80 || cmd === 0x90) liveOff(d1);
  else if (cmd === 0xB0) onCC(d1, d2);
  else if (cmd === 0xE0) liveEach((i, t) => i.bend((((d2 << 7) | d1) - 8192) / 8192, t));
  else if (cmd === 0xD0) liveEach((i, t) => i.mod(d1 / 127, t));        // channel pressure drives vibrato too
}
function onCC(cc, v){
  if (LEARN){
    S.midiMap[cc] = LEARN.key;
    toast('CC ' + cc + ' → ' + LEARN.label, 'ok');
    LEARN.el.classList.remove('learn'); LEARN = null; refreshKnobs();
    return;
  }
  const key = S.midiMap[cc];
  if (key){ const R = resolveBind(key); if (R){ R.set(fromNorm(R.spec, v / 127)); refreshBind(key); } return; }
  if (cc === 1) liveEach((i, t) => i.mod(v / 127, t));
  else if (cc === 64) liveEach((i, t) => i.sustain(v >= 64, t));

async function loadCommunity(){

    }).map(e => ({ name:e.name, url:WAM_BASE + e.path, inst:(e.category || []).includes('Instrument'), vendor:e.vendor, description:e.description }));

/* click = audition */
function preview(data){
  if (!ctx) return;
  const P = BR.preview;
  if (P){ try { P.stop(); } catch (e) {} BR.preview = null; }
  const out = gainN(ctx, 0.9); out.connect(G.out);
  if (data.t === 'smp'){
    const E = BUF.get(data.id);
    if (!E) return;
    const s = ctx.createBufferSource(); s.buffer = E.buf; s.connect(out); s.start();
    s.onended = () => out.disconnect();
    BR.preview = { stop:() => s.stop() };
  } else if (data.t === 'inst'){
    const pr = PRESET_BY[data.name];
    if (!pr || ENG[pr.kind].sample) return;
    const inst = makeInstrument(ctx, instFromPreset(pr), out, G), t = ctx.currentTime + 0.03;
    const notes = pr.kind === 'drums' ? [[36, 0], [42, 0.25], [38, 0.5], [42, 0.75], [36, 1]] : [[60, 0], [64, 0.05], [67, 0.1], [72, 0.15]];
    notes.forEach(([n, d]) => { inst.noteOn(n, 100, t + d, 'p' + n + d); inst.noteOff(n, t + d + 0.8, 'p' + n + d); });
    const kill = setTimeout(() => { inst.dispose(); out.disconnect(); }, 4000);
    BR.preview = { stop:() => { clearTimeout(kill); inst.allOff(ctx.currentTime); setTimeout(() => { inst.dispose(); out.disconnect(); }, 100); } };
  } else out.disconnect();
}

/* ---- using a browser item (double-click or drop) ---- */
function useItem(it, at){
  const tr = at.tr, beat = at.beat ?? S.pos;
  if (it.t === 'inst'){
    const pr = PRESET_BY[it.name];
    if (tr && tr.type === 'inst' && at.fromDrop) return replaceInstrument(tr, pr);
    return addInstTrack(pr, beat);
  }
  if (it.t === 'fx'){
    const ch = at.ch || tr || dvChannel() || S.master;
    return addFx(ch, fxDef(it.kind));
  }
  if (it.t === 'wam'){
    if (it.inst){
      snap();
      const t = newTrack('inst', it.name, { id:uid('i'), kind:'wam', url:it.url, name:it.name, p:{ vol:0 } });
      insertTrack(t); addTrackGraph(G, t); applyMutes(G, S); selectTrack(t.id); renderArr(); setDock('dev');
      toast('Loading ' + it.name + '…', 'warn');
      return;
    }
    return addFx(at.ch || tr || dvChannel() || S.master, { id:uid('d'), kind:'wam', on:true, url:it.url, name:it.name, p:{} });
  }
  if (it.t === 'smp'){
    if (tr && tr.inst && ENG[tr.inst.kind] && ENG[tr.inst.kind].sample) return loadSampleInto(tr, it.id);
    placeSamples([it.id], tr && tr.type === 'audio' ? tr : null, beat);
  }
}
function placeSamples(ids, tr, beat){
  snap();
  if (!tr){ tr = newTrack('audio', BUF.get(ids[0]).name); insertTrack(tr); addTrackGraph(G, tr); applyMutes(G, S); }
  for (const id of ids){
    const E = BUF.get(id), len = E.buf.duration / spbNow();
    tr.clips.push({ id:uid('c'), start:beat, len, offset:0, buf:id, gain:0, name:E.name });
    beat += len;
  }
  selectTrack(tr.id); renderArr();
}
function sampleToInst(id, preset){
  const tr = addInstTrack(PRESET_BY[preset], S.pos);

}
async function importFiles(files, at = {}){
  const ids = [];
  for (const f of files){
    if (isProjectFile(f)){ await openProject(f); return; }
    if (isMidiFile(f)){ await importMidi(f, at.beat ?? 0); continue; }
    if (!isAudioFile(f)){ toast(f.name + ': not an audio, MIDI or project file', 'warn'); continue; }
    try { ids.push(await decodeFile(f)); } catch (e){ toast('Could not decode ' + f.name, 'err'); }
  }
  renderBrowser();
  if (!ids.length || at.browserOnly){ if (ids.length) toast('Added ' + ids.length + ' sample' + (ids.length > 1 ? 's' : '') + ' to the browser', 'ok'); return; }
  if (at.tr && at.tr.inst && ENG[at.tr.inst.kind] && ENG[at.tr.inst.kind].sample) return loadSampleInto(at.tr, ids[0]);
  placeSamples(ids, at.tr && at.tr.type === 'audio' ? at.tr : null, at.beat ?? S.pos);
  toast('Imported ' + ids.length + ' audio file' + (ids.length > 1 ? 's' : ''), 'ok');

function keyboardStrip(){
  const lo = 24, hi = 108, whites = [];

  const ww = 100 / whites.length, base = (KB.oct + 2) * 12;
  for (let n = lo; n <= hi; n++){
    if (isBlack(n)){ const wi = whites.indexOf(n - 1); kb.append(h('div', { class:'b' + (HELD.has(n) ? ' on' : ''), id:'kk' + n, 'data-n':n, style:`left:${(wi + 0.68) * ww}%;width:${ww * 0.64}%` })); }
    else { const wi = whites.indexOf(n); kb.append(h('div', { class:'w' + (n >= base && n < base + 18 ? ' kz' : '') + (HELD.has(n) ? ' on' : ''), id:'kk' + n, 'data-n':n, style:`left:${wi * ww}%;width:${ww}%` }, n % 12 === 0 ? h('span', { text:nname(n) }) : null)); }
  }

  const vel = (e, el) => { const r = el.getBoundingClientRect(); return clamp(Math.round(30 + (e.clientY - r.top) / r.height * 97), 1, 127); };
  kb.addEventListener('pointerdown', e => { const el = at(e); if (!el) return; e.preventDefault(); kb.setPointerCapture(e.pointerId); cur = +el.dataset.n; liveOn(cur, vel(e, el)); });
  kb.addEventListener('pointermove', e => { if (cur == null) return; const el = at(e); if (el && +el.dataset.n !== cur){ liveOff(cur); cur = +el.dataset.n; liveOn(cur, vel(e, el)); } });

}
