<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0E10">
<meta name="description" content="SOS ONLY — an Optus Redcliffe horror comic. Your call is important to us.">
<title>SOS ONLY — Optus Redcliffe</title>
<link rel="icon" id="favicon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&family=VT323&display=swap">
<style>
/* SOS ONLY — styles */
:root {
  --ink: #0E0E10; --paper: #F2ECDD; --optus-yellow: #FFCD00; --night: #1B2A3A; --sodium: #E07B2E;
  --screen: #9FE6FF; --laser: #D7263D; --rot: #A8952C; --rot2: #6B5A1E;
  --lw: 600px; --lh: 900px; --u: 0.6px; --sw: 600px; --gut: #0E0E10;
  --f-speech: 'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', cursive;
  --f-sfx: Bangers, Impact, 'Arial Black', sans-serif;
  --f-mono: VT323, 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  --f-ui: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #060607; overflow: hidden; overscroll-behavior: none; }
body { color: #eee; font-family: var(--f-ui); -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--optus-yellow); outline-offset: 2px; }

.ft-s { font-family: var(--f-speech); font-weight: 700; }
.ft-x { font-family: var(--f-sfx); }
.ft-m { font-family: var(--f-mono); }
.ft-u { font-family: var(--f-ui); font-weight: 700; }

#lib { position: absolute; width: 0; height: 0; overflow: hidden; }
#app { position: fixed; inset: 0; }
#bleed { position: absolute; inset: 0; background: #08090B; transition: background 0.8s; }
#stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
#book { position: relative; display: flex; align-items: center; justify-content: center; }
.leaf { position: relative; width: var(--lw); height: var(--lh); overflow: hidden; background: var(--ink); flex: none; }
.leaf > svg.page { display: block; width: 100%; height: 100%; touch-action: none; }
#app[data-mode="guided"] .leaf { background: var(--gut); }
#app[data-mode="guided"] #book { width: 100vw; height: 100vh; height: 100dvh; }
#app[data-mode="guided"] .leaf { width: 100vw; height: 100vh; height: 100dvh; }
.mode-spread .leaf.left { box-shadow: -10px 0 30px rgba(0, 0, 0, 0.6); }
.mode-spread .leaf.right { box-shadow: 10px 0 30px rgba(0, 0, 0, 0.6); }
.mode-spread::after {
  content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: calc(var(--lw) * 0.12); transform: translateX(-50%); pointer-events: none;
  background: linear-gradient(90deg, transparent, rgba(0,0,0,.18) 30%, rgba(0,0,0,.45) 49%, rgba(255,255,255,.05) 50%, rgba(0,0,0,.4) 51%, rgba(0,0,0,.16) 70%, transparent);
}
.mode-page .leaf { box-shadow: 0 0 40px rgba(0, 0, 0, 0.7); }
.turning .leaf { animation: turnIn 0.34s ease-out both; }
.turning .leaf.right { animation-delay: 0.05s; }
@keyframes turnIn { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }
.missing { color: #777; display: grid; place-items: center; height: 100%; font: 700 24px var(--f-mono); text-align: center; }

/* bleed margins: the page's environment, dark and low-contrast, beside the page */
#app[data-bleed="rain"] #bleed, #app[data-bleed="storm"] #bleed {
  background: repeating-linear-gradient(104deg, transparent 0 22px, rgba(180,200,220,.07) 22px 23px, transparent 23px 47px), linear-gradient(#070b12, #16212d);
  animation: bleedRain 0.6s linear infinite;
}
@keyframes bleedRain { to { background-position: -12px 48px, 0 0; } }
#app[data-bleed="white"] #bleed, #app[data-bleed="store"] #bleed { background: radial-gradient(ellipse at center, #3a3934 0%, #141414 70%); }
#app[data-bleed="grey"] #bleed { background: radial-gradient(ellipse at center, #2a2a2c 0%, #0c0c0d 75%); }
#app[data-bleed="black"] #bleed, #app[data-bleed="dark"] #bleed { background: #050506; }
#app[data-bleed="hold"] #bleed { background: radial-gradient(ellipse at center, #2a2508 0%, #060606 70%); }
#app[data-bleed="warm"] #bleed, #app[data-bleed="dawn"] #bleed { background: linear-gradient(#4D5A86, #C98FA6 40%, #F6B6A6 65%, #FFD58A); }
#app[data-bleed="checkin"] #bleed { background: radial-gradient(ellipse at center, #26313c 0%, #0b0e12 75%); }
#app[data-bleed="end"] #bleed { background: #000; }

/* ---------- entrance: borders ink in, art fades up, balloons pop in reading order ---------- */
.enter .pb { stroke-dasharray: 100; stroke-dashoffset: 100; animation: inkIn 0.35s ease-out forwards; animation-delay: calc(var(--k, 0) * 90ms); }
.enter .pa { opacity: 0; animation: fadeUp 0.55s ease-out forwards; animation-delay: calc(var(--k, 0) * 90ms + 120ms); }
.enter .bl { opacity: 0; animation: pop 0.3s cubic-bezier(.3, 1.5, .5, 1) forwards; animation-delay: calc(var(--i, 0) * 160ms + 500ms); }
.bl { transform-box: fill-box; transform-origin: center; }
.bl.cap { transform-origin: left top; }
#app[data-mode="guided"] .bl { opacity: 0; animation: none; }
#app[data-mode="guided"] .bl.on { animation: pop 0.3s cubic-bezier(.3, 1.5, .5, 1) forwards; animation-delay: calc(var(--j, 0) * 200ms + 160ms); }
@keyframes inkIn { to { stroke-dashoffset: 0; } }
@keyframes fadeUp { to { opacity: 1; } }
@keyframes pop { from { opacity: 0; transform: scale(0.7); } to { opacity: 1; transform: scale(1); } }

/* content that only exists when the screen is wide enough to show it (page 3's Unfold Reveal) */
#app[data-mode="guided"] .wide-only { display: none; }
.pop-n { opacity: 0; }
.pop-n.on { animation: pop 0.3s cubic-bezier(.3, 1.5, .5, 1) forwards; animation-delay: calc(var(--n, 0) * 250ms); transform-box: fill-box; transform-origin: center; }
.ghost7 { opacity: 0; transition: opacity 0.12s; }
.ghost7.on { opacity: 0.55; }

/* two-state art switched by triggers: add .on to .sw */
.sw > .s1 { display: none; }
.sw.on > .s0 { display: none; }
.sw.on > .s1 { display: inline; }
.c63l { opacity: 0; }
.go .c63l { animation: lightOn 0.5s steps(3, end) forwards; animation-delay: calc(var(--li, 0) * 0.7s); }
@keyframes lightOn { 0% { opacity: 0; } 40% { opacity: .5; } 60% { opacity: .15; } 100% { opacity: 1; } }
.wv { opacity: 0; }
.go .wv { animation: lightOn 0.35s steps(2, end) forwards; animation-delay: calc(var(--w, 0) * 110ms); }
.notes.stopped * { animation-play-state: paused !important; }
.sale-toast { opacity: 0; }
.sale-toast.on { animation: toast 1.8s ease-out; }
@keyframes toast { 0% { opacity: 0; transform: translateY(8px); } 15%, 70% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-6px); } }
.rm .go .c63l, .rm .go .wv { animation: none; opacity: 1; }

/* rotted balloons: tap to heal for a moment */
.bl-rot .clean { display: none; }
.bl-rot.healed .clean { display: inline; }
.bl-rot.healed .rotted { display: none; }
.bl-rot { cursor: pointer; }

/* ---------- ambient motion ---------- */
.fx-rainA { animation: rainA 0.42s linear infinite; }
.fx-rainB { animation: rainB 0.75s linear infinite; }
@keyframes rainA { from { transform: translateY(0); } to { transform: translateY(180px); } }
@keyframes rainB { from { transform: translateY(0); } to { transform: translateY(300px); } }
/* fluorescent flicker: dims, never more than ~2 changes a second */
.fx-flicker { animation: flicker 4.6s steps(1, end) infinite; }
@keyframes flicker { 0% { opacity: 1; } 31% { opacity: 0.35; } 40% { opacity: 1; } 66% { opacity: 0.6; } 75% { opacity: 1; } }
.fx-flicker2 { animation: flicker2 6.1s steps(1, end) infinite; }
@keyframes flicker2 { 0% { opacity: 1; } 52% { opacity: 0.25; } 62% { opacity: 0.9; } 70% { opacity: 0.3; } 82% { opacity: 1; } }
/* lightning: one soft flash per cycle, capped brightness */
.fx-light { opacity: 0; animation: light 5.7s linear infinite; }
@keyframes light { 0%, 86% { opacity: 0; } 87% { opacity: 0.85; } 89% { opacity: 0.15; } 91% { opacity: 0.6; } 95%, 100% { opacity: 0; } }
.fx-ring { animation: ring 1.2s ease-in-out infinite; animation-delay: var(--rd, 0s); }
@keyframes ring { 0%, 100% { opacity: 0.15; } 50% { opacity: 1; } }
.fx-pulse { animation: pulse 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pulse { 0%, 100% { opacity: 0.55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }
.fx-breathe { animation: breathe 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center bottom; }
@keyframes breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.025, 1.06); } }
.fx-steam { animation: steam 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center bottom; }
@keyframes steam { 0% { opacity: 0; transform: translateY(6px) scaleY(.8); } 40% { opacity: 1; } 100% { opacity: 0; transform: translateY(-14px) scaleY(1.1); } }
.fx-sway { animation: sway 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center top; }
@keyframes sway { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
.fx-glow { animation: glowp 3.2s ease-in-out infinite; }
@keyframes glowp { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
.fx-drift { animation: drift 7s linear infinite; }
@keyframes drift { from { transform: translate(0, 0); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } to { transform: translate(var(--dx, 120px), var(--dy, -80px)); opacity: 0; } }
.fx-scroll { animation: scrollUp var(--sd, 6s) linear infinite; }
@keyframes scrollUp { from { transform: translateY(0); } to { transform: translateY(var(--sh, -200px)); } }
.fx-sweep { animation: sweep 2.6s ease-in-out infinite alternate; transform-box: view-box; }
@keyframes sweep { from { transform: rotate(-4deg); } to { transform: rotate(5deg); } }
.fx-swell { animation: swell 4s ease-in-out infinite; }
@keyframes swell { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(5px); } }
.fx-jitter { animation: jitter 0.5s steps(2, end) infinite; }
@keyframes jitter { 0% { transform: translate(0, 0); } 50% { transform: translate(-3px, 1px); } 100% { transform: translate(2px, -1px); } }
.fx-blink { animation: blinkk 1.1s steps(1, end) infinite; }
@keyframes blinkk { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
.fx-type { animation: none; }
.rotg { opacity: 0; animation: rotIn 1.6s ease-out forwards; animation-delay: var(--d, 0s); }
@keyframes rotIn { from { opacity: 0; } to { opacity: 1; } }
.ollie .ol-eyes { transform-box: fill-box; transform-origin: center; }
.ollie.blink .ol-eyes { animation: olBlink 0.5s ease-in-out; }
@keyframes olBlink { 0%, 100% { transform: scaleY(1); } 45% { transform: scaleY(0.08); } }
.ollie { cursor: pointer; }

/* silhouettes and rim light */
.sil :not(.lit) { fill: #0E0E10 !important; stroke: #0E0E10 !important; }
.rimY :not(.lit) { fill: #FFCD00 !important; stroke: #FFCD00 !important; }
.rimS :not(.lit) { fill: #9FE6FF !important; stroke: #9FE6FF !important; }
.rimW :not(.lit) { fill: #F4F4EE !important; stroke: #F4F4EE !important; }
.rimY .lit, .rimS .lit, .rimW .lit { display: none; }

/* reduced motion: loops stop on their key frame, reveals are cuts */
.rm .fx-rainA, .rm .fx-rainB, .rm .fx-flicker, .rm .fx-flicker2, .rm .fx-ring, .rm .fx-pulse, .rm .fx-breathe, .rm .fx-steam,
.rm .fx-sway, .rm .fx-glow, .rm .fx-scroll, .rm .fx-sweep, .rm .fx-swell, .rm .fx-jitter, .rm .fx-blink, .rm .fx-drift { animation: none !important; }
.rm .fx-light { display: none; }
.rm .rotg { animation: none; opacity: 1; }
.rm .enter .pb, .rm .enter .pa, .rm .enter .bl { animation-duration: 0.01s !important; animation-delay: 0s !important; }
.rm #app[data-mode="guided"] .bl.on { animation-duration: 0.01s; animation-delay: 0s; }
.rm .turning .leaf { animation: none; }

/* ---------- reader chrome ---------- */
#ticket {
  position: fixed; z-index: 20; left: max(12px, env(safe-area-inset-left)); top: max(10px, env(safe-area-inset-top));
  width: 54px; height: 74px; padding: 6px 0 0; border: 0; border-radius: 3px 3px 0 0; cursor: pointer;
  background: #FBF9F1; color: #111; box-shadow: 0 3px 12px rgba(0,0,0,.5); display: flex; flex-direction: column; align-items: center;
  font-family: var(--f-mono); transition: opacity 0.6s, transform 0.6s; transform: rotate(-3deg);
}
#ticket .t-lab { font-size: 11px; letter-spacing: 1px; color: #555; }
#ticket .t-num { font-size: 40px; line-height: 0.95; }
#ticket .t-perf { position: absolute; left: 0; right: 0; bottom: -6px; height: 7px; background: radial-gradient(circle at 4px 0, transparent 3.5px, #FBF9F1 4px) 0 0 / 8px 7px repeat-x; }
#ticket.landed { animation: landed 0.9s ease-out; }
@keyframes landed { 0% { transform: rotate(-3deg) scale(1.25); } 40% { transform: rotate(4deg) scale(0.95); } 100% { transform: rotate(-3deg) scale(1); } }
#ticket.gone { opacity: 0 !important; pointer-events: none; transform: rotate(-3deg) translateY(-30px); transition: opacity 2.4s, transform 2.4s; }
#ticket.back { animation: slideBack 1.2s cubic-bezier(.2,.8,.3,1) both; }
@keyframes slideBack { from { transform: translate(-90px, -30px) rotate(-20deg); opacity: 0; } to { transform: rotate(-3deg); opacity: 1; } }
#ticket.pulse { animation: tkPulse 1.6s ease-in-out infinite; animation-delay: var(--pd, 0s); }
@keyframes tkPulse { 0%, 100% { box-shadow: 0 3px 12px rgba(0,0,0,.5); transform: rotate(-3deg) scale(1); } 50% { box-shadow: 0 0 0 4px var(--optus-yellow), 0 0 28px var(--optus-yellow); transform: rotate(-3deg) scale(1.08); } }
#ticket.rot1::before, #ticket.rot2::before {
  content: ''; position: absolute; inset: 0; pointer-events: none; border-radius: 3px;
  background: radial-gradient(circle at 80% 85%, rgba(107,90,30,.85) 0 3px, transparent 4px), radial-gradient(circle at 20% 70%, rgba(168,149,44,.7) 0 2px, transparent 3px), radial-gradient(circle at 70% 20%, rgba(107,90,30,.7) 0 2px, transparent 3px);
}
#ticket.rot2::before {
  background: radial-gradient(circle at 80% 85%, rgba(107,90,30,.9) 0 8px, transparent 10px), radial-gradient(circle at 15% 60%, rgba(168,149,44,.8) 0 5px, transparent 7px), radial-gradient(circle at 70% 20%, rgba(107,90,30,.8) 0 4px, transparent 6px), radial-gradient(circle at 40% 95%, rgba(80,64,20,.8) 0 6px, transparent 8px);
}
#app.idle #ticket:not(.pulse):not(:focus-visible) { opacity: 0.55; }
#status {
  position: fixed; z-index: 20; right: max(12px, env(safe-area-inset-right)); top: max(12px, env(safe-area-inset-top));
  display: flex; align-items: center; gap: 6px; padding: 5px 9px; border-radius: 8px; background: rgba(14,14,16,.78); border: 1.5px solid rgba(255,205,0,.55);
  font: 700 12px var(--f-ui); color: #eee; transition: opacity 0.6s; pointer-events: none;
}
#status .sb { display: inline-flex; align-items: flex-end; gap: 2px; height: 13px; }
#status .sb i { width: 3px; background: rgba(255,255,255,.22); border-radius: 1px; }
#status .sb i.on { background: #fff; }
#status[data-k="sos"] .sl { color: var(--optus-yellow); }
#progress { position: fixed; z-index: 20; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,.08); transition: opacity 0.6s; pointer-events: none; }
#pfill { height: 100%; width: 0; background: var(--optus-yellow); transition: width 0.4s; }
#ptime { position: absolute; right: 10px; bottom: 6px; font: 15px var(--f-mono); color: rgba(255,255,255,.55); }
#app.idle #status, #app.idle #progress { opacity: 0; }
#app[data-rot="1"] #pfill, #app[data-rot="2"] #pfill {
  background: linear-gradient(90deg, var(--optus-yellow) 0 60%, var(--rot) 60% 63%, var(--optus-yellow) 63% 78%, var(--rot2) 78% 84%, var(--optus-yellow) 84%);
}
#app[data-rot="2"] #pfill { background: repeating-linear-gradient(90deg, var(--rot) 0 9px, var(--rot2) 9px 13px, var(--optus-yellow) 13px 20px); }

/* menu */
#menu { position: fixed; z-index: 30; left: max(10px, env(safe-area-inset-left)); top: 96px; width: min(360px, calc(100vw - 20px)); max-height: calc(100dvh - 110px); overflow: auto; }
#menu .m-in { background: #FBF9F1; color: #161616; border-radius: 4px; padding: 14px 14px 16px; box-shadow: 0 10px 40px rgba(0,0,0,.6); font-family: var(--f-ui); }
.m-head { display: flex; align-items: center; gap: 12px; border-bottom: 2px dashed #bbb; padding-bottom: 10px; margin-bottom: 8px; font-weight: 700; }
.m-head small { font-weight: 400; color: #555; font-family: var(--f-mono); font-size: 15px; }
.m-num { font: 44px/1 var(--f-mono); }
.m-x { margin-left: auto; border: 0; background: none; font-size: 28px; cursor: pointer; line-height: 1; padding: 4px 8px; }
.m-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 0; font-size: 14px; font-weight: 700; }
.seg { display: inline-flex; border: 2px solid #161616; border-radius: 6px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: #fff; padding: 6px 9px; font-size: 13px; cursor: pointer; font-weight: 600; }
.seg button + button { border-left: 2px solid #161616; }
.seg button[aria-pressed="true"] { background: #161616; color: var(--optus-yellow); }
.m-acts { gap: 8px; justify-content: flex-start; flex-wrap: wrap; }
.m-acts button, .m-confirm button { border: 2px solid #161616; background: #fff; border-radius: 6px; padding: 7px 10px; cursor: pointer; font-weight: 700; font-size: 13px; }
.m-confirm { margin-top: 8px; padding: 10px; background: #161616; color: var(--optus-yellow); border-radius: 6px; }
.m-confirm p { margin: 0 0 8px; font: 700 18px var(--f-speech); }
.m-confirm button { margin-right: 6px; }

/* transcript */
@media (min-aspect-ratio: 7/10) and (min-width: 820px) { #app.with-transcript #stage { right: min(380px, 92vw); } }
#transcript { position: fixed; z-index: 25; right: 0; top: 0; bottom: 0; width: min(380px, 92vw); overflow: auto; padding: 56px 18px 30px; background: rgba(12,12,14,.95); color: #eee; font: 16px/1.5 var(--f-ui); -webkit-user-select: text; user-select: text; border-left: 2px solid rgba(255,205,0,.4); }
#transcript h2 { font: 700 18px var(--f-ui); color: var(--optus-yellow); margin: 18px 0 8px; }
#transcript p { margin: 0 0 8px; }
#transcript p.d { color: #aaa; font-style: italic; }
.tx-close { position: absolute; right: 10px; top: 10px; border: 0; background: none; color: #eee; font-size: 30px; cursor: pointer; }
@media (max-aspect-ratio: 7/10) { #transcript { top: auto; height: 42vh; width: 100vw; border-left: 0; border-top: 2px solid rgba(255,205,0,.4); padding-top: 44px; } }

#debug { position: fixed; z-index: 40; left: 8px; bottom: 10px; padding: 4px 8px; background: rgba(0,0,0,.8); color: #9f9; font: 14px var(--f-mono); pointer-events: none; }

/* closed roller door before check-in, and the door rolling up */
.shutter { position: absolute; inset: 0; z-index: 3; background: repeating-linear-gradient(#80848B 0 12px, #5D6066 12px 14px, #8a8e95 14px 16px); transition: transform 1.5s cubic-bezier(.5,0,.3,1); display: grid; place-items: center; box-shadow: inset 0 -12px 0 #3A3D44; }
.shutter.up { transform: translateY(-101%); }
.shutter.closed span { background: #0E0E10; color: var(--optus-yellow); font: 700 calc(var(--u) * 34) var(--f-ui); letter-spacing: 2px; padding: .5em 1em; border-radius: 4px; }

/* ---------- inside covers: HTML sheets that scale with --u (1/1000 of the sheet width) ---------- */
.leaf-checkin, .leaf-end { display: grid; place-items: center; background: transparent; }
.sheet { width: var(--sw); height: calc(var(--sw) * 1.5); max-height: 100%; position: relative; overflow: hidden; font-size: calc(var(--u) * 34); -webkit-user-select: none; user-select: none; }
#app[data-mode="guided"] .sheet { width: 100vw; height: 100vh; height: 100dvh; max-height: none; }
#app[data-mode="guided"] .checkin { padding-top: max(64px, env(safe-area-inset-top)); }
#app[data-mode="guided"] .cs { padding-top: 112px; }

.checkin { background: radial-gradient(ellipse at 50% 40%, #2c3742, #11161c 75%); padding: calc(var(--u) * 40); display: flex; }
.tablet { position: relative; flex: 1; background: #F7F6F2; color: #1A1A1A; border-radius: calc(var(--u) * 46); border: calc(var(--u) * 26) solid #17181C; box-shadow: 0 calc(var(--u) * 20) calc(var(--u) * 60) rgba(0,0,0,.6); display: flex; flex-direction: column; overflow: hidden; }
.tb-bar { display: flex; align-items: center; gap: calc(var(--u) * 16); background: var(--optus-yellow); padding: calc(var(--u) * 16) calc(var(--u) * 28); font-weight: 800; }
.tb-logo { font-size: 1.3em; letter-spacing: 0.02em; }
.tb-store { font-weight: 600; opacity: 0.8; }
.tb-clock { margin-left: auto; font-family: var(--f-mono); font-size: 1.2em; font-weight: 400; }
.tb-body { flex: 1; padding: calc(var(--u) * 30) calc(var(--u) * 46) calc(var(--u) * 10); display: flex; flex-direction: column; gap: calc(var(--u) * 20); overflow: auto; -webkit-user-select: text; user-select: text; }
.tb-body h1 { font: 800 1.6em/1.1 var(--f-ui); margin: calc(var(--u) * 10) 0 0; overflow-wrap: anywhere; }
.tb-body .sub { margin: 0; color: #444; font-size: 1.02em; }

<script>
(() => {
'use strict';
/* ---- 00-core.js ---- */
/* SOS ONLY — core: helpers, palette, seeded randomness, saved state, settings. */

const NS = 'http://www.w3.org/2000/svg';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const D2R = Math.PI / 180;
// Round to one decimal so generated SVG stays small.
const n = (v) => Math.round(v * 10) / 10;
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

// Palette. Mirrors the CSS custom properties in style.css.
const C = {
  ink: '#0E0E10', paper: '#F2ECDD', y: '#FFCD00', night: '#1B2A3A', sodium: '#E07B2E',
  screen: '#9FE6FF', laser: '#D7263D', white: '#FFFFFF',
  grey: '#7A7A76', dgrey: '#36363A', mgrey: '#56565B', lgrey: '#BDBAB0', gutterGrey: '#4A4A4D',
  navy: '#14283F', navy2: '#0D1B2B', wall: '#2B3440', floor: '#1F262E',
  rot: '#A8952C', rot2: '#6B5A1E', rot3: '#D4C24A',
  dawn1: '#F6B6A6', dawn2: '#FFD58A', sea: '#0F2233', bay: '#16303F',
  card: '#B89A6A', water: '#1C2A2E',
};

/* ---------- seeded randomness (so every load draws identically) ---------- */

function hashStr(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) h = Math.imul(h ^ str.charCodeAt(i), 16777619);
  return h >>> 0;
}

function rng(seed) {
  let a = typeof seed === 'string' ? hashStr(seed) : seed >>> 0;
  const r = () => {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  r.range = (lo, hi) => lo + r() * (hi - lo);
  r.int = (lo, hi) => Math.floor(lo + r() * (hi - lo + 1));
  r.pick = (arr) => arr[Math.floor(r() * arr.length)];
  r.jit = (v) => (r() * 2 - 1) * v;
  return r;
}

// Unique-per-render ids for clip paths and gradients. Reset before each page render.
let _uid = 0, _uidPrefix = '';
const uid = (p = 'u') => `${_uidPrefix}${p}${++_uid}`;

/* ---------- saved data: device only, one key ---------- */

const SAVE_KEY = 'sosonly.v1';
const Save = {
  d: null,
  fresh() {
    return {
      name: '', ticket: 7, visits: 0, checkedIn: false, finished: false,
      pagesSeen: [], olliesFound: [], jarradSales: 287, call1Start: null,
      firstOpened: Date.now(), lastLeftAt: null, readStart: null,
      settings: { sound: false, motion: 'auto', tilt: false, mode: 'auto', transcript: false },
    };
  },
  load() {
    let d = null;
    try { d = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch (e) { d = null; }
    const f = this.fresh();
    this.d = d && typeof d === 'object' ? Object.assign(f, d, { settings: Object.assign(f.settings, d.settings || {}) }) : f;
    return this.d;
  },
  write() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(this.d)); } catch (e) { /* private browsing: carry on without saving */ }
  },
  reset() {
    try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* ignore */ }
    this.d = this.fresh();
  },
};
Save.load();

// The reader's check-in name, or YOU.
const NAME = () => (Save.d.name || '').trim().toUpperCase().slice(0, 16) || 'YOU';
const hasName = () => !!(Save.d.name || '').trim();

const reducedMotion = () => {
  const m = Save.d.settings.motion;
  if (m === 'on') return false;
  if (m === 'off') return true;
  return !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
};

const fmtClock = (d = new Date()) => {
  let h = d.getHours();
  const ap = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return `${h}:${pad2(d.getMinutes())} ${ap}`;
};

const fmtDur = (ms, withDays) => {
  const s = Math.max(0, Math.floor(ms / 1000));
  const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  const hms = `${pad2(h)}:${pad2(m)}:${pad2(sec)}`;
  return withDays || d ? `${d}d ${hms}` : hms;
};

const YEAR_MS = 365 * 86400 * 1000;

// Page registry: page files call page(n, {...}); the reader mounts them.
const PAGES = [];
function page(num, def) { PAGES[num] = Object.assign({ num, id: 'p' + pad2(num) }, def); }

/* ---- 10-art.js ---- */
/* SOS ONLY — art primitives: shared defs, text fitting, panels, lettering, Code Rot. */

const FONTS = {
  speech: { fam: "'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', cursive", w: 700, cls: 'ft-s' },
  sfx: { fam: "Bangers, Impact, 'Arial Black', sans-serif", w: 400, cls: 'ft-x' },
  mono: { fam: "VT323, 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace", w: 400, cls: 'ft-m' },
  ui: { fam: "system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif", w: 700, cls: 'ft-u' },

/* ---------- tiny SVG string helpers ---------- */

const R = (x, y, w, h, fill, ex = '') => `<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" fill="${fill}" ${ex}/>`;
const E = (cx, cy, rx, ry, fill, ex = '') => `<ellipse cx="${n(cx)}" cy="${n(cy)}" rx="${n(rx)}" ry="${n(ry)}" fill="${fill}" ${ex}/>`;
const Ci = (cx, cy, r, fill, ex = '') => `<circle cx="${n(cx)}" cy="${n(cy)}" r="${n(r)}" fill="${fill}" ${ex}/>`;
const Pa = (d, fill = 'none', ex = '') => `<path d="${d}" fill="${fill}" ${ex}/>`;
const Ln = (x1, y1, x2, y2, stroke, sw = 2, ex = '') => `<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}" stroke="${stroke}" stroke-width="${n(sw)}" ${ex}/>`;
const Po = (pts, fill, ex = '') => `<polygon points="${ptsStr(pts)}" fill="${fill}" ${ex}/>`;

const G = (inner, ex = '') => `<g ${ex}>${inner}</g>`;
const st = (c, w, ex = '') => `stroke="${c}" stroke-width="${n(w)}" stroke-linejoin="round" stroke-linecap="round" ${ex}`;
const ptsStr = (pts) => pts.map((p) => `${n(p[0])},${n(p[1])}`).join(' ');
const pathOf = (pts, close = true) => 'M' + pts.map((p) => `${n(p[0])} ${n(p[1])}`).join('L') + (close ? 'Z' : '');
const tr = (x, y, s = 1, r = 0) => `transform="translate(${n(x)} ${n(y)})${r ? ` rotate(${n(r)})` : ''}${s !== 1 ? ` scale(${n(s * 1000) / 1000})` : ''}"`;

  `<text class="${font.cls}" x="${n(x)}" y="${n(y)}" font-size="${n(size)}" fill="${fill}" ${ex}>${esc(str)}</text>`;

/* ---------- the shared <defs> library (one hidden SVG, referenced by every page) ---------- */

function makeGrain() {
  const S = 180;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const x = c.getContext('2d');
  const img = x.createImageData(S, S);
  const r = rng('paper-grain');
  for (let i = 0; i < S * S; i++) {
    const v = r();
    const dark = v < 0.55;
    const a = Math.floor(r() * r() * (dark ? 90 : 60));
    img.data.set(dark ? [24, 20, 14, a] : [255, 250, 232, a], i * 4);
  }
  x.putImageData(img, 0, 0);
  try { return c.toDataURL('image/png'); } catch (e) { return ''; }
}

function libDefs() {
  const dots = (id, r, col, sz = 8, rot = 45) =>
    `<pattern id="${id}" width="${sz}" height="${sz}" patternUnits="userSpaceOnUse" patternTransform="rotate(${rot})"><circle cx="${sz / 2}" cy="${sz / 2}" r="${r}" fill="${col}"/></pattern>`;

    `<pattern id="${id}" width="${gap}" height="${gap}" patternUnits="userSpaceOnUse" patternTransform="rotate(${ang})"><rect width="${sw}" height="${gap}" fill="${col}"/></pattern>`;

  const rainTile = (id, w, h, count, seed, col, op, len) => {
    const r = rng(seed);
    let lines = '';
    for (let i = 0; i < count; i++) {

      lines += `<line x1="${n(x)}" y1="${n(y)}" x2="${n(x)}" y2="${n(y + l)}"/>`;
      if (y + l > h) lines += `<line x1="${n(x)}" y1="${n(y - h)}" x2="${n(x)}" y2="${n(y - h + l)}"/>`;

  };

  return `<defs>

    ${hatch('hatchH', 0, C.ink, 1.2, 5)}${hatch('scan', 90, '#000', 1.5, 5)}
    ${rainTile('rainA', 90, 180, 14, 'rainA', '#DCE8F2', 0.55, 38)}
    ${rainTile('rainB', 150, 300, 8, 'rainB', '#BFD3E3', 0.4, 70)}
    ${rainTile('rainD', 90, 180, 16, 'rainD', '#0E0E10', 0.35, 34)}
    ${grain ? `<pattern id="grain" width="180" height="180" patternUnits="userSpaceOnUse"><image href="${grain}" width="180" height="180"/></pattern>` : `<pattern id="grain" width="4" height="4" patternUnits="userSpaceOnUse"></pattern>`}
    ${rad('gY', C.y, 0.95, [0.35, 0.45])}${rad('gS', C.screen, 0.9, [0.3, 0.4])}${rad('gW', '#FFFFFF', 0.95, [0.3, 0.4])}

    <radialGradient id="gVig" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".85"/></radialGradient>

    ${lin('gUnderS', [[0, C.screen, 0], [0.6, C.screen, 0.18], [1, C.screen, 0.55]])}
    ${lin('gSky', [[0, '#070B12'], [0.45, '#121C2A'], [0.8, '#22303F'], [1, '#2C3B4A']])}
    ${lin('gSkyN', [[0, '#05070C'], [1, '#1B2A3A']])}
    ${lin('gDawn', [[0, '#4D5A86'], [0.38, '#C98FA6'], [0.62, '#F6B6A6'], [0.85, '#FFD58A'], [1, '#FFE7B5']])}
    ${lin('gSea', [[0, '#1E3445'], [1, '#081520']])}
    ${lin('gSeaDawn', [[0, '#F2B9A0'], [0.4, '#9C8FA8'], [1, '#3E5470']])}

    ${lin('gConeY', [[0, C.y, 0.45], [1, C.y, 0]])}
    ${lin('gConeS', [[0, C.screen, 0.5], [1, C.screen, 0]])}
    ${lin('gFade', [[0, C.ink, 0], [1, C.ink, 1]])}
    ${lin('gFadeUp', [[0, C.ink, 1], [1, C.ink, 0]])}
    ${lin('gFloor', [[0, '#2A333D'], [1, '#12171D']])}
    ${lin('gWall', [[0, '#1A222C'], [1, '#2B3440']])}
    ${lin('gStoreLit', [[0, '#EDEBE4'], [1, '#C9C6BC']])}
    ${lin('gScreenUI', [[0, '#DDE3E8'], [1, '#B8C1C9']])}
    ${lin('gLaserH', [[0, C.laser, 0], [0.5, C.laser, 1], [1, C.laser, 0]], 1, 0)}
    ${lin('gTVY', [[0, '#FFE04D'], [1, '#F2B800']])}
    ${lin('gGutWG', [[0, C.paper], [0.55, '#B7B3A8'], [1, C.gutterGrey]])}
    ${lin('gGutGB', [[0, C.gutterGrey], [0.6, '#232325'], [1, C.ink]])}
    <filter id="fGrey" x="0" y="0" width="1" height="1"><feColorMatrix type="saturate" values="0.06"/></filter>
  </defs>`;
}

/* ---------- text measuring and wrapping (canvas, measured once fonts are in) ---------- */

const _mctx = document.createElement('canvas').getContext('2d');
const _mcache = new Map();
function textW(str, size, font = FONTS.speech, ls = 0) {
  const k = font.cls + str;
  let w = _mcache.get(k);
  if (w === undefined) {
    _mctx.font = `${font.w} 100px ${font.fam}`;
    w = _mctx.measureText(str).width / 100;
    _mcache.set(k, w);
  }
  return w * size + ls * str.length;
}

function wrapText(text, maxW, size, font = FONTS.speech, ls = 0) {
  const out = [];
  for (const para of String(text).split('\n')) {
    const words = para.split(/\s+/).filter(Boolean);
    let line = '';
    for (const w of words) {
      const t = line ? line + ' ' + w : w;
      if (line && textW(t, size, font, ls) > maxW) { out.push(line); line = w; } else line = t;
    }
    out.push(line);
  }
  return out;
}

// Lines of text centred on (cx, cy).
function textLines(lines, cx, cy, size, fill, o = {}) {
  const font = o.font || FONTS.speech, lh = size * (o.lh || 1.12);
  const anchor = o.anchor || 'middle';
  const top = cy - ((lines.length - 1) * lh) / 2 + size * 0.36;
  let s = `<text class="${font.cls}" font-size="${n(size)}" fill="${fill}" text-anchor="${anchor}"${o.ls ? ` letter-spacing="${o.ls}"` : ''} ${o.ex || ''}>`;
  lines.forEach((ln, i) => { s += `<tspan x="${n(cx)}" y="${n(top + i * lh)}">${o.raw ? ln : esc(ln)}</tspan>`; });
  return s + '</text>';
}

// Two states of the same art; a page trigger adds .on to swap to the second.
const swap = (a, b, cls = '') => `<g class="sw ${cls}"><g class="s0">${a}</g><g class="s1">${b}</g></g>`;

// Music notes drifting out of a source. o: {count, dx, dy, col, seed, cls}
function notesFx(x, y, o = {}) {
  const r = rng(o.seed || `notes${x}`);
  let g = '';
  for (let i = 0; i < (o.count || 6); i++) {
    const dx = (o.dx || 160) * (0.6 + r() * 0.8), dy = (o.dy || -90) * (0.6 + r() * 0.8);
    g += `<text class="ft-s fx-drift" x="${n(x + r.jit(14))}" y="${n(y + r.jit(10))}" font-size="${n((o.size || 34) * (0.7 + r() * 0.6))}" fill="${o.col || C.ink}" stroke="${o.stroke || '#FFFFFF'}" stroke-width="3" paint-order="stroke" style="--dx:${n(dx)}px;--dy:${n(dy)}px;animation-delay:${n(-r() * 7)}s;animation-duration:${n(5 + r() * 4)}s">${r() < 0.5 ? '♪' : '♫'}</text>`;
  }
  return `<g class="notes ${o.cls || ''}" pointer-events="none">${g}</g>`;
}

/* ---------- Code Rot ---------- */

const ROT_GLYPHS = '▒░▓�╳┘┐╯╮╰╭▖▘▚▞▙▟¤§ʬ⌐¬';

// Swap some letters for rot glyphs. Returns markup (tspans) for use inside <text>.
function rotString(str, amount, seed, col = C.rot) {
  const r = rng(seed);
  let out = '';
  for (const ch of str) {
    if (ch !== ' ' && r() < amount) out += `<tspan fill="${col}">${esc(r.pick(ROT_GLYPHS))}</tspan>`;
    else out += esc(ch);
  }
  return out;
}

// A line of screen text that is rotting: letters slump, tilt, drip and turn to glyph-mould.
function rotLine(x, y, str, size, amount, seed, o = {}) {
  const r = rng(seed);
  const fill = o.fill || '#2C3540', font = o.font || FONTS.mono;
  const cw = textW('M', size, font);
  let ys = [], rots = [], body = '', drips = '';
  [...str].forEach((ch, i) => {
    const bad = ch !== ' ' && r() < amount;
    const slump = bad ? r() * size * 0.45 : r() < amount ? r() * size * 0.12 : 0;
    ys.push(n(y + slump));
    rots.push(bad ? n(r.jit(28)) : 0);
    if (bad && r() < 0.55) body += `<tspan fill="${o.rot || C.rot}">${esc(r.pick(ROT_GLYPHS))}</tspan>`;
    else body += esc(ch);
    if (bad && r() < 0.5) {
      const dx = x + i * cw + cw * 0.5, dy = y + slump + 2, l = 4 + r() * size * 0.7;
      drips += `<path d="M${n(dx - 1.2)} ${n(dy)}Q${n(dx)} ${n(dy + l)} ${n(dx + 1.2)} ${n(dy)}Z" fill="${o.rot || C.rot}" opacity=".85"/>${Ci(dx, dy + l * 0.92, 1.6, o.rot || C.rot)}`;
    }
  });
  return `<text class="${font.cls}" x="${n(x)}" font-size="${n(size)}" fill="${fill}" y="${ys.join(' ')}" rotate="${rots.join(' ')}"${o.ex ? ' ' + o.ex : ''}>${body}</text>${drips}`;
}

// A branching patch of glyph-mould growing out from (x, y). Revealed over `grow` seconds by
// staggered CSS animation; nothing re-renders text per frame. With reduced motion it is static.
function rotPatch(o) {
  const r = rng(o.seed || `rot${o.x},${o.y}`);
  const count = o.count || 70, size = o.size || 16, reach = o.reach || 160;
  const [bx, by, bw, bh] = o.box || [o.x - reach, o.y - reach, reach * 2, reach * 2];
  const grow = o.grow == null ? 6 : o.grow, delay = o.delay || 0;
  const cols = o.cols || [C.rot, C.rot2, C.rot3, C.rot];
  const pts = [];
  const walkers = [{ x: o.x, y: o.y, a: o.ang == null ? r() * Math.PI * 2 : o.ang, d: 0 }];
  let guard = 0;
  while (pts.length < count && guard++ < count * 8) {
    const w = walkers[Math.floor(r() * walkers.length)];
    w.a += r.jit(0.9);
    w.x += Math.cos(w.a) * size * 0.75;
    w.y += Math.sin(w.a) * size * 0.75;
    w.d += 1;
    if (w.x < bx || w.x > bx + bw || w.y < by || w.y > by + bh) { w.x = o.x; w.y = o.y; w.d = 0; continue; }
    pts.push({ x: w.x, y: w.y, d: Math.hypot(w.x - o.x, w.y - o.y) / reach });
    if (r() < 0.12 && walkers.length < 9) walkers.push({ x: w.x, y: w.y, a: w.a + r.jit(1.6), d: w.d });
  }
  pts.sort((a, b) => a.d - b.d);
  let s = '';
  // soft mould halo under the glyphs
  for (let i = 0; i < pts.length; i += 7) {
    const p = pts[i];
    s += `<g class="rotg" style="--d:${n(delay + p.d * grow)}s">${glow(p.x, p.y, size * 2.2, size * 1.7, 'gRot', 0.6)}</g>`;
  }
  for (let i = 0; i < pts.length; i += 6) {
    const chunk = pts.slice(i, i + 6);
    const d = delay + chunk[0].d * grow;
    s += `<text class="ft-m rotg" style="--d:${n(d)}s" font-size="${n(size * (0.8 + r() * 0.5))}" fill="${r.pick(cols)}" x="${chunk.map((p) => n(p.x)).join(' ')}" y="${chunk.map((p) => n(p.y)).join(' ')}" rotate="${chunk.map(() => n(r.jit(40))).join(' ')}">${chunk.map(() => esc(r.pick(ROT_GLYPHS))).join('')}</text>`;
  }
  return `<g class="rot ${o.cls || ''}" pointer-events="none"${o.op ? ` opacity="${o.op}"` : ''}>${s}</g>`;
}

/* ---------- lettering: balloons, captions, SFX ---------- */

function ellipsePt(cx, cy, rx, ry, t) { return [cx + rx * Math.cos(t), cy + ry * Math.sin(t)]; }

// Tapered, gently curved tail from the balloon edge to the speaker.
function tailPath(cx, cy, rx, ry, tip, o = {}) {
  const t = Math.atan2((tip[1] - cy) / ry, (tip[0] - cx) / rx);
  const wid = o.tw || 0.2;
  const b1 = ellipsePt(cx, cy, rx * 0.86, ry * 0.86, t - wid), b2 = ellipsePt(cx, cy, rx * 0.86, ry * 0.86, t + wid);
  const bm = [(b1[0] + b2[0]) / 2, (b1[1] + b2[1]) / 2];
  const dx = tip[0] - bm[0], dy = tip[1] - bm[1], len = Math.hypot(dx, dy) || 1;
  const px = -dy / len, py = dx / len, bend = (o.bend == null ? 0.16 : o.bend) * len;
  const m = [bm[0] + dx * 0.5 + px * bend, bm[1] + dy * 0.5 + py * bend];
  const hw = Math.hypot(b2[0] - b1[0], b2[1] - b1[1]) * 0.22;
  return `M${n(b1[0])} ${n(b1[1])}Q${n(m[0] - px * hw)} ${n(m[1] - py * hw)} ${n(tip[0])} ${n(tip[1])}Q${n(m[0] + px * hw)} ${n(m[1] + py * hw)} ${n(b2[0])} ${n(b2[1])}Z`;
}

// Jagged lightning tail for voices coming out of devices.
function zapPath(cx, cy, w, h, tip) {
  const bx = clamp(tip[0], cx - w / 2 + 16, cx + w / 2 - 16), by = tip[1] > cy ? cy + h / 2 - 6 : cy - h / 2 + 6;
  const dx = tip[0] - bx, dy = tip[1] - by, len = Math.hypot(dx, dy) || 1, px = -dy / len, py = dx / len;
  const at = (k, off) => [bx + dx * k + px * off, by + dy * k + py * off];
  const pts = [[bx - px * 11, by - py * 11], at(0.35, 9), at(0.3, -5), at(0.65, 6), at(0.6, -3), tip, at(0.58, -12), at(0.63, 1), at(0.3, -16), at(0.34, -2), [bx + px * 11, by + py * 11]];
  return pathOf(pts);
}

function burstPath(cx, cy, rx, ry, seed) {
  const r = rng(seed), pts = [], N = 22;
  for (let i = 0; i < N * 2; i++) {
    const t = (i / (N * 2)) * Math.PI * 2, k = i % 2 ? 1 : 1.28 + r() * 0.22;
    pts.push([cx + Math.cos(t) * rx * k, cy + Math.sin(t) * ry * k]);
  }
  return pathOf(pts);
}

function raggedRect(x, y, w, h, seed, j = 4) {
  const r = rng(seed), pts = [];
  const edge = (x1, y1, x2, y2) => {
    const steps = Math.max(2, Math.round(Math.hypot(x2 - x1, y2 - y1) / 22));
    for (let i = 0; i < steps; i++) pts.push([lerp(x1, x2, i / steps) + r.jit(j), lerp(y1, y2, i / steps) + r.jit(j)]);
  };
  edge(x, y, x + w, y); edge(x + w, y, x + w, y + h); edge(x + w, y + h, x, y + h); edge(x, y + h, x, y);
  return pathOf(pts);
}

/* ---------- page builder: one per render, carries the page's panels, balloons and transcript ---------- */

function makePG(page, env) {
  const pg = {
    id: page.id, num: page.num, page, env,
    mode: env.mode, revisit: env.revisit, visits: Save.d.visits, second: Save.d.finished || Save.d.visits > 1,
    rnd: rng(page.id),
    panels: [], lines: [], bbox: {}, bls: [], bal: 0,
  };

  const grow = (p, box) => {
    const b = pg.bbox[p];
    if (!b) { pg.bbox[p] = box.slice(); return; }
    const x1 = Math.min(b[0], box[0]), y1 = Math.min(b[1], box[1]);
    const x2 = Math.max(b[0] + b[2], box[0] + box[2]), y2 = Math.max(b[1] + b[3], box[1] + box[3]);
    pg.bbox[p] = [x1, y1, x2 - x1, y2 - y1];
  };

  pg.wobble = (box, j = 2) => {
    const [x, y, w, h] = box, r = pg.rnd;
    return pathOf([[x + r.jit(j), y + r.jit(j)], [x + w + r.jit(j), y + r.jit(j)], [x + w + r.jit(j), y + h + r.jit(j)], [x + r.jit(j), y + h + r.jit(j)]]);
  };

  // A panel: clipped art plus an inked, slightly hand-wobbled border.
  // o.guided: [{focus:[x,y,w,h], move:'cut'|'glide'|'creep', hold:ms, lock:ms}] (defaults to the panel box)
  pg.panel = (id, box, inner, o = {}) => {
    const d = o.path || pg.wobble(box);
    const cid = uid(`${pg.id}c`);
    const k = pg.panels.length;
    pg.panels.push({ id, box, guided: o.guided, k, desc: o.desc });
    if (o.desc) pg.lines.push({ who: '', text: o.desc, desc: true });
    grow(id, box);
    const bg = o.bg ? R(box[0] - 10, box[1] - 10, box[2] + 20, box[3] + 20, o.bg) : '';
    const border = o.border === false ? '' :
      `<path class="pb" d="${d}" pathLength="100" fill="none" stroke="${o.stroke || C.ink}" stroke-width="${o.sw || 7}" stroke-linejoin="round"/>`;
    return `<g class="pn ${o.cls || ''}" data-panel="${id}" style="--k:${k}"><clipPath id="${cid}"><path d="${d}"/></clipPath><g class="pa" clip-path="url(#${cid})">${bg}${inner}</g>${border}${o.over || ''}</g>`;
  };

  // Register a guided-view stop that isn't a whole panel (pans across wide panels, etc).
  pg.stop = (id, focus, o = {}) => { pg.panels.push({ id, box: focus, guided: [Object.assign({ focus }, o)], k: pg.panels.length, virtual: true }); };

  // Speech balloon. o: {p, x, y (centre), text, who, type, tail:[x,y], w (wrap width), size, rot, bend}
  // types: speech · whisper · shout · elec · entity · silence · dark · tiny
  pg.say = (o) => {
    const type = o.type || 'speech';
    const size = o.size || ({ whisper: 25, tiny: 21, entity: 28 }[type] || 29);
    const raw = String(o.text || '');
    const text = o.lower ? raw : raw.toUpperCase();
    const ls = type === 'entity' ? 1.5 : 0;
    const L = size * 1.06;
    const T = textW(text, size, FONTS.speech, ls);
    const maxW = o.w || clamp(Math.sqrt(T * L * 2.4), 90, 470);
    const lines = text ? wrapText(text, maxW, size, FONTS.speech, ls) : [];
    const tw = lines.length ? Math.max(...lines.map((l) => textW(l, size, FONTS.speech, ls))) : 0;
    const th = lines.length * L;
    const { x, y } = o;
    const i = pg.bal++;
    if (raw && o.who !== false) pg.lines.push({ who: o.who || '', text: raw, type });
    let shape = '', bw = 0, bh = 0, fill = '#FFFFFF', line = C.ink, tcol = C.ink;
    const sw = 7;
    if (type === 'elec' || type === 'entity') {
      bw = tw + (type === 'entity' ? 52 : 44); bh = th + (type === 'entity' ? 34 : 28);
      if (type === 'entity') {
        fill = C.ink; tcol = C.y;
        shape = Pa(raggedRect(x - bw / 2, y - bh / 2, bw, bh, `${pg.id}e${i}`), C.ink, st(C.y, 1.6, 'stroke-opacity=".35"'));
      } else {
        const tail = o.tail ? Pa(zapPath(x, y, bw, bh, o.tail), '#FFFFFF') : '';
        const rr = `<rect x="${n(x - bw / 2)}" y="${n(y - bh / 2)}" width="${n(bw)}" height="${n(bh)}" rx="9"`;
        shape = `<g ${st(line, sw)}>${rr} fill="#FFFFFF"/>${tail}</g><g>${rr} fill="#FFFFFF"/>${tail.replace(/stroke[^ ]*/g, '')}</g>`;
      }
    } else {
      let rx, ry;
      if (type === 'silence') { rx = 52; ry = 34; } else {
        rx = tw / 2 * 1.13 + (type === 'tiny' ? 12 : 17); ry = th / 2 * 1.22 + (type === 'tiny' ? 9 : 12);
        rx = Math.max(rx, ry * 1.1);
      }
      bw = rx * 2; bh = ry * 2;
      if (type === 'dark') { fill = C.ink; line = '#FFFFFF'; tcol = '#FFFFFF'; }
      const dash = type === 'whisper' ? 'stroke-dasharray="11 8"' : '';
      const outline = type === 'whisper' ? 4.5 : sw;
      const tail = o.tail ? Pa(tailPath(x, y, rx, ry, o.tail, o), fill) : '';
      if (type === 'shout') {
        const bp = Pa(burstPath(x, y, rx, ry, `${pg.id}b${i}`), fill);
        shape = `<g ${st(line, outline)}>${bp}${tail}</g><g>${bp}${tail}</g>`;
        bw *= 1.35; bh *= 1.35;
      } else {
        const el = E(x, y, rx, ry, fill);
        const ring = type === 'whisper' ? `<g ${st('#F4F1E8', outline + 5)}>${el}${tail}</g>` : '';
        shape = `${ring}<g ${st(line, outline, dash)}>${el}${tail}</g><g>${el}${tail}</g>`;
      }
    }
    let txt = '';
    if (lines.length) {
      if (o.rot) {
        const rotted = lines.map((l, k) => rotString(l, o.rot === true ? 0.22 : o.rot, `${pg.id}r${i}${k}`));
        txt = `<g class="rotted">${textLines(rotted, x, y, size, tcol, { raw: true, ls, lh: 1.06 })}</g><g class="clean">${textLines(lines, x, y, size, tcol, { ls, lh: 1.06 })}</g>`;
      } else txt = textLines(lines, x, y, size, tcol, { ls, lh: 1.06 });
    }
    grow(o.p, [x - bw / 2, y - bh / 2, bw, bh]);
    pg.bls.push({ p: o.p, box: [x - bw / 2, y - bh / 2, bw, bh] });
    const body = o.r ? `<g transform="rotate(${o.r} ${n(x)} ${n(y)})">${shape}${txt}</g>` : shape + txt;
    return `<g class="bl${o.rot ? ' bl-rot' : ''} ${o.cls || ''}" data-p="${o.p}" data-c="${n(x)},${n(y)}" style="--i:${i}"${o.rot ? ' data-hot="heal"' : ''}>${body}</g>`;
  };

  // Caption box, top-left anchored. styles: yellow · paper · black · entity · memory
  pg.cap = (o) => {
    const size = o.size || 24, style = o.style || 'yellow';
    const text = String(o.text).toUpperCase();
    const padX = 14, padY = 11, ls = style === 'entity' ? 1.5 : 0.5;
    const maxW = (o.w || 420) - padX * 2;
    const lines = wrapText(text, maxW, size, FONTS.speech, ls);
    const tw = Math.max(...lines.map((l) => textW(l, size, FONTS.speech, ls)));
    const w = o.w && o.fixed ? o.w : tw + padX * 2, h = lines.length * size * 1.15 + padY * 2;
    let x = o.x, y = o.y;
    if (o.right) x = o.x - w;
    if (o.bottom) y = o.y - h;
    const i = pg.bal++;
    if (o.who !== false) pg.lines.push({ who: style === 'entity' ? '⟨ENTITY⟩' : 'CAPTION', text: o.text, type: 'caption' });
    const fills = { yellow: [C.y, C.ink, C.ink], paper: ['#FFFDF5', C.ink, C.ink], black: [C.ink, '#FFFFFF', '#FFFFFF'], entity: [C.ink, C.y, C.y], memory: ['#D8D4C8', C.ink, C.ink] }[style];
    const box = style === 'entity'
      ? Pa(raggedRect(x, y, w, h, `${pg.id}cap${i}`, 3.5), fills[0], st(C.y, 1.4, 'stroke-opacity=".35"'))
      : R(x + 5, y + 6, w, h, 'rgba(0,0,0,.35)') + R(x, y, w, h, fills[0], st(fills[1], 3.5));
    const ty = y + padY + size * 0.82;
    let t = `<text class="ft-s" font-size="${size}" fill="${fills[2]}" letter-spacing="${ls}">`;
    lines.forEach((l, k) => { t += `<tspan x="${n(x + padX)}" y="${n(ty + k * size * 1.15)}">${o.rotAmt ? rotString(l, o.rotAmt, `${pg.id}cr${i}${k}`) : esc(l)}</tspan>`; });
    t += '</text>';
    grow(o.p, [x, y, w, h]);
    pg.bls.push({ p: o.p, box: [x, y, w, h] });
    const body = o.r ? `<g transform="rotate(${o.r} ${n(x)} ${n(y)})">${box}${t}</g>` : box + t;
    return `<g class="bl cap ${o.cls || ''}" data-p="${o.p}" data-c="${n(x + w / 2)},${n(y + h / 2)}" style="--i:${i}">${body}</g>`;
  };

  // Sound effect lettering, integrated into the art.
  pg.sfx = (text, x, y, o = {}) => {
    const size = o.size || 64, rot = o.rot == null ? -6 : o.rot;
    if (o.log !== false) pg.lines.push({ who: 'SFX', text, type: 'sfx' });
    const base = `class="ft-x sfx ${o.cls || ''}" x="${n(x)}" y="${n(y)}" font-size="${n(size)}" text-anchor="${o.anchor || 'middle'}" letter-spacing="${o.ls == null ? 2 : o.ls}" transform="rotate(${rot} ${n(x)} ${n(y)})${o.skew ? ` skewX(${o.skew})` : ''}"`;
    const sw = o.sw == null ? Math.max(4, size * 0.14) : o.sw;
    const out = o.outer ? `<text ${base} fill="none" stroke="${o.outer}" stroke-width="${n(sw * 2.1)}" stroke-linejoin="round">${esc(text)}</text>` : '';
    const body = `${out}<text ${base} fill="${o.fill || C.y}" stroke="${o.stroke || C.ink}" stroke-width="${n(sw)}" paint-order="stroke" stroke-linejoin="round">${esc(text)}</text>`;
    return `<g${o.p ? ` class="bl" data-p="${o.p}" data-c="${n(x)},${n(y)}" style="--i:${pg.bal++}"` : ''}>${o.op != null ? `<g opacity="${o.op}">${body}</g>` : body}</g>`;
  };

  // Describe a beat for the transcript without drawing anything.
  pg.desc = (text) => { pg.lines.push({ who: '', text, desc: true }); return ''; };

  return pg;
}

const shade = (hex, k) => {
  // k < 0 darkens, k > 0 lightens
  const v = parseInt(hex.slice(1), 16);
  const ch = [(v >> 16) & 255, (v >> 8) & 255, v & 255].map((c) => Math.round(k < 0 ? c * (1 + k) : c + (255 - c) * k));
  return '#' + ch.map((c) => c.toString(16).padStart(2, '0')).join('');
};

function limbPts(S, spec, l1, l2) {
  if (spec.to) {
    const T = spec.to, dx = T[0] - S[0], dy = T[1] - S[1];
    const d = clamp(Math.hypot(dx, dy), 1, l1 + l2 - 0.5);
    const base = Math.atan2(dy, dx);
    const a = Math.acos(clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1)) * (spec.bend || 1);
    const Eb = [S[0] + Math.cos(base - a) * l1, S[1] + Math.sin(base - a) * l1];
    const Hd = [S[0] + Math.cos(base) * d, S[1] + Math.sin(base) * d];
    return [S, Eb, Hd];
  }
  const Eb = [S[0] + Math.sin(spec[0] * D2R) * l1, S[1] + Math.cos(spec[0] * D2R) * l1];
  const Hd = [Eb[0] + Math.sin(spec[1] * D2R) * l2, Eb[1] + Math.cos(spec[1] * D2R) * l2];
  return [S, Eb, Hd];
}

// Two-layer stroke: ink outline under a coloured core, so limbs read as inked shapes.
function limb(pts, col, w, ow, ex = '') {
  const d = 'M' + pts.map((p) => `${n(p[0])} ${n(p[1])}`).join('L');
  return `<path d="${d}" fill="none" ${st(C.ink, w + ow * 2)} ${ex}/><path d="${d}" fill="none" ${st(col, w)}/>`;
}

/* ---------- faces (head-local) ---------- */

function faceParts(view, expr, o, c) {
  const [eyes, brows, mouth] = Array.isArray(expr) ? expr : (EXPR[expr] || EXPR.neutral);
  const lk = o.look || [0, 0];
  const side = view === 'side';
  const E1 = side ? [3, 0] : [-9, 0], E2 = side ? [16, -1] : [9, 0];
  const k2 = side ? 0.82 : 1;
  const M = side ? [12, 16] : [0, 16];
  let s = '';
  const eye = ([x, y], k) => {
    switch (eyes) {
      case 'wide': return Ci(x, y, 5.2 * k, '#FFFFFF', st(C.ink, 1.6)) + Ci(x + lk[0] * 2.2, y + lk[1] * 2, 2.1 * k, C.ink);
      case 'pin': return Ci(x, y, 5 * k, '#FFFFFF', st(C.ink, 1.6)) + Ci(x + lk[0] * 2, y + lk[1] * 2, 1.2, C.ink);
      case 'blank': return Ci(x, y, 4.6 * k, '#F4F4F0', st(C.ink, 1.6));
      case 'closed': return Pa(`M${x - 4.5 * k} ${y}q${4.5 * k} 3.5 ${9 * k} 0`, 'none', st(C.ink, 2.2));
      case 'narrow': return Pa(`M${x - 4 * k} ${y}h${8 * k}`, 'none', st(C.ink, 2.4));
      case 'lids': return E(x + lk[0], y + 1 + lk[1], 2.6 * k, 2.4, C.ink) + Pa(`M${x - 5 * k} ${y - 1}h${10 * k}`, 'none', st(C.ink, 2));
      default: return E(x + lk[0] * 1.5, y + lk[1] * 1.5, 2.6 * k, 3.4, C.ink);
    }
  };
  s += eye(E1, 1) + eye(E2, k2);
  // brows: [inner end, outer end] offsets; the inner end is the one nearer the nose
  const brow = ([x, y], k, innerRight) => {
    if (brows === 'none') return '';
    const by = y - 9;
    const [inn, out] = { flat: [0, 0], raised: [-3, -3], worried: [-3.5, 1], angry: [3.5, -1.5] }[brows] || [0, 0];
    const yl = by + (innerRight ? out : inn), yr = by + (innerRight ? inn : out);
    return Pa(`M${n(x - 5 * k)} ${n(yl)}L${n(x + 5 * k)} ${n(yr)}`, 'none', st(C.ink, 2.6));
  };
  s += brow(E1, 1, true) + brow(E2, k2, false);
  if (side) s += Pa('M20 -1 L26 9 L19 11', 'none', st(C.ink, 2.2));
  else s += Pa('M0 4 L-2 9 L2 10', 'none', st(C.ink, 1.8));
  const [mx, my] = M;
  switch (mouth) {
    case 'smile': s += Pa(`M${mx - 7} ${my - 1}q7 6 14 0`, 'none', st(C.ink, 2.4)); break;
    case 'grin': s += Pa(`M${mx - 9} ${my - 3}q9 2 18 0q-2 10 -9 10q-7 0 -9 -10Z`, '#FFFFFF', st(C.ink, 2.2)) + Pa(`M${mx - 8} ${my}h16`, 'none', st(C.ink, 1)); break;
    case 'biggrin': s += Pa(`M${mx - 18} ${my - 6}q18 4 34 -2q-4 16 -17 16q-13 0 -17 -14Z`, '#FFFFFF', st(C.ink, 2.4)) + Pa(`M${mx - 16} ${my - 1}h31` + [-12, -7, -2, 3, 8, 13].map((x) => `M${mx + x} ${my - 4}v10`).join(''), 'none', st(C.ink, 1.1)); break;
    case 'open': s += E(mx, my + 1, 4, 5, C.ink); break;
    case 'talk': s += E(mx, my, 4.6, 3, C.ink); break;
    case 'scream': s += E(mx, my + 2, 6.5, 10, C.ink) + E(mx, my + 7, 3.5, 3, '#7A2A2A'); break;
    case 'frown': s += Pa(`M${mx - 6} ${my + 3}q6 -5 12 0`, 'none', st(C.ink, 2.4)); break;
    case 'flat': s += Pa(`M${mx - 7} ${my}h13`, 'none', st(C.ink, 2.6)); break;
    case 'smirk': s += Pa(`M${mx - 6} ${my + 1}q8 2 12 -4`, 'none', st(C.ink, 2.4)); break;
    case 'tremble': s += Pa(`M${mx - 9} ${my - 1}q2 3 4.5 1q2 3 4.5 0q2 3 4.5 0q2 3 4.5 -2`, 'none', st(C.ink, 2.2)); break;
    default: s += Pa(`M${mx - 5} ${my}h10`, 'none', st(C.ink, 2.2));
  }
  if (o.tears) s += Pa(`M${E1[0]} ${E1[1] + 5}q-2 10 1 18`, 'none', st(C.screen, 2.2)) + Pa(`M${E2[0]} ${E2[1] + 5}q2 9 0 15`, 'none', st(C.screen, 1.8));
  if (o.blush) s += E(E1[0] - 2, 9, 5, 2.5, '#E07A6A', 'opacity=".45"');
  return s;
}

/* ---------- a staff figure ---------- */

// o: {x, y, s, pose, view:'side'|'front'|'back', face, flip, sil, rim, light:'side'|'under'|'top'|'none',
//     so (shadow opacity), props:[...] (replaces defaults), add:[...], no:[...], look, tilt, lean, arms:{na,fa}, legs:{nl,fl},
//     beam (head torch on), screen (glowing screen colour for held devices), cls, ex}
function fig(who, o = {}) {
  const c = CAST[who];
  const view = o.view || 'side';
  const s = (o.s || 1) * c.h;
  const W = c.w;
  const pose = Object.assign({}, POSES[o.pose || 'stand'] || POSES.stand, o.arms || {}, o.legs || {});
  const fpose = Object.assign({}, FRONT_POSES[o.pose] || FRONT_POSES.stand, o.farms || {});
  let props = (o.props || DEFAULT_PROPS[who]).concat(o.add || []).filter((p) => !(o.no || []).includes(p));
  if (view === 'back') props = props.filter((p) => !['tablet', 'clipboard'].includes(p));
  const has = (p) => props.includes(p);
  const sk = c.skin, top = c.top, pants = c.pants;
  const lwK = Math.pow(o.s || 1, -0.55);
  const OW = 3.3 * lwK;
  const sleeve = c.hoodie || c.suit ? 'long' : 'short';
  const sy = -276, hy = -150;
  const lean = o.lean != null ? o.lean : pose.lean || 0;
  const id = uid('f');

  // joints
  let NS_, FS_, NH_, FH_;
  if (view === 'side') { NS_ = [-4 * W, sy + 6]; FS_ = [14 * W, sy + 3]; NH_ = [-3, hy + 10]; FH_ = [9, hy + 10]; }
  else { NS_ = [36 * W, sy + 8]; FS_ = [-36 * W, sy + 8]; NH_ = [14, hy + 10]; FH_ = [-14, hy + 10]; }
  const mirrorFront = (spec) => (Array.isArray(spec) ? [-spec[0], -spec[1]] : spec);
  let na, fa, nl, fl;
  if (view === 'side') { na = pose.na; fa = pose.fa; nl = pose.nl; fl = pose.fl; }
  else {
    na = fpose.r; fa = mirrorFront(fpose.l);
    const legSpread = pose.sit ? [86, 4] : null;
    nl = legSpread || (pose.ground && o.pose === 'kneel' ? [4, -90] : [3, 0]);
    fl = legSpread || (pose.ground && o.pose === 'kneel' ? [-4, -90] : [-3, 0]);
    if (o.pose === 'slump') { nl = [8, -88]; fl = [-8, -88]; }
    if (view === 'back') { const t = na; na = fa; fa = t; }
  }
  const legL = [76, 70], armL = [64, 58];
  const nLeg = limbPts(NH_, nl, legL[0], legL[1]), fLeg = limbPts(FH_, fl, legL[0], legL[1]);
  // pivot upper body around hips for lean
  const rot = (p) => {
    if (!lean) return p;
    const a = lean * D2R, cx = 0, cy = hy;
    const dx = p[0] - cx, dy = p[1] - cy;
    return [cx + dx * Math.cos(a) - dy * Math.sin(a), cy + dx * Math.sin(a) + dy * Math.cos(a)];
  };
  const nArm = limbPts(rot(NS_), na, armL[0], armL[1]), fArm = limbPts(rot(FS_), fa, armL[0], armL[1]);
  // grounding: lowest foot or knee sits on y=0 unless sitting
  let yOff = 0;
  if (pose.ground || pose.sit) {
    const lows = [nLeg[1][1], nLeg[2][1] + 6, fLeg[1][1], fLeg[2][1] + 6];
    yOff = pose.sit ? -hy : -Math.max(...lows) + 0;
    if (pose.sit) yOff = 124;
  }

  // ---- parts ----
  const legCol = pants, farLeg = shade(pants, -0.25);
  const shoe = (L, col) => {
    const [, k, a] = L;
    const ang = Math.atan2(a[1] - k[1], a[0] - k[0]) / D2R - 90;
    return `<g transform="translate(${n(a[0])} ${n(a[1])}) rotate(${n(ang)})"><path d="M-9 -4 C-10 6 -6 9 0 9 L22 9 C24 4 18 0 8 -3 Z" fill="${C.ink}" ${st(C.ink, OW)}/></g>`;
  };
  const legsOut = (L, col) => limb(L, col, 21 * W, OW) + shoe(L, col);
  const handPt = (A) => A[2];
  const hand = (A, col, kind) => {
    const h = A[2];
    if (c.hoodie) return Ci(h[0], h[1], 10.5, top, st(C.ink, OW)) + Pa(`M${n(h[0] - 7)} ${n(h[1] - 4)}q7 -4 14 0`, 'none', st(shade(top, -0.3), 1.5));
    let s2 = Ci(h[0], h[1], 9.2, sk, st(C.ink, OW));
    if (kind === 'point') {
      const ang = Math.atan2(A[2][1] - A[1][1], A[2][0] - A[1][0]);
      const fx = h[0] + Math.cos(ang) * 17, fy = h[1] + Math.sin(ang) * 17;
      s2 = limb([[h[0], h[1]], [fx, fy]], sk, 5, OW * 0.8) + s2;
    }
    return s2;
  };
  const arm = (A, isNear) => {
    const col = isNear ? top : shade(top, -0.25), skin = isNear ? sk : shade(sk, -0.18);
    if (sleeve === 'long') return limb(A, col, 17 * W, OW);
    const sl = [A[0], [lerp(A[0][0], A[1][0], 0.62), lerp(A[0][1], A[1][1], 0.62)]];
    return limb(A, skin, 14 * W, OW) + limb(sl, col, 19 * W, OW) + Ln(sl[1][0], sl[1][1], lerp(sl[1][0], sl[0][0], 0.06), lerp(sl[1][1], sl[0][1], 0.06), C.y, 2.2 * lwK);
  };

  // torso
  let torso, collar = '';
  if (view === 'side') {
    torso = `M${-24 * W} ${sy + 8}C${-31 * W} ${sy + 52} ${-28 * W} ${hy - 40} ${-25 * W} ${hy + 6}L${25 * W} ${hy + 6}C${28 * W} ${hy - 40} ${31 * W} ${sy + 64} ${23 * W} ${sy + 14}Q${17 * W} ${sy - 4} 4 ${sy - 6}Q${-16 * W} ${sy - 6} ${-24 * W} ${sy + 8}Z`;
    if (c.suit) collar = Pa(`M-2 ${sy - 5}L12 ${sy + 40}L20 ${sy + 4}Z`, '#F4F2EC', st(C.ink, OW * 0.7)) + Pa(`M10 ${sy + 4}L15 ${sy + 6}L14 ${sy + 46}L11 ${sy + 52}L9 ${sy + 44}Z`, C.y, st(C.ink, 1.4));
    else if (!c.hoodie) collar = Pa(`M-6 ${sy - 6}L8 ${sy + 16}L18 ${sy - 2}Z`, top, st(C.y, 2.4 * lwK)) + Ln(8, sy + 16, 8, sy + 44, shade(top, -0.4), 1.6) + Ci(-12 * W, sy + 40, 4, C.y);
  } else {
    torso = `M${-38 * W} ${sy + 10}Q${-40 * W} ${sy - 4} ${-24 * W} ${sy - 6}L${24 * W} ${sy - 6}Q${40 * W} ${sy - 4} ${38 * W} ${sy + 10}C${36 * W} ${sy + 64} ${32 * W} ${hy - 30} ${31 * W} ${hy + 6}L${-31 * W} ${hy + 6}C${-32 * W} ${hy - 30} ${-36 * W} ${sy + 64} ${-38 * W} ${sy + 10}Z`;
    if (view === 'front') {
      if (c.suit) collar = Pa(`M-12 ${sy - 6}L0 ${sy + 46}L12 ${sy - 6}Z`, '#F4F2EC', st(C.ink, OW * 0.7)) + Pa(`M-4 ${sy + 2}L4 ${sy + 2}L5 ${sy + 48}L0 ${sy + 56}L-5 ${sy + 48}Z`, C.y, st(C.ink, 1.4));
      else if (!c.hoodie) collar = Pa(`M-14 ${sy - 6}L0 ${sy + 18}L14 ${sy - 6}`, top, st(C.y, 2.4 * lwK)) + Ln(0, sy + 18, 0, sy + 44, shade(top, -0.4), 1.6) + Ci(-18 * W, sy + 34, 4, C.y);
    }
  }
  const pantsTop = view === 'side'
    ? Pa(`M${-25 * W} ${hy - 2}L${25 * W} ${hy - 2}L${24 * W} ${hy + 26}L${-24 * W} ${hy + 26}Z`, pants, st(C.ink, OW))
    : Pa(`M${-31 * W} ${hy - 2}L${31 * W} ${hy - 2}L${30 * W} ${hy + 26}L${-30 * W} ${hy + 26}Z`, pants, st(C.ink, OW));
  let torsoS = Pa(torso, top, st(C.ink, OW));
  if (c.hoodie) {
    // hoodie: kangaroo pocket, drawstrings, the uniform collar peeking out
    torsoS += view === 'back' ? Pa(`M-26 ${sy + 2}C-20 ${sy + 30} 20 ${sy + 30} 26 ${sy + 2}`, 'none', st(shade(top, -0.3), 2)) :
      Pa(view === 'side' ? `M-6 ${hy - 50}L22 ${hy - 50}L24 ${hy - 6}L-10 ${hy - 6}Z` : `M-22 ${hy - 52}L22 ${hy - 52}L26 ${hy - 6}L-26 ${hy - 6}Z`, 'none', st(shade(top, -0.35), 2)) +
      Pa(view === 'side' ? `M-4 ${sy - 6}L8 ${sy + 8}L18 ${sy - 4}` : `M-12 ${sy - 6}L0 ${sy + 8}L12 ${sy - 6}`, C.navy, st(C.y, 2)) +
      (view === 'side' ? Ln(10, sy + 4, 12, sy + 40, '#EEE', 1.6) : Ln(-5, sy + 2, -6, sy + 40, '#EEE', 1.6) + Ln(5, sy + 2, 6, sy + 40, '#EEE', 1.6));
  }
  torsoS += collar;

  // head
  const HC = view === 'side' ? [2, -318] : [0, -318];
  const hp = hairParts(c.hs, view, c.hair);
  const headShape = view === 'side'
    ? 'M-20 -318C-20 -350 24 -352 24 -322L26 -310C27 -300 20 -292 10 -291C-6 -290 -16 -298 -20 -308Z'
    : 'M-22 -318C-22 -352 22 -352 22 -318C22 -298 12 -290 0 -290C-12 -290 -22 -298 -22 -318Z';
  const neck = view === 'side' ? R(-7, -300, 16, 28, shade(sk, -0.12), st(C.ink, OW)) : R(-8, -300, 16, 28, shade(sk, -0.12), st(C.ink, OW));
  const ear = view === 'side' ? E(-10, -316, 4.5, 7, sk, st(C.ink, OW * 0.8)) : view === 'front' ? E(-23, -316, 4, 7, sk, st(C.ink, OW * 0.8)) + E(23, -316, 4, 7, sk, st(C.ink, OW * 0.8)) : '';
  const tilt = o.tilt || 0;
  const faceS = view === 'back' ? '' : `<g transform="translate(${HC[0]} ${HC[1]})">${faceParts(view, o.face || 'neutral', o, c)}</g>`;
  const headInner = (view === 'back' ? '' : Pa(headShape, sk, st(C.ink, OW))) + ear + faceS +
    `<g transform="translate(${HC[0]} ${HC[1]})">${hp.front}</g>`;

  // props
  const back = [], frontP = [], handP = [], neckP = [];
  if (has('cable') && view !== 'back') back.push(`<g transform="translate(${view === 'side' ? -30 : -40} ${sy + 34})">${[0, 4, 8].map((k) => E(0, 0, 30 - k, 34 - k, 'none', st(k === 4 ? '#E08A1E' : C.ink, k === 4 ? 6 : 3))).join('')}${E(0, 0, 13, 16, C.ink)}</g>`);
  if (has('cable') && view === 'back') frontP.push(`<g transform="translate(0 ${sy + 50})">${[0, 4, 8].map((k) => E(0, 0, 34 - k, 38 - k, 'none', st(k === 4 ? '#E08A1E' : C.ink, k === 4 ? 6 : 3))).join('')}${E(0, 0, 14, 17, C.ink)}</g>`);
  if (has('cable') && view !== 'back') frontP.push(Pa(view === 'side' ? `M-20 ${sy}L20 ${hy - 20}` : `M-30 ${sy}L26 ${hy - 20}`, 'none', st(C.ink, 7) ) + Pa(view === 'side' ? `M-20 ${sy}L20 ${hy - 20}` : `M-30 ${sy}L26 ${hy - 20}`, 'none', st('#5A4A3A', 4)));
  if (has('lanyard') && view !== 'back') {
    const cx = view === 'side' ? 6 : 0;
    frontP.push(Pa(`M${cx - 10} ${sy - 4}L${cx - 2} ${sy + 50}M${cx + 10} ${sy - 4}L${cx + 2} ${sy + 50}`, 'none', st(C.y, 4.2 * lwK)) +
      R(cx - 9, sy + 48, 18, 24, '#FFFFFF', st(C.ink, 1.6)) + R(cx - 9, sy + 48, 18, 6, C.y) + Ln(cx - 5, sy + 62, cx + 5, sy + 62, C.ink, 1.6) + Ln(cx - 5, sy + 67, cx + 3, sy + 67, C.ink, 1.2) +
      (who === 'luka' ? Ci(cx, sy + 78, 4, 'none', st('#9AA0A6', 2)) + Pa(`M${cx} ${sy + 82}l-3 10l4 2`, 'none', st('#9AA0A6', 2.4)) : ''));
  }
  if (has('keyring') && view !== 'back') frontP.push(Ln(view === 'side' ? 18 : 22, hy + 6, view === 'side' ? 20 : 24, hy + 22, '#9AA0A6', 1.6) + `<g transform="translate(${view === 'side' ? 20 : 24} ${hy + 30})">${Ci(0, 0, 8, '#FFFFFF', st(C.ink, 1.8))}${Pa('M-7 -3Q0 2 7 -3M-5 5Q0 -2 2 -8M2 7Q1 0 7 -2', 'none', st('#1E5AA8', 1.4))}</g>`);
  if (has('headphones') && view !== 'back') {
    const hx = view === 'side' ? 2 : 0;
    neckP.push(Pa(`M${hx - 18} ${sy - 4}Q${hx} ${sy + 18} ${hx + 18} ${sy - 4}`, 'none', st(C.ink, 6)) + E(hx - 19, sy - 6, 8, 10, '#26272C', st(C.ink, OW)) + E(hx + 19, sy - 6, 8, 10, '#26272C', st(C.ink, OW)) + E(hx + 19, sy - 6, 3.5, 5, C.y));
  }
  if (has('laptop')) back.push(R(view === 'side' ? -40 : -54, sy + 40, 12, 72, '#4A4D55', st(C.ink, OW)) + Ln(view === 'side' ? -36 : -50, sy + 44, view === 'side' ? -36 : -50, sy + 108, '#9AA0A6', 1.4));
  const hn = handPt(nArm);
  if (has('clipboard') && view !== 'back') {
    const ang = Math.atan2(nArm[2][1] - nArm[1][1], nArm[2][0] - nArm[1][0]) / D2R - 90;
    handP.push(`<g transform="translate(${n(hn[0])} ${n(hn[1])}) rotate(${n(ang)})">${R(-16, -4, 32, 42, '#9C7A4C', st(C.ink, OW))}${R(-12, 2, 24, 32, '#FAF8F0')}${R(-7, -7, 14, 7, '#9AA0A6', st(C.ink, 1.4))}${[10, 16, 22, 28].map((y) => Ln(-8, y, 8, y, '#8A8A8A', 1.2)).join('')}</g>`);
  }
  if (has('tablet') && view !== 'back') handP.push(`<g transform="translate(${n(hn[0] + 4)} ${n(hn[1] - 26)}) rotate(-8)">${R(-15, -2, 30, 40, C.y, `rx="5" ${st(C.ink, OW)}`)}${R(-11, 3, 22, 30, o.screen || '#20262E', 'rx="2" class="lit"')}</g>`);
  if (has('gimbal') && view !== 'back') {
    const scr = o.screen || '#CFE9F5';
    handP.push(`<g transform="translate(${n(hn[0])} ${n(hn[1])})">${R(-3, -40, 6, 40, '#2A2B30', st(C.ink, 1.6))}${R(-11, -66, 22, 30, '#15161A', `rx="3" ${st(C.ink, 1.6)}`)}${R(-8, -63, 16, 24, scr, 'rx="1.5" class="lit"')}${Ci(0, -82, 11, 'none', `class="lit" ${st('#FFFFFF', 4)}`)}${Ci(0, -82, 11, 'none', st(C.ink, 1))}</g>`);
  }
  if (has('phoneEar') && view !== 'back') handP.push(`<g transform="translate(${n(hn[0])} ${n(hn[1])}) rotate(-8)">${R(-8, -22, 16, 34, '#15161A', `rx="3" ${st(C.ink, 1.6)}`)}${o.screen ? R(-5.5, -19, 11, 28, o.screen, 'rx="1.5" class="lit"') : ''}</g>`);
  if (has('phoneHand') && view !== 'back') handP.push(`<g transform="translate(${n(hn[0])} ${n(hn[1])}) rotate(-12)">${R(-9, -24, 18, 32, '#15161A', `rx="3" ${st(C.ink, 1.6)}`)}${R(-6.5, -21, 13, 26, o.screen || C.screen, 'rx="1.5" class="lit"')}</g>`);
  if (has('scanner') && view !== 'back') {
    const ang = Math.atan2(nArm[2][1] - nArm[1][1], nArm[2][0] - nArm[1][0]) / D2R;
    handP.push(`<g transform="translate(${n(hn[0])} ${n(hn[1])}) rotate(${n(ang - 30)})">${Pa('M-6 -6 L26 -10 L30 0 L4 6 L2 22 L-8 22 Z', '#3A3C42', st(C.ink, OW))}${R(26, -9, 4, 8, C.laser, 'class="lit"')}${o.laser ? `<path class="lit" d="M30 -5 L${o.laser} -5" stroke="${C.laser}" stroke-width="2.2" opacity=".9"/>` : ''}</g>`);
  }
  let torchS = '';
  if (has('headtorch') && view !== 'back') {
    const lx = view === 'side' ? 26 : 0, ly = -332;
    torchS = Pa(view === 'side' ? 'M-21 -330C-8 -336 12 -338 25 -334L25 -328C12 -331 -8 -330 -21 -324Z' : 'M-23 -334C-10 -338 10 -338 23 -334L23 -328C10 -332 -10 -332 -23 -328Z', '#1A1A1A', st(C.ink, 1.5)) +
      R(lx - 6, ly - 6, 12, 10, '#2A2B30', st(C.ink, 1.6)) + Ci(lx + (view === 'side' ? 2 : 0), ly - 1, 3.6, o.beam ? '#FFFBE0' : '#CFCFC4', 'class="lit"');
    if (o.beam) back.unshift(`<path class="lit" d="M${lx} ${ly}L${lx + 520} ${ly - 160}L${lx + 520} ${ly + 120}Z" fill="url(#gCone)" transform="rotate(${o.beam === true ? 0 : o.beam} ${lx} ${ly})" opacity=".9"/>`);
  }

  // shading: shadow shape clipped to torso + head
  const light = o.light || 'side', so = o.so == null ? 0.42 : o.so;
  let shadeS = '';
  if (!o.sil && light !== 'none') {
    const cl = `<clipPath id="${id}s"><path d="${torso}"/><path d="${headShape}"/></clipPath>`;
    let sh = '';
    if (light === 'side') sh = Pa(view === 'side' ? `M-90 -400L-6 -400Q-20 -300 -4 -230Q-14 -180 -2 -100L-90 -100Z` : 'M-90 -400L-8 -400Q-22 -300 -6 -230Q-14 -180 -6 -100L-90 -100Z', C.ink, `opacity="${so}"`);
    else if (light === 'front') sh = Pa('M90 -400L10 -400Q24 -300 8 -230Q16 -180 6 -100L90 -100Z', C.ink, `opacity="${so}"`);
    else if (light === 'under') sh = R(-80, -360, 160, 230, 'url(#gUnder)', `opacity="${Math.min(1, so + 0.35)}"`) + R(-80, -330, 160, 200, 'url(#gUnderS)', `opacity=".9"`);
    else if (light === 'top') sh = R(-80, -300, 160, 200, 'url(#gFadeUp)', `opacity="${so}" transform="rotate(180 0 -200)"`);
    else if (light === 'dark') sh = R(-80, -400, 160, 300, C.ink, `opacity="${so}"`);
    shadeS = cl + `<g clip-path="url(#${id}s)">${sh}</g>`;
  }

  const farLegS = legsOut(fLeg, farLeg), nearLegS = legsOut(nLeg, legCol);
  const upper = `<g${lean ? ` transform="rotate(${lean} 0 ${hy})"` : ''}>${hp.back ? `<g transform="translate(${HC[0]} ${HC[1]})">${hp.back}</g>` : ''}${torsoS}${neck}${shadeS ? '' : ''}</g>`;
  const headG = `<g transform="${lean ? `rotate(${lean} 0 ${hy}) ` : ''}rotate(${tilt} ${HC[0]} -296)">${headInner}${torchS}</g>`;
  const handKind = pose.hand;
  const body =
    back.join('') +
    (view === 'back' ? '' : arm(fArm, false) + hand(fArm, top, '')) +
    farLegS + nearLegS + pantsTop + upper +
    (shadeS ? `<g${lean ? ` transform="rotate(${lean} 0 ${hy})"` : ''}>${shadeS}</g>` : '') +
    `<g${lean ? ` transform="rotate(${lean} 0 ${hy})"` : ''}>${neckP.join('')}${frontP.join('')}</g>` +
    headG +
    (view === 'back' ? arm(fArm, true) + hand(fArm, top, '') : '') +
    arm(nArm, true) + hand(nArm, top, handKind) + handP.join('');

  const fl_ = o.flip ? -1 : 1;
  // Report world positions of hands and head so a page can attach lasers, beams, balloon tails.
  if (o.out) {
    const wp = (p) => [(o.x || 0) + p[0] * s * fl_, (o.y || 0) + (p[1] + yOff) * s];
    o.out.nh = wp(nArm[2]); o.out.fh = wp(fArm[2]); o.out.head = wp(rot(HC)); o.out.mouth = wp(rot([HC[0] + (view === 'side' ? 12 : 0), HC[1] + 16]));
    o.out.scale = s; o.out.flip = fl_;
  }
  const T = `translate(${n(o.x || 0)} ${n((o.y || 0))}) scale(${n(s * fl_ * 1000) / 1000} ${n(s * 1000) / 1000})${yOff ? ` translate(0 ${n(yOff)})` : ''}`;
  const cls = `fig fig-${who}${o.sil ? ' sil' : ''} ${o.cls || ''}`;
  if (o.rim) {
    const rimCls = o.rim === C.screen || o.rim === 'screen' ? 'rimS' : o.rim === 'white' ? 'rimW' : 'rimY';
    const dx = o.rimDx == null ? -5 : o.rimDx;
    return `<g class="${cls}" ${o.ex || ''}><g transform="${T}"><g class="${rimCls}" transform="translate(${dx} -2)">${body}</g><g class="sil">${body}</g></g></g>`;
  }
  return `<g class="${cls}" ${o.ex || ''}><g transform="${T}">${body}</g></g>`;
}

// Head and shoulders only, for close-ups (cheaper than a whole figure and drawn bigger).
function bust(who, o = {}) {
  return fig(who, Object.assign({}, o, { cls: (o.cls || '') + ' bust' }));
}

/* ---------- the Customers ---------- */

const CUSTOMER_KINDS = {
  hivis: { coat: '#D8762C', trim: '#C9CCC8', under: '#2E3236', legs: '#2B2F3A' },
  suit: { coat: '#17181C', trim: '#ECE9E2', under: '#ECE9E2', legs: '#17181C' },
  wind: { coat: '#2F8C8C', trim: '#5B3C88', under: '#C2457E', legs: '#2A2E3A' },
  gown: { coat: '#9DB8C8', trim: '#7E9AAA', under: '#9DB8C8', legs: '#B9A493' },
  rain: { coat: '#2F4A3A', trim: '#1E3328', under: '#2F4A3A', legs: '#25282E' },
  cardi: { coat: '#6E5640', trim: '#4E3C2C', under: '#B9B2A2', legs: '#3A3A40' },
  school: { coat: '#5D7FA8', trim: '#3D5F88', under: '#5D7FA8', legs: '#4B4F57' },
  bride: { coat: '#D8D2C6', trim: '#BDB6A8', under: '#D8D2C6', legs: '#D8D2C6' },
};
const CUSTOMER_ORDER = ['hivis', 'suit', 'wind', 'gown', 'rain', 'cardi', 'school', 'bride'];

// A frozen video-call face: smeared compression blocks, doubled eyes, mouth stuck mid-word.
function blockFace(cx, cy, seed, o = {}) {
  const r = rng(seed);
  const tones = o.tones || ['#C9A68A', '#B48C70', '#9E7A62', '#D9B9A0', '#8C6C58'];
  const B = o.block || 7, rx = 22, ry = 27;
  const buckets = tones.map(() => '');
  for (let y = -ry; y < ry; y += B) {
    const smear = r() < 0.3 ? r.jit(10) : 0;
    for (let x = -rx; x < rx; x += B) {
      const nx = (x + B / 2) / rx, ny = (y + B / 2) / ry;
      if (nx * nx + ny * ny > 1.05) continue;
      const k = Math.floor(r() * tones.length);
      const w = r() < 0.15 ? B * (2 + r() * 2) : B;
      buckets[k] += `M${n(cx + x + smear)} ${n(cy + y)}h${n(w)}v${B}h${n(-w)}Z`;
    }
  }
  let s = buckets.map((d, k) => (d ? `<path d="${d}" fill="${tones[k]}"/>` : '')).join('');
  // eyes doubled by artefacts, mouth stuck mid-word
  const ey = cy - 3;
  for (const [dx, dy, op] of [[0, 0, 1], [4 + r() * 3, -3, 0.55]]) {
    s += `<g opacity="${op}">${R(cx - 13 + dx, ey + dy, 8, 5, '#1A1414')}${R(cx + 5 + dx, ey + dy, 8, 5, '#1A1414')}</g>`;
  }
  s += R(cx - 6, cy + 11, 12, 8, '#2A1616') + R(cx - 4, cy + 13, 8, 2, '#5A2A2A');
  // horizontal smear streaks
  for (let i = 0; i < 3; i++) {
    const yy = cy + r.jit(ry * 0.8);
    s += R(cx - rx + r.jit(6), yy, rx * (1.3 + r() * 0.8), 2 + r() * 3, r.pick(tones), 'opacity=".75"');
  }
  return s;
}

// o: {x, y, s, kind, flip, ticket, op, sil, seed, back, faceOp, wet}
function customer(o = {}) {
  const k = CUSTOMER_KINDS[o.kind || 'rain'];
  const s = o.s || 1, seed = o.seed || `${o.x},${o.y},${o.kind}`;
  const r = rng(seed);
  const OW = 2.6 * Math.pow(s, -0.5);
  const sy = -276, hy = -150;
  let b = '';
  // legs
  b += limb([[-10, hy], [-12, -76], [-11, -4]], k.legs, 19, OW) + limb([[10, hy], [11, -76], [12, -4]], shade(k.legs, -0.2), 19, OW);
  b += E(-11, -3, 13, 6, C.ink) + E(12, -3, 13, 6, C.ink);
  // coat / body
  const hem = o.kind === 'gown' || o.kind === 'bride' ? -70 : o.kind === 'rain' || o.kind === 'suit' ? -108 : -132;

  if (o.kind === 'suit') b += Pa(`M-12 ${sy - 6}L0 ${sy + 50}L12 ${sy - 6}Z`, k.trim) + Ln(0, sy, 0, sy + 50, C.ink, 4) + Ci(-20, sy + 26, 5, '#E9E1D4', st(C.ink, 1.2));

  if (o.kind === 'rain') b += Pa(`M-26 ${sy - 4}Q0 ${sy - 60} 26 ${sy - 4}`, k.coat, st(C.ink, OW));

  b += limb([[-30, sy + 10], [-36, -204], [-34, -150]], shade(k.coat, -0.15), 15, OW) + Ci(-34, -146, 8, '#B9A493', st(C.ink, OW));

  b += o.back ? E(0, -318, 22, 27, shade(k.coat, -0.5), st(C.ink, OW)) + Pa('M-22 -326C-18 -350 18 -350 22 -326C10 -334 -10 -334 -22 -326Z', '#1E1A16') : face;
  // wet: plastered hair and drips
  if (!o.back) b += Pa('M-23 -322C-24 -350 22 -352 23 -324L18 -336L10 -330L2 -338L-6 -330L-14 -338Z', r.pick(['#2A2018', '#3A2E22', '#1A1612', '#6A645C']), st(C.ink, 1.4));

}

// Single-file line of Customers from near (x0,y0,s0) to far (x1,y1,s1). Drawn far-to-near.
function queueLine(o) {
  const N = o.count || 8, out = [];
  for (let i = N - 1; i >= 0; i--) {
    const t = N === 1 ? 0 : Math.pow(i / (N - 1), o.ease || 1);
    const x = lerp(o.x0, o.x1, t), y = lerp(o.y0, o.y1, t), s = lerp(o.s0, o.s1, t);
    const kind = CUSTOMER_ORDER[(i + (o.offset || 0)) % CUSTOMER_ORDER.length];
    out.push(customer(Object.assign({}, o.each || {}, { x, y, s, kind, seed: `${o.seed || 'q'}${i}`, flip: o.flip, sil: o.sil || (o.silFar && i > o.silFar), op: o.fadeFar ? lerp(1, o.fadeFar, t) : o.op, back: o.back })));
  }
  return out.join('');
}

/* ---------- the Ollie standee: hidden on every page, tap him and he blinks ---------- */

// o: {x, y, s, back, dark, wave, turn (face direction -1/1), id}
let _ollieShift = 0; // second read: he starts a little further along than last time (set per page render)
function ollie(o = {}) {
  const s = o.s || 1;
  o = Object.assign({}, o, { x: o.x + _ollieShift * s * (o.flip ? -1 : 1) });
  const dark = !!o.dark;
  const body = dark ? '#1E1C10' : C.y;
  const line = C.ink;
  let g = '';
  g += E(0, 2, 46, 8, '#000', 'opacity=".35"');

  g += Pa('M-18 -120 L-24 -6 M18 -120 L24 -6', 'none', st(line, 5)) + E(-28, -5, 11, 5, line) + E(28, -5, 11, 5, line);
  if (o.back) {
    g += Ci(0, -190, 72, dark ? '#16140C' : C.card, st(line, 5)) + Pa('M0 -190 L0 -30 M-30 -150 L0 -60 M30 -150 L0 -60', 'none', st(dark ? '#2A2618' : '#8E7650', 4)) +
      Pa('M-70 -186 L-104 -150 M70 -186 L104 -150', 'none', st(line, 5)) + Ci(-106, -148, 6, line) + Ci(106, -148, 6, line);
  } else {

    g += Ci(0, -190, 72, body, st(line, 5));
    if (!dark) g += Pa('M30 -250 A72 72 0 0 1 40 -130 A80 80 0 0 0 30 -250Z', '#E0A800', 'opacity=".8"') + Pa('M-40 -238 q16 -14 36 -16', 'none', st('#FFF3B0', 6));
    // white bandit mask with two black eyes

    g += `<g class="ol-eyes">${E(-26 + tx, -206, 10, 13, line)}${E(26 + tx, -206, 10, 13, line)}${Ci(-23 + tx, -211, 3, '#FFFFFF')}${Ci(29 + tx, -211, 3, '#FFFFFF')}</g>`;

/* ---- 30-env.js ---- */
/* SOS ONLY — environment kit: weather, light, the store and its fittings, the outside world. */

/* ---------- weather and light ---------- */

// Two layers of diagonal rain at different speeds. Seamless: each layer slides one tile height.
function rainFx(box, o = {}) {
  const [x, y, w, h] = box, ang = o.ang == null ? 14 : o.ang;
  const cx = x + w / 2, cy = y + h / 2, big = Math.hypot(w, h) + 60;
  const layer = (pat, cls, op, tile) =>
    `<g transform="rotate(${ang} ${n(cx)} ${n(cy)})"><g class="${cls}"><rect x="${n(cx - big / 2)}" y="${n(cy - big / 2 - tile)}" width="${n(big)}" height="${n(big + tile * 2)}" fill="url(#${pat})" opacity="${op}"/></g></g>`;
  const cid = uid('rc');
  return `<g class="rain" pointer-events="none"${o.noClip ? '' : ` clip-path="url(#${cid})"`}>${o.noClip ? '' : `<clipPath id="${cid}"><rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}"/></clipPath>`}${o.only !== 'A' ? layer(o.dark ? 'rainD' : 'rainB', 'fx-rainB', o.op2 == null ? 0.85 : o.op2, 300) : ''}${o.only !== 'B' ? layer(o.dark ? 'rainD' : 'rainA', 'fx-rainA', o.op == null ? 1 : o.op, 180) : ''}</g>`;
}

// Droplets and runs on glass.
function glassDrops(box, seed, count = 40, col = '#CFE3F0') {
  const r = rng(seed), [x, y, w, h] = box;
  let s = '';
  for (let i = 0; i < count; i++) {
    const px = x + r() * w, py = y + r() * h, l = 6 + r() * 40;
    s += `<path d="M${n(px)} ${n(py)}q-1.5 ${n(l * 0.6)} 0 ${n(l)}" fill="none" stroke="${col}" stroke-width="${n(1 + r() * 1.6)}" stroke-linecap="round" opacity="${n(0.25 + r() * 0.4)}"/>`;
    if (r() < 0.5) s += Ci(px, py + l, 1.6 + r() * 1.6, col, `opacity="${n(0.35 + r() * 0.3)}"`);
  }
  return `<g pointer-events="none">${s}</g>`;
}

// Lightning: a soft flash plus a bolt, at most once per ~5.6 s, capped brightness. Never in reduced motion.
function lightningFx(box, o = {}) {
  const [x, y, w, h] = box, r = rng(o.seed || 'bolt');
  let px = o.bx == null ? x + w * 0.6 : o.bx, py = y;
  const pts = [[px, py]];
  while (py < (o.by || y + h * 0.55)) { py += 22 + r() * 30; px += r.jit(26); pts.push([px, py]); }
  const bolt = Pa(pathOf(pts, false), 'none', st('#F4F8FF', 3.2)) + Pa(pathOf(pts, false), 'none', st('#BFD9FF', 9, 'opacity=".35"'));
  return `<g class="fx-light" pointer-events="none" style="animation-delay:${o.delay || 0}s">${R(x, y, w, h, '#DDE8FF', 'opacity=".5"')}${bolt}</g>`;
}

// A ceiling fluorescent tube and the cone of light under it.
function fluoro(x, y, w, o = {}) {
  const on = o.on !== false;
  const tube = R(x, y, w, 9, on ? '#F7FBFF' : '#55585E', `rx="4" ${st(C.ink, 2)}`);
  const cone = on && o.cone !== false ? `<path d="M${n(x)} ${n(y + 8)}L${n(x + w)} ${n(y + 8)}L${n(x + w + (o.spread || 60))} ${n(y + (o.drop || 260))}L${n(x - (o.spread || 60))} ${n(y + (o.drop || 260))}Z" fill="url(#gCone)" opacity="${o.coneOp || 0.7}"/>` : '';
  const g = on ? glow(x + w / 2, y + 4, w * 0.7, 22, 'gW', 0.6) : '';
  return `<g${o.flicker ? ' class="fx-flicker"' : ''}>${cone}${g}${tube}</g>`;
}

/* ---------- phones, screens, devices ---------- */

// A handset. o: {screen (fill), lit, content(sx,sy,sw,sh), stand, ring, rot, cls, body}
function phoneObj(x, y, w, h, o = {}) {
  const rr = Math.min(w, h) * 0.14;
  let s = '';
  if (o.stand) s += R(x + w * 0.3, y + h - 4, w * 0.4, h * 0.22, '#2B2D33', st(C.ink, 2)) + R(x + w * 0.12, y + h + h * 0.18, w * 0.76, h * 0.07, '#1A1B1F', st(C.ink, 2));
  if (o.lit && o.halo !== false) s += glow(x + w / 2, y + h / 2, w * 1.4, h * 0.95, o.haloGrad || 'gS', o.haloOp || 0.45);
  s += R(x, y, w, h, o.body || '#141518', `rx="${n(rr)}" ${st(C.ink, Math.max(1.5, w * 0.05))}`);
  const sx = x + w * 0.08, sy = y + h * 0.06, sw = w * 0.84, sh = h * 0.88;
  s += R(sx, sy, sw, sh, o.screen || (o.lit ? '#CFEFFB' : '#1D232B'), `rx="${n(rr * 0.6)}"${o.lit ? ' class="lit"' : ''}`);
  if (!o.lit && o.glare !== false) s += Pa(`M${n(sx + sw * 0.15)} ${n(sy)}L${n(sx + sw * 0.55)} ${n(sy)}L${n(sx)} ${n(sy + sh * 0.45)}L${n(sx)} ${n(sy + sh * 0.2)}Z`, '#FFFFFF', 'opacity=".06"');
  if (o.content) s += o.content(sx, sy, sw, sh);
  if (o.ring) s += `<g class="fx-ring" style="--rd:${o.ringDelay || 0}s" pointer-events="none">${Pa(`M${n(x - w * 0.25)} ${n(y + h * 0.2)}q-${n(w * 0.18)} ${n(h * 0.3)} 0 ${n(h * 0.6)}M${n(x + w * 1.25)} ${n(y + h * 0.2)}q${n(w * 0.18)} ${n(h * 0.3)} 0 ${n(h * 0.6)}`, 'none', st(o.ringCol || C.y, Math.max(2, w * 0.07)))}</g>`;
  const tf = o.rot ? ` transform="rotate(${o.rot} ${n(x + w / 2)} ${n(y + h / 2)})"` : '';
  return `<g class="phone ${o.cls || ''}"${tf}>${s}</g>`;
}

// Status-bar style signal readout used inside screens. kind: 'bars4' | 'bars3' | '3g' | 'sos' | '5g'
function signalGlyph(x, y, s, kind, col = C.ink) {
  const bars = { bars4: 4, bars3: 3, '3g': 2, sos: 0, '5g': 4, none: 0 }[kind] ?? 4;
  let g = '';
  for (let i = 0; i < 4; i++) g += R(x + i * 7 * s, y + (12 - (i + 1) * 3) * s, 5 * s, (i + 1) * 3 * s, i < bars ? col : 'none', i < bars ? '' : st(col, 1 * s, 'opacity=".5"'));
