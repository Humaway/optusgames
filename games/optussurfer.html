<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Optus Surfers</title>
    <style>
        /* CSS Reset & UI Polish */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #05161A;
            color: #ffffff;
            overflow: hidden;
            touch-action: none;
            user-select: none;
        }
        #gameContainer {
            position: relative; width: 100vw; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background: linear-gradient(180deg, #021114 0%, #052b30 100%);
        }
        canvas { display: block; width: 100%; height: 100%; }

        /* UI Layer */
        #uiLayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        #scoreBoard {
            position: absolute; top: 20px; left: 20px;
            background: rgba(0, 48, 56, 0.8); border: 2px solid #00A3AD;
            padding: 12px 25px; border-radius: 12px; font-size: 22px; font-weight: 800;
            color: #fff; box-shadow: 0 4px 15px rgba(0, 163, 173, 0.3);
            display: flex; align-items: center; gap: 10px;
            transition: transform 0.1s;
        }
        .score-pulse { transform: scale(1.1); color: #F2A900; }

        /* Game Over Panel */
        #gameOverPanel {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 10, 12, 0.75);
            backdrop-filter: blur(6px);
            display: none; flex-direction: column; justify-content: center; align-items: center;
            pointer-events: auto; opacity: 0; transition: opacity 0.5s ease;
        }
        
        .panel-content {
            background: #ffffff; color: #333; padding: 40px 60px; border-radius: 20px;
            text-align: center; border: 4px solid #00A3AD; 
            box-shadow: 0 0 40px rgba(0, 163, 173, 0.6);
            transform: translateY(20px); transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .panel-content h1 {
            color: #F2A900; font-size: 52px; margin-bottom: 15px;
            text-transform: uppercase; letter-spacing: 2px;
            text-shadow: 1px 1px 0px #333, -1px -1px 0px #333, 1px -1px 0px #333, -1px 1px 0px #333, 3px 3px 5px rgba(0,0,0,0.3);
        }

        .panel-content p { font-size: 22px; margin-bottom: 35px; color: #444; }
        
        #restartBtn {
            background: #F2A900; color: #111; border: none; padding: 15px 50px;
            font-size: 22px; font-weight: bold; border-radius: 40px; cursor: pointer;
            transition: all 0.2s ease; box-shadow: 0 6px 0 #c28700, 0 10px 20px rgba(0,0,0,0.2);
        }
        #restartBtn:hover { background: #ffce00; transform: translateY(2px); box-shadow: 0 4px 0 #c28700, 0 6px 15px rgba(0,0,0,0.2); }
        #restartBtn:active { transform: translateY(6px); box-shadow: none; }
        
        #controlsHint {
            position: absolute; bottom: 25px; width: 100%; text-align: center;
            color: rgba(255, 255, 255, 0.4); font-size: 13px; letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
    
    <div id="uiLayer">
        <div id="scoreBoard">Phones: <span id="score">0</span></div>
        <div id="controlsHint">Use Arrow Keys or WASD to Move • Up to Jump • Down to Slide</div>
        
        <div id="gameOverPanel" id="gameOverUI">
            <div class="panel-content" id="panelContent">
                <h1>CAUGHT!</h1>
                <p>You collected <strong id="finalScore">0</strong> phones!</p>
                <button id="restartBtn">Tap to Restart</button>
            </div>
        </div>
    </div>
</div>

<script>
/**
 * OPTUS SURFERS - V3 (Camera, Animation & Glitch Fixes)
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let width, height, horizon;

function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    horizon = height * 0.42; 
}
window.addEventListener('resize', resize);
resize();

// --- 3D Camera Settings ---
const OPTUS_YELLOW = '#F2A900';
const OPTUS_TEAL = '#00A3AD';
const LANES = [-140, 0, 140]; 
const CAMERA_Y = 280;         // Lowered slightly for better perspective 
const CAMERA_Z = -650;        // Moved closer to action
const FOV = 750;              // Narrowed FOV to zoom in and fix edge popping

let gameState = 'START'; 
let lastTime = 0;
let gameTime = 0; 
let distance = 0;
let speed = 450; 
let baseSpeed = 450;
let score = 0;
let objects = [];
let spawnTimer = 0;
let floorOffset = 0; 

// --- Entity States ---
const player = {
    lane: 1,      
    currentX: 0,  
    y: 0,         
    z: 200,       
    vy: 0,        
    isJumping: false,
    isDucking: false,
    duckTimer: 0,
    stumbleTimer: 0, 
    tilt: 0
};

const chaser = {
    z: -1000,
    currentX: 0,
    lane: 1
};

// --- Input Handling ---
const keys = { left: false, right: false, up: false, down: false };

document.addEventListener('keydown', (e) => {
    if (gameState !== 'PLAYING') return;
    if(["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(e.code) > -1) e.preventDefault();

    if ((e.code === 'ArrowLeft' || e.key === 'a') && !keys.left) {
        if (player.lane > 0) player.lane--;
        keys.left = true;
    }
    if ((e.code === 'ArrowRight' || e.key === 'd') && !keys.right) {
        if (player.lane < 2) player.lane++;
        keys.right = true;
    }
    if ((e.code === 'ArrowUp' || e.key === 'w') && !player.isJumping && !player.isDucking) {
        player.isJumping = true;
        player.vy = 750; 
    }
    if ((e.code === 'ArrowDown' || e.key === 's') && !player.isJumping && !player.isDucking) {
        player.isDucking = true;
        player.duckTimer = 0.75; 
    }
});
document.addEventListener('keyup', (e) => {
    if (e.code === 'ArrowLeft' || e.key === 'a') keys.left = false;
    if (e.code === 'ArrowRight' || e.key === 'd') keys.right = false;
});

// Mobile Controls
let touchStartX = 0, touchStartY = 0;
document.addEventListener('touchstart', e => {
    touchStartX = e.changedTouches[0].screenX;
    touchStartY = e.changedTouches[0].screenY;
}, {passive: true});

document.addEventListener('touchend', e => {
    if (gameState !== 'PLAYING') return;
    let diffX = e.changedTouches[0].screenX - touchStartX;
    let diffY = e.changedTouches[0].screenY - touchStartY;
    if (Math.abs(diffX) > Math.abs(diffY)) {
        if (diffX > 30 && player.lane < 2) player.lane++; 
        else if (diffX < -30 && player.lane > 0) player.lane--; 
    } else {
        if (diffY < -30 && !player.isJumping && !player.isDucking) {
            player.isJumping = true; player.vy = 750;
        } else if (diffY > 30 && !player.isJumping && !player.isDucking) {
            player.isDucking = true; player.duckTimer = 0.75;
        }
    }
}, {passive: true});

document.getElementById('restartBtn').addEventListener('click', initGame);

// --- Math & Projection ---
function project(x, y, z) {
    const relativeZ = z - CAMERA_Z;
    if (relativeZ < 1) return null; 
    const scale = FOV / relativeZ;
    const projectedX = width / 2 + x * scale;
    const projectedY = horizon + (CAMERA_Y - y) * scale;
    return { x: projectedX, y: projectedY, scale: scale, relativeZ: relativeZ };
}

// --- Render Helpers ---
function drawPlayerMascot(ctx, px, py, scale, isDucking, time, tilt) {
    ctx.save();
    ctx.translate(px, py); 
    
    const size = 32 * scale; 
    ctx.rotate(tilt);

    if (isDucking) {
        ctx.scale(1, 0.4);
    }

    if (!isDucking && gameState === 'PLAYING') {
        const stride = Math.sin(time * 20);
        ctx.fillStyle = '#0a0a0a';
        ctx.beginPath();
        ctx.ellipse(-size*0.35, stride * size * 0.7, size*0.25, size*0.15, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(size*0.35, -stride * size * 0.7, size*0.25, size*0.15, 0, 0, Math.PI*2);
        ctx.fill();
    }

    let bounce = 0;
    if (!isDucking && gameState === 'PLAYING' && !player.isJumping) {
        bounce = Math.abs(Math.sin(time * 20)) * 10 * scale;
    }
    ctx.translate(0, -bounce);

    let grad = ctx.createRadialGradient(-size*0.3, -size*1.3, size*0.1, 0, -size, size);
    grad.addColorStop(0, '#FFE16B'); 
    grad.addColorStop(0.6, OPTUS_YELLOW);
    grad.addColorStop(1, '#c28700');
    
    ctx.beginPath();
    ctx.arc(0, -size, size, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.beginPath();
    ctx.ellipse(size*0.1, -size*1.1, size*0.75, size*0.48, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#FFFFFF';
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.1)';
    ctx.lineWidth = 2*scale;
    ctx.stroke();

    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(-size*0.25, -size*1.1, size*0.14, 0, Math.PI * 2);
    ctx.arc(size*0.45, -size*1.1, size*0.14, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

function drawChaser(ctx, px, py, scale, time) {
    ctx.save();
    ctx.translate(px, py);
    const size = 35 * scale; 
    
    let bob = 0;
    if (gameState === 'PLAYING') bob = Math.abs(Math.sin(time * 18)) * 12 * scale;
    ctx.translate(0, -bob);
    ctx.rotate(0.1);

    const armSwing = Math.sin(time * 18);
    ctx.fillStyle = '#222';
    ctx.save();
    ctx.translate(-size*1.2, -size*0.8);
    ctx.rotate(-armSwing * 0.5);
    ctx.fillRect(-size*0.2, 0, size*0.4, size*1.5);
    ctx.fillStyle = '#111'; 
    ctx.fillRect(-size*0.5, size*1.2, size, size*0.8);
    ctx.restore();

    ctx.fillStyle = '#0b2038'; 
    ctx.beginPath();
    ctx.moveTo(-size*0.9, -size*0.2);
    ctx.lineTo(size*0.9, -size*0.2);
    ctx.lineTo(size*0.7, -size*2.2);
    ctx.lineTo(-size*0.7, -size*2.2);
    ctx.fill();
    
    ctx.fillStyle = '#081729';
    ctx.beginPath();
    ctx.moveTo(-size*0.5, -size*2.2); ctx.lineTo(0, -size*1.2); ctx.lineTo(size*0.5, -size*2.2);
    ctx.fill();

    ctx.fillStyle = '#e0f2fe';
    ctx.beginPath();
    ctx.moveTo(-size*0.3, -size*2.2); ctx.lineTo(size*0.3, -size*2.2); ctx.lineTo(0, -size*1.4);
    ctx.fill();
    ctx.fillStyle = OPTUS_TEAL; 
    ctx.beginPath();
    ctx.moveTo(-size*0.1, -size*2.2); ctx.lineTo(size*0.1, -size*2.2); ctx.lineTo(0, -size*1.5);
    ctx.fill();

    let headGrad = ctx.createRadialGradient(0, -size*2.5, size*0.2, 0, -size*2.5, size*0.7);
    headGrad.addColorStop(0, '#fad6a5');
    headGrad.addColorStop(1, '#d8a97b');
    ctx.fillStyle = headGrad;
    ctx.beginPath();
    ctx.arc(0, -size*2.5, size*0.65, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#cbd5e1';
    ctx.beginPath();
    ctx.arc(0, -size*2.6, size*0.68, Math.PI*1.1, Math.PI*-0.1);
    ctx.fill();

    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1.5 * scale;
    ctx.beginPath();
    ctx.arc(0, -size*2.35, size*0.25, 0, Math.PI); 
    ctx.stroke();
    
    ctx.restore();
}

// --- Game Logic ---
function spawnObject() {
    const laneIdx = Math.floor(Math.random() * 3);
    const rand = Math.random();
    
    let type = 'coin'; 
    if (rand > 0.9) type = 'solid'; 
    else if (rand > 0.75) type = 'high'; 
    else if (rand > 0.6) type = 'low'; 

    objects.push({
        type: type,
        lane: laneIdx,
        z: 9000, 
        y: type === 'high' ? 90 : 0, // Lowered 5G signs to head-height
        hit: false,
        swayOffset: Math.random() * Math.PI * 2 
    });
}

function initGame() {
    const panel = document.getElementById('gameOverPanel');
    panel.style.opacity = '0';
    setTimeout(() => panel.style.display = 'none', 300);
    
    score = 0;
    document.getElementById('score').innerText = score;
    speed = baseSpeed;
    objects = [];
    
    player.lane = 1;
    player.currentX = LANES[1];
    player.y = 0;
    player.isJumping = false;
    player.isDucking = false;
    player.stumbleTimer = 0;
    
    chaser.z = CAMERA_Z - 500; 
    chaser.currentX = player.currentX;
    
    gameState = 'PLAYING';
    lastTime = performance.now();
    gameTime = 0;
    distance = 0;
    requestAnimationFrame(gameLoop);
}

function triggerStumble() {
    if (player.stumbleTimer > 0) {
        triggerGameOver();
    } else {
        player.stumbleTimer = 4.0; 
        speed = baseSpeed * 0.6; 
    }
}

function triggerGameOver() {
    gameState = 'GAMEOVER';
    const panel = document.getElementById('gameOverPanel');
    document.getElementById('finalScore').innerText = score;
    panel.style.display = 'flex';
    setTimeout(() => panel.style.opacity = '1', 50);
}

function updateScore() {
    score++;
    const sb = document.getElementById('scoreBoard');
    document.getElementById('score').innerText = score;
    sb.classList.add('score-pulse');
    setTimeout(() => sb.classList.remove('score-pulse'), 150);
}

function update(dt) {
    if (gameState !== 'PLAYING') {
        if(gameState === 'GAMEOVER') {
            chaser.z += ((player.z - 60) - chaser.z) * 5 * dt; 
            chaser.currentX += (player.currentX - chaser.currentX) * 10 * dt;
        }
        return;
    }

    gameTime += dt;
    speed += dt * 4; 
    distance += speed * dt;
    floorOffset += speed * dt; 

    // Smooth Glitch-Free Player Lane Changing
    const targetX = LANES[player.lane];
    const dx = targetX - player.currentX;
    
    player.currentX += dx * 14 * dt;
    
    // Snap to lane when extremely close to stop jittering
    if (Math.abs(dx) < 1) {
        player.currentX = targetX;
    }
    
    player.tilt = dx * -0.0035; // Lean into turns

    // Physics
    if (player.isJumping) {
        player.y += player.vy * dt;
        player.vy -= 2200 * dt; 
        if (player.y <= 0) {
            player.y = 0;
            player.isJumping = false;
        }
    }

    if (player.isDucking) {
        player.duckTimer -= dt;
        if (player.duckTimer <= 0) player.isDucking = false;
    }

    // Stumble & Chaser AI
    let targetChaserZ = -1000; 
    if (player.stumbleTimer > 0) {
        player.stumbleTimer -= dt;
        targetChaserZ = player.z - 220; 
        
        if (player.stumbleTimer <= 0) {
            speed = baseSpeed + (distance * 0.008); 
        }
    }
    
    chaser.z += (targetChaserZ - chaser.z) * 2.5 * dt; 
    let targetChaserLaneX = LANES[player.lane];
    chaser.currentX += (targetChaserLaneX - chaser.currentX) * 4 * dt; 

    // Spawning
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
        spawnObject();
        spawnTimer = Math.max(0.35, 1.3 - (speed / 1200));
    }

    // Collisions
    for (let i = objects.length - 1; i >= 0; i--) {
        let obj = objects[i];
        obj.z -= speed * dt;

        const hitZoneFront = player.z + 25;
        const hitZoneBack = player.z - 25;
        const inLane = Math.abs(LANES[obj.lane] - player.currentX) < 40;

        if (obj.z < hitZoneFront && obj.z > hitZoneBack && !obj.hit && inLane) {
            if (obj.type === 'coin') {
                if (player.y < 70) { 
                    updateScore();
                    obj.hit = true;
                }
            } else if (obj.type === 'low') {
                if (player.y < 45) {
                    obj.hit = true;
                    triggerStumble();
                }
            } else if (obj.type === 'high') {
                if (!player.isDucking) {
                    obj.hit = true;
                    triggerStumble();
                }
            } else if (obj.type === 'solid') {
                obj.hit = true;
                player.stumbleTimer = 1; 
                triggerGameOver();
            }
        }
        
        if (obj.z < CAMERA_Z - 100 || (obj.hit && obj.type === 'coin')) objects.splice(i, 1);
    }
}

function draw() {
    // 1. Sky & Background
    let skyGrad = ctx.createLinearGradient(0, 0, 0, horizon);
    skyGrad.addColorStop(0, '#020b0d');
    skyGrad.addColorStop(1, '#083c45'); 
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, width, horizon);

    let floorGrad = ctx.createLinearGradient(0, horizon, 0, height);
    floorGrad.addColorStop(0, '#b0c4de'); 
    floorGrad.addColorStop(1, '#e2e8f0');
    ctx.fillStyle = floorGrad; 
    ctx.fillRect(0, horizon, width, height - horizon);

    // Floor lines
    ctx.lineWidth = 1;
    for (let i = 0; i < 45; i++) {
        let lineZ = 9000 - ((i * 200 + floorOffset) % 9000);
        let p = project(0, 0, lineZ);
        if (p) {
            ctx.beginPath();
            ctx.moveTo(0, p.y);
            ctx.lineTo(width, p.y);
            let alpha = Math.max(0, 1 - (lineZ / 8000));
            ctx.strokeStyle = `rgba(0, 163, 173, ${alpha * 0.4})`; 
            ctx.stroke();
        }
    }
    
    const dividersX = [-70, 70];
    dividersX.forEach(x => {
        ctx.beginPath();
        for (let z = 0; z < 9000; z += 150) {
            let p = project(x, 0, z);
            if (p) {
                if (z === 0) ctx.moveTo(p.x, p.y);
                else ctx.lineTo(p.x, p.y);
            }
        }
        ctx.shadowBlur = 10;
        ctx.shadowColor = OPTUS_YELLOW;
        ctx.strokeStyle = OPTUS_YELLOW;
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.shadowBlur = 0; 
    });

    // 2. Build Render List
    let renderList = [];

    // Walls now generate out to 9000z and sit slightly wider to avoid camera edge clipping
    for (let z = 0; z < 9000; z += 600) {
        let wallZ = 9000 - ((z + floorOffset) % 9000); 
        let pL = project(-420, 0, wallZ);
        if (pL) renderList.push({ drawType: 'wall', z: wallZ, px: pL.x, py: pL.y, scale: pL.scale });
        
        let pR = project(420, 0, wallZ);
        if (pR) renderList.push({ drawType: 'wall', z: wallZ, px: pR.x, py: pR.y, scale: pR.scale });
    }

    objects.forEach(obj => {
        let p = project(LANES[obj.lane], obj.y, obj.z);
        if (p) renderList.push({ ...obj, px: p.x, py: p.y, scale: p.scale, drawType: obj.type });
    });

    let pShadow = project(player.currentX, 0, player.z);
    let pPlayer = project(player.currentX, player.y, player.z);
    if (pPlayer && pShadow) {
        renderList.push({ drawType: 'player', z: player.z, px: pPlayer.x, py: pPlayer.y, shadowY: pShadow.y, scale: pPlayer.scale });
    }

    if (chaser.z > CAMERA_Z) {
        let pChaserShadow = project(chaser.currentX, 0, chaser.z);
        let pChaser = project(chaser.currentX, 0, chaser.z);
        if (pChaser) {
            renderList.push({ 
                drawType: 'chaser', z: chaser.z, 
                px: pChaser.x, py: pChaser.y, shadowY: pChaserShadow.y, scale: pChaser.scale 
            });
        }
    }

    renderList.sort((a, b) => b.z - a.z);

    // 3. Render Routine
    renderList.forEach(item => {
        ctx.save();
        ctx.translate(item.px, item.py);
        const s = item.scale;
        
        // Proper distance fog rendering prevents pillars from suddenly popping on the edges
        if (item.z > 6500) {
            ctx.globalAlpha = Math.max(0, 1 - ((item.z - 6500) / 2000));
        }

        switch (item.drawType) {
            case 'wall':
                let w = 140 * s;
                let h = 500 * s; 
                ctx.fillStyle = 'rgba(0,10,15,0.15)';
                ctx.beginPath();
                ctx.ellipse(0, 0, w*0.7, w*0.2, 0, 0, Math.PI*2);
                ctx.fill();
                
                let pillarGrad = ctx.createLinearGradient(0, -h, 0, 0);
                pillarGrad.addColorStop(0, '#005b63'); 
                pillarGrad.addColorStop(1, OPTUS_TEAL); 
                ctx.fillStyle = pillarGrad;
                ctx.fillRect(-w/2, -h, w, h);
                ctx.fillStyle = '#00e3f2';
                ctx.fillRect(-w/2, -h, w*0.1, h); 
                break;

            case 'coin':
                // Slowed down, non-glitchy spin based strictly on time
                const hoverY = Math.sin((gameTime*3) + item.swayOffset) * 10 * s;
                const spin = Math.sin(gameTime * 2.5 + item.swayOffset);
                ctx.translate(0, hoverY - (25*s));
                
                ctx.shadowBlur = 15 * s;
                ctx.shadowColor = 'rgba(0, 163, 173, 0.8)';
                
                ctx.fillStyle = '#111'; 
                ctx.beginPath(); ctx.roundRect(-18*s + (spin*5*s), -25*s, 16*s, 35*s, 3*s); ctx.fill(); 
                ctx.beginPath(); ctx.roundRect(2*s - (spin*5*s), -25*s, 16*s, 35*s, 3*s); ctx.fill();  
                
                ctx.shadowBlur = 0; 
                
                let screenGrad = ctx.createLinearGradient(0, -25*s, 0, 10*s);
                screenGrad.addColorStop(0, '#00e3f2');
                screenGrad.addColorStop(1, OPTUS_YELLOW);
                ctx.fillStyle = screenGrad;
                ctx.fillRect(-16*s + (spin*5*s), -23*s, 12*s, 31*s); 
                ctx.fillRect(4*s - (spin*5*s), -23*s, 12*s, 31*s);  
                break;
                
            case 'low':
                ctx.fillStyle = 'rgba(0,0,0,0.2)'; 
                ctx.beginPath(); ctx.ellipse(0, 0, 30*s, 10*s, 0, 0, Math.PI*2); ctx.fill();

                ctx.fillStyle = '#f8f9fa';
                ctx.beginPath(); ctx.roundRect(-28*s, -35*s, 56*s, 35*s, 4*s); ctx.fill();
                
                ctx.fillStyle = '#e63946'; 
                ctx.fillRect(-28*s, -15*s, 56*s, 6*s);
                ctx.fillStyle = '#333'; 
                ctx.fillRect(-15*s, -25*s, 20*s, 4*s); 
                break;

            case 'high':
                // Repositioned physically lower to make ducking visually necessary
                let swing = Math.sin(gameTime*2 + item.swayOffset) * 0.15;
                
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2 * s;
                ctx.beginPath();
                ctx.moveTo(-35*s, -130*s); ctx.lineTo(-35*s + (swing*20*s), -60*s);
                ctx.moveTo(35*s, -130*s); ctx.lineTo(35*s + (swing*20*s), -60*s);
                ctx.stroke();
                
                ctx.translate(swing*20*s, 0); 
                ctx.fillStyle = OPTUS_YELLOW;
                ctx.shadowBlur = 10*s; ctx.shadowColor = 'rgba(242, 169, 0, 0.4)';
                ctx.beginPath(); ctx.roundRect(-45*s, -60*s, 90*s, 40*s, 4*s); ctx.fill();
                ctx.shadowBlur = 0;
                
                ctx.fillStyle = '#111';
                ctx.font = `900 ${18*s}px 'Segoe UI'`;
                ctx.textAlign = 'center';
                ctx.fillText("5G", 0, -32*s);
                break;

            case 'solid':
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.beginPath(); ctx.ellipse(0, 0, 45*s, 15*s, 0, 0, Math.PI*2); ctx.fill();

                let rackGrad = ctx.createLinearGradient(-45*s, 0, 45*s, 0);
                rackGrad.addColorStop(0, '#1e293b');
                rackGrad.addColorStop(0.5, '#334155');
                rackGrad.addColorStop(1, '#1e293b');
                ctx.fillStyle = rackGrad;
                ctx.beginPath(); ctx.roundRect(-45*s, -150*s, 90*s, 150*s, 8*s); ctx.fill();
                
                ctx.fillStyle = OPTUS_TEAL;
                ctx.fillRect(-45*s, -140*s, 90*s, 12*s);
                ctx.fillStyle = OPTUS_YELLOW;
                ctx.beginPath(); ctx.arc(0, -165*s, 14*s, 0, Math.PI*2); ctx.fill();
                ctx.shadowBlur = 15*s; ctx.shadowColor = OPTUS_YELLOW;
                ctx.beginPath(); ctx.arc(0, -165*s, 8*s, 0, Math.PI*2); ctx.fill();
                ctx.shadowBlur = 0;
                break;

            case 'player':
                ctx.fillStyle = 'rgba(0,20,30,0.2)';
                ctx.beginPath();
                let shadowScale = Math.max(0.2, 1 - (player.y / 350)); 
                ctx.ellipse(0, item.shadowY - item.py, 28 * s * shadowScale, 10 * s * shadowScale, 0, 0, Math.PI*2);
                ctx.fill();

                ctx.restore(); 
                drawPlayerMascot(ctx, item.px, item.py, item.scale, player.isDucking, gameTime, player.tilt);
                ctx.save(); 
                break;
                
            case 'chaser':
                ctx.fillStyle = 'rgba(0,10,20,0.3)';
                ctx.beginPath();
                ctx.ellipse(0, item.shadowY - item.py, 35*s, 12*s, 0, 0, Math.PI*2);
                ctx.fill();

                ctx.restore();
                drawChaser(ctx, item.px, item.py, item.scale, gameTime);
                ctx.save();
                break;
        }
        ctx.restore();
    });
    
    if (gameState === 'GAMEOVER') {
        ctx.fillStyle = 'rgba(242, 169, 0, 0.15)';
        ctx.fillRect(0, 0, width, height);
    }
}

function gameLoop(timestamp) {
    let dt = (timestamp - lastTime) / 1000;
    if (dt > 0.1) dt = 0.1; 
    lastTime = timestamp;

    update(dt);
    draw();

    if (gameState === 'PLAYING' || gameState === 'GAMEOVER') {
        requestAnimationFrame(gameLoop);
    }
}

initGame();
</script>
