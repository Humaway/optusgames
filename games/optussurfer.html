<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Optus Surfers</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }
        canvas { display: block; width: 100%; height: 100%; }

        #uiLayer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;
        }
        #scoreBoard {
            position: absolute; top: 20px; left: 20px;
            background: rgba(0, 163, 173, 0.85); border: 2px solid #F2A900;
            padding: 10px 20px; border-radius: 12px; font-size: 24px; font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        #gameOverPanel {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8); display: none; 
            flex-direction: column; justify-content: center; align-items: center; pointer-events: auto;
        }
        .panel-content {
            background: #ffffff; color: #333; padding: 40px; border-radius: 20px;
            text-align: center; border: 5px solid #00A3AD; box-shadow: 0 0 30px #00A3AD;
        }
        .panel-content h1 {
            color: #F2A900; font-size: 48px; margin-bottom: 10px; text-transform: uppercase;
            letter-spacing: 2px; -webkit-text-stroke: 1px #333;
        }
        .panel-content p { font-size: 24px; margin-bottom: 30px; }
        #restartBtn {
            background: #F2A900; color: #000; border: none; padding: 15px 40px;
            font-size: 20px; font-weight: bold; border-radius: 30px; cursor: pointer;
            transition: all 0.2s ease; box-shadow: 0 4px 0 #c28700;
        }
        #restartBtn:hover { background: #ffce00; transform: translateY(2px); box-shadow: 0 2px 0 #c28700; }
        #restartBtn:active { transform: translateY(4px); box-shadow: none; }
        #controlsHint {
            position: absolute; bottom: 20px; width: 100%; text-align: center;
            color: rgba(255, 255, 255, 0.6); font-size: 14px;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
    
    <div id="uiLayer">
        <div id="scoreBoard">Phones: <span id="score">0</span></div>
        <div id="controlsHint">Use Arrow Keys or WASD to Move • Up to Jump • Down to Slide</div>
        
        <div id="gameOverPanel">
            <div class="panel-content">
                <h1>Caught!</h1>
                <p>You collected <strong id="finalScore">0</strong> phones!</p>
                <button id="restartBtn">Tap to Restart</button>
            </div>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let width, height, horizon;

function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    horizon = height * 0.38; // Adjust horizon line dynamically
}
window.addEventListener('resize', resize);
resize();

// --- 3D Camera & Game Constants ---
const OPTUS_YELLOW = '#F2A900';
const OPTUS_TEAL = '#00A3AD';
const LANES = [-120, 0, 120]; 
const CAMERA_Y = 300;         // Raised significantly to look down more
const CAMERA_Z = -500;        // Pulled back to see more foreground elements
const FOV = 600;              // Scaled to maintain view balance

let gameState = 'START'; 
let lastTime = 0;
let gameTime = 0; // Tracks running time for animations
let distance = 0;
let speed = 400; 
let baseSpeed = 400;
let score = 0;
let objects = [];
let spawnTimer = 0;
let floorOffset = 0; 

// --- Player State ---
const player = {
    lane: 1,      
    y: 0,         
    z: 100,       
    vy: 0,        
    isJumping: false,
    isDucking: false,
    duckTimer: 0,
    stumbleTimer: 0, 
    radius: 20
};

// --- Input Handling ---
const keys = { left: false, right: false, up: false, down: false };

document.addEventListener('keydown', (e) => {
    if (gameState !== 'PLAYING') return;
    if(["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(e.code) > -1) e.preventDefault();

    if ((e.code === 'ArrowLeft' || e.key === 'a') && !keys.left) {
        if (player.lane > 0) player.lane--;
        keys.left = true;
    }
    if ((e.code === 'ArrowRight' || e.key === 'd') && !keys.right) {
        if (player.lane < 2) player.lane++;
        keys.right = true;
    }
    if ((e.code === 'ArrowUp' || e.key === 'w') && !player.isJumping && !player.isDucking) {
        player.isJumping = true;
        player.vy = 650; // Increased jump power slightly
    }
    if ((e.code === 'ArrowDown' || e.key === 's') && !player.isJumping && !player.isDucking) {
        player.isDucking = true;
        player.duckTimer = 0.8; 
    }
});
document.addEventListener('keyup', (e) => {
    if (e.code === 'ArrowLeft' || e.key === 'a') keys.left = false;
    if (e.code === 'ArrowRight' || e.key === 'd') keys.right = false;
});

// Mobile Controls
let touchStartX = 0, touchStartY = 0;
document.addEventListener('touchstart', e => {
    touchStartX = e.changedTouches[0].screenX;
    touchStartY = e.changedTouches[0].screenY;
}, {passive: true});

document.addEventListener('touchend', e => {
    if (gameState !== 'PLAYING') return;
    let diffX = e.changedTouches[0].screenX - touchStartX;
    let diffY = e.changedTouches[0].screenY - touchStartY;
    if (Math.abs(diffX) > Math.abs(diffY)) {
        if (diffX > 30 && player.lane < 2) player.lane++; 
        else if (diffX < -30 && player.lane > 0) player.lane--; 
    } else {
        if (diffY < -30 && !player.isJumping && !player.isDucking) {
            player.isJumping = true;
            player.vy = 650;
        } else if (diffY > 30 && !player.isJumping && !player.isDucking) {
            player.isDucking = true;
            player.duckTimer = 0.8;
        }
    }
}, {passive: true});

document.getElementById('restartBtn').addEventListener('click', initGame);

// --- 3D Projection Math ---
function project(x, y, z) {
    const relativeZ = z - CAMERA_Z;
    if (relativeZ < 1) return null; 

    const scale = FOV / relativeZ;
    const projectedX = width / 2 + x * scale;
    const projectedY = horizon + (CAMERA_Y - y) * scale;

    return { x: projectedX, y: projectedY, scale: scale };
}

// --- Render Helpers ---

function drawPlayerMascot(ctx, px, py, scale, isDucking, time) {
    ctx.save();
    ctx.translate(px, py); // Base floor position
    
    const size = 30 * scale; 
    
    if (isDucking) {
        ctx.scale(1, 0.5);
    }

    // Draw running feet relative to the floor
    if (!isDucking && gameState === 'PLAYING') {
        const stride = Math.sin(time * 18);
        ctx.fillStyle = '#111';
        // Left foot
        ctx.beginPath();
        ctx.ellipse(-size*0.4, stride * size * 0.6, size*0.25, size*0.15, 0, 0, Math.PI*2);
        ctx.fill();
        // Right foot
        ctx.beginPath();
        ctx.ellipse(size*0.4, -stride * size * 0.6, size*0.25, size*0.15, 0, 0, Math.PI*2);
        ctx.fill();
    }

    // Apply bounce for the body (Two bounces per full stride cycle)
    let bounce = 0;
    if (!isDucking && gameState === 'PLAYING' && !player.isJumping) {
        bounce = Math.abs(Math.sin(time * 18)) * 12 * scale;
    }
    ctx.translate(0, -bounce);

    // Body (Yellow Sphere)
    ctx.beginPath();
    ctx.arc(0, -size, size, 0, Math.PI * 2);
    ctx.fillStyle = OPTUS_YELLOW;
    ctx.fill();
    
    // Shading
    ctx.beginPath();
    ctx.arc(0, -size, size, 0, Math.PI * 2);
    let grad = ctx.createRadialGradient(-size*0.3, -size*1.3, size*0.1, 0, -size, size);
    grad.addColorStop(0, 'rgba(255,255,255,0.4)');
    grad.addColorStop(1, 'rgba(0,0,0,0.2)');
    ctx.fillStyle = grad;
    ctx.fill();

    // Visor
    ctx.beginPath();
    ctx.ellipse(size*0.1, -size*1.1, size*0.7, size*0.45, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#FFFFFF';
    ctx.fill();

    // Eyes
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(-size*0.2, -size*1.1, size*0.12, 0, Math.PI * 2);
    ctx.arc(size*0.4, -size*1.1, size*0.12, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

function drawChaser(ctx, px, py, scale, time) {
    ctx.save();
    ctx.translate(px, py);
    const size = 45 * scale;
    
    // Bobbing animation to match running
    let bob = 0;
    if (gameState === 'PLAYING') bob = Math.abs(Math.sin(time * 15)) * 10 * scale;
    ctx.translate(0, -bob);

    // Suit Jacket
    ctx.fillStyle = '#0f2c4c';
    ctx.beginPath();
    ctx.moveTo(-size*0.8, -size*0.2);
    ctx.lineTo(size*0.8, -size*0.2);
    ctx.lineTo(size*0.9, -size*2);
    ctx.lineTo(-size*0.9, -size*2);
    ctx.fill();

    // Light Blue Shirt
    ctx.fillStyle = '#9bd3f1';
    ctx.beginPath();
    ctx.moveTo(-size*0.3, -size*1.8);
    ctx.lineTo(size*0.3, -size*1.8);
    ctx.lineTo(0, -size*0.9);
    ctx.fill();

    // Head
    ctx.fillStyle = '#f1c27d';
    ctx.beginPath();
    ctx.arc(0, -size*2.3, size*0.6, 0, Math.PI * 2);
    ctx.fill();

    // Hair
    ctx.fillStyle = '#d3d3d3';
    ctx.beginPath();
    ctx.arc(0, -size*2.4, size*0.62, Math.PI, 0);
    ctx.fill();

    // Smirk
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1 * scale;
    ctx.beginPath();
    ctx.arc(0, -size*2.2, size*0.2, 0, Math.PI); 
    ctx.stroke();
    
    ctx.restore();
}

// --- Game Logic ---
function spawnObject() {
    const laneIdx = Math.floor(Math.random() * 3);
    const rand = Math.random();
    
    let type = 'coin';
    if (rand > 0.9) type = 'solid'; 
    else if (rand > 0.75) type = 'high'; 
    else if (rand > 0.6) type = 'low'; 

    objects.push({
        type: type,
        lane: laneIdx,
        z: 4500, 
        y: type === 'high' ? 120 : 0, 
        hit: false
    });
}

function initGame() {
    document.getElementById('gameOverPanel').style.display = 'none';
    score = 0;
    document.getElementById('score').innerText = score;
    speed = baseSpeed;
    objects = [];
    player.lane = 1;
    player.y = 0;
    player.isJumping = false;
    player.isDucking = false;
    player.stumbleTimer = 0;
    gameState = 'PLAYING';
    lastTime = performance.now();
    gameTime = 0;
    requestAnimationFrame(gameLoop);
}

function triggerStumble() {
    if (player.stumbleTimer > 0) {
        triggerGameOver();
    } else {
        player.stumbleTimer = 3.5; 
        speed = baseSpeed * 0.7; 
    }
}

function triggerGameOver() {
    gameState = 'GAMEOVER';
    document.getElementById('gameOverPanel').style.display = 'flex';
    document.getElementById('finalScore').innerText = score;
}

function update(dt) {
    if (gameState !== 'PLAYING') return;

    gameTime += dt;
    speed += dt * 5; 
    distance += speed * dt;
    floorOffset += speed * dt; // Continuously slide floor/walls toward camera

    // Physics
    if (player.isJumping) {
        player.y += player.vy * dt;
        player.vy -= 1800 * dt; // Gravity
        if (player.y <= 0) {
            player.y = 0;
            player.isJumping = false;
        }
    }

    if (player.isDucking) {
        player.duckTimer -= dt;
        if (player.duckTimer <= 0) player.isDucking = false;
    }

    if (player.stumbleTimer > 0) {
        player.stumbleTimer -= dt;
        if (player.stumbleTimer <= 0) speed = baseSpeed + (distance * 0.01); 
    }

    // Spawning
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
        spawnObject();
        spawnTimer = Math.max(0.4, 1.5 - (speed / 1000));
    }

    // Collisions
    for (let i = objects.length - 1; i >= 0; i--) {
        let obj = objects[i];
        obj.z -= speed * dt;

        const hitZoneFront = player.z + 20;
        const hitZoneBack = player.z - 20;

        if (obj.z < hitZoneFront && obj.z > hitZoneBack && !obj.hit) {
            if (obj.lane === player.lane) {
                if (obj.type === 'coin') {
                    if (player.y < 50) { 
                        score += 1;
                        document.getElementById('score').innerText = score;
                        obj.hit = true;
                    }
                } else if (obj.type === 'low') {
                    if (player.y < 40) {
                        obj.hit = true;
                        triggerStumble();
                    }
                } else if (obj.type === 'high') {
                    if (!player.isDucking) {
                        obj.hit = true;
                        triggerStumble();
                    }
                } else if (obj.type === 'solid') {
                    obj.hit = true;
                    // Force the chaser onto the screen exactly when you hit a solid wall
                    player.stumbleTimer = 1; 
                    triggerGameOver();
                }
            }
        }
        // Cleanup
        if (obj.z < -300 || (obj.hit && obj.type === 'coin')) objects.splice(i, 1);
    }
}

function draw() {
    // 1. Sky & Ground setup
    let skyGrad = ctx.createLinearGradient(0, 0, 0, horizon);
    skyGrad.addColorStop(0, '#0a0a0a');
    skyGrad.addColorStop(1, '#00262b'); // Dark teal horizon
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, width, horizon);

    ctx.fillStyle = '#dedede'; 
    ctx.fillRect(0, horizon, width, height - horizon);

    // Grid Floor Illusion
    ctx.lineWidth = 2;
    for (let i = 0; i < 25; i++) {
        let lineZ = 4500 - ((i * 200 + floorOffset) % 4500);
        let p = project(0, 0, lineZ);
        if (p) {
            ctx.beginPath();
            ctx.moveTo(0, p.y);
            ctx.lineTo(width, p.y);
            ctx.strokeStyle = `rgba(0, 163, 173, ${lineZ / 4500})`; 
            ctx.stroke();
        }
    }
    const dividersX = [-60, 60];
    dividersX.forEach(x => {
        ctx.beginPath();
        for (let z = 0; z < 4500; z += 100) {
            let p = project(x, 0, z);
            if (p) {
                if (z === 0) ctx.moveTo(p.x, p.y);
                else ctx.lineTo(p.x, p.y);
            }
        }
        ctx.strokeStyle = OPTUS_YELLOW;
        ctx.lineWidth = 3;
        ctx.stroke();
    });

    // 2. Build Render List for strict Z-Sorting
    let renderList = [];

    // Dynamically generate Wall Pillars into the pipeline (Fixes Z-clipping glitch)
    for (let z = 0; z < 4800; z += 400) {
        let wallZ = 4800 - ((z + floorOffset) % 4800); 
        let pL = project(-350, 0, wallZ);
        if (pL) renderList.push({ drawType: 'wall', z: wallZ, px: pL.x, py: pL.y, scale: pL.scale });
        
        let pR = project(350, 0, wallZ);
        if (pR) renderList.push({ drawType: 'wall', z: wallZ, px: pR.x, py: pR.y, scale: pR.scale });
    }

    // Add Obstacles/Coins
    objects.forEach(obj => {
        let p = project(LANES[obj.lane], obj.y, obj.z);
        if (p) renderList.push({ ...obj, px: p.x, py: p.y, scale: p.scale, drawType: obj.type });
    });

    // Add Player (with ground shadow tracker)
    let pShadow = project(LANES[player.lane], 0, player.z);
    let pPlayer = project(LANES[player.lane], player.y, player.z);
    if (pPlayer && pShadow) {
        renderList.push({ drawType: 'player', z: player.z, px: pPlayer.x, py: pPlayer.y, shadowY: pShadow.y, scale: pPlayer.scale });
    }

    // Add Chaser
    if (player.stumbleTimer > 0 || gameState === 'GAMEOVER') {
        let chaserZ = player.z - 80; // Distance maintained to keep both on screen
        let pChaser = project(LANES[player.lane], 0, chaserZ);
        if (pChaser) renderList.push({ drawType: 'chaser', z: chaserZ, px: pChaser.x, py: pChaser.y, scale: pChaser.scale });
    }

    // Sort descending Z (Back to front drawing)
    renderList.sort((a, b) => b.z - a.z);

    // 3. Render Objects
    renderList.forEach(item => {
        ctx.save();
        ctx.translate(item.px, item.py);
        const s = item.scale;

        switch (item.drawType) {
            case 'wall':
                let w = 120 * s;
                let h = 400 * s; 
                // Floor base shadow
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.beginPath();
                ctx.ellipse(0, 0, w*0.6, w*0.2, 0, 0, Math.PI*2);
                ctx.fill();
                
                // Solid Column Structure
                ctx.fillStyle = OPTUS_TEAL;
                ctx.fillRect(-w/2, -h, w, h);
                ctx.fillStyle = '#00c7d4';
                ctx.fillRect(-w/2, -h, w*0.15, h); // Highlight
                break;

            case 'coin':
                ctx.fillStyle = '#222';
                ctx.beginPath();
                ctx.roundRect(-10*s, -30*s, 20*s, 40*s, 4*s);
                ctx.fill();
                ctx.fillStyle = OPTUS_TEAL;
                ctx.fillRect(-8*s, -28*s, 16*s, 32*s);
                ctx.translate(0, Math.sin((Date.now()/200) + item.z) * 5 * s);
                break;
                
            case 'low':
                ctx.fillStyle = '#ececec';
                ctx.fillRect(-25*s, -30*s, 50*s, 30*s);
                ctx.fillStyle = '#333'; 
                ctx.fillRect(-20*s, -20*s, 10*s, 5*s);
                ctx.fillStyle = OPTUS_YELLOW; 
                ctx.fillRect(15*s, -45*s, 3*s, 15*s);
                break;

            case 'high':
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2 * s;
                ctx.beginPath();
                ctx.moveTo(-30*s, -150*s); ctx.lineTo(-30*s, -80*s);
                ctx.moveTo(30*s, -150*s); ctx.lineTo(30*s, -80*s);
                ctx.stroke();
                ctx.fillStyle = OPTUS_YELLOW;
                ctx.fillRect(-45*s, -80*s, 90*s, 40*s);
                ctx.fillStyle = '#000';
                ctx.font = `bold ${14*s}px Arial`;
                ctx.textAlign = 'center';
                ctx.fillText("5G", 0, -55*s);
                break;

            case 'solid':
                ctx.fillStyle = '#444';
                ctx.fillRect(-40*s, -140*s, 80*s, 140*s);
                ctx.fillStyle = OPTUS_TEAL;
                ctx.fillRect(-45*s, -150*s, 90*s, 10*s);
                ctx.fillStyle = OPTUS_YELLOW;
                ctx.beginPath();
                ctx.arc(0, -165*s, 12*s, 0, Math.PI*2);
                ctx.fill();
                break;

            case 'player':
                // Dynamic Jump Shadow matching physical ground level (shadowY)
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.beginPath();
                let shadowScale = Math.max(0.3, 1 - (player.y / 300)); 
                ctx.ellipse(0, item.shadowY - item.py, 25 * s * shadowScale, 10 * s * shadowScale, 0, 0, Math.PI*2);
                ctx.fill();

                ctx.restore(); 
                drawPlayerMascot(ctx, item.px, item.py, item.scale, player.isDucking, gameTime);
                ctx.save(); 
                break;
                
            case 'chaser':
                ctx.fillStyle = 'rgba(0,0,0,0.4)';
                ctx.beginPath();
                ctx.ellipse(0, 0, 30*s, 10*s, 0, 0, Math.PI*2);
                ctx.fill();

                ctx.restore();
                drawChaser(ctx, item.px, item.py, item.scale, gameTime);
                ctx.save();
                break;
        }
        ctx.restore();
    });
    
    if (gameState === 'GAMEOVER') {
        ctx.fillStyle = 'rgba(242, 169, 0, 0.2)';
        ctx.fillRect(0, 0, width, height);
    }
}

function gameLoop(timestamp) {
    if (gameState !== 'PLAYING') return;

    let dt = (timestamp - lastTime) / 1000;
    if (dt > 0.1) dt = 0.1; 
    lastTime = timestamp;

    update(dt);
    draw();

    if (gameState === 'PLAYING') {
        requestAnimationFrame(gameLoop);
    } else {
        draw(); // Draw final freeze frame
    }
}

initGame();
</script>
</body>
</html>
