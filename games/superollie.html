<style>

/* =====================================================================
   SUPER OLLIE: SIGNAL QUEST
   A fan-made parody platformer. Not affiliated with Optus.
   Single file, no assets, no build step. Canvas 2D + Web Audio only.
   ---------------------------------------------------------------------
   SECTIONS
     1  config & constants          9  power-ups & items
     2  palette                    10  bosses
     3  utility maths              11  camera
     4  input                      12  renderer
     5  audio engine               13  HUD & menus
     6  particle pool              14  state machine
     7  tilemap & level data       15  main loop
     8  entities / enemies         16  boot
   ===================================================================== */

/* ============================ 2. PALETTE ============================ */
const RS_MAX=4;
const PAL = {

/* ========================= 3. UTILITY MATHS ========================= */
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const sign=v=>v<0?-1:(v>0?1:0);
const approach=(v,t,d)=>v<t?Math.min(v+d,t):Math.max(v-d,t);
const rnd=(a,b)=>a+Math.random()*(b-a);
const rndI=(a,b)=>(a+Math.random()*(b-a+1))|0;
const pick=a=>a[(Math.random()*a.length)|0];
const easeOut=t=>1-(1-t)*(1-t);
const easeIn=t=>t*t;
const easeInOut=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const aabb=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const hit=(ax,ay,aw,ah,bx,by,bw,bh)=>ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by;
function rgba(hex,a){
  const n=parseInt(hex.slice(1),16);
  return 'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+a+')';
}
function mixHex(h1,h2,t){
  const a=parseInt(h1.slice(1),16),b=parseInt(h2.slice(1),16);
  const r=Math.round(lerp(a>>16&255,b>>16&255,t)),g=Math.round(lerp(a>>8&255,b>>8&255,t)),bl=Math.round(lerp(a&255,b&255,t));
  return '#'+((1<<24)+(r<<16)+(g<<8)+bl).toString(16).slice(1);
}
/* deterministic RNG, used by attract mode + endless generator */
let _seed=12345;
function srand(s){_seed=s>>>0;}
function rand01(){ _seed=(_seed*1664525+1013904223)>>>0; return _seed/4294967296; }

/* ======================= 3b. SAVE / PERSISTENCE ===================== */
const SAVE_KEY='superollie.save.v1';
const memStore={};                       // in-memory fallback
let storageOK=true;
function storeGet(k){
  try{ const v=localStorage.getItem(k); return v; }catch(e){ storageOK=false; return memStore[k]!==undefined?memStore[k]:null; }
}
function storeSet(k,v){
  try{ localStorage.setItem(k,v); memStore[k]=v; }catch(e){ storageOK=false; memStore[k]=v; }
}
function storeDel(k){
  try{ localStorage.removeItem(k); }catch(e){ storageOK=false; }
  delete memStore[k];
}
const DEFAULT_SAVE={
  hiScore:0, coinsTotal:0, unlocked:1, best:{}, seenCredits:false, lastSaved:0,
  opt:{ master:0.8, music:0.7, sfx:0.9, shake:true, flash:true, contrast:false, assist:false, rs:0 },
  keys:null
};
let SAVE=JSON.parse(JSON.stringify(DEFAULT_SAVE));
function loadSave(){
  const raw=storeGet(SAVE_KEY);
  if(!raw) return;
  try{
    const o=JSON.parse(raw);
    SAVE=Object.assign(JSON.parse(JSON.stringify(DEFAULT_SAVE)),o);
    SAVE.opt=Object.assign(JSON.parse(JSON.stringify(DEFAULT_SAVE.opt)),o.opt||{});
  }catch(e){ /* corrupt save, ignore */ }
}
let saveFlash=0;
function writeSave(){
  SAVE.lastSaved=Date.now();
  storeSet(SAVE_KEY,JSON.stringify(SAVE));
  saveFlash=1.4;
}
function wipeSave(){
  storeDel(SAVE_KEY);
  SAVE=JSON.parse(JSON.stringify(DEFAULT_SAVE));
  Input.setBinds(null);
}

/* ============================= 4. INPUT ============================= */
const ACTIONS=['left','right','up','down','jump','run','pause','confirm'];
const DEFAULT_BINDS={
  left:['ArrowLeft','KeyA'], right:['ArrowRight','KeyD'],
  up:['ArrowUp','KeyW'],     down:['ArrowDown','KeyS'],
  jump:['Space','KeyZ','ArrowUp','KeyW'],
  run:['ShiftLeft','KeyX','ShiftRight'],
  pause:['Escape','KeyP'],
  confirm:['Enter','Space','KeyZ']
};
const Input=(function(){
  let binds=JSON.parse(JSON.stringify(DEFAULT_BINDS));
  const held={},prev={},raw={};
  const pad={held:{},axes:[0,0]};
  const touch={held:{},dx:0,dy:0};
  let anyKey=false, lastCode=null, capture=null;
  for(const a of ACTIONS){held[a]=false;prev[a]=false;}

  function codeToAction(code){
    const out=[];
    for(const a of ACTIONS) if(binds[a].indexOf(code)>=0) out.push(a);
    return out;
  }
  function onKey(e,down){
    const c=e.code;
    if(down&&capture){ capture(c); capture=null; e.preventDefault(); return; }
    if(down) lastCode=c;
    raw[c]=down;
    if(down) anyKey=true;
    if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Tab'].indexOf(c)>=0) e.preventDefault();
    if(down&&c==='Backquote') DEBUG=!DEBUG;
  }
  addEventListener('keydown',e=>onKey(e,true),{passive:false});
  addEventListener('keyup',e=>onKey(e,false),{passive:false});
  addEventListener('blur',()=>{ for(const k in raw) raw[k]=false; for(const k in touch.held) touch.held[k]=false; touch.dx=touch.dy=0; });

  function pollPad(){
    pad.held={}; pad.axes[0]=0; pad.axes[1]=0;
    if(!navigator.getGamepads) return;
    let gps;
    try{ gps=navigator.getGamepads(); }catch(e){ return; }
    if(!gps) return;
    for(let i=0;i<gps.length;i++){
      const g=gps[i]; if(!g||!g.connected) continue;
      const b=g.buttons,ax=g.axes;
      if(b[0]&&b[0].pressed) pad.held.jump=true;
      if((b[2]&&b[2].pressed)||(b[1]&&b[1].pressed)||(b[7]&&b[7].pressed)) pad.held.run=true;
      if(b[9]&&b[9].pressed) pad.held.pause=true;
      if((b[0]&&b[0].pressed)||(b[9]&&b[9].pressed)) pad.held.confirm=true;
      if(b[12]&&b[12].pressed) pad.held.up=true;
      if(b[13]&&b[13].pressed) pad.held.down=true;
      if(b[14]&&b[14].pressed) pad.held.left=true;
      if(b[15]&&b[15].pressed) pad.held.right=true;
      if(ax){
        if(ax[0]<-0.4) pad.held.left=true; if(ax[0]>0.4) pad.held.right=true;
        if(ax[1]<-0.5) pad.held.up=true;   if(ax[1]>0.5) pad.held.down=true;
        pad.axes[0]=ax[0]||0; pad.axes[1]=ax[1]||0;
      }
      if(b[0]&&b[0].pressed) anyKey=true;
    }
  }

  function update(){
    pollPad();
    for(const a of ACTIONS){
      prev[a]=held[a];
      let v=false;
      const list=binds[a];
      for(let i=0;i<list.length;i++) if(raw[list[i]]){v=true;break;}
      if(pad.held[a]) v=true;
      if(touch.held[a]) v=true;
      held[a]=v;
    }
    // touch d-pad analog -> directions
    if(touch.dx<-0.28) held.left=true;
    if(touch.dx>0.28)  held.right=true;
    if(touch.dy<-0.35) held.up=true;
    if(touch.dy>0.35)  held.down=true;
    if(held.jump||held.run) anyKeyFlag=true;
  }
  let anyKeyFlag=false;
  return {
    update,
    held, touch,
    down:a=>held[a],
    hit:a=>held[a]&&!prev[a],
    rel:a=>!held[a]&&prev[a],
    anyPressed(){ let r=false; for(const a of ACTIONS) if(held[a]&&!prev[a]) r=true; return r; },
    consumedAny(){ const v=anyKey; anyKey=false; return v; },
    setCapture(fn){ capture=fn; },
    isCapturing(){ return !!capture; },
    binds, setBinds(b){
      if(!b){ const d=JSON.parse(JSON.stringify(DEFAULT_BINDS)); for(const k in d) binds[k]=d[k]; }
      else for(const k in b) if(binds[k]) binds[k]=b[k].slice();
    },
    bindName(a){ return binds[a][0]; },
    rebind(a,code){ binds[a]=[code].concat(DEFAULT_BINDS[a].slice(1).filter(c=>c!==code)); SAVE.keys=JSON.parse(JSON.stringify(binds)); writeSave(); },
    clearFrame(){ for(const a of ACTIONS) prev[a]=held[a]; }
  };
})();

/* touch control wiring (only enabled on touch devices) */
const IS_TOUCH = (typeof window!=='undefined') &&
  (('ontouchstart' in window)||(navigator.maxTouchPoints>0)||(navigator.msMaxTouchPoints>0));
function initTouch(){
  const root=document.getElementById('touch');
  if(!root||!IS_TOUCH) return;
  root.classList.add('on');
  const dpad=document.getElementById('dpad'), stick=document.getElementById('dstick');
  const bJ=document.getElementById('bJump'), bR=document.getElementById('bRun'), bP=document.getElementById('bPause');
  let padId=null;
  function padMove(e){
    const r=dpad.getBoundingClientRect();
    const cx=r.left+r.width/2, cy=r.top+r.height/2;
    let dx=(e.clientX-cx)/(r.width/2), dy=(e.clientY-cy)/(r.height/2);
    const m=Math.hypot(dx,dy); if(m>1){dx/=m;dy/=m;}
    if(m<0.22){dx=0;dy=0;}                       // generous dead zone
    Input.touch.dx=dx; Input.touch.dy=dy;
    stick.style.transform='translate('+(dx*38)+'px,'+(dy*38)+'px)';
  }
  dpad.addEventListener('pointerdown',e=>{padId=e.pointerId;dpad.setPointerCapture(e.pointerId);dpad.classList.add('act');padMove(e);e.preventDefault();});
  dpad.addEventListener('pointermove',e=>{if(e.pointerId===padId)padMove(e);});
  const padUp=e=>{ if(e.pointerId!==padId)return; padId=null; Input.touch.dx=0;Input.touch.dy=0; stick.style.transform='';dpad.classList.remove('act'); };
  dpad.addEventListener('pointerup',padUp); dpad.addEventListener('pointercancel',padUp);
  function btn(el,act){
    if(!el) return;
    el.addEventListener('pointerdown',e=>{Input.touch.held[act]=true;if(act!=='pause')Input.touch.held.confirm=true;el.classList.add('act');el.setPointerCapture(e.pointerId);e.preventDefault();});
    const up=e=>{Input.touch.held[act]=false;if(act!=='pause')Input.touch.held.confirm=false;el.classList.remove('act');};
    el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up);
  }
  btn(bJ,'jump'); btn(bR,'run'); btn(bP,'pause');
}

const Audio2=(function(){
  let ctx=null, master=null, mgain=null, sgain=null, waves={}, noiseBuf=null;
  let ready=false, started=false;
  let song=null, step=0, nextT=0, rate=1, playing=false, songName='';
  const A={};

  function mtof(m){ return 440*Math.pow(2,(m-69)/12); }

  function makeWave(duty){
    const n=24,real=new Float32Array(n),imag=new Float32Array(n);
    for(let i=1;i<n;i++) imag[i]=(2/(i*Math.PI))*Math.sin(Math.PI*i*duty);
    return ctx.createPeriodicWave(real,imag,{disableNormalization:false});
  }

  A.init=function(){
    if(ctx) return;
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC) return;
      ctx=new AC();
      master=ctx.createGain(); master.gain.value=SAVE.opt.master; master.connect(ctx.destination);
      mgain=ctx.createGain(); mgain.gain.value=SAVE.opt.music; mgain.connect(master);
      sgain=ctx.createGain(); sgain.gain.value=SAVE.opt.sfx; sgain.connect(master);
      waves[0.5]=makeWave(0.5); waves[0.25]=makeWave(0.25); waves[0.125]=makeWave(0.125);
      const len=ctx.sampleRate*0.5; noiseBuf=ctx.createBuffer(1,len,ctx.sampleRate);
      const d=noiseBuf.getChannelData(0);
      for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
      ready=true;
    }catch(e){ ready=false; }
  };
  A.unlock=function(){
    if(!ctx) A.init();
    if(!ctx) return;
    if(ctx.state==='suspended'){ try{ctx.resume();}catch(e){} }
    started=true;
  };
  A.isReady=()=>ready&&started;
  A.setVolumes=function(){
    if(!ready) return;
    master.gain.value=SAVE.opt.master; mgain.gain.value=SAVE.opt.music; sgain.gain.value=SAVE.opt.sfx;
  };

  /* ---- one-shot voices ---- */
  function pulse(freq,dur,vol,duty,dest,t0,slide){
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.setPeriodicWave(waves[duty]||waves[0.5]);
    o.frequency.setValueAtTime(freq,t0);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t0+dur);
    g.gain.setValueAtTime(0,t0);
    g.gain.linearRampToValueAtTime(vol,t0+0.006);
    g.gain.exponentialRampToValueAtTime(0.0008,t0+dur);
    o.connect(g); g.connect(dest); o.start(t0); o.stop(t0+dur+0.02);
  }
  function tri(freq,dur,vol,dest,t0){
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type='triangle'; o.frequency.setValueAtTime(freq,t0);
    g.gain.setValueAtTime(0,t0);
    g.gain.linearRampToValueAtTime(vol,t0+0.008);
    g.gain.exponentialRampToValueAtTime(0.0008,t0+dur);
    o.connect(g); g.connect(dest); o.start(t0); o.stop(t0+dur+0.02);
  }
  function noise(dur,vol,hp,lp,dest,t0){
    const s=ctx.createBufferSource(); s.buffer=noiseBuf;
    const f=ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=hp; f.Q.value=lp||1;
    const g=ctx.createGain();
    g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(0.0008,t0+dur);
    s.connect(f); f.connect(g); g.connect(dest); s.start(t0); s.stop(t0+dur+0.02);
  }
  function kick(t0,dest){
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type='sine'; o.frequency.setValueAtTime(150,t0); o.frequency.exponentialRampToValueAtTime(42,t0+0.11);
    g.gain.setValueAtTime(0.5,t0); g.gain.exponentialRampToValueAtTime(0.001,t0+0.14);
    o.connect(g); g.connect(dest); o.start(t0); o.stop(t0+0.16);
  }

  /* ---- music scheduler ---- */
  A.play=function(name,speed){
    if(!ready) { songName=name; return; }
    song=SONGS[name]||null; songName=name; step=0; rate=speed||1;
    nextT=ctx.currentTime+0.06; playing=!!song;
  };
  A.stop=function(){ playing=false; song=null; songName=''; };
  A.current=()=>songName;
  A.setRate=function(r){ rate=r; };
  A.getRate=()=>rate;

  function schedule(t0){
    const dur=(60/song.bpm/2)/rate;
    const L=song.lead.length;
    const i=step%L;
    const dutyA=song.duty?song.duty[0]:0.5, dutyB=song.duty?song.duty[1]:0.25;
    const n1=song.lead[i];
    if(n1>0) pulse(mtof(n1),dur*1.7,0.16,dutyA,mgain,t0);
    const n2=song.harm[i%song.harm.length];
    if(n2>0) pulse(mtof(n2),dur*0.85,0.085,dutyB,mgain,t0);
    const n3=song.bass[i%song.bass.length];
    if(n3>0) tri(mtof(n3),dur*1.25,0.30,mgain,t0);
    const dc=song.drum[i%song.drum.length];
    if(dc==='k') kick(t0,mgain);
    else if(dc==='s') noise(0.10,0.16,1500,1.2,mgain,t0);
    else if(dc==='h') noise(0.035,0.055,7000,0.8,mgain,t0);
    step++;
  }
  A.tick=function(){
    if(!ready||!playing||!song) return;
    const now=ctx.currentTime;
    const dur=(60/song.bpm/2)/rate;
    if(nextT<now) nextT=now+0.02;
    let guard=0;
    while(nextT<now+0.20&&guard++<32){ schedule(nextT); nextT+=(60/song.bpm/2)/rate; }
  };

  /* ---- SFX ---- */
  const S={
    jump(){ pulse(320,0.16,0.20,0.5,sgain,ctx.currentTime,760); },
    jumpBig(){ pulse(240,0.20,0.22,0.5,sgain,ctx.currentTime,640); },
    stomp(){ noise(0.09,0.22,900,1.4,sgain,ctx.currentTime); pulse(420,0.09,0.14,0.125,sgain,ctx.currentTime,150); },
    coin(){ const t=ctx.currentTime; pulse(988,0.07,0.16,0.5,sgain,t); pulse(1319,0.20,0.16,0.5,sgain,t+0.06); },
    power(){ const t=ctx.currentTime; for(let i=0;i<7;i++) pulse(392*Math.pow(1.13,i),0.10,0.15,0.25,sgain,t+i*0.045); },
    powerdown(){ const t=ctx.currentTime; for(let i=0;i<6;i++) pulse(660/Math.pow(1.15,i),0.11,0.15,0.25,sgain,t+i*0.05); },
    orb(){ pulse(880,0.10,0.14,0.125,sgain,ctx.currentTime,220); },
    orbBounce(){ pulse(600,0.05,0.09,0.25,sgain,ctx.currentTime,900); },
    brick(){ noise(0.22,0.26,700,0.6,sgain,ctx.currentTime); noise(0.12,0.18,2400,0.9,sgain,ctx.currentTime+0.02); },
    bump(){ pulse(180,0.07,0.16,0.5,sgain,ctx.currentTime,110); },
    note(p){ pulse(392*Math.pow(1.06,p||0),0.18,0.18,0.5,sgain,ctx.currentTime,392*Math.pow(1.06,p||0)*1.5); },
    phoneIn(){ const t=ctx.currentTime; for(let i=0;i<8;i++) pulse(1200/Math.pow(1.14,i),0.07,0.12,0.5,sgain,t+i*0.035); },
    phoneOut(){ const t=ctx.currentTime; pulse(700,0.09,0.15,0.5,sgain,t); pulse(1100,0.16,0.15,0.5,sgain,t+0.07); },
    ring(){ const t=ctx.currentTime; for(let i=0;i<4;i++){ pulse(880,0.06,0.11,0.5,sgain,t+i*0.11); pulse(660,0.06,0.11,0.5,sgain,t+i*0.11+0.055);} },
    oneup(){ const t=ctx.currentTime; const n=[76,80,83,88]; n.forEach((m,i)=>pulse(mtof(m),0.14,0.17,0.5,sgain,t+i*0.09)); },
    flag(){ const t=ctx.currentTime; for(let i=0;i<14;i++) pulse(300+i*70,0.06,0.10,0.25,sgain,t+i*0.045); },
    clear(){ const t=ctx.currentTime; const n=[60,64,67,72,67,72,76,79]; n.forEach((m,i)=>{pulse(mtof(m),0.2,0.17,0.5,sgain,t+i*0.13); tri(mtof(m-24),0.2,0.2,sgain,t+i*0.13);}); },
    death(){ const t=ctx.currentTime; const n=[72,71,69,67,64,60,55,48]; n.forEach((m,i)=>pulse(mtof(m),0.16,0.18,0.25,sgain,t+i*0.11)); },
    gameover(){ const t=ctx.currentTime; const n=[60,57,53,48]; n.forEach((m,i)=>{tri(mtof(m),0.45,0.25,sgain,t+i*0.28); pulse(mtof(m+12),0.4,0.12,0.25,sgain,t+i*0.28);}); },
    bossHit(){ noise(0.18,0.28,420,0.7,sgain,ctx.currentTime); pulse(200,0.16,0.18,0.125,sgain,ctx.currentTime,60); },
    bossDie(){ const t=ctx.currentTime; for(let i=0;i<10;i++){ noise(0.16,0.22,300+i*120,0.6,sgain,t+i*0.12); pulse(500-i*35,0.14,0.12,0.125,sgain,t+i*0.12,90);} },
    menu(){ pulse(520,0.05,0.11,0.25,sgain,ctx.currentTime); },
    select(){ const t=ctx.currentTime; pulse(660,0.07,0.14,0.5,sgain,t); pulse(990,0.12,0.14,0.5,sgain,t+0.06); },
    pause(){ const t=ctx.currentTime; pulse(440,0.09,0.13,0.25,sgain,t); pulse(330,0.13,0.13,0.25,sgain,t+0.08); },
    shell(){ noise(0.14,0.2,1800,1.6,sgain,ctx.currentTime); },
    splash(){ noise(0.3,0.18,600,0.5,sgain,ctx.currentTime); },
    warp(){ const t=ctx.currentTime; for(let i=0;i<12;i++) pulse(200*Math.pow(1.15,i),0.08,0.13,0.25,sgain,t+i*0.05); },
    dial(i){ const t=ctx.currentTime; const f=[697,770,852,941][(i||0)%4]; pulse(f,0.12,0.10,0.5,sgain,t); pulse([1209,1336,1477][(i||0)%3],0.12,0.10,0.5,sgain,t); },
    thud(){ noise(0.22,0.3,180,0.5,sgain,ctx.currentTime); },
    zap(){ const t=ctx.currentTime; noise(0.18,0.2,2600,1.2,sgain,t); pulse(1400,0.14,0.12,0.125,sgain,t,180); },
    charge(){ const t=ctx.currentTime; for(let i=0;i<10;i++) pulse(180*Math.pow(1.09,i),0.09,0.09,0.125,sgain,t+i*0.05); },
    swoosh(){ noise(0.2,0.14,1200,0.4,sgain,ctx.currentTime); }
  };
  A.sfx=function(n,a){ if(!ready||!started) return; try{ if(S[n]) S[n](a); }catch(e){} };
  return A;
})();

/* ========================= 6. PARTICLE POOL =========================
   Fixed pool, zero allocation in the hot loop.
   ==================================================================== */
const PART_MAX=460;
const parts=new Array(PART_MAX);
for(let i=0;i<PART_MAX;i++) parts[i]={on:false,x:0,y:0,vx:0,vy:0,g:0,life:0,max:1,size:2,col:'#fff',type:0,rot:0,vr:0,drag:1};
let partHead=0;
const PT={DUST:0,SPARK:1,SHARD:2,PAPER:3,BUBBLE:4,GLASS:5,RING:6,TRAIL:7,NOTE:8,STAR:9,LINE:10,SMOKE:11};
function spawnP(type,x,y,vx,vy,life,col,size,g,vr){
  let p=null;
  for(let i=0;i<PART_MAX;i++){ const q=parts[(partHead+i)%PART_MAX]; if(!q.on){ p=q; partHead=(partHead+i+1)%PART_MAX; break; } }
  if(!p) p=parts[partHead=(partHead+1)%PART_MAX];
  p.on=true;p.type=type;p.x=x;p.y=y;p.vx=vx;p.vy=vy;p.life=life;p.max=life;
  p.col=col;p.size=size||2;p.g=(g===undefined?0:g);p.rot=0;p.vr=vr||0;p.drag=1;
  return p;
}
function updateParts(dt){
  for(let i=0;i<PART_MAX;i++){
    const p=parts[i]; if(!p.on) continue;
    p.life-=dt; if(p.life<=0){p.on=false;continue;}
    p.vy+=p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.rot+=p.vr*dt;
    if(p.type===PT.BUBBLE){ p.x+=Math.sin(p.life*8)*0.3; }
    if(p.type===PT.DUST||p.type===PT.SMOKE){ p.vx*=0.94; p.vy*=0.94; }
  }
}
function clearParts(){ for(let i=0;i<PART_MAX;i++) parts[i].on=false; }
/* helpers */
function puffDust(x,y,n,col){
  for(let i=0;i<n;i++) spawnP(PT.DUST,x+rnd(-3,3),y+rnd(-2,2),rnd(-30,30),rnd(-38,-4),rnd(0.25,0.5),col||PAL.off2,rnd(1.5,3),40);
}
function ringDust(x,y,n){
  for(let i=0;i<n;i++){ const a=Math.PI+ (i/(n-1))*Math.PI; spawnP(PT.DUST,x,y,Math.cos(a)*rnd(30,70),Math.sin(a)*rnd(6,26),rnd(0.22,0.42),PAL.off2,rnd(1.5,3),60); }
}
function sparkBurst(x,y,n,col){

}
function shardBurst(x,y,col){

function smokePuff(x,y,n,col){
  for(let i=0;i<n;i++) spawnP(PT.SMOKE,x+rnd(-4,4),y+rnd(-4,4),rnd(-16,16),rnd(-26,-6),rnd(0.4,0.8),col||PAL.ink3,rnd(3,6),0);

/* floating score numbers */
const FLOAT_MAX=24;
const floats=new Array(FLOAT_MAX);
for(let i=0;i<FLOAT_MAX;i++) floats[i]={on:false,x:0,y:0,t:0,txt:'',col:'#fff'};
function addFloat(x,y,txt,col){
  for(let i=0;i<FLOAT_MAX;i++){ const f=floats[i]; if(!f.on){ f.on=true;f.x=x;f.y=y;f.t=0;f.txt=''+txt;f.col=col||PAL.off; return; } }
}
function updateFloats(dt){
  for(let i=0;i<FLOAT_MAX;i++){ const f=floats[i]; if(!f.on) continue; f.t+=dt; f.y-=26*dt; if(f.t>0.85) f.on=false; }
}
function clearFloats(){ for(let i=0;i<FLOAT_MAX;i++) floats[i].on=false; }

const NT=42;
const SOLID=new Uint8Array(NT), BREAK=new Uint8Array(NT), BUMP=new Uint8Array(NT),
      SLOPEID=new Uint8Array(NT), HAZARD=new Uint8Array(NT), PHONEID=new Uint8Array(NT);
[T.GROUND,T.HARD,T.BRICK,T.QPOW,T.QCOIN,T.QMULTI,T.QSTAR,T.USED,T.NOTE,T.PHONE,T.PTOP,T.PENTER,
 T.PRING,T.PHOLD,T.PWARP,T.PWALL,T.PHANG,T.BRIDGE,T.CONV_L,T.CONV_R,T.FALLTILE,T.EXITP,T.DOOR]
 .forEach(i=>SOLID[i]=1);
[T.SL_R,T.SL_L,T.SL_R1,T.SL_R2,T.SL_L1,T.SL_L2].forEach(i=>SLOPEID[i]=1);
[T.QPOW,T.QCOIN,T.QMULTI,T.QSTAR,T.Q1UP,T.QCOINH,T.BRICK,T.NOTE].forEach(i=>BUMP[i]=1);
[T.SPIKE,T.CSPIKE,T.WIRE,T.FAN].forEach(i=>HAZARD[i]=1);

/* the live level */
let lvl=null;
let routerPhase=0;          // shared rhythm clock for router blocks

function tileAt(tx,ty){
  if(!lvl) return T.EMPTY;
  if(tx<0) return T.HARD;                 // solid left wall
  if(tx>=lvl.w||ty<0||ty>=lvl.h) return T.EMPTY;
  return lvl.grid[ty*lvl.w+tx];
}
function setTile(tx,ty,v){
  if(tx<0||tx>=lvl.w||ty<0||ty>=lvl.h) return;
  lvl.grid[ty*lvl.w+tx]=v;
}
function routerOn(){ return (routerPhase%2)<1; }
function isSolid(tx,ty){
  const t=tileAt(tx,ty);
  if(t===T.ROUTER) return routerOn();
  if(t===T.Q1UP||t===T.QCOINH) return lvl.revealed[ty*lvl.w+tx]===1;
  return SOLID[t]===1;
}
function isOneWay(tx,ty){ return tileAt(tx,ty)===T.ONEWAY; }
function isSlope(tx,ty){ return SLOPEID[tileAt(tx,ty)]===1; }
function isLiquid(tx,ty){ const t=tileAt(tx,ty); return t===T.COOLANT||t===T.COOLANT_T; }
/* surface offset (0..16 from tile top) of a slope tile at local x */
function slopeSurf(t,lx){
  switch(t){
    case T.SL_R:  return 16-lx;
    case T.SL_L:  return lx;
    case T.SL_R1: return 16-lx*0.5;
    case T.SL_R2: return 8-lx*0.5;
    case T.SL_L1: return lx*0.5;
    case T.SL_L2: return 8+lx*0.5;
  }
  return 16;
}
/* world-space Y of the ground surface under x, for the slope tile at (tx,ty) */
function slopeY(tx,ty,x){
  const t=tileAt(tx,ty);
  if(!SLOPEID[t]) return null;
  const lx=clamp(x-tx*TS,0,16);
  return ty*TS+slopeSurf(t,lx);
}

/* ---- level parsing ---- */
function parseLevel(def){
  const rows=def.map;
  let w=0; for(const r of rows) w=Math.max(w,r.length);
  const h=rows.length;
  const grid=new Uint8Array(w*h);
  const revealed=new Uint8Array(w*h);
  const spawns=[];
  let startX=32,startY=32,flagX=w*TS-64,doorX=null;
  for(let y=0;y<h;y++){
    const row=rows[y];
    for(let x=0;x<w;x++){
      const ch=x<row.length?row[x]:'.';
      if(ch==='S'){ startX=x*TS+2; startY=y*TS; continue; }
      if(ENT_CHARS.indexOf(ch)>=0&&ch!=='S'){
        spawns.push({ch:ch,x:x*TS,y:y*TS,tx:x,ty:y});
        continue;
      }
      const t=CHAR2TILE[ch];
      grid[y*w+x]=(t===undefined?T.EMPTY:t);
      if(t===T.FLAG&&x*TS<flagX+1){ if(flagX===w*TS-64||x*TS<flagX) flagX=x*TS; }
      if(t===T.DOOR&&doorX===null) doorX=x*TS;
    }
  }
  /* locate flag column properly (leftmost flag tile) */
  let fx=null;
  for(let x=0;x<w&&fx===null;x++) for(let y=0;y<h;y++) if(grid[y*w+x]===T.FLAG){ fx=x; break; }
  const L={
    def:def, name:def.name, world:def.world||1, w:w,h:h,grid:grid,revealed:revealed,
    spawns:spawns, startX:startX, startY:startY,
    flagX:(fx!==null?fx*TS+6:w*TS-64), flagTop:0, doorX:(doorX!==null?doorX:null),
    time:def.time||CFG.LEVEL_TIME, music:def.music||('w'+(def.world||1)),
    theme:def.theme||('w'+(def.world||1)), phones:[], boss:def.boss||null,
    bonus:def.bonus||null, warp:def.warp||null, dark:!!def.dark, lowg:!!def.lowg, wind:!!def.wind,
    isBonus:!!def.isBonus, returnTo:null
  };
  /* flag top row */
  if(fx!==null){ for(let y=0;y<h;y++) if(grid[y*w+fx]===T.FLAG){ L.flagTop=y*TS; break; } }
  /* build phone objects (2 tiles wide) */
  const claimed={};
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const t=grid[y*w+x];
    if(t===T.PTOP||t===T.PENTER||t===T.PRING||t===T.PHOLD||t===T.PWARP||t===T.EXITP){
      if(claimed[y*w+x]) continue;
      let x0=x;
      if(x>0&&(grid[y*w+x-1]===t)&&!claimed[y*w+x-1]) x0=x-1;
      let ww=1;
      while(x0+ww<w&&grid[y*w+x0+ww]===t&&!claimed[y*w+x0+ww]&&ww<2) ww++;
      let hh=1;
      while(y+hh<h&&PHONEID[grid[(y+hh)*w+x0]]===1) hh++;
      for(let i=0;i<ww;i++) claimed[y*w+x0+i]=1;
      L.phones.push({
        tx:x0,ty:y,tw:ww,th:hh,type:t,
        x:x0*TS,y:y*TS,w:ww*TS,h:hh*TS,
        anim:Math.random()*10, ringT:rnd(1.4,2.6), ringing:(t===T.PRING), hp:2,
        holdT:rnd(1,3), handset:0, handsetV:0, notif:(Math.random()*NOTIFS.length)|0,
        glow:0, bright:0
      });
    }
  }
  return L;
}

/* ===================== 8. ENTITIES & PHYSICS ========================
   Shared AABB body: swept, resolved X then Y against the tilemap,
   with slope, one-way and corner-correction passes.
   ==================================================================== */
function Spring(){ return {p:0,v:0}; }
function springTo(s,target,dt,k,damp){
  s.v+=(target-s.p)*k*dt;
  s.v*=Math.pow(damp,dt*60);
  s.p+=s.v*dt;
}

function solidFor(e,tx,ty,dir){
  const t=tileAt(tx,ty);
  if(SLOPEID[t]) return false;                    // slopes get their own pass
  if(t===T.ONEWAY) return dir===1&&!e.dropping&&(e.py+e.h)<=ty*TS+2.01;
  if(t===T.Q1UP||t===T.QCOINH) return lvl.revealed[ty*lvl.w+tx]===1;
  if(t===T.ROUTER) return routerOn();
  if(t===T.COOLANT||t===T.COOLANT_T) return false;
  return SOLID[t]===1;
}
/* move one axis with sub-stepping; returns true if it hit something */
function moveAxis(e,d,axis){
  if(d===0) return false;
  let rem=d, hitAny=false;
  const maxStep=6;
  while(Math.abs(rem)>0.0001){
    const st=clamp(rem,-maxStep,maxStep);
    rem-=st;
    if(axis===0) e.x+=st; else e.y+=st;
    const x0=Math.floor(e.x/TS), x1=Math.floor((e.x+e.w-0.01)/TS);
    const y0=Math.floor(e.y/TS), y1=Math.floor((e.y+e.h-0.01)/TS);
    let hitNow=false;
    for(let ty=y0;ty<=y1&&!hitNow;ty++){
      for(let tx=x0;tx<=x1&&!hitNow;tx++){
        const dir=axis===0?(st>0?2:-2):(st>0?1:-1);
        if(!solidFor(e,tx,ty,dir)) continue;
        if(axis===0){
          if(st>0){ e.x=tx*TS-e.w; } else { e.x=(tx+1)*TS; }
          e.hitWall=st>0?1:-1; e.wallVx=e.vx; e.vx=0; hitNow=true;
        }else{
          if(st>0){
            e.y=ty*TS-e.h; e.grounded=true; e.vy=0; hitNow=true;
            e.groundTile=tileAt(tx,ty);
          }else{
            /* corner correction: nudge around a clipped corner */
            if(e.corner){
              const headL=Math.floor((e.x+1)/TS), headR=Math.floor((e.x+e.w-1)/TS);
              const overL=(headL+1)*TS-e.x, overR=e.x+e.w-headR*TS;
              if(tx===headL&&overL<=CFG.LEDGE_NUDGE&&!solidFor(e,headL+1,ty,-1)&&!solidFor(e,headL+1,ty+1,-1)){ e.x+=overL+0.1; continue; }
              if(tx===headR&&overR<=CFG.LEDGE_NUDGE&&!solidFor(e,headR-1,ty,-1)&&!solidFor(e,headR-1,ty+1,-1)){ e.x-=overR+0.1; continue; }
            }
            e.y=(ty+1)*TS; e.vy=0; e.hitCeil=true; hitNow=true;
            e.ceilTx=tx; e.ceilTy=ty;
          }
        }
      }
    }
    if(hitNow){ hitAny=true; break; }
  }
  return hitAny;
}
/* rest the body on any slope beneath its centre */
function slopePass(e){
  const cx=e.x+e.w*0.5, feet=e.y+e.h;
  const tx=Math.floor(cx/TS);
  const ty0=Math.floor((feet-14)/TS), ty1=Math.floor((feet+CFG.SNAP_DOWN)/TS);
  for(let ty=ty0;ty<=ty1;ty++){
    if(!isSlope(tx,ty)) continue;
    const sy=slopeY(tx,ty,cx);
    if(feet>sy-0.6&&feet<sy+18){
      if(e.vy>=0||feet>sy){
        e.y=sy-e.h; e.vy=Math.min(e.vy,0); e.grounded=true; e.onSlope=true;
      }
      return true;
    }
  }
  return false;
}
function probeGround(e){
  const y=e.y+e.h+1;
  const ty=Math.floor(y/TS);
  const x0=Math.floor((e.x+1)/TS), x1=Math.floor((e.x+e.w-1)/TS);
  for(let tx=x0;tx<=x1;tx++) if(solidFor(e,tx,ty,1)) return true;
  const cx=e.x+e.w*0.5, txc=Math.floor(cx/TS);
  for(let t=Math.floor((e.y+e.h)/TS);t<=Math.floor((e.y+e.h+2)/TS);t++){
    if(isSlope(txc,t)){ const sy=slopeY(txc,t,cx); if(Math.abs(e.y+e.h-sy)<2) return true; }
  }
  return false;
}
function physics(e,dt){
  e.py=e.y; e.px=e.x; e.hitWall=0; e.hitCeil=false; e.onSlope=false;
  const wasGround=e.grounded;
  e.grounded=false;
  moveAxis(e,e.vx*dt,0);
  slopePass(e);
  moveAxis(e,e.vy*dt,1);
  if(!e.grounded) slopePass(e);
  /* stick to downhill slopes */
  if(!e.grounded&&wasGround&&e.vy>=0){
    const save=e.y;
    e.y+=CFG.SNAP_DOWN;
    if(slopePass(e)||probeGround(e)){
      if(!e.grounded){ /* landed on flat via probe */ 
        const ty=Math.floor((e.y+e.h+1)/TS); e.y=ty*TS-e.h; e.grounded=true; e.vy=0; }
    } else e.y=save;
  }
  if(!e.grounded&&probeGround(e)&&e.vy>=0) e.grounded=true;
  platformCarry(e);
}

/* ---------------- moving platforms ---------------- */
const PLAT_MAX=16, plats=[];
for(let i=0;i<PLAT_MAX;i++) plats.push({on:false,x:0,y:0,w:48,h:8,vx:0,vy:0,ox:0,oy:0,t:0,kind:'h',range:64,speed:34});
function spawnPlat(kind,x,y){
  for(const p of plats) if(!p.on){
    p.on=true;p.kind=kind;p.x=x;p.y=y;p.ox=x;p.oy=y;p.t=Math.random()*6;
    p.w=kind==='h'?48:40;p.h=8;p.range=kind==='h'?72:64;p.speed=kind==='h'?36:34;
    p.vx=0;p.vy=0; return p;
  }
  return null;
}
function updatePlats(dt){
  for(const p of plats){
    if(!p.on) continue;
    p.t+=dt;
    const px=p.x,py=p.y;
    if(p.kind==='h'){ p.x=p.ox+Math.sin(p.t*p.speed/p.range)*p.range; }
    else { p.y=p.oy+Math.sin(p.t*p.speed/p.range)*p.range; }
    p.vx=(p.x-px)/dt; p.vy=(p.y-py)/dt;
  }
}
function platformCarry(e){
  if(!e.usePlats) return;
  for(const p of plats){
    if(!p.on) continue;
    if(e.x+e.w<=p.x||e.x>=p.x+p.w) continue;
    const bottom=e.y+e.h, pb=e.py+e.h;
    if(e.vy>=0&&bottom>=p.y&&pb<=p.y+8+Math.abs(p.vy)*0.02+2){
      e.y=p.y-e.h; e.vy=0; e.grounded=true; e.riding=p;
    }
  }
  if(e.riding){
    if(!e.riding.on||e.x+e.w<e.riding.x-1||e.x>e.riding.x+e.riding.w+1||Math.abs((e.y+e.h)-e.riding.y)>3){ e.riding=null; }
    else { e.x+=e.riding.vx*(1/60); e.y=e.riding.y-e.h; }
  }
}

for(let i=0;i<ENEMY_MAX;i++) enemies.push({
  on:false,kind:'rue',x:0,y:0,w:12,h:13,vx:0,vy:0,face:-1,grounded:false,py:0,px:0,
  anim:0,state:0,timer:0,hp:1,dead:false,deadT:0,flat:false,tier:0,corner:false,usePlats:true,

function spawnEnemy(kind,x,y,opt){
  for(const e of enemies){
    if(e.on) continue;
    const d=EDEF[kind]||EDEF.rue;
    e.on=true;e.kind=kind;e.def=d;e.w=d.w;e.h=d.h;
    e.x=x;e.y=y;e.vx=(opt&&opt.vx!==undefined)?opt.vx:-d.speed;e.vy=(opt&&opt.vy)||0;
    e.face=e.vx>0?1:-1;e.grounded=false;e.anim=Math.random()*4;e.state=0;e.timer=0;
    e.hp=d.stomp||1;e.dead=false;e.deadT=0;e.flat=false;e.tier=(opt&&opt.tier)||0;
    e.homeX=x;e.homeY=y;e.alert=false;e.shellKick=0;e.frozen=0;e.scale=1;e.flash=0;
    e.riding=null;e.dropping=false;e.corner=false;e.glow=0;e.wallVx=0;e.hitWall=0;
    if(!e.spring){e.spring=Spring();e.spring2=Spring();}
    e.spring.p=0;e.spring.v=0;e.spring2.p=0;e.spring2.v=0;
    e.srcTx=(opt&&opt.tx!==undefined)?opt.tx:-1; e.srcTy=(opt&&opt.ty!==undefined)?opt.ty:-1;
    if(e.tier===1){ e.w=11;e.h=10; }
    if(e.tier===2){ e.w=8;e.h=8; }
    return e;
  }
  return null;
}
function countEnemies(){ let n=0; for(const e of enemies) if(e.on) n++; return n; }
function clearEnemies(){ for(const e of enemies) e.on=false; }

/* turn around at walls, and at ledges when the def asks for it */
/* Collisions zero vx, so never flip direction with -e.vx - it stays 0 and the
   enemy sticks to the wall. Direction lives in e.face; speed is re-applied from it. */
function turnEnemy(e,dir){
  const d=dir||(e.hitWall?-e.hitWall:-(e.face||1));
  const spd=Math.abs(e.wallVx||e.vx||(e.def?e.def.speed:40))||(e.def?e.def.speed:40);
  e.face=d; e.vx=spd*d; e.hitWall=0; e.wallVx=0;
  return d;
}
function groundAhead(e,dir){
  const ahead=dir>0?e.x+e.w+2:e.x-2;
  const ty=Math.floor((e.y+e.h+3)/TS), tx=Math.floor(ahead/TS);
  if(solidFor(e,tx,ty,1)||isSlope(tx,ty)||isSlope(tx,ty+1)) return true;
  if(isLiquid(tx,ty)) return true;
  for(const p of plats) if(p.on&&ahead>p.x-2&&ahead<p.x+p.w+2&&Math.abs(e.y+e.h-p.y)<6) return true;
  return false;
}
function walkerAI(e,dt){
  if(e.hitWall) turnEnemy(e);
  if(!e.face) e.face=sign(e.vx)||-1;
  if(e.def.edge&&e.grounded&&!groundAhead(e,e.face)){
    /* don't walk off the ledge - turn and step clear of the edge */
    const d=turnEnemy(e,-e.face);
    e.x+=d*Math.min(2,Math.abs(e.vx)*dt);
  }
}
function enemyGravity(e,dt,g){
  if(!e.def.grav) return;
  const mul=(lvl&&lvl.lowg)?CFG.GRAV_LOW:1;
  const inWater=isLiquid(Math.floor((e.x+e.w/2)/TS),Math.floor((e.y+e.h/2)/TS));
  e.vy+=(g||CFG.GRAV_DOWN)*(inWater?CFG.COOLANT_GRAV:1)*mul*dt;
  const maxf=inWater?CFG.COOLANT_MAXFALL:CFG.MAX_FALL;
  if(e.vy>maxf) e.vy=maxf;
}

function updateEnemies(dt){
  for(let i=0;i<ENEMY_MAX;i++){
    const e=enemies[i];
    if(!e.on) continue;
    e.anim+=dt;
    if(e.flash>0) e.flash-=dt;
    if(e.dead){
      e.deadT+=dt;
      if(e.kind==='shell'||e.state===9){ /* knocked off screen */
        e.vy+=CFG.GRAV_DOWN*dt; e.x+=e.vx*dt; e.y+=e.vy*dt;
      }
      if(e.deadT>0.5) e.on=false;
      continue;
    }
    if(e.frozen>0){ e.frozen-=dt; continue; }
    /* despawn if far behind the camera */
    if(e.x+e.w<cam.x-140||e.y>lvl.h*TS+120){ e.on=false; continue; }

    switch(e.kind){
      case 'rue': case 'hardhat': {
        e.vx=(e.face||sign(e.vx)||-1)*e.def.speed*(SAVE.opt.assist?0.7:1);
        enemyGravity(e,dt); physics(e,dt); walkerAI(e,dt);
        springTo(e.spring,-e.vx*0.06,dt,60,0.86);
        break;
      }
      case 'winged': {
        e.timer-=dt;
        if(e.grounded){
          if(e.timer<=0){ e.vy=-230; e.timer=0.55; Audio2.sfx('swoosh'); }
        }
        e.vx=(e.face||sign(e.vx)||-1)*e.def.speed;
        enemyGravity(e,dt); physics(e,dt); walkerAI(e,dt);
        springTo(e.spring,e.grounded?0:-6,dt,50,0.8);
        break;
      }
      case 'stack': {
        e.vx=(e.face||sign(e.vx)||-1)*e.def.speed;
        enemyGravity(e,dt); physics(e,dt); walkerAI(e,dt);
        springTo(e.spring,-e.vx*0.09,dt,40,0.88);
        break;
      }
      case 'bigrue': {
        e.vx=(e.face||sign(e.vx)||-1)*e.def.speed;
        enemyGravity(e,dt); physics(e,dt); walkerAI(e,dt);
        springTo(e.spring,-e.vx*0.05,dt,34,0.9);
        break;
      }
      case 'churnie': {
        e.vx=(e.face||sign(e.vx)||-1)*e.def.speed;
        enemyGravity(e,dt); physics(e,dt); walkerAI(e,dt);
        springTo(e.spring,-e.vx*0.05,dt,50,0.87);
        break;
      }
      case 'shell': {
        if(e.state===1){ /* sliding */
          e.vx=sign(e.vx)*300;
          enemyGravity(e,dt);
          const before=e.vx;
          physics(e,dt);
          if(e.hitWall){ e.vx=-before; e.face=sign(e.vx)||-e.hitWall; Audio2.sfx('bump');
            const tx=Math.floor((e.hitWall>0?e.x+e.w+2:e.x-2)/TS), ty=Math.floor((e.y+e.h/2)/TS);
            bumpBlockAt(tx,ty,true); }
          /* squash anything it touches */
          for(const o of enemies){
            if(o===e||!o.on||o.dead) continue;
            if(hit(e.x,e.y,e.w,e.h,o.x,o.y,o.w,o.h)){ killEnemy(o,'shell'); addScore(200,o.x,o.y); }
          }
        } else {
          e.timer+=dt;
          enemyGravity(e,dt); physics(e,dt);
          e.vx=0;
          if(e.timer>7){ /* Churnie climbs back out */
            e.kind='churnie'; e.def=EDEF.churnie; e.h=EDEF.churnie.h; e.w=EDEF.churnie.w;
            e.y-=4; e.vx=-EDEF.churnie.speed; e.hp=1; e.timer=0;
          }
        }
        if(e.shellKick>0) e.shellKick-=dt;
        break;
      }
      case 'bat': {
        if(e.state===0){
          e.vy=0; e.vx=0;
          springTo(e.spring,Math.sin(e.anim*2)*1.5,dt,40,0.9);
          if(player&&Math.abs(player.x+player.w/2-(e.x+e.w/2))<26&&player.y>e.y&&player.alive){
            e.state=1; e.vy=150; e.vx=sign(player.x-e.x)*40; Audio2.sfx('swoosh');
          }
        } else if(e.state===1){
          e.vy+=260*dt; e.x+=e.vx*dt; e.y+=e.vy*dt;
          if(e.y>e.homeY+120||probeGround(e)){ e.state=2; }
        } else {
          e.vy=-90; e.y+=e.vy*dt;
          if(e.y<=e.homeY){ e.y=e.homeY; e.state=0; e.vy=0; }
        }
        break;
      }
      case 'lag': {
        e.vx=(e.face||sign(e.vx)||-1)*e.def.speed;
        enemyGravity(e,dt); physics(e,dt); 
        if(e.hitWall) turnEnemy(e);
        if(e.grounded){
          const ahead=e.vx>0?e.x+e.w+2:e.x-2;
          const ty=Math.floor((e.y+e.h+3)/TS), tx=Math.floor(ahead/TS);
          if(!solidFor(e,tx,ty,1)){ e.vx=-e.vx; e.face=sign(e.vx); }
        }
        break;
      }
      case 'blob': {
        e.vx=(e.face||sign(e.vx)||-1)*e.def.speed*(1+e.tier*0.35);
        enemyGravity(e,dt); physics(e,dt);
        if(e.hitWall) turnEnemy(e);
        springTo(e.spring,e.grounded?Math.sin(e.anim*5)*1.6:0,dt,50,0.85);
        break;
      }
      case 'dead': {
        e.timer+=dt;
        e.x+=Math.sin(e.timer*0.7)*14*dt; e.y+=Math.cos(e.timer*0.9)*10*dt;
        break;
      }
      case 'bill': {
        e.timer-=dt;
        if(e.timer<=0&&player&&Math.abs(player.x-e.x)<150){
          e.timer=2.6+Math.random();
          spawnEnemy('invoice',e.x+2,e.y+12,{vx:0});
          Audio2.sfx('swoosh');
        }
        springTo(e.spring,Math.sin(e.anim*3)*1,dt,40,0.9);
        break;
      }
      case 'invoice': {
        enemyGravity(e,dt,1100); physics(e,dt);
        if(e.grounded){
          Audio2.sfx('brick'); paperBurst(e.x+e.w/2,e.y+e.h);
          for(let k=0;k<2;k++){
            const s=spawnEnemy('invoice',e.x+(k?8:-8),e.y,{vx:k?150:-150});
            if(s){ s.state=5; s.h=8; s.w=8; s.vy=-90; }
          }
          e.on=false;
        }
        if(e.state===5){ e.timer+=dt; if(e.timer>1.4) e.on=false; }
        break;
      }
      case 'roamer': {
        const px=player?player.x:0;
        if(!e.alert&&player&&Math.abs(px-e.x)<130&&sign(px-e.x)===sign(e.vx||-1)){ e.alert=true; Audio2.sfx('charge'); }
        const tgt=e.alert?e.def.speed*3.2:e.def.speed;
        e.vx=approach(e.vx,sign(e.vx||-1)*tgt,(e.alert?260:120)*dt);
        enemyGravity(e,dt); physics(e,dt);
        if(e.hitWall){ turnEnemy(e); e.vx=e.face*e.def.speed; e.alert=false; smokePuff(e.x+e.w/2,e.y+e.h,3); }
        if(e.grounded&&Math.abs(e.vx)>60){ if(Math.random()<dt*18) spawnP(PT.DUST,e.x+e.w/2,e.y+e.h,-sign(e.vx)*40,-10,0.3,PAL.off2,2,30); }
        e.face=sign(e.vx)||e.face;
        break;
      }
      case 'hat': {
        enemyGravity(e,dt); physics(e,dt);
        e.timer+=dt;
        if(e.grounded){ e.vx*=0.9; }
        if(e.timer>9) e.on=false;
        break;
      }
    }
    if(e.def.grav&&e.kind!=='bat') e.face=e.vx!==0?sign(e.vx):e.face;
  }
}

/* ---- damage helpers ---- */
function killEnemy(e,how){
  if(!e.on||e.dead) return;
  if(e.kind==='blob'&&e.tier<2&&how!=='pit'){
    for(let k=0;k<2;k++){
      const b=spawnEnemy('blob',e.x+(k?6:-6),e.y+3,{vx:k?40:-40,tier:e.tier+1});
      if(b){ b.vy=-140; }
    }
    glassBurst(e.x+e.w/2,e.y+e.h/2,6);
  }
  if(e.kind==='bigrue'&&how!=='pit'){
    for(let k=0;k<2;k++) spawnEnemy('rue',e.x+(k?14:-6),e.y+8,{vx:k?60:-60});
    paperBurst(e.x+e.w/2,e.y+e.h/2);
  }
  e.dead=true; e.deadT=0; e.state=9;
  e.vy=-190; e.vx=(how==='shell'||how==='orb')?sign(e.vx||1)*40:0;
  smokePuff(e.x+e.w/2,e.y+e.h/2,3,PAL.ink3);
}
function stompEnemy(e){
  e.hp--;
  e.flash=0.12;
  if(e.kind==='hardhat'&&e.hp===1){
    const h=spawnEnemy('hat',e.x,e.y-6,{vx:rnd(-70,70)}); if(h) h.vy=-160;
    e.kind='rue'; e.def=EDEF.rue; e.h=EDEF.rue.h; e.y+=3; e.hp=1;
    Audio2.sfx('stomp'); return false;
  }
  if(e.kind==='winged'&&e.hp===1){
    e.kind='rue'; e.def=EDEF.rue; e.h=EDEF.rue.h; e.hp=1;
    for(let i=0;i<6;i++) spawnP(PT.SPARK,e.x+e.w/2,e.y,rnd(-70,70),rnd(-70,10),0.4,PAL.tealL,2,180);
    Audio2.sfx('stomp'); return false;
  }
  if(e.kind==='stack'&&e.hp>0){
    e.h-=13; e.y+=13;
    const r=spawnEnemy('rue',e.x+rnd(-8,8),e.y-20,{vx:rnd(-50,50)});
    if(r) r.vy=-150;
    Audio2.sfx('stomp'); return false;
  }
  if(e.kind==='bigrue'&&e.hp>0){ e.scale=0.9; Audio2.sfx('stomp'); return false; }
  if(e.kind==='churnie'){
    e.kind='shell'; e.def=EDEF.shell; e.w=EDEF.shell.w; e.h=EDEF.shell.h;
    e.y+=4; e.state=0; e.vx=0; e.timer=0; e.hp=1;
    Audio2.sfx('stomp'); return false;
  }
  if(e.hp>0){ Audio2.sfx('stomp'); return false; }
  /* squashed flat */
  e.flat=true; e.dead=true; e.deadT=0; e.state=0; e.vx=0; e.vy=0;
  paperBurst(e.x+e.w/2,e.y+4);
  puffDust(e.x+e.w/2,e.y+e.h,5);
  Audio2.sfx('stomp');
  return true;
}

};

function playerHitbox(){ return player.power>=1?{w:CFG.BIG_W,h:CFG.BIG_H}:{w:CFG.SMALL_W,h:CFG.SMALL_H}; }
function setPowerSize(keepFeet){
  const hb=playerHitbox(), oldB=player.y+player.h;
  player.w=hb.w; player.h=hb.h;
  if(keepFeet!==false) player.y=oldB-player.h;
}
function resetPlayer(x,y){
  player.x=x;player.y=y;player.vx=0;player.vy=0;player.face=1;
  player.grounded=false;player.alive=true;player.state='play';player.seqT=0;
  player.hurt=0;player.star=0;player.dz=0;player.shield=false;player.stompChain=0;
  player.coyote=0;player.buffer=0;player.jumping=false;player.capCharge=0;
  player.flightT=0;player.spinT=0;player.deadT=0;player.winT=0;player.grow=0;
  player.sqx=player.sqy=player.tsqx=player.tsqy=1;player.riding=null;player.dropping=false;
  setPowerSize(false);
}

function playerDamage(force){
  if(player.state!=='play'||player.hurt>0||player.star>0) return;
  if(SAVE.opt.assist&&!force&&Math.random()<0){}          // assist keeps lives, not hits
  if(player.shield){
    player.shield=false; player.shieldPop=0.4; player.hurt=0.7;
    Audio2.sfx('powerdown'); glassBurst(player.x+player.w/2,player.y+player.h/2,10);
    return;
  }
  if(player.power>0){
    player.power=player.power>=2?1:0;
    setPowerSize(); player.hurt=CFG.HURT_TIME;
    player.vy=-160; player.vx=-player.face*70;
    Audio2.sfx('powerdown'); hitStop(4); shake(2);
    smokePuff(player.x+player.w/2,player.y+player.h/2,6,PAL.off2);
  } else {
    playerDie();
  }
}
function playerDie(){
  if(player.state==='dead') return;
  player.state='dead'; player.alive=false; player.deadT=0;
  player.vx=0; player.vy=0;
  Audio2.stop(); Audio2.sfx('death');
  music.pending=null;
}

/* ---- block bumping ---- */
function bumpBlockAt(tx,ty,fromShell){
  const t=tileAt(tx,ty);
  if(!BUMP[t]) return false;
  if((t===T.Q1UP||t===T.QCOINH)&&lvl.revealed[ty*lvl.w+tx]!==1&&fromShell) return false;
  addBump(tx,ty);
  switch(t){
    case T.BRICK:
      if(player.power>=1||fromShell){
        setTile(tx,ty,T.EMPTY);
        shardBurst(tx*TS+8,ty*TS+8,PAL.brown);
        Audio2.sfx('brick'); shake(CFG.SHAKE_BRICK); hitStop(3);
        addScore(50,tx*TS+8,ty*TS);
      } else { Audio2.sfx('bump'); }
      break;
    case T.QCOIN: case T.QCOINH:
      setTile(tx,ty,t===T.QCOIN?T.USED:T.USED);
      lvl.revealed[ty*lvl.w+tx]=1;
      popCoin(tx*TS+8,ty*TS); break;
    case T.QMULTI:
      if(!lvl.multi) lvl.multi={};
      { const key=tx+','+ty;
        if(!lvl.multi[key]) lvl.multi[key]={t:6,n:0};
        const m=lvl.multi[key];
        m.n++; popCoin(tx*TS+8,ty*TS);
        if(m.t<=0||m.n>=10) setTile(tx,ty,T.USED); }
      break;
    case T.QPOW:
      setTile(tx,ty,T.USED);
      spawnPowerFor(tx*TS,ty*TS); break;
    case T.QSTAR:
      setTile(tx,ty,T.USED);
      spawnItem('star',tx*TS,ty*TS-10); Audio2.sfx('power'); break;
    case T.Q1UP:
      setTile(tx,ty,T.USED); lvl.revealed[ty*lvl.w+tx]=1;
      spawnItem('plushie',tx*TS,ty*TS-10); Audio2.sfx('power'); break;
    case T.NOTE: break;   // handled on landing
  }
  return true;
}
function headBump(){
  const cx=player.x+player.w/2;
  const ty=Math.floor((player.y-1)/TS);
  let done=false;
  for(const dx of [0,-5,5,-9,9]){
    const tx=Math.floor((cx+dx)/TS);
    const t=tileAt(tx,ty);
    if(t===T.Q1UP||t===T.QCOINH){
      if(lvl.revealed[ty*lvl.w+tx]!==1){
        lvl.revealed[ty*lvl.w+tx]=1;
        if(t===T.QCOINH){ setTile(tx,ty,T.USED); popCoin(tx*TS+8,ty*TS); }
        else { setTile(tx,ty,T.USED); spawnItem('plushie',tx*TS,ty*TS-10); Audio2.sfx('power'); }
        addBump(tx,ty); done=true; break;
      }
    }
    if(BUMP[t]){ bumpBlockAt(tx,ty,false); done=true; break; }
  }
  if(!done) Audio2.sfx('bump');
  /* knock enemies standing on the block */
  const bx=cx-12, by=player.y-20;
  for(const e of enemies){
    if(!e.on||e.dead) continue;
    if(hit(bx,by,24,22,e.x,e.y,e.w,e.h)&&Math.abs((e.y+e.h)-(player.y-2))<12){
      if(e.kind==='shell'){ e.vy=-160; }
      else { killEnemy(e,'bump'); addScore(100,e.x,e.y); }
    }
  }
}

/* ---- pick-ups ---- */
function givePower(kind){
  hitStop(CFG.HITSTOP_POWER);
  if(kind==='booster'){
    if(player.power===0){ player.power=1; setPowerSize(); player.grow=0.35; player.growFrom=0; Audio2.sfx('power'); powerRing(); }
    else if(player.power===1){ addScore(1000,player.x,player.y); Audio2.sfx('coin'); }
    else { bankReserve('booster'); }
    return;
  }
  if(kind==='flare'||kind==='cap'){
    const tier=kind==='flare'?2:3;
    if(player.power<2){ player.power=tier; setPowerSize(); player.grow=0.35; Audio2.sfx('power'); powerRing(); }
    else if(player.power===tier){ addScore(1000,player.x,player.y); Audio2.sfx('coin'); bankReserve(kind); }
    else { player.power=tier; player.grow=0.25; Audio2.sfx('power'); powerRing(); }
    return;
  }
  if(kind==='shield'){ player.shield=true; Audio2.sfx('power'); powerRing(); return; }
  if(kind==='star'){
    player.star=CFG.STAR_TIME; Audio2.sfx('power');
    music.push('star'); return;
  }
  if(kind==='plushie'){ game.lives++; Audio2.sfx('oneup'); addFloat(player.x,player.y-8,'1-UP',PAL.green); return; }
}
function bankReserve(kind){
  if(!player.reserve){ player.reserve=kind; Audio2.sfx('coin'); addFloat(player.x,player.y-10,'RESERVE',PAL.tealL); }
  else { addScore(1000,player.x,player.y); Audio2.sfx('coin'); }
}
function dropReserve(){
  if(!player.reserve) return;
  spawnItem(player.reserve,player.x+player.w/2-8,player.y-22);
  player.reserve=null; Audio2.sfx('select');
}
function powerRing(){
  for(let i=0;i<12;i++){
    const a=(i/12)*Math.PI*2;
    spawnP(PT.RING,player.x+player.w/2,player.y+player.h/2,Math.cos(a)*70,Math.sin(a)*70,0.45,PAL.yel,3,0);
  }
  shake(2);
}

/* ---- the main player update ---- */
function updatePlayer(dt){
  const p=player;
  p.animT+=dt;
  if(p.hurt>0) p.hurt-=dt;
  if(p.star>0){ p.star-=dt; p.starPhase+=dt*12;
    if(p.star<=0){ music.pop(); }
  }
  if(p.dz>0) p.dz-=dt;
  if(p.shieldPop>0) p.shieldPop-=dt;
  if(p.grow>0) p.grow-=dt;
  if(p.landT>0) p.landT-=dt;
  if(p.dropT>0){ p.dropT-=dt; if(p.dropT<=0) p.dropping=false; }

  /* --- scripted states --- */
  if(p.state!=='play'){ updatePlayerScript(dt); return; }

  const inWater=isLiquid(Math.floor((p.x+p.w/2)/TS),Math.floor((p.y+p.h*0.4)/TS));
  if(inWater&&!p.swim){ Audio2.sfx('splash'); bubbles(p.x+p.w/2,p.y+p.h/2,6); }
  if(!inWater&&p.swim&&p.vy<0){ Audio2.sfx('splash'); }
  p.swim=inWater;

  const L=Input.down('left'), R=Input.down('right'), D=Input.down('down'), U=Input.down('up');
  const runB=Input.down('run');
  let dir=(R?1:0)-(L?1:0);
  const crouch=D&&p.grounded&&p.power>=1&&!p.swim;
  if(crouch) dir=0;

  /* --- horizontal --- */
  const maxS=(runB?CFG.RUN_MAX:CFG.WALK_MAX)*(p.star>0?1.1:1)*(p.dz>0?0.8:1);
  if(p.grounded&&!p.swim){
    if(dir!==0){
      if(sign(p.vx)!==0&&sign(p.vx)!==dir&&Math.abs(p.vx)>18){
        p.vx=approach(p.vx,0,CFG.SKID*dt);
        p.skid=1;
        if(Math.random()<dt*24) spawnP(PT.DUST,p.x+p.w/2-sign(p.vx)*4,p.y+p.h,-sign(p.vx)*rnd(20,60),rnd(-30,-6),0.3,PAL.off2,2,50);
      } else {
        p.vx=approach(p.vx,dir*maxS,(runB?CFG.ACC_RUN:CFG.ACC_GROUND)*dt);
        p.skid=0;
      }
    } else {
      p.vx=approach(p.vx,0,CFG.FRICTION*dt); p.skid=0;
    }
    if(Math.abs(p.vx)>maxS) p.vx=approach(p.vx,sign(p.vx)*maxS,CFG.FRICTION*dt);
  } else {
    if(dir!==0) p.vx=approach(p.vx,dir*maxS,CFG.ACC_AIR*dt);
    else p.vx=approach(p.vx,0,CFG.AIR_DRAG*dt);
    if(lvl.wind&&!p.grounded){
      const gust=Math.sin(gameTime*0.7)*CFG.WIND;
      p.vx=approach(p.vx,clamp(p.vx+gust*dt*2,-CFG.RUN_MAX-40,CFG.RUN_MAX+40),CFG.WIND*dt*2);
    }
  }
  /* conveyors */
  if(p.grounded&&(p.groundTile===T.CONV_L||p.groundTile===T.CONV_R)){
    p.x+=(p.groundTile===T.CONV_R?CFG.CONVEYOR:-CFG.CONVEYOR)*dt;
  }
  if(dir!==0&&!crouch) p.face=dir;

  /* --- jump --- */
  if(Input.hit('jump')) p.buffer=CFG.JUMP_BUFFER;
  if(p.buffer>0) p.buffer-=dt;
  if(p.grounded){ p.coyote=CFG.COYOTE; p.jumping=false; }
  else if(p.coyote>0) p.coyote-=dt;
  p.jumpHeld=Input.down('jump');

  /* drop through a one-way platform */
  if(D&&Input.hit('jump')&&p.grounded){
    const ty=Math.floor((p.y+p.h+2)/TS);
    let ow=false;
    for(let tx=Math.floor(p.x/TS);tx<=Math.floor((p.x+p.w-1)/TS);tx++) if(isOneWay(tx,ty)) ow=true;
    if(ow){ p.dropping=true; p.dropT=0.24; p.buffer=0; p.grounded=false; p.y+=2; Audio2.sfx('menu'); }
  }
  /* enter a phone */
  if(D&&p.grounded&&Input.hit('down')===false){}
  if(D&&p.grounded) tryEnterPhone();
  /* drop the reserve item */
  if(D&&Input.hit('run')&&p.reserve) dropReserve();

  if(p.swim){
    if(p.buffer>0&&p.swimT<=0){
      p.vy=CFG.COOLANT_SWIM; p.buffer=0; p.swimT=0.28;
      bubbles(p.x+p.w/2,p.y+p.h/2,3); Audio2.sfx('menu');
    }
    if(p.swimT>0) p.swimT-=dt;
    if(Math.random()<dt*2) bubbles(p.x+p.w/2+rnd(-3,3),p.y+2,1);
  } else if(p.buffer>0&&p.coyote>0){
    const bonus=CFG.JUMP_SPEED_BONUS*Math.min(1,Math.abs(p.vx)/CFG.RUN_MAX);
    p.vy=CFG.JUMP_V+bonus;
    p.jumping=true; p.grounded=false; p.buffer=0; p.coyote=0; p.riding=null;
    p.tsqx=0.85; p.tsqy=1.15;
    ringDust(p.x+p.w/2,p.y+p.h,5);
    Audio2.sfx(p.power>=1?'jumpBig':'jump');
  } else if(p.buffer>0&&p.power===3&&p.capCharge>=2&&p.flightT<=0&&!p.grounded&&p.vy>-40){
    p.flightT=1.1; p.capCharge=0; p.buffer=0; Audio2.sfx('power');
  }

  /* --- vertical --- */
  const gmul=(lvl.lowg?CFG.GRAV_LOW:1);
  if(p.swim){
    p.vy+=CFG.GRAV_DOWN*CFG.COOLANT_GRAV*gmul*dt;
    p.vy=clamp(p.vy,-190,CFG.COOLANT_MAXFALL);
    if(U) p.vy-=60*dt;
  } else if(p.flightT>0){
    p.flightT-=dt;
    p.vy=p.jumpHeld?-115:approach(p.vy,80,CFG.GRAV_DOWN*dt);
    if(Math.random()<dt*30) spawnP(PT.SPARK,p.x+p.w/2+rnd(-6,6),p.y+p.h,rnd(-20,20),rnd(20,60),0.3,PAL.tealL,2,0);
  } else {
    const rising=p.vy<0&&p.jumpHeld&&p.jumping;
    let g=(rising?CFG.GRAV_UP:CFG.GRAV_DOWN)*gmul;
    p.gliding=false;
    if(p.power===3&&!p.grounded&&p.vy>0&&p.jumpHeld){
      p.gliding=true;
      p.vy=approach(p.vy,CFG.GLIDE_FALL,900*dt);
      g=0;
      if(Math.random()<dt*14) spawnP(PT.DUST,p.x+p.w/2+rnd(-7,7),p.y+p.h*0.4,rnd(-14,14),rnd(6,20),0.35,PAL.tealL,2,0);
    }
    p.vy+=g*dt;
    if(p.vy>CFG.MAX_FALL) p.vy=CFG.MAX_FALL;
  }
  /* satellite spin attack */
  if(p.power===3&&!p.grounded&&Input.hit('run')&&p.spinT<=0){
    p.spinT=0.42; Audio2.sfx('swoosh');
    if(p.vy>0) p.vy=Math.min(p.vy,60);
  }
  if(p.spinT>0){
    p.spinT-=dt;
    for(const e of enemies){
      if(!e.on||e.dead||e.def.harmless) continue;
      if(hit(p.x-8,p.y-4,p.w+16,p.h+8,e.x,e.y,e.w,e.h)){
        if(e.def.stomp===0){ continue; }
        killEnemy(e,'orb'); addScore(e.def.pts,e.x,e.y); hitStop(3);
      }
    }
  }
  /* 5G orbs */
  if(p.power===2&&Input.hit('run')&&!crouch){
    if(countShots('orb')<CFG.ORB_MAX){
      spawnShot('orb',p.x+p.w/2+p.face*6,p.y+p.h*0.35,p.face*CFG.ORB_SPEED,-60);
      Audio2.sfx('orb'); p.tsqx=1.15; p.tsqy=0.85;
    }
  }
  /* cap flight charge */
  if(p.power===3&&p.grounded&&Math.abs(p.vx)>CFG.RUN_MAX-8) p.capCharge=Math.min(2,p.capCharge+dt);
  else if(p.grounded) p.capCharge=Math.max(0,p.capCharge-dt*0.6);

  /* --- integrate --- */
  const wasGround=p.grounded, fallSpeed=p.vy;
  physics(p,dt);
  if(p.hitCeil&&p.vy===0&&!p.swim){
    if(p.state==='play') headBump();
  }
  if(p.grounded&&!wasGround){
    /* landing */
    p.tsqx=1.2; p.tsqy=0.8; p.landT=0.12; p.jumping=false; p.flightT=0;
    if(fallSpeed>180){ ringDust(p.x+p.w/2,p.y+p.h,7); shake(SAVE.opt.shake?1:0); cam.dip=1; }
    else if(fallSpeed>60) puffDust(p.x+p.w/2,p.y+p.h,3);
    p.stompChain=0;
    /* note block */
    const ty=Math.floor((p.y+p.h+1)/TS);
    for(let tx=Math.floor(p.x/TS);tx<=Math.floor((p.x+p.w-1)/TS);tx++){
      if(tileAt(tx,ty)===T.NOTE){
        p.vy=CFG.JUMP_V*CFG.NOTE_BOUNCE; p.grounded=false; p.jumping=true;
        p.noteChain=Math.min((p.noteChain||0)+1,7);
        Audio2.sfx('note',p.noteChain); addBump(tx,ty);
        p.tsqx=0.8;p.tsqy=1.2;
        break;
      }
    }
    if(p.vy>=0) p.noteChain=0;
  }
  if(!p.grounded&&Math.abs(p.vx)>CFG.RUN_MAX-6&&Math.random()<dt*20)
    spawnP(PT.LINE,p.x+p.w/2-p.face*10,p.y+rnd(2,p.h-2),-p.face*90,0,0.18,rgba(PAL.off,0.5),rnd(4,9),0);
  if(p.grounded&&Math.abs(p.vx)>CFG.RUN_MAX-6&&Math.random()<dt*14)
    spawnP(PT.DUST,p.x+p.w/2-p.face*6,p.y+p.h,-p.face*rnd(30,60),rnd(-24,-4),0.28,PAL.off2,2,40);

  /* star trail */
  if(p.star>0){
    p.trailT-=dt;
    if(p.trailT<=0){ p.trailT=0.035;
      const hue=(p.starPhase*40)%360;
      spawnP(PT.TRAIL,p.x+p.w/2,p.y+p.h/2,0,0,0.32,'hsl('+hue+',95%,60%)',p.w*0.55,0);
    }
  }

  /* --- hazards & bounds --- */
  hazardCheck();
  if(p.y>lvl.h*TS+24){ playerDie(); }
  if(p.x<0) p.x=0;
  if(p.x+p.w>lvl.w*TS) p.x=lvl.w*TS-p.w;

  /* --- enemy contact --- */
  enemyContact(dt);

  /* --- items --- */
  itemContact();

  /* --- flag --- */
  if(!lvl.isBonus&&lvl.flagX&&p.x+p.w>lvl.flagX&&p.x<lvl.flagX+12&&p.state==='play'&&!lvl.boss){
    startFlag();
  }

  /* animation targets */
  p.sqx=lerp(p.sqx,p.tsqx,1-Math.pow(0.001,dt));
  p.sqy=lerp(p.sqy,p.tsqy,1-Math.pow(0.001,dt));
  p.tsqx=lerp(p.tsqx,1,1-Math.pow(0.01,dt));
  p.tsqy=lerp(p.tsqy,1,1-Math.pow(0.01,dt));
  p.runPhase+=Math.abs(p.vx)*dt*0.10;
  const leanT=p.skid?(-p.face*18):(clamp(p.vx/CFG.RUN_MAX,-1,1)*12);
  p.lean=lerp(p.lean,leanT*Math.PI/180,1-Math.pow(0.004,dt));
  springTo(p.antenna,-p.vx*0.045+(p.grounded?0:p.vy*0.02),dt,90,0.82);
  springTo(p.antenna2,p.antenna.p*0.8,dt,70,0.82);
  springTo(p.scarf,-p.vx*0.03,dt,70,0.84);
  p.blinkT-=dt;
  if(p.blinkT<=0){ p.blink=0.12; p.blinkT=rnd(2,5); }
  if(p.blink>0) p.blink-=dt;
  /* eyes drift toward the nearest enemy or item */
  let best=null,bd=1e9;
  for(const e of enemies) if(e.on&&!e.dead){ const d=Math.abs(e.x-p.x)+Math.abs(e.y-p.y); if(d<bd&&d<120){bd=d;best=e;} }
  for(const it of items) if(it.on){ const d=Math.abs(it.x-p.x)+Math.abs(it.y-p.y); if(d<bd&&d<100){bd=d;best=it;} }
  let tex=clamp(p.vx/CFG.RUN_MAX,-1,1)*1.6, tey=clamp(p.vy/300,-1,1)*1.2;
  if(best){ tex=clamp((best.x-p.x)/60,-1,1)*1.8; tey=clamp((best.y-p.y)/50,-1,1)*1.4; }
  p.eyeX=lerp(p.eyeX,tex,1-Math.pow(0.005,dt));
  p.eyeY=lerp(p.eyeY,tey,1-Math.pow(0.005,dt));
}

function hazardCheck(){
  const p=player;
  if(p.hurt>0||p.star>0) return;
  const x0=Math.floor((p.x+2)/TS),x1=Math.floor((p.x+p.w-3)/TS);
  const y0=Math.floor((p.y+2)/TS),y1=Math.floor((p.y+p.h-2)/TS);
  for(let ty=y0;ty<=y1;ty++) for(let tx=x0;tx<=x1;tx++){
    const t=tileAt(tx,ty);
    if(t===T.SPIKE||t===T.CSPIKE||t===T.WIRE){ playerDamage(); return; }
    if(t===T.FAN){ playerDamage(); return; }
    if(t===T.VENT){
      const ph=(gameTime*0.6+tx*0.13)%1;
      if(ph<0.35&&p.y+p.h>ty*TS-40){ playerDamage(); return; }
    }
  }
  /* vent jets push up from the tile above */
  for(let tx=x0;tx<=x1;tx++){
    const ty=Math.floor((p.y+p.h+2)/TS);
    if(tileAt(tx,ty)===T.VENT){
      const ph=(gameTime*0.6+tx*0.13)%1;
      if(ph<0.35){ playerDamage(); return; }
    }
  }
}

function enemyContact(dt){
  const p=player;
  for(const e of enemies){
    if(!e.on||e.dead||e.frozen>0) continue;
    if(!hit(p.x,p.y,p.w,p.h,e.x,e.y,e.w,e.h)) continue;
    if(e.kind==='dead'){
      if(p.dz<=0&&p.star<=0){ p.dz=CFG.DEADZONE_TIME; Audio2.sfx('powerdown'); addFloat(p.x,p.y-10,'NO SIGNAL',PAL.off2); }
      continue;
    }
    if(p.star>0){
      killEnemy(e,'star'); addScore(starScore(),e.x,e.y); hitStop(2); continue;
    }
    if(e.kind==='shell'&&e.state===0){
      /* kick it */
      const from=sign((p.x+p.w/2)-(e.x+e.w/2))||-p.face;
      e.state=1; e.vx=-from*300; e.face=sign(e.vx); e.shellKick=0.18;
      Audio2.sfx('shell'); hitStop(3); addScore(100,e.x,e.y);
      p.vx=from*60;
      continue;
    }
    const falling=p.vy>0&&(p.py+p.h)<=e.y+8;
    const canStomp=e.def.stomp>0;
    if(falling&&canStomp){
      const killed=stompEnemy(e);
      p.stompChain=Math.min(p.stompChain+1,CFG.STOMP_CHAIN_CAP);
      const mult=1+CFG.STOMP_CHAIN*(p.stompChain-1);
      p.vy=(p.jumpHeld?CFG.STOMP_V_HELD:CFG.STOMP_V)*mult;
      p.jumping=true; p.grounded=false; p.tsqx=1.25; p.tsqy=0.75;
      hitStop(CFG.HITSTOP_STOMP); shake(1);
      const pts=Math.round((e.def.pts||100)*Math.pow(2,p.stompChain-1));
      addScore(p.stompChain>=5?'1UP':pts,e.x,e.y);
      if(p.stompChain>=5){ game.lives++; Audio2.sfx('oneup'); }
      if(e.kind==='shell'&&killed) {}
      continue;
    }
    if(p.spinT>0&&canStomp) continue;
    playerDamage();
  }
}
function starScore(){
  player.starChain=(player.starChain||0)+1;
  const tbl=[100,200,400,800,1000];
  if(player.starChain>=6){ game.lives++; Audio2.sfx('oneup'); return '1UP'; }
  return tbl[Math.min(player.starChain-1,4)];
}

/* ---- phones, flags, doors: scripted moves ---- */
function tryEnterPhone(){
  const p=player;
  const cx=p.x+p.w/2;
  for(const ph of lvl.phones){
    if(ph.type!==T.PENTER&&ph.type!==T.PWARP&&ph.type!==T.EXITP) continue;
    if(cx<ph.x+2||cx>ph.x+ph.w-2) continue;
    if(Math.abs((p.y+p.h)-ph.y)>3) continue;
    p.state=ph.type===T.PWARP?'warp':'enter';
    p.seqT=0; p.seqData=ph; p.vx=0; p.vy=0;
    Audio2.sfx(ph.type===T.PWARP?'warp':'phoneIn');
    if(ph.type===T.PWARP) Audio2.sfx('dial',0);
    return true;
  }
  return false;
}
function startFlag(){
  const p=player;
  p.state='flag'; p.seqT=0; p.vx=0; p.vy=0;
  p.x=lvl.flagX-2;
  const h=clamp(1-((p.y-lvl.flagTop)/(Math.max(1,(lvl.h*TS-64)-lvl.flagTop))),0,1);
  game.flagBonus=Math.round(100+h*4900);
  addScore(game.flagBonus,p.x,p.y);
  Audio2.sfx('flag');
  music.stopAll();
}
function updatePlayerScript(dt){
  const p=player;
  p.seqT+=dt;
  switch(p.state){
    case 'enter': case 'warp': {
      const ph=p.seqData;
      p.x=lerp(p.x,ph.x+ph.w/2-p.w/2,1-Math.pow(0.001,dt));
      p.y+=34*dt;
      if(p.seqT>0.7){
        if(p.state==='warp'&&lvl.warp){ startLevelByKey(lvl.warp,true); }
        else enterBonusRoom();
      }
      break;
    }
    case 'exitphone': {
      p.y-=40*dt;
      if(p.seqT>0.5){ p.state='play'; p.vy=-120; Audio2.sfx('phoneOut'); }
      break;
    }
    case 'flag': {
      if(p.seqT<1.15){
        p.y=lerp(p.y,(lvl.h-4)*TS-p.h,1-Math.pow(0.02,dt));
        p.face=1;
        if(Math.random()<dt*30) spawnP(PT.SPARK,p.x+p.w/2,p.y+p.h,rnd(-30,30),rnd(-40,0),0.3,PAL.yel,2,120);
      } else {
        p.state='walkoff'; p.seqT=0; Audio2.sfx('clear');
      }
      break;
    }
    case 'walkoff': {
      p.face=1; p.vx=90; p.vy+=CFG.GRAV_DOWN*dt;
      physics(p,dt);
      p.runPhase+=Math.abs(p.vx)*dt*0.10;
      const target=(lvl.doorX!==null?lvl.doorX:lvl.w*TS-40);
      if(p.x>target-6||p.seqT>4){ p.vx=0; p.state='clear'; p.seqT=0; }
      break;
    }
    case 'clear': {
      if(p.seqT>0.6) levelCleared();
      break;
    }
    case 'dead': {
      p.deadT+=dt;
      if(p.deadT>0.5){
        if(p.deadT<0.55&&p.vy===0){ p.vy=-380; }
        p.vy+=CFG.GRAV_DOWN*0.8*dt;
        p.y+=p.vy*dt;
      }
      if(p.deadT>2.4) playerDeathDone();
      break;
    }
  }
}

/* ================= 10. ITEMS, SHOTS, BLOCKS, PHONES ================ */
const ITEM_MAX=40, items=[];
for(let i=0;i<ITEM_MAX;i++) items.push({on:false,kind:'coin',x:0,y:0,w:12,h:12,vx:0,vy:0,
  pop:0,popY:0,anim:0,grounded:false,py:0,px:0,def:{},usePlats:false,riding:null,corner:false,
  timer:0,roul:0,taken:false,dropping:false,hitWall:0});
const ITEMW={booster:{w:14,h:14},flare:{w:13,h:13},cap:{w:13,h:13},star:{w:13,h:13},
  shield:{w:13,h:13},plushie:{w:12,h:14},coin:{w:10,h:12},crate:{w:16,h:16}};
function spawnItem(kind,x,y,fromBlock){
  for(const it of items){
    if(it.on) continue;
    const d=ITEMW[kind]||ITEMW.coin;
    it.on=true;it.kind=kind;it.x=x;it.y=y;it.w=d.w;it.h=d.h;
    it.vx=(kind==='booster'||kind==='star')?45:0;it.vy=0;it.anim=0;it.timer=0;
    it.pop=fromBlock?0.45:0;it.popY=y;it.grounded=false;it.taken=false;it.roul=0;it.riding=null;
    if(kind==='star') it.vx=60;
    return it;
  }
  return null;
}
function spawnPowerFor(x,y){
  const p=player;
  let kind='booster';
  if(p.power===0) kind='booster';
  else if(p.power===1) kind=(Math.random()<0.5?'flare':'cap');
  else kind=(Math.random()<0.35?'shield':(p.power===2?'cap':'flare'));
  spawnItem(kind,x+1,y,true);
  Audio2.sfx('bump');
}
function popCoin(x,y){
  const p=spawnP(PT.STAR,x,y-6,0,-260,0.55,PAL.yel,5,900,14);
  addCoin(1); addScore(200,x,y-10);
  Audio2.sfx('coin');
  sparkBurst(x,y-8,4,PAL.yelL);
}
function updateItems(dt){
  for(const it of items){
    if(!it.on) continue;
    it.anim+=dt;
    if(it.pop>0){
      it.pop-=dt;
      it.y=it.popY-(1-it.pop/0.45)*16;
      if(it.pop<=0){ it.y=it.popY-16; if(it.kind==='star') it.vy=-160; }
      continue;
    }
    if(it.kind==='coin'){
      it.timer+=dt;
      continue;   /* static level coins */
    }
    if(it.kind==='crate'){ continue; }
    if(it.kind==='plushie'||it.kind==='shield'||it.kind==='flare'||it.kind==='cap'){
      /* these hover and bob where they spawned */
      it.y=it.popY-16+Math.sin(it.anim*3)*1.5;
      continue;
    }
    /* booster + star walk and bounce */
    it.vy+=CFG.GRAV_DOWN*(lvl.lowg?CFG.GRAV_LOW:1)*dt;
    if(it.vy>CFG.MAX_FALL) it.vy=CFG.MAX_FALL;
    const wasG=it.grounded;
    physics(it,dt);
    if(it.hitWall) it.vx=-it.vx;
    if(it.grounded&&it.kind==='star'){ it.vy=-250; it.grounded=false; }
    if(it.y>lvl.h*TS+40) it.on=false;
  }
}
function itemContact(){
  const p=player;
  for(const it of items){
    if(!it.on||it.taken) continue;
    if(it.pop>0) continue;
    if(!hit(p.x,p.y,p.w,p.h,it.x,it.y,it.w,it.h)) continue;
    if(it.kind==='coin'){
      it.on=false; addCoin(1); addScore(200,it.x,it.y); Audio2.sfx('coin');
      sparkBurst(it.x+it.w/2,it.y+it.h/2,5,PAL.yelL);
      continue;
    }
    if(it.kind==='crate'){
      it.taken=true; it.roul=1.35; Audio2.sfx('select'); hitStop(3);
      continue;
    }
    it.on=false;
    givePower(it.kind);
    addScore(1000,it.x,it.y);
    sparkBurst(it.x+it.w/2,it.y+it.h/2,10,PAL.yel);
  }
  /* crate roulette resolution */
  for(const it of items){
    if(!it.on||!it.taken||it.roul<=0) continue;
    it.roul-=1/60;
    if(it.roul<=0){
      const bag=[];
      if(player.power===0) bag.push('booster','booster','booster');
      if(player.power<2) bag.push('flare','cap');
      if(!player.shield) bag.push('shield','shield');
      bag.push('star','plushie','flare','cap');
      const k=pick(bag);
      spawnItem(k,it.x,it.y-16,true);
      it.on=false;
      Audio2.sfx('power');
    }
  }
}

/* ---------------- projectiles ---------------- */
const SHOT_MAX=28, shots=[];
for(let i=0;i<SHOT_MAX;i++) shots.push({on:false,kind:'orb',x:0,y:0,w:7,h:7,vx:0,vy:0,
  bounces:0,life:0,anim:0,py:0,px:0,grounded:false,corner:false,usePlats:false,riding:null,dropping:false,hitWall:0,txt:''});
function spawnShot(kind,x,y,vx,vy,txt){
  for(const s of shots){
    if(s.on) continue;
    s.on=true;s.kind=kind;s.x=x;s.y=y;s.vx=vx;s.vy=vy||0;s.bounces=0;s.life=6;s.anim=0;
    s.w=kind==='orb'?7:(kind==='note'?8:10); s.h=s.w; s.txt=txt||'';
    if(kind==='ticket'){s.w=10;s.h=12;}
    if(kind==='shock'){s.w=14;s.h=14;}
    return s;
  }
  return null;
}
function countShots(kind){ let n=0; for(const s of shots) if(s.on&&s.kind===kind) n++; return n; }
function updateShots(dt){
  for(const s of shots){
    if(!s.on) continue;
    s.anim+=dt; s.life-=dt;
    if(s.life<=0){ s.on=false; sparkBurst(s.x,s.y,4,PAL.tealL); continue; }
    if(s.kind==='orb'){
      s.vy+=CFG.ORB_GRAV*dt;
      const wasG=s.grounded;
      physics(s,dt);
      if(s.grounded){ s.vy=-260; s.bounces++; Audio2.sfx('orbBounce'); sparkBurst(s.x+3,s.y+7,3,PAL.yelL); }
      if(s.hitWall){ s.on=false; sparkBurst(s.x,s.y,6,PAL.yelL); continue; }
      if(s.bounces>CFG.ORB_BOUNCES){ s.on=false; sparkBurst(s.x,s.y,6,PAL.yelL); continue; }
      for(const e of enemies){
        if(!e.on||e.dead||e.def.harmless) continue;
        if(hit(s.x,s.y,s.w,s.h,e.x,e.y,e.w,e.h)){
          if(e.kind==='lag'){ sparkBurst(s.x,s.y,6,PAL.orange); s.on=false; killEnemy(e,'orb'); addScore(300,e.x,e.y); break; }
          killEnemy(e,'orb'); addScore(e.def.pts,e.x,e.y); s.on=false; hitStop(2); break;
        }
      }
      if(boss.on&&s.on&&hit(s.x,s.y,s.w,s.h,boss.x,boss.y,boss.w,boss.h)){ hurtBoss('orb'); s.on=false; }
    } else if(s.kind==='note'||s.kind==='ticket'||s.kind==='bolt'){
      if(s.kind!=='note') s.vy+=520*dt;
      s.x+=s.vx*dt; s.y+=s.vy*dt;
      if(s.kind==='note'){ s.x+=Math.sin(s.anim*6)*8*dt; }
      if(hit(s.x,s.y,s.w,s.h,player.x,player.y,player.w,player.h)){
        if(player.star<=0) playerDamage(); s.on=false; continue;
      }
      const tx=Math.floor((s.x+s.w/2)/TS), ty=Math.floor((s.y+s.h/2)/TS);
      if(SOLID[tileAt(tx,ty)]){ s.on=false; sparkBurst(s.x,s.y,4,PAL.off2); }
    } else if(s.kind==='shock'){
      s.x+=s.vx*dt;
      const ty=Math.floor((s.y+s.h+2)/TS), tx=Math.floor((s.x+s.w/2)/TS);
      if(!SOLID[tileAt(tx,ty)]&&!isSlope(tx,ty)) s.y+=180*dt;
      if(hit(s.x,s.y+4,s.w,s.h-4,player.x,player.y,player.w,player.h)){
        if(player.star<=0) playerDamage();
      }
      if(Math.random()<dt*40) spawnP(PT.SPARK,s.x+s.w/2,s.y+s.h,rnd(-40,40),rnd(-60,0),0.3,PAL.orange,2,200);
      if(s.x<cam.x-40||s.x>cam.x+CFG.VW+40) s.on=false;
    }
    if(s.on&&(s.x<-40||s.x>lvl.w*TS+40||s.y>lvl.h*TS+40)) s.on=false;
  }
}
function clearShots(){ for(const s of shots) s.on=false; }

/* ---------------- block bump animation ---------------- */
const BUMP_MAX=16, bumps=[];
for(let i=0;i<BUMP_MAX;i++) bumps.push({on:false,tx:0,ty:0,t:0});
function addBump(tx,ty){
  for(const b of bumps) if(!b.on){ b.on=true;b.tx=tx;b.ty=ty;b.t=0; return; }
}
function updateBumps(dt){
  for(const b of bumps){ if(!b.on) continue; b.t+=dt; if(b.t>0.22) b.on=false; }
}
function bumpOffset(tx,ty){
  for(const b of bumps) if(b.on&&b.tx===tx&&b.ty===ty) return -Math.sin((b.t/0.22)*Math.PI)*6;
  return 0;
}

/* ---------------- phones ---------------- */
function updatePhones(dt){
  for(const ph of lvl.phones){
    ph.anim+=dt;
    const dx=Math.abs((player.x+player.w/2)-(ph.x+ph.w/2));
    ph.bright=lerp(ph.bright,dx<110?1:0.32,1-Math.pow(0.01,dt));
    if(ph.type===T.PRING&&ph.ringing){
      ph.ringT-=dt;
      if(ph.ringT<0.6&&ph.ringT>0) ph.glow=1;
      if(ph.ringT<=0){
        ph.ringT=3;
        ph.glow=0;
        if(dx<300&&countEnemies()<40){
          const e=spawnEnemy(Math.random()<0.25?'churnie':'rue',ph.x+ph.w/2-6,ph.y-14,{vx:player.x<ph.x?-40:40});
          if(e){ e.vy=-160; puffDust(ph.x+ph.w/2,ph.y,5,PAL.tealL); }
          Audio2.sfx('ring');
        }
      }
    }
    if(ph.type===T.PHOLD){
      ph.holdT-=dt;
      const standing=player.grounded&&Math.abs((player.x+player.w/2)-(ph.x+ph.w/2))<14&&Math.abs(player.y+player.h-ph.y)<4;
      if(standing){ ph.holdT=Math.max(ph.holdT,0.8); ph.handset=approach(ph.handset,0,2*dt); }
      else {
        const cyc=3.5;
        const t=((ph.holdT%cyc)+cyc)%cyc;
        const up=t>2.2?1:(t>1.0?1:0);
        ph.handset=approach(ph.handset,up?1:0,2.6*dt);
        if(ph.holdT<=0){
          ph.holdT=cyc;
          if(ph.handset>0.6&&Math.abs(player.x-ph.x)<220){
            const dir=sign(player.x-ph.x)||1;
            spawnShot('note',ph.x+ph.w/2-4,ph.y-18,dir*70,-20);
            spawnShot('note',ph.x+ph.w/2-4,ph.y-14,dir*46,-45);
            Audio2.sfx('note',2);
          }
        }
      }
    }
    if(ph.glow>0) ph.glow=Math.max(0,ph.glow-dt*0.6);
  }
}
/* stomping a ringing phone hangs it up */
function checkPhoneStomp(){
  const p=player;
  if(p.vy<=0) return;
  for(const ph of lvl.phones){
    if(ph.type!==T.PRING||!ph.ringing) continue;
    if(p.x+p.w<ph.x||p.x>ph.x+ph.w) continue;
    if(Math.abs((p.y+p.h)-ph.y)>6) continue;
    ph.hp--;
    glassBurst(ph.x+ph.w/2,ph.y+6,8);
    Audio2.sfx('bump'); shake(1); hitStop(3);
    if(ph.hp<=0){ ph.ringing=false; addScore(500,ph.x,ph.y); addFloat(ph.x,ph.y-10,'HUNG UP',PAL.green); }
    p.vy=CFG.STOMP_V;
  }
}

/* ======================= 11. BOSSES ================================ */
const boss={on:false,kind:'',x:0,y:0,w:40,h:40,vx:0,vy:0,hp:3,maxhp:3,state:0,timer:0,
  inv:0,flash:0,phase:0,anim:0,dead:false,deadT:0,homeY:0,tell:0,dark:0,seg:0,grounded:false,
  py:0,px:0,corner:false,usePlats:false,riding:null,dropping:false,hitWall:0,arenaX0:0,arenaX1:0,intro:0,gateX:-1};
function startBoss(kind,x){
  boss.on=true; boss.kind=kind; boss.dead=false; boss.deadT=0; boss.anim=0;
  boss.state=0; boss.timer=1.2; boss.inv=0; boss.flash=0; boss.phase=0; boss.tell=0; boss.dark=0;
  boss.intro=1.4;
  /* arena bounds are set from the gate below, once we know where it landed */
  switch(kind){
    case 'queue': boss.w=34;boss.h=40;boss.hp=3;break;
    case 'splice': boss.w=40;boss.h=34;boss.hp=3;break;
    case 'muzz':  boss.w=34;boss.h=42;boss.hp=3;break;
    case 'outage':boss.w=76;boss.h=48;boss.hp=9;break;
  }
  boss.maxhp=boss.hp;
  /* close the gate BEHIND the player, never across or in front of him */
  let gx=Math.floor((player.x-2)/TS)-1;
  while(gx>1&&(gx+1)*TS>player.x) gx--;
  gx=clamp(gx,1,Math.floor(x/TS)-1);
  boss.gateX=gx;
  for(let ty=0;ty<lvl.h;ty++) if(!isSolid(gx,ty)) setTile(gx,ty,T.HARD);
  boss.arenaX0=gx*TS+TS;
  boss.arenaX1=Math.min(lvl.w*TS-TS,boss.arenaX0+CFG.VW-64);
  /* start him just inside the right of the screen so the entrance reads as a fight,
     not an empty corridor with a health bar */
  boss.x=clamp(player.x+230,boss.arenaX0+48,boss.arenaX1-boss.w-8);
  boss.y=(lvl.h-4)*TS-boss.h;
  if(kind==='splice'){ boss.y=TS*3; }
  if(kind==='outage'){ boss.y=TS*3; }
  boss.homeY=boss.y;
  music.play('boss');
  shake(4);
}
function hurtBoss(how){
  if(!boss.on||boss.dead||boss.inv>0) return;
  boss.hp--; boss.inv=1.1; boss.flash=0.35;
  Audio2.sfx('bossHit'); hitStop(CFG.HITSTOP_BOSS); shake(CFG.SHAKE_BOSS);
  sparkBurst(boss.x+boss.w/2,boss.y+boss.h/2,14,PAL.off);
  addScore(1000,boss.x,boss.y);
  if(boss.kind==='outage'){
    if(boss.hp===6||boss.hp===3){ boss.phase++; shake(5); }
  }
  if(boss.hp<=0){
    boss.dead=true; boss.deadT=0; Audio2.sfx('bossDie');
    music.stopAll(); addScore(5000,boss.x,boss.y);
  }
}
function updateBoss(dt){
  if(!boss.on) return;
  boss.anim+=dt;
  if(boss.flash>0) boss.flash-=dt;
  if(boss.inv>0) boss.inv-=dt;
  if(boss.intro>0){ boss.intro-=dt; return; }
  if(boss.dead){
    boss.deadT+=dt;
    boss.y+=40*dt*Math.min(1,boss.deadT);
    if(Math.random()<dt*30) sparkBurst(boss.x+rnd(0,boss.w),boss.y+rnd(0,boss.h),3,pick([PAL.yel,PAL.orange,PAL.off]));
    if(boss.deadT>2.2&&player.state==='play'){ bossDefeated(); }
    return;
  }
  const p=player;
  const floorY=(lvl.h-3)*TS;
  switch(boss.kind){
    /* ---- WORLD 1: THE QUEUE MANAGER ---- */
    case 'queue': {
      boss.timer-=dt;
      if(boss.state===0){                       // hop toward the player
        boss.vy+=CFG.GRAV_DOWN*dt;
        boss.vx=approach(boss.vx,sign(p.x-boss.x)*46,300*dt);
        physics(boss,dt);
        if(boss.grounded){ boss.vy=-260; shake(1); smokePuff(boss.x+boss.w/2,boss.y+boss.h,4); }
        if(boss.timer<=0){ boss.state=1; boss.timer=0.5; boss.tell=1; }
      } else if(boss.state===1){                // wind-up
        boss.vy+=CFG.GRAV_DOWN*dt; physics(boss,dt); boss.vx*=0.9;
        if(boss.timer<=0){
          boss.tell=0;
          if(Math.random()<0.45&&countEnemies()<16){
            const e=spawnEnemy('stack',boss.x,boss.y-10,{vx:-34}); if(e) e.vy=-140;
            Audio2.sfx('ring');
          } else {
            for(let i=0;i<3;i++) spawnShot('ticket',boss.x+8,boss.y+10,-90-i*40,-180-i*30,''+(41+i));
            Audio2.sfx('swoosh');
          }
          boss.state=0; boss.timer=2.0-boss.phase*0.3;
        }
      }
      boss.x=clamp(boss.x,boss.arenaX0,boss.arenaX1);
      /* stomp to damage */
      if(p.vy>0&&hit(p.x,p.y,p.w,p.h,boss.x,boss.y-2,boss.w,10)&&(p.py+p.h)<=boss.y+8){
        p.vy=CFG.STOMP_V_HELD; p.jumping=true; hurtBoss('stomp');
      } else if(hit(p.x,p.y,p.w,p.h,boss.x,boss.y,boss.w,boss.h)&&boss.inv<=0.6){
        if(p.star>0) hurtBoss('star'); else playerDamage();
      }
      break;
    }
    /* ---- WORLD 2: THE SPLICE ---- */
    case 'splice': {
      boss.timer-=dt;
      boss.x=clamp(lerp(boss.x,p.x-10,1-Math.pow(0.2,dt)),boss.arenaX0,boss.arenaX1);
      if(boss.state===0){                        // idle, cables coil
        boss.y=lerp(boss.y,TS*3,1-Math.pow(0.02,dt));
        if(boss.timer<=0){ boss.state=1; boss.timer=0.5; boss.tell=1; Audio2.sfx('charge'); }
      } else if(boss.state===1){                 // wind-up
        if(boss.timer<=0){ boss.state=2; boss.timer=0.55; boss.tell=0; boss.seg=sign(p.x-boss.x)||1; Audio2.sfx('zap'); }
      } else if(boss.state===2){                 // whip
        const t=1-boss.timer/0.55;
        const wx=boss.x+boss.w/2+boss.seg*t*150;
        const wy=boss.y+boss.h+40+Math.sin(t*Math.PI)*60;
        for(let i=0;i<2;i++) spawnP(PT.SPARK,wx+rnd(-6,6),wy+rnd(-6,6),rnd(-30,30),rnd(-30,30),0.25,PAL.tealL,2,0);
        if(hit(wx-10,wy-10,20,20,p.x,p.y,p.w,p.h)&&p.star<=0) playerDamage();
        if(boss.timer<=0){ boss.state=3; boss.timer=2.2; }
      } else if(boss.state===3){                 // recoil: junction box exposed
        boss.y=lerp(boss.y,TS*7,1-Math.pow(0.02,dt));
        if(boss.timer<=0){ boss.state=0; boss.timer=1.4; }
        if(p.vy>0&&hit(p.x,p.y,p.w,p.h,boss.x,boss.y,boss.w,12)&&(p.py+p.h)<=boss.y+10){
          p.vy=CFG.STOMP_V_HELD; p.jumping=true; hurtBoss('stomp'); boss.state=0; boss.timer=1.6;
        }
      }
      if(hit(p.x,p.y,p.w,p.h,boss.x,boss.y,boss.w,boss.h)&&boss.inv<=0.6&&boss.state!==3){
        if(p.star>0) hurtBoss('star'); else playerDamage();
      }
      if(boss.state===3&&hit(p.x,p.y,p.w,p.h,boss.x,boss.y,boss.w,boss.h)&&p.star>0) hurtBoss('star');
      break;
    }
    /* ---- WORLD 3: THE MUZZ ---- */
    case 'muzz': {
      boss.timer-=dt;
      boss.vy+=CFG.GRAV_DOWN*dt;
      if(boss.state===0){                        // pace
        boss.vx=approach(boss.vx,sign(p.x-boss.x)*40,240*dt);
        if(boss.timer<=0){ boss.state=1; boss.timer=0.5; boss.tell=1; Audio2.sfx('charge'); boss.vx=0; }
      } else if(boss.state===1){                 // telegraph the charge
        boss.vx*=0.86;
        if(boss.timer<=0){ boss.state=2; boss.timer=1.3; boss.seg=sign(p.x-boss.x)||1; boss.tell=0; }
      } else if(boss.state===2){                 // charge
        boss.vx=boss.seg*230;
        if(Math.random()<dt*30) spawnP(PT.DUST,boss.x+boss.w/2,boss.y+boss.h,-boss.seg*60,-20,0.35,PAL.sand,3,50);
        if(boss.timer<=0||boss.x<=boss.arenaX0+2||boss.x>=boss.arenaX1-2){
          boss.state=3; boss.timer=0.7; boss.vx=0;
          Audio2.sfx('thud'); shake(CFG.SHAKE_LAND);
          spawnShot('shock',boss.x+boss.w/2-7,boss.y+boss.h-14,-170);
          spawnShot('shock',boss.x+boss.w/2-7,boss.y+boss.h-14,170);
          ringDust(boss.x+boss.w/2,boss.y+boss.h,10);
        }
      } else {                                   // stunned
        boss.vx*=0.8;
        if(boss.timer<=0){ boss.state=0; boss.timer=1.6; }
      }
      physics(boss,dt);
      boss.x=clamp(boss.x,boss.arenaX0,boss.arenaX1);
      if(p.vy>0&&hit(p.x,p.y,p.w,p.h,boss.x,boss.y-2,boss.w,10)&&(p.py+p.h)<=boss.y+8){
        p.vy=CFG.STOMP_V_HELD; p.jumping=true; hurtBoss('stomp');
      } else if(hit(p.x,p.y,p.w,p.h,boss.x,boss.y,boss.w,boss.h)&&boss.inv<=0.6){
        if(p.star>0) hurtBoss('star'); else playerDamage();
      }
      break;
    }
    /* ---- WORLD 4: THE GREAT OUTAGE ---- */
    case 'outage': {
      boss.timer-=dt;
      const speed=1+boss.phase*0.45;
      boss.x=clamp(boss.x+Math.sin(boss.anim*0.7*speed)*50*dt,boss.arenaX0,boss.arenaX1-boss.w);
      boss.y=boss.homeY+Math.sin(boss.anim*1.3)*10;
      /* blackout pulses, deeper each phase */
      const cyc=4.2-boss.phase*0.9;
      const t=(boss.anim%cyc)/cyc;
      boss.dark=clamp(Math.sin(t*Math.PI*2)*0.5+0.5,0,1)*(0.55+boss.phase*0.18);
      if(boss.state===0){
        if(boss.timer<=0){ boss.state=1; boss.timer=0.5; boss.tell=1; Audio2.sfx('charge'); }
      } else if(boss.state===1){
        if(boss.timer<=0){
          boss.tell=0; boss.state=0; boss.timer=1.8-boss.phase*0.4;
          const n=2+boss.phase;
          for(let i=0;i<n;i++){
            spawnShot('bolt',boss.x+boss.w/2+rnd(-30,30),boss.y+boss.h,rnd(-40,40),120+i*20);
          }
          Audio2.sfx('zap'); flashScreen(0.5);
          if(countEnemies()<12&&Math.random()<0.5){
            const e=spawnEnemy('bat',boss.x+boss.w/2,boss.y+boss.h+10,{}); if(e){ e.homeY=e.y; }
          }
        }
      }
      /* the cloud is only vulnerable to orbs and stars, and to a stomp on its face */
      if(p.vy>0&&hit(p.x,p.y,p.w,p.h,boss.x,boss.y+boss.h-8,boss.w,10)&&(p.py+p.h)<=boss.y+boss.h){
        p.vy=CFG.STOMP_V_HELD; p.jumping=true; hurtBoss('stomp');
      } else if(hit(p.x,p.y,p.w,p.h,boss.x,boss.y,boss.w,boss.h)&&boss.inv<=0.6){
        if(p.star>0) hurtBoss('star'); else playerDamage();
      }
      break;
    }
  }
}

/* ========================== 12. CAMERA ============================= */
const cam={x:0,y:0,look:0,shake:0,dip:0,flash:0,hitstop:0,tx:0,ty:0,free:false};
function shake(a){ if(!SAVE.opt.shake) return; cam.shake=Math.max(cam.shake,a); }
function hitStop(frames){ cam.hitstop=Math.max(cam.hitstop,frames); }
function flashScreen(a){ if(!SAVE.opt.flash) return; cam.flash=Math.max(cam.flash,a); }
function updateCamera(dt){
  const p=player;
  const halfW=CFG.VW/2, halfH=CFG.VH/2;
  if(cam.free){
    if(Input.down('left')) cam.x-=200*dt; if(Input.down('right')) cam.x+=200*dt;
    if(Input.down('up')) cam.y-=200*dt;  if(Input.down('down')) cam.y+=200*dt;
  } else {
    const lookTarget=clamp(p.vx/CFG.RUN_MAX,-1,1)*CFG.CAM_LOOK;
    cam.look=lerp(cam.look,lookTarget,1-Math.pow(0.001,dt/CFG.CAM_LOOK_EASE*0.35));
    const wantX=p.x+p.w/2+cam.look-halfW;
    const dx=wantX-cam.tx;
    if(Math.abs(dx)>CFG.CAM_DEAD) cam.tx+=dx-sign(dx)*CFG.CAM_DEAD;
    cam.tx=lerp(cam.tx,wantX,1-Math.pow(0.004,dt));
    /* vertical: follow on landing or when out of the window */
    const wantY=p.y+p.h/2-halfH+18;
    const dy=wantY-cam.ty;
    if(p.grounded||Math.abs(dy)>CFG.CAM_VWIN||lvl.h*TS<=CFG.VH) cam.ty=lerp(cam.ty,wantY,1-Math.pow(0.008,dt));
    cam.x=cam.tx; cam.y=cam.ty;
  }
  cam.x=clamp(cam.x,0,Math.max(0,lvl.w*TS-CFG.VW));
  cam.y=clamp(cam.y,0,Math.max(0,lvl.h*TS-CFG.VH));
  if(cam.dip>0){ cam.dip-=dt*6; cam.y+=Math.max(0,cam.dip)*1.5; }
  if(cam.shake>0) cam.shake=Math.max(0,cam.shake-dt*14);
  if(cam.flash>0) cam.flash=Math.max(0,cam.flash-dt*3.4);
}
