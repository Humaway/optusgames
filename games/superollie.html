let g=null;                       // backbuffer 2d context
const THEME={
  w1:{sky:['#2E9BE0','#9FE3FF'],ground:'#4A5768',top:'#FECD03',edge:'#2A3240',deco:'#5A6A7D',
      fog:'rgba(160,220,255,0.15)'},
  w2:{sky:['#0A2430','#134454'],ground:'#33505E',top:'#00C4D0',edge:'#16232B',deco:'#3E6675',
      fog:'rgba(0,120,145,0.20)'},
  w3:{sky:['#E9713A','#FFD9A0'],ground:'#8E4526',top:'#E0A55B',edge:'#5A2A16',deco:'#A85A32',
      fog:'rgba(255,180,120,0.18)'},
  w4:{sky:['#050916','#141A3A'],ground:'#232B3E',top:'#7C4DFF',edge:'#10131F',deco:'#39406A',
      fog:'rgba(90,70,200,0.18)'}
};
function theme(){ return THEME[lvl?lvl.theme:'w1']||THEME.w1; }

/* --- drawing helpers --- */
function rr(c,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  c.beginPath();
  c.moveTo(x+r,y); c.lineTo(x+w-r,y); c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r); c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  c.lineTo(x+r,y+h); c.quadraticCurveTo(x,y+h,x,y+h-r);
  c.lineTo(x,y+r); c.quadraticCurveTo(x,y,x+r,y); c.closePath();
}
function fillRR(c,x,y,w,h,r,col){ c.fillStyle=col; rr(c,x,y,w,h,r); c.fill(); }
function circle(c,x,y,r,col){ c.fillStyle=col; c.beginPath(); c.arc(x,y,r,0,6.2832); c.fill(); }
function ellipse(c,x,y,rx,ry,col,rot){ c.fillStyle=col; c.beginPath(); c.ellipse(x,y,rx,ry,rot||0,0,6.2832); c.fill(); }
function line(c,x1,y1,x2,y2,col,w){ c.strokeStyle=col; c.lineWidth=w||1; c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.stroke(); }
function hz(c,x,y,w,h,c1,c2,step){          // diagonal hazard stripes
  c.save(); c.beginPath(); c.rect(x,y,w,h); c.clip();
  c.fillStyle=c1; c.fillRect(x,y,w,h);
  c.fillStyle=c2; const s=step||8;
  for(let i=-h;i<w;i+=s*2){ c.beginPath(); c.moveTo(x+i,y+h); c.lineTo(x+i+s,y+h); c.lineTo(x+i+s+h,y); c.lineTo(x+i+h,y); c.closePath(); c.fill(); }
  c.restore();
}
function txt(c,s,x,y,size,col,align,italic){
  c.font=(italic===false?'':'italic ')+'900 '+size+'px "Arial Black",Impact,sans-serif';
  c.textAlign=align||'left'; c.textBaseline='alphabetic'; c.fillStyle=col; c.fillText(s,x,y);
}
function txtSh(c,s,x,y,size,col,align,shcol){
  txt(c,s,x+1,y+1,size,shcol||'rgba(0,0,0,.65)',align);
  txt(c,s,x,y,size,col,align);
}

/* ---------------- parallax backgrounds ---------------- */
function drawBackground(){
  const th=theme();
  const gd=g.createLinearGradient(0,0,0,CFG.VH);
  const t=(lvl.dark||(boss.on&&boss.kind==='outage'))?0.25:0;
  gd.addColorStop(0,mixHex(th.sky[0],'#000000',t*0.5));
  gd.addColorStop(1,mixHex(th.sky[1],'#000000',t*0.5));
  g.fillStyle=gd; g.fillRect(0,0,CFG.VW,CFG.VH);
  const w=lvl.theme;
  if(w==='w1') bgYesStreet();
  else if(w==='w2') bgDucts();
  else if(w==='w3') bgOutback();
  else bgOrbit();
  /* push the whole backdrop back a step so tiles, Ollie and enemies read clearly */
  const wash={w1:0.20,w2:0.06,w3:0.16,w4:0.10}[w]||0.15;

/* ---------------- tiles ---------------- */
function drawTiles(){
  const th=theme();
  const x0=Math.max(0,Math.floor(cam.x/TS)-1), x1=Math.min(lvl.w-1,Math.ceil((cam.x+CFG.VW)/TS));
  const y0=Math.max(0,Math.floor(cam.y/TS)-1), y1=Math.min(lvl.h-1,Math.ceil((cam.y+CFG.VH)/TS));
  for(let ty=y0;ty<=y1;ty++){
    for(let tx=x0;tx<=x1;tx++){
      const t=lvl.grid[ty*lvl.w+tx];
      if(t===T.EMPTY) continue;
      const x=tx*TS, y=ty*TS+bumpOffset(tx,ty);
      drawTile(t,x,y,tx,ty,th);
    }
  }
}
function drawTile(t,x,y,tx,ty,th){
  switch(t){
    case T.GROUND: {
      const open=tileAt(tx,ty-1)!==T.GROUND&&!SOLID[tileAt(tx,ty-1)];
      g.fillStyle=th.ground; g.fillRect(x,y,16,16);
      g.fillStyle=th.edge; g.fillRect(x,y+13,16,3);
      if(open){
        g.fillStyle=th.top; g.fillRect(x,y,16,4);
        g.fillStyle=rgba(PAL.white,0.16); g.fillRect(x,y,16,1);
        if(lvl.theme==='w1'){ g.fillStyle=th.deco; g.fillRect(x+2,y+6,5,3); g.fillRect(x+9,y+10,5,3); }
        if(lvl.theme==='w3'){ g.fillStyle='rgba(255,220,170,.25)'; g.fillRect(x+3,y+5,3,2); g.fillRect(x+10,y+7,4,2); }
      } else {
        g.fillStyle=rgba(PAL.white,0.05); g.fillRect(x+2,y+3,4,2); g.fillRect(x+9,y+8,4,2);
      }
      break;
    }
    case T.HARD: {
      fillRR(g,x,y,16,16,3,th.edge);
      fillRR(g,x+1,y+1,14,14,3,th.ground);
      g.fillStyle=rgba(PAL.white,0.12); g.fillRect(x+2,y+2,12,2);
      g.fillStyle=rgba(PAL.ink,0.25); g.fillRect(x+2,y+12,12,2);
      break;
    }
    case T.BRIDGE: {
      g.fillStyle=th.edge; g.fillRect(x,y+4,16,7);
      g.fillStyle=th.ground; g.fillRect(x,y+4,16,4);
      break;
    }
    case T.BRICK: {
      fillRR(g,x,y,16,16,2,PAL.brownD);
      fillRR(g,x+1,y+1,14,14,2,PAL.brown);
      g.fillStyle=rgba(PAL.ink,0.22);
      g.fillRect(x+1,y+7,14,1.5); g.fillRect(x+7.5,y+1,1.5,6); g.fillRect(x+3.5,y+9,1.5,6); g.fillRect(x+11,y+9,1.5,6);
      g.fillStyle=rgba(PAL.white,0.12); g.fillRect(x+2,y+2,5,2);
      break;
    }
    case T.QPOW: case T.QCOIN: case T.QMULTI: case T.QSTAR: {
      const pulse=0.5+0.5*Math.sin(gameTime*4+tx);
      fillRR(g,x,y,16,16,3,PAL.yelXD);
      fillRR(g,x+1,y+1,14,14,3,mixHex(PAL.yel,PAL.yelL,pulse*0.5));
      g.fillStyle=rgba(PAL.white,0.35); g.fillRect(x+2,y+2,12,2);
      /* rotating "Yes" mark */
      const s=Math.abs(Math.cos(gameTime*2.2+tx*0.5));
      g.save(); g.translate(x+8,y+9); g.scale(Math.max(0.15,s),1);
      txt(g,'Y',0,4,11,PAL.ink,'center');
      g.restore();
      break;
    }
    case T.USED: {
      fillRR(g,x,y,16,16,3,'#1E252E');
      fillRR(g,x+1,y+1,14,14,3,'#39434F');
      g.fillStyle=rgba(PAL.white,0.08); g.fillRect(x+2,y+2,12,2);
      break;
    }
    case T.NOTE: {
      fillRR(g,x,y,16,16,3,PAL.tealXD);
      fillRR(g,x+1,y+1,14,14,3,PAL.teal);
      g.fillStyle=PAL.tealL; g.fillRect(x+3,y+4,10,8);
      g.fillStyle=PAL.tealXD; g.fillRect(x+3,y+4,3,3);
      g.fillStyle=rgba(PAL.white,0.3); g.fillRect(x+2,y+2,12,1);
      break;
    }
    case T.ROUTER: {
      const on=routerOn();
      fillRR(g,x,y,16,16,3,on?'#123C42':'#241E1E');
      if(on){ fillRR(g,x+1,y+1,14,14,3,'#1E5A62'); }
      else { g.globalAlpha=0.35; fillRR(g,x+1,y+1,14,14,3,'#3A2A2A'); g.globalAlpha=1; }
      circle(g,x+8,y+8,3,on?PAL.green:PAL.red);
      g.fillStyle=rgba(PAL.white,on?0.3:0.1); g.fillRect(x+3,y+3,10,1);
      break;
    }
    case T.ONEWAY: {
      g.fillStyle=PAL.ink; g.fillRect(x,y+1,16,5);
      g.fillStyle=PAL.teal; g.fillRect(x,y,16,3);
      g.fillStyle=rgba(PAL.white,0.25); g.fillRect(x,y,16,1);
      g.fillStyle=rgba(PAL.ink,0.4); g.fillRect(x+2,y+6,3,2); g.fillRect(x+11,y+6,3,2);
      break;
    }
    case T.SPIKE: {
      g.fillStyle='#8892A0';
      for(let i=0;i<3;i++){ g.beginPath(); g.moveTo(x+i*5+1,y+16); g.lineTo(x+i*5+3.5,y+5); g.lineTo(x+i*5+6,y+16); g.closePath(); g.fill(); }
      g.fillStyle=PAL.off; for(let i=0;i<3;i++){ g.fillRect(x+i*5+3,y+7,1,6); }
      break;
    }
    case T.CSPIKE: {
      g.fillStyle='#8892A0';
      for(let i=0;i<3;i++){ g.beginPath(); g.moveTo(x+i*5+1,y); g.lineTo(x+i*5+3.5,y+11); g.lineTo(x+i*5+6,y); g.closePath(); g.fill(); }
      break;
    }
    case T.COOLANT: case T.COOLANT_T: {
      const top=t===T.COOLANT_T;
      g.fillStyle='rgba(0,163,173,0.34)'; g.fillRect(x,y,16,16);
      g.fillStyle='rgba(95,224,232,0.12)'; g.fillRect(x,y+8,16,8);
      if(top){
        const wv=Math.sin(gameTime*2.4+tx*0.7)*1.5;
        g.fillStyle='rgba(95,224,232,0.55)'; g.fillRect(x,y+wv,16,2);
        g.fillStyle='rgba(255,255,255,0.25)'; g.fillRect(x,y+wv-1,16,1);
      }
      break;
    }
    case T.CONV_L: case T.CONV_R: {
      g.fillStyle='#2A3240'; g.fillRect(x,y,16,10);
      g.fillStyle='#4A5768'; g.fillRect(x,y,16,3);
      const dir=t===T.CONV_R?1:-1;
      const off=((gameTime*40*dir)%8+8)%8;
      g.fillStyle=PAL.yel;
      for(let i=-1;i<3;i++) g.fillRect(x+i*8+off,y+4,4,2);
      g.fillStyle='#1B2027'; g.fillRect(x,y+10,16,6);
      circle(g,x+4,y+11,2.5,'#39434F'); circle(g,x+12,y+11,2.5,'#39434F');
      break;
    }
    case T.VENT: {
      g.fillStyle='#39434F'; g.fillRect(x,y+8,16,8);
      g.fillStyle='#1B2027'; g.fillRect(x+2,y+9,12,3);
      const ph=(gameTime*0.6+tx*0.13)%1;
      if(ph<0.35){
        const a=Math.sin(ph/0.35*Math.PI);
        const hgt=44*a;
        const gd=g.createLinearGradient(0,y-hgt,0,y+8);
        gd.addColorStop(0,'rgba(255,107,61,0)'); gd.addColorStop(1,'rgba(255,107,61,0.75)');
        g.fillStyle=gd; g.fillRect(x+3,y+8-hgt,10,hgt);
        if(Math.random()<0.4) spawnP(PT.SMOKE,x+8+rnd(-3,3),y+4,rnd(-8,8),-rnd(40,90),0.4,PAL.orange,3,0);
      } else {
        g.fillStyle=rgba(PAL.orange,0.25); g.fillRect(x+4,y+6,8,2);
      }
      break;
    }
    case T.WIRE: {
      g.fillStyle='#1B2027'; g.fillRect(x,y+6,16,4);
      const f=(gameTime*8+tx)%1;
      g.strokeStyle=f<0.5?PAL.yelL:PAL.orange; g.lineWidth=1.5;
      g.beginPath(); g.moveTo(x+2,y+8);
      for(let i=1;i<5;i++) g.lineTo(x+2+i*3,y+8+(i%2?-3:3));
      g.stroke();
      break;
    }
    case T.FAN: {
      const a=gameTime*7+tx;
      g.save(); g.translate(x+8,y+8); g.rotate(a);
      g.fillStyle='#7C8894';
      for(let i=0;i<3;i++){ g.rotate(2.094); g.beginPath(); g.ellipse(0,-5,2.5,6,0,0,6.2832); g.fill(); }
      g.restore();
      circle(g,x+8,y+8,2.5,'#39434F');
      break;
    }
    case T.FALLTILE: {
      fillRR(g,x,y,16,16,2,'#39434F');
      g.fillStyle='#4A5768'; g.fillRect(x+2,y+2,12,5);
      break;
    }
    case T.SL_R: case T.SL_L: case T.SL_R1: case T.SL_R2: case T.SL_L1: case T.SL_L2: {
      g.fillStyle=th.ground;
      g.beginPath();
      const a=slopeSurf(t,0), b=slopeSurf(t,16);
      g.moveTo(x,y+a); g.lineTo(x+16,y+b); g.lineTo(x+16,y+16); g.lineTo(x,y+16); g.closePath(); g.fill();
      g.strokeStyle=th.top; g.lineWidth=3;
      g.beginPath(); g.moveTo(x,y+a+1); g.lineTo(x+16,y+b+1); g.stroke();
      break;
    }
    case T.FLAG: {
      g.fillStyle='#5A6A7D'; g.fillRect(x+6,y,4,16);
      g.fillStyle='#7C8894'; g.fillRect(x+7,y,1,16);
      if(ty%3===0){ line(g,x+3,y+8,x+13,y+8,'#5A6A7D',1.5); }
      if(tileAt(tx,ty-1)!==T.FLAG){
        /* mast head with signal dishes */
        g.fillStyle=PAL.teal; g.fillRect(x+2,y-6,12,5);
        g.fillStyle=PAL.yel; g.fillRect(x+3,y-5,4,3);
        for(let i=0;i<3;i++){
          const a2=0.4+i*0.25, r=6+i*4;
          g.strokeStyle=rgba(PAL.tealL,0.55-i*0.14); g.lineWidth=1.5;
          g.beginPath(); g.arc(x+8,y-4,r,-1.9,-1.2); g.stroke();

    case T.DOOR: {
      g.fillStyle='#E8EEF4'; g.fillRect(x-8,y-30,32,46);
      g.fillStyle=PAL.teal; g.fillRect(x-8,y-30,32,9);
      g.fillStyle=PAL.yel; g.fillRect(x-6,y-28,5,5);
      g.fillStyle=PAL.ink; g.font='italic 900 7px "Arial Black",sans-serif'; g.textAlign='left';
      g.fillText('YES',x+1,y-23);
      g.fillStyle='#0E1116'; g.fillRect(x-2,y-14,20,30);
      g.fillStyle=PAL.tealD; g.fillRect(x,y-12,16,28);
      g.fillStyle=rgba(PAL.white,0.18); g.fillRect(x+1,y-11,6,26);
      break;
    }
    case T.PWALL: {
      fillRR(g,x,y,16,16,4,PAL.ink2);
      fillRR(g,x+2,y+3,12,10,2,mixHex(PAL.tealD,PAL.yel,0.1));

  }
  if(DEBUG&&isSolid(tx,ty)){ g.strokeStyle='rgba(255,0,0,.35)'; g.lineWidth=0.5; g.strokeRect(x+0.25,y+0.25,15.5,15.5); }

/* ---------------- phones (the signature art) ---------------- */
function drawPhones(){
  for(const ph of lvl.phones){
    if(ph.x+ph.w<cam.x-20||ph.x>cam.x+CFG.VW+20) continue;

function drawPhone(ph){
  const x=ph.x,y=ph.y,w=ph.w,h=ph.h;
  const ring=(ph.type===T.PRING&&ph.ringing);
  const shakeX=(ring&&ph.ringT<0.6)?Math.sin(gameTime*60)*1.2:0;
  g.save(); g.translate(shakeX,0);
  /* handset for hold-music phones rises out of the top */
  if(ph.type===T.PHOLD){
    const hh=ph.handset*22;
    if(hh>0.5){
      g.strokeStyle=PAL.ink2; g.lineWidth=2;
      g.beginPath(); g.moveTo(x+w/2,y+4); 
      g.quadraticCurveTo(x+w/2+Math.sin(gameTime*3)*6,y-hh*0.5,x+w/2+Math.sin(gameTime*2.2)*7,y-hh);
      g.stroke();
      const hx=x+w/2+Math.sin(gameTime*2.2)*7, hy=y-hh;
      g.save(); g.translate(hx,hy); g.rotate(Math.sin(gameTime*2.2)*0.35);
      fillRR(g,-8,-5,16,8,3,PAL.ink2);
      fillRR(g,-8,-5,16,3,1.5,PAL.ink3);
      circle(g,-6,1,2.5,PAL.tealD); circle(g,6,1,2.5,PAL.tealD);
      g.restore();
    }
  }
  /* body */
  const dark=(ph.type===T.PENTER||ph.type===T.PWARP||ph.type===T.EXITP)?PAL.ink2:PAL.tealXD;
  fillRR(g,x,y,w,h,6,PAL.ink);
  fillRR(g,x+1,y+1,w-2,h-1,5,dark);
  fillRR(g,x+1.5,y+1.5,w-3,4,3,rgba(PAL.white,0.10));
  /* screen */
  const sx=x+3,sy=y+4,sw=w-6,sh=Math.min(h-8,44);
  const br=0.35+ph.bright*0.65;
  fillRR(g,sx,sy,sw,sh,3,mixHex('#0A1D20',PAL.tealD,0.35*br));
  g.save();
  rr(g,sx,sy,sw,sh,3); g.clip();
  /* screen contents */
  if(ph.type===T.PENTER||ph.type===T.EXITP){
    const pulse=0.5+0.5*Math.sin(gameTime*4);
    const isExit=ph.type===T.EXITP;
    circle(g,sx+sw/2,sy+sh/2-2,7+pulse*1.5,rgba(isExit?PAL.red:PAL.green,0.25*br));
    circle(g,sx+sw/2,sy+sh/2-2,5.5,mixHex(isExit?PAL.red:PAL.green,PAL.white,pulse*0.25));
    g.fillStyle=PAL.ink;
    g.save(); g.translate(sx+sw/2,sy+sh/2-2); g.rotate(isExit?2.4:0.6);
    g.fillRect(-3,-1.5,6,3); g.fillRect(-3.5,-2.5,2.5,2.5); g.fillRect(1,-2.5,2.5,2.5);
    g.restore();
    txt(g,isExit?'END':'ANSWER',sx+sw/2,sy+sh-2,5,rgba(PAL.off,0.8*br),'center');
  } else if(ph.type===T.PWARP){
    for(let i=0;i<9;i++){
      const cx=sx+4+(i%3)*((sw-8)/2.4), cy=sy+5+((i/3)|0)*7;
      const lit=((gameTime*4)|0)%9===i;
      circle(g,cx,cy,2.4,lit?PAL.yel:rgba(PAL.tealL,0.35*br));
    }
    txt(g,'WARP',sx+sw/2,sy+sh-2,5,rgba(PAL.yel,br),'center');
  } else if(ring){
    const a=0.5+0.5*Math.sin(gameTime*14);
    g.fillStyle=rgba(PAL.orange,(0.25+a*0.4)*br); g.fillRect(sx,sy,sw,sh);
    txt(g,'CALL',sx+sw/2,sy+sh/2,7,rgba(PAL.off,br),'center');
    txt(g,'INCOMING',sx+sw/2,sy+sh/2+8,5,rgba(PAL.off,0.7*br),'center');
  } else {
    /* signal bars filling + spinner + notification banner */
    const t=(gameTime*0.8+ph.anim)%3;
    for(let i=0;i<4;i++){
      const bh=2+i*2.4, on=(t*2)>i;
      g.fillStyle=on?rgba(PAL.yel,br):rgba(PAL.off,0.18*br);
      g.fillRect(sx+2+i*3.2,sy+8-bh+2,2.2,bh);
    }
    g.strokeStyle=rgba(PAL.tealL,0.8*br); g.lineWidth=1.5;
    g.beginPath(); g.arc(sx+sw-6,sy+6,3.4,gameTime*4,gameTime*4+2.4); g.stroke();
    if(sh>18){
      const bt=(gameTime*0.5+ph.notif)%1;
      const msg=NOTIFS[(ph.notif+((gameTime*0.2)|0))%NOTIFS.length];
      fillRR(g,sx+1,sy+11,sw-2,9,2,rgba(PAL.off,0.12*br));
      g.save(); g.beginPath(); g.rect(sx+1,sy+11,sw-2,9); g.clip();
      g.font='italic 900 5px "Arial Black",sans-serif'; g.textAlign='left';
      g.fillStyle=rgba(PAL.off,0.9*br);
      const tw=g.measureText(msg).width;
      const scroll=((gameTime*14)%(tw+sw))-sw+2;
      g.fillText(msg,sx+2+sw-4-scroll,sy+18);
      g.restore();
    }
    if(sh>30){
      for(let i=0;i<3;i++){
        fillRR(g,sx+2,sy+22+i*7,sw-4,5,2,rgba(PAL.tealL,(0.10+0.06*Math.sin(gameTime*2+i))*br));
      }
    }
  }
  g.restore();
  /* glass highlight */
  g.save(); rr(g,sx,sy,sw,sh,3); g.clip();
  const gd=g.createLinearGradient(sx,sy,sx+sw,sy+sh);
  gd.addColorStop(0,'rgba(255,255,255,0.16)'); gd.addColorStop(0.4,'rgba(255,255,255,0.03)'); gd.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gd; g.fillRect(sx,sy,sw,sh);
  g.restore();
  /* speaker + button */
  g.fillStyle=rgba(PAL.off,0.25); g.fillRect(x+w/2-4,y+2,8,1.5);
  if(h>sh+12) circle(g,x+w/2,y+sh+8,2.5,rgba(PAL.off,0.2));
  g.restore();
}

/* ---------------- particles & floats ---------------- */
function drawParts(){
  for(let i=0;i<PART_MAX;i++){
    const p=parts[i]; if(!p.on) continue;
    const a=clamp(p.life/p.max,0,1);
    g.globalAlpha=a;
    switch(p.type){
      case PT.SHARD: case PT.PAPER: case PT.GLASS:
        g.save(); g.translate(p.x,p.y); g.rotate(p.rot);
        g.fillStyle=p.col; g.fillRect(-p.size/2,-p.size/2,p.size,p.size*(p.type===PT.PAPER?0.7:1));
        g.restore(); break;
      case PT.TRAIL:
        g.fillStyle=p.col; g.globalAlpha=a*0.5;
        g.beginPath(); g.arc(p.x,p.y,p.size*a,0,6.2832); g.fill(); break;
      case PT.RING:
        g.strokeStyle=p.col; g.lineWidth=1.5; g.globalAlpha=a*0.8;
        g.beginPath(); g.arc(p.x,p.y,(1-a)*18+2,0,6.2832); g.stroke(); break;
      case PT.LINE:
        g.fillStyle=p.col; g.fillRect(p.x,p.y,p.size,1); break;
      case PT.BUBBLE:
        g.strokeStyle=p.col; g.lineWidth=1; g.globalAlpha=a*0.7;
        g.beginPath(); g.arc(p.x,p.y,p.size,0,6.2832); g.stroke(); break;
      case PT.STAR: {
        g.save(); g.translate(p.x,p.y); g.rotate(p.rot);
        g.fillStyle=p.col; g.fillRect(-p.size/2,-p.size/2,p.size,p.size);
        g.fillStyle=PAL.white; g.fillRect(-p.size/4,-p.size/4,p.size/2,p.size/2);
        g.restore(); break;
      }
      case PT.SMOKE:
        g.globalAlpha=a*0.5; circle(g,p.x,p.y,p.size*(1.4-a*0.4),p.col); break;
      default:
        g.fillStyle=p.col;
        g.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);
    }
    g.globalAlpha=1;
  }
}
function drawFloats(){
  for(let i=0;i<FLOAT_MAX;i++){
    const f=floats[i]; if(!f.on) continue;
    g.globalAlpha=clamp(1-(f.t/0.85),0,1);
    txtSh(g,f.txt,f.x,f.y,f.txt.length>4?7:8,f.col,'center');
    g.globalAlpha=1;
  }
}

/* -------------------- Ollie ---------------------------------------- */
function tint(c,p){
  if(p&&p.dz>0) return mixHex(c,'#8A9099',0.72);
  return c;
}
function drawOllie(cx,by,s,o){
  /* cx = centre x, by = feet y, s = scale, o = options bag */
  const c=g;
  const sqx=o.sqx||1, sqy=o.sqy||1;
  const bw=14*s*sqx, bh=15*s*sqy;
  const legL=(o.big?7:4)*s;
  const bodyB=by-legL;                 // bottom of the body ball
  const cy=bodyB-bh/2;
  let body=PAL.yel, bodyD=PAL.yelD, bodyL=PAL.yelL;
  if(o.star>0){
    const hue=(o.starPhase*40)%360;
    body='hsl('+hue+',95%,58%)'; bodyD='hsl('+hue+',90%,40%)'; bodyL='hsl('+hue+',100%,78%)';
  } else if(o.dz>0){ body=tint(PAL.yel,o); bodyD=tint(PAL.yelD,o); bodyL=tint(PAL.yelL,o); }
  const ink=o.dz>0?'#4A5158':PAL.ink;
  c.save();
  c.translate(cx,cy);
  if(o.lean) c.rotate(o.lean);
  /* --- satellite cape --- */
  if(o.power===3){
    c.save();
    const flap=Math.sin(gameTime*7)*0.25+(o.gliding?0.9:0)+Math.abs(o.vx||0)/600;
    c.fillStyle=o.gliding?PAL.tealL:PAL.teal;
    c.beginPath();
    c.moveTo(-bw*0.1,-bh*0.25);
    c.quadraticCurveTo(-bw*(0.9+flap),0,-bw*(0.5+flap*0.4),bh*0.55);
    c.quadraticCurveTo(-bw*0.2,bh*0.3,-bw*0.05,bh*0.1);
    c.closePath(); c.fill();
    c.restore();
  }
  /* --- legs --- */
  const running=o.grounded&&Math.abs(o.vx||0)>6;
  const rp=(o.runPhase||0);
  let l1=0,l2=0,lift1=0,lift2=0;
  if(running){
    const ph=rp*Math.PI*2;
    l1=Math.sin(ph)*3.4*s; l2=Math.sin(ph+Math.PI)*3.4*s;
    lift1=Math.max(0,Math.cos(ph))*2.6*s; lift2=Math.max(0,Math.cos(ph+Math.PI))*2.6*s;
  } else if(!o.grounded){
    l1=(o.vy>0?2:-2)*s; l2=(o.vy>0?-2:2)*s;
  }
  c.strokeStyle=ink; c.lineWidth=1.6*s; c.lineCap='round';
  const legY=bh/2-1;
  c.beginPath(); c.moveTo(-2.2*s,legY-1); c.lineTo(-2.2*s+l1,legY+legL-lift1); c.stroke();
  c.beginPath(); c.moveTo( 2.2*s,legY-1); c.lineTo( 2.2*s+l2,legY+legL-lift2); c.stroke();
  c.lineWidth=2.2*s;
  c.beginPath(); c.moveTo(-2.2*s+l1,legY+legL-lift1); c.lineTo(-2.2*s+l1+2.4*s*(o.face||1),legY+legL-lift1); c.stroke();
  c.beginPath(); c.moveTo( 2.2*s+l2,legY+legL-lift2); c.lineTo( 2.2*s+l2+2.4*s*(o.face||1),legY+legL-lift2); c.stroke();
  /* --- arms --- */
  const f=o.face||1;
  let armA=0.5, armB=-0.5;
  if(!o.grounded){ armA=o.vy<0?-1.5:-0.6; armB=o.vy<0?-1.2:0.9; }
  else if(running){ armA=Math.sin(rp*Math.PI*2)*0.9; armB=Math.sin(rp*Math.PI*2+Math.PI)*0.9; }
  else if(o.skid){ armA=-1.1; armB=1.1; }
  c.strokeStyle=ink; c.lineWidth=1.5*s; 
  for(const [sd,a] of [[-1,armA],[1,armB]]){
    const ax=sd*bw*0.42, ay=-bh*0.02;
    c.beginPath(); c.moveTo(ax,ay);
    c.quadraticCurveTo(ax+sd*3.4*s,ay+2*s-a*2*s,ax+sd*5*s,ay-a*3.4*s);
    c.stroke();
  }
  /* --- body --- */
  c.fillStyle=body;
  c.beginPath(); c.ellipse(0,0,bw/2,bh/2,0,0,6.2832); c.fill();
  c.fillStyle=bodyD;
  c.beginPath(); c.ellipse(0,bh*0.16,bw*0.46,bh*0.32,0,0,6.2832); c.fill();
  c.fillStyle=body;
  c.beginPath(); c.ellipse(0,-bh*0.04,bw*0.48,bh*0.44,0,0,6.2832); c.fill();
  c.fillStyle=rgba(PAL.white,0.55);
  c.beginPath(); c.ellipse(-bw*0.22,-bh*0.28,bw*0.14,bh*0.10,-0.5,0,6.2832); c.fill();
  /* --- teal collar --- */
  c.fillStyle=o.dz>0?tint(PAL.teal,o):PAL.teal;
  c.save(); c.translate(0,bh*0.36); c.rotate((o.scarf||0)*0.02);
  c.beginPath(); c.ellipse(0,0,bw*0.34,bh*0.10,0,0,6.2832); c.fill();
  c.fillStyle=o.dz>0?tint(PAL.tealD,o):PAL.tealD;
  c.beginPath(); c.moveTo(f*bw*0.2,0); c.lineTo(f*(bw*0.2+3.5*s),3.5*s); c.lineTo(f*bw*0.18,3.8*s); c.closePath(); c.fill();
  c.restore();
  /* --- visor / face band --- */
  const vw=bw*0.78, vh=bh*0.40;
  c.save();
  c.translate(f*bw*0.04,-bh*0.10);
  c.rotate(-0.06*f);
  c.fillStyle=o.dz>0?'#D8DCE0':PAL.off;
  c.beginPath();
  c.moveTo(-vw/2,-vh*0.2);
  c.quadraticCurveTo(0,-vh*0.85,vw/2,-vh*0.1);
  c.quadraticCurveTo(vw/2+1,vh*0.6,0,vh*0.62);
  c.quadraticCurveTo(-vw/2-1,vh*0.6,-vw/2,-vh*0.2);
  c.closePath(); c.fill();
  /* eyes */
  const ex=(o.eyeX||0)*s*0.9, ey=(o.eyeY||0)*s*0.6;
  const blink=o.blink>0;
  c.fillStyle=ink;
  if(blink){
    c.fillRect(-vw*0.26+ex-1.6*s,ey,3.2*s,1.1*s);
    c.fillRect( vw*0.16+ex-1.6*s,ey,3.2*s,1.1*s);
  } else {
    c.beginPath(); c.ellipse(-vw*0.24+ex,ey,1.55*s,1.85*s,0,0,6.2832); c.fill();
    c.beginPath(); c.ellipse( vw*0.20+ex,ey,1.55*s,1.85*s,0,0,6.2832); c.fill();
    c.fillStyle=rgba(PAL.white,0.9);
    c.beginPath(); c.arc(-vw*0.24+ex+0.5*s,ey-0.7*s,0.5*s,0,6.2832); c.fill();
    c.beginPath(); c.arc( vw*0.20+ex+0.5*s,ey-0.7*s,0.5*s,0,6.2832); c.fill();
  }
  c.restore();
  /* --- antenna tuft with spring --- */
  const a1=(o.ant1||0), a2=(o.ant2||0);
  c.strokeStyle=body; c.lineWidth=2.2*s; c.lineCap='round';
  c.beginPath();
  c.moveTo(0,-bh*0.45);
  c.quadraticCurveTo(a1*0.6,-bh*0.62,a1+a2*0.5,-bh*0.78);
  c.stroke();
  c.fillStyle=bodyL;
  c.beginPath(); c.arc(a1+a2*0.5,-bh*0.80,1.7*s,0,6.2832); c.fill();
  /* --- power badges --- */
  if(o.power===2){
    /* 5G hexagon badge */
    c.save(); c.translate(f*bw*0.30,bh*0.06); c.rotate(gameTime*1.5);
    c.fillStyle=PAL.purple; c.beginPath();
    for(let i=0;i<6;i++){ const a=i/6*6.2832; const r=2.6*s; if(i===0)c.moveTo(Math.cos(a)*r,Math.sin(a)*r); else c.lineTo(Math.cos(a)*r,Math.sin(a)*r); }
    c.closePath(); c.fill();
    c.restore();
    c.fillStyle=PAL.tealL; c.fillRect(f*bw*0.30-1.2*s,bh*0.06-1*s,2.4*s,2*s);
  }
  if(o.power===3){
    /* little dish on the head */
    c.save(); c.translate(-f*bw*0.18,-bh*0.42); c.rotate(-0.5*f);
    c.fillStyle=PAL.off; c.beginPath(); c.ellipse(0,0,3.2*s,1.6*s,0,0,6.2832); c.fill();
    c.fillStyle=PAL.teal; c.beginPath(); c.ellipse(0,-0.3*s,2.4*s,1.1*s,0,0,6.2832); c.fill();
    c.restore();
  }
  c.restore();
  /* --- shield bubble --- */
  if(o.shield){
    const a=0.35+0.15*Math.sin(gameTime*4);
    c.strokeStyle=rgba(PAL.tealL,0.85); c.lineWidth=1.2;
    c.beginPath(); c.arc(cx,cy+2,bw*0.9,0,6.2832); c.stroke();
    c.fillStyle=rgba(PAL.teal,a*0.25);
    c.beginPath(); c.arc(cx,cy+2,bw*0.9,0,6.2832); c.fill();
  }
  if(o.spinT>0){
    c.strokeStyle=rgba(PAL.tealL,0.7); c.lineWidth=2;
    c.beginPath(); c.arc(cx,cy,bw*0.95,gameTime*30,gameTime*30+3.4); c.stroke();
  }
}
function drawPlayer(){
  const p=player;
  if(p.state==='enter'||p.state==='warp'){
    /* shrink into the screen with a ripple */
    const t=clamp(p.seqT/0.7,0,1);
    g.save(); g.globalAlpha=1-t*0.85;
    drawOllie(p.x+p.w/2,p.y+p.h,(p.power>=1?1.5:1)*(1-t*0.8),ollieOpts(p));
    g.restore();
    const ph=p.seqData;
    if(ph){
      for(let i=0;i<3;i++){
        g.strokeStyle=rgba(PAL.tealL,0.6*(1-t)); g.lineWidth=1.5;
        g.beginPath(); g.arc(ph.x+ph.w/2,ph.y+12,6+((t*30+i*10)%30),0,6.2832); g.stroke();
      }
    }
    return;
  }
  if(p.hurt>0&&p.state==='play'){
    const fr=Math.floor(p.hurt*20)%2;
    if(fr===0) return;
  }
  drawOllie(p.x+p.w/2,p.y+p.h,p.power>=1?1.5:1,ollieOpts(p));
  if(DEBUG){ g.strokeStyle='#0f0'; g.lineWidth=0.5; g.strokeRect(p.x+0.25,p.y+0.25,p.w-0.5,p.h-0.5); }
}
function ollieOpts(p){
  return {sqx:p.sqx,sqy:p.sqy,face:p.face,vx:p.vx,vy:p.vy,grounded:p.grounded,runPhase:p.runPhase,
    lean:p.lean,blink:p.blink,eyeX:p.eyeX,eyeY:p.eyeY,power:p.power,star:p.star,starPhase:p.starPhase,
    dz:p.dz,shield:p.shield,gliding:p.gliding,spinT:p.spinT,skid:p.skid,big:p.power>=1,
    ant1:p.antenna.p,ant2:p.antenna2.p,scarf:p.scarf.p};
}

/* -------------------- enemies -------------------------------------- */
function drawRueBody(x,y,w,h,e,scale){
  const c=g, s=scale||1;
  const sq=e&&e.flat?{x:1.5,y:0.25}:{x:1,y:1};
  const cx=x+w/2, by=y+h;
  const bw=w*sq.x, bh=h*sq.y;
  c.save(); c.translate(cx,by);
  const wob=e&&!e.flat?Math.sin((e.anim||0)*8)*0.06:0;
  c.rotate(wob);
  /* shoes */
  c.fillStyle=PAL.ink;
  c.fillRect(-bw*0.42,-2.5*s,bw*0.34,2.5*s);
  c.fillRect( bw*0.08,-2.5*s,bw*0.34,2.5*s);
  /* suit */
  c.fillStyle='#2A3240';
  rr(c,-bw/2,-bh,bw,bh-1.5*s,3*s); c.fill();
  c.fillStyle='#1B2027';
  rr(c,-bw/2,-bh*0.42,bw,bh*0.42-1.5*s,3*s); c.fill();
  /* shirt + tie */
  c.fillStyle=PAL.off;
  c.beginPath(); c.moveTo(-bw*0.16,-bh*0.62); c.lineTo(bw*0.16,-bh*0.62); c.lineTo(0,-bh*0.22); c.closePath(); c.fill();
  c.fillStyle=PAL.teal;
  c.beginPath(); c.moveTo(-bw*0.06,-bh*0.60); c.lineTo(bw*0.06,-bh*0.60); c.lineTo(0,-bh*0.26); c.closePath(); c.fill();
  /* lanyard, swinging on a spring */
  const lp=(e&&e.spring)?e.spring.p:0;
  c.strokeStyle=PAL.tealD; c.lineWidth=1;
  c.beginPath(); c.moveTo(-bw*0.18,-bh*0.66); c.quadraticCurveTo(lp*0.5,-bh*0.40,bw*0.18,-bh*0.66); c.stroke();
  c.fillStyle=PAL.off; c.fillRect(lp*0.5-1.5*s,-bh*0.42,3*s,4*s);
  c.fillStyle=PAL.yel; c.fillRect(lp*0.5-1.5*s,-bh*0.42,3*s,1.2*s);
  /* head */
  const hr=bw*0.30;
  c.fillStyle='#E8C9A8';
  c.beginPath(); c.arc(0,-bh+hr*0.7,hr,0,6.2832); c.fill();
  /* hair */
  c.fillStyle='#B9BDC2';
  c.beginPath(); c.arc(0,-bh+hr*0.45,hr*0.98,Math.PI,0); c.fill();
  c.fillRect(-hr,-bh+hr*0.4,hr*2,hr*0.22);
  /* face: dot eyes + over-confident smile */
  c.fillStyle=PAL.ink;
  c.beginPath(); c.arc(-hr*0.36,-bh+hr*0.72,0.85*s,0,6.2832); c.fill();
  c.beginPath(); c.arc( hr*0.36,-bh+hr*0.72,0.85*s,0,6.2832); c.fill();
  c.strokeStyle=PAL.ink; c.lineWidth=0.9*s;
  c.beginPath(); c.arc(0,-bh+hr*0.85,hr*0.42,0.25,Math.PI-0.25); c.stroke();
  c.restore();
}
function drawEnemies(){
  for(const e of enemies){
    if(!e.on) continue;
    if(e.x+e.w<cam.x-24||e.x>cam.x+CFG.VW+24) continue;
    g.save();
    if(e.flash>0&&Math.floor(e.flash*30)%2===0) g.globalAlpha=0.75;
    drawEnemy(e);
    g.globalAlpha=1;
    g.restore();
    if(DEBUG){ g.strokeStyle='#f0f'; g.lineWidth=0.5; g.strokeRect(e.x+.25,e.y+.25,e.w-.5,e.h-.5); }
  }
}
function drawEnemy(e){
  const x=e.x,y=e.y,w=e.w,h=e.h;
  if(e.dead&&e.state===9){ g.globalAlpha=0.9; g.save(); g.translate(x+w/2,y+h/2); g.scale(1,-1); g.translate(-x-w/2,-y-h/2); }
  switch(e.kind){
    case 'rue': drawRueBody(x,y,w,h,e,1); break;
    case 'hardhat': {
      drawRueBody(x,y+3,w,h-3,e,1);
      g.fillStyle=PAL.yel;
      g.beginPath(); g.arc(x+w/2,y+5,w*0.42,Math.PI,0); g.fill();
      g.fillRect(x+w*0.06,y+4.5,w*0.88,1.6);
      g.fillStyle=PAL.yelD; g.fillRect(x+w/2-0.7,y+1.6,1.4,3.4);
      break;
    }
    case 'winged': {
      drawRueBody(x,y,w,h,e,1);
      const fl=Math.sin(e.anim*14)*3;
      g.strokeStyle=PAL.teal; g.lineWidth=1.4;
      g.beginPath(); g.moveTo(x+2,y+2); g.lineTo(x-2,y-2+fl); g.stroke();
      g.beginPath(); g.moveTo(x+w-2,y+2); g.lineTo(x+w+2,y-2+fl); g.stroke();
      circle(g,x-2,y-2+fl,1.4,PAL.tealL); circle(g,x+w+2,y-2+fl,1.4,PAL.tealL);
      g.strokeStyle=PAL.ink; g.lineWidth=1.6;
      g.beginPath(); g.arc(x+w/2,y+3.5,w*0.42,Math.PI,0); g.stroke();
      break;
    }
    case 'stack': {
      const each=h/3;
      for(let i=0;i<3;i++){
        const yy=y+i*each;
        const sw=Math.sin(e.anim*6+i)*1.2;
        g.save(); g.translate(sw,0);
        drawRueBody(x,yy,w,each,{anim:e.anim+i,spring:e.spring},1);
        g.restore();
      }
      break;
    }
    case 'bigrue': drawRueBody(x,y,w,h,e,1.7); break;
    case 'churnie': {
      /* SIM-card turtle */
      g.fillStyle=PAL.teal;
      circle(g,x+w*(e.face>0?0.82:0.18),y+4,3.2,PAL.teal);
      g.fillStyle=PAL.ink;
      circle(g,x+w*(e.face>0?0.9:0.1),y+3.4,0.8,PAL.ink);
      g.fillStyle=PAL.tealD;
      g.fillRect(x+2,y+h-3,3,3); g.fillRect(x+w-5,y+h-3,3,3);
      /* shell = SIM card */
      g.fillStyle=PAL.yelD;
      g.beginPath();
      g.moveTo(x+1,y+4); g.lineTo(x+w-4,y+4); g.lineTo(x+w-1,y+7); g.lineTo(x+w-1,y+h-2);
      g.lineTo(x+1,y+h-2); g.closePath(); g.fill();
      g.fillStyle=PAL.yel;
      g.beginPath();
      g.moveTo(x+2,y+5); g.lineTo(x+w-5,y+5); g.lineTo(x+w-2,y+8); g.lineTo(x+w-2,y+h-3);
      g.lineTo(x+2,y+h-3); g.closePath(); g.fill();
      g.fillStyle=PAL.yelXD;
      g.fillRect(x+4,y+7,w-9,1); g.fillRect(x+4,y+10,w-9,1);
      g.fillRect(x+7,y+6,1,7);
      break;
    }
    case 'shell': {
      const spin=e.state===1?gameTime*14:0;
      g.save(); g.translate(x+w/2,y+h/2); g.rotate(spin);
      g.fillStyle=PAL.yelD;
      g.beginPath(); g.moveTo(-w/2,-h/2+1); g.lineTo(w/2-3,-h/2+1); g.lineTo(w/2,-h/2+4);
      g.lineTo(w/2,h/2); g.lineTo(-w/2,h/2); g.closePath(); g.fill();
      g.fillStyle=PAL.yel;
      g.fillRect(-w/2+1,-h/2+2,w-2.5,h-3);
      g.fillStyle=PAL.yelXD;
      g.fillRect(-w/2+2,-h/2+4,w-5,1); g.fillRect(-w/2+2,-h/2+7,w-5,1);
      g.restore();
      if(e.state===1) for(let i=0;i<2;i++) g.fillStyle=rgba(PAL.yelL,0.3),g.fillRect(x-sign(e.vx)*(4+i*4),y+3+i*3,3,1);
      break;
    }
    case 'bat': {
      const fl=Math.sin(e.anim*16)*(e.state===1?4:2);
      g.fillStyle='#3B2C5A';
      g.beginPath(); g.moveTo(x+w/2,y+5);
      g.quadraticCurveTo(x-3,y+2+fl,x-1,y+8+fl); g.quadraticCurveTo(x+3,y+6,x+w/2,y+7); g.fill();
      g.beginPath(); g.moveTo(x+w/2,y+5);
      g.quadraticCurveTo(x+w+3,y+2+fl,x+w+1,y+8+fl); g.quadraticCurveTo(x+w-3,y+6,x+w/2,y+7); g.fill();
      circle(g,x+w/2,y+5,4,'#4A3670');
      g.fillStyle=PAL.orange;
      g.fillRect(x+w/2-2.6,y+3.6,1.8,1.8); g.fillRect(x+w/2+0.8,y+3.6,1.8,1.8);
      /* signal-bar ears */
      g.fillStyle='#3B2C5A'; g.fillRect(x+w/2-3,y,1.5,3); g.fillRect(x+w/2+1.5,y,1.5,4);
      break;
    }
    case 'lag': {
      const pulse=0.5+0.5*Math.sin(e.anim*9);
      g.fillStyle=mixHex(PAL.purple,PAL.orange,pulse*0.4);
      g.beginPath();
      for(let i=0;i<10;i++){
        const a=i/10*6.2832, r=(i%2?w*0.32:w*0.5)*(1+pulse*0.08);
        const px2=x+w/2+Math.cos(a)*r, py2=y+h/2+Math.sin(a)*r*0.8;
        if(i===0) g.moveTo(px2,py2); else g.lineTo(px2,py2);
      }
      g.closePath(); g.fill();
      circle(g,x+w/2,y+h/2,w*0.22,PAL.ink);
      g.fillStyle=PAL.orange; g.fillRect(x+w/2-2.5,y+h/2-1,2,2); g.fillRect(x+w/2+0.5,y+h/2-1,2,2);
      break;
    }
    case 'blob': {
      const wob=(e.spring?e.spring.p:0);
      const bw=w*(1+wob*0.03), bh=h*(1-wob*0.03);
      g.fillStyle=rgba(PAL.teal,0.55);
      g.beginPath(); g.ellipse(x+w/2,y+h-bh/2,bw/2,bh/2,0,0,6.2832); g.fill();
      g.fillStyle=rgba(PAL.tealL,0.35);
      g.beginPath(); g.ellipse(x+w/2-1,y+h-bh*0.65,bw*0.22,bh*0.22,0,0,6.2832); g.fill();
      g.strokeStyle=PAL.off; g.lineWidth=1.2;
      g.beginPath(); g.arc(x+w/2,y+h-bh*0.5,3,gameTime*6,gameTime*6+3.6); g.stroke();
      g.fillStyle=PAL.ink;
      g.fillRect(x+w/2-3,y+h-bh*0.62,1.6,1.6); g.fillRect(x+w/2+1.4,y+h-bh*0.62,1.6,1.6);
      break;
    }
    case 'dead': {
      g.save();
      for(let i=0;i<7;i++){
        const a=e.anim*0.6+i;
        const rx=x+w/2+Math.cos(a)*w*0.28, ry=y+h/2+Math.sin(a*1.3)*h*0.24;
        g.fillStyle='rgba(150,158,168,'+(0.16+0.10*Math.sin(e.anim*3+i))+')';
        g.beginPath(); g.arc(rx,ry,w*0.32,0,6.2832); g.fill();
      }
      for(let i=0;i<8;i++){
        g.fillStyle='rgba(230,235,240,'+(Math.random()*0.5)+')';
        g.fillRect(x+Math.random()*w,y+Math.random()*h,2,1);
      }
      g.restore();
      break;
    }
    case 'bill': {
      g.fillStyle='#39434F'; g.fillRect(x,y,w,h*0.6);
      g.fillStyle='#1B2027'; g.fillRect(x+1,y+1,w-2,3);
      g.fillStyle=PAL.off;
      const out=(e.timer<0.6)?4:1;
      g.fillRect(x+3,y+h*0.55,w-6,out+2);
      g.fillStyle=PAL.orange; g.fillRect(x+2,y+2,3,2);
      g.fillStyle=PAL.ink; g.fillRect(x+w-6,y+2,2,2);
      break;
    }
    case 'invoice': {
      g.save(); g.translate(x+w/2,y+h/2); g.rotate(Math.sin(gameTime*8)*0.15);
      g.fillStyle=PAL.off; g.fillRect(-w/2,-h/2,w,h);
      g.fillStyle=PAL.orange; g.fillRect(-w/2,-h/2,w,2);
      g.fillStyle='#9AA4AE';
      for(let i=0;i<3;i++) g.fillRect(-w/2+1.5,-h/2+4+i*3,w-3,1);
      g.restore();
      break;
    }
    case 'roamer': {
      const lean=clamp(e.vx/120,-1,1);
      g.save(); g.translate(x+w/2,y+h); g.rotate(-lean*0.2);
      g.fillStyle=e.alert?PAL.orange:PAL.orangeD;
      rr(g,-w/2,-h,w,h-2,4); g.fill();
      g.fillStyle=PAL.ink;
      g.fillRect(-w*0.4,-2.5,w*0.34,2.5); g.fillRect(w*0.06,-2.5,w*0.34,2.5);
      g.fillStyle=PAL.off;
      g.fillRect(-w*0.3,-h*0.72,w*0.24,w*0.2); g.fillRect(w*0.06,-h*0.72,w*0.24,w*0.2);
      g.fillStyle=PAL.ink;
      g.fillRect(-w*0.24+(e.face>0?1.5:0),-h*0.70,w*0.12,w*0.14);
      g.fillRect( w*0.12+(e.face>0?1.5:0),-h*0.70,w*0.12,w*0.14);
      g.fillStyle=PAL.ink3; rr(g,-w*0.5,-h*0.62,w*0.22,h*0.32,2); g.fill();
      g.restore();
      if(e.alert) for(let i=0;i<2;i++) g.fillStyle=rgba(PAL.orange,0.35),g.fillRect(x-sign(e.vx)*(5+i*5),y+4+i*4,4,1);
      break;
    }
    case 'hat': {
      g.save(); g.translate(x+w/2,y+h/2); g.rotate(gameTime*6);
      g.fillStyle=PAL.yel; g.beginPath(); g.arc(0,1,w*0.4,Math.PI,0); g.fill();
      g.fillRect(-w*0.45,0.6,w*0.9,1.6);
      g.restore();
      break;
    }
  }
  if(e.dead&&e.state===9) g.restore(),g.globalAlpha=1;
}

/* -------------------- items ---------------------------------------- */
function drawItems(){
  for(const it of items){
    if(!it.on) continue;
    if(it.x+it.w<cam.x-20||it.x>cam.x+CFG.VW+20) continue;
    if(it.pop>0){ g.save(); g.beginPath(); g.rect(it.x-6,it.popY-18,it.w+12,18); g.clip(); }
    drawItem(it);
    if(it.pop>0) g.restore();
  }
}
function drawItem(it){
  const x=it.x,y=it.y,w=it.w,h=it.h, cx=x+w/2, cy=y+h/2;
  switch(it.kind){
    case 'coin': {
      const s=Math.abs(Math.cos(it.anim*3+x*0.1));
      g.save(); g.translate(cx,cy); g.scale(Math.max(0.12,s),1);
      circle(g,0,0,5,PAL.yelD); circle(g,0,0,4,PAL.yel);
      g.fillStyle=PAL.yelXD; g.font='italic 900 7px "Arial Black",sans-serif'; g.textAlign='center';
      g.fillText('Y',0,2.6);
      g.restore();
      if(Math.random()<0.02) spawnP(PT.SPARK,cx+rnd(-4,4),cy+rnd(-5,5),0,-12,0.4,PAL.yelL,1,0);
      break;
    }
    case 'booster': {
      /* signal-bars mushroom */
      circle(g,cx,cy+1,w*0.42,PAL.yelD);
      g.fillStyle=PAL.off; g.fillRect(cx-3,cy+2,6,5);
      g.fillStyle=PAL.yel;
      g.beginPath(); g.arc(cx,cy,w*0.48,Math.PI,0); g.fill();
      g.fillStyle=PAL.ink;
      for(let i=0;i<4;i++) g.fillRect(cx-5+i*2.6,cy-1-i*1.4,1.8,1.4+i*1.4);
      g.fillStyle=PAL.ink; g.fillRect(cx-2.4,cy+3.2,1.4,1.4); g.fillRect(cx+1,cy+3.2,1.4,1.4);
      break;
    }
    case 'flare': {
      g.save(); g.translate(cx,cy); g.rotate(gameTime*1.2);
      for(let i=0;i<6;i++){
        g.fillStyle=i%2?PAL.purple:PAL.teal;
        g.beginPath();
        const a=i/6*6.2832;
        g.ellipse(Math.cos(a)*4,Math.sin(a)*4,3,3,0,0,6.2832); g.fill();
      }
      g.restore();
      circle(g,cx,cy,4,PAL.yel);
      g.fillStyle=PAL.ink; g.font='italic 900 6px "Arial Black",sans-serif'; g.textAlign='center';
      g.fillText('5G',cx,cy+2.2);
      break;
    }
    case 'cap': {
      g.fillStyle=PAL.teal;
      g.beginPath(); g.moveTo(cx-6,cy-1); g.quadraticCurveTo(cx,cy+8,cx+6,cy-1); g.closePath(); g.fill();
      g.fillStyle=PAL.off;
      g.beginPath(); g.ellipse(cx,cy-3,5.5,2.6,0,0,6.2832); g.fill();
      g.fillStyle=PAL.tealD;
      g.beginPath(); g.ellipse(cx,cy-3.6,4,1.8,0,0,6.2832); g.fill();
      g.strokeStyle=PAL.off; g.lineWidth=1; line(g,cx,cy-5,cx,cy-8,PAL.off,1);
      circle(g,cx,cy-8.5,1.2,PAL.yel);
      break;
    }
    case 'star': {
      g.save(); g.translate(cx,cy); g.rotate(gameTime*3);
      g.fillStyle=PAL.yel;
      g.beginPath();
      for(let i=0;i<10;i++){ const a=i/10*6.2832-1.57, r=i%2?2.6:6.4;
        if(i===0) g.moveTo(Math.cos(a)*r,Math.sin(a)*r); else g.lineTo(Math.cos(a)*r,Math.sin(a)*r); }
      g.closePath(); g.fill();
      g.restore();
      for(let i=0;i<4;i++){
        const a=gameTime*4+i*1.57;
        g.fillStyle=['#FF6B3D','#7C4DFF','#00A3AD','#3BD16F'][i];
        g.fillRect(cx+Math.cos(a)*7-1,cy+Math.sin(a)*7-1,2,2);
      }
      g.fillStyle=PAL.ink; g.fillRect(cx-2,cy-1,1.4,1.4); g.fillRect(cx+0.6,cy-1,1.4,1.4);
      break;
    }
    case 'shield': {
      const a=0.5+0.5*Math.sin(gameTime*4);
      circle(g,cx,cy,6,rgba(PAL.teal,0.35+a*0.2));
      g.strokeStyle=rgba(PAL.tealL,0.9); g.lineWidth=1.2;
      g.beginPath(); g.arc(cx,cy,6,0,6.2832); g.stroke();
      g.fillStyle=rgba(PAL.white,0.5);
      g.beginPath(); g.ellipse(cx-2,cy-2.5,1.6,1,-0.5,0,6.2832); g.fill();
      break;
    }
    case 'plushie': {
      drawOllie(cx,y+h,0.8,{grounded:true,face:1,eyeX:Math.sin(gameTime*2)*1.2,blink:0,power:0,
        sqx:1+Math.sin(gameTime*4)*0.04,sqy:1-Math.sin(gameTime*4)*0.04,ant1:Math.sin(gameTime*3)*2,ant2:0});
      break;
    }
    case 'crate': {
      g.fillStyle=PAL.brownD; g.fillRect(x,y,w,h);
      g.fillStyle=PAL.brown; g.fillRect(x+1,y+1,w-2,h-2);
      g.fillStyle=PAL.brownD; g.fillRect(x+1,y+h*0.45,w-2,1.5);
      g.fillStyle=PAL.teal; g.fillRect(x+3,y+3,w-6,4);
      g.fillStyle=PAL.off; g.font='italic 900 5px "Arial Black",sans-serif'; g.textAlign='center';
      g.fillText('SUB',x+w/2,y+7);
      if(it.taken){
        const k=['booster','flare','cap','star','shield'][(gameTime*14|0)%5];
        g.save(); g.translate(0,-16); drawItem({kind:k,x:x,y:y,w:w,h:h,anim:0,pop:0}); g.restore();
      }
      break;
    }
  }
}

/* -------------------- projectiles ----------------------------------- */
function drawShots(){
  for(const s of shots){
    if(!s.on) continue;
    const cx=s.x+s.w/2, cy=s.y+s.h/2;
    if(s.kind==='orb'){
      circle(g,cx,cy,s.w*0.72,rgba(PAL.yel,0.25));
      circle(g,cx,cy,s.w*0.5,PAL.yel);
      circle(g,cx-1,cy-1,s.w*0.2,PAL.white);
      g.strokeStyle=rgba(PAL.tealL,0.8); g.lineWidth=1;
      g.beginPath(); g.arc(cx,cy,s.w*0.8,gameTime*10,gameTime*10+2); g.stroke();
    } else if(s.kind==='note'){
      g.save(); g.translate(cx,cy); g.rotate(Math.sin(s.anim*5)*0.3);
      g.fillStyle='#9FD8FF';
      circle(g,-1.5,2,2.4,'#9FD8FF');
      g.fillRect(0.4,-4,1.2,6.4);
      g.beginPath(); g.moveTo(1.6,-4); g.quadraticCurveTo(4.5,-3,3.6,-0.6); g.lineTo(1.6,-1.6); g.closePath(); g.fill();
      g.restore();
    } else if(s.kind==='ticket'){
      g.save(); g.translate(cx,cy); g.rotate(gameTime*4);
      g.fillStyle=PAL.off; g.fillRect(-5,-6,10,12);
      g.fillStyle=PAL.orange; g.fillRect(-5,-6,10,3);
      g.fillStyle=PAL.ink; g.font='italic 900 6px "Arial Black",sans-serif'; g.textAlign='center';
      g.fillText(s.txt||'42',0,4);
      g.restore();
    } else if(s.kind==='bolt'){
      g.strokeStyle=PAL.yelL; g.lineWidth=2;
      g.beginPath(); g.moveTo(cx,cy-6);
      g.lineTo(cx+3,cy); g.lineTo(cx-2,cy+1); g.lineTo(cx+2,cy+7); g.stroke();
      circle(g,cx,cy,5,rgba(PAL.yel,0.2));
    } else if(s.kind==='shock'){
      const a=0.6+0.4*Math.sin(gameTime*20);
      g.fillStyle=rgba(PAL.orange,a);
      g.beginPath();
      g.moveTo(cx-7,cy+7); g.lineTo(cx-3,cy-6); g.lineTo(cx+1,cy+2); g.lineTo(cx+5,cy-5); g.lineTo(cx+7,cy+7);
      g.closePath(); g.fill();
    }
  }
}

/* -------------------- moving platforms ------------------------------ */
function drawPlats(){
  for(const p of plats){
    if(!p.on) continue;
    if(p.x+p.w<cam.x-30||p.x>cam.x+CFG.VW+30) continue;
    if(lvl.theme==='w4'){
      g.fillStyle=PAL.ink3; g.fillRect(p.x,p.y,p.w,p.h);
      g.fillStyle=PAL.purple; g.fillRect(p.x+1,p.y+1,p.w-2,p.h-3);
      g.fillStyle=rgba(PAL.tealL,0.6);
      for(let i=0;i<p.w-4;i+=6) g.fillRect(p.x+2+i,p.y+2,4,p.h-5);
    } else {
      g.fillStyle=PAL.ink2; g.fillRect(p.x,p.y,p.w,p.h);
      g.fillStyle=PAL.teal; g.fillRect(p.x,p.y,p.w,3);
      g.fillStyle=PAL.yel; g.fillRect(p.x+2,p.y+4,p.w-4,1.5);
      g.fillStyle=PAL.ink3;
      g.fillRect(p.x+2,p.y+p.h,2,4); g.fillRect(p.x+p.w-4,p.y+p.h,2,4);
    }
  }
}

/* -------------------- bosses ---------------------------------------- */
function drawBoss(){
  if(!boss.on) return;
  const b=boss, x=b.x,y=b.y,w=b.w,h=b.h;
  g.save();
  if(b.flash>0&&Math.floor(b.flash*30)%2===0) g.globalAlpha=0.9;
  if(b.intro>0){ g.globalAlpha=clamp(1-b.intro/1.4+0.3,0,1); }
  const tell=b.tell>0&&Math.floor(gameTime*16)%2===0;
  switch(b.kind){
    case 'queue': {
      /* a very large exec behind a ticket podium */
      drawRueBody(x,y,w,h,{anim:b.anim,spring:{p:Math.sin(b.anim*4)*3}},2.2);
      g.fillStyle=tell?PAL.orange:PAL.ink3;
      rr(g,x-4,y+h-16,w+8,16,3); g.fill();
      g.fillStyle=PAL.yel; g.fillRect(x-2,y+h-14,w+4,3);
      g.fillStyle=PAL.off; g.font='italic 900 7px "Arial Black",sans-serif'; g.textAlign='center';
      g.fillText('NOW SERVING',x+w/2,y+h-5);
      g.fillStyle=PAL.orange; g.fillRect(x+w/2-10,y-12,20,10);
      g.fillStyle=PAL.ink; g.font='italic 900 8px "Arial Black",sans-serif';
      g.fillText(''+(41+((gameTime*2)|0)%9),x+w/2,y-4);
      break;
    }
    case 'splice': {
      /* tangle of fibre cables from the ceiling */
      g.strokeStyle=PAL.tealD; g.lineWidth=3;
      for(let i=0;i<6;i++){
        g.beginPath(); g.moveTo(x+4+i*6,0);
        g.quadraticCurveTo(x+w/2+Math.sin(b.anim*2+i)*14,y*0.5,x+6+i*5,y+6);
        g.stroke();
      }
      for(let i=0;i<5;i++){
        g.strokeStyle=[PAL.teal,PAL.yel,PAL.orange,PAL.purple,PAL.green][i];
        g.lineWidth=1.4;
        g.beginPath(); g.moveTo(x+6+i*7,0);
        g.quadraticCurveTo(x+w/2+Math.sin(b.anim*2.4+i)*18,y*0.55,x+8+i*5,y+6);
        g.stroke();
      }
      fillRR(g,x,y,w,h,4,PAL.ink2);
      fillRR(g,x+2,y+2,w-4,h-4,3,b.state===3?PAL.orange:PAL.ink3);
      /* junction box face */
      g.fillStyle=tell?PAL.orange:PAL.tealL;
      for(let i=0;i<4;i++) g.fillRect(x+6+i*8,y+8,5,4);
      g.fillStyle=PAL.ink;
      g.fillRect(x+9,y+18,6,3); g.fillRect(x+w-15,y+18,6,3);
      g.strokeStyle=PAL.ink; g.lineWidth=1.5;
      g.beginPath(); g.arc(x+w/2,y+h-8,7,0.3,Math.PI-0.3); g.stroke();
      if(b.state===2){
        const t=1-b.timer/0.55;
        const wx=x+w/2+b.seg*t*150, wy=y+h+40+Math.sin(t*Math.PI)*60;
        g.strokeStyle=PAL.orange; g.lineWidth=2.5;
        g.beginPath(); g.moveTo(x+w/2,y+h); g.quadraticCurveTo((x+w/2+wx)/2,wy-40,wx,wy); g.stroke();
        circle(g,wx,wy,4,PAL.yelL);
      }
      break;
    }
    case 'muzz': {
      /* cartoon exec in a teal shirt, same house style as the other games */
      const lean=clamp(b.vx/200,-1,1);
      g.save(); g.translate(x+w/2,y+h); g.rotate(-lean*0.12);
      g.fillStyle=PAL.ink; g.fillRect(-w*0.36,-4,w*0.3,4); g.fillRect(w*0.06,-4,w*0.3,4);
      g.fillStyle='#1B2027'; rr(g,-w/2,-h,w,h-3,5); g.fill();
      g.fillStyle=PAL.teal; rr(g,-w*0.28,-h*0.78,w*0.56,h*0.5,3); g.fill();
      g.fillStyle=PAL.off; g.fillRect(-w*0.06,-h*0.78,w*0.12,h*0.45);
      const hr=w*0.32;
      g.fillStyle='#E8C9A8'; circle(g,0,-h+hr*0.8,hr,'#E8C9A8');
      g.fillStyle='#C8CDD2'; g.beginPath(); g.arc(0,-h+hr*0.5,hr,Math.PI,0); g.fill();
      g.fillStyle=PAL.ink;
      circle(g,-hr*0.36,-h+hr*0.85,1.1,PAL.ink); circle(g,hr*0.36,-h+hr*0.85,1.1,PAL.ink);
      g.strokeStyle=PAL.ink; g.lineWidth=1.1;
      g.beginPath(); g.arc(0,-h+hr,hr*0.5,0.2,Math.PI-0.2); g.stroke();
      if(tell){ g.fillStyle=PAL.orange; g.fillRect(-w/2,-h-8,w,4); }
      g.restore();
      break;
    }
    case 'outage': {
      const puff=Math.sin(b.anim*2)*3;
      g.fillStyle='#39414F';
      for(let i=0;i<6;i++){
        const a=i/6*6.2832;
        circle(g,x+w/2+Math.cos(a)*w*0.34,y+h*0.45+Math.sin(a)*h*0.3+puff*0.3,h*0.36,'#39414F');
      }
      circle(g,x+w/2,y+h*0.45,h*0.45,'#4A5460');
      g.fillStyle=tell?PAL.orange:PAL.ink;
      g.fillRect(x+w*0.30,y+h*0.34,7,7); g.fillRect(x+w*0.58,y+h*0.34,7,7);
      g.fillStyle=PAL.ink;
      g.fillRect(x+w*0.34,y+h*0.62,w*0.32,4);
      g.fillRect(x+w*0.30,y+h*0.56,5,5); g.fillRect(x+w*0.62,y+h*0.56,5,5);
      if(tell||Math.random()<0.05){
        g.strokeStyle=PAL.yelL; g.lineWidth=2;
        g.beginPath(); g.moveTo(x+w/2,y+h);
        let ly=y+h;
        for(let i=0;i<4;i++){ ly+=14; g.lineTo(x+w/2+rnd(-12,12),ly); }
        g.stroke();
      }
      break;
    }
  }
  g.restore();
  if(DEBUG){ g.strokeStyle='#ff0'; g.lineWidth=0.5; g.strokeRect(x+.25,y+.25,w-.5,h-.5); }
}

/* -------------------- darkness & lighting --------------------------- */
let darkCv=null,dg=null;
function initDark(){
  const rs=(view&&view.rs)||1;
  darkCv=document.createElement('canvas');
  darkCv.width=CFG.VW*rs; darkCv.height=CFG.VH*rs;
  dg=darkCv.getContext('2d');
}
function drawDarkness(){
  let amount=0;
  if(lvl.dark) amount=0.80;
  if(boss.on&&boss.kind==='outage') amount=Math.max(amount,boss.dark);
  if(amount<=0.02) return;
  if(!dg) return;
  const rs=(view&&view.rs)||1;
  if(darkCv.width!==CFG.VW*rs) initDark();
  dg.setTransform(rs,0,0,rs,0,0);
  dg.globalCompositeOperation='source-over';
  dg.fillStyle='rgba(4,6,10,'+amount+')';
  dg.clearRect(0,0,CFG.VW,CFG.VH);
  dg.fillRect(0,0,CFG.VW,CFG.VH);
  dg.globalCompositeOperation='destination-out';
  const punch=(wx,wy,r,str)=>{
    const sx=wx-cam.x, sy=wy-cam.y;
    if(sx<-r||sx>CFG.VW+r||sy<-r||sy>CFG.VH+r) return;
    const gd=dg.createRadialGradient(sx,sy,0,sx,sy,r);
    /* hold a bright core, then fall off - a linear ramp reads as a tiny pinprick */
    gd.addColorStop(0,'rgba(0,0,0,'+str+')');
    gd.addColorStop(0.46,'rgba(0,0,0,'+str*0.94+')');
    gd.addColorStop(0.72,'rgba(0,0,0,'+str*0.55+')');
    gd.addColorStop(0.88,'rgba(0,0,0,'+str*0.22+')');
    gd.addColorStop(1,'rgba(0,0,0,0)');
    dg.fillStyle=gd; dg.beginPath(); dg.arc(sx,sy,r,0,6.2832); dg.fill();
  };
  punch(player.x+player.w/2,player.y+player.h/2,player.power===2?112:88,1);
  for(const s of shots) if(s.on&&s.kind==='orb') punch(s.x,s.y,56,0.95);
  for(const ph of lvl.phones) punch(ph.x+ph.w/2,ph.y+12,40+ph.bright*18,0.62);
  for(const it of items) if(it.on&&(it.kind==='star'||it.kind==='coin')) punch(it.x,it.y,24,0.5);
  for(let i=0;i<PART_MAX;i++){ const p=parts[i]; if(p.on&&p.type===PT.SPARK) punch(p.x,p.y,16,0.4); }
  dg.globalCompositeOperation='source-over';
  g.drawImage(darkCv,0,0,darkCv.width,darkCv.height,0,0,CFG.VW,CFG.VH);
  /* additive torch glow - punching a hole only removes darkness, it never lights anything */
  const px=player.x+player.w/2-cam.x, py=player.y+player.h/2-cam.y;
  const lr=(player.power===2?112:88)*0.92;
  if(px>-lr&&px<CFG.VW+lr&&py>-lr&&py<CFG.VH+lr){
    g.save();
    g.globalCompositeOperation='lighter';
    const lg=g.createRadialGradient(px,py,0,px,py,lr);
    lg.addColorStop(0,'rgba(255,214,96,0.26)');
    lg.addColorStop(0.45,'rgba(255,196,74,0.13)');
    lg.addColorStop(1,'rgba(255,180,60,0)');
    g.fillStyle=lg;
    g.beginPath(); g.arc(px,py,lr,0,6.2832); g.fill();
    g.restore();
  }
}

const LEVEL_ORDER=['1-1','1-2','1-3','1-4','2-1','2-2','2-3','2-4','3-1','3-2','3-3','3-4','4-1','4-2','4-3','4-4'];
const WORLD_NAMES=['Yes Street','The Ducts','Outback Towers','Low Orbit'];
const game={score:0,coins:0,lives:3,levelIdx:0,time:400,flagBonus:0,levelT:0,attract:false,
  bonusReturn:null,worldClear:false,startedAt:0};
let gameTime=0, ST='boot', stateT=0, menuSel=0, menuSel2=0, optSel=0, remapAction=null;
let idleT=0, transT=0, transTo=null, transDir=1;

/* ---- music manager ---- */
const music={
  cur:null, stack:[], speed:1,
  play(n){ if(this.cur===n&&Audio2.getRate()===this.speed) return; this.cur=n; this.stack.length=0; Audio2.play(n,this.speed); },
  push(n){ if(this.cur) this.stack.push(this.cur); this.cur=n; Audio2.play(n,1); },
  pop(){ const n=this.stack.pop(); this.cur=n||null; if(n) Audio2.play(n,this.speed); else Audio2.stop(); },
  stopAll(){ this.cur=null; this.stack.length=0; Audio2.stop(); },
  setSpeed(s){ if(this.speed===s) return; this.speed=s; if(this.cur&&this.stack.length===0) Audio2.play(this.cur,s); }
};

function addScore(n,x,y){
  if(n==='1UP'){ addFloat(x,y-6,'1-UP',PAL.green); return; }
  game.score+=n;
  if(x!==undefined) addFloat(x+6,y,n,PAL.off);
  if(game.score>SAVE.hiScore) SAVE.hiScore=game.score;
}
function addCoin(n){
  game.coins+=n;
  if(game.coins>=100){ game.coins-=100; game.lives++; Audio2.sfx('oneup'); addFloat(player.x,player.y-14,'1-UP',PAL.green); }
}

/* ---- level flow ---- */
function loadLevel(key,keepState){
  lvl=parseLevel(LEVELS[key]);
  clearEnemies(); clearParts(); clearFloats(); clearShots();
  for(const it of items) it.on=false;
  for(const p of plats) p.on=false;
  for(const b of bumps) b.on=false;
  boss.on=false; boss.dead=false;
  routerPhase=0;
  game.time=lvl.time; game.levelT=0; game.flagBonus=0;
  resetPlayer(lvl.startX,lvl.startY-player.h+TS);
  cam.tx=clamp(player.x-CFG.VW/2,0,Math.max(0,lvl.w*TS-CFG.VW));
  cam.ty=clamp(player.y-CFG.VH/2,0,Math.max(0,lvl.h*TS-CFG.VH));
  cam.x=cam.tx; cam.y=cam.ty; cam.look=0;
  /* static spawns */
  for(const s of lvl.spawns){
    s.done=false;
    if(s.ch==='c'){ spawnItem('coin',s.x+3,s.y+2); s.done=true; }
    else if(s.ch==='C'){ spawnItem('crate',s.x,s.y); s.done=true; }
    else if(s.ch==='A'){ spawnPlat('h',s.x,s.y); s.done=true; }
    else if(s.ch==='V'){ spawnPlat('v',s.x,s.y); s.done=true; }
  }
  music.setSpeed(1);
  if(!lvl.isBonus) music.play(lvl.music); else music.play('map');
}
const SPAWN_MAP={r:'rue',h:'hardhat',w:'winged',k:'stack',K:'bigrue',t:'churnie',b:'bat',
  L:'lag',l:'blob',d:'dead',s:'bill',o:'roamer'};
function activateSpawns(){
  const edge=cam.x+CFG.VW+24;
  for(const s of lvl.spawns){
    if(s.done) continue;
    if(s.ch==='*'){
      /* wait until Ollie is actually inside the arena - triggering off the camera
         slammed the gate shut while he was still a screen away */
      if(!lvl.boss||boss.on||boss.dead) continue;
      if(player.x+player.w<s.x-8) continue;
      s.done=true; startBoss(lvl.boss,s.x);
      continue;
    }
    if(s.x>edge) continue;
    s.done=true;
    const kind=SPAWN_MAP[s.ch];
    if(kind){
      const d=EDEF[kind];
      const e=spawnEnemy(kind,s.x+(TS-d.w)/2,s.y+TS-d.h,{vx:-d.speed,tx:s.tx,ty:s.ty});
      if(e&&kind==='bat') e.homeY=e.y;
      if(e&&kind==='bill'){ e.y=s.y; e.timer=1.5; }
    }
    else if(s.ch==='m') spawnItem('booster',s.x+1,s.y);
    else if(s.ch==='f') spawnItem('flare',s.x+1,s.y);
    else if(s.ch==='p') spawnItem('cap',s.x+1,s.y);
    else if(s.ch==='u') spawnItem('plushie',s.x+2,s.y);
    else if(s.ch==='g') spawnItem('shield',s.x+1,s.y);
  }
}
function startLevel(idx){
  game.levelIdx=idx;
  game.bonusReturn=null;
  loadLevel(LEVEL_ORDER[idx]);
  ST='play'; stateT=0;
}
function startLevelByKey(key,isWarp){
  const idx=LEVEL_ORDER.indexOf(key);
  if(idx>=0){
    SAVE.unlocked=Math.max(SAVE.unlocked,idx+1); writeSave();
    startLevel(idx);
    if(isWarp){ Audio2.sfx('warp'); flashScreen(0.8); }
  } else { player.state='play'; }
}
function enterBonusRoom(){
  const key=lvl.bonus||'b1';
  game.bonusReturn={idx:game.levelIdx,x:player.x,y:player.y,cam:cam.x};
  loadLevel(key);
  player.state='exitphone'; player.seqT=0; player.y-=8;
  Audio2.sfx('phoneOut');
}
function exitBonusRoom(){
  const r=game.bonusReturn;
  game.bonusReturn=null;
  if(!r){ startLevel(game.levelIdx); return; }
  loadLevel(LEVEL_ORDER[r.idx]);
  player.x=r.x+18; player.y=r.y;
  player.state='exitphone'; player.seqT=0;
  cam.tx=cam.x=clamp(player.x-CFG.VW/2,0,Math.max(0,lvl.w*TS-CFG.VW));
  Audio2.sfx('phoneOut');
}
function levelCleared(){
  const key=LEVEL_ORDER[game.levelIdx];
  const bestKey=key;
  const t=game.levelT;
  if(!SAVE.best[bestKey]||SAVE.best[bestKey].time>t) SAVE.best[bestKey]=Object.assign(SAVE.best[bestKey]||{},{time:t});
  if(!SAVE.best[bestKey].score||SAVE.best[bestKey].score<game.score) SAVE.best[bestKey].score=game.score;
  SAVE.unlocked=Math.max(SAVE.unlocked,game.levelIdx+2);
  SAVE.coinsTotal+=game.coins;
  if(game.score>SAVE.hiScore) SAVE.hiScore=game.score;
  writeSave();
  game.worldClear=(game.levelIdx%4===3);
  ST='clear'; stateT=0;
  music.stopAll();
  Audio2.sfx('clear');
}
function bossDefeated(){
  boss.on=false;
  flashScreen(1);
  addScore(5000,player.x,player.y);
  if(lvl.boss==='outage'){ ST='credits'; stateT=0; SAVE.seenCredits=true; writeSave(); music.play('title'); return; }
  levelCleared();
}
function playerDeathDone(){
  if(game.bonusReturn){ game.bonusReturn=null; }
  if(!SAVE.opt.assist) game.lives--;
  if(game.lives<0){
    ST='gameover'; stateT=0; Audio2.sfx('gameover');
  } else {
    ST='death'; stateT=0;
    wipeTo(()=>{ loadLevel(LEVEL_ORDER[game.levelIdx]); ST='play'; });
  }
}
function wipeTo(fn){ transT=0; transTo=fn; }
function cancelWipe(){ transT=0; transTo=null; }

function pad(n,w){ let s=''+Math.max(0,Math.floor(n)); while(s.length<w) s='0'+s; return s; }

  txtSh(g,'x'+pad(game.coins,2),104,21,10,PAL.off);
  /* world */

  txtSh(g,pad(game.time,3),CFG.VW-8,23,10,game.time<=60?(Math.floor(gameTime*6)%2?PAL.orange:PAL.off):PAL.off,'right');
  /* lives */
  for(let i=0;i<Math.min(game.lives,5);i++){
    g.save(); g.translate(178+i*13,26); g.scale(0.62,0.62);
    circle(g,0,-4,7,PAL.yel);

  else txt(g,'--',px2+34,20,7,'rgba(245,247,250,0.3)','center');

    const bx=CFG.VW/2-52, by=CFG.VH-16;

    txt(g,bossName(boss.kind),CFG.VW/2,by-6,7,PAL.orange,'center');
    for(let i=0;i<boss.maxhp;i++){
      const w=Math.max(3,100/boss.maxhp-3), h=4+ (i%3)*2.5;

  if(DEBUG){
    txt(g,'fps '+fpsShow.toFixed(0)+'  ent '+countEnemies()+'  x '+(player.x|0)+' y '+(player.y|0)+

        6,CFG.VH-6,7,PAL.green);

}

function livePartCount(){ let n=0; for(let i=0;i<PART_MAX;i++) if(parts[i].on) n++; return n; }

let attractTap=false;
function exitAttract(){
  idleT=0; game.attract=false;
  const t=Input.touch.held; t.right=t.left=t.jump=t.run=false;
  loadLevel('1-1'); music.play('title');
}
function updateTitle(dt){
  /* only a REAL key/pad/tap counts - the attract bot drives the same input path */
  const real=Input.consumedAny()||attractTap;
  attractTap=false;
  if(idleT>15){
    game.attract=true;
    if(real) exitAttract(); else updateBot();
    return;
  }
  if(real) idleT=0; else idleT+=dt;
  game.attract=false;
  navMenu(5,(i)=>{
    if(i===0){ game.score=0;game.coins=0;game.lives=3; wipeTo(()=>startLevel(0)); }
    else if(i===1){ game.score=SAVE.hiScore?0:0;game.coins=0;game.lives=3; wipeTo(()=>startLevel(clamp(SAVE.unlocked-1,0,15))); }
    else if(i===2){ ST='select'; menuSel2=0; }
    else if(i===3){ ST='options'; optSel=0; }
    else { ST='credits'; stateT=0; }
  });
}
/* attract-mode bot: drives the normal input path */
function updateBot(){
  const p=player, t=Input.touch.held;
  t.right=true; t.left=false; t.run=(Math.abs(p.vx)>40);
  let jump=false;
  const ahead=p.x+p.w+6, footY=p.y+p.h-4;
  for(let i=0;i<3;i++){
    if(isSolid(Math.floor((ahead+i*4)/TS),Math.floor(footY/TS))) jump=true;
  }
  const gapTx=Math.floor((p.x+p.w+12)/TS), gapTy=Math.floor((p.y+p.h+6)/TS);
  if(p.grounded&&!isSolid(gapTx,gapTy)&&!isSlope(gapTx,gapTy)) jump=true;
  for(const e of enemies){
    if(!e.on||e.dead) continue;
    if(e.x>p.x&&e.x-p.x<34&&Math.abs(e.y-p.y)<20) jump=true;
  }
  if(p.y>lvl.h*TS-72&&!p.grounded) jump=true;
  t.jump=jump&&(p.grounded||p.vy<-40);
}

function updateOptions(prev){
  if(remapAction){
    if(!Input.isCapturing()){
      Input.setCapture((code)=>{ Input.rebind(remapAction,code); remapAction=null; Audio2.sfx('select'); });
    }
    return;
  }
  const n=OPTIONS.length;
  if(Input.hit('up')){ optSel=(optSel+n-1)%n; Audio2.sfx('menu'); wipeConfirm=0; }
  if(Input.hit('down')){ optSel=(optSel+1)%n; Audio2.sfx('menu'); wipeConfirm=0; }
  const o=OPTIONS[optSel];
  if(o.type==='slider'){
    let ch=0;
    if(Input.down('left')) ch=-1; if(Input.down('right')) ch=1;
    if(ch){ SAVE.opt[o.k]=clamp(SAVE.opt[o.k]+ch*0.02,0,1); Audio2.setVolumes();
      if(Input.hit('left')||Input.hit('right')) Audio2.sfx('menu'); }
    if(Input.rel('left')||Input.rel('right')) writeSave();
  } else if(o.type==='cycle'){
    let d=0;
    if(Input.hit('left')) d=-1;
    if(Input.hit('right')||Input.hit('confirm')||Input.hit('jump')) d=1;
    if(d){ SAVE.opt.rs=((SAVE.opt.rs|0)+d+5)%5; Audio2.sfx('select'); writeSave(); resize(); }
  } else if(o.type==='toggle'){
    if(Input.hit('left')||Input.hit('right')||Input.hit('confirm')||Input.hit('jump')){
      SAVE.opt[o.k]=!SAVE.opt[o.k]; Audio2.sfx('select'); writeSave();
    }
  } else if(o.type==='key'){
    if(Input.hit('confirm')||Input.hit('jump')){ remapAction=o.k; Audio2.sfx('menu'); }
  } else if(Input.hit('confirm')||Input.hit('jump')){
    if(o.k==='back'){ ST=prev; Audio2.sfx('menu'); }
    else if(o.k==='wipe'){
      if(wipeConfirm>0){ wipeSave(); wipeConfirm=0; Audio2.sfx('powerdown'); }
      else { wipeConfirm=2; Audio2.sfx('bump'); }
    }
  }
  if(Input.hit('pause')){ ST=prev; Audio2.sfx('menu'); writeSave(); }
}

/* ======================= 15. MAIN LOOP ============================= */
let view={cv:null,ctx:null,buf:null,rs:0,scale:2,ox:0,oy:0};
let acc=0, last=0, fpsShow=60, fpsAcc=0, fpsN=0, slowT=0;
/* The world is always 512x288 logical units - levels, physics and the camera all
   depend on that. Sharpness comes from rendering that same view into a bigger
   backbuffer (supersampling), since every sprite here is vector art, not pixel art. */
function setRenderScale(rs){
  rs=clamp(rs|0,1,RS_MAX);
  if(view.rs===rs) return;
  view.rs=rs;
  view.buf.width=CFG.VW*rs; view.buf.height=CFG.VH*rs;
  g=view.buf.getContext('2d');
  g.textBaseline='alphabetic';
  initDark();
}
function resize(){
  const cv=view.cv;
  const dw=Math.max(256,window.innerWidth), dh=Math.max(180,window.innerHeight);
  let cw=dw, ch=Math.round(dw*CFG.VH/CFG.VW);
  if(ch>dh){ ch=dh; cw=Math.round(dh*CFG.VW/CFG.VH); }
  cv.style.width=cw+'px'; cv.style.height=ch+'px';
  const dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.max(1,Math.round(cw*dpr)); cv.height=Math.max(1,Math.round(ch*dpr));
  view.ctx.imageSmoothingEnabled=true;
  try{ view.ctx.imageSmoothingQuality='high'; }catch(e){}
  view.scale=cw/CFG.VW;                    /* CSS px per logical unit, for pointers */
  let rs=SAVE.opt.rs|0;
  if(!rs) rs=clamp(Math.ceil(cv.width/CFG.VW),1,IS_TOUCH?2:RS_MAX);
  setRenderScale(rs);
}
function step(dt){
  gameTime+=dt;
  routerPhase+=dt;
  if(saveFlash>0) saveFlash-=dt;
  switch(ST){
    case 'title': updateTitle(dt); if(idleT>15) simulate(dt); break;
    case 'select': updateSelect(); break;
    case 'options': updateOptions(prevState); break;
    case 'map': updateMap(dt); break;
    case 'play': {
      simulate(dt);
      if(Input.hit('pause')){ ST='pause'; menuSel=0; Audio2.sfx('pause'); }
      break;
    }
    case 'pause': {
      if(Input.hit('pause')){ ST='play'; Audio2.sfx('pause'); break; }
      navMenu(4,(i)=>{
        if(i===0) ST='play';
        else if(i===1){ ST='play'; wipeTo(()=>loadLevel(LEVEL_ORDER[game.levelIdx])); }
        else if(i===2){ prevState='pause'; ST='options'; optSel=0; }
        else { cancelWipe(); music.stopAll(); mapTarget=mapPos=game.levelIdx; ST='map'; music.play('map'); }
      });
      break;
    }
    case 'clear': {
      stateT+=dt;
      updateParts(dt);
      if(stateT>1.2&&(Input.hit('jump')||Input.hit('confirm'))){
        game.score+=Math.floor(game.time)*50;
        const next=game.levelIdx+1;
        if(next>=16){ ST='credits'; stateT=0; SAVE.seenCredits=true; writeSave(); }
        else if(game.worldClear){ cancelWipe(); mapTarget=mapPos=next; ST='map'; music.play('map'); }
        else wipeTo(()=>startLevel(next));
      }
      break;
    }
    case 'death': stateT+=dt; break;
    case 'gameover': {
      stateT+=dt;
      if(stateT>1.2&&(Input.hit('jump')||Input.hit('confirm'))){
        cancelWipe(); game.score=0; game.coins=0; game.lives=3;
        ST='title'; menuSel=0; idleT=0; loadLevel('1-1'); music.play('title');
      }
      break;
    }
    case 'credits': {
      stateT+=dt;
      if(stateT>2&&(Input.hit('jump')||Input.hit('confirm'))){
        cancelWipe(); ST='title'; menuSel=0; idleT=0; loadLevel('1-1'); music.play('title');
      }
      break;
    }
  }
  /* transition clock */
  if(transTo!==null||transT>0){
    const prev=transT;
    transT+=dt;
    if(prev<0.31&&transT>=0.31&&transTo){ transTo(); transTo=null; }
    if(transT>0.62){ transT=0; transTo=null; }
  }
}
let prevState='title';
function simulate(dt){
  if(cam.hitstop>0){ cam.hitstop--; updateParts(dt); updateCamera(dt); return; }
  game.levelT+=dt;
  if(!lvl.isBonus&&!game.attract){
    game.time-=dt;
    if(game.time<=60&&game.time>0) music.setSpeed(1.25); else if(game.time>60) music.setSpeed(1);
    if(game.time<=0&&player.state==='play'){ game.time=0; playerDie(); }
  }
  activateSpawns();
  updatePlayer(dt);
  checkPhoneStomp();
  updateEnemies(dt);
  updateItems(dt);
  updateShots(dt);
  updatePlats(dt);
  updatePhones(dt);
  updateBumps(dt);
  updateBoss(dt);
  updateParts(dt);
  updateFloats(dt);
  updateCamera(dt);
  /* falling ceiling tiles shake then drop */
  if(lvl.multi){
    for(const k in lvl.multi){ const m=lvl.multi[k]; if(m.n>0) m.t-=dt; if(m.t<=0&&m.n>0){ const c=k.split(','); setTile(+c[0],+c[1],T.USED); m.n=0; } }
  }
  /* exit phone in bonus rooms */
  if(lvl.isBonus&&player.state==='play'&&Input.down('down')&&player.grounded){
    const cx=player.x+player.w/2;
    for(const ph of lvl.phones){
      if(ph.type!==T.EXITP) continue;
      if(cx>ph.x&&cx<ph.x+ph.w&&Math.abs(player.y+player.h-ph.y)<3){ Audio2.sfx('phoneIn'); exitBonusRoom(); break; }
    }
  }
  if(lvl.isBonus&&game.time<=0) exitBonusRoom();
}

function render(){
  const rs=view.rs||1;
  g.setTransform(rs,0,0,rs,0,0);
  g.fillStyle='#000'; g.fillRect(0,0,CFG.VW,CFG.VH);
  if(lvl){
    drawBackground();
    g.save();
    const sh=cam.shake;
    const sx=sh>0?rnd(-sh,sh):0, sy=sh>0?rnd(-sh,sh):0;
    /* snap the camera to whole device pixels so scrolling never shimmers */
    g.translate(-Math.round((cam.x-sx)*rs)/rs,-Math.round((cam.y-sy)*rs)/rs);
    drawTiles();
    drawPlats();
    drawPhones();
    drawItems();
    drawEnemies();
    drawBoss();
    drawShots();
    if(ST!=='title'||game.attract) drawPlayer();
    drawParts();
    drawFloats();
    g.restore();
    drawDarkness();
    if(SAVE.opt.contrast){ g.fillStyle='rgba(0,0,0,0.22)'; g.fillRect(0,0,CFG.VW,CFG.VH); }
    if(ST==='play'||ST==='pause'||ST==='death') drawHUD();
  }
  if(cam.flash>0&&SAVE.opt.flash){ g.fillStyle=rgba(PAL.white,clamp(cam.flash,0,1)*0.7); g.fillRect(0,0,CFG.VW,CFG.VH); }
  switch(ST){
    case 'title': drawTitle(); break;
    case 'select': drawSelect(); break;
    case 'options': drawOptions(); break;
    case 'map': drawMap(); break;
    case 'pause': drawPause(); break;
    case 'clear': drawClear(); break;
    case 'gameover': drawGameOver(); break;
    case 'credits': drawCredits(); break;
  }
  drawTransition();
  /* blit the backbuffer, letterboxed and integer-scaled */
  const c=view.ctx;
  c.drawImage(view.buf,0,0,view.buf.width,view.buf.height,0,0,view.cv.width,view.cv.height);
}

function frame(now){
  requestAnimationFrame(frame);
  if(!last) last=now;
  let elapsed=(now-last)/1000;
  last=now;
  if(elapsed>0.25) elapsed=0.25;
  fpsAcc+=elapsed; fpsN++;
  if(fpsAcc>0.4){
    fpsShow=fpsN/fpsAcc; fpsAcc=0; fpsN=0;
    /* auto mode only: back off a step if the machine can't hold the frame rate */
    if(!(SAVE.opt.rs|0)){
      if(fpsShow<44&&view.rs>1){ slowT++; if(slowT>4){ slowT=0; setRenderScale(view.rs-1); } }
      else slowT=0;
    }
  }
  acc+=elapsed;
  let steps=0;
  while(acc>=1/60&&steps<5){
    Input.update();
    step(1/60);
    Input.clearFrame();
    acc-=1/60; steps++;
  }
  if(steps===5) acc=0;
  Audio2.tick();
  render();
}

/* ========================== 16. BOOT =============================== */
function boot(){
  loadSave();
  if(SAVE.keys) Input.setBinds(SAVE.keys);
  const cv=document.getElementById('cv');
  view.cv=cv; view.ctx=cv.getContext('2d');
  const buf=document.createElement('canvas');
  buf.width=CFG.VW; buf.height=CFG.VH;
  view.buf=buf; view.rs=1; g=buf.getContext('2d');
  g.textBaseline='alphabetic';
  initDark();
  initTouch();
  resize();
  addEventListener('resize',resize);
  addEventListener('orientationchange',()=>setTimeout(resize,120));
  /* audio needs a gesture */
  const unlock=()=>{ Audio2.unlock(); Audio2.setVolumes(); if(!music.cur) music.play('title'); };
  addEventListener('pointerdown',unlock);
  addEventListener('keydown',unlock);
  addEventListener('touchstart',unlock,{passive:true});
  /* tap the reserve slot on touch devices */
  cv.addEventListener('pointerdown',(e)=>{
    const r=cv.getBoundingClientRect();
    const x=(e.clientX-r.left)/view.scale, y=(e.clientY-r.top)/view.scale;
    if(ST==='play'&&player.reserve&&x>CFG.VW-68&&x<CFG.VW-48&&y<30) dropReserve();
  });
  addEventListener('pointerdown',()=>{ if(ST==='title'&&idleT>15) attractTap=true; });
  loadLevel('1-1');
  ST='title'; idleT=0; menuSel=0;
  music.play('title');
  requestAnimationFrame(frame);
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
else boot();
})();
</script>
