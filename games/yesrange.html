<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YES RANGE</title>
<style>
:root{--y:#FFD100;--t:#00707A;--bt:#00B2A9;--g:#2B2F33}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0a0d0f;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
canvas{display:block}
#entry{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:16px;text-align:center;background:radial-gradient(ellipse at 50% 28%,#00808a 0%,#073238 45%,#050809 100%)}
#entry[hidden]{display:none}
.logo{display:flex;align-items:center;gap:22px}
.drop{width:84px;height:104px;flex:none;background:linear-gradient(180deg,#fff27a,#ffd100 45%,#ff9a1a);border-radius:55% 45% 50% 50%/62% 62% 40% 40%;position:relative;box-shadow:inset -8px -10px 18px rgba(170,70,0,.35),0 12px 30px rgba(0,0,0,.4);transform:rotate(-6deg)}
.drop:before{content:"";position:absolute;left:9px;right:7px;top:36px;height:30px;background:#fff;border-radius:50%/60%;border-top:3px solid #c9c9c9}
.drop:after{content:"";position:absolute;left:28px;top:47px;width:7px;height:7px;background:#111;border-radius:50%;box-shadow:22px 0 0 #111}
h1{margin:0;font-size:clamp(34px,7vw,64px);letter-spacing:.04em;color:var(--y);font-weight:900;line-height:1;text-align:left}
h2{margin:6px 0 0;font-size:clamp(12px,2.4vw,18px);letter-spacing:.3em;color:#bff6f1;font-weight:600;text-align:left}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
button{font:inherit;cursor:pointer}
.big{background:var(--y);color:#111;border:0;border-radius:40px;padding:18px 46px;font-size:22px;font-weight:900;letter-spacing:.08em;box-shadow:0 10px 34px rgba(255,209,0,.35)}
.big:disabled{background:#6d6a55;color:#2a2a2a;box-shadow:none;cursor:not-allowed}
.alt{background:rgba(255,255,255,.06);color:#fff;border:2px solid rgba(255,255,255,.45);border-radius:40px;padding:16px 30px;font-size:17px;font-weight:700;letter-spacing:.06em}
.alt:disabled{opacity:.4;cursor:not-allowed}
#status{min-height:22px;color:#cfe;opacity:.85;font-size:14px}
#setpanel{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.15);border-radius:18px;padding:14px 18px;display:grid;grid-template-columns:auto auto;gap:8px 16px;text-align:left;font-size:14px;align-items:center}
#setpanel[hidden]{display:none}
#setpanel select{font:inherit;background:#102226;color:#fff;border:1px solid #2c5a60;border-radius:8px;padding:4px 8px}
.fine{font-size:12px;opacity:.55;margin:0;max-width:520px}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#hud[hidden]{display:none}
#cross{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--y);box-shadow:0 0 0 2px rgba(0,0,0,.5)}
#help{position:absolute;left:12px;bottom:12px;font-size:12px;line-height:1.55;background:rgba(0,0,0,.5);padding:10px 12px;border-radius:10px;max-width:min(460px,calc(100vw - 24px))}
#help b{color:var(--y)}
#toast{position:absolute;left:50%;top:14%;transform:translateX(-50%);background:rgba(0,112,122,.92);padding:8px 16px;border-radius:20px;font-weight:700;opacity:0;transition:opacity .25s;white-space:nowrap}
#perf{position:absolute;right:12px;top:12px;font:12px ui-monospace,Consolas,monospace;background:rgba(0,0,0,.55);padding:6px 8px;border-radius:6px}
#perf[hidden]{display:none}
#lockmsg{position:absolute;left:50%;top:60%;transform:translateX(-50%);font-weight:700;background:rgba(0,0,0,.6);padding:10px 18px;border-radius:14px}
#lockmsg[hidden]{display:none}

{ "imports": {

<body>
<div id="entry">
  <div class="logo"><div class="drop"></div><div><h1>YES RANGE</h1><h2>OLLIE TAKEDOWN VR</h2></div></div>
  <div class="row">
    <button id="btnVR" class="big" disabled>ENTER VR</button>
    <button id="btnDesk" class="alt" disabled>PLAY ON DESKTOP</button>

  <div id="setpanel" hidden>

    <label for="s_hearing">Hearing protection</label><select id="s_hearing"><option value="1">On</option><option value="0">Off</option></select>

</div>
<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ============================================================
   SAVE — localStorage settings, high scores (all try/catch)
   ============================================================ */
const SAVE = {
  load(k, d) { try { const s = localStorage.getItem('yesrange.' + k); return s ? JSON.parse(s) : d; } catch (e) { return d; } },
  store(k, v) { try { localStorage.setItem('yesrange.' + k, JSON.stringify(v)); } catch (e) { /* storage blocked: game keeps running */ } }
};
const DEFAULTS = { hand: 'right', turn: 'snap', snapAngle: 45, smoothTurn: 120, vignette: true, seated: false, heightOffset: 0,
  quality: 'medium', master: 0.8, sfx: 1, hearing: true, infiniteAmmo: false, tracers: false, distanceGrab: true,
  throwAssist: 1.3, perf: false, pouch: true, moveSpeed: 2.2, tutorialDone: false };
const settings = Object.assign({}, DEFAULTS, SAVE.load('settings', {}));
const saveSettings = () => SAVE.store('settings', settings);
const scores = Object.assign({ lanesBest: null, lanesMedal: '', groupBest: null, hits: 0, heads: 0 }, SAVE.load('scores', {}));
const saveScores = () => SAVE.store('scores', scores);

/* ============================================================
   MATHPOOL — ring-pooled temporaries, no allocation in the hot loop
   ============================================================ */
const _vp = [], _qp = [], _mp = [];
for (let i = 0; i < 256; i++) _vp.push(new THREE.Vector3());
for (let i = 0; i < 64; i++) { _qp.push(new THREE.Quaternion()); _mp.push(new THREE.Matrix4()); }
let _vi = 0, _qi = 0, _mi = 0;
const V3 = (x = 0, y = 0, z = 0) => _vp[_vi = (_vi + 1) & 255].set(x, y, z);
const Q4 = () => _qp[_qi = (_qi + 1) & 63].identity();
const M4 = () => _mp[_mi = (_mi + 1) & 63].identity();
const _eul = new THREE.Euler();
const qEuler = (x, y, z) => Q4().setFromEuler(_eul.set(x, y, z));
const AX = new THREE.Vector3(1, 0, 0), AY = new THREE.Vector3(0, 1, 0), AZ = new THREE.Vector3(0, 0, 1);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
const smooth = (t) => t * t * (3 - 2 * t);
// Mirror a right-hand local rotation for the left hand (reflection across the YZ plane).
const mirrorQ = (q, out) => out.set(q.x, -q.y, -q.z, q.w);

/* ============================================================
   CORE — bootstrap, renderer, XR session, quality presets
   ============================================================ */
const EV = { m: new Map(),
  on(n, f) { if (!this.m.has(n)) this.m.set(n, []); this.m.get(n).push(f); },
  emit(n, a) { const l = this.m.get(n); if (l) for (let i = 0; i < l.length; i++) l[i](a); } };

const QUALITY = {
  low:    { fb: 0.8, px: 0.75, shadow: 512,  particles: 0.5,  rt: 256 },
  medium: { fb: 1.0, px: 1.0,  shadow: 1024, particles: 0.75, rt: 384 },
  high:   { fb: 1.2, px: 1.25, shadow: 1024, particles: 1.0,  rt: 512 },
  ultra:  { fb: 1.5, px: 1.5,  shadow: 2048, particles: 1.0,  rt: 768 }
};
let Q = QUALITY[settings.quality] || QUALITY.medium;

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2) * Q.px);
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0e10);
const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.02, 3000);
const rig = new THREE.Group();
scene.add(rig); rig.add(camera);
camera.position.set(0, 1.65, 0);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.castShadow = true;
sun.shadow.mapSize.set(Q.shadow, Q.shadow);
const sc = sun.shadow.camera; sc.left = -5; sc.right = 5; sc.top = 5; sc.bottom = -5; sc.near = 0.5; sc.far = 30;
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
scene.add(sun, sun.target);
const sunDir = new THREE.Vector3(0.4, 1, 0.3).normalize();
// Pooled muzzle-flash lights: always in the scene so the light count (and shaders) never change.
const flashLights = [0, 1].map(() => { const l = new THREE.PointLight(0xffb060, 0, 7, 2); scene.add(l); return l; });

const G = { started: false, xr: false, time: 0, frame: 0, range: 'store', score: 0, timer: 0, timerOn: false,
  mode: 'Free Play', fade: 0, fadeTarget: 0, dom: settings.hand === 'left' ? 0 : 1, crouch: false, fps: 0 };
const WIND = new THREE.Vector3();

function applyQuality(name) {
  Q = QUALITY[name] || QUALITY.medium;
  settings.quality = name;
  if (!renderer.xr.isPresenting) { renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2) * Q.px); renderer.setSize(innerWidth, innerHeight); }
  if (sun.shadow.mapSize.x !== Q.shadow) { sun.shadow.mapSize.set(Q.shadow, Q.shadow); if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; } }
}

const toastEl = document.getElementById('toast');
let toastT = 0;
function toast(msg) { toastEl.textContent = msg; toastEl.style.opacity = 1; toastT = 2.2; }

/* ============================================================
   RENDER — procedural textures, materials, env maps, FX pools
   ============================================================ */
function hash2(x, y) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
// Periodic value noise (period p lattice cells) so every generated texture tiles seamlessly.
function pnoise(x, y, p) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const x0 = ((xi % p) + p) % p, y0 = ((yi % p) + p) % p, x1 = (x0 + 1) % p, y1 = (y0 + 1) % p;
  const a = hash2(x0, y0), b = hash2(x1, y0), c = hash2(x0, y1), d = hash2(x1, y1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function pfbm(x, y, p, oct) {
  let s = 0, a = 0.5, f = 1, n = 0;
  for (let i = 0; i < oct; i++) { s += a * pnoise(x * f, y * f, Math.round(p * f)); n += a; a *= 0.5; f *= 2; }
  return s / n;
}
function mkData(d, w, h, srgb) {
  const t = new THREE.DataTexture(d, w, h, THREE.RGBAFormat);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.magFilter = THREE.LinearFilter;
  t.minFilter = THREE.LinearMipmapLinearFilter; t.generateMipmaps = true; t.anisotropy = 4;
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.needsUpdate = true; return t;
}
function field(S, f) { const h = new Float32Array(S * S); for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) h[y * S + x] = f(x / S, y / S); return h; }
function normalTex(h, S, str) {
  const d = new Uint8Array(S * S * 4);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const l = h[y * S + (x - 1 + S) % S], r = h[y * S + (x + 1) % S];
    const dn = h[((y - 1 + S) % S) * S + x], up = h[((y + 1) % S) * S + x];
    let nx = (l - r) * str, ny = (dn - up) * str; const il = 1 / Math.hypot(nx, ny, 1);
    const i = (y * S + x) * 4;
    d[i] = (nx * il * 0.5 + 0.5) * 255; d[i + 1] = (ny * il * 0.5 + 0.5) * 255; d[i + 2] = (il * 0.5 + 0.5) * 255; d[i + 3] = 255;
  }
  return mkData(d, S, S, false);
}
function greyTex(h, S, lo, hi) {
  const d = new Uint8Array(S * S * 4);
  for (let i = 0; i < S * S; i++) { const g = (lo + (hi - lo) * h[i]) * 255; d[i * 4] = g; d[i * 4 + 1] = g; d[i * 4 + 2] = g; d[i * 4 + 3] = 255; }
  return mkData(d, S, S, false);
}
function canvasTex(w, h, draw, srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  return t;
}
const FONT = 'system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';

const TEX = {};
function buildTextures() {
  const S = 256;
  TEX.grainN = normalTex(field(S, (u, v) => pfbm(u * 64, v * 64, 64, 2)), S, 2.2); TEX.grainN.repeat.set(40, 40);
  TEX.stippleN = normalTex(field(S, (u, v) => Math.pow(pnoise(u * 90, v * 90, 90), 3) + 0.25 * pnoise(u * 170, v * 170, 170)), S, 7); TEX.stippleN.repeat.set(12, 12);
  TEX.machN = normalTex(field(S, (u, v) => 0.5 + 0.5 * Math.sin((v * 180 + pfbm(u * 6, v * 6, 6, 2) * 2.5) * Math.PI * 2)), S, 0.8); TEX.machN.repeat.set(10, 10);
  TEX.roughVar = greyTex(field(S, (u, v) => pfbm(u * 16, v * 16, 16, 3)), S, 0.75, 1.0); TEX.roughVar.repeat.set(8, 8);
  TEX.rubberN = normalTex(field(S, (u, v) => Math.min(Math.abs(Math.sin(u * Math.PI * 16)), Math.abs(Math.sin(v * Math.PI * 16))) * 0.6 + pnoise(u * 60, v * 60, 60) * 0.25), S, 3);
  TEX.rubberN.repeat.set(1.5, 1.5);
  const C = 512, ch = field(C, (u, v) => pfbm(u * 5, v * 5, 5, 5)), cd = new Uint8Array(C * C * 4);
  for (let i = 0; i < C * C; i++) {
    const sp = hash2(i, 7) > 0.986 ? (hash2(i, 9) - 0.5) * 0.3 : 0;
    const g = clamp(0.52 + (ch[i] - 0.5) * 0.55 + sp, 0, 1) * 255;
    cd[i * 4] = g * 1.02; cd[i * 4 + 1] = g; cd[i * 4 + 2] = g * 0.95; cd[i * 4 + 3] = 255;
  }
  TEX.concrete = mkData(cd, C, C, true); TEX.concrete.repeat.set(0.3, 0.3);
  TEX.concreteR = greyTex(field(S, (u, v) => pfbm(u * 9, v * 9, 9, 4)), S, 0.55, 1); TEX.concreteR.repeat.set(0.5, 0.5);
  const wd = new Uint8Array(S * S * 4);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const u = x / S, v = y / S, t = 0.5 + 0.5 * Math.sin((v * 7 + pfbm(u * 3, v * 12, 3, 3) * 3) * Math.PI * 2);
    const i = (y * S + x) * 4, k = 0.82 + t * 0.18;
    wd[i] = 196 * k; wd[i + 1] = 150 * k; wd[i + 2] = 102 * k; wd[i + 3] = 255;
  }
  TEX.plywood = mkData(wd, S, S, true); TEX.plywood.repeat.set(0.6, 0.6);

  TEX.glow = canvasTex(64, 64, (g) => { const r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(0.25, 'rgba(255,255,255,.5)'); r.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = r; g.fillRect(0, 0, 64, 64); });
  TEX.puff = canvasTex(128, 128, (g) => { for (let i = 0; i < 16; i++) { const x = 64 + rand(-20, 20), y = 64 + rand(-20, 20), r = rand(18, 40);
    const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, 'rgba(255,255,255,.33)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 128, 128); } });
  TEX.square = canvasTex(16, 16, (g) => { g.fillStyle = '#fff'; g.fillRect(2, 2, 12, 12); });
  TEX.stars = [3, 4, 5].map(n => canvasTex(128, 128, (g) => {
    g.translate(64, 64);
    for (let k = 0; k < n; k++) {
      g.save(); g.rotate(k / n * Math.PI * 2 + rand(-0.25, 0.25));
      const L = rand(44, 62), gr = g.createLinearGradient(0, 0, 0, -L);
      gr.addColorStop(0, 'rgba(255,250,225,1)'); gr.addColorStop(0.4, 'rgba(255,190,80,.9)'); gr.addColorStop(1, 'rgba(255,110,20,0)');
      g.fillStyle = gr; g.beginPath(); g.moveTo(-9, 0); g.quadraticCurveTo(-7, -L * 0.6, 0, -L); g.quadraticCurveTo(7, -L * 0.6, 9, 0); g.fill(); g.restore();
    }
    const c = g.createRadialGradient(0, 0, 0, 0, 0, 28); c.addColorStop(0, 'rgba(255,255,240,1)'); c.addColorStop(1, 'rgba(255,200,90,0)');
    g.fillStyle = c; g.fillRect(-64, -64, 128, 128);
  }));
  const decal = (fn) => canvasTex(128, 128, (g) => { g.translate(64, 64); fn(g); });
  const core = (g, r, a) => { const c = g.createRadialGradient(0, 0, 0, 0, 0, r); c.addColorStop(0, `rgba(5,4,3,${a})`); c.addColorStop(0.7, `rgba(10,8,6,${a})`); c.addColorStop(1, 'rgba(10,8,6,0)'); g.fillStyle = c; g.beginPath(); g.arc(0, 0, r, 0, 7); g.fill(); };
  TEX.decHole = decal((g) => { const r = g.createRadialGradient(0, 0, 4, 0, 0, 44); r.addColorStop(0, 'rgba(25,20,16,.7)'); r.addColorStop(1, 'rgba(25,20,16,0)'); g.fillStyle = r; g.fillRect(-64, -64, 128, 128); core(g, 14, 1); });
  TEX.decWood = decal((g) => { g.strokeStyle = 'rgba(230,196,146,.95)'; g.lineCap = 'round';
    for (let i = 0; i < 14; i++) { const a = rand(0, 6.28), l = rand(18, 50); g.lineWidth = rand(2, 5); g.beginPath(); g.moveTo(0, 0); g.lineTo(Math.cos(a) * l, Math.sin(a) * l * 0.5); g.stroke(); }
    core(g, 12, 1); });
  TEX.decChip = decal((g) => { g.fillStyle = 'rgba(214,212,205,.95)'; g.beginPath();
    for (let i = 0; i <= 12; i++) { const a = i / 12 * 6.283, r = rand(22, 36); g.lineTo(Math.cos(a) * r, Math.sin(a) * r); } g.fill(); core(g, 11, 0.95); });
  TEX.decLead = decal((g) => { g.fillStyle = 'rgba(178,180,186,.95)'; g.beginPath();
    for (let i = 0; i <= 24; i++) { const a = i / 24 * 6.283, r = i % 2 ? rand(10, 16) : rand(26, 50); g.lineTo(Math.cos(a) * r, Math.sin(a) * r); } g.fill();
    g.fillStyle = 'rgba(120,122,128,1)'; g.beginPath(); g.arc(0, 0, 10, 0, 7); g.fill(); });
  TEX.contact = canvasTex(128, 128, (g) => { const r = g.createRadialGradient(64, 64, 0, 64, 64, 64); r.addColorStop(0, 'rgba(0,0,0,.6)'); r.addColorStop(0.6, 'rgba(0,0,0,.25)'); r.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = r; g.fillRect(0, 0, 128, 128); });

    add(20, 5, 0, 2.5, -11.9, 0, 0, 0xffd100, 1.4);

    add(6, 3, -11.9, 3, 2, 0, Math.PI / 2, 0x00b2a9, 1.2);

    for (let i = 0; i < 5; i++) add(0.3, 22, -6 + i * 3, 6.9, -2, Math.PI / 2, 0, 0xeaf4ff, 10);
    add(20, 20, 0, -0.95, 0, -Math.PI / 2, 0, 0x555555, 0.45);

/* ============================================================
   CORE — main loop and boot
   ============================================================ */
const clock = new THREE.Clock();
let perfT = 0;
function syncBodies(alpha) {
  for (const b of PHYS.bodies) {
    if (!b.obj || !b.active || b.kinematic) continue;

    b.obj.position.lerpVectors(b.prevPos, b.pos, alpha); b.obj.quaternion.slerpQuaternions(b.prevQuat, b.quat, alpha);

}
function tick() {

  if (!G.xr) DESK.post();

  // ponytail: a free-running 120 Hz accumulator aliased against 72/90 Hz and made held guns judder; frame-locked steps don't.
  const n = Math.min(MAX_SUB, Math.max(1, Math.round(dt / STEP))), sd = dt / n;

  for (let i = 0; i < ollies.length; i++) if (ollies[i].range === G.range) ollies[i].update(dt);   // 5. target logic
  if (G.range === 'lanes') updateLanes(dt);

  updateHandVisuals();
  updatePointers(dt);
  updateWrist(dt);
  updateFX(dt); BALLISTICS.syncTracers();            // 6. FX + audio

  AUDIO.listen();
