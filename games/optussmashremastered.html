<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070A">
<title>Optus Smash: Remastered</title>
<style>
:root{
  --yellow:#FECD03; --teal:#00A3AD; --mint:#7CF3D0; --danger:#FF4C4C;
  --deep:#05070A; --panel:#0C1015; --panel-2:#12171E; --line:#1E262F;
  --ink:#E8EDF2; --ink-dim:#8D99A6;
  --display:'Arial Black',Impact,'Haettenschweiler',sans-serif;
  --ui:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--deep);color:var(--ink);font-family:var(--ui);overflow:hidden;
  -webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
button,select,input{font-family:inherit}

#stage-wrap{position:fixed;inset:0;display:grid;place-items:center;background:
  radial-gradient(120% 90% at 50% 0%,#0B1219 0%,#05070A 70%)}
#frame{position:relative;width:100vw;max-width:min(100vw,177.78vh);aspect-ratio:16/9;
  background:#000;overflow:hidden;box-shadow:0 0 0 1px #18202A,0 30px 90px rgba(0,0,0,.8),0 0 120px rgba(0,163,173,.16)}
#game{display:block;width:100%;height:100%}

/* ---- overlay chrome ---------------------------------------------------- */
#overlay{position:absolute;inset:0;display:none;z-index:20}
#overlay.on{display:block}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:clamp(10px,2.2vw,26px);
  background:
    repeating-linear-gradient(-45deg,rgba(4,6,9,.93) 0 26px,rgba(14,20,26,.95) 26px 52px);
  animation:fade .18s ease}
.screen.on{display:flex}
@keyframes fade{from{opacity:0}to{opacity:1}}

.bar{display:flex;align-items:center;gap:14px;margin-bottom:clamp(8px,1.4vw,16px);flex:0 0 auto}
.bar h2{font-family:var(--display);font-style:italic;letter-spacing:.06em;font-size:clamp(14px,1.6vw,20px);
  margin:0;color:var(--yellow);text-transform:uppercase}
.bar .spacer{flex:1}

.panel{background:linear-gradient(180deg,rgba(18,23,30,.96),rgba(9,12,16,.96));
  border:1px solid var(--line);border-radius:var(--r);padding:clamp(10px,1.4vw,18px);min-height:0}

/* ---- buttons ------------------------------------------------------------ */
.btn{background:var(--teal);color:#04191B;border:0;border-radius:10px;padding:11px 20px;
  font-weight:800;font-size:clamp(12px,1.15vw,15px);letter-spacing:.03em;cursor:pointer;
  transition:transform .12s cubic-bezier(.34,1.4,.64,1),filter .12s,box-shadow .12s;
  box-shadow:0 3px 0 #00636A}
.btn:hover{filter:brightness(1.12);transform:translateY(-2px);box-shadow:0 5px 0 #00636A}
.btn:active{transform:translateY(2px);box-shadow:0 0 0 #00636A}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{border-color:var(--teal);color:var(--mint)}
.btn.primary{background:var(--yellow);color:#231C00;box-shadow:0 3px 0 #9A7C00}
.btn.primary:hover{box-shadow:0 5px 0 #9A7C00}
.btn.danger{background:var(--danger);color:#2A0000;box-shadow:0 3px 0 #8E1414}
.btn.off{opacity:.35;pointer-events:none;filter:grayscale(1)}
.btn.big{font-size:clamp(15px,1.8vw,22px);padding:15px 30px;font-family:var(--display);font-style:italic;
  letter-spacing:.08em;text-transform:uppercase}

input[type=text],select{background:#0A0E13;color:var(--ink);border:1px solid var(--line);border-radius:9px;
  padding:10px 12px;font-size:14px;font-weight:700;outline:none}
input[type=text]:focus,select:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(0,163,173,.18)}
input::placeholder{color:#55606C;font-weight:600}

/* ---- title -------------------------------------------------------------- */
#screen-title{justify-content:center;align-items:center;text-align:center}
.logo{font-family:var(--display);font-style:italic;text-transform:uppercase;line-height:.86;
  font-size:clamp(40px,8.2vw,116px);letter-spacing:-.01em;margin:0;
  color:#fff;-webkit-text-stroke:clamp(2px,.35vw,4px) var(--yellow);
  text-shadow:6px 7px 0 var(--teal),0 0 60px rgba(0,163,173,.5)}
.logo small{display:block;font-family:var(--ui);font-style:normal;-webkit-text-stroke:0;text-shadow:none;
  color:var(--ink-dim);font-size:clamp(10px,1.2vw,14px);letter-spacing:.42em;margin-top:14px;font-weight:700}
.modes{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:clamp(20px,3.4vw,42px)}
.mode{background:rgba(12,16,21,.9);border:1px solid var(--line);border-radius:var(--r);
  padding:clamp(12px,1.6vw,20px) clamp(16px,2vw,26px);cursor:pointer;color:var(--ink);
  min-width:clamp(130px,15vw,190px);text-align:left;transition:.16s}
.mode:hover{border-color:var(--teal);transform:translateY(-3px);background:rgba(0,163,173,.10)}
.mode b{display:block;font-family:var(--display);font-style:italic;font-size:clamp(14px,1.5vw,19px);
  text-transform:uppercase;letter-spacing:.04em;color:var(--yellow)}
.mode span{display:block;color:var(--ink-dim);font-size:clamp(10px,1vw,12.5px);margin-top:5px;line-height:1.45}
.keyline{margin-top:clamp(16px,2.4vw,30px);color:var(--ink-dim);font-size:clamp(10px,1vw,12.5px);line-height:2}
kbd{background:#141A21;border:1px solid #263039;border-bottom-width:2px;border-radius:5px;
  padding:2px 7px;font-family:var(--ui);font-weight:800;color:var(--ink);font-size:.92em}

/* ---- setup -------------------------------------------------------------- */
#screen-setup .cols{flex:1;display:grid;grid-template-columns:minmax(0,2.05fr) minmax(0,1fr);
  gap:clamp(8px,1.2vw,16px);min-height:0}
#roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(96px,9vw,124px),1fr));
  gap:clamp(6px,.8vw,10px);overflow:auto;align-content:start;height:100%;padding-right:4px}
.fighter{position:relative;background:#0A0E13;border:2px solid #1B232C;border-radius:12px;
  padding:6px 4px 8px;cursor:pointer;color:var(--ink-dim);display:flex;flex-direction:column;align-items:center;
  transition:transform .18s cubic-bezier(.34,1.5,.64,1),border-color .18s,background .18s}
.fighter canvas{width:100%;height:auto;aspect-ratio:1;pointer-events:none}
.fighter .fname{font-weight:800;font-size:clamp(9px,.9vw,12px);color:var(--ink);text-align:center;line-height:1.2}
.fighter .fblurb{display:none}
.fighter:hover{border-color:#39454F;transform:translateY(-4px);background:#0E141B}
.fighter.sel{border-color:var(--yellow);background:rgba(254,205,3,.10);transform:translateY(-6px) scale(1.04);
  box-shadow:0 10px 26px rgba(254,205,3,.22)}
.fighter.sel .fname{color:var(--yellow)}

.side{display:flex;flex-direction:column;gap:clamp(6px,.9vw,12px);min-height:0}
#char-name{font-family:var(--display);font-style:italic;text-transform:uppercase;letter-spacing:.03em;
  font-size:clamp(15px,1.9vw,26px);margin:0 0 8px}
.stat{display:grid;grid-template-columns:52px 1fr;align-items:center;gap:8px;margin-bottom:5px}
.stat i{font-style:normal;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim);font-weight:800}
.stat b{display:block;height:7px;background:#151C24;border-radius:4px;overflow:hidden}
.stat s{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--mint));text-decoration:none}

#slots{display:flex;flex-direction:column;gap:6px;flex:1;min-height:0;overflow:auto}
.slot{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:8px;
  background:#0A0E13;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;
  padding:8px 10px;opacity:.5;cursor:pointer;transition:.15s}
.slot.on{opacity:1}
.slot.active{border-color:var(--yellow);background:rgba(254,205,3,.07)}
.slot b{font-family:var(--display);font-style:italic;color:var(--c);font-size:13px}
.slot span{font-size:11.5px;color:var(--ink-dim);font-weight:700;grid-column:2/-1}
.slot select{padding:5px 8px;font-size:11.5px;border-radius:7px}
.slot.me{box-shadow:inset 0 0 0 1px rgba(254,205,3,.35)}

.tray{flex:0 0 auto;display:flex;gap:clamp(8px,1.2vw,16px);align-items:flex-end;margin-top:clamp(8px,1.2vw,14px)}
#stages{display:flex;gap:8px;overflow-x:auto;flex:1;padding-bottom:2px}
.stage{flex:0 0 auto;width:clamp(112px,12vw,164px);background:#0A0E13;border:2px solid #1B232C;border-radius:11px;
  padding:5px;cursor:pointer;color:var(--ink-dim);text-align:left;transition:.15s}
.stage canvas{width:100%;height:auto;display:block;border-radius:7px;background:#0A0D12}
.stage span{display:block;font-weight:800;font-size:11.5px;color:var(--ink);margin-top:5px}
.stage small{display:block;font-size:9.5px;line-height:1.35;margin-top:1px}
.stage:hover{border-color:#39454F}
.stage.sel{border-color:var(--yellow);background:rgba(254,205,3,.08)}
.rules{display:flex;flex-direction:column;gap:6px}
.rules label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim);font-weight:800}
#setup-hint{color:var(--ink-dim);font-size:11.5px;min-height:14px;margin-top:6px}
#char-blurb{color:var(--ink-dim);font-size:11.5px;margin:-4px 0 10px;line-height:1.5}
.slot i{font-style:normal;font-size:10px;color:var(--ink-dim);grid-column:2/-1;letter-spacing:.04em}

/* ---- online -------------------------------------------------------------- */
#online-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px;flex:1;min-height:0}
#online-body.dim{opacity:.45;pointer-events:none}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-dim);font-weight:800}
#rooms{display:flex;flex-direction:column;gap:7px;overflow:auto;max-height:100%}
.room{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:10px;
  background:#0A0E13;border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:10px;
  padding:11px 13px;cursor:pointer;color:var(--ink);text-align:left;transition:.14s}
.room:hover{background:rgba(0,163,173,.12);transform:translateX(4px)}
.room b{font-size:13px}
.room span{grid-column:1;grid-row:2;color:var(--ink-dim);font-size:11px}
.room i{font-style:normal;color:var(--mint);font-weight:800;font-size:12px}
.room code{color:var(--ink-dim);font-size:11px;letter-spacing:.14em}
.empty{color:var(--ink-dim);font-size:12.5px;text-align:center;padding:26px}
#net-error{color:var(--danger);font-size:12px;min-height:15px;font-weight:700}
#net-status{color:var(--ink-dim);font-size:11.5px;font-weight:700}

/* ---- results ------------------------------------------------------------- */
#screen-results{justify-content:center;align-items:center}
#results-title{font-family:var(--display);font-style:italic;text-transform:uppercase;
  font-size:clamp(24px,4.6vw,64px);margin:0 0 clamp(12px,2vw,26px);color:#fff;
  -webkit-text-stroke:2px var(--yellow);text-shadow:5px 5px 0 var(--teal)}
#results-list{list-style:none;margin:0 0 clamp(14px,2.4vw,28px);padding:0;width:min(560px,92%)}
#results-list li{display:grid;grid-template-columns:34px 1fr auto auto;align-items:center;gap:12px;
  background:#0A0E13;border:1px solid var(--line);border-left:5px solid var(--c);border-radius:11px;
  padding:11px 14px;margin-bottom:7px}
#results-list b{font-family:var(--display);font-style:italic;color:var(--c);font-size:19px}
#results-list .rn{font-weight:800;font-size:13.5px}
#results-list .rc{color:var(--ink-dim);font-size:11px;grid-column:2;grid-row:2}
#results-list .rk{color:var(--mint);font-weight:800;font-size:12px}
#results-list .rf{color:var(--ink-dim);font-size:11.5px}

/* ---- in-match chrome ------------------------------------------------------ */
#hud-quit{position:absolute;top:12px;right:12px;z-index:30;display:none}
#pause{position:absolute;inset:0;z-index:40;display:none;place-items:center;
  background:rgba(4,6,9,.86);backdrop-filter:blur(6px)}
#pause.on{display:grid}
#pause .panel{text-align:center;min-width:min(340px,86%)}
#pause h3{font-family:var(--display);font-style:italic;text-transform:uppercase;color:var(--yellow);margin:0 0 16px}
#pause .btn{display:block;width:100%;margin-bottom:9px}
#pause .tip{color:var(--ink-dim);font-size:11px;margin-top:10px;line-height:1.7}

/* ---- touch --------------------------------------------------------------- */
#touch{position:absolute;inset:0;z-index:25;display:none;pointer-events:none}
#touch.on{display:block}
.tbtn{position:absolute;pointer-events:auto;display:grid;place-items:center;border-radius:50%;
  background:rgba(232,237,242,.13);border:2px solid rgba(232,237,242,.30);color:#fff;
  font-weight:900;font-size:13px;backdrop-filter:blur(4px);transition:transform .06s,background .06s}
.tbtn.down{background:rgba(254,205,3,.45);transform:scale(.92)}
.dpad{width:15%;max-width:74px;aspect-ratio:1}
.act{width:17%;max-width:86px;aspect-ratio:1}
[data-act=left]{left:3.5%;bottom:15%} [data-act=right]{left:20%;bottom:15%}
[data-act=up]{left:11.5%;bottom:31%}  [data-act=down]{left:11.5%;bottom:2%}
[data-act=atk]{right:4%;bottom:14%;background:rgba(254,205,3,.24)}
[data-act=spec]{right:20%;bottom:24%;background:rgba(255,76,76,.24)}
[data-act=shield]{right:20%;bottom:3%;background:rgba(0,163,173,.28)}

@media (max-width:820px){
  #screen-setup .cols{grid-template-columns:1fr;grid-template-rows:minmax(0,1.3fr) minmax(0,1fr)}
  #online-body{grid-template-columns:1fr}
  .tray{flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){ .screen{animation:none} .btn,.mode,.fighter{transition:none} }
</style>
</head>
<body>
<div id="stage-wrap"><div id="frame">
  <canvas id="game" width="1280" height="720"></canvas>
  <button id="hud-quit" class="btn danger">Quit match</button>

  <div id="touch">
    <div class="tbtn dpad" data-act="left">◀</div>
    <div class="tbtn dpad" data-act="right">▶</div>
    <div class="tbtn dpad" data-act="up">▲</div>
    <div class="tbtn dpad" data-act="down">▼</div>
    <div class="tbtn act" data-act="atk">ATK</div>
    <div class="tbtn act" data-act="spec">SPC</div>
    <div class="tbtn act" data-act="shield">SHLD</div>
  </div>

  <div id="pause">
    <div class="panel">
      <h3>Paused</h3>
      <button id="btn-resume" class="btn primary">Resume</button>
      <button id="btn-restart" class="btn">Restart match</button>
      <button id="btn-pquit" class="btn ghost">Back to setup</button>
      <p class="tip"><kbd>Esc</kbd> resume · <kbd>H</kbd> show hitboxes</p>
    </div>
  </div>

  <div id="overlay">
    <!-- title -->
    <section id="screen-title" class="screen">
      <h1 class="logo">Optus<br>Smash<small>REMASTERED</small></h1>
      <div class="modes">
        <button class="mode" id="btn-solo"><b>Solo</b><span>Fight CPUs across nine levels.</span></button>
        <button class="mode" id="btn-local"><b>Local versus</b><span>Up to four on one screen, keyboard or gamepad.</span></button>
        <button class="mode" id="btn-online"><b>Online</b><span>Create a room or join with a code.</span></button>
        <button class="mode" id="btn-training"><b>Training</b><span>No stock loss. Toggle hitboxes and frame data.</span></button>
      </div>
      <p class="keyline">
        <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move &amp; jump ·
        <kbd>J</kbd> attack · <kbd>K</kbd> special · <kbd>L</kbd>/<kbd>Shift</kbd> shield<br>
        Tap a direction with attack for a smash · hold to charge · shield the instant a hit lands to parry
      </p>
    </section>

    <!-- online lobby -->
    <section id="screen-online" class="screen">
      <div class="bar">
        <h2>Online</h2><span id="net-status"></span><span class="spacer"></span>
        <button class="btn ghost" data-back>Back</button>
      </div>
      <div id="online-body">
        <div class="panel">
          <div class="field"><label for="username">Your name</label>
            <input type="text" id="username" maxlength="12" placeholder="e.g. ALEX"></div>
          <button id="btn-create" class="btn primary" style="width:100%">Create a room</button>
          <div class="field" style="margin-top:16px"><label for="roomcode">Or join with a code</label>
            <input type="text" id="roomcode" maxlength="4" placeholder="ABCD"></div>
          <button id="btn-join" class="btn" style="width:100%">Join room</button>
          <p id="net-error"></p>
        </div>
        <div class="panel" style="display:flex;flex-direction:column;min-height:0">
          <h2 style="font-family:var(--display);font-style:italic;color:var(--yellow);font-size:15px;margin:0 0 10px">Open rooms</h2>
          <div id="rooms"><p class="empty">Looking for rooms…</p></div>
        </div>
      </div>
    </section>

    <!-- setup -->
    <section id="screen-setup" class="screen">
      <div class="bar">
        <h2 id="setup-mode">Solo</h2><span class="spacer"></span>
        <button id="btn-sound" class="btn ghost">Sound on</button>
        <button class="btn ghost" data-back>Back</button>
      </div>
      <div class="cols">
        <div class="panel" style="display:flex;min-height:0"><div id="roster"></div></div>
        <div class="side">
          <div class="panel"><h3 id="char-name">Ollie</h3><p id="char-blurb"></p><div id="char-stats"></div></div>
          <div class="panel" style="display:flex;flex-direction:column;min-height:0;flex:1">
            <div id="slots"></div>
          </div>
        </div>
      </div>
      <div class="tray">
        <div id="stages"></div>
        <div class="rules">
          <label for="stocks">Stocks</label>
          <select id="stocks"><option>1</option><option selected>3</option><option>5</option></select>
          <label for="timer">Time limit</label>
          <select id="timer"><option value="0" selected>None</option><option value="120">2 min</option><option value="180">3 min</option></select>
        </div>
        <button id="btn-fight" class="btn primary big">Fight</button>
      </div>
      <p id="setup-hint"></p>
    </section>

    <!-- results -->
    <section id="screen-results" class="screen">
      <h2 id="results-title">Winner</h2>
      <ol id="results-list"></ol>
      <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
        <button id="btn-rematch" class="btn primary big">Rematch</button>
        <button id="btn-rechar" class="btn">Change fighters</button>
        <button id="btn-rtitle" class="btn ghost">Main menu</button>
      </div>
    </section>
  </div>
</div></div>

<script type="module">
/* ============================================================================
   OPTUS SMASH — v3 "ARENA"
   Single file. No build step. Vanilla JS + Canvas 2D + WebAudio.
   Firebase is loaded dynamically and is entirely optional.

   ARCHITECTURE MAP
     1. CORE      — constants, math, fixed-timestep clock
     2. AUDIO     — procedural SFX (no asset files, all synthesised)
     3. INPUT     — keyboard (2 local schemes), gamepads, touch -> Pad objects
     4. ROSTER    — character stats + frame-data movesets
     5. STAGES    — geometry, soft platforms, ledges, per-stage blast zones
     6. FX        — particles, sparks, damage popups, camera
     7. FIGHTER   — physics + state machine + hit resolution
     8. AI        — CPU controller that emits a Pad, so CPUs use the real rules
     9. RENDER    — character art, stages, HUD
    10. NET       — optional online play w/ snapshot interpolation
    11. MATCH     — game loop, countdown, KO cinematics, results
    12. UI        — menus and wiring
   ========================================================================== */

/* ============================ 1. CORE ==================================== */

const VIEW_W = 1280, VIEW_H = 720;
const TWO_PI = Math.PI * 2;
const DEG = Math.PI / 180;

/* Every gameplay number lives here so the game can be re-tuned without
   hunting through logic. All values are per 1/60s tick. */
const CFG = {
  fps: 60,
  gravity: 0.62,
  maxFall: 15.5,
  fastFallMul: 1.75,
  groundAccel: 1.45,
  groundFriction: 0.80,
  airAccel: 0.52,
  airDrag: 0.955,
  jumpSquat: 4,          // frames crouched before leaving the ground
  shortHopMul: 0.60,     // jump held < shortHopWindow -> short hop
  shortHopWindow: 7,
  landLag: 3,
  hitstopBase: 3,        // freeze frames on contact, both fighters
  hitstopPerDmg: 0.62,
  hitstunPerKb: 2.3,
  tumbleKb: 14,
  knockbackDecay: 0.96,  // drag applied while in hitstun (governs kill power)
  diStrength: 20 * DEG,  // max launch-angle rotation from directional influence
  shieldMax: 100,
  shieldRegen: 0.30,
  shieldDrain: 0.40,
  shieldStunPerDmg: 0.9,
  shieldPushback: 0.55,
  parryWindow: 4,        // shield pressed within N frames of the hit = parry
  parryFreeze: 26,       // attacker is frozen this long on a parry
  rollFrames: 22,
  rollSpeed: 13,
  rollInvuln: [3, 16],
  spotDodgeFrames: 20,
  spotDodgeInvuln: [2, 13],
  airDodgeFrames: 30,
  airDodgeInvuln: [2, 18],
  airDodgeSpeed: 12,
  ledgeCooldown: 40,     // frames before the same fighter may regrab a ledge
  ledgeInvuln: 24,
  respawnInvuln: 150,
  smashChargeMax: 60,    // frames of charge -> up to +40% damage & knockback
  koFreeze: 26,
  netInterpDelay: 110,   // ms of buffer used to smooth remote fighters
};

const PAL = {

/* ============================ 2. AUDIO ==================================
   Everything is synthesised at runtime: oscillators for tones, a noise
   buffer for impacts. Keeps the game a genuinely single file. */

const Audio_ = (() => {
  let ctx = null, master = null, noiseBuf = null;
  let enabled = true, ready = false;

  function boot() {
    if (ready) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain();
      master.gain.value = 0.55;
      master.connect(ctx.destination);
      // one second of white noise, reused for every impact
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      ready = true;
    } catch (e) { enabled = false; }
  }

  function env(node, t, peak, attack, decay) {
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0001, peak), t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
    node.connect(g); g.connect(master);
    return g;
  }

  function tone(freq, dur, type = 'square', vol = 0.2, bend = 1, delay = 0) {
    if (!enabled || !ready) return;
    const t = ctx.currentTime + delay;
    const o = ctx.createOscillator();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (bend !== 1) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * bend), t + dur);
    env(o, t, vol, 0.006, dur);
    o.start(t); o.stop(t + dur + 0.05);
  }

  function noise(dur, vol = 0.3, hp = 300, lp = 6000, delay = 0) {
    if (!enabled || !ready) return;
    const t = ctx.currentTime + delay;
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f1 = ctx.createBiquadFilter(); f1.type = 'highpass'; f1.frequency.value = hp;
    const f2 = ctx.createBiquadFilter(); f2.type = 'lowpass'; f2.frequency.value = lp;
    f2.frequency.exponentialRampToValueAtTime(Math.max(200, lp * 0.25), t + dur);
    s.connect(f1); f1.connect(f2);
    env(f2, t, vol, 0.004, dur);
    s.start(t); s.stop(t + dur + 0.05);
  }

  const S = {
    jump:   () => tone(340, 0.10, 'square', 0.10, 2.0),
    dbljump:() => { tone(420, 0.10, 'square', 0.09, 2.2); noise(0.08, 0.10, 1200); },
    land:   () => noise(0.07, 0.16, 200, 2200),
    whiff:  () => noise(0.09, 0.07, 900, 4500),
    hitL:   () => { noise(0.09, 0.30, 400, 5000); tone(180, 0.07, 'square', 0.16, 0.5); },
    hitM:   () => { noise(0.14, 0.40, 250, 4200); tone(120, 0.11, 'square', 0.22, 0.4); },
    hitH:   () => { noise(0.22, 0.50, 140, 3200); tone(80, 0.18, 'sawtooth', 0.26, 0.35); },
    shield: () => { tone(600, 0.10, 'sine', 0.14, 0.7); noise(0.06, 0.10, 1800); },
    parry:  () => { tone(1250, 0.09, 'sine', 0.22, 1.6); tone(1900, 0.14, 'triangle', 0.14, 1.3, 0.03); },
    break_: () => { noise(0.35, 0.42, 300, 7000); tone(900, 0.4, 'sawtooth', 0.18, 0.2); },
    dodge:  () => noise(0.10, 0.10, 2200, 9000),
    ledge:  () => tone(520, 0.08, 'triangle', 0.12, 1.4),
    proj:   () => { tone(700, 0.10, 'sawtooth', 0.10, 0.35); noise(0.06, 0.08, 900); },
    ko:     () => { noise(0.6, 0.5, 60, 4000); tone(150, 0.5, 'sawtooth', 0.3, 0.15);
                    tone(70, 0.7, 'sine', 0.3, 0.4, 0.02); },
    count:  () => tone(660, 0.13, 'square', 0.18, 1),
    go:     () => { tone(880, 0.30, 'square', 0.22, 1.5); tone(1320, 0.30, 'triangle', 0.14, 1.5, 0.04); },
    ui:     () => tone(880, 0.05, 'square', 0.08, 1.2),
    select: () => { tone(660, 0.06, 'square', 0.10, 1.3); tone(990, 0.09, 'square', 0.09, 1.2, 0.05); },
    win:    () => [0, 4, 7, 12].forEach((s, i) => tone(440 * Math.pow(2, s / 12), 0.35, 'square', 0.16, 1, i * 0.12)),
  };

  return {
    boot,
    play(name) { if (!enabled) return; boot(); if (S[name]) S[name](); },
    /* one call site for hits so volume tracks how hard the blow was */
    hit(dmg) { if (dmg >= 13) this.play('hitH'); else if (dmg >= 7) this.play('hitM'); else this.play('hitL'); },
    toggle() { enabled = !enabled; if (enabled) boot(); return enabled; },
    get on() { return enabled; },
    volume(v) { boot(); if (master) master.gain.value = v; },
  };
})();
/* ============================ 3. INPUT ==================================
   Every controller — keyboard, gamepad, touchscreen, and the CPU — produces
   the same Pad shape. The fighter code therefore never knows or cares who is
   driving it, which is why CPUs obey exactly the same rules as humans. */

const BTNS = ['jump', 'atk', 'spec', 'shield'];

class Pad {
  constructor() {
    this.x = 0; this.y = 0;              // digital axes, -1..1
    this.held = {}; this.pressed = {}; this.released = {};
    for (const b of BTNS) { this.held[b] = false; this.pressed[b] = false; this.released[b] = false; }
    this.buf = {};                       // frames since each press, for input buffering
    for (const b of BTNS) this.buf[b] = 999;
    this.dirBuf = { x: 999, y: 999 };    // frames since a direction was tapped from neutral
    this.lastX = 0; this.lastY = 0;
    this.jumpHeld = 0;                   // how long jump has been held (short hops)
  }

  /* raw = {x,y,jump,atk,spec,shield} of currently-held state */
  update(raw) {
    for (const b of BTNS) {
      const was = this.held[b];
      this.held[b] = !!raw[b];
      this.pressed[b] = this.held[b] && !was;
      this.released[b] = !this.held[b] && was;
      this.buf[b] = this.pressed[b] ? 0 : Math.min(999, this.buf[b] + 1);
    }
    const nx = raw.x | 0, ny = raw.y | 0;
    // a direction "tap" is any transition from neutral, used to detect smash inputs
    this.dirBuf.x = (nx !== 0 && this.lastX === 0) ? 0 : Math.min(999, this.dirBuf.x + 1);
    this.dirBuf.y = (ny !== 0 && this.lastY === 0) ? 0 : Math.min(999, this.dirBuf.y + 1);
    this.lastX = nx; this.lastY = ny;
    this.x = nx; this.y = ny;
    this.jumpHeld = this.held.jump ? this.jumpHeld + 1 : 0;
  }

  /* True if the button was pressed within the last `f` frames and not yet used. */
  buffered(b, f = 6) { return this.buf[b] <= f; }
  consume(b) { this.buf[b] = 999; }
  /* A "smash" is attack + a freshly tapped direction. */
  smashX(f = 6) { return this.dirBuf.x <= f && this.x !== 0; }
  smashY(f = 6) { return this.dirBuf.y <= f && this.y !== 0; }
  clear() { this.update({ x: 0, y: 0 }); }
}

/* ---- keyboard ---------------------------------------------------------- */
const rawKeys = Object.create(null);
window.addEventListener('keydown', e => {
  rawKeys[e.code] = true;
  // stop arrows/space scrolling the page mid-match
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
    if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
    e.preventDefault();
  }
});
window.addEventListener('keyup', e => { rawKeys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in rawKeys) rawKeys[k] = false; });

const KEY_SCHEMES = {
  p1: { left: ['KeyA'], right: ['KeyD'], up: ['KeyW'], down: ['KeyS'],
        jump: ['KeyW', 'Space'], atk: ['KeyJ'], spec: ['KeyK'], shield: ['ShiftLeft', 'KeyL'],
        label: 'W A S D · J · K · L-Shift' },
  p2: { left: ['ArrowLeft'], right: ['ArrowRight'], up: ['ArrowUp'], down: ['ArrowDown'],
        jump: ['ArrowUp', 'Numpad0'], atk: ['Numpad1', 'Period'], spec: ['Numpad2', 'Slash'],
        shield: ['ShiftRight', 'Numpad3'], label: 'Arrows · Num1 · Num2 · R-Shift' },
};

function anyKey(list) { for (const k of list) if (rawKeys[k]) return true; return false; }

function readKeyboard(scheme) {
  const s = KEY_SCHEMES[scheme];
  return {
    x: (anyKey(s.right) ? 1 : 0) - (anyKey(s.left) ? 1 : 0),
    y: (anyKey(s.down) ? 1 : 0) - (anyKey(s.up) ? 1 : 0),
    jump: anyKey(s.jump), atk: anyKey(s.atk), spec: anyKey(s.spec), shield: anyKey(s.shield),
  };
}

/* ---- gamepad ----------------------------------------------------------- */
function readGamepad(index) {
  const gp = (navigator.getGamepads ? navigator.getGamepads() : [])[index];
  if (!gp) return { x: 0, y: 0 };
  const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0, DZ = 0.42;
  const b = i => gp.buttons[i] && gp.buttons[i].pressed;
  const x = (ax > DZ || b(15) ? 1 : 0) - (ax < -DZ || b(14) ? 1 : 0);
  const y = (ay > DZ || b(13) ? 1 : 0) - (ay < -DZ || b(12) ? 1 : 0);
  return {
    x, y,
    jump: b(0) || b(3) || y === -1,
    atk: b(2) || b(1),
    spec: b(7) || b(5),
    shield: b(6) || b(4),
  };
}
function gamepadCount() {
  const list = navigator.getGamepads ? navigator.getGamepads() : [];
  let n = 0; for (const g of list) if (g) n++; return n;
}

/* ---- touch ------------------------------------------------------------- */
const touchRaw = { x: 0, y: 0, jump: false, atk: false, spec: false, shield: false };
const IS_TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

function bindTouchControls(root) {
  const held = new Map();                     // pointerId -> button element
  const apply = () => {
    touchRaw.x = 0; touchRaw.y = 0;
    for (const b of BTNS) touchRaw[b] = false;
    for (const el of held.values()) {
      const a = el.dataset.act;
      if (a === 'left') touchRaw.x = -1; else if (a === 'right') touchRaw.x = 1;
      else if (a === 'up') { touchRaw.y = -1; touchRaw.jump = true; }
      else if (a === 'down') touchRaw.y = 1;
      else touchRaw[a] = true;
    }
  };
  root.querySelectorAll('[data-act]').forEach(el => {
    const on = e => { e.preventDefault(); held.set(e.pointerId, el); el.classList.add('down'); apply(); };
    const off = e => {
      const prev = held.get(e.pointerId); if (prev) prev.classList.remove('down');
      held.delete(e.pointerId); apply();
    };
    el.addEventListener('pointerdown', on);
    el.addEventListener('pointerup', off);
    el.addEventListener('pointercancel', off);
    // sliding a thumb off one button and onto another should re-target, like a real d-pad
    el.addEventListener('pointerenter', e => { if (e.buttons) on(e); });
    el.addEventListener('pointerleave', off);
  });
}

/* ---- source dispatch --------------------------------------------------- */
function readSource(src) {
  if (!src) return { x: 0, y: 0 };
  if (src.kind === 'key') return readKeyboard(src.scheme);
  if (src.kind === 'pad') return readGamepad(src.index);
  if (src.kind === 'touch') return touchRaw;
  return { x: 0, y: 0 };                       // 'cpu' and 'net' are driven elsewhere
}

/* Knockback model. Damage already taken matters more than the hit itself,
   which is what produces the classic "you live until you don't" curve. */
function knockbackOf(move, victimPercent, weight, chargeMul = 1) {
  const dmg = move.d * chargeMul;
  const raw = (move.kb + (victimPercent * 0.125 + dmg * 0.55) * move.kg * chargeMul) * (100 / weight);
  return raw;
}
/* ============================ 5. STAGES =================================
   Platforms now have a type. `soft` platforms can be jumped through from
   below and dropped through with down+jump — the single biggest change to
   how the stages actually play. Ledges are explicit grab points, and each
   stage owns its blast zones instead of sharing one global rectangle. */

function plat(x, y, w, h, soft = false) { return { x, y, w, h, soft }; }

const STAGE_IDS = Object.keys(STAGES);

/* ---- pre-rendered detail tiles -----------------------------------------
   The original redrew hundreds of randomised rack LEDs every single frame.
   Building each tile once and scrolling it costs almost nothing and, more
   importantly, stops the backgrounds from strobing. */
const tileCache = {};

function makeTile(key, w, h, paint) {
  if (tileCache[key]) return tileCache[key];
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  paint(c.getContext('2d'), w, h);
  tileCache[key] = c;
  return c;
}

function scrollTile(ctx, tile, offX, offY, alpha = 1) {
  ctx.save();
  ctx.globalAlpha = alpha;
  const sx = ((offX % tile.width) + tile.width) % tile.width;
  const sy = ((offY % tile.height) + tile.height) % tile.height;
  for (let x = -sx; x < VIEW_W; x += tile.width)
    for (let y = -sy; y < VIEW_H; y += tile.height)
      ctx.drawImage(tile, x, y);
  ctx.restore();
}

/* Backgrounds are drawn in SCREEN space with parallax derived from the
   camera. Far cheaper than filling a 5000px world rect every frame. */
function drawBackground(ctx, id, cam, t) {
  const px = -cam.x * 0.22, py = -cam.y * 0.16;

  if (id === 'store') {
    ctx.fillStyle = '#141519'; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    const tile = makeTile('storeTile', 320, 320, (c) => {
      c.fillStyle = '#191A1F'; c.fillRect(0, 0, 320, 320);
      c.fillStyle = '#1F2128';
      for (let y = 0; y < 320; y += 80) c.fillRect(0, y, 320, 34);
      c.fillStyle = 'rgba(254,205,3,0.10)';
      for (let y = 24; y < 320; y += 80) for (let x = 12; x < 320; x += 54) c.fillRect(x, y, 30, 8);
    });
    scrollTile(ctx, tile, -px, -py, 0.85);
    // slow diagonal light sweep, the one animated element
    const sweep = (t * 0.03) % 1700 - 300;
    const g = ctx.createLinearGradient(sweep, 0, sweep + 300, VIEW_H);
    g.addColorStop(0, 'rgba(254,205,3,0)'); g.addColorStop(0.5, 'rgba(254,205,3,0.07)');
    g.addColorStop(1, 'rgba(254,205,3,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, VIEW_W, VIEW_H);

  } else if (id === 'tower') {
    const g = ctx.createLinearGradient(0, 0, 0, VIEW_H);
    g.addColorStop(0, '#031A2E'); g.addColorStop(0.6, '#064E63'); g.addColorStop(1, '#00A3AD');
    ctx.fillStyle = g; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    ctx.fillStyle = 'rgba(255,255,255,0.06)';
    for (let i = 0; i < 6; i++) {
      const cx = ((t * 0.012 * (i + 1) + i * 430) % 1900) - 300 + px * 0.5;
      ctx.beginPath(); ctx.ellipse(cx, 110 + i * 108 + py * 0.4, 190 + i * 30, 46, 0, 0, TWO_PI); ctx.fill();
    }
    const pulse = 0.25 + Math.abs(Math.sin(t * 0.002)) * 0.35;
    ctx.fillStyle = `rgba(0,163,173,${pulse})`;
    ctx.fillRect(VIEW_W / 2 - 6 - cam.x * 0.02, 0, 12, VIEW_H);

  } else if (id === 'grid') {
    ctx.fillStyle = '#04080D'; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    const step = 72, ox = ((px * 0.9) % step + step) % step, oy = ((py * 0.9) % step + step) % step;
    ctx.strokeStyle = 'rgba(0,163,173,0.20)'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let x = -ox; x < VIEW_W + step; x += step) { ctx.moveTo(x, 0); ctx.lineTo(x, VIEW_H); }
    for (let y = -oy; y < VIEW_H + step; y += step) { ctx.moveTo(0, y); ctx.lineTo(VIEW_W, y); }
    ctx.stroke();
    ctx.fillStyle = 'rgba(124,243,208,0.75)';
    for (let i = 0; i < 14; i++) {
      const p = ((t * 0.14 + i * 260) % 1600) - 160;
      ctx.fillRect(p, ((i * 137) % VIEW_H), 26, 2);
      ctx.fillRect(((i * 191) % VIEW_W), VIEW_H - (p * 0.6 % VIEW_H), 2, 22);
    }

  } else if (id === 'server') {
    ctx.fillStyle = '#06060E'; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    const tile = makeTile('rackTile', 260, 720, (c) => {
      c.fillStyle = '#0C0C16'; c.fillRect(0, 0, 260, 720);
      c.fillStyle = '#12121F'; c.fillRect(24, 0, 96, 720); c.fillRect(150, 0, 96, 720);
      // deterministic LED pattern baked in once
      let seed = 7;
      const rnd = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
      for (let x of [24, 150]) for (let y = 10; y < 720; y += 22) {
        const r = rnd();
        c.fillStyle = r > 0.86 ? '#00E5FF' : r > 0.76 ? '#FF3DCB' : '#1B1B2E';
        c.fillRect(x + 12, y, 6, 5); c.fillRect(x + 26, y, 6, 5);
        c.fillStyle = '#15152A'; c.fillRect(x + 44, y, 40, 5);
      }
    });
    scrollTile(ctx, tile, -px * 0.7, -py * 0.5, 0.9);
    // a handful of live blinkers on top, deterministic so it reads as data flow
    ctx.fillStyle = '#00E5FF';
    for (let i = 0; i < 18; i++) {
      if (((t * 0.004 + i * 0.7) | 0) % 3 === 0) continue;
      ctx.fillRect((i * 149 + 40) % VIEW_W, (i * 233 + 30) % VIEW_H, 6, 5);
    }

  } else if (id === 'orbit') {
    ctx.fillStyle = '#01010A'; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    const stars = makeTile('starTile', 640, 720, (c) => {
      let seed = 42;
      const rnd = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
      for (let i = 0; i < 420; i++) {
        const a = 0.25 + rnd() * 0.75, s = rnd() > 0.93 ? 3 : 1.6;
        c.fillStyle = `rgba(255,255,255,${a})`;
        c.fillRect(rnd() * 640, rnd() * 720, s, s);
      }
    });
    scrollTile(ctx, stars, -px * 0.35, -py * 0.25);
    scrollTile(ctx, stars, -px * 0.8 + 210, -py * 0.6 + 90, 0.45);
    const ex = VIEW_W / 2 - cam.x * 0.10, ey = VIEW_H + 720 - cam.y * 0.10;
    const eg = ctx.createRadialGradient(ex, ey, 200, ex, ey, 900);
    eg.addColorStop(0, '#12C7D4'); eg.addColorStop(0.55, '#065E7E'); eg.addColorStop(1, '#01142A');
    ctx.fillStyle = eg; ctx.beginPath(); ctx.arc(ex, ey, 900, 0, TWO_PI); ctx.fill();
    ctx.strokeStyle = 'rgba(124,243,208,0.35)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(ex, ey, 902, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
  }
}

function drawPlatforms(ctx, id) {
  const st = STAGES[id] || STAGES.store;
  const accent = id === 'store' ? PAL.yellow : id === 'grid' ? PAL.teal
    : id === 'orbit' ? PAL.mint : id === 'server' ? '#6A7480' : '#5A6470';
  for (const p of st.plats) {
    if (p.soft) {
      // soft platforms read as thin, glowing, obviously pass-through
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.beginPath(); ctx.roundRect(p.x, p.y + 2, p.w, p.h + 4, 7); ctx.fill();
      ctx.fillStyle = accent;
      ctx.beginPath(); ctx.roundRect(p.x, p.y, p.w, p.h, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      ctx.fillRect(p.x + 6, p.y + 2, p.w - 12, 2);
    } else {
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.beginPath(); ctx.roundRect(p.x - 5, p.y - 5, p.w + 10, p.h + 12, 10); ctx.fill();
      const g = ctx.createLinearGradient(0, p.y, 0, p.y + p.h);
      g.addColorStop(0, '#2A3038'); g.addColorStop(1, '#12161B');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.roundRect(p.x, p.y, p.w, p.h, 8); ctx.fill();
      ctx.fillStyle = accent;
      ctx.beginPath(); ctx.roundRect(p.x, p.y, p.w, 7, 4); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.10)';
      for (let x = p.x + 14; x < p.x + p.w - 10; x += 46) ctx.fillRect(x, p.y + 14, 22, 3);
    }
  }
  // ledge markers — players need to see where the grab points are
  for (const L of st.ledges) {
    ctx.strokeStyle = 'rgba(255,255,255,0.30)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(L.x, L.y + 2, 13, 0, TWO_PI); ctx.stroke();
  }
}
/* ============================ 6. FX =====================================
   Hit feedback is most of what "game feel" means in a fighter. Sparks are
   emitted along the knockback vector rather than in a random puff, so a
   hit visibly reads as pushing the opponent somewhere. */

const FX = {
  parts: [], rings: [], pops: [], stars: [],

  spark(x, y, angle, power, color) {
    const n = clamp(6 + power | 0, 6, 26);
    for (let i = 0; i < n; i++) {
      const a = angle + rand(-0.6, 0.6);
      const sp = rand(3, 5 + power * 0.6);
      this.parts.push({ kind: 'spark', x, y, vx: Math.cos(a) * sp, vy: -Math.sin(a) * sp,
        life: rand(12, 26), max: 26, color, g: 0.16, len: rand(6, 16) });
    }
  },
  dust(x, y, dir = 0, n = 6, color = 'rgba(220,230,240,0.7)') {
    for (let i = 0; i < n; i++)
      this.parts.push({ kind: 'dust', x: x + rand(-8, 8), y, vx: rand(-1.6, 1.6) + dir * 1.8,
        vy: rand(-2.4, -0.3), life: rand(14, 26), max: 26, color, g: 0.06, r: rand(3, 7) });
  },
  ember(x, y, color, n = 10) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, TWO_PI), sp = rand(1, 6);
      this.parts.push({ kind: 'dust', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1,
        life: rand(16, 34), max: 34, color, g: 0.12, r: rand(2, 5) });
    }
  },
  ring(x, y, color, maxR = 120, life = 22, width = 6) {
    this.rings.push({ x, y, color, r: 6, maxR, life, max: life, width });
  },
  pop(x, y, text, color, big = false) {
    this.pops.push({ x, y, text, color, life: big ? 52 : 38, max: big ? 52 : 38, big, vy: -1.4 });
  },
  koStars(x, y, color) {
    for (let i = 0; i < 26; i++) {
      const a = rand(0, TWO_PI), sp = rand(6, 22);
      this.stars.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(30, 60),
        max: 60, color, rot: rand(0, TWO_PI), spin: rand(-0.4, 0.4), size: rand(7, 16) });
    }
    this.ring(x, y, '#FFFFFF', 460, 34, 14);
    this.ring(x, y, color, 340, 28, 10);
  },

  step() {
    for (let i = this.parts.length - 1; i >= 0; i--) {
      const p = this.parts[i];
      p.x += p.vx; p.y += p.vy; p.vy += p.g; p.vx *= 0.985; p.life--;
      if (p.life <= 0) this.parts.splice(i, 1);
    }
    for (let i = this.rings.length - 1; i >= 0; i--) {
      const r = this.rings[i];
      r.r += (r.maxR - r.r) * 0.22; r.life--;
      if (r.life <= 0) this.rings.splice(i, 1);
    }
    for (let i = this.pops.length - 1; i >= 0; i--) {
      const p = this.pops[i];
      p.y += p.vy; p.vy *= 0.92; p.life--;
      if (p.life <= 0) this.pops.splice(i, 1);
    }
    for (let i = this.stars.length - 1; i >= 0; i--) {
      const s = this.stars[i];
      s.x += s.vx; s.y += s.vy; s.vx *= 0.96; s.vy = s.vy * 0.96 + 0.25;
      s.rot += s.spin; s.life--;
      if (s.life <= 0) this.stars.splice(i, 1);
    }
  },

  draw(ctx) {
    for (const p of this.parts) {
      const a = clamp(p.life / p.max, 0, 1);
      ctx.globalAlpha = a;
      if (p.kind === 'spark') {
        ctx.strokeStyle = p.color; ctx.lineWidth = 3; ctx.lineCap = 'round';
        const m = Math.hypot(p.vx, p.vy) || 1;
        ctx.beginPath(); ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - p.vx / m * p.len, p.y - p.vy / m * p.len); ctx.stroke();
      } else {
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * a, 0, TWO_PI); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    for (const r of this.rings) {
      const a = clamp(r.life / r.max, 0, 1);
      ctx.globalAlpha = a * 0.9; ctx.strokeStyle = r.color; ctx.lineWidth = r.width * a;
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, TWO_PI); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    for (const s of this.stars) {
      const a = clamp(s.life / s.max, 0, 1);
      ctx.save(); ctx.globalAlpha = a; ctx.translate(s.x, s.y); ctx.rotate(s.rot);
      ctx.fillStyle = s.color; ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        const o = (i / 5) * TWO_PI - Math.PI / 2;
        ctx.lineTo(Math.cos(o) * s.size, Math.sin(o) * s.size);
        ctx.lineTo(Math.cos(o + TWO_PI / 10) * s.size * 0.44, Math.sin(o + TWO_PI / 10) * s.size * 0.44);
      }
      ctx.closePath(); ctx.fill(); ctx.restore();
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const p of this.pops) {
      const t = 1 - p.life / p.max, a = clamp(p.life / p.max * 1.6, 0, 1);
      const sc = p.big ? 1 + easeOutBack(clamp(t * 3, 0, 1)) * 0.5 : 1 + t * 0.2;
      ctx.save(); ctx.globalAlpha = a; ctx.translate(p.x, p.y); ctx.scale(sc, sc);
      ctx.font = `italic 900 ${p.big ? 34 : 24}px "Arial Black", Impact, sans-serif`;
      ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(0,0,0,0.85)';
      ctx.strokeText(p.text, 0, 0); ctx.fillStyle = p.color; ctx.fillText(p.text, 0, 0);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  },

  clear() { this.parts.length = 0; this.rings.length = 0; this.pops.length = 0; this.stars.length = 0; },
};

/* ---- camera ------------------------------------------------------------
   Frames the action, punches in on KOs, and never lets a fighter leave the
   screen without warning. Shake decays per tick, not per rendered frame, so
   it behaves identically at 60Hz and 144Hz. */
const Cam = {
  x: 640, y: 360, zoom: 1, shake: 0, punch: 0,
  focus: null, focusT: 0, flash: 0,

  reset(stage) {
    const st = STAGES[stage] || STAGES.store;
    const m = st.plats[0];
    this.x = m.x + m.w / 2; this.y = m.y - 140; this.zoom = 0.9;
    this.shake = 0; this.punch = 0; this.focus = null; this.focusT = 0; this.flash = 0;
  },

  step(fighters, stage) {
    if (this.focusT > 0) {                       // KO close-up takes priority
      this.focusT--;
      if (this.focus) {
        this.x = lerp(this.x, this.focus.x, 0.30);
        this.y = lerp(this.y, this.focus.y, 0.30);
        this.zoom = lerp(this.zoom, 1.6, 0.22);
      }
    } else {
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity, n = 0;
      for (const f of fighters) {
        if (!f.alive || f.state === 'respawnWait') continue;
        minX = Math.min(minX, f.cx); maxX = Math.max(maxX, f.cx);
        minY = Math.min(minY, f.cy); maxY = Math.max(maxY, f.cy); n++;
      }
      if (n === 0) { const st = STAGES[stage] || STAGES.store, m = st.plats[0];
        minX = maxX = m.x + m.w / 2; minY = maxY = m.y - 120; }
      const tx = (minX + maxX) / 2, ty = (minY + maxY) / 2 - 40;
      const spanX = Math.max(760, maxX - minX + 460);
      const spanY = Math.max(430, maxY - minY + 340);
      let tz = Math.min(VIEW_W / spanX, VIEW_H / spanY, 1.15);
      tz = Math.max(tz, 0.42);
      this.x = lerp(this.x, tx, 0.085);
      this.y = lerp(this.y, ty, 0.085);
      this.zoom = lerp(this.zoom, tz, 0.06);
    }
    this.shake *= 0.86; if (this.shake < 0.3) this.shake = 0;
    this.punch *= 0.88; if (this.punch < 0.002) this.punch = 0;
    this.flash *= 0.82; if (this.flash < 0.01) this.flash = 0;
  },

  kick(amount, punch = 0) { this.shake = Math.min(34, this.shake + amount); this.punch += punch; },
  koFocus(x, y) { this.focus = { x, y }; this.focusT = 46; this.flash = 1; },

  apply(ctx) {
    ctx.translate(VIEW_W / 2, VIEW_H / 2);
    const z = this.zoom * (1 + this.punch);
    ctx.scale(z, z);
    ctx.translate(-this.x, -this.y);
    if (this.shake > 0) ctx.translate(rand(-this.shake, this.shake), rand(-this.shake, this.shake));
  },

  toScreen(wx, wy) {
    const z = this.zoom * (1 + this.punch);
    return { x: (wx - this.x) * z + VIEW_W / 2, y: (wy - this.y) * z + VIEW_H / 2 };
  },
};
/* ============================ 7. FIGHTER ================================ */

const BODY_W = 56, BODY_H = 78;

class Projectile {
  constructor(owner, move) {
    const p = move.proj;
    this.owner = owner; this.move = move; this.art = p.art;
    this.w = p.w; this.h = p.h;
    this.x = owner.cx + owner.facing * 46 - p.w / 2;
    this.y = owner.cy - p.h / 2 + (move.by || 0) * 0.4;
    this.vx = p.vx * owner.facing; this.vy = p.vy || 0;
    this.grav = p.grav || 0; this.life = p.life; this.dead = false;
    this.spin = 0;
  }
  step(world) {
    this.x += this.vx; this.y += this.vy; this.vy += this.grav;
    this.spin += 0.3; this.life--;
    const b = (STAGES[world.stage] || STAGES.store).blast;
    if (this.life <= 0 || this.x < b.l || this.x > b.r || this.y > b.b) this.dead = true;
    // projectiles are stopped by solid ground so they don't tunnel the stage
    for (const p of (STAGES[world.stage] || STAGES.store).plats) {
      if (p.soft) continue;
      if (this.x + this.w > p.x && this.x < p.x + p.w && this.y + this.h > p.y && this.y < p.y + p.h) {
        this.dead = true;
        FX.ember(this.x + this.w / 2, this.y + this.h / 2, this.owner.char.color, 8);
      }
    }
  }
  rect() { return { x: this.x, y: this.y, w: this.w, h: this.h }; }
}

class Fighter {
  constructor(id, opts) {
    this.id = id;
    this.name = opts.name || 'FIGHTER';
    this.charId = opts.charId || 'ollie';
    this.char = charOf(this.charId);
    this.slot = opts.slot || 0;
    this.control = opts.control || { kind: 'key', scheme: 'p1' };
    this.pad = new Pad();
    this.cpu = null;

    this.w = BODY_W; this.h = BODY_H;
    this.x = 0; this.y = 0; this.vx = 0; this.vy = 0;
    this.prevY = 0;
    this.facing = 1;
    this.percent = 0;
    this.stocks = opts.stocks || 3;
    this.alive = true;
    this.kos = 0; this.falls = 0;

    this.state = 'air'; this.stateT = 0;
    this.jumpsLeft = this.char.jumps;
    this.grounded = false; this.onWall = 0; this.groundPlat = null;
    this.hitstop = 0; this.invuln = 0; this.hitstun = 0;
    this.shield = CFG.shieldMax; this.shieldT = 0; this.shieldStun = 0;
    this.move = null; this.moveKey = ''; this.moveT = 0; this.charge = 0;
    this.hitList = new Set(); this.rehitT = 0;
    this.fastFall = false; this.dropT = 0; this.ledgeCd = 0; this.ledge = null; this.rollDir = 1;
    this.landLag = 0; this.usedUpSpecial = false;
    this.combo = 0; this.comboT = 0; this.lastHitBy = null;
    this.trail = []; this.flash = 0; this.squash = 1; this.parryFx = 0;
    this.respawnT = 0;
  }

  get cx() { return this.x + this.w / 2; }
  get cy() { return this.y + this.h / 2; }
  get shielding() { return this.state === 'shield'; }
  get busy() { return ['attack', 'roll', 'spotdodge', 'airdodge', 'hitstun', 'tumble',
                       'shieldbreak', 'jumpsquat', 'ledgeGetup', 'respawnWait'].includes(this.state); }
  get actionable() { return !this.busy && this.hitstop <= 0 && this.landLag <= 0 && this.state !== 'dead'; }

  setState(s) { this.state = s; this.stateT = 0; }

  spawn(stage, index) {
    const st = STAGES[stage] || STAGES.store;
    const sp = st.spawns[index % st.spawns.length];
    this.x = sp[0] - this.w / 2; this.y = sp[1];
    this.vx = 0; this.vy = 0; this.facing = sp[0] < 640 ? 1 : -1;
    this.setState('air'); this.jumpsLeft = this.char.jumps;
    this.invuln = 90; this.hitstun = 0; this.hitstop = 0;
    this.shield = CFG.shieldMax; this.move = null; this.trail.length = 0;
  }

  /* ---------------------------------------------------------------- tick */
  update(world) {
    if (this.state === 'dead') return;

    // Counters are decremented toward zero and clamped. A fractional hitstop
    // that decayed to -0.04 used to fail an `=== 0` test and lock the fighter
    // out of every action for the rest of the match.
    if (this.hitstop > 0) { this.hitstop = Math.max(0, this.hitstop - 1); this.stateT++; return; }

    if (this.invuln > 0) this.invuln--;
    if (this.ledgeCd > 0) this.ledgeCd--;
    if (this.comboT > 0) { this.comboT--; if (this.comboT === 0) this.combo = 0; }
    if (this.flash > 0) this.flash--;
    if (this.parryFx > 0) this.parryFx--;
    if (this.dropT > 0) this.dropT--;
    this.squash = lerp(this.squash, 1, 0.2);
    this.stateT++;

    if (this.state === 'respawnWait') { this.respawnTick(world); return; }

    const pad = this.pad;

    if (this.landLag > 0) { this.landLag--; this.vx *= CFG.groundFriction; }
    if (this.shieldStun > 0) this.shieldStun = Math.max(0, this.shieldStun - 1);

    if (this.state === 'hitstun' || this.state === 'tumble') {
      this.hitstun--;
      // Directional influence is applied continuously, so holding a direction
      // during launch genuinely changes where you end up.
      if (pad.x || pad.y) {
        const sp = Math.hypot(this.vx, this.vy);
        if (sp > 1) {
          const ang = Math.atan2(-this.vy, this.vx);
          const sx = pad.x, sy = -pad.y, sm = Math.hypot(sx, sy) || 1;
          const cross = (Math.cos(ang) * (sy / sm) - Math.sin(ang) * (sx / sm));
          const na = ang + cross * CFG.diStrength * 0.09;
          this.vx = Math.cos(na) * sp; this.vy = -Math.sin(na) * sp;
        }
      }
      if (this.hitstun <= 0) this.setState(this.grounded ? 'idle' : 'air');
    }

    if (this.state === 'ledge') { this.ledgeTick(world); return; }
    if (this.state === 'ledgeGetup') { this.ledgeGetupTick(); return; }
    if (this.state === 'shieldbreak') {
      if (this.stateT > 150) this.setState(this.grounded ? 'idle' : 'air');
    }

    if (this.state === 'attack') this.attackTick(world);
    if (this.state === 'jumpsquat') this.jumpSquatTick();
    if (this.state === 'roll' || this.state === 'spotdodge') this.dodgeTick();
    if (this.state === 'airdodge') this.airDodgeTick();

    if (this.actionable) this.handleInput(world);

    this.physics(world);
    this.collide(world);
    this.tryLedge(world);
    this.blastCheck(world);

    // motion trail while being launched — sells the speed of a KO hit
    if (this.state === 'tumble' || Math.hypot(this.vx, this.vy) > 15) {
      this.trail.push({ x: this.cx, y: this.cy, a: 1 });
      if (this.trail.length > 10) this.trail.shift();
    } else if (this.trail.length) this.trail.shift();
    for (const t of this.trail) t.a *= 0.86;
  }

  /* -------------------------------------------------------------- inputs */
  handleInput(world) {
    const pad = this.pad;

    // shield / dodges
    if (pad.held.shield && this.shieldStun === 0) {
      if (this.grounded) {
        if (this.shield > 0) {
          if (pad.pressed.shield || this.state !== 'shield') {
            if (this.state !== 'shield') { this.setState('shield'); this.shieldT = 0; }
          }
          if (this.state === 'shield') {
            this.shieldT++;
            this.shield -= CFG.shieldDrain;
            this.vx *= 0.6;
            if (pad.x !== 0 && pad.dirBuf.x <= 4) return this.startRoll(pad.x);
            if (pad.y > 0 && pad.dirBuf.y <= 4) return this.startSpotDodge();
            if (this.shield <= 0) return this.breakShield();
            return;
          }
        }
      } else if (pad.pressed.shield) {
        return this.startAirDodge(pad.x, pad.y);
      }
    } else if (this.state === 'shield') {
      this.setState('idle');
    }
    if (this.state !== 'shield' && this.shield < CFG.shieldMax) this.shield = Math.min(CFG.shieldMax, this.shield + CFG.shieldRegen);

    // attacks
    if (pad.buffered('atk', 5)) { pad.consume('atk'); return this.chooseAttack(false, world); }
    if (pad.buffered('spec', 5)) { pad.consume('spec'); return this.chooseAttack(true, world); }

    // jump / drop-through
    if (pad.buffered('jump', 6)) {
      if (this.grounded && pad.y > 0 && this.groundPlat && this.groundPlat.soft) {
        pad.consume('jump'); this.dropT = 12; this.grounded = false; this.y += 4; this.vy = 2;
        this.setState('air'); Audio_.play('dodge'); return;
      }
      if (this.grounded) { pad.consume('jump'); this.setState('jumpsquat'); return; }
      if (this.onWall !== 0) {                       // wall jump
        pad.consume('jump');
        this.vy = this.char.jump * -0.95; this.vx = -this.onWall * 11;
        this.facing = -this.onWall; this.jumpsLeft = Math.max(this.jumpsLeft, 1);
        this.usedUpSpecial = false; this.setState('air');
        FX.dust(this.cx + this.onWall * 24, this.cy, -this.onWall, 8);
        Audio_.play('dbljump'); return;
      }
      if (this.jumpsLeft > 0) {
        pad.consume('jump'); this.jumpsLeft--;
        this.vy = -this.char.djump; this.fastFall = false;
        if (pad.x) this.facing = pad.x;
        this.squash = 1.22; this.setState('air');
        FX.ring(this.cx, this.cy + 24, 'rgba(255,255,255,0.5)', 54, 14, 4);
        Audio_.play('dbljump'); return;
      }
    }

    // ground movement
    if (this.grounded) {
      if (pad.x !== 0) {
        this.facing = pad.x;
        const top = this.char.run;
        this.vx = approach(this.vx, top * pad.x, CFG.groundAccel);
        this.setState(Math.abs(this.vx) > top * 0.55 ? 'run' : 'walk');
        if (this.stateT % 9 === 0 && Math.abs(this.vx) > top * 0.6)
          FX.dust(this.cx - this.facing * 16, this.y + this.h, -this.facing, 2, 'rgba(200,210,225,0.5)');
      } else {
        this.vx *= CFG.groundFriction;
        if (this.state === 'run' || this.state === 'walk') this.setState('idle');
      }
    } else {
      if (pad.x !== 0) {
        this.vx = approach(this.vx, this.char.air * pad.x, CFG.airAccel);
        if (this.state !== 'attack') this.facing = pad.x;
      }
      if (pad.y > 0 && pad.dirBuf.y <= 3 && this.vy > 0) this.fastFall = true;
      if (this.state !== 'attack' && this.state !== 'airdodge') this.setState('air');
    }
  }

  /* Jumpsquat resolves into a short or full hop depending on how long the
     button was held. This must be a state tick, not part of handleInput:
     'jumpsquat' counts as busy, so handleInput never runs during it and the
     fighter could enter jumpsquat and never leave. */
  jumpSquatTick() {
    this.vx *= 0.85;
    if (this.stateT < CFG.jumpSquat) return;
    const pad = this.pad;
    const short = !pad.held.jump || pad.jumpHeld < CFG.shortHopWindow;
    this.vy = -this.char.jump * (short ? CFG.shortHopMul : 1);
    this.grounded = false; this.fastFall = false; this.squash = 1.28;
    this.setState('air');
    FX.dust(this.cx, this.y + this.h, 0, 6);
    Audio_.play('jump');
  }

  /* ------------------------------------------------------------- attacks */
  chooseAttack(special, world) {
    const pad = this.pad, air = !this.grounded;
    let key;
    if (special) {
      key = pad.y < 0 ? 'uspec' : pad.y > 0 ? 'dspec' : pad.x !== 0 ? 'sspec' : 'nspec';
      if (key === 'uspec' && air && this.usedUpSpecial) return;      // one recovery per airtime
    } else if (air) {
      key = pad.y < 0 ? 'uair' : pad.y > 0 ? 'dair'
        : pad.x === this.facing && pad.x !== 0 ? 'fair'
          : pad.x === -this.facing && pad.x !== 0 ? 'bair' : 'nair';
    } else {
      if (pad.x !== 0 && pad.smashX(6)) key = 'fsmash';
      else if (pad.y < 0 && pad.smashY(6)) key = 'usmash';
      else if (pad.y > 0 && pad.smashY(6)) key = 'dsmash';
      else if (pad.x !== 0) key = 'ftilt';
      else if (pad.y < 0) key = 'utilt';
      else if (pad.y > 0) key = 'dtilt';
      else key = 'jab';
    }
    this.startMove(key, world);
  }

  startMove(key, world) {
    const m = this.char.moves[key];
    if (!m) return;
    if (this.pad.x !== 0 && !m.back && key !== 'bair') this.facing = this.pad.x || this.facing;
    this.move = m; this.moveKey = key; this.moveT = 0; this.charge = 0;
    this.hitList.clear(); this.rehitT = 0;
    this.setState('attack');
    if (m.recovery) {                              // up-special launch
      this.vy = -m.recovery; this.usedUpSpecial = true;
      this.jumpsLeft = Math.max(0, this.jumpsLeft - 0);
      FX.ring(this.cx, this.cy + 20, this.char.color, 70, 16, 5);
    }
    if (m.lunge) { this.vx = this.facing * m.lunge; if (!this.grounded) this.vy *= 0.4; }
    if (m.stall && !this.grounded) { this.vy = -3; }
    Audio_.play('whiff');
  }

  attackTick(world) {
    const m = this.move; if (!m) { this.setState('idle'); return; }
    const startEnd = m.s, activeEnd = m.s + m.a, total = m.s + m.a + m.r;

    // smash charge: hold the button during startup to bank power
    if (m.smash && this.moveT === startEnd - 1 && this.pad.held.atk && this.charge < CFG.smashChargeMax) {
      this.charge++;
      if (this.charge % 5 === 0) FX.ember(this.cx, this.cy, this.char.color, 3);
      this.vx *= 0.7;
      return;
    }

    // The lunge only drives while there is ground under you (plus a short grace
    // so it still works off a ledge). Otherwise a dash special launched near an
    // edge carried the fighter clean past the blast zone with no way to act.
    if (m.lunge && this.moveT < activeEnd && (this.grounded || this.moveT < m.s + 8)) {
      this.vx = approach(this.vx, this.facing * m.lunge, 1.6);
      if (m.spin && this.moveT % 4 === 0) FX.ember(this.cx, this.cy + 20, this.char.color, 2);
    } else if (this.grounded) {
      // Ground friction used to live only in handleInput, which does not run
      // while attacking — so starting a jab at a full sprint slid you 200px
      // and straight off the stage. Non-lunging attacks now root you.
      this.vx *= CFG.groundFriction;
    }

    if (this.moveT === startEnd) {
      if (m.proj) { world.projectiles.push(new Projectile(this, m)); Audio_.play('proj'); }
      else if (m.emp) { FX.ring(this.cx, this.cy, '#00E5FF', m.bw * 0.55, 26, 9);
        FX.ring(this.cx, this.cy, '#FF3DCB', m.bw * 0.42, 22, 6); }
    }

    if (this.moveT >= startEnd && this.moveT < activeEnd && !m.proj) {
      if (m.hold && this.rehitT-- <= 0) { this.hitList.clear(); this.rehitT = 13; }
      this.checkHits(world);
    }

    this.moveT++;
    if (this.moveT >= total) {
      this.move = null; this.moveKey = ''; this.charge = 0;
      this.setState(this.grounded ? 'idle' : 'air');
    }
  }

  hitRect() {
    const m = this.move; if (!m) return null;
    const cx = this.cx + (m.centered ? 0 : this.facing * m.bx);
    const cy = this.cy + m.by;
    return { x: cx - m.bw / 2, y: cy - m.bh / 2, w: m.bw, h: m.bh };
  }

  checkHits(world) {
    // Snapshot the move and charge: resolving a hit can interrupt this attack
    // mid-loop (a parry cancels it outright), and a 2-target hitbox would
    // otherwise dereference a move that no longer exists.
    const m = this.move, r = this.hitRect();
    if (!m || !r) return;
    const chargeMul = 1 + (this.charge / CFG.smashChargeMax) * 0.4;
    for (const f of world.fighters) {
      if (f === this || !f.alive || f.state === 'dead' || f.state === 'respawnWait') continue;
      if (this.hitList.has(f.id)) continue;
      if (!overlap(r, { x: f.x, y: f.y, w: f.w, h: f.h })) continue;
      this.hitList.add(f.id);
      world.resolveHit(this, f, m, chargeMul);
      if (this.move !== m) break;              // this attack was interrupted
    }
  }

  /* ------------------------------------------------------------- defence */
  startRoll(dir) {
    this.setState('roll'); this.facing = -dir;   // roll turns you around, like the original
    this.vx = dir * CFG.rollSpeed; this.invuln = 0; this.rollDir = dir;
    Audio_.play('dodge'); FX.dust(this.cx, this.y + this.h, dir, 8);
  }
  startSpotDodge() { this.setState('spotdodge'); this.vx = 0; Audio_.play('dodge'); }
  startAirDodge(x, y) {
    this.setState('airdodge');
    const m = Math.hypot(x, y);
    if (m > 0) { this.vx = (x / m) * CFG.airDodgeSpeed; this.vy = (y / m) * CFG.airDodgeSpeed; }
    else { this.vx *= 0.3; this.vy = -1; }
    Audio_.play('dodge');
    FX.ring(this.cx, this.cy, 'rgba(180,230,255,0.7)', 60, 14, 4);
  }
  dodgeTick() {
    const w = this.state === 'roll' ? CFG.rollInvuln : CFG.spotDodgeInvuln;
    const total = this.state === 'roll' ? CFG.rollFrames : CFG.spotDodgeFrames;
    this.invuln = (this.stateT >= w[0] && this.stateT <= w[1]) ? 2 : this.invuln;
    if (this.state === 'roll') this.vx *= 0.90; else this.vx *= 0.6;
    if (this.stateT >= total) this.setState(this.grounded ? 'idle' : 'air');
  }
  airDodgeTick() {
    this.invuln = (this.stateT >= CFG.airDodgeInvuln[0] && this.stateT <= CFG.airDodgeInvuln[1]) ? 2 : this.invuln;
    this.vx *= 0.93; this.vy = this.vy * 0.93;
    if (this.stateT >= CFG.airDodgeFrames || this.grounded) {
      this.setState(this.grounded ? 'idle' : 'air');
      if (this.grounded) this.landLag = 6;
    }
  }
  breakShield() {
    this.setState('shieldbreak'); this.shield = 0; this.vy = -9; this.vx = 0;
    Audio_.play('break_'); Cam.kick(16, 0.04);
    FX.ring(this.cx, this.cy, '#00E5FF', 180, 30, 10);
    FX.ember(this.cx, this.cy, '#8FE9FF', 26);
    FX.pop(this.cx, this.y - 26, 'SHIELD BREAK', '#8FE9FF', true);
  }

  /* ------------------------------------------------------------- physics */
  physics(world) {
    const g = CFG.gravity * this.char.grav;
    // While grounded we keep a 1px downward bias. Without it the fighter rests
    // exactly on the surface, the overlap test reads false, and `grounded`
    // flickers on alternate frames — which breaks jumps, friction and attacks.
    if (this.grounded) this.vy = 1;
    if (!this.grounded) {
      this.vy += g;
      const cap = CFG.maxFall * this.char.fall * (this.fastFall ? CFG.fastFallMul : 1);
      if (this.vy > cap) this.vy = cap;
      if (this.state === 'hitstun' || this.state === 'tumble') {
        this.vx *= CFG.knockbackDecay; this.vy *= 0.995;
      } else if (this.state !== 'airdodge') {
        this.vx *= CFG.airDrag;
      }
      if (this.onWall !== 0 && this.vy > 1.5 && this.state !== 'hitstun' && this.state !== 'tumble') {
        this.vy *= 0.72;                                        // wall slide
        if (this.stateT % 6 === 0) FX.dust(this.cx + this.onWall * 24, this.cy + 10, -this.onWall, 1);
      }
    } else if (this.state === 'hitstun' || this.state === 'tumble') {
      this.vx *= 0.93;
    }
    this.prevY = this.y;
    this.x += this.vx;
    this.y += this.vy;
  }

  collide(world) {
    const st = STAGES[world.stage] || STAGES.store;
    const wasGrounded = this.grounded;
    this.grounded = false; this.onWall = 0; this.groundPlat = null;

    for (const p of st.plats) {
      if (p.soft) continue;
      if (!overlap({ x: this.x, y: this.y, w: this.w, h: this.h }, p)) continue;
      // resolve on the shallowest axis so corners don't fling the fighter
      const ox = (this.cx < p.x + p.w / 2) ? (p.x - (this.x + this.w)) : (p.x + p.w - this.x);
      const oy = (this.cy < p.y + p.h / 2) ? (p.y - (this.y + this.h)) : (p.y + p.h - this.y);
      if (Math.abs(ox) < Math.abs(oy)) {
        this.x += ox; this.onWall = ox > 0 ? -1 : 1;
        if (this.state === 'hitstun' || this.state === 'tumble') { this.vx *= -0.42; this.bonk(); }
        else this.vx = 0;
      } else {
        this.y += oy;
        if (oy < 0) this.land(p); else { this.vy = Math.max(0, this.vy); }
      }
    }
    // soft platforms only stop a fighter that is falling onto them
    if (this.dropT === 0 && this.vy >= 0) {
      for (const p of st.plats) {
        if (!p.soft) continue;
        const feet = this.y + this.h, prevFeet = this.prevY + this.h;
        if (this.x + this.w > p.x && this.x < p.x + p.w &&
            prevFeet <= p.y + 2 && feet >= p.y) { this.y = p.y - this.h; this.land(p); }
      }
    }
    if (this.grounded) {
      this.fastFall = false;
      this.jumpsLeft = this.char.jumps;
      this.usedUpSpecial = false;
      if (!wasGrounded) {
        this.squash = 0.76;
        const hard = this.vy > 9;
        FX.dust(this.cx, this.y + this.h, 0, hard ? 12 : 5);
        Audio_.play('land');
        if (this.state === 'attack' && this.move && this.move.air) {
          this.landLag = CFG.landLag + 4; this.move = null; this.setState('idle');
        } else if (this.state === 'air') this.setState('idle');
        if (this.state === 'tumble' && this.hitstun > 6) { this.hitstun = 6; }
      }
      this.vy = 0;
    }
  }
  land(p) { this.grounded = true; this.groundPlat = p; this.vy = 0; }
  bonk() { Cam.kick(6); FX.ember(this.cx, this.cy, '#FFF', 8); Audio_.play('hitL'); }

  /* --------------------------------------------------------------- ledge */
  tryLedge(world) {
    if (this.grounded || this.ledgeCd > 0 || this.state === 'ledge') return;
    if (['attack', 'airdodge', 'roll', 'spotdodge'].includes(this.state)) {
      if (!(this.state === 'attack' && this.move && this.move.recovery)) return;
    }
    if (this.hitstun > 0) return;
    if (this.vy < -1.5) return;
    const st = STAGES[world.stage] || STAGES.store;
    for (const L of st.ledges) {
      const outside = L.dir === -1 ? this.cx < L.x : this.cx > L.x;
      if (!outside) continue;
      if (Math.abs(this.cx - L.x) > 62) continue;
      if (this.cy < L.y - 74 || this.cy > L.y + 78) continue;
      this.ledge = L; this.setState('ledge');
      this.x = L.x - this.w / 2 + L.dir * 26; this.y = L.y + 6;
      this.vx = 0; this.vy = 0; this.facing = -L.dir;
      this.invuln = CFG.ledgeInvuln; this.jumpsLeft = this.char.jumps;
      this.usedUpSpecial = false; this.move = null;
      Audio_.play('ledge'); FX.dust(L.x, L.y, 0, 4);
      return;
    }
  }

  ledgeTick(world) {
    const pad = this.pad, L = this.ledge;
    const inward = -L.dir;
    if (pad.buffered('jump', 5)) {
      pad.consume('jump'); this.vy = -this.char.jump * 1.02; this.vx = inward * 4;
      this.setState('air'); this.ledgeCd = CFG.ledgeCooldown; this.invuln = 12;
      Audio_.play('jump'); return;
    }
    if (pad.x === inward || pad.y < 0) {           // climb up
      this.setState('ledgeGetup'); this.invuln = 14; return;
    }
    if (pad.x === L.dir || pad.y > 0) {            // let go
      this.setState('air'); this.ledgeCd = CFG.ledgeCooldown; this.vy = 1; return;
    }
    if (pad.buffered('atk', 5) || pad.buffered('spec', 5)) {
      pad.consume('atk'); pad.consume('spec');
      this.setState('ledgeGetup'); this.invuln = 14; return;
    }
    if (this.stateT > 480) { this.setState('air'); this.ledgeCd = CFG.ledgeCooldown; }
  }

  /* Climbing back onto the stage. Scripted for 20 frames, then control returns.
     Without this the fighter entered ledgeGetup and never left it. */
  ledgeGetupTick() {
    const L = this.ledge; if (!L) { this.setState('air'); return; }
    const inward = -L.dir, T = 20;
    const k = easeOutCubic(clamp(this.stateT / T, 0, 1));
    this.x = lerp(L.x - this.w / 2 + L.dir * 26, L.x + inward * 42 - this.w / 2, k);

/* ============================ 8. AI =====================================
   The CPU writes to a Pad and nothing else. It has no special access to

class CPU {
  constructor(fighter, level = 5) {
    this.f = fighter;

    this.raw = { x: 0, y: 0, jump: false, atk: false, spec: false, shield: false };
    this.timer = 0; this.holdJump = 0; this.holdAtk = 0; this.holdSpec = 0; this.holdShield = 0;
    this.lastX = 0; this.lastY = 0;

  get reaction() { return Math.max(3, 20 - this.level * 2); }
  get aggression() { return 0.20 + this.level * 0.072; }

  think(world) {
    const f = this.f, r = this.raw;
    r.x = 0; r.y = 0;
    // buttons are held a few frames so the Pad sees a clean press edge
    r.jump = this.holdJump-- > 0;
    r.atk = this.holdAtk-- > 0;
    r.spec = this.holdSpec-- > 0;
    r.shield = this.holdShield-- > 0;
    if (!f.alive || f.state === 'dead') return r;

    const main = (STAGES[world.stage] || STAGES.store).plats[0];
    const left = main.x, right = main.x + main.w, centre = main.x + main.w / 2;

    /* --- survival DI while being launched ------------------------------- */
    if (f.state === 'hitstun' || f.state === 'tumble') {
      if (Math.abs(f.vx) > Math.abs(f.vy)) r.y = -1;          // launched sideways: DI up
      else r.x = f.cx < centre ? 1 : -1;                      // launched up: DI inward
      if (this.level >= 6 && f.hitstun < 6 && !f.grounded) this.holdShield = 2;  // air dodge out
      return r;
    }

    /* --- on the ledge: climb back on, don't hop into the void ------------ */
    if (f.state === 'ledge') {
      if (f.stateT > 6 + (9 - this.level) * 4) r.x = -f.ledge.dir;   // hold inward = getup
      return r;
    }
    if (f.state === 'ledgeGetup' || f.state === 'shieldbreak' || f.state === 'respawnWait') {
      if (f.state === 'respawnWait' && f.respawnT < 60) this.holdJump = 2;
      return r;
    }

    /* --- recovery outranks everything else ------------------------------- */
    const offstage = f.cx < left - 8 || f.cx > right + 8;
    const belowStage = f.y + f.h > main.y + 20;
    if (!f.grounded && (offstage || belowStage)) {
      r.x = f.cx < centre ? 1 : -1;
      const needHeight = f.cy > main.y - 60;
      if (f.vy > 0.5 && f.jumpsLeft > 0 && needHeight) this.holdJump = 3;
      // burn the up-special while there is still height to spare, not at the last moment
      if (f.jumpsLeft === 0 && !f.usedUpSpecial && (f.vy > 0.5 || f.cy > main.y - 20)) { r.y = -1; this.holdSpec = 3; }
      // low levels genuinely fumble the recovery; that is the difficulty knob
      if (Math.random() < (9 - this.level) * 0.035) r.x = 0;
      return r;
    }

    const foe = this.nearestFoe(world);
    if (!foe) return r;
    const dx = foe.cx - f.cx, dy = foe.cy - f.cy;
    const gap = Math.abs(dx), vgap = Math.abs(dy);

    /* Already committed to something. Queuing another attack here is what made
       high-level bots WORSE than low-level ones: they kept the attack buffer
       permanently full, so they re-attacked the instant they became actionable
       and could never move, shield or dodge. Steer only. */
    if (['attack', 'roll', 'spotdodge', 'airdodge'].includes(f.state)) {
      if (!f.grounded) r.x = Math.sign(centre - f.cx) || 0;   // drift home during endlag
      return this.keepOnStage(r, f, left, right);
    }

    /* --- edgeguard, but only from a safe footing ------------------------- */
    const foeOff = foe.cx < left - 30 || foe.cx > right + 30 || foe.state === 'ledge';
    const selfSafe = f.grounded && f.cx > left + 40 && f.cx < right - 40;
    if (this.level >= 5 && foeOff && selfSafe && foe.cy > main.y - 240) {
      const post = foe.cx < centre ? left + 105 : right - 105;
      r.x = Math.abs(post - f.cx) > 24 ? Math.sign(post - f.cx) : 0;
      if (r.x === 0 && this.timer-- <= 0) {
        this.timer = this.reaction + 14;
        if (f.char.moves.nspec.proj) { this.holdSpec = 3; }
        else { r.x = Math.sign(dx); this.holdAtk = 3; }
      }
      return this.keepOnStage(r, f, left, right);
    }

    /* --- respect an incoming attack --------------------------------------- */
    const foeSwinging = foe.state === 'attack' && foe.move && foe.moveT <= foe.move.s + foe.move.a;
    if (foeSwinging && gap < 150 && vgap < 100 && f.grounded && this.timer <= 0) {
      // A low shield is worse than no shield: breaking it hands the opponent a
      // free KO, so bots roll out instead of holding. If they decide not to
      // defend at all, fall through to normal play rather than standing still.
      if (f.shield < 38) {
        this.timer = this.reaction + 8; r.x = -Math.sign(dx) || 1; this.holdShield = 4;
        return this.keepOnStage(r, f, left, right);
      }
      if (Math.random() < this.defence) {
        this.holdShield = 8; this.timer = this.reaction + 6;
        return this.keepOnStage(r, f, left, right);
      }
    }

    /* --- punish recovery frames -------------------------------------------- */
    const foeLagging = foe.state === 'attack' && foe.move && foe.moveT > foe.move.s + foe.move.a;
    if (this.level >= 5 && foeLagging && gap < 170) {
      r.x = Math.sign(dx);
      if (this.timer-- <= 0) { this.timer = 12; this.holdAtk = 4; }
      return this.keepOnStage(r, f, left, right);
    }

    /* --- neutral ------------------------------------------------------------ */
    if (this.timer-- > 0) {
      r.x = this.lastX; r.y = this.lastY;
      return this.keepOnStage(r, f, left, right);
    }
    this.timer = this.reaction;

    const inRange = gap < 150 && vgap < 140;

    const foeIsOff = foe.cx < left || foe.cx > right;
    if (!inRange) {
      // don't chase an offstage opponent into the void, but do take the ledge
      const goal = foeIsOff ? (foe.cx < centre ? left + 105 : right - 105) : foe.cx;
      r.x = Math.abs(goal - f.cx) > 26 ? (Math.sign(goal - f.cx) || 0) : 0;
      // Closing the VERTICAL gap matters as much as the horizontal one. Without
      // this, two bots stack on a platform and a soft platform above it, sit
      // directly in line, and neither ever reaches the other.
      const overStage = f.cx > left + 40 && f.cx < right - 40;
      if (dy < -70 && f.grounded && overStage) this.holdJump = 3;               // chase upward
      if (dy < -60 && !f.grounded && f.jumpsLeft > 0 && f.vy > 2) this.holdJump = 3;
      if (dy > 70 && f.grounded && f.groundPlat && f.groundPlat.soft && overStage) {
        r.y = 1; this.holdJump = 3;                                             // drop through to them
      }
      // zone with a projectile when there is room to use one
      if (gap > 300 && vgap < 90 && f.grounded && f.char.moves.nspec.proj && Math.random() < this.aggression * 0.6) {
        this.holdSpec = 3; r.x = 0;
      }
    } else if (vgap > 90 && f.grounded && dy > 70 && f.groundPlat && f.groundPlat.soft
               && f.cx > left + 40 && f.cx < right - 40) {
      r.y = 1; this.holdJump = 3;                       // drop onto them
    } else if (vgap > 90 && f.grounded && dy < -70 && f.cx > left + 40 && f.cx < right - 40) {
      this.holdJump = 3;                                // hop up to them
    } else if (Math.random() < this.aggression && !this.overTheVoid(f, left, right)) {
      if (Math.sign(dx) !== 0 && Math.sign(dx) !== f.facing) r.x = Math.sign(dx);
      if (dy < -50) { r.y = -1; this.holdAtk = 3; }                     // foe above
      else if (dy > 50 && !f.grounded) { r.y = 1; this.holdAtk = 3; }   // foe below
      else if (foe.percent > 80 && f.grounded && this.level >= 4 && Math.random() < 0.5) {
        r.x = Math.sign(dx); this.holdAtk = 5;                          // tapped dir -> smash
      } else if (Math.random() < 0.28 && this.level >= 3 && this.safeToCommit(f, left, right)
                 && this.lungeFits(f, Math.sign(dx) || f.facing, left, right)) {
        r.x = Math.sign(dx); this.holdSpec = 3;
      } else {
        this.holdAtk = 3;
        if (Math.random() < 0.45) r.x = Math.sign(dx);
      }
    } else {
      r.x = Math.sign(dx) || 0;
    }

    if (this.holdAtk > 0 || this.holdSpec > 0) this.timer = this.reaction + 10;
    if (f.grounded && Math.random() < 0.004 * this.level) this.holdJump = 3;
    this.lastX = r.x; this.lastY = r.y;
    return this.keepOnStage(r, f, left, right);
  }

  /* The original CPU happily walked off the edge and then lived on the ledge.
     Grounded bots now refuse to step past the last 55px of the platform. */
  /* The single biggest cause of CPUs killing themselves was chasing an
     opponent straight off the platform. Bots now refuse to steer outward near
     the edge — in the air as well as on the ground — and walk back if they
     are already past the safe band. Deliberate recovery and edgeguarding
     return before this is applied. */
  keepOnStage(r, f, left, right) {
    // Staying on the stage is a skill, so weak bots sometimes fail at it.
    // Previously Lv1 never self-destructed purely because it was too slow to
    // jump, which made it beat Lv9 outright — the difficulty scale inverted.
    if (Math.random() < (9 - this.level) * 0.03) return r;
    if (f.grounded) {
      // Use the platform actually underfoot, not the main stage. Side platforms
      // sit outside the main platform's span, and measuring against the main
      // stage made bots standing on one walk straight off it into the void.
      const p = f.groundPlat;
      const pl = p ? p.x : left, pr = p ? p.x + p.w : right;
      const m = Math.min(78, (pr - pl) * 0.3);
