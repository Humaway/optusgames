      if (r.x > 0 && f.cx > pr - m) r.x = 0;
      if (f.cx < pl + m * 0.6) r.x = 1;
      if (f.cx > pr - m * 0.6) r.x = -1;
    } else {
      if (r.x < 0 && f.cx < left + 60) r.x = 0;
      if (r.x > 0 && f.cx > right - 60) r.x = 0;
      if (f.cx < left + 20) r.x = 1;
      if (f.cx > right - 20) r.x = -1;
    }
    return r;
  }

  /* Lunging specials carry you a long way and cannot be cancelled, so only
     throw one out with room to spare behind the opponent. */
  safeToCommit(f, left, right) {
    return f.grounded && f.cx > left + 150 && f.cx < right - 150;
  }

  /* A dash special covers ~300px and cannot be cancelled, so check the landing
     point rather than just the starting point. */
  lungeFits(f, dir, left, right) {
    const end = f.cx + dir * 320;
    return end > left + 50 && end < right - 50;
  }

  /* Airborne and outside the platform: getting home beats any attack. */
  overTheVoid(f, left, right) {
    return !f.grounded && (f.cx < left + 30 || f.cx > right - 30);
  }

  nearestFoe(world) {
    let best = null, bd = Infinity;
    for (const o of world.fighters) {

      const d = Math.hypot(o.cx - this.f.cx, o.cy - this.f.cy);
      if (d < bd) { bd = d; best = o; }
    }

  }
}

    if (open > 0.2) {
      ctx.fillStyle = `rgba(124,243,208,${open * 0.55})`;
      ctx.beginPath(); ctx.roundRect(30, 12, 30 + open * 26, 52, 8); ctx.fill();
    }
  },

  yes(ctx, f, sw, dir) {
    ctx.fillStyle = '#00A3AD'; ctx.beginPath(); ctx.roundRect(1, 10, 58, 60, 16); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.14)'; ctx.beginPath(); ctx.roundRect(6, 14, 48, 16, 9); ctx.fill();
    ctx.save(); ctx.translate(30, 44); ctx.rotate(-0.14);
    ctx.fillStyle = PAL.yellow;
    ctx.font = '31px "Brush Script MT", "Segoe Script", "Comic Sans MS", cursive';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('Yes', 0, 0);
    ctx.restore();
    if (sw > 0) {
      ctx.fillStyle = `rgba(0,163,173,${0.85})`;
      if (dir === 'up') { ctx.beginPath(); ctx.roundRect(14, 10 - sw * 46, 32, sw * 46, 10); ctx.fill(); }
      else if (dir === 'down') { ctx.beginPath(); ctx.roundRect(14, 68, 32, sw * 46, 10); ctx.fill(); }
      else { ctx.beginPath(); ctx.roundRect(56, 22, sw * 54, 34, 10); ctx.fill(); }
    }
  },

  telstra(ctx, f, sw, dir, spin) {
    ctx.save();
    if (spin) { ctx.translate(30, 40); ctx.rotate(f.stateT * 0.5); ctx.translate(-30, -40); }
    ctx.fillStyle = '#FF6B00';
    ctx.beginPath(); ctx.ellipse(30, 44, 28, 14, -Math.PI / 4.5, 0, TWO_PI); ctx.fill();
    ctx.fillStyle = '#0033E6'; ctx.beginPath();
    ctx.moveTo(8, 12); ctx.lineTo(55, 12); ctx.lineTo(50, 25); ctx.lineTo(38, 25);
    ctx.lineTo(28, 66); ctx.lineTo(14, 66); ctx.lineTo(24, 25); ctx.lineTo(4, 25);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    if (sw > 0 && !spin) {
      ctx.strokeStyle = `rgba(255,107,0,${sw})`; ctx.lineWidth = 6;
      ctx.beginPath();
      if (dir === 'up') ctx.arc(30, 40, 42, Math.PI, TWO_PI);
      else if (dir === 'down') ctx.arc(30, 40, 42, 0, Math.PI);
      else ctx.arc(30, 40, 40, -1.1, 1.1);
      ctx.stroke();
    }
  },
};

/* shared arm used by the humanoid characters */
function ARM(ctx, sw, dir, skin) {
  if (sw === 0) { ctx.fillStyle = skin; ctx.beginPath(); ctx.roundRect(44, 30, 10, 26, 5); ctx.fill(); return; }
  const target = dir === 'up' ? -2.2 : dir === 'down' ? 1.5 : 0.1;
  const a = lerp(-0.9, target, (sw + 0.35) / 1.5);
  ctx.save(); ctx.translate(30, 26); ctx.rotate(a);
  ctx.fillStyle = skin; ctx.beginPath(); ctx.roundRect(-5, -6, 38, 12, 6); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.beginPath(); ctx.roundRect(-5, 0, 38, 6, 3); ctx.fill();
  ctx.restore();
}

const SLOT_COLORS = ['#FECD03', '#4FC3F7', '#FF5A3C', '#7CF3D0'];

function drawFighter(ctx, f, thumb = false) {
  if (f.state === 'dead') return;
  const sw = swingOf(f), dir = dirOf(f);
  const spin = !!(f.move && f.move.spin && f.state === 'attack' && f.moveT >= f.move.s);

  // ground shadow anchors the fighter in space — cheap, huge readability win
  if (!thumb && f.grounded) {
    ctx.save(); ctx.globalAlpha = 0.35; ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.ellipse(f.cx, f.y + f.h + 3, 26, 7, 0, 0, TWO_PI); ctx.fill(); ctx.restore();
  }
  // launch trail
  if (!thumb && f.trail.length > 1) {
    ctx.save(); ctx.strokeStyle = f.char.color; ctx.lineCap = 'round';
    for (let i = 1; i < f.trail.length; i++) {
      const a = f.trail[i].a * 0.5;
      ctx.globalAlpha = a; ctx.lineWidth = 16 * a;
      ctx.beginPath(); ctx.moveTo(f.trail[i - 1].x, f.trail[i - 1].y);
      ctx.lineTo(f.trail[i].x, f.trail[i].y); ctx.stroke();
    }
    ctx.restore();
  }

  ctx.save();
  ctx.translate(f.cx, f.cy);

  // squash & stretch on jumps, landings and launches
  let sx = f.squash, sy = 2 - f.squash;
  if (f.state === 'tumble') { const r = Math.atan2(f.vy, f.vx); ctx.rotate(r * 0.35); }
  if (f.state === 'shieldbreak') ctx.rotate(Math.sin(f.stateT * 0.4) * 0.15);
  if (f.state === 'roll') ctx.rotate(f.stateT / CFG.rollFrames * TWO_PI * (f.rollDir || 1));
  ctx.scale(f.charId === 'telstra' ? 1 : f.facing, 1);
  ctx.scale(sx, sy);
  if (f.invuln > 0 && !thumb) ctx.globalAlpha = 0.45 + Math.sin(f.stateT * 0.5) * 0.25;
  if (f.state === 'airdodge') ctx.globalAlpha = 0.5;
  ctx.translate(-30, -40);

  const id = f.charId;
  if (id === 'ollie') ART.ollie(ctx, f, sw, dir, spin);
  else if (id === 'jarrad') ART.jarrad(ctx, f, sw, dir);
  else if (id === 'stephen') ART.stephen(ctx, f, sw, dir);
  else if (id === 'muzz') ART.muzz(ctx, f, sw, dir);
  else if (id === 'iphone') ART.iphone(ctx, f, sw, dir);
  else if (id === 'pixel' || id === 'samsung') ART.fold(ctx, f, sw, dir, id);
  else if (id === 'yes') ART.yes(ctx, f, sw, dir);
  else if (id === 'telstra') ART.telstra(ctx, f, sw, dir, spin);
  ctx.restore();

  if (thumb) return;

  // impact flash
  if (f.flash > 0) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = f.flash / 8 * 0.5;
    ctx.fillStyle = '#FFF'; ctx.beginPath(); ctx.ellipse(f.cx, f.cy, 34, 44, 0, 0, TWO_PI); ctx.fill();
    ctx.restore();
  }
  // smash charge glow
  if (f.charge > 0) {
    const c = f.charge / CFG.smashChargeMax;
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.25 + c * 0.5;
    ctx.fillStyle = f.char.color;
    ctx.beginPath(); ctx.arc(f.cx, f.cy, 34 + c * 16 + Math.sin(f.stateT) * 2, 0, TWO_PI); ctx.fill();
    ctx.restore();
  }
  // shield
  if (f.state === 'shield') {
    const s = f.shield / CFG.shieldMax, r = 26 + s * 26;
    ctx.save();
    ctx.fillStyle = `rgba(0,163,173,${0.18 + s * 0.30})`;
    ctx.strokeStyle = `rgba(124,243,208,${0.5 + s * 0.4})`; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(f.cx, f.cy, r, 0, TWO_PI); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  if (f.parryFx > 0) {
    ctx.save(); ctx.globalAlpha = f.parryFx / 16;
    ctx.strokeStyle = '#FFF'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(f.cx, f.cy, 40 + (16 - f.parryFx) * 3, 0, TWO_PI); ctx.stroke();
    ctx.restore();
  }
  if (f.state === 'shieldbreak') {
    ctx.fillStyle = PAL.yellow;
    for (let i = 0; i < 3; i++) {
      const a = f.stateT * 0.09 + i * TWO_PI / 3;
      ctx.beginPath(); ctx.arc(f.cx + Math.cos(a) * 26, f.y - 12 + Math.sin(a) * 9, 4.5, 0, TWO_PI); ctx.fill();
    }
  }

  // slot marker + name, so 4-player games stay readable
  const col = SLOT_COLORS[f.slot % 4];
  ctx.save();
  ctx.fillStyle = col; ctx.beginPath();
  ctx.moveTo(f.cx, f.y - 14); ctx.lineTo(f.cx - 8, f.y - 26); ctx.lineTo(f.cx + 8, f.y - 26); ctx.fill();
  ctx.font = '900 13px "Segoe UI", system-ui, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,0.85)';
  ctx.strokeText(f.name, f.cx, f.y - 30); ctx.fillStyle = '#EEF3F8';
  ctx.fillText(f.name, f.cx, f.y - 30);
  ctx.restore();
}

function drawProjectile(ctx, p) {
  const cx = p.x + p.w / 2, cy = p.y + p.h / 2;
  ctx.save();
  if (p.art === 'plane') {
    ctx.translate(cx, cy); ctx.rotate(Math.atan2(p.vy, p.vx) * (p.vx < 0 ? -1 : 1));
    ctx.scale(p.vx < 0 ? -1 : 1, 1);
    ctx.fillStyle = '#FFF'; ctx.beginPath();
    ctx.moveTo(14, 0); ctx.lineTo(-12, -9); ctx.lineTo(-6, 0); ctx.lineTo(-12, 9); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#1B3550'; ctx.lineWidth = 1.6; ctx.stroke();
  } else if (p.art === 'fire') {
    ctx.translate(cx, cy);
    const s = 1 + Math.sin(p.spin * 2) * 0.12;
    ctx.scale(s, s);
    ctx.fillStyle = '#FF6600'; ctx.beginPath(); ctx.arc(0, 0, p.w / 2, 0, TWO_PI); ctx.fill();
    ctx.fillStyle = '#FFD34D'; ctx.beginPath(); ctx.arc(0, 0, p.w / 3.4, 0, TWO_PI); ctx.fill();
    ctx.fillStyle = 'rgba(255,102,0,0.55)';
    ctx.beginPath(); ctx.moveTo(-p.vx * 1.6, 0); ctx.lineTo(0, -8); ctx.lineTo(0, 8); ctx.fill();
  } else if (p.art === 'tee') {
    ctx.translate(cx, cy); ctx.rotate(p.spin);
    ctx.fillStyle = '#0033E6'; ctx.font = 'italic 900 34px "Arial Black", Impact, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('T', 0, 1);
    ctx.strokeStyle = '#FF6B00'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(0, 0, p.w / 2, 0, TWO_PI); ctx.stroke();
  } else if (p.art === 'ring') {
    ctx.translate(cx, cy);
    ctx.strokeStyle = PAL.yellow; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(0, 0, p.w / 2, p.spin, p.spin + 4.8); ctx.stroke();
    ctx.strokeStyle = 'rgba(254,205,3,0.4)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, p.w / 2 + 5, 0, TWO_PI); ctx.stroke();
  } else {
    ctx.translate(cx, cy);
    ctx.fillStyle = p.owner.char.color; ctx.beginPath(); ctx.arc(0, 0, p.w / 2, 0, TWO_PI); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.beginPath(); ctx.arc(-2, -2, p.w / 4, 0, TWO_PI); ctx.fill();
  }
  ctx.restore();
}
/* ============================ 10. WORLD & MATCH ========================= */

const World = {
  stage: 'store',
  fighters: [], projectiles: [],
  phase: 'idle',        // idle | countdown | fight | ko | over
  freeze: 0,            // global pause frames, used for KO punctuation
  frame: 0, countdown: 0,
  stocks: 3, timeLimit: 0, clock: 0,
  slowmo: 0, hitboxDebug: false, training: false,
  onEnd: null, onHitNet: null,

  start(opts) {
    this.stage = opts.stage; this.stocks = opts.stocks;
    this.timeLimit = opts.timeLimit || 0;
    this.clock = this.timeLimit * 60;
    this.training = !!opts.training;
    this.fighters = opts.fighters;
    this.projectiles = [];
    this.frame = 0; this.freeze = 0; this.slowmo = 0;
    this.phase = 'countdown'; this.countdown = 200;
    FX.clear(); Cam.reset(this.stage);
    this.fighters.forEach((f, i) => { f.stocks = this.stocks; f.percent = 0; f.kos = 0; f.falls = 0; f.alive = true; f.spawn(this.stage, i); });
  },

  /* ------------------------------------------------------------ one tick */
  tick() {
    if (this.phase === 'idle' || this.phase === 'over') return;
    if (this.freeze > 0) { this.freeze--; Cam.step(this.fighters, this.stage); FX.step(); return; }

    // sample every controller once per simulation tick
    for (const f of this.fighters) {
      if (f.control.kind === 'cpu') f.pad.update(f.cpu.think(this));
      else if (f.control.kind === 'net') f.pad.update(f.netRaw || { x: 0, y: 0 });
      else f.pad.update(readSource(f.control));
    }

    if (this.phase === 'countdown') {
      this.countdown--;
      for (const f of this.fighters) { f.pad.clear(); f.physics(this); f.collide(this); }
      if (this.countdown === 150) Audio_.play('count');
      if (this.countdown === 100) Audio_.play('count');
      if (this.countdown === 50) Audio_.play('count');
      if (this.countdown <= 0) { this.phase = 'fight'; Audio_.play('go'); Cam.kick(6, 0.03); }
      Cam.step(this.fighters, this.stage);
      return;
    }

    this.frame++;
    if (this.timeLimit > 0) { this.clock--; if (this.clock <= 0) return this.endMatch('time'); }

    for (const f of this.fighters) f.update(this);

    for (let i = this.projectiles.length - 1; i >= 0; i--) {
      const p = this.projectiles[i];
      p.step(this);
      if (!p.dead) {
        for (const f of this.fighters) {
          if (f === p.owner || !f.alive || f.state === 'dead' || f.state === 'respawnWait') continue;
          if (overlap(p.rect(), { x: f.x, y: f.y, w: f.w, h: f.h })) {
            this.resolveHit(p.owner, f, p.move, 1, p);
            p.dead = true; break;
          }
        }
      }
      if (p.dead) this.projectiles.splice(i, 1);
    }

    FX.step();
    Cam.step(this.fighters, this.stage);
    this.checkEnd();
  },

  /* ---------------------------------------------------------- hit resolve */
  resolveHit(att, vic, move, chargeMul = 1, proj = null) {
    if (!move || !vic || vic.state === 'dead') return;
    if (vic.invuln > 0) { FX.ember(vic.cx, vic.cy, '#9AA6B2', 4); return; }

    const dmg = move.d * chargeMul;
    const srcX = proj ? proj.x + proj.w / 2 : att.cx;
    const dirX = (move.both || move.centered || proj) ? (Math.sign(vic.cx - srcX) || att.facing) : att.facing;
    const px = (srcX + vic.cx) / 2, py = (proj ? proj.y + proj.h / 2 : att.cy + move.by * 0.5 + vic.cy) / 2;

    /* --- shield ---------------------------------------------------------- */
    if (vic.shielding) {
      if (vic.shieldT <= CFG.parryWindow) {          // parry: perfect timing is rewarded
        vic.parryFx = 16; vic.shieldStun = 0;
        att.hitstop = CFG.parryFreeze; att.charge = 0; att.move = null; att.setState('idle');
        Audio_.play('parry'); Cam.kick(8, 0.03); Cam.flash = 0.5;
        FX.ring(vic.cx, vic.cy, '#FFFFFF', 130, 20, 8);
        FX.pop(vic.cx, vic.y - 20, 'PARRY!', '#FFFFFF', true);
        return;
      }
      vic.shield -= dmg * 2.3;
      vic.shieldStun = Math.ceil(dmg * CFG.shieldStunPerDmg) + 4;
      vic.vx += dirX * dmg * CFG.shieldPushback * 0.2;
      att.vx -= dirX * dmg * CFG.shieldPushback * 0.3;
      att.hitstop = vic.hitstop = Math.round(Math.min(12, 2 + dmg * 0.4));
      Audio_.play('shield');
      FX.ember(vic.cx + dirX * 24, vic.cy, '#7CF3D0', 8);
      if (vic.shield <= 0) vic.breakShield();
      return;
    }

    /* --- clean hit -------------------------------------------------------- */
    vic.percent = Math.min(999, vic.percent + dmg);
    const kb = knockbackOf(move, vic.percent, vic.char.weight, chargeMul);
    let ang = move.ang * DEG;
    if (move.spike) ang = -Math.abs(ang);

    vic.vx = Math.cos(ang) * kb * dirX;
    vic.vy = -Math.sin(ang) * kb;
    vic.hitstun = Math.ceil(kb * CFG.hitstunPerKb);
    vic.setState(kb > CFG.tumbleKb ? 'tumble' : 'hitstun');
    vic.grounded = false; vic.move = null; vic.charge = 0;
    vic.fastFall = false; vic.hitList.clear();
    vic.flash = 8; vic.squash = 1.3;
    vic.lastHitBy = att.id;
    vic.combo++; vic.comboT = 110;

    const stop = Math.round(Math.min(22, CFG.hitstopBase + dmg * CFG.hitstopPerDmg));
    att.hitstop = stop; vic.hitstop = stop + 2;
    att.combo = 0;

    Audio_.hit(dmg);
    Cam.kick(3 + kb * 0.45, kb * 0.0022);
    FX.spark(px, py, Math.atan2(-vic.vy, vic.vx), dmg * 0.9, dmg >= 12 ? '#FFF4B0' : '#FFFFFF');
    FX.ring(px, py, dmg >= 12 ? PAL.yellow : 'rgba(255,255,255,0.9)', 40 + dmg * 6, 16, 5);
    FX.pop(px, py - 20, `${Math.round(dmg)}`, dmg >= 12 ? PAL.yellow : '#FFFFFF', dmg >= 12);
    if (vic.combo >= 3) FX.pop(vic.cx, vic.y - 44, `${vic.combo} HIT`, PAL.mint);
    if (move.spike && !vic.grounded) FX.pop(vic.cx, vic.cy + 30, 'SPIKE', PAL.danger, true);

    if (this.onHitNet) this.onHitNet(att, vic, move, chargeMul, dirX);
  },

  /* ---------------------------------------------------------------- KO */
  koFighter(f) {
    if (!f.alive || f.state === 'dead' || f.state === 'respawnWait') return;
    const b = (STAGES[this.stage] || STAGES.store).blast;
    const kx = clamp(f.cx, b.l + 60, b.r - 60), ky = clamp(f.cy, b.t + 60, b.b - 60);

    f.falls++; f.combo = 0;
    const killer = this.fighters.find(o => o.id === f.lastHitBy);
    if (killer && killer !== f) killer.kos++;
    if (!this.training) f.stocks--;

    FX.koStars(kx, ky, f.char.color);
    FX.pop(kx, ky - 40, 'K.O.!', '#FFFFFF', true);
    Audio_.play('ko');
    Cam.koFocus(kx, ky); Cam.kick(26, 0.06);
    this.freeze = CFG.koFreeze;
    f.trail.length = 0;

    if (f.stocks <= 0 && !this.training) {
      f.alive = false; f.setState('dead'); f.x = -99999; f.y = -99999;
    } else {
      f.setState('respawnWait'); f.respawnT = 90;
      f.percent = 0; f.vx = 0; f.vy = 0; f.hitstun = 0; f.hitstop = 0;
      f.shield = CFG.shieldMax; f.lastHitBy = null;
    }
  },

  checkEnd() {
    if (this.training) return;
    const alive = this.fighters.filter(f => f.stocks > 0);
    if (this.fighters.length > 1 && alive.length <= 1) this.endMatch('stocks');
    else if (this.fighters.length === 1 && alive.length === 0) this.endMatch('stocks');
  },

  endMatch(reason) {
    if (this.phase === 'over') return;
    this.phase = 'over';
    const rank = [...this.fighters].sort((a, b) =>
      (b.stocks - a.stocks) || (b.kos - a.kos) || (a.falls - b.falls) || (a.percent - b.percent));
    Audio_.play('win');
    if (this.onEnd) this.onEnd(rank, reason);
  },

  /* ------------------------------------------------------------- render */
  render(ctx) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, VIEW_W, VIEW_H);
    drawBackground(ctx, this.stage, Cam, performance.now());

    ctx.save();
    Cam.apply(ctx);
    drawPlatforms(ctx, this.stage);

    // respawn platforms
    for (const f of this.fighters) {
      if (f.state !== 'respawnWait') continue;
      ctx.fillStyle = 'rgba(0,163,173,0.35)';
      ctx.beginPath(); ctx.roundRect(f.cx - 52, f.y + f.h, 104, 10, 5); ctx.fill();
      ctx.strokeStyle = 'rgba(124,243,208,0.8)'; ctx.lineWidth = 2; ctx.stroke();
    }

    for (const p of this.projectiles) drawProjectile(ctx, p);
    for (const f of this.fighters) drawFighter(ctx, f);
    FX.draw(ctx);

    if (this.hitboxDebug) {
      for (const f of this.fighters) {
        ctx.strokeStyle = 'rgba(80,255,140,0.9)'; ctx.lineWidth = 2;
        ctx.strokeRect(f.x, f.y, f.w, f.h);
        if (f.state === 'attack' && f.move && f.moveT >= f.move.s && f.moveT < f.move.s + f.move.a) {
          const r = f.hitRect();
          ctx.strokeStyle = 'rgba(255,70,70,0.95)'; ctx.fillStyle = 'rgba(255,70,70,0.18)';
          ctx.fillRect(r.x, r.y, r.w, r.h); ctx.strokeRect(r.x, r.y, r.w, r.h);
        }
      }
    }
    ctx.restore();

    if (Cam.flash > 0.01) {
      ctx.fillStyle = `rgba(255,255,255,${Cam.flash * 0.75})`;
      ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    }

    this.drawOffscreen(ctx);
    this.drawHUD(ctx);
    if (this.phase === 'countdown') this.drawCountdown(ctx);
  },

  drawOffscreen(ctx) {
    for (const f of this.fighters) {
      if (!f.alive || f.state === 'dead' || f.state === 'respawnWait') continue;
      const s = Cam.toScreen(f.cx, f.cy);
      const pad = 46;
      if (s.x > pad && s.x < VIEW_W - pad && s.y > pad && s.y < VIEW_H - pad) continue;
      const x = clamp(s.x, pad, VIEW_W - pad), y = clamp(s.y, pad, VIEW_H - pad);
      const b = (STAGES[this.stage] || STAGES.store).blast;
      const near = clamp(Math.max(
        1 - (f.cx - b.l) / 300, 1 - (b.r - f.cx) / 300,
        1 - (f.cy - b.t) / 300, 1 - (b.b - f.cy) / 300), 0, 1);
      ctx.save();
      ctx.translate(x, y);
      ctx.fillStyle = 'rgba(6,8,12,0.86)';
      ctx.beginPath(); ctx.arc(0, 0, 26, 0, TWO_PI); ctx.fill();
      ctx.strokeStyle = near > 0.55 ? PAL.danger : SLOT_COLORS[f.slot % 4];
      ctx.lineWidth = 3 + near * 3; ctx.stroke();
      ctx.fillStyle = '#EEF3F8';
      ctx.font = '900 12px "Segoe UI", system-ui, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(f.char.tag.slice(0, 4), 0, 1);
      const ang = Math.atan2(s.y - VIEW_H / 2, s.x - VIEW_W / 2);
      ctx.rotate(ang); ctx.fillStyle = ctx.strokeStyle;
      ctx.beginPath(); ctx.moveTo(34, 0); ctx.lineTo(24, -8); ctx.lineTo(24, 8); ctx.fill();
      ctx.restore();
    }
  },

  drawHUD(ctx) {
    const n = this.fighters.length;
    const cardW = Math.min(240, 1080 / n), gap = 16;
    const totalW = n * cardW + (n - 1) * gap;
    let x = (VIEW_W - totalW) / 2;
    const y = VIEW_H - 104;

    for (const f of this.fighters) {
      const col = SLOT_COLORS[f.slot % 4];
      const out = f.stocks <= 0 && !this.training;
      ctx.save();
      ctx.globalAlpha = out ? 0.32 : 1;
      // angled card, matching the arcade panel language of the menus
      ctx.beginPath();
      ctx.moveTo(x + 14, y); ctx.lineTo(x + cardW, y);
      ctx.lineTo(x + cardW - 14, y + 88); ctx.lineTo(x, y + 88); ctx.closePath();
      ctx.fillStyle = 'rgba(8,10,14,0.88)'; ctx.fill();
      ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.stroke();
      ctx.fillStyle = col; ctx.fillRect(x + 12, y + 2, cardW - 26, 4);

      ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      ctx.font = '900 13px "Segoe UI", system-ui, sans-serif';
      ctx.fillStyle = '#9BA7B4';
      ctx.fillText(f.char.tag, x + 16, y + 12);
      ctx.fillStyle = '#E8EDF2';
      ctx.fillText(f.name.slice(0, 12), x + 16, y + 28);

      // percent, colour-ramped and scaled by how close to death you are
      const pct = Math.floor(f.percent);
      const dangerT = clamp(pct / 150, 0, 1);
      const pc = pct >= 120 ? '#FF4C4C' : pct >= 70 ? '#FF9A3C' : pct >= 35 ? PAL.yellow : '#FFFFFF';
      const shake = f.flash > 0 ? f.flash * 0.6 : 0;
      ctx.save();
      ctx.translate(x + cardW - 24 + rand(-shake, shake), y + 46 + rand(-shake, shake));
      ctx.font = `italic 900 ${34 + dangerT * 10}px "Arial Black", Impact, sans-serif`;
      ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,0.8)';
      ctx.strokeText(pct + '%', 0, 0);
      ctx.fillStyle = pc; ctx.fillText(pct + '%', 0, 0);
      ctx.restore();

      // stocks
      for (let i = 0; i < Math.max(0, f.stocks); i++) {
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.arc(x + 20 + i * 15, y + 74, 5.5, 0, TWO_PI); ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 1.5; ctx.stroke();
      }
      // shield meter
      const sw = cardW - 90;
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.fillRect(x + cardW - 26 - sw, y + 70, sw, 6);
      ctx.fillStyle = f.shield > 30 ? PAL.teal : PAL.danger;
      ctx.fillRect(x + cardW - 26 - sw, y + 70, sw * (f.shield / CFG.shieldMax), 6);
      ctx.restore();
      x += cardW + gap;
    }

    if (this.timeLimit > 0) {
      const s = Math.max(0, Math.ceil(this.clock / 60));
      ctx.font = 'italic 900 34px "Arial Black", Impact, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(0,0,0,0.8)';
      const txt = `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
      ctx.strokeText(txt, VIEW_W / 2, 18);
      ctx.fillStyle = s <= 10 ? PAL.danger : '#E8EDF2';
      ctx.fillText(txt, VIEW_W / 2, 18);
    }
  },

  drawCountdown(ctx) {
    const t = this.countdown;
    let label = null, sub = null;
    if (t > 150) { label = '3'; } else if (t > 100) { label = '2'; }
    else if (t > 50) { label = '1'; } else { label = 'FIGHT!'; sub = true; }
    const seg = sub ? (50 - t) / 50 : ((t % 50) / 50);
    const pop = sub ? easeOutBack(clamp((50 - t) / 14, 0, 1)) : easeOutBack(clamp(1 - seg, 0, 1));
    ctx.save();
    ctx.translate(VIEW_W / 2, VIEW_H / 2 - 40);
    ctx.scale(pop * 1.1, pop * 1.1);
    ctx.font = `italic 900 ${sub ? 96 : 130}px "Arial Black", Impact, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 12; ctx.strokeStyle = 'rgba(0,0,0,0.85)'; ctx.strokeText(label, 0, 0);
    ctx.fillStyle = sub ? PAL.yellow : '#FFFFFF'; ctx.fillText(label, 0, 0);
    ctx.restore();
    ctx.font = '900 15px "Segoe UI", system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(232,237,242,0.55)';
    ctx.fillText((STAGES[this.stage] || STAGES.store).name.toUpperCase(), VIEW_W / 2, VIEW_H / 2 + 70);
  },
};
/* ============================ 11. NETWORK ===============================
   Firebase is imported dynamically inside a try/catch, so a blocked CDN or
   an offline laptop degrades to local play instead of a blank screen.
   Remote fighters are rendered from a small snapshot buffer ~110ms in the
   past and interpolated, which removes the 25Hz stutter of the original. */

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBpZobZLNhYvoDcGovyG1gCRWn8_eaQZJY",
  authDomain: "superoptusbros.firebaseapp.com",
  databaseURL: "https://superoptusbros-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "superoptusbros",
  storageBucket: "superoptusbros.firebasestorage.app",
  messagingSenderId: "931164256258",
  appId: "1:931164256258:web:fbe51deaac48f6f5f0cf1b"
};

const Net = {
  ok: false, api: null, db: null,
  roomId: null, myId: 'P_' + Math.random().toString(36).slice(2, 7).toUpperCase(),
  isHost: false, username: 'PLAYER',
  players: {}, roomState: null,
  unsub: null, unsubRooms: null,
  onRooms: null, onRoom: null, onStart: null, onLobbyReturn: null,
  lastSend: 0, sendEvery: 45,
  buffers: {},           // netId -> [{t, snap}]
  seenHit: 0,

  async connect() {
    if (this.ok) return true;
    try {
      const [appMod, dbMod] = await Promise.all([
        import("https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js"),
        import("https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js"),
      ]);
      this.api = dbMod;
      this.db = dbMod.getDatabase(appMod.initializeApp(FIREBASE_CONFIG));
      this.ok = true;
      return true;
    } catch (e) {
      console.warn('[net] offline —', e && e.message);
      this.ok = false;
      return false;
    }
  },

  r(path) { return this.api.ref(this.db, path); },

  watchRooms(cb) {
    if (!this.ok) return;
    this.onRooms = cb;
    if (this.unsubRooms) this.unsubRooms();
    this.unsubRooms = this.api.onValue(this.r('rooms'), snap => {
      const rooms = snap.val() || {};
      const list = [];
      for (const id in rooms) {
        const r = rooms[id];
        if (!r.state || r.state.status !== 'lobby') continue;
        const ps = r.players || {};
        let host = '—';
        for (const pid in ps) if (ps[pid].isHost) host = ps[pid].username;
        list.push({ id, host, count: Object.keys(ps).length, stage: r.state.stage });
      }
      cb(list);
    });
  },

  async createRoom(username, char) {
    this.username = username; this.isHost = true;
    this.roomId = Math.random().toString(36).slice(2, 6).toUpperCase();
    await this.api.set(this.r(`rooms/${this.roomId}/state`),
      { status: 'lobby', stage: 'store', stocks: 3, host: this.myId });
    this.api.onDisconnect(this.r(`rooms/${this.roomId}`)).remove();
    return this.attach(char);
  },

  async joinRoom(code, username, char) {
    this.username = username; this.isHost = false;
    const snap = await this.api.get(this.r(`rooms/${code}`));
    if (!snap.exists()) return { error: 'No room with that code.' };
    const players = snap.val().players || {};
    if (Object.keys(players).length >= 4) return { error: 'That room is full.' };
    if (snap.val().state && snap.val().state.status !== 'lobby') return { error: 'That match already started.' };
    this.roomId = code;
    return this.attach(char);
  },

  async attach(char) {
    const me = this.r(`rooms/${this.roomId}/players/${this.myId}`);
    await this.api.set(me, {
      username: this.username, char, isHost: this.isHost,
      x: 600, y: 200, vx: 0, vy: 0, facing: 1, state: 'air',
      percent: 0, stocks: 3, shield: 100, moveKey: '', moveT: 0, t: Date.now(),
    });
    this.api.onDisconnect(me).remove();

    if (this.unsub) this.unsub();
    this.unsub = this.api.onValue(this.r(`rooms/${this.roomId}`), snap => {
      const data = snap.val();
      if (!data) { if (this.onRoom) this.onRoom(null); return; }
      this.roomState = data.state || null;
      this.players = data.players || {};

      // buffer remote snapshots for interpolation
      const now = performance.now();
      for (const pid in this.players) {
        if (pid === this.myId) continue;
        const p = this.players[pid];
        (this.buffers[pid] = this.buffers[pid] || []).push({ t: now, s: p });
        if (this.buffers[pid].length > 24) this.buffers[pid].shift();
      }
      const mine = this.players[this.myId];
      if (mine && mine.lastHit && mine.lastHit.t > this.seenHit) {
        this.seenHit = mine.lastHit.t;
        if (this.onIncomingHit) this.onIncomingHit(mine.lastHit);
      }
      if (this.onRoom) this.onRoom(data);
      if (this.roomState && this.roomState.status === 'playing' && this.onStart) this.onStart(this.roomState);
      if (this.roomState && this.roomState.status === 'lobby' && this.onLobbyReturn) this.onLobbyReturn();
    });
    return { ok: true, code: this.roomId };
  },

  setChar(char) { if (this.roomId) this.api.update(this.r(`rooms/${this.roomId}/players/${this.myId}`), { char }); },
  setRoomState(patch) { if (this.roomId && this.isHost) this.api.update(this.r(`rooms/${this.roomId}/state`), patch); },

  send(f) {
    const now = performance.now();
    if (now - this.lastSend < this.sendEvery) return;
    this.lastSend = now;
    if (!this.roomId) return;
    this.api.update(this.r(`rooms/${this.roomId}/players/${this.myId}`), {
      x: Math.round(f.x), y: Math.round(f.y),
      vx: +f.vx.toFixed(1), vy: +f.vy.toFixed(1),
      facing: f.facing, state: f.state, percent: Math.round(f.percent),
      stocks: f.stocks, shield: Math.round(f.shield),
      moveKey: f.moveKey || '', moveT: f.moveT | 0, invuln: f.invuln | 0,
      char: f.charId, t: Date.now(),
    });
  },

  sendHit(netId, move, chargeMul, dirX, attackerChar) {
    if (!this.roomId) return;
    this.api.update(this.r(`rooms/${this.roomId}/players/${netId}/lastHit`), {
      d: move.d * chargeMul, kb: move.kb, kg: move.kg, ang: move.ang,
      spike: !!move.spike, dirX, from: this.myId, t: Date.now(),
    });
  },

  /* position of a remote fighter, ~110ms in the past and interpolated */
  sample(netId) {
    const buf = this.buffers[netId];
    if (!buf || !buf.length) return null;
    const target = performance.now() - CFG.netInterpDelay;
    if (buf.length === 1 || buf[0].t >= target) return buf[buf.length - 1].s;
    let a = buf[0], b = buf[buf.length - 1];
    for (let i = 0; i < buf.length - 1; i++) {
      if (buf[i].t <= target && buf[i + 1].t >= target) { a = buf[i]; b = buf[i + 1]; break; }
    }
    const span = Math.max(1, b.t - a.t), k = clamp((target - a.t) / span, 0, 1);
    return {
      ...b.s,
      x: lerp(a.s.x ?? 0, b.s.x ?? 0, k),
      y: lerp(a.s.y ?? 0, b.s.y ?? 0, k),
    };
  },

  leave() {
    try {
      if (this.unsub) { this.unsub(); this.unsub = null; }
      if (this.roomId && this.ok) {
        if (this.isHost) this.api.remove(this.r(`rooms/${this.roomId}`));
        else this.api.remove(this.r(`rooms/${this.roomId}/players/${this.myId}`));
      }
    } catch (e) { /* leaving is best-effort */ }
    this.roomId = null; this.isHost = false; this.players = {}; this.buffers = {};
  },
};

/* Remote fighters are display-only: their transform comes from the network,
   but they still carry a hurtbox so local attacks can connect. */
Fighter.prototype.netApply = function () {
  const s = Net.sample(this.netId);
  if (!s) return;
  this.x = lerp(this.x, s.x, 0.5); this.y = lerp(this.y, s.y, 0.5);
  this.facing = s.facing || 1;
  this.percent = s.percent || 0;
  this.stocks = s.stocks ?? this.stocks;
  this.shield = s.shield ?? CFG.shieldMax;
  this.invuln = s.invuln || 0;
  this.state = s.state || 'idle';
  this.moveKey = s.moveKey || '';
  this.move = this.moveKey ? this.char.moves[this.moveKey] : null;
  this.moveT = s.moveT || 0;
  this.grounded = ['idle', 'walk', 'run', 'shield', 'jumpsquat'].includes(this.state);
  this.stateT++;
  this.alive = this.stocks > 0;
  if (s.char && s.char !== this.charId) { this.charId = s.char; this.char = charOf(s.char); }
};

/* ---- building a match -------------------------------------------------- */
function controlFor(type) {
  if (type === 'p1') return IS_TOUCH ? { kind: 'touch' } : { kind: 'key', scheme: 'p1' };
  if (type === 'p2') return { kind: 'key', scheme: 'p2' };
  if (type === 'pad0') return { kind: 'pad', index: 0 };
  if (type === 'pad1') return { kind: 'pad', index: 1 };
  return { kind: 'cpu' };
}

function startLocalMatch() {
  Game.localFighter = null;
  const fighters = [];
  let slot = 0;
  Game.slots.forEach((s, i) => {
    if (s.type === 'off') return;
    const f = new Fighter('L' + i, {
      charId: s.char, name: s.name || `P${i + 1}`, slot: slot++,
      control: controlFor(s.type), stocks: Game.stocks,
    });
    if (s.type === 'cpu') { f.cpu = new CPU(f, s.cpu); f.control = { kind: 'cpu' }; }
    else if (!Game.localFighter) Game.localFighter = f;
    fighters.push(f);
  });
  World.training = Game.flavour === 'training';
  World.onHitNet = null;
  World.start({ stage: Game.stage, stocks: Game.stocks, timeLimit: Game.timeLimit,
    fighters, training: Game.flavour === 'training' });
  enterMatch();
}

function startOnlineMatch(state) {
  Game.stage = state.stage; Game.stocks = state.stocks;
  const fighters = [];
  const ids = Object.keys(Net.players);
  ids.forEach((pid, i) => {
    const p = Net.players[pid];
    const mine = pid === Net.myId;
    const f = new Fighter(pid, {
      charId: p.char || 'ollie', name: p.username || 'PLAYER', slot: i,
      control: mine ? controlFor('p1') : { kind: 'net' }, stocks: state.stocks,
    });
    f.remote = !mine; f.netId = pid;
    if (mine) Game.localFighter = f;
    fighters.push(f);
  });
  World.onHitNet = (att, vic, move, chargeMul, dirX) => {
    if (vic.remote) Net.sendHit(vic.netId, move, chargeMul, dirX);
  };
  Net.onIncomingHit = h => {
    const me = Game.localFighter; if (!me) return;
    World.resolveHit({ cx: me.cx - h.dirX * 60, cy: me.cy, facing: h.dirX, id: h.from,
      char: me.char, combo: 0, hitstop: 0, vx: 0, charge: 0 },
      me, { d: h.d, kb: h.kb, kg: h.kg, ang: h.ang, spike: h.spike, by: 0 }, 1);
  };
  World.start({ stage: state.stage, stocks: state.stocks, timeLimit: 0, fighters });
  enterMatch();
}

function enterMatch() {
  Game.mode = 'match';
  hideMenus();
  $('#hud-quit').style.display = 'block';
  if (IS_TOUCH) $('#touch').classList.add('on');
}

World.onEnd = (rank, reason) => {
  setTimeout(() => {
    Game.mode = 'menu';
    $('#hud-quit').style.display = 'none';
    $('#touch').classList.remove('on');
    const rows = rank.map((f, i) => `
      <li style="--c:${SLOT_COLORS[f.slot % 4]}">
        <b>${i + 1}</b>
        <span class="rn">${f.name}</span>
        <span class="rc">${f.char.name}</span>
        <span class="rk">${f.kos} KO</span>
        <span class="rf">${f.falls} falls</span>
      </li>`).join('');
    $('#results-list').innerHTML = rows;
    $('#results-title').textContent = reason === 'time' ? 'TIME!' : `${rank[0].name} WINS`;
    show('results');
  }, 1400);
};

/* ---- pause -------------------------------------------------------------- */
function togglePause(force) {
  if (Game.mode === 'menu' || Game.flavour === 'online') return;
  const p = force !== undefined ? force : Game.mode !== 'paused';
  Game.mode = p ? 'paused' : 'match';
  $('#pause').classList.toggle('on', p);
}
window.addEventListener('keydown', e => {
  if (e.code === 'Escape' || e.code === 'KeyP') { if (Game.mode !== 'menu') togglePause(); }
  if (e.code === 'KeyH' && Game.mode !== 'menu') World.hitboxDebug = !World.hitboxDebug;
});

function quitToMenu() {
  Game.mode = 'menu'; World.phase = 'idle';
  Game.localFighter = null;
  $('#hud-quit').style.display = 'none';
  $('#touch').classList.remove('on');
  $('#pause').classList.remove('on');
  if (Game.flavour === 'online') { Net.leave(); show('online'); }
  else show('setup');
}

/* ---- main loop ---------------------------------------------------------- */
const STEP = 1 / 60;
let acc = 0, last = performance.now();

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.2, (now - last) / 1000);
  last = now;

  if (Game.mode === 'menu') {
    if ($('#screen-setup').classList.contains('on')) renderThumbs(now);
    drawIdleBackdrop(now);
    return;
  }
  if (Game.mode === 'paused') { World.render(ctx); return; }

  acc += dt;
  let steps = 0;
  // fixed timestep: the sim now runs identically on 60Hz and 144Hz displays
  while (acc >= STEP && steps < 5) { World.tick(); acc -= STEP; steps++; }
  if (steps === 5) acc = 0;

  if (Game.flavour === 'online' && Game.localFighter && World.phase === 'fight') {
    Net.send(Game.localFighter);
    for (const f of World.fighters) if (f.remote) f.netApply();
  }
  World.render(ctx);
}

function drawIdleBackdrop(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  drawBackground(ctx, Game.stage, { x: 640 + Math.sin(t / 4000) * 120, y: 360 }, t);
  ctx.fillStyle = 'rgba(5,7,10,0.55)'; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
}

/* ---- wiring ------------------------------------------------------------- */
function wire() {
  bindTouchControls(document.getElementById('touch'));
  buildRoster(); buildStages(); renderSlots();

  $('#btn-solo').onclick = () => {
    Game.flavour = 'solo';
    Game.slots[0].type = 'p1'; Game.slots[1].type = 'cpu';
    $('#setup-mode').textContent = 'Solo · vs CPU';
    renderSlots(); markRoster(); show('setup');
  };
  $('#btn-local').onclick = () => {
    Game.flavour = 'local';
    Game.slots[0].type = 'p1'; Game.slots[1].type = IS_TOUCH ? 'cpu' : 'p2';
    $('#setup-mode').textContent = 'Local versus · same device';
    renderSlots(); markRoster(); show('setup');
  };
  $('#btn-training').onclick = () => {
    Game.flavour = 'training';
    Game.slots[0].type = 'p1'; Game.slots[1].type = 'cpu'; Game.slots[1].cpu = 1;
    $('#setup-mode').textContent = 'Training · no stock loss, H toggles hitboxes';
    renderSlots(); markRoster(); show('setup');
  };
  $('#btn-online').onclick = async () => {
    Game.flavour = 'online';
    show('online');
    $('#net-status').textContent = 'Connecting…';
    const ok = await Net.connect();
    $('#net-status').textContent = ok ? 'Connected' : 'Offline — online play is unavailable right now.';
    $('#online-body').classList.toggle('dim', !ok);
    if (ok) Net.watchRooms(renderRooms);
  };

  $$('[data-back]').forEach(b => b.onclick = () => {
    if (Game.flavour === 'online') Net.leave();
    Game.flavour = 'solo'; show('title');
  });

  $('#stocks').onchange = e => {
    Game.stocks = +e.target.value;
    if (Game.flavour === 'online') Net.setRoomState({ stocks: Game.stocks });
  };
  $('#timer').onchange = e => { Game.timeLimit = +e.target.value; };

  $('#btn-fight').onclick = () => {
    if ($('#btn-fight').classList.contains('off')) return;
    Audio_.boot();
    if (Game.flavour === 'online') Net.setRoomState({ status: 'playing', stage: Game.stage, stocks: Game.stocks });
    else startLocalMatch();
  };

  $('#hud-quit').onclick = quitToMenu;
  $('#btn-resume').onclick = () => togglePause(false);
  $('#btn-restart').onclick = () => { togglePause(false); Game.localFighter = null; startLocalMatch(); };
  $('#btn-pquit').onclick = quitToMenu;
  $('#btn-rematch').onclick = () => {
    Game.localFighter = null;
    if (Game.flavour === 'online') { show('setup'); }
    else startLocalMatch();
  };
  $('#btn-rechar').onclick = () => show('setup');
  $('#btn-rtitle').onclick = () => { if (Game.flavour === 'online') Net.leave(); show('title'); };

  $('#btn-sound').onclick = e => {
    const on = Audio_.toggle();
    e.target.textContent = on ? 'Sound on' : 'Sound off';
    e.target.classList.toggle('off', !on);
  };

  // ---- online lobby
  $('#btn-create').onclick = async () => {
    const name = ($('#username').value || '').trim().toUpperCase();
    if (!name) return netErr('Enter a name first.');
    netErr('');
    const res = await Net.createRoom(name, Game.slots[0].char);
    if (res && res.code) enterOnlineRoom(res.code);
  };
  $('#btn-join').onclick = async () => {
    const name = ($('#username').value || '').trim().toUpperCase();
    const code = ($('#roomcode').value || '').trim().toUpperCase();
    if (!name) return netErr('Enter a name first.');
    if (code.length !== 4) return netErr('Room codes are four characters.');
    netErr('');
    const res = await Net.joinRoom(code, name, Game.slots[0].char);
    if (res.error) return netErr(res.error);
    enterOnlineRoom(code);
  };

  Net.onRoom = data => {
    if (!data) { netErr('The host closed the room.'); Net.leave(); show('online'); return; }
    if (Game.flavour === 'online') {
      renderSlots();
      if (data.state) {
        Game.stage = data.state.stage || Game.stage;
        Game.stocks = data.state.stocks || Game.stocks;
        markStages(); $('#stocks').value = String(Game.stocks);
      }
    }
  };
  Net.onStart = state => { if (Game.mode === 'menu' && Game.flavour === 'online') startOnlineMatch(state); };
}

function netErr(msg) { $('#net-error').textContent = msg || ''; }

function enterOnlineRoom(code) {
  $('#setup-mode').textContent = `Online · room ${code}`;
  $('#roster').classList.remove('locked');
  renderSlots(); markRoster(); markStages(); show('setup');
}

function renderRooms(list) {
  const el = $('#rooms');
  if (!list.length) { el.innerHTML = `<p class="empty">No open rooms. Create one and share the code.</p>`; return; }
  el.innerHTML = list.map(r => `<button class="room" data-code="${r.id}">
      <b>${r.host}'s room</b><span>${STAGES[r.stage] ? STAGES[r.stage].name : '—'}</span>
      <i>${r.count}/4</i><code>${r.id}</code></button>`).join('');
  $$('#rooms .room').forEach(b => b.onclick = () => {
    $('#roomcode').value = b.dataset.code; $('#btn-join').click();
  });
}

wire();
show('title');
requestAnimationFrame(frame);

</script>
</body>
</html>
