  }
  function overrideHTML(scored) {
    const rows = scored.filter((o) => (o.tier === 'N' || o.override) && (o.rejects || []).length).map((o) => `<div class="r"><span><b>${esc(o.name)}</b> <span class="muted small">tried:</span> ${o.rejects.slice(-4).map((r) => `<button class="btn sm ghost" data-ov="${esc(o.who)}" data-raw="${esc(r)}">${esc(r)}</button>`).join(' ')}</span></div>`).join('');
    return rows ? `<div class="eyebrow" style="margin-top:14px">Manager Override — accept a disputed answer for this room only (Dead Zone)</div><div class="rej-list">${rows}</div>` : '';
  }

  /* ───────── Pass-and-play ───────── */
  function ppSetup() {
    const names = PP ? PP.players.map((p) => p.name) : ['', '', ''];
    const rows = (ns) => ns.map((n, i) => `<div class="row"><input class="grow pp-name" maxlength="12" value="${esc(n)}" placeholder="Player ${i + 1}" style="font-size:16px;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:rgba(2,16,23,.7);color:var(--foam)"><button class="iconbtn" data-rm="${i}" aria-label="Remove player">✕</button></div>`).join('');
    Meta.frame('Pass-and-play', `<div class="panel pad list">
      <div class="eyebrow">Players (2–12)</div><div class="list" id="pp-names">${rows(names)}</div>
      <button class="btn sm ghost" id="pp-add">+ Add player</button>
      <label class="field">Pack<select id="pp-pack">${packOptions(PP && PP.pack)}</select></label>
      <label class="field">Timer<select id="pp-timer"><option value="20">20 s</option><option value="30" selected>30 s</option><option value="40">40 s</option></select></label>
      <div class="btn-row"><button class="btn primary" id="pp-go">START SHOWDOWN</button></div></div>`, menu);
    const current = () => $$('.pp-name').map((i) => i.value);
    const rebind = () => { $$('[data-rm]').forEach((b) => (b.onclick = () => { const ns = current(); if (ns.length <= 2) return; ns.splice(+b.dataset.rm, 1); $('#pp-names').innerHTML = rows(ns); rebind(); })); };
    rebind();
    $('#pp-add').onclick = () => { const ns = current(); if (ns.length >= 12) return; ns.push(''); $('#pp-names').innerHTML = rows(ns); rebind(); $$('.pp-name').pop().focus(); };
    $('#pp-go').onclick = () => {
      const ns = current().map((n, i) => cleanName(n) || 'Player ' + (i + 1));
      if (ns.length < 2) return UI.toast('Need at least 2 players.');
      const pack = $('#pp-pack').value, prompts = pickPrompts(pack, 7);
      if (!prompts.length) return UI.toast('No prompts available in that pack yet.');
      PP = { players: ns.map((name, i) => ({ who: 'p' + i, name, score: 0, last: null })), pack, timer: +$('#pp-timer').value, prompts, round: 0, crossed: false };
      Sfx.unlock(); ppRound();
    };
  }
  async function ppRound() {
    const pid = PP.prompts[PP.round], p = Data.prompt(pid), answers = [];
    for (let i = 0; i < PP.players.length; i++) {
      const pl = PP.players[i];
      const skipped = await passScreen(pl.name, i === 0, `Round ${PP.round + 1} of ${PP.prompts.length}`);
      if (skipped) { const more = pickPrompts(PP.pack, 30).filter((id) => !PP.prompts.includes(id)); if (more.length) { PP.prompts[PP.round] = more[0]; UI.toast('Prompt skipped.'); } return ppRound(); }
      const res = await Round.start({ p, hudLeft: 'Showdown · ' + pl.name, eyebrow: `ROUND ${PP.round + 1} OF ${PP.prompts.length}`, count: `${i + 1} / ${PP.players.length}`, pips: PP.prompts.map((_, k) => k < PP.round ? 'done' : k === PP.round ? 'now' : ''),
        clock: { left: PP.timer, max: PP.timer, penalty: CONFIG.WRONG_PENALTY, floor: 2 }, relaxed: false, hideBoost: true, introMs: 500 });
      answers.push({ who: pl.who, name: pl.name, id: res.kind === 'correct' ? res.m.id : null, key: res.kind === 'correct' ? res.m.key : null, raw: res.raw || null, rejects: res.rejects.map((x) => x.raw) });
      Sfx.click();
      await lockedIn(pl.name, i + 1 < PP.players.length ? PP.players[i + 1].name : null);
    }
    const { [pid]: { snap } } = await Game.ensureSnapsFor([pid]);
    PP.answers = answers; PP.snap = snap; PP.p = p;
    await ppReveal();
  }
  function passScreen(name, firstOfRound, sub) {
    return new Promise((resolve) => {
      Meta.frame('Pass-and-play', `<div class="panel pad center" style="margin-top:8vh">
        <div class="eyebrow">${esc(sub)}</div><div style="font-size:54px;margin-top:10px">🙈</div>
        <h2 style="font-family:var(--display);font-size:clamp(26px,7vw,40px);margin-top:6px">Pass to ${esc(name)}</h2>
        <p class="muted">Everyone else, look away.</p>
        <div class="btn-row"><button class="btn primary" id="ps-go">I'M ${esc(name.toUpperCase())} — READY</button></div>
        ${firstOfRound ? '<div class="btn-row"><button class="btn sm ghost" id="ps-skip">Host: skip this prompt</button></div>' : ''}
      </div>`, () => { if (confirm('Quit this Showdown?')) Game.title(); });
      $('#ps-go').onclick = () => resolve(false);
      if ($('#ps-skip')) $('#ps-skip').onclick = () => resolve(true);
    });
  }
  function lockedIn(name, nextName) {
    return new Promise((resolve) => {
      Meta.frame('Pass-and-play', `<div class="panel pad center" style="margin-top:8vh"><div style="font-size:48px">🔒</div><h2 style="font-family:var(--display);margin-top:8px">Locked in.</h2>
        <p class="muted">${nextName ? `Pass it on to <b>${esc(nextName)}</b>. No peeking.` : 'Everyone has answered. Gather round for the reveal.'}</p>
        <div class="btn-row"><button class="btn teal" id="li-go">${nextName ? 'Pass it on →' : 'REVEAL ANSWERS'}</button></div></div>`, () => {});
      $('#m-back').style.visibility = 'hidden';
      $('#li-go').onclick = () => resolve();
    });
  }
  async function ppReveal() {
    const { p, snap } = PP;
    const scored = scoreRound(p, snap, PP.answers);
    if (scored.some((o) => o.crossed)) { PP.crossed = true; Game.award('crossed-lines'); }
    await playReveal(p, snap, revealGroups(p, snap, scored), `Round ${PP.round + 1} reveal`);
    PP.scored = scored;
    ppScoreboard();
  }
  function ppScoreboard() {
    const scored = PP.scored;
    PP.players.forEach((pl) => { const o = scored.find((x) => x.who === pl.who); pl.last = o ? o.pts : 0; });
    const totals = PP.players.map((pl) => Object.assign({}, pl, { score: pl.score + pl.last }));
    const last = PP.round + 1 >= PP.prompts.length;
    const optName = PP.p.X ? (PP.p.X.via ? PP.p.X.a : Data.display(PP.p, PP.snap.optId >= 0 ? PP.snap.optId : PP.p.X.i)) : null;
    Meta.frame(`Round ${PP.round + 1} scores`, `<div class="panel pad">${standingsHTML(totals)}
      ${optName ? `<div class="opt-card"><div class="h">🛰️ ONE IN AN OPTILLION</div><div class="a">${esc(optName)}</div><div class="f">${esc(PP.p.X.fact)}</div></div>` : ''}
      ${overrideHTML(scored)}
      <div class="btn-row"><button class="btn primary" id="sb-next">${last ? 'EMPLOYEE OF THE MONTH →' : 'NEXT ROUND →'}</button></div></div>`, () => { if (confirm('Quit this Showdown?')) Game.title(); });
    $$('[data-ov]').forEach((b) => (b.onclick = () => {
      const a = PP.answers.find((x) => x.who === b.dataset.ov); a.override = b.dataset.raw; a.id = null;
      PP.scored = scoreRound(PP.p, PP.snap, PP.answers); UI.toast(`Manager Override: “${esc(b.dataset.raw)}” accepted for this room.`); ppScoreboard();
    }));
    $('#sb-next').onclick = () => {
      PP.players.forEach((pl) => { pl.score += pl.last; pl.last = null; });
      PP.round++;
      if (PP.round >= PP.prompts.length) return podium(PP.players, () => { PP.players.forEach((pl) => (pl.score = 0)); PP.prompts = pickPrompts(PP.pack, 7); PP.round = 0; ppRound(); });
      ppRound();
    };
  }

  /* ───────── Online host ───────── */
  async function loadQR() { if (window.QRCode) return true; try { await new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js'; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); return true; } catch (e) { return false; } }
  async function hostCreate() {
    Meta.frame('Store Showdown', `<div class="panel pad center"><p>Your call is important to us. You are caller number 3.</p></div>`, menu);
    Sfx.holdStart();
    const ok = await Net.start(); Sfx.holdStop();
    if (!ok || !Net.rooms) { Meta.frame('Store Showdown', `<div class="panel pad center"><p>Couldn't reach the network for rooms.</p><p class="muted small">Online Showdown needs a Firebase config with a Realtime Database (databaseURL). Pass-and-play works offline.</p><div class="btn-row"><button class="btn" id="go-pp">Pass-and-play instead</button></div></div>`, menu); $('#go-pp').onclick = ppSetup; return; }
    let code = '';
    for (let tries = 0; tries < 8; tries++) {
      code = Array.from({ length: 4 }, () => CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]).join('');
      const snap = await Net.room(code).once('value'); if (!snap.exists() || (snap.val().createdAt || 0) < Date.now() - 6 * 3600e3) break;
    }
    HOST = { code, ref: Net.room(code), players: {}, pack: '', timer: 30, prompts: [], round: -1, totals: {} };
    await HOST.ref.set({ host: Net.uid, state: 'lobby', round: -1, createdAt: Net.TS(), settings: { pack: '', timer: 30 } });
    HOST.ref.onDisconnect().update({ state: 'closed' });
    HOST.ref.child('players').on('value', (s) => { HOST.players = s.val() || {}; if (HOST.view === 'lobby') hostLobby(); if (HOST.view === 'round') hostRoundPaint(); });
    HOST.ref.child('answers').on('value', (s) => { HOST.answers = s.val() || {}; if (HOST.view === 'round') hostRoundPaint(); });
    hostLobby();
  }
  function joinURL(code) { return location.origin + location.pathname + '?join=' + code; }
  async function hostLobby() {
    HOST.view = 'lobby';
    const pls = Object.entries(HOST.players);
    if (!$('#host-lobby')) {
      Meta.frame('Store Showdown — Host', `<div id="host-lobby" class="panel pad center">
        <div class="eyebrow">Join on your phone with code</div><div class="code-big">${HOST.code}</div>
        <div class="qr" id="qr"></div><div class="small muted" style="margin-top:6px;word-break:break-all">${esc(joinURL(HOST.code))}</div>
        <div class="players" id="hl-players"></div>
        <div class="row" style="justify-content:center;margin-top:14px;flex-wrap:wrap"><label class="field">Pack<select id="hl-pack">${packOptions(HOST.pack)}</select></label><label class="field">Timer<select id="hl-timer"><option>20</option><option selected>30</option><option>40</option></select></label></div>
        <div class="btn-row"><button class="btn primary" id="hl-start">START (<span id="hl-n">0</span> players)</button></div></div>`, () => { HOST.ref.update({ state: 'closed' }); HOST = null; Game.title(); });
      if (await loadQR()) { try { new QRCode($('#qr'), { text: joinURL(HOST.code), width: 168, height: 168, colorDark: '#04121A', colorLight: '#E8FFFB' }); } catch (e) { $('#qr').remove(); } } else $('#qr').remove();
      $('#hl-start').onclick = () => {
        if (!Object.keys(HOST.players).length) return UI.toast('Waiting for at least one player to join.');
        HOST.pack = $('#hl-pack').value; HOST.timer = +$('#hl-timer').value; HOST.prompts = pickPrompts(HOST.pack, 7);
        if (!HOST.prompts.length) return UI.toast('No prompts available in that pack yet.');
        HOST.round = -1; HOST.totals = {}; hostNextRound();
      };
    }
    $('#hl-players').innerHTML = pls.length ? pls.map(([, v]) => `<div class="pl">${UI.avatar(v.name)}<span>${esc(v.name)}</span></div>`).join('') : '<p class="muted">Waiting for players…</p>';
    $('#hl-n').textContent = pls.length;
  }
  async function hostNextRound(skip) {
    if (!skip) HOST.round++;
    if (HOST.round >= HOST.prompts.length) return hostPodium();
    const pid = HOST.prompts[HOST.round];
    HOST.view = 'round'; HOST.revealed = false;
    await HOST.ref.child('answers/' + HOST.round).remove();
    await HOST.ref.update({ state: 'round', round: HOST.round, prompt: pid, startedAt: Net.TS(), dur: HOST.timer, settings: { pack: HOST.pack, timer: HOST.timer } });
    const p = Data.prompt(pid);
    Meta.frame(`Round ${HOST.round + 1} of ${HOST.prompts.length}`, `<div class="panel pad center">
      ${p.host ? `<div class="pc-host" style="justify-content:center">${UI.avatar('', p.host)} STAFF PICK — hosted by ${esc(p.host)}</div>` : ''}
      <h2 class="pc-text" style="font-size:clamp(24px,6vw,44px)">${UI.fmtText(p.text)}</h2>${p.sub ? `<div class="pc-sub">${esc(p.sub)}</div>` : ''}
      <div class="res-depth" id="hr-t" style="margin-top:14px">${HOST.timer}</div>
      <div class="players" id="hr-players"></div>
      <div class="btn-row"><button class="btn sm ghost" id="hr-skip">Skip prompt</button><button class="btn sm" id="hr-end">Reveal now</button></div></div>`, () => {});
    $('#m-back').style.visibility = 'hidden';
    $('#hr-skip').onclick = () => { const more = pickPrompts(HOST.pack, 30).filter((id) => !HOST.prompts.includes(id)); if (more.length) HOST.prompts[HOST.round] = more[0]; hostNextRound(true); };
    $('#hr-end').onclick = () => hostReveal();
    const startLocal = Net.serverNow;
    clearInterval(HOST.tick);
    HOST.tick = setInterval(() => {
      const left = HOST.timer - (Net.serverNow - startLocal) / 1000; const el = $('#hr-t');
      if (el) el.textContent = Math.max(0, Math.ceil(left));
      if (left <= 5 && left > 0) Sfx.tick();
      if (left < -1.5) hostReveal();
    }, 250);
    hostRoundPaint();
  }
  function hostRoundPaint() {
    const el = $('#hr-players'); if (!el) return;
    const ans = (HOST.answers || {})[HOST.round] || {};
    const pls = Object.entries(HOST.players);
    el.innerHTML = pls.map(([uid, v]) => `<div class="pl ${ans[uid] ? 'locked' : ''}"><span class="avatar"><span>${esc(initials(v.name))}</span></span><span>${esc(v.name)}</span></div>`).join('');
    if (pls.length && pls.every(([uid]) => ans[uid])) setTimeout(() => hostReveal(), 600);
  }
  async function hostReveal() {
    if (!HOST || HOST.revealed) return; HOST.revealed = true; clearInterval(HOST.tick);
    const pid = HOST.prompts[HOST.round], p = Data.prompt(pid);
    await HOST.ref.update({ state: 'reveal' });
    const ans = (HOST.answers || {})[HOST.round] || {};
    const answers = Object.entries(HOST.players).map(([uid, v]) => { const a = ans[uid] || {}; return { who: uid, name: v.name, id: a.id != null && a.id >= 0 ? a.id : null, key: a.key || null, raw: a.raw || null, rejects: a.rejects || [] }; });
    const { [pid]: { snap } } = await Game.ensureSnapsFor([pid]);
    HOST.cur = { p, snap, answers };
    let scored = scoreRound(p, snap, answers);
    await playReveal(p, snap, revealGroups(p, snap, scored), `Round ${HOST.round + 1} reveal`);
    hostScores();
  }
  function hostScores() {
    const { p, snap, answers } = HOST.cur, scored = scoreRound(p, snap, answers);
    const players = Object.entries(HOST.players).map(([uid, v]) => { const o = scored.find((x) => x.who === uid); return { who: uid, name: v.name, score: (HOST.totals[uid] || 0) + (o ? o.pts : 0), last: o ? o.pts : 0 }; });
    const last = HOST.round + 1 >= HOST.prompts.length;
    Meta.frame(`Round ${HOST.round + 1} scores`, `<div class="panel pad">${standingsHTML(players)}${overrideHTML(scored)}
      <div class="btn-row"><button class="btn primary" id="hs-next">${last ? 'EMPLOYEE OF THE MONTH →' : 'NEXT ROUND →'}</button></div></div>`, () => {});
    $('#m-back').style.visibility = 'hidden';
    $$('[data-ov]').forEach((b) => (b.onclick = () => { const a = HOST.cur.answers.find((x) => x.who === b.dataset.ov); a.override = b.dataset.raw; a.id = null; hostScores(); }));
    $('#hs-next').onclick = () => {
      players.forEach((pl) => (HOST.totals[pl.who] = pl.score));
      HOST.ref.child('scores').set(HOST.totals);
      hostNextRound();
    };
  }
  function hostPodium() {
    HOST.view = 'podium';
    HOST.ref.update({ state: 'podium' });
    const players = Object.entries(HOST.players).map(([uid, v]) => ({ who: uid, name: v.name, score: HOST.totals[uid] || 0 }));
    podium(players, () => { HOST.totals = {}; HOST.ref.child('scores').remove(); HOST.prompts = pickPrompts(HOST.pack, 7); HOST.round = -1; hostNextRound(); });
  }

  /* ───────── Online player ───────── */
  function joinScreen(prefill = '') {
    Meta.frame('Join a room', `<div class="panel pad list">
      <label class="field">Room code<input id="j-code" maxlength="4" value="${esc(prefill)}" placeholder="OPTS" style="text-transform:uppercase;font:800 28px var(--display);letter-spacing:.2em;text-align:center"></label>
      <label class="field">Your name<input id="j-name" maxlength="12" value="${esc(S().settings.nickname)}" placeholder="e.g. Chase"></label>
      <div class="btn-row"><button class="btn primary" id="j-go">JOIN</button></div></div>`, menu);
    $('#j-go').onclick = async () => {
      const code = $('#j-code').value.toUpperCase().replace(/[^A-Z]/g, ''), name = cleanName($('#j-name').value);
      if (code.length !== 4) return UI.toast('Codes are 4 letters.');
      if (!name || name.length < 2 || PROFANITY.test(name)) return UI.toast('Pick a name (2–12 characters).');
      Sfx.unlock(); Sfx.holdStart();
      const ok = await Net.start(); Sfx.holdStop();
      if (!ok || !Net.rooms) return UI.toast("Couldn't reach the network.");
      const snap = await Net.room(code).once('value');
      if (!snap.exists() || snap.val().state === 'closed') return UI.toast('No room with that code. Check the big screen.');
      PLAYER = { code, name, ref: Net.room(code), round: null, answered: {} };
      await PLAYER.ref.child('players/' + Net.uid).set({ name, joinedAt: Net.TS() });
      PLAYER.ref.child('players/' + Net.uid).onDisconnect().remove();
      PLAYER.ref.on('value', (s) => playerSync(s.val()));
    };
  }
  async function playerSync(room) {
    if (!PLAYER || !room) return;
    const me = Net.uid;
    if (room.state === 'closed') { PLAYER.ref.off(); PLAYER = null; UI.toast('The host closed the room.'); return Game.title(); }
    if (room.state === 'lobby') { waitScreen("You're in. Waiting for the host to start…"); return; }
    if (room.state === 'round') {
      const r = room.round;
      if (PLAYER.answered[r + ':' + room.prompt] || (room.answers && room.answers[r] && room.answers[r][me])) { waitScreen('Locked in. Eyes on the big screen. 👀'); return; }
      if (PLAYER.round === r + ':' + room.prompt && Round.active()) return;
      PLAYER.round = r + ':' + room.prompt;
      const p = Data.prompt(room.prompt); if (!p) return waitScreen('This room is on a different version of the game.');
      const elapsed = Math.max(0, (Net.serverNow - (room.startedAt || Net.serverNow)) / 1000);
      const left = Math.max(1, room.dur - elapsed);
      const tag = PLAYER.round;
      const res = await Round.start({ p, hudLeft: 'Showdown · ' + PLAYER.code, eyebrow: `ROUND ${r + 1} OF 7`, count: PLAYER.name, clock: { left, max: room.dur, penalty: CONFIG.WRONG_PENALTY, floor: 2 }, hideBoost: true, introMs: 200 });
      if (!PLAYER || PLAYER.round !== tag) return;
      PLAYER.answered[tag] = true;
      await PLAYER.ref.child(`answers/${r}/${me}`).set({ id: res.kind === 'correct' ? res.m.id : -1, key: res.kind === 'correct' ? res.m.key : null, raw: res.raw || null, rejects: res.rejects.map((x) => x.raw).slice(-6), ms: res.ms });
      waitScreen('Locked in. Eyes on the big screen. 👀');
      return;
    }
    if (room.state === 'reveal') { waitScreen('Eyes on the big screen. 👀'); return; }
    if (room.state === 'podium') {
      const scores = room.scores || {}, mine = scores[me] || 0, sorted = Object.values(scores).sort((a, b) => b - a), rank = sorted.indexOf(mine) + 1;
      waitScreen(`Final score: <b>${mine}</b>${rank ? ` · #${rank} of ${sorted.length}` : ''}`, true);
    }
  }
  function waitScreen(msg, done) {
    if (Round.active()) Round.abort();
    Meta.frame('Store Showdown', `<div class="panel pad center" style="margin-top:8vh"><div style="font-size:46px">📡</div><p style="font-size:18px;margin-top:10px">${msg}</p><p class="muted small">Room ${esc(PLAYER ? PLAYER.code : '')}</p>${done ? '<div class="btn-row"><button class="btn" id="w-home">Home</button></div>' : ''}</div>`, () => { if (PLAYER) { PLAYER.ref.off(); PLAYER.ref.child('players/' + Net.uid).remove(); PLAYER = null; } Game.title(); });
    if (done) $('#w-home').onclick = () => { if (PLAYER) PLAYER.ref.off(); PLAYER = null; Game.title(); };
  }
  return { menu, joinScreen, hostCreate };
})();


/* ── Boot ── */
(function boot() {
  try { Data.load(); }
  catch (e) { console.error(e); document.getElementById('ui').innerHTML = '<div class="screen on"><div class="panel pad center" style="margin-top:20vh">Your call is important to us… but the library failed to load. Try refreshing.</div></div>'; return; }
  const st = Store.S.settings;
  document.body.classList.toggle('rm', st.reducedMotion == null ? prefersReducedMotion() : !!st.reducedMotion);
  Scene.init(document.getElementById('scene'));
  const q = new URLSearchParams(location.search);
  if (q.has('host')) Showdown.hostCreate();
  else if (q.has('join')) Showdown.joinScreen((q.get('join') || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4));
  else Game.title();
  Net.start().then((ok) => { if (ok && UI.current === 'scr-title') Game.title(); });
  const unlock = () => Sfx.unlock();
  window.addEventListener('pointerdown', unlock, { once: true });
  window.addEventListener('keydown', unlock, { once: true });
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape') UI.close(); });
  // Debug/test hook (harmless): exposes modules for automated checks.
  window.__optillion = { Game, Data, Matcher, Rarity, Schedule, Store, Scene, Round, Showdown, Meta, UI };
})();

</script>
</body>
