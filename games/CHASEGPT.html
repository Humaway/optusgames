<style>
/* base.css — tokens, reset, app layout, head panel chrome */
:root {
  --void: #050506;
  --panel: #171717;
  --bubble: #2a2a2a;
  --text: #ececec;
  --muted: #8e8e8e;
  --line: #2e2e2e;
  --flesh: #d9b8a3;
  --help: rgba(122, 42, 42, 0.35);
  --font-ui: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
  --head-w: 45%;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--panel);
  color: var(--text);
  font: 16px/1.6 var(--font-ui);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--flesh); outline-offset: 2px; }

#app {
  position: fixed;
  inset: 0;
  display: flex;
  height: 100dvh;
}

/* ---------- head panel ---------- */
#head-panel {
  position: relative;
  flex: 0 0 var(--head-w);
  background: var(--void);
  border-right: 1px solid var(--line);
  overflow: hidden;
  z-index: 0;
  transition: flex-basis 0.25s ease, height 0.25s ease, transform 0.12s ease-out;
}
#head-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.brand {
  position: absolute;
  top: 18px;
  left: 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  pointer-events: none;
}
.wordmark {
  font-weight: 600;
  letter-spacing: 0.12em;
  color: var(--flesh);
  font-size: 15px;
}
.wordmark span { color: var(--muted); }
.badge {
  font: 11px/1 var(--font-mono);
  color: var(--muted);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 8px;
  white-space: nowrap;
}
.status-line {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 16px;
  text-align: center;
  font: 12px/1 var(--font-mono);
  color: var(--muted);
  letter-spacing: 0.04em;
  pointer-events: none;
  min-height: 12px;
}

#chat-panel {
  position: relative;
  flex: 1 1 auto;
  min-width: 0;
  background: var(--panel);
  z-index: 1;
}

#overlay-root { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
#overlay-root > * { pointer-events: auto; }
#boot-root { position: fixed; inset: 0; z-index: 100; pointer-events: none; }
#boot-root > * { pointer-events: auto; }

/* ---------- tablet ---------- */
@media (min-width: 768px) and (max-width: 1023px) {
  :root { --head-w: 40%; }
}

/* ---------- mobile: head becomes a band on top ---------- */
@media (max-width: 767px) {
  #app { flex-direction: column; }
  #head-panel {
    flex: 0 0 38dvh;
    height: 38dvh;
    border-right: 0;
    border-bottom: 1px solid var(--line);
  }
  body.kb-open #head-panel { flex-basis: 96px; height: 96px; }
  body.kb-open .brand, body.kb-open .status-line { display: none; }
  .brand { top: 12px; left: 14px; }
  .status-line { bottom: 10px; }
}

@media (prefers-reduced-motion: reduce) {
  #head-panel { transition: none; }
}

</style>
<style>
/* chat.css — chat panel: top bar, messages, markdown, composer, history drawer, modals, toasts.
   Every rule is scoped under #chat-panel. Layers inside the panel: scrim 19 · drawer 20 · modals 40 · toasts 45. */

#chat-panel { display: flex; flex-direction: column; min-height: 0; overflow: hidden; font-size: 16px; }
#chat-panel button { background: none; border: 0; padding: 0; }
#chat-panel [hidden] { display: none !important; }
#chat-panel .ico { display: block; flex: none; }
/* .rm is toggled by chat.js from CG.reduceMotion() (setting first, then OS): no slide/fade/blink. */
#chat-panel.rm *, #chat-panel.rm *::before, #chat-panel.rm *::after { animation: none !important; transition: none !important; }

/* ---------- top bar ---------- */
#chat-panel .cg-topbar { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 52px; padding: 0 12px; }
#chat-panel .cg-tb-group { display: flex; gap: 2px; }
#chat-panel .cg-tb-btn { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; border-radius: 10px; font-size: 14px; font-weight: 500; color: #cfcfcf; transition: background 0.15s, color 0.15s; }
#chat-panel .cg-tb-btn:hover { background: rgba(255, 255, 255, 0.07); color: var(--text); }
#chat-panel.busy .cg-new { opacity: 0.45; cursor: not-allowed; }

/* ---------- message area ---------- */
#chat-panel .cg-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; overflow-anchor: none; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: #3a3a3a transparent; }
#chat-panel .cg-col { width: 100%; max-width: 720px; min-height: 100%; margin: 0 auto; padding: 4px 20px 24px; display: flex; flex-direction: column; }
#chat-panel .cg-msgs { display: flex; flex-direction: column; }
#chat-panel.is-empty .cg-msgs { display: none; }

#chat-panel .msg { padding: 10px 0; }
#chat-panel .msg.assistant { padding: 14px 0 10px; }
#chat-panel .msg.enter { animation: cg-rise 180ms ease-out both; }
@keyframes cg-rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

#chat-panel .msg.user { display: flex; justify-content: flex-end; }
#chat-panel .msg.user .bubble { max-width: 85%; background: var(--bubble); border-radius: 22px; padding: 10px 18px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }

/* streaming cursor: blinking block */
#chat-panel .cursor { display: inline-block; width: 0.55em; height: 1.05em; margin-left: 2px; vertical-align: -0.15em; background: var(--flesh); animation: cg-blink 1.05s steps(1, end) infinite; }
@keyframes cg-blink { 50% { opacity: 0; } }

/* actions under a finished reply */
#chat-panel .actions { display: flex; gap: 2px; margin: 8px 0 0 -8px; }
#chat-panel .act { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; color: var(--muted); transition: background 0.15s, color 0.15s; }
#chat-panel .act:hover { background: rgba(255, 255, 255, 0.07); color: var(--text); }
#chat-panel .act[aria-pressed="true"] { color: var(--flesh); }
#chat-panel .act[aria-pressed="true"] .ico { fill: currentColor; }

/* ---------- assistant markdown ---------- */
#chat-panel .content { line-height: 1.7; overflow-wrap: break-word; }
#chat-panel .content > :first-child { margin-top: 0; }
#chat-panel .content > :last-child { margin-bottom: 0; }
#chat-panel .content p { margin: 0 0 1em; }
#chat-panel .content strong { font-weight: 600; }
#chat-panel .content h1, #chat-panel .content h2, #chat-panel .content h3, #chat-panel .content h4 { margin: 1.5em 0 0.6em; line-height: 1.3; font-weight: 600; }
#chat-panel .content h1 { font-size: 1.55em; }
#chat-panel .content h2 { font-size: 1.3em; }
#chat-panel .content h3 { font-size: 1.12em; }
#chat-panel .content h4 { font-size: 1em; }
#chat-panel .content ul, #chat-panel .content ol { margin: 0 0 1em; padding-left: 1.6em; }
#chat-panel .content li { margin: 0.3em 0; padding-left: 0.2em; }
#chat-panel .content li::marker { color: var(--muted); }
#chat-panel .content li > p { margin: 0.3em 0; }
#chat-panel .content li > ul, #chat-panel .content li > ol { margin: 0.3em 0; }
#chat-panel .content blockquote { margin: 1em 0; padding: 0.1em 1em; border-left: 3px solid #424242; color: #bdbdbd; }
#chat-panel .content hr { border: 0; border-top: 1px solid var(--line); margin: 1.6em 0; }
#chat-panel .content a { color: var(--flesh); text-decoration: underline; text-decoration-color: rgba(217, 184, 163, 0.4); text-underline-offset: 3px; }
#chat-panel .content a:hover { text-decoration-color: currentColor; }
#chat-panel .content :not(pre) > code { font: 0.875em var(--font-mono); background: rgba(255, 255, 255, 0.08); padding: 0.15em 0.4em; border-radius: 6px; }

#chat-panel .content .code-block { margin: 1.1em 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: #0d0d0d; }
#chat-panel .content .code-head { display: flex; align-items: center; justify-content: space-between; padding: 5px 8px 5px 16px; background: #262626; color: var(--muted); font: 12px/1 var(--font-mono); }
#chat-panel .content .code-copy { display: inline-flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 6px; color: var(--muted); font: 12px/1 var(--font-ui); }
#chat-panel .content .code-copy:hover { background: rgba(255, 255, 255, 0.08); color: var(--text); }
#chat-panel .content .code-block pre { margin: 0; padding: 14px 16px; overflow-x: auto; scrollbar-width: thin; scrollbar-color: #3a3a3a transparent; }
#chat-panel .content .code-block code { display: block; font: 13.5px/1.6 var(--font-mono); color: #e6e6e6; white-space: pre; tab-size: 2; background: none; padding: 0; }

#chat-panel .content .table-wrap { margin: 1.1em 0; overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
#chat-panel .content table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
#chat-panel .content th, #chat-panel .content td { padding: 9px 14px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
#chat-panel .content th { font-weight: 600; white-space: nowrap; background: rgba(255, 255, 255, 0.04); }
#chat-panel .content [align="right"] { text-align: right; }
#chat-panel .content [align="center"] { text-align: center; }
#chat-panel .content tr:last-child td { border-bottom: 0; }

/* highlight.js token colours (GitHub-dark-ish) */
#chat-panel .hljs-keyword, #chat-panel .hljs-doctag, #chat-panel .hljs-template-tag, #chat-panel .hljs-template-variable, #chat-panel .hljs-type { color: #ff7b72; }
#chat-panel .hljs-title, #chat-panel .hljs-title.function_, #chat-panel .hljs-title.class_ { color: #d2a8ff; }
#chat-panel .hljs-attr, #chat-panel .hljs-attribute, #chat-panel .hljs-literal, #chat-panel .hljs-meta, #chat-panel .hljs-number, #chat-panel .hljs-operator, #chat-panel .hljs-variable, #chat-panel .hljs-selector-attr, #chat-panel .hljs-selector-class, #chat-panel .hljs-selector-id { color: #79c0ff; }
#chat-panel .hljs-string, #chat-panel .hljs-regexp, #chat-panel .hljs-meta .hljs-string { color: #a5d6ff; }
#chat-panel .hljs-built_in, #chat-panel .hljs-symbol { color: #ffa657; }
#chat-panel .hljs-comment, #chat-panel .hljs-code, #chat-panel .hljs-formula { color: #8b949e; font-style: italic; }
#chat-panel .hljs-name, #chat-panel .hljs-quote, #chat-panel .hljs-selector-tag, #chat-panel .hljs-selector-pseudo { color: #7ee787; }
#chat-panel .hljs-section { color: #79c0ff; font-weight: 600; }
#chat-panel .hljs-bullet { color: #f2cc60; }
#chat-panel .hljs-emphasis { font-style: italic; }
#chat-panel .hljs-strong { font-weight: 600; }
#chat-panel .hljs-addition { color: #aff5b4; background: #033a16; }
#chat-panel .hljs-deletion { color: #ffdcd7; background: #67060c; }

/* ---------- empty state ---------- */
#chat-panel .cg-empty { display: none; margin: auto 0; padding-bottom: 6vh; flex-direction: column; align-items: center; text-align: center; }
#chat-panel.is-empty .cg-empty { display: flex; }
#chat-panel .cg-empty h1 { margin: 0; font-size: clamp(26px, 4vw, 34px); font-weight: 600; letter-spacing: -0.01em; line-height: 1.2; }
#chat-panel .cg-quip { margin: 10px 0 0; max-width: 460px; color: var(--muted); font-size: 15px; line-height: 1.5; }
#chat-panel .cg-chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; max-width: 560px; margin-top: 28px; }
#chat-panel .cg-chip { padding: 10px 16px; border: 1px solid var(--line); border-radius: 14px; font-size: 14px; color: #d6d6d6; transition: background 0.15s, border-color 0.15s; }
#chat-panel .cg-chip:hover { background: rgba(255, 255, 255, 0.06); border-color: #3c3c3c; }

/* ---------- composer ---------- */
#chat-panel .cg-foot { flex: none; padding: 4px 16px calc(10px + env(safe-area-inset-bottom)); }
#chat-panel .cg-composer { max-width: 720px; margin: 0 auto; display: flex; align-items: flex-end; gap: 8px; padding: 8px 8px 8px 20px; background: var(--bubble); border: 1px solid transparent; border-radius: 26px; transition: border-color 0.15s; }
#chat-panel .cg-composer:focus-within { border-color: rgba(217, 184, 163, 0.45); }
#chat-panel .cg-input { flex: 1; min-width: 0; max-height: 200px; padding: 7px 0; resize: none; overflow-y: hidden; background: transparent; border: 0; outline: 0; color: var(--text); font-size: 16px; line-height: 1.5; }
#chat-panel .cg-input::placeholder { color: var(--muted); }

#chat-panel .cg-send:disabled { opacity: 0.3; cursor: default; }
#chat-panel .cg-disclaimer { max-width: 720px; margin: 8px auto 0; text-align: center; color: var(--muted); font-size: 12px; line-height: 1.4; }
#chat-panel .cg-link { color: var(--flesh); font: inherit; text-decoration: underline; text-underline-offset: 2px; }

#chat-panel .cg-scrim { position: absolute; inset: 0; z-index: 19; background: rgba(0, 0, 0, 0.5); opacity: 0; pointer-events: none; transition: opacity 0.22s; }
#chat-panel .cg-scrim.open { opacity: 1; pointer-events: auto; }

#chat-panel .cg-dr-head h2 { margin: 0; font-size: 15px; font-weight: 600; }
#chat-panel .cg-x { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; color: var(--muted); }
#chat-panel .cg-x:hover { background: rgba(255, 255, 255, 0.08); color: var(--text); }
#chat-panel .cg-hist { flex: 1; margin: 0; padding: 4px 8px 16px; list-style: none; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #3a3a3a transparent; }
#chat-panel .cg-hist-row { display: flex; align-items: center; border-radius: 10px; }
#chat-panel .cg-hist-row:hover, #chat-panel .cg-hist-row.current { background: rgba(255, 255, 255, 0.06); }
#chat-panel .cg-hist-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; padding: 9px 10px; text-align: left; }
#chat-panel .cg-hist-title { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 14px; }
#chat-panel .cg-hist-time { color: var(--muted); font-size: 12px; }

#chat-panel .cg-hist-row:hover .cg-hist-del, #chat-panel .cg-hist-del:focus-visible { opacity: 1; }
#chat-panel .cg-hist-del:hover { background: rgba(255, 255, 255, 0.08); color: #e8908a; }
#chat-panel .cg-hist-empty { padding: 16px 10px; color: var(--muted); font-size: 14px; }
#chat-panel.busy .cg-hist-main { opacity: 0.5; cursor: not-allowed; }

#chat-panel .cg-dlg-foot { padding-top: 16px; }

#chat-panel .cg-row-text b { display: block; font-weight: 500; }

#chat-panel .cg-erase { flex: none; display: flex; align-items: center; gap: 8px; }
#chat-panel .cg-sure { color: var(--muted); font-size: 13px; }
#chat-panel .cg-btn { padding: 7px 14px; border: 1px solid var(--line); border-radius: 10px; font-size: 13.5px; transition: background 0.15s; }
#chat-panel .cg-btn:hover { background: rgba(255, 255, 255, 0.07); }

#chat-panel .cg-btn.danger.solid { background: #8a3030; border-color: #8a3030; color: #fff; }
#chat-panel .cg-btn.danger.solid:hover { background: #a03a3a; }

#chat-panel .cg-prose p { margin: 0.7em 0; color: #cfcfcf; font-size: 14.5px; line-height: 1.6; }

#chat-panel .cg-prose a { color: var(--flesh); overflow-wrap: anywhere; }
#chat-panel .cg-credits { margin: 0.4em 0; padding-left: 1.2em; color: #cfcfcf; font-size: 14px; line-height: 1.6; }
#chat-panel .cg-credits b { font-weight: 500; color: var(--text); }

#chat-panel .cg-toasts { position: absolute; top: 56px; left: 0; right: 0; z-index: 45; display: flex; justify-content: center; padding: 0 16px; pointer-events: none; }
#chat-panel .cg-toast { max-width: min(520px, 100%); padding: 10px 16px; background: #262626; border: 1px solid #3a3a3a; border-radius: 12px; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45); font-size: 14px; line-height: 1.4; opacity: 0; transform: translateY(-6px); transition: opacity 0.2s, transform 0.2s; }

/* ---------- mobile (<768px): chat sits under the head band ---------- */
@media (max-width: 767px) {
  #chat-panel .cg-topbar { height: 44px; padding: 0 6px; }
  #chat-panel .cg-tb-btn { width: 40px; padding: 0; justify-content: center; }
  #chat-panel .cg-tb-btn .lbl { display: none; }

  #chat-panel .cg-foot { padding: 4px 10px calc(8px + env(safe-area-inset-bottom)); }

  #chat-panel .cg-chips { flex-direction: column; align-items: stretch; width: 100%; margin-top: 20px; }

</style>
<style>
/* boot.css — device check, consent card, loading screen, fallback banner */

/* Black from first paint until boot.js mounts (and never again once it is done). */
#boot-root:empty:not(.is-done) { background: var(--void); }

.boot {
  position: fixed;
  inset: 0;
  display: grid;
  padding: 24px 16px;
  overflow: hidden auto; /* short landscape phones can scroll the consent card */
  font: 14px/1.6 var(--font-mono);
  color: var(--text);
  transition: opacity 0.7s ease;
}
.boot--out { opacity: 0; pointer-events: none; }

/* The veil sits over the head panel; its box-shadow blacks out everything else.
   At ~90% only the head-panel part turns translucent, so the sleeping head shows through. */
.boot-veil {
  position: absolute;
  left: 0;
  top: 0;
  width: var(--head-w);
  height: 100%;
  background: var(--void);
  box-shadow: 0 0 0 200vmax var(--void);
  transition: background-color 1.8s ease;
}
.boot.is-revealed .boot-veil { background: rgba(5, 5, 6, 0.5); }

.boot-stage {
  position: relative;
  width: min(560px, 100%);
  margin: auto; /* centres without clipping when taller than the screen */
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  text-align: center;
}
.boot-slot { width: 100%; }
.boot-line {
  margin: 0;
  font-size: clamp(14px, 2.4vw, 16px);
  letter-spacing: 0.02em;
}
.boot-line.is-waiting::after {
  content: '';
  display: inline-block;
  width: 0.55em;
  height: 1.1em;
  margin-left: 4px;
  vertical-align: -0.2em;
  background: var(--flesh);
  animation: boot-blink 1.1s steps(1) infinite;
}

/* ---------- consent card ---------- */
.boot-card {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 24px;
  text-align: left;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
}
.boot-q { margin: 0 0 4px; font-size: 15px; line-height: 1.6; }
.boot-note { margin: 0; font-size: 12px; line-height: 1.5; color: var(--muted); }
.boot-warn { color: var(--flesh); }
.boot-check {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  width: fit-content;
  font-size: 12px;
  color: var(--muted);
  cursor: pointer;
}
.boot-check input { margin: 0; accent-color: var(--flesh); }
.boot-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
.boot-btn {
  padding: 12px 18px;
  font: 600 14px/1 var(--font-mono);
  color: var(--muted);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 8px;
}
.boot-btn:hover { color: var(--text); border-color: var(--muted); }
.boot-yes, .boot-yes:hover { color: var(--void); background: var(--flesh); border-color: var(--flesh); }
.boot-yes:hover { filter: brightness(1.08); }
.boot-reply { margin: 0; font-size: 13px; }
.boot-link {
  align-self: flex-start;
  padding: 0;
  font-size: 12px;
  color: var(--muted);
  background: none;
  border: 0;
  text-decoration: underline;
  text-underline-offset: 3px;
}
.boot-link:hover { color: var(--text); }

/* ---------- progress ---------- */
.boot-meter { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.boot-pct {
  height: 64px;
  display: flex;
  align-items: flex-end;
  font: 600 clamp(40px, 11vw, 64px)/1 var(--font-mono);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
  color: var(--flesh);
}
.boot-pct.is-waking { padding-bottom: 6px; font-size: clamp(18px, 4.5vw, 24px); font-weight: 400; letter-spacing: 0.06em; }
.boot-bar { flex: none; width: 100vw; height: 3px; background: var(--line); overflow: hidden; } /* edge to edge */
.boot-fill {
  height: 100%;
  background: var(--flesh);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.4s ease-out;
}
.boot--waking .boot-fill { animation: boot-pulse 1.6s ease-in-out infinite; }
.boot-status { margin: 0; min-height: 1.6em; font-size: 14px; }
.boot-status.flick { animation: boot-flick 0.24s steps(3); }
.boot-detail {
  margin: 0;
  min-height: 3em;
  max-width: 46ch;
  font-size: 11px;
  line-height: 1.5;
  color: var(--muted);
  opacity: 0.75;
  overflow-wrap: anywhere;
}

/* ---------- fallback banner (lives in #overlay-root) ---------- */
.boot-banner {
  position: fixed;
  top: 14px;
  right: 14px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  max-width: min(440px, calc(100vw - 32px));
  padding: 12px 10px 12px 16px;
  font: 13px/1.5 var(--font-ui);
  color: var(--muted);
  background: var(--panel);
  border: 1px solid var(--line);
  border-left: 3px solid var(--flesh);
  border-radius: 10px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
}
.boot-banner p { margin: 0; }
.boot-banner strong { color: var(--text); font-weight: 600; }
.boot-banner-x {
  flex: none;
  width: 28px;
  height: 28px;
  font-size: 18px;
  line-height: 1;
  color: var(--muted);
  background: transparent;
  border: 0;
  border-radius: 6px;
}
.boot-banner-x:hover { color: var(--text); background: var(--bubble); }

/* ---------- motion ---------- */
.boot--still, .boot--still * { animation: none !important; transition: none !important; }
@keyframes boot-blink { 50% { opacity: 0; } }
@keyframes boot-pulse { 50% { opacity: 0.45; } }
@keyframes boot-flick {
  0% { opacity: 0.2; transform: translateX(-2px); }
  50% { opacity: 1; transform: translateX(1px); }
  100% { opacity: 1; transform: none; }
}

/* ---------- mobile: head is a band on top ---------- */
@media (max-width: 767px) {
  .boot-veil { width: 100%; height: 38dvh; }
  .boot-banner { left: 16px; right: 16px; top: 12px; max-width: none; }
}
@media (max-width: 480px) {
  .boot-card { padding: 20px 18px; }
  .boot-btn { flex: 1 1 auto; }
}

<script type="module">
// core.js — shared namespace, event bus, storage and small utilities.
const CG = (window.CG = window.CG || {});

// ---------- bus ----------
const listeners = new Map();
CG.bus = {
  on(evt, fn) {
    if (!listeners.has(evt)) listeners.set(evt, new Set());
    listeners.get(evt).add(fn);
    return () => listeners.get(evt)?.delete(fn);
  },
  once(evt, fn) {
    const off = CG.bus.on(evt, (d) => { off(); fn(d); });
    return off;
  },
  emit(evt, data = {}) {
    for (const fn of [...(listeners.get(evt) || [])]) {
      try { fn(data); } catch (e) { console.error(`[bus] ${evt}`, e); }
    }
  },
};

// ---------- utils ----------
const U = (CG.util = {
  rand: (a, b) => a + Math.random() * (b - a),
  randInt: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
  pick: (arr) => arr[Math.floor(Math.random() * arr.length)],
  chance: (p) => Math.random() < p,
  clamp: (v, a, b) => Math.min(b, Math.max(a, v)),
  lerp: (a, b, t) => a + (b - a) * t,
  sleep: (ms) => new Promise((r) => setTimeout(r, ms)),
  uid: () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
  fmtDuration(ms) {
    const s = Math.max(0, Math.round(ms / 1000));
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    const part = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
    const out = [];
    if (h) out.push(part(h, 'hour'));
    if (m) out.push(part(m, 'minute'));
    if (sec || !out.length) out.push(part(sec, 'second'));
    return out.join(', ');
  },
  isNight: (d = new Date()) => d.getHours() < 4,
  escapeHtml: (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])),
});

// ---------- session ----------
CG.session = {
  start: Date.now(),
  mode: null,
  modelId: null,
  sincere: false,
  generating: false,
  booted: false,
  minutes: () => (Date.now() - CG.session.start) / 60000,
};

// ---------- localStorage ----------
const LS_SETTINGS = 'chasegpt:settings';
const LS_SELF = 'chasegpt:self';
function readLS(key, def) {
  try { return { ...def, ...JSON.parse(localStorage.getItem(key) || '{}') }; } catch { return { ...def }; }
}
function writeLS(key, val) {
  if (erased) return;
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
}

const DEFAULT_SETTINGS = { sound: false, reduceMotion: null };
const DEFAULT_SELF = { userName: null, pinnedMemory: '', lastVisit: null, sessionCount: 0, firstVisit: null };
let settings = readLS(LS_SETTINGS, DEFAULT_SETTINGS);
let self = readLS(LS_SELF, DEFAULT_SELF);
let erased = false; // after "Erase everything", nothing may be written back before the reload

const osReduce = matchMedia('(prefers-reduced-motion: reduce)');
CG.reduceMotion = () => (settings.reduceMotion == null ? osReduce.matches : !!settings.reduceMotion);

// ---------- IndexedDB (chats) ----------
const DB_NAME = 'chasegpt';
let dbp = null;
function db() {
  if (!dbp) {
    dbp = new Promise((res, rej) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => req.result.createObjectStore('chats', { keyPath: 'id' });
      req.onsuccess = () => res(req.result);
      req.onerror = () => rej(req.error);
    });
  }
  return dbp;
}
async function tx(mode, fn) {
  const d = await db();
  return new Promise((res, rej) => {
    const t = d.transaction('chats', mode);
    const out = fn(t.objectStore('chats'));
    t.oncomplete = () => res(out?.result);
    t.onerror = () => rej(t.error);
  });
}

CG.store = {
  previousVisit: self.lastVisit,
  getSettings: () => ({ ...settings }),
  setSetting(key, value) {
    settings = { ...settings, [key]: value };
    writeLS(LS_SETTINGS, settings);
    CG.bus.emit('settings:change', { key, value });
  },
  getSelf: () => ({ ...self }),
  patchSelf(obj) {
    self = { ...self, ...obj };
    writeLS(LS_SELF, self);
  },
  async listChats() {
    const all = (await tx('readonly', (s) => s.getAll())) || [];
    return all
      .map(({ id, title, created, updated }) => ({ id, title, created, updated }))
      .sort((a, b) => b.updated - a.updated);
  },
  getChat: (id) => tx('readonly', (s) => s.get(id)),
  putChat: (chat) => tx('readwrite', (s) => s.put({ ...chat, updated: Date.now() })),
  deleteChat: (id) => tx('readwrite', (s) => s.delete(id)),
  async eraseEverything() {
    erased = true;
    settings = { ...DEFAULT_SETTINGS };
    self = { ...DEFAULT_SELF };
    try { await CG.llm?.eraseModel?.(); } catch (e) { console.warn(e); }
    try {
      for (const k of await caches.keys()) if (/webllm|tvmjs/i.test(k)) await caches.delete(k);
    } catch {}
    try { (await db()).close(); } catch {}
    dbp = null;
    await new Promise((r) => { const q = indexedDB.deleteDatabase(DB_NAME); q.onsuccess = q.onerror = q.onblocked = () => r(); });
    for (const k of Object.keys(localStorage)) if (k.startsWith('chasegpt:')) localStorage.removeItem(k);
  },
};

// Record this visit. lastVisit is refreshed while the page is open so "It's been 4 days" is accurate.
CG.store.patchSelf({
  sessionCount: (self.sessionCount || 0) + 1,
  firstVisit: self.firstVisit || Date.now(),
  lastVisit: Date.now(),
});
setInterval(() => CG.store.patchSelf({ lastVisit: Date.now() }), 30000);
addEventListener('pagehide', () => CG.store.patchSelf({ lastVisit: Date.now() }));

</script>

<script type="module">
// head.js — CHASE's head (DESIGN.md "Plan B"): the M001 front view on a depth-displaced plane with the
// eye openings cut out and real 3D eyeballs behind them. Expression shapes are morph targets computed
// here from the landmarks in head-asset.js, named after the ARKit rig spec so a GLB could drop in.
// The head only LISTENS to the bus (CONTRACT.md); it never decides app state. Owns #head-status.
//
// Naming: ARKit "Left" = the character's left = the VIEWER's right (larger u / +x).
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

const CG = window.CG;

// ---------------------------------------------------------------- constants
const DEG = Math.PI / 180;
const PH = 2.0;               // face plane height in world units
const REF_H = 482;            // morph magnitudes are authored in reference px (texture height == 482 px)
const D0 = 4.3;               // nominal camera distance for the perspective pre-correction of the relief
const SEG_X = 180;            // face plane segments across
const FOV = 28;
const GAZE_DIST = 1.25;       // cursor / DOM targets are cast onto a plane this far in front of the eyes
const LIM = { yaw: 14 * DEG, pitch: 9 * DEG, roll: 6 * DEG, eye: 25 * DEG };
const VOID = 0x050506;
const STATUS = {
  boot: '', idle: 'idle', watching: 'watching', typing: 'watching you type', thinking: 'thinking (reluctantly)',
  streaming: 'typing', pleading: 'please', stare: '', away: 'you left', sincere: 'listening',
};
const MORPHS = ['eyeBlinkLeft', 'eyeBlinkRight', 'eyeWideLeft', 'eyeWideRight', 'mouthSmileLeft', 'mouthSmileRight',
  'cheekSquintLeft', 'cheekSquintRight', 'browInnerUp', 'browDownLeft', 'browDownRight', 'mouthPress', 'jawOpen'];

// ---------------------------------------------------------------- small math
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const rand = (a, b) => a + Math.random() * (b - a);
const chance = (p) => Math.random() < p;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const gss = (x, y, cx, cy, sx, sy) => Math.exp(-((x - cx) ** 2) / (2 * sx * sx) - ((y - cy) ** 2) / (2 * sy * sy));
const damp = (cur, tgt, tau, dt) => (tau <= 0 ? tgt : cur + (tgt - cur) * (1 - Math.exp(-dt / tau)));
function chainY(chain, x) {
  if (x <= chain[0][0]) return chain[0][1];
  for (let i = 1; i < chain.length; i++) {
    if (x <= chain[i][0]) {
      const [x0, y0] = chain[i - 1], [x1, y1] = chain[i];
      return y0 + (y1 - y0) * ((x - x0) / (x1 - x0 || 1));
    }
  }
  return chain[chain.length - 1][1];
}
// critically-damped-ish spring on one scalar
function spring(s, target, omega, zeta, dt) {
  const n = Math.max(1, Math.ceil(dt / 0.008));
  const h = dt / n;
  for (let i = 0; i < n; i++) {
    s.v += (omega * omega * (target - s.x) - 2 * zeta * omega * s.v) * h;
    s.x += s.v * h;
  }
  return s.x;
}
// smooth low-frequency noise from incommensurate sines
const noise = (t, seed) => Math.sin(t * 0.43 + seed) * 0.55 + Math.sin(t * 0.83 + seed * 2.3) * 0.3 + Math.sin(t * 1.21 + seed * 4.1) * 0.15;

    g.strokeStyle = `rgba(150,46,44,${rand(0.05, 0.16)})`; g.lineWidth = rand(0.5, 1.5);

    for (let s = 0; s < 7; s++) {

      if (Math.hypot(x - C, y - C) < R * 1.3) break;

  grd.addColorStop(0, '#4f544b'); grd.addColorStop(0.3, '#6f776c'); grd.addColorStop(0.62, '#838c82');
  grd.addColorStop(0.86, '#646c63'); grd.addColorStop(1, '#383d38');
  g.fillStyle = grd; g.beginPath(); g.arc(C, C, R, 0, TAU); g.fill();

    const light = chance(0.5);

    g.lineWidth = rand(0.5, 1.7);

    g.quadraticCurveTo(C + Math.cos(a + wob) * (r1 + r2) / 2, C + Math.sin(a + wob) * (r1 + r2) / 2, C + Math.cos(a + wob * 0.4) * r2, C + Math.sin(a + wob * 0.4) * r2);

  g.fillStyle = grd; g.beginPath(); g.arc(C, C, R * 1.06, 0, TAU); g.fill();

}

function lidShadowTexture() {

function eyeEnvironment() {
  // a black room with one warm softbox (upper left) and a thin cool strip (back right): what the eyes reflect
  const env = new THREE.Scene();
  env.background = new THREE.Color(0x000000);
  const box = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 1.6), new THREE.MeshBasicMaterial({ color: new THREE.Color(1.0, 0.86, 0.72).multiplyScalar(5), side: THREE.DoubleSide }));
  box.position.set(-3, 2.4, 3); box.lookAt(0, 0, 0); env.add(box);
  // the catchlight: a softbox just above-left of the lens, so the highlight sits beside the pupil
  const cl = new THREE.Mesh(new THREE.PlaneGeometry(1.1, 0.8), new THREE.MeshBasicMaterial({ color: new THREE.Color(1.0, 0.93, 0.85).multiplyScalar(9), side: THREE.DoubleSide }));
  cl.position.set(-1.0, 0.22, 4.2); cl.lookAt(0, 0, 0); env.add(cl);

  strip.position.set(3.2, 0.6, -2.2); strip.lookAt(0, 0, 0); env.add(strip);

}

function buildEyes() {
  const { L, toWorld, k } = F;
  eyeRig = new THREE.Group();
  eyeRig.matrixAutoUpdate = false;
  scene.add(eyeRig);
  const ex = L.eyeLeft;
  const irisUV = (ex.irisR / ex.r) * 0.5 / 1.03;
  pupilBase = EYE_UNI.uPupil.value = irisUV * 0.36;
  const irisTex = new THREE.CanvasTexture(irisCanvas(irisUV));
  irisTex.colorSpace = THREE.SRGBColorSpace;
  irisTex.anisotropy = 4;
  eyeMat = new THREE.MeshPhysicalMaterial({
    map: irisTex, roughness: 0.3, metalness: 0, clearcoat: 1.0, clearcoatRoughness: 0.03,
    envMap: eyeEnvironment(), envMapIntensity: 0.9, specularIntensity: 0.7,
    emissiveMap: irisTex, emissive: new THREE.Color(0.16, 0.15, 0.14),   // fake bounce: the far side of the ball never goes black
  });
  eyeMat.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, EYE_UNI);
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\nuniform float uPupil;')
      .replace('#include <map_fragment>', `#include <map_fragment>
{ float cgPd = length(vMapUv - 0.5); diffuseColor.rgb *= 1.0 - 0.965 * smoothstep(uPupil + 0.012, uPupil - 0.004, cgPd); }`);
  };
  const socketMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(0x4a2e29), side: THREE.BackSide });
  const shadowTex = lidShadowTexture();
  for (const side of ['Left', 'Right']) {
    const e = L['eye' + side];
    const c = toWorld(e.ball[0], e.ball[1], e.ball[2]);
    const zFront = e.ball[2] + e.r;
    const r = e.r * k * (D0 - zFront * k) / D0;
    const geo = new THREE.SphereGeometry(r, 64, 48);
    const p = geo.attributes.position, uv = geo.attributes.uv;
    const cosI = Math.cos(Math.asin(clamp(e.irisR / e.r, 0, 0.95)));
    for (let i = 0; i < p.count; i++) {
      tmpV.set(p.getX(i), p.getY(i), p.getZ(i)).divideScalar(r);
      const b = sstep(cosI - 0.06, 1, tmpV.z);
      const sc = 1 + 0.05 * b * b;                    // corneal bulge
      p.setXYZ(i, tmpV.x * r * sc, tmpV.y * r * sc, tmpV.z * r * sc);
      uv.setXY(i, 0.5 + tmpV.x * 0.5, 0.5 + tmpV.y * 0.5);
    }
    geo.computeVertexNormals();

    socket.position.copy(c);
    const ball = new THREE.Mesh(geo, eyeMat);

    socket.add(back);
    eyeRig.add(socket);

    const w = (e.up[e.up.length - 1][0] - e.up[0][0] + 6) * k, h = (e.lo[2][1] - e.up[2][1] + 14) * k;
    const sh = new THREE.Mesh(new THREE.PlaneGeometry(w, h * 1.25), new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false, color: 0xffffff }));
    const oc = toWorld(e.c[0], e.c[1] - 1, zFront + 1.6);
    sh.position.set(oc.x, oc.y, c.z + (e.r * 1.05 + 0.6) * k);
    sh.renderOrder = 1;
    eyeRig.add(sh);
    EYES[side] = { e, socket, ball, center: c.clone(), yaw: 0, pitch: 0, jy: 0, jp: 0 };
  }
}

function buildPost() {
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  post = new ShaderPass({
    uniforms: {
      tDiffuse: { value: null }, uTime: { value: 0 }, uGrain: { value: 0.04 }, uGlitch: { value: 0 },
      uSeed: { value: 0 }, uRes: { value: new THREE.Vector2(1, 1) }, uAspect: { value: 1 },
    },
    vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `
uniform sampler2D tDiffuse; uniform float uTime, uGrain, uGlitch, uSeed, uAspect; uniform vec2 uRes;
varying vec2 vUv;
float hash(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
void main() {
  vec2 uv = vUv;
  float split = 0.0;
  if (uGlitch > 0.0) {
    float band = floor(uv.y * mix(14.0, 38.0, hash(vec2(uSeed, 3.1))));
    float r = hash(vec2(band, uSeed));
    if (r > 0.55) uv.x += (hash(vec2(band * 1.7, uSeed + 1.0)) - 0.5) * 0.09 * uGlitch;
    split = 0.012 * uGlitch * (0.5 + hash(vec2(band, uSeed + 7.0)));
  }
  vec2 c = uv - 0.5;
  float e2 = dot(c * vec2(uAspect, 1.0), c * vec2(uAspect, 1.0));
  vec2 ca = c * (0.0045 * smoothstep(0.08, 0.5, e2)) + vec2(split, 0.0);
  vec4 g = texture2D(tDiffuse, uv);
  float rr = texture2D(tDiffuse, uv + ca).r;
  float bb = texture2D(tDiffuse, uv - ca).b;
  vec3 col = vec3(rr, g.g, bb);
  float vig = smoothstep(0.95, 0.25, length(c * vec2(min(uAspect, 1.4), 1.0)) * 1.05);
  col *= mix(0.42, 1.0, vig);
  // grain in a perceptual space so the void doesn't sparkle
  vec3 s = pow(max(col, 0.0), vec3(1.0 / 2.2));
  float n = hash(floor(vUv * uRes) + fract(uTime * 7.31) * 517.0) - 0.5;
  s += n * uGrain * 2.0;
  col = pow(max(s, 0.0), vec3(2.2));
  gl_FragColor = vec4(col, 1.0);
}`,
  });
  composer.addPass(post);
  composer.addPass(new OutputPass());
}

// ---------------------------------------------------------------- framing / camera
const frameState = { mode: 'full', cx: 0, cy: 0, d: 4.3, zoom: 1, init: false };
const D_MIN = 3.4;          // never closer than this (keeps the portrait-lens perspective); tighter crops zoom instead
let frameOverride = null;   // dev-only (_frame)
let posePin = null;         // dev-only (_pose): pins morph influences
function regionFor(w, h) {
  const RX = F.RX;
  if (frameOverride === 'eyes') return { mode: 'eyes', x0: 40, x1: RX - 40, y0: 150, y1: 225 };
  if (frameOverride === 'mouth') return { mode: 'mouth', x0: 70, x1: RX - 70, y0: 240, y1: 360 };
  if (h < 140) return { mode: 'eyes', x0: 52, x1: RX - 52, y0: 160, y1: 214 };
  if (w / h > 1.05) return { mode: 'head', x0: 8, x1: RX - 8, y0: 2, y1: 392 };
  return { mode: 'full', x0: 0, x1: RX, y0: -8, y1: 470 };
}
function updateFraming(dt, snap) {
  if (!camera) return;
  const w = canvas.clientWidth || 1, h = canvas.clientHeight || 1;
  const R = regionFor(w, h);
  const k = F.k, t = Math.tan((FOV / 2) * DEG);
  const rw = (R.x1 - R.x0) * k, rh = (R.y1 - R.y0) * k;
  let d = Math.max(rh / (2 * t), rw / (2 * t * camera.aspect)) * 1.02;
  const minutes = CG.session?.minutes?.() || 0;
  d *= 1 - Math.min(0.2, 0.03 * (minutes / 10));   // dolly in 3% per 10 minutes
  let zoom = 1;
  if (d < D_MIN) { zoom = D_MIN / d; d = D_MIN; }
  const cx = ((R.x0 + R.x1) / 2 - F.RX / 2) * k, cy = (REF_H / 2 - (R.y0 + R.y1) / 2) * k;
  const tau = snap || !frameState.init || CG.reduceMotion() ? 0 : 0.25;
  frameState.cx = damp(frameState.cx, cx, tau, dt);
  frameState.cy = damp(frameState.cy, cy, tau, dt);
  frameState.d = damp(frameState.d, d, tau, dt);
  const z0 = frameState.zoom;
  frameState.zoom = damp(frameState.zoom, zoom, tau, dt);
  if (Math.abs(frameState.zoom - z0) > 1e-5 || camera.zoom !== frameState.zoom) { camera.zoom = frameState.zoom; camera.updateProjectionMatrix(); }
  frameState.init = true;
  frameState.mode = R.mode;
  const zRef = 0.25;
  camera.position.set(frameState.cx, frameState.cy, zRef + frameState.d);
  camera.lookAt(frameState.cx, frameState.cy, zRef);
}
function onResize() {
  if (!renderer) return;
  const w = Math.max(1, canvas.clientWidth), h = Math.max(1, canvas.clientHeight);
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  renderer.setPixelRatio(dpr);
  renderer.setSize(w, h, false);
  composer.setPixelRatio(dpr);
  composer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  post.uniforms.uRes.value.set(w * dpr, h * dpr);
  post.uniforms.uAspect.value = w / h;
  updateFraming(0, true);
  if (!running && renderer) composer.render(0);
}

// ---------------------------------------------------------------- gaze targets
const ray = new THREE.Vector3();
function ndcToWorld(nx, ny, out) {
  ray.set(nx, ny, 0.5).unproject(camera).sub(camera.position).normalize();
  const zPlane = EYES.Left.center.z + 0.1 + GAZE_DIST;
  const t = (zPlane - camera.position.z) / (ray.z || -1e-6);
  return out.copy(camera.position).addScaledVector(ray, t);
}
function domNdc(el, fx, fy) {
  const r = el.getBoundingClientRect(), c = canvas.getBoundingClientRect();
  if (!r.width && !r.height) return null;
  const x = r.left + r.width * fx, y = r.top + r.height * fy;
  return [((x - c.left) / (c.width || 1)) * 2 - 1, -(((y - c.top) / (c.height || 1)) * 2 - 1)];
}
function chatIsBelow() {
  const chat = document.getElementById('chat-panel');
  if (!chat || !panel) return false;
  const a = panel.getBoundingClientRect(), b = chat.getBoundingClientRect();
  return b.top >= a.bottom - 2 && b.left < a.right;
}
function namedTarget(name, out, fx = 0.25, fy = 0.5) {
  if (name === 'camera') return out.copy(camera.position);
  if (name === 'cursor') return ndcToWorld(B.ptr.nx, B.ptr.ny, out);
  let el = null;
  if (name === 'composer') el = document.querySelector('#chat-panel textarea');
  if (name === 'reply') {
    const all = document.querySelectorAll('#chat-panel .msg.assistant');
    el = all.length ? all[all.length - 1] : null;
    if (el) { const r = el.getBoundingClientRect(); if (r.bottom > innerHeight) fy = clamp((innerHeight - 40 - r.top) / (r.height || 1), 0.05, 1); }
    if (!el) el = document.querySelector('#chat-panel textarea');
  }
  const ndc = el && domNdc(el, fx, fy);
  if (ndc) return ndcToWorld(ndc[0], ndc[1], out);
  return chatIsBelow() ? ndcToWorld(0.1, -1.9, out) : ndcToWorld(1.9, -0.5, out);
}
function anglesTarget(yaw, pitchUp, out) {
  const fc = faceCenter();
  return out.set(fc.x + Math.sin(yaw) * Math.cos(pitchUp) * 2, fc.y + Math.sin(pitchUp) * 2, fc.z + Math.cos(yaw) * Math.cos(pitchUp) * 2);
}
const _fc = new THREE.Vector3();
function faceCenter() { return _fc.copy(EYES.Left.center).add(EYES.Right.center).multiplyScalar(0.5); }

// ---------------------------------------------------------------- behaviour
const G = {
  tgt: new THREE.Vector3(), prevDir: new THREE.Vector3(0, 0, 1), name: 'boot',
  nextSacc: 0, wy: 0, wp: 0, side: 1, nextCam: 0, camUntil: 0, nextFlick: 0, flickUntil: 0,
  readFx: 0.3, readFy: 0.9, nextRead: 0, nextJit: 0, override: null, overrideUntil: 0, script: null,
  instant: false, eyesLockUntil: 0,
};
const H = { yaw: { x: 0, v: 0 }, pitch: { x: 0, v: 0 }, roll: { x: 0, v: 0 }, ox: { x: 0, v: 0 }, oy: { x: 0, v: 0 }, oz: { x: 0, v: 0 }, still: 0, snapUntil: 0, snapT: null, leanUntil: 0, nod: 0 };
const BL = { next: 0, start: -1, offL: 0, offR: 0, slow: false, pendingDouble: false, lids: { x: 1, v: 0 } };
const EX = Object.fromEntries(MORPHS.map((m) => [m, { x: 0, v: 0 }]));
const SM = { next: 0, until: 0, kind: null, forced: false, l: 0, r: 0, sq: 0 };
const JAW = { kick: 0, tokens: 0 };
const GL = { until: 0, jitterUntil: 0 };

function deriveState(now) {
  if (B.forced) return B.forced;
  if (!B.awake) return 'boot';
  if (B.away) return 'away';
  if (B.stare) return 'stare';
  if (B.plead && now < B.pleadUntil) return 'pleading';
  if (B.plead && now >= B.pleadUntil) B.plead = false;
  if (B.gen === 'thinking') return 'thinking';
  if (B.gen === 'streaming') return 'streaming';
  if (B.typing && now - B.typeAt < 4) return 'typing';
  if (now - B.backAt < 6 && B.lastInput < B.backAt) return 'away';
  const watching = B.ptr.has && (!B.ptr.inside || now - B.ptr.t < 8);
  if (B.sincere) return watching ? 'watching' : 'sincere';
  return watching ? 'watching' : 'idle';
}

function setStatus(text) {
  if (text === lastStatus || !statusEl) return;
  lastStatus = text;
  statusEl.textContent = text;
}

function triggerBlink(now, slow) {
  if (BL.start >= 0 && now - BL.start < 0.35) return;
  BL.start = now;
  BL.slow = !!slow;
  const off = rand(0, 0.02);
  if (chance(0.5)) { BL.offL = off; BL.offR = 0; } else { BL.offL = 0; BL.offR = off; }
  BL.pendingDouble = !slow && chance(0.15);
}
function blinkCurve(t, slow) {
  const s = slow ? 2.1 : 1, c = 0.07 * s, h = 0.03 * s, o = 0.12 * s;
  if (t < 0) return 0;
  if (t < c) { const x = t / c; return x * x; }
  if (t < c + h) return 1;
  if (t < c + h + o) { const x = (t - c - h) / o; return 1 - (1 - (1 - x) * (1 - x)); }
  return 0;
}
function blinkSuppressed(now, state) {
  return state === 'stare' || SM.kind === 'wrong' || state === 'boot';
}

function chooseGaze(state, now) {
  const out = G.tgt;
  if (G.override && now < G.overrideUntil) return [namedTarget(G.override, out), G.override];
  if (G.eyesLockUntil > now || SM.kind === 'wrong') return [namedTarget('camera', out), 'camera'];
  if (G.script) {
    const step = G.script.find((s) => now < s.until);
    if (step) return [namedTarget(step.target, out), step.target];
    G.script = null;
  }
  switch (state) {
    case 'boot': return [anglesTarget(0, -6 * DEG, out), 'down'];
    case 'stare': case 'pleading': case 'away': return [namedTarget('camera', out), 'camera'];
    case 'typing': {
      if (now > G.nextRead) { G.readFx = rand(0.12, 0.45); G.nextRead = now + rand(0.4, 1.2); }
      return [namedTarget('composer', out, G.readFx, 0.5), 'composer'];
    }
    case 'watching': return [namedTarget('cursor', out), 'cursor'];
    case 'thinking': {
      if (now > G.nextSacc) {
        if (chance(0.3)) G.side = -G.side;
        G.wy = G.side * rand(8, 22) * DEG; G.wp = rand(6, 17) * DEG;
        G.nextSacc = now + rand(0.18, 0.6);
      }
      return [anglesTarget(G.wy, G.wp, out), 'think'];
    }
    case 'streaming': {
      if (now > G.nextFlick) { G.flickUntil = now + rand(0.35, 0.7); G.nextFlick = now + rand(2.6, 3.6); }
      if (now < G.flickUntil) return [namedTarget('camera', out), 'camera'];
      if (now > G.nextRead) { G.readFx = rand(0.08, 0.75); G.readFy = rand(0.7, 0.97); G.nextRead = now + rand(0.22, 0.5); }
      return [namedTarget('reply', out, G.readFx, G.readFy), 'reply'];
    }
    default: {   // idle / sincere: wander with camera checks
      const calm = state === 'sincere';
      if (now > G.nextCam) { G.camUntil = now + (calm ? rand(2, 4) : rand(1, 2.5)); G.nextCam = now + (calm ? rand(6, 12) : rand(10, 20)); }
      if (now < G.camUntil) return [namedTarget('camera', out), 'camera'];
      if (now > G.nextSacc) {
        if (chance(0.45)) { G.wy += rand(-4, 4) * DEG; G.wp += rand(-3, 3) * DEG; }
        else { G.wy = rand(-18, 18) * DEG * (calm ? 0.6 : 1); G.wp = rand(-10, 6) * DEG * (calm ? 0.6 : 1); }
        G.wy = clamp(G.wy, -22 * DEG, 22 * DEG); G.wp = clamp(G.wp, -12 * DEG, 8 * DEG);
        G.nextSacc = now + (calm ? rand(1.2, 4) : rand(0.5, 3));
      }
      return [anglesTarget(G.wy, G.wp, out), 'wander'];
    }
  }
}

function eyeAngles(eye, target) {
  headInv.copy(headM).invert();
  tmpV.copy(target).applyMatrix4(headInv).sub(eye.center);
  let yaw = Math.atan2(tmpV.x, tmpV.z);
  let pitch = Math.atan2(-tmpV.y, Math.hypot(tmpV.x, tmpV.z));
  const m = Math.hypot(yaw, pitch);
  if (m > LIM.eye) { yaw *= LIM.eye / m; pitch *= LIM.eye / m; }
  return [yaw, pitch];
}

function tick(dt, now) {
  const state = deriveState(now);
  if (state !== B.state) onStateChange(B.state, state, now);
  B.state = state;
  setStatus(STATUS[state] ?? '');
  const rm = CG.reduceMotion();

  // ---- 2/3. gaze target + saccades
  const [tgt, tname] = chooseGaze(state, now);
  const fc = faceCenter();
  // targets are cast close to the face for angular range; push them out along the same direction so the
  // two eyes don't converge into a cross-eyed squint (the camera is already at a natural distance)
  if (tname !== 'camera') {
    tmpV2.copy(tgt).sub(fc);
    const dist = tmpV2.length();
    if (dist < 3.4) tgt.copy(fc).addScaledVector(tmpV2.normalize(), 3.4);
  }
  tmpV2.copy(tgt).sub(fc).normalize();
  const shift = Math.acos(clamp(tmpV2.dot(G.prevDir), -1, 1));
  if (shift > 15 * DEG && !blinkSuppressed(now, state) && B.awake) triggerBlink(now);
  G.prevDir.copy(tmpV2);
  G.name = tname;
  const still = state === 'stare';
  const locked = still || SM.kind === 'wrong' || tname === 'camera';
  if (now > G.nextJit) {
    for (const s of ['Left', 'Right']) { EYES[s].jy = 0; EYES[s].jp = 0; }
    const j = locked ? (still ? 0 : 0.25) : 1;
    const jy = rand(-0.5, 0.5) * DEG * j, jp = rand(-0.5, 0.5) * DEG * j;
    EYES.Left.jy = EYES.Right.jy = jy; EYES.Left.jp = EYES.Right.jp = jp;
    G.nextJit = now + rand(0.25, 0.9);
  }

  // ---- 1. head: follows the gaze at ~40% on a lagging spring, plus breathing / sway
  const gy = Math.atan2(tgt.x - fc.x, tgt.z - fc.z);
  const gp = Math.atan2(-(tgt.y - fc.y), Math.hypot(tgt.x - fc.x, tgt.z - fc.z));
  let hy = 0.4 * gy, hp = 0.4 * gp, hr = 0, ox = 0, oy = 0, oz = 0;
  const below = chatIsBelowCached(now);
  if (state === 'typing') { if (below) hp += 5 * DEG; else { hr -= 5 * DEG; hy += 2 * DEG; } }
  if (state === 'pleading') { hp += 4 * DEG; oz += 0.05; }
  if (state === 'thinking') { hy = H.yaw.x; hp = H.pitch.x; hr = H.roll.x; }

const icon = (name, size = 18) =>
  `<svg class="ico" viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${ICONS[name]}</svg>`;

// Tiny element builder: h('div', {class, onclick, html, ...attrs}, ...children)
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  el.append(...kids.flat().filter((c) => c != null && c !== false));
  return el;
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch {}
  const prev = document.activeElement;
  const t = h('textarea', { style: 'position:fixed;opacity:0', readonly: true });
  t.value = text;
  document.body.append(t);
  t.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch {}
  t.remove();
  prev?.focus?.();
  return ok;
}

function relTime(ts) {
  const s = Math.max(0, (Date.now() - ts) / 1000);
  if (s < 60) return 'Just now';
  const rtf = new Intl.RelativeTimeFormat(undefined, { numeric: 'auto' });
  const text = s < 3600 ? rtf.format(-Math.floor(s / 60), 'minute')
    : s < 86400 ? rtf.format(-Math.floor(s / 3600), 'hour')
    : s < 7 * 86400 ? rtf.format(-Math.floor(s / 86400), 'day')
    : new Date(ts).toLocaleDateString(undefined, { dateStyle: 'medium' });
  return text.replace(/^./, (c) => c.toUpperCase());
}

// ---------- markdown ----------
const hlCache = new Map();
function highlight(code, lang) {
  const key = lang + '\n' + code;
  let out = hlCache.get(key);
  if (out == null) {
    try {
      out = lang && hljs.getLanguage(lang)
        ? hljs.highlight(code, { language: lang, ignoreIllegals: true }).value
        : CG.util.escapeHtml(code);
    } catch { out = CG.util.escapeHtml(code); }
    if (hlCache.size > 300) hlCache.clear();
    hlCache.set(key, out);
  }
  return out;
}

// Code blocks get a header + Copy button and highlighting; tables scroll; links open in a new tab.
function decorate(root) {
  for (const pre of root.querySelectorAll('pre')) {
    const code = pre.querySelector('code') || pre.appendChild(document.createElement('code'));
    const lang = ((/language-([\w+#.-]+)/.exec(code.className) || [])[1] || '').toLowerCase();
    code.innerHTML = highlight(code.textContent, lang);
    code.className = 'hljs' + (lang ? ' language-' + lang : '');
    const block = h('div', { class: 'code-block' },
      h('div', { class: 'code-head' },
        h('span', { class: 'code-lang' }, lang || 'code'),
        h('button', { class: 'code-copy', type: 'button', html: icon('copy', 14) + '<span>Copy</span>' })));
    pre.replaceWith(block);
    block.append(pre);
  }
  for (const table of root.querySelectorAll('table')) {
    const wrap = h('div', { class: 'table-wrap' });
    table.replaceWith(wrap);
    wrap.append(table);
  }
  for (const a of root.querySelectorAll('a[href]')) {
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
  }
}

// Deepest element where the streaming cursor should sit (end of the last text block).
function tail(root) {
  let n = root, c;
  while ((c = n.lastElementChild) && /^(UL|OL|LI|BLOCKQUOTE|TABLE|THEAD|TBODY|TR|TD|TH|P|H[1-6]|PRE|DIV)$/.test(c.tagName)) n = c;
  return n.tagName === 'PRE' ? n.querySelector('code') || n : n;
}

// Unclosed code fences need no help: marked renders them as code through to the end of the text.
function toFragment(md, streaming) {
  if (streaming) md = md.replace(/(^|\n) {0,3}[`~]{1,2}$/, '$1'); // half-typed fence marker
  let html;
  try { html = DOMPurify.sanitize(marked.parse(md, { gfm: true, breaks: true, async: false }), PURIFY); }
  catch { html = '<p>' + CG.util.escapeHtml(md) + '</p>'; }
  const tpl = document.createElement('template');
  tpl.innerHTML = html;
  decorate(tpl.content);
  if (streaming) tail(tpl.content).append(h('span', { class: 'cursor', 'aria-hidden': 'true' }));
  return tpl.content;
}

const render = (el, md, streaming) => el.replaceChildren(toFragment(md, streaming));

// ---------- state ----------
let panel, scroller, msgs, composerEl, sendBtn, newBtn, historyBtn, quipEl, scrimEl, drawerEl, histList, toastsEl;
let chat = blankChat();
let generating = false;
let erasing = false;
let quip = DEFAULT_QUIP;
let ready = null;
let saving = Promise.resolve();
const pending = new Map(); // in-progress assistant msgId -> { dead, raf, text }
let modal = null;          // { back, restore }
let drawerOpen = false;
let drawerRestore = null;
let toastTimer = 0;

function blankChat() {
  return { id: CG.util.uid(), title: '', created: Date.now(), updated: Date.now(), messages: [] };
}

// ---------- persistence ----------
// Writes are serialised; empty chats are never stored.
function save() {
  if (erasing) return;
  const c = chat;
  saving = saving
    .then(() => (c.messages.length ? CG.store.putChat(c) : CG.store.deleteChat(c.id)))
    .catch((e) => console.warn('[chat] save failed', e));
}

function pushMessage(msg) {
  if (!chat.messages.length) chat.created = Date.now();
  chat.messages.push(msg);
}

// ---------- scrolling / view state ----------
const nearBottom = () => scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 80;
const toBottom = () => { scroller.scrollTop = scroller.scrollHeight; };
const syncEmpty = () => panel.classList.toggle('is-empty', !msgs.children.length);
const syncMotion = () => panel.classList.toggle('rm', CG.reduceMotion());
const syncPending = () => scroller.setAttribute('aria-busy', String(pending.size > 0));
const elOf = (id) => msgs.querySelector(`[data-id="${CSS.escape(id)}"]`);

function syncSend() {
  const mode = generating ? 'stop' : 'send';
  if (sendBtn.dataset.mode !== mode) {
    sendBtn.dataset.mode = mode;
    sendBtn.innerHTML = icon(generating ? 'stop' : 'arrowUp');
    sendBtn.setAttribute('aria-label', generating ? 'Stop generating' : 'Send message');
    sendBtn.title = generating ? 'Stop generating' : 'Send message';
  }
  sendBtn.disabled = !generating && !composerEl.value.trim();
}

function autosize() {
  composerEl.style.height = 'auto';
  const full = composerEl.scrollHeight;
  composerEl.style.height = Math.min(full, MAX_INPUT) + 'px';
  composerEl.style.overflowY = full > MAX_INPUT ? 'auto' : 'hidden';
}

// Only the latest, non-scripted assistant message shows Regenerate (and never while a reply streams).
function refreshActions() {
  const last = [...chat.messages].reverse().find((m) => m.role === 'assistant');
  for (const b of msgs.querySelectorAll('.act-regen')) {
    b.hidden = !(last && b.closest('.msg').dataset.id === last.id && !pending.size);
  }
}

// ---------- messages ----------
function appendMsg(el, force = false) {
  const stick = force || nearBottom();
  if (!CG.reduceMotion()) {
    el.classList.add('enter');
    el.addEventListener('animationend', () => el.classList.remove('enter'), { once: true });
  }
  msgs.append(el);
  syncEmpty();
  if (stick) toBottom();
}

const userEl = (msg) =>
  h('div', { class: 'msg user', 'data-id': msg.id, role: 'article', 'aria-label': 'You' }, h('div', { class: 'bubble' }, msg.content));

const assistantEl = (msg) =>
  h('div', { class: 'msg assistant', 'data-id': msg.id, role: 'article', 'aria-label': 'CHASE' }, h('div', { class: 'content' }));

function finishedEl(msg) {
  if (msg.role === 'user') return userEl(msg);
  const el = assistantEl(msg);
  render(el.firstChild, msg.content, false);
  el.append(buildActions(msg));
  return el;
}

function buildActions(msg) {
  const btn = (cls, ico, label, onclick) =>
    h('button', { class: 'act ' + cls, type: 'button', title: label, 'aria-label': label, html: icon(ico, 16), onclick });
  const copy = btn('act-copy', 'copy', 'Copy', async () => {
    if (!(await copyText(msg.content))) return;
    copy.innerHTML = icon('check', 16);
    setTimeout(() => (copy.innerHTML = icon('copy', 16)), 1500);
  });
  const regen = msg.scripted ? null : btn('act-regen', 'refresh', 'Regenerate', () => {
    if (!generating) CG.bus.emit('chat:regenerate', { msgId: msg.id });
  });
  if (regen) regen.hidden = true;
  const up = btn('act-up', 'up', 'Good response', () => rate('up'));
  const down = btn('act-down', 'down', 'Bad response', () => rate('down'));
  const showRating = () => {
    up.setAttribute('aria-pressed', msg.feedback === 'up');
    down.setAttribute('aria-pressed', msg.feedback === 'down');
  };
  const rate = (value) => {
    if (msg.feedback === value) return;
    msg.feedback = value;
    showRating();
    save();
    CG.bus.emit('chat:feedback', { msgId: msg.id, value });
  };
  showRating();
  return h('div', { class: 'actions', role: 'group', 'aria-label': 'Message actions' }, copy, regen, up, down);
}

function addUser(text) {
  const msg = { id: CG.util.uid(), role: 'user', content: text, ts: Date.now() };
  pushMessage(msg);
  appendMsg(userEl(msg), true);
  refreshActions();
  save();
}

const staticHandle = (msg, el) => ({ id: msg.id, el, contentEl: el.firstChild, setText() {}, finish() {} });

function addAssistant(markdown, opts = {}) {
  const msg = { id: CG.util.uid(), role: 'assistant', content: String(markdown ?? ''), ts: Date.now() };
  if (opts.scripted) msg.scripted = true;
  pushMessage(msg);
  const el = finishedEl(msg);
  appendMsg(el);
  refreshActions();
  save();
  return staticHandle(msg, el);
}

function beginAssistant({ prefix = '' } = {}) {
  const msg = { id: CG.util.uid(), role: 'assistant', content: '', ts: Date.now() };
  const el = assistantEl(msg);
  const contentEl = el.firstChild;
  const st = { dead: false, done: false, raf: 0, text: '' };
  const full = (t) => (prefix ? (t ? prefix.trimEnd() + '\n\n' + t : prefix) : t);
  const paint = () => {
    st.raf = 0;
    if (st.dead) return;
    const stick = nearBottom();
    render(contentEl, full(st.text), true);
    if (stick) toBottom();
  };
  pending.set(msg.id, st);
  syncPending();
  refreshActions();
  appendMsg(el);
  render(contentEl, full(''), true);

  return {
    id: msg.id,
    el,
    contentEl,
    setText(text) {
      if (st.dead || st.done) return;
      st.text = String(text ?? '');
      if (!st.raf) st.raf = requestAnimationFrame(paint);
    },
    finish(finalText = st.text) {
      if (st.dead || st.done) return;
      st.done = true;
      cancelAnimationFrame(st.raf);
      pending.delete(msg.id);
      msg.content = full(String(finalText ?? ''));
      const stick = nearBottom();
      render(contentEl, msg.content, false);
      // Keep stored order equal to on-screen order (scripted lines may have landed meanwhile).
      const ids = new Set(chat.messages.map((m) => m.id));
      let at = 0;
      for (const c of msgs.children) { if (c === el) break; if (ids.has(c.dataset.id)) at++; }
      chat.messages.splice(at, 0, msg);
      el.append(buildActions(msg));
      syncPending();
      refreshActions();
      if (stick) toBottom();
      save();
    },
  };
}

function removeMessage(msgId) {
  const st = pending.get(msgId);
  if (st) { st.dead = true; cancelAnimationFrame(st.raf); pending.delete(msgId); syncPending(); }
  elOf(msgId)?.remove();
  const i = chat.messages.findIndex((m) => m.id === msgId);
  if (i >= 0) { chat.messages.splice(i, 1); save(); }
  refreshActions();
  syncEmpty();
}

function setChat(rec) {
  for (const st of pending.values()) { st.dead = true; cancelAnimationFrame(st.raf); }
  pending.clear();
  chat = rec;
  msgs.replaceChildren(...rec.messages.map(finishedEl));
  syncPending();
  syncEmpty();
  refreshActions();
  toBottom();
}

async function restore() {
  try {
    const [latest] = await CG.store.listChats();
    const rec = latest && (await CG.store.getChat(latest.id));
    if (rec && !chat.messages.length && !pending.size) setChat({ ...rec, messages: rec.messages || [] });
  } catch (e) { console.warn('[chat] restore failed', e); }
}

function setTitle(chatId, title) {
  title = String(title ?? '').trim();
  if (!title) return Promise.resolve();
  const done = (async () => {
    if (chat.id === chatId) { chat.title = title; save(); return; }
    await saving;
    const rec = await CG.store.getChat(chatId);
    if (rec) await CG.store.putChat({ ...rec, title });
  })().catch((e) => console.warn('[chat] setTitle failed', e));
  return done.then(() => drawerOpen && renderHistory());
}

// ---------- composer ----------
let typing = false;
let lastTyping = 0;
let idleTimer = 0;

function noteTyping() {
  const now = performance.now();
  if (now - lastTyping >= 150) { lastTyping = now; CG.bus.emit('composer:typing'); }
  typing = true;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(endTyping, 1500);
}

function endTyping() {
  clearTimeout(idleTimer);
  if (typing) { typing = false; CG.bus.emit('composer:idle'); }
}

function send(raw, fromComposer = false) {
  const text = raw.trim();
  if (!text || generating || erasing) return;
  addUser(text);
  if (fromComposer) { composerEl.value = ''; autosize(); syncSend(); endTyping(); }
  CG.bus.emit('chat:submit', { text });
}

function onKey(e) {
  if (e.key !== 'Enter' || e.shiftKey || e.isComposing || e.keyCode === 229) return;
  e.preventDefault();
  send(composerEl.value, true);
}

function setGenerating(v) {
  generating = !!v;
  CG.session.generating = generating;
  panel?.classList.toggle('busy', generating);
  if (sendBtn) syncSend();
}

// Mobile: body.kb-open while the composer is focused and the visual viewport has shrunk by >150px.
function watchKeyboard() {
  const vv = window.visualViewport;
  if (!vv) return;
  const mobile = matchMedia('(max-width: 767px)');
  let base = vv.height;
  let focused = false;
  const apply = (resized) => {
    if (resized && !focused) base = vv.height;
    const open = mobile.matches && focused && base - vv.height > 150;
    document.body.classList.toggle('kb-open', open);
    document.documentElement.style.setProperty('--vvh', open ? vv.height + 'px' : '');
  };
  vv.addEventListener('resize', () => apply(true));
  composerEl.addEventListener('focus', () => { focused = true; apply(false); });
  composerEl.addEventListener('blur', () => { focused = false; apply(false); });
}

// ---------- history drawer ----------
async function renderHistory() {
  await saving;
  let rows = [];
  try { rows = await CG.store.listChats(); } catch (e) { console.warn(e); }
  histList.replaceChildren(...(rows.length ? rows.map(histRow) : [h('li', { class: 'cg-hist-empty' }, 'No chats yet. Say something.')]));
}

function histRow(c) {
  const name = c.title || 'Untitled';
  const current = c.id === chat.id;
  return h('li', { class: 'cg-hist-row' + (current ? ' current' : '') },
    h('button', { class: 'cg-hist-main', type: 'button', 'aria-current': current ? 'true' : null, onclick: () => openChat(c.id) },
      h('span', { class: 'cg-hist-title' }, name),
      h('span', { class: 'cg-hist-time' }, relTime(c.updated))),
    h('button', { class: 'cg-hist-del', type: 'button', title: 'Delete', 'aria-label': 'Delete chat: ' + name, html: icon('trash', 16), onclick: () => deleteFromHistory(c.id) }));
}

async function openChat(id) {
  if (generating) return;
  if (id === chat.id) return closeDrawer();
  await saving;
  const rec = await CG.store.getChat(id).catch(() => null);
  if (!rec || generating) return renderHistory();
  setChat({ ...rec, messages: rec.messages || [] });
  closeDrawer();
  CG.bus.emit('chat:switch', { id });
}

async function deleteFromHistory(id) {
  if (generating && id === chat.id) return;
  await saving;
  try { await CG.store.deleteChat(id); } catch (e) { console.warn(e); }
  if (id === chat.id) startFresh();
  renderHistory();
}

function openDrawer() {
  closeModal(false);
  drawerRestore = document.activeElement;
  drawerOpen = true;
  drawerEl.classList.add('open');
  scrimEl.classList.add('open');
  historyBtn.setAttribute('aria-expanded', 'true');
  drawerEl.querySelector('.cg-x').focus({ preventScroll: true });
  return renderHistory();
}

function closeDrawer(refocus = true) {
  if (!drawerOpen) return;
  drawerOpen = false;
  drawerEl.classList.remove('open');
  scrimEl.classList.remove('open');
  historyBtn.setAttribute('aria-expanded', 'false');
  if (refocus) drawerRestore?.focus?.();
}

function startFresh() {
  setChat(blankChat());
  setEmptyQuip(DEFAULT_QUIP);
  CG.bus.emit('chat:new');
}

function newChat() {
  if (generating || erasing) return;
  closeDrawer(false);
  startFresh();
  if (!matchMedia('(max-width: 767px)').matches) composerEl.focus();
}

// ---------- modals ----------
function trapTab(e) {
  if (e.key !== 'Tab') return;
  const items = [...e.currentTarget.querySelectorAll('button:not([disabled]), a[href], [tabindex]:not([tabindex="-1"])')]
    .filter((el) => el.getClientRects().length);
  if (!items.length) return;
  const first = items[0], last = items[items.length - 1], active = document.activeElement;
  if (e.shiftKey && (active === first || active === e.currentTarget)) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && active === last) { e.preventDefault(); first.focus(); }
}

function openModal(title, body) {
  const restore = modal ? modal.restore : document.activeElement;
  modal?.back.remove();
  closeDrawer(false);
  const tid = 'cg-m-' + CG.util.uid();
  const dialog = h('div', { class: 'cg-dialog', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': tid, tabindex: '-1', onkeydown: trapTab },
    h('div', { class: 'cg-dlg-head' },
      h('h2', { id: tid }, title),
      h('button', { class: 'cg-x', type: 'button', 'aria-label': 'Close', html: icon('x'), onclick: () => closeModal() })),
    body);
  const back = h('div', { class: 'cg-modal', onpointerdown: (e) => { if (e.target === back) closeModal(); } }, dialog);
  modal = { back, restore };
  panel.append(back);

  toastsEl.replaceChildren(t);

  toastTimer = setTimeout(() => {
    t.classList.remove('show');
    setTimeout(() => t.remove(), 250);

// ---------- init ----------
function build() {
  panel = document.getElementById('chat-panel');

  sendBtn = h('button', { class: 'cg-send', type: 'button', onclick: () => (generating ? CG.bus.emit('chat:stop') : send(composerEl.value, true)) });
  const foot = h('footer', { class: 'cg-foot' },
    h('div', { class: 'cg-composer' }, composerEl, sendBtn),
    h('p', { class: 'cg-disclaimer' }, 'CHASEGPT can make mistakes. He knows. ', h('button', { class: 'cg-link', type: 'button', onclick: openAbout }, 'About')));

  histList = h('ul', { class: 'cg-hist' });
  scrimEl = h('div', { class: 'cg-scrim', onclick: () => closeDrawer() });
  drawerEl = h('aside', { class: 'cg-drawer', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'cg-hist-title', tabindex: '-1', onkeydown: trapTab },
    h('div', { class: 'cg-dr-head' },
      h('h2', { id: 'cg-hist-title' }, 'History'),
      h('button', { class: 'cg-x', type: 'button', 'aria-label': 'Close history', html: icon('x'), onclick: () => closeDrawer() })),
    histList);
  toastsEl = h('div', { class: 'cg-toasts', 'aria-live': 'polite' });

  panel.replaceChildren(topbar, scroller, foot, scrimEl, drawerEl, toastsEl);
  setEmptyQuip(quip);
  setGenerating(generating);
  syncMotion();
  syncEmpty();
}

function wire() {
  composerEl.addEventListener('input', (e) => { autosize(); syncSend(); if (e.isTrusted) noteTyping(); });
  composerEl.addEventListener('keydown', onKey);
  composerEl.addEventListener('blur', endTyping);
  msgs.addEventListener('click', async (e) => {
    const b = e.target.closest('.code-copy');
    if (!b || !(await copyText(b.closest('.code-block').querySelector('code').textContent))) return;
    const label = b.querySelector('span');
    label.textContent = 'Copied';
    setTimeout(() => (label.textContent = 'Copy'), 1500);
  });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape' || !(modal || drawerOpen)) return;

    if (modal) closeModal(); else closeDrawer();
  });
  CG.bus.on('settings:change', ({ key }) => { if (key === 'reduceMotion') syncMotion(); });
  matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change', syncMotion);
  watchKeyboard();
}

function init() {
  if (!ready) {
    build();
    wire();
    ready = restore();
  }
  return ready;
}

CG.chat = {

  beginAssistant,
  addAssistant,
  removeMessage,

  currentChat: () => chat,
  setTitle,
  setGenerating,
  isGenerating: () => generating,
  get composer() { return composerEl; },
  toast,
  setEmptyQuip,
  exchangeCount: () => chat.messages.filter((m) => m.role === 'user').length,
};
