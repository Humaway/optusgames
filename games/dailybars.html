<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Bars</title>
<meta name="description" content="Two daily Optus-themed puzzles: guess the mystery handset (Phonedle) and plan the towers (Coverage). Fan-made parody, not affiliated with Optus.">
<meta name="theme-color" content="#0B1416">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* ---------- Tokens (doc 7.2: parody colours, not official brand values) ---------- */
:root {
  color-scheme: dark;
  --bg: #0B1416; --surface: #13211F; --surface-2: #1a2c29; --text: #EAF2F1; --muted: #8fa5a2;
  --teal: #00A7A0; --yellow: #FFD100; --on-yellow: #1a1500;
  --hit: #2BB673; --close: #F2B233; --miss: #36423F; --clash: #E5484D;
  --line: rgba(234, 242, 241, .14); --line-strong: rgba(234, 242, 241, .5);
  --tile-ink: #fff; --tile-ink-miss: #cfdad8;
  --sub0: hsl(176 38% 26%); --sub1: hsl(38 32% 32%); --sub2: hsl(262 28% 36%); --sub3: hsl(106 24% 30%);
  --sub4: hsl(8 42% 36%); --sub5: hsl(205 42% 34%); --sub6: hsl(48 50% 30%); --sub7: hsl(336 34% 36%); --sub8: hsl(215 14% 34%);
  --grid-edge: #060b0c; --mark: rgba(234, 242, 241, .78); --shadow: 0 10px 30px rgba(0, 0, 0, .45); --tower: #f4fbfa;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #F6F8F8; --surface: #FFFFFF; --surface-2: #eaf0ef; --text: #0F1A19; --muted: #54706c;
    --teal: #00857F; --yellow: #E0B400; --on-yellow: #1a1500;
    --hit: #1E9E5E; --close: #D99A12; --miss: #C9D1CF; --clash: #D13438;
    --line: rgba(15, 26, 25, .14); --line-strong: rgba(15, 26, 25, .55);
    --tile-ink-miss: #1d2a28;
    --sub0: hsl(176 38% 76%); --sub1: hsl(38 50% 78%); --sub2: hsl(262 45% 82%); --sub3: hsl(106 34% 76%);
    --sub4: hsl(8 70% 80%); --sub5: hsl(205 62% 80%); --sub6: hsl(48 75% 74%); --sub7: hsl(336 55% 82%); --sub8: hsl(215 20% 78%);
    --grid-edge: #0F1A19; --mark: rgba(15, 26, 25, .75); --shadow: 0 10px 30px rgba(15, 26, 25, .18); --tower: #0F1A19;
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #F6F8F8; --surface: #FFFFFF; --surface-2: #eaf0ef; --text: #0F1A19; --muted: #54706c;
  --teal: #00857F; --yellow: #E0B400; --on-yellow: #1a1500;
  --hit: #1E9E5E; --close: #D99A12; --miss: #C9D1CF; --clash: #D13438;
  --line: rgba(15, 26, 25, .14); --line-strong: rgba(15, 26, 25, .55);
  --tile-ink-miss: #1d2a28;
  --sub0: hsl(176 38% 76%); --sub1: hsl(38 50% 78%); --sub2: hsl(262 45% 82%); --sub3: hsl(106 34% 76%);
  --sub4: hsl(8 70% 80%); --sub5: hsl(205 62% 80%); --sub6: hsl(48 75% 74%); --sub7: hsl(336 55% 82%); --sub8: hsl(215 20% 78%);
  --grid-edge: #0F1A19; --mark: rgba(15, 26, 25, .75); --shadow: 0 10px 30px rgba(15, 26, 25, .18); --tower: #0F1A19;
}
/* Colour-blind mode swaps green/yellow for blue/orange */
body.cb { --hit: #3B82F6; --close: #F97316; }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  min-height: 100vh; min-height: 100dvh; -webkit-tap-highlight-color: transparent;
  font-variant-numeric: tabular-nums;
}
h1, h2, h3, .display { font-family: "Space Grotesk", "Archivo", system-ui, sans-serif; letter-spacing: -.01em; margin: 0; }
button { font: inherit; color: inherit; }
a { color: var(--teal); }
:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; border-radius: 6px; }
.sr-only { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); }
.hidden { display: none !important; }

/* ---------- Layout ---------- */
#app { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }
.wrap { width: 100%; max-width: 520px; margin: 0 auto; padding: 0 16px; }
.wrap.wide { max-width: 720px; }
.topbar { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.topbar .wrap { display: flex; align-items: center; gap: 8px; min-height: 52px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 1.15rem; text-decoration: none; color: var(--text); }
.brand svg { width: 24px; height: 24px; }
.topbar .spacer { flex: 1; }
.iconbtn { width: 44px; height: 44px; display: inline-grid; place-items: center; border-radius: 12px; border: 0; background: transparent; cursor: pointer; font-size: 1.25rem; }
.iconbtn:hover { background: var(--surface); }
.screen { flex: 1; display: flex; flex-direction: column; padding-bottom: 24px; }
.footer { color: var(--muted); font-size: .78rem; text-align: center; padding: 20px 0 28px; }
.banner { background: color-mix(in srgb, var(--yellow) 18%, var(--surface)); border: 1px solid color-mix(in srgb, var(--yellow) 50%, transparent); border-radius: 12px; padding: 10px 14px; margin: 12px 0; font-size: .9rem; }
.banner button { margin-left: 8px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--surface); cursor: pointer; font-weight: 600; text-decoration: none; color: var(--text); }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--yellow); color: var(--on-yellow); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.teal { background: var(--teal); color: #fff; border-color: transparent; }
.btn.small { min-height: 44px; padding: 0 12px; font-size: .9rem; border-radius: 10px; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.chip { display: inline-block; font-size: .7rem; padding: 2px 8px; border-radius: 999px; background: var(--miss); color: var(--text); font-weight: 600; white-space: nowrap; }
.chip.teal { background: color-mix(in srgb, var(--teal) 30%, var(--surface)); }

/* ---------- Today ---------- */
.hero { padding: 22px 0 6px; }
.hero h1 { font-size: 1.9rem; line-height: 1.1; }
.hero p { margin: 6px 0 0; color: var(--muted); }
.cards { display: grid; gap: 14px; grid-template-columns: 1fr; margin: 16px 0; }
@media (min-width: 640px) { .cards { grid-template-columns: 1fr 1fr; } }
.card { display: flex; flex-direction: column; gap: 10px; padding: 18px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); text-decoration: none; color: var(--text); min-height: 150px; position: relative; overflow: hidden; }
.card:hover { border-color: var(--teal); }
.card .emoji { font-size: 2rem; }
.card h2 { font-size: 1.35rem; }
.card .meta { color: var(--muted); font-size: .9rem; }
.card .status { margin-top: auto; font-weight: 700; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.card.done { border-color: color-mix(in srgb, var(--hit) 60%, var(--line)); }
.card.missed { border-color: color-mix(in srgb, var(--clash) 50%, var(--line)); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--miss); display: inline-block; }
.dot.progress { background: var(--close); } .dot.solved { background: var(--hit); } .dot.missed { background: var(--clash); }
.streaks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 4px 0 8px; }
.streak { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; font-size: .78rem; color: var(--muted); }
.streak b { display: block; font-size: 1.6rem; color: var(--text); font-family: "Space Grotesk", system-ui, sans-serif; }
.streak.full { border-color: color-mix(in srgb, var(--yellow) 60%, var(--line)); }
.countdown { text-align: center; color: var(--muted); margin: 10px 0; }
.countdown b { color: var(--text); font-size: 1.1rem; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin: 12px 0; }
.signal { display: inline-flex; align-items: flex-end; gap: 2px; height: 16px; vertical-align: middle; }
.signal i { display: block; width: 4px; background: var(--miss); border-radius: 1px; }
.signal i.on { background: var(--teal); }

/* ---------- Game chrome ---------- */
.gamehead { display: flex; align-items: center; gap: 10px; padding: 12px 0 6px; }
.gamehead h1 { font-size: 1.25rem; }
.gamehead .sub { color: var(--muted); font-size: .85rem; }
.gamehead .grow { flex: 1; min-width: 0; }

/* ---------- Phonedle ---------- */
.hints { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 10px; }
.hintbtn { flex: 1 1 100px; min-height: 44px; border-radius: 12px; border: 1px dashed var(--line-strong); background: transparent; cursor: pointer; font-size: .85rem; padding: 6px 10px; text-align: left; }
.hintbtn[disabled] { opacity: .5; cursor: not-allowed; }
.hintbtn.open { border-style: solid; background: var(--surface); cursor: default; }
.hintbtn b { display: block; font-size: .78rem; color: var(--muted); font-weight: 600; }
.swatches { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.swatch { display: inline-flex; align-items: center; gap: 4px; font-size: .8rem; }
.swatch i { width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--line-strong); display: inline-block; }

.board { display: flex; flex-direction: column; gap: 8px; padding-bottom: 150px; }
.colheads { position: sticky; top: 52px; z-index: 10; display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; background: var(--bg); padding: 6px 0 4px; font-size: .62rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); text-align: center; font-weight: 700; }
.guessrow { display: flex; flex-direction: column; gap: 3px; }
.guessname { display: flex; align-items: center; gap: 6px; font-size: .82rem; font-weight: 600; min-height: 22px; }
.guessname svg { width: 14px; height: 20px; flex: none; }
.tiles { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.tile { aspect-ratio: 1 / 1.12; border-radius: 8px; background: var(--surface); border: 2px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; line-height: 1.1; padding: 1px; overflow: hidden; color: var(--tile-ink); transition: background-color .2s; }
.tile.empty { background: transparent; }
.tile .v { font-weight: 800; font-size: .72rem; white-space: nowrap; }
.tile .v.long { font-size: .58rem; letter-spacing: -.01em; }
.tile .m { font-size: .72rem; font-weight: 800; margin-top: 3px; opacity: .95; }
.tile.show.hit { background: var(--hit); border-color: transparent; }
.tile.show.close { background: var(--close); border-color: transparent; color: #1b1300; }
.tile.show.miss { background: var(--miss); border-color: transparent; color: var(--tile-ink-miss); }
body.contrast .tile.show { border: 2px solid var(--text); }
.tile:not(.show):not(.empty) { color: transparent; }
.tile.flipping { animation: flip .5s ease both; }
@keyframes flip { 0% { transform: rotateX(0); } 50% { transform: rotateX(90deg); } 100% { transform: rotateX(0); } }
.guessrow.win .tile.show { animation: bounce .6s ease both; animation-delay: calc(var(--i) * 70ms); }
@keyframes bounce { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-10px); } }
.guessrow.shake { animation: shake .35s; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.slots .tile { min-height: 0; }

.searchdock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: linear-gradient(to top, var(--bg) 70%, transparent); padding: 14px 0 calc(12px + env(safe-area-inset-bottom)); }
.search { position: relative; }
.search input { width: 100%; min-height: 50px; border-radius: 14px; border: 2px solid var(--line-strong); background: var(--surface); color: var(--text); padding: 0 16px; font-size: 1rem; }
.search input:focus { border-color: var(--teal); outline: none; }
.suggest { position: absolute; left: 0; right: 0; bottom: calc(100% + 6px); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 14px; box-shadow: var(--shadow); max-height: min(46vh, 340px); overflow: auto; list-style: none; margin: 0; padding: 4px; }
.suggest li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; cursor: pointer; min-height: 44px; }
.suggest li[aria-selected="true"], .suggest li:hover { background: var(--surface-2); }
.suggest li[aria-disabled="true"] { opacity: .4; cursor: not-allowed; }
.suggest li svg { width: 20px; height: 30px; flex: none; }
.suggest .nm { flex: 1; font-weight: 600; }
.searchdock .done-note { text-align: center; padding: 8px; }

/* ---------- Coverage ---------- */
.statusbar { min-height: 52px; margin: 0 0 6px; font-size: .92rem; display: flex; align-items: center; gap: 8px; }
.statusbar > span:first-child { flex: 1; min-width: 0; }
.statusbar.clash { color: var(--clash); font-weight: 700; }
.timer { margin-left: auto; font-weight: 700; color: var(--muted); font-size: .85rem; }
.cov-grid:focus-visible { outline: none; }
.gridwrap { width: min(calc(100vw - 8px), 460px); margin-left: 50%; transform: translateX(-50%); position: relative; touch-action: none; user-select: none; -webkit-user-select: none; }
.cov-grid { --n: 6; display: grid; grid-template-rows: repeat(var(--n), 1fr); border: 3px solid var(--grid-edge); border-radius: 8px; overflow: hidden; background: var(--grid-edge); }
.cov-row { display: grid; grid-template-columns: repeat(var(--n), 1fr); }
.cell { position: relative; aspect-ratio: 1; display: grid; place-items: center; cursor: pointer; border: 1px solid color-mix(in srgb, var(--grid-edge) 22%, transparent); font-size: 1rem; color: var(--mark); outline-offset: -3px; background-color: var(--c); }
.cell.bt { border-top: 2px solid var(--grid-edge); } .cell.br { border-right: 2px solid var(--grid-edge); }
.cell.bb { border-bottom: 2px solid var(--grid-edge); } .cell.bl { border-left: 2px solid var(--grid-edge); }
.cell.cursor { outline: 3px solid var(--yellow); z-index: 3; }
.cell.cov::after { content: ""; position: absolute; inset: 0; background: rgba(255, 255, 255, .17); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--teal) 55%, transparent); pointer-events: none; }
:root[data-theme="light"] .cell.cov::after { background: rgba(255, 255, 255, .42); }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .cell.cov::after { background: rgba(255, 255, 255, .42); } }
.cell .x { font-weight: 800; font-size: 1.1em; line-height: 1; }
.cell .x.auto { opacity: .35; font-weight: 600; }
.cell.hl { box-shadow: inset 0 0 0 3px var(--yellow); z-index: 2; animation: pulse 1.1s ease-in-out infinite; }
.cell.hltarget::before { content: ""; position: absolute; inset: 22%; border: 2px dashed var(--yellow); border-radius: 50%; }
@keyframes pulse { 50% { box-shadow: inset 0 0 0 3px color-mix(in srgb, var(--yellow) 40%, transparent); } }
.tower { width: 74%; height: 74%; color: var(--tower); filter: drop-shadow(0 0 1px var(--bg)) drop-shadow(0 1px 1px rgba(0, 0, 0, .35)); position: relative; z-index: 2; animation: drop .28s cubic-bezier(.2, .9, .3, 1.3) both; }
@keyframes drop { from { transform: translateY(-40%) scale(1.2); opacity: 0; } to { transform: none; opacity: 1; } }
.cell.tw.clash .tower { color: var(--clash); animation: clashpulse .7s ease-in-out infinite; }
.cell.tw.clash { background-image: radial-gradient(circle, color-mix(in srgb, var(--clash) 55%, transparent) 0, transparent 70%); }
@keyframes clashpulse { 50% { transform: scale(1.12); } }
.ring { position: absolute; left: 50%; top: 50%; width: 40%; height: 40%; margin: -20% 0 0 -20%; border: 2px solid var(--teal); border-radius: 50%; opacity: 0; pointer-events: none; z-index: 1; }
.cell.cov .ring { animation: ring 2.6s ease-out infinite; }
.cell.cov .ring.r2 { animation-delay: 1.3s; }
@keyframes ring { 0% { transform: scale(.6); opacity: .9; } 100% { transform: scale(3.2); opacity: 0; } }
.zap { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
.zap polyline { fill: none; stroke: var(--clash); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; filter: drop-shadow(0 0 3px var(--clash)); animation: crackle .25s steps(2) infinite; }
@keyframes crackle { 50% { opacity: .55; } }
.cov-grid.won .cell { transition: background-color .5s ease; transition-delay: calc(var(--d, 0) * 60ms); background-color: color-mix(in srgb, var(--teal) 55%, var(--c)); }
.cov-grid.won .cell.tw .ring { animation: ripple 1.4s ease-out both; animation-delay: calc(var(--k, 0) * 220ms); }
@keyframes ripple { 0% { transform: scale(.6); opacity: .95; } 100% { transform: scale(7); opacity: 0; } }
.legend { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; margin: 14px 0; font-size: .86rem; }
.legend button { display: flex; align-items: center; gap: 8px; background: none; border: 0; text-align: left; cursor: pointer; padding: 4px 2px; min-height: 44px; width: 100%; border-radius: 8px; }
.legend .sw { width: 18px; height: 18px; border-radius: 5px; border: 1px solid var(--line-strong); flex: none; background-color: var(--c); }
.legend .blurb { display: block; font-size: .72rem; color: var(--muted); }
.toolbar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 10px 0; }
.toolbar .btn { flex-direction: column; gap: 2px; min-height: 56px; padding: 4px; font-size: .78rem; }
.toolbar .btn .ic { font-size: 1.25rem; line-height: 1; }
.toolbar .btn[aria-pressed="true"] { background: color-mix(in srgb, var(--teal) 30%, var(--surface)); border-color: var(--teal); }
.hintpanel { background: var(--surface); border: 1px solid var(--line-strong); border-left: 5px solid var(--yellow); border-radius: 12px; padding: 10px 14px; margin: 8px 0; }
.hintpanel b { font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); display: block; }

/* Colour-blind patterns on suburbs */
body.cb .cell.p1 { background-image: radial-gradient(rgba(0, 0, 0, .35) 1.5px, transparent 2px); background-size: 8px 8px; }
body.cb .cell.p2 { background-image: repeating-linear-gradient(45deg, rgba(0, 0, 0, .28) 0 2px, transparent 2px 7px); }
body.cb .cell.p3 { background-image: repeating-linear-gradient(-45deg, rgba(0, 0, 0, .28) 0 2px, transparent 2px 7px); }
body.cb .cell.p4 { background-image: repeating-linear-gradient(0deg, rgba(0, 0, 0, .28) 0 2px, transparent 2px 7px); }
body.cb .cell.p5 { background-image: repeating-linear-gradient(90deg, rgba(0, 0, 0, .28) 0 2px, transparent 2px 7px); }
body.cb .cell.p6 { background-image: repeating-linear-gradient(45deg, rgba(0, 0, 0, .25) 0 2px, transparent 2px 7px), repeating-linear-gradient(-45deg, rgba(0, 0, 0, .25) 0 2px, transparent 2px 7px); }
body.cb .cell.p7 { background-image: conic-gradient(rgba(0, 0, 0, .22) 25%, transparent 0 50%, rgba(0, 0, 0, .22) 0 75%, transparent 0); background-size: 12px 12px; }
body.cb .cell.p8 { background-image: radial-gradient(rgba(0, 0, 0, .3) 3px, transparent 3.5px); background-size: 14px 14px; }
body.cb .legend .sw.p1 { background-image: radial-gradient(rgba(0, 0, 0, .35) 1.5px, transparent 2px); background-size: 6px 6px; }
body.cb .legend .sw.p2 { background-image: repeating-linear-gradient(45deg, rgba(0, 0, 0, .3) 0 2px, transparent 2px 6px); }
body.cb .legend .sw.p3 { background-image: repeating-linear-gradient(-45deg, rgba(0, 0, 0, .3) 0 2px, transparent 2px 6px); }
body.cb .legend .sw.p4 { background-image: repeating-linear-gradient(0deg, rgba(0, 0, 0, .3) 0 2px, transparent 2px 6px); }
body.cb .legend .sw.p5 { background-image: repeating-linear-gradient(90deg, rgba(0, 0, 0, .3) 0 2px, transparent 2px 6px); }
body.cb .legend .sw.p6 { background-image: repeating-linear-gradient(45deg, rgba(0, 0, 0, .3) 0 2px, transparent 2px 6px), repeating-linear-gradient(-45deg, rgba(0, 0, 0, .3) 0 2px, transparent 2px 6px); }
body.cb .legend .sw.p7 { background-image: conic-gradient(rgba(0, 0, 0, .25) 25%, transparent 0 50%, rgba(0, 0, 0, .25) 0 75%, transparent 0); background-size: 8px 8px; }
body.cb .legend .sw.p8 { background-image: radial-gradient(rgba(0, 0, 0, .3) 2.5px, transparent 3px); background-size: 8px 8px; }

/* ---------- Overlays ---------- */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, .55); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s ease both; }
@media (min-width: 640px) { .overlay { align-items: center; } }
@keyframes fade { from { opacity: 0; } }
.sheet { width: 100%; max-width: 520px; max-height: 92vh; max-height: 92dvh; overflow: auto; background: var(--bg); border: 1px solid var(--line-strong); border-radius: 22px 22px 0 0; padding: 20px 18px calc(20px + env(safe-area-inset-bottom)); box-shadow: var(--shadow); animation: slideup .32s cubic-bezier(.2, .8, .2, 1) both; position: relative; }
@media (min-width: 640px) { .sheet { border-radius: 22px; } }
@keyframes slideup { from { transform: translateY(40px); opacity: 0; } }
.sheet h2 { font-size: 1.5rem; margin-bottom: 4px; }
.sheet .close { position: absolute; right: 8px; top: 8px; }
.reveal { display: grid; grid-template-columns: 96px 1fr; gap: 14px; margin: 14px 0; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
.reveal svg { width: 96px; height: 150px; }
.reveal dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 0; font-size: .88rem; }
.reveal dt { color: var(--muted); } .reveal dd { margin: 0; font-weight: 600; }
.reveal .nm { grid-column: 1 / -1; font-size: 1.15rem; font-weight: 800; }
.bigstat { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; margin: 12px 0; }
.bigstat b { display: block; font-size: 1.5rem; font-family: "Space Grotesk", system-ui, sans-serif; }
.bigstat span { font-size: .72rem; color: var(--muted); }
.dist { display: grid; gap: 4px; margin: 8px 0; }
.dist div { display: grid; grid-template-columns: 22px 1fr; gap: 6px; align-items: center; font-size: .82rem; }
.dist i { display: block; background: var(--miss); border-radius: 4px; min-width: 22px; padding: 1px 6px; color: var(--text); font-style: normal; font-weight: 700; text-align: right; }
.dist i.now { background: var(--hit); color: #fff; }
.dist i.now.lose { background: var(--clash); }
.pre { white-space: pre-wrap; font-family: ui-monospace, Consolas, monospace; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; font-size: .9rem; line-height: 1.5; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.toggle small { display: block; color: var(--muted); }
.toggle select, .toggle input[type="checkbox"] { min-height: 24px; }
.toggle select { min-height: 40px; border-radius: 10px; background: var(--surface); color: var(--text); border: 1px solid var(--line-strong); padding: 0 8px; }
.toggle input[type="checkbox"] { width: 24px; height: 24px; accent-color: var(--teal); }
textarea.save { width: 100%; min-height: 90px; background: var(--surface); color: var(--text); border: 1px solid var(--line-strong); border-radius: 12px; padding: 10px; font-family: ui-monospace, Consolas, monospace; font-size: .8rem; }
.statgrid { display: grid; gap: 18px; grid-template-columns: 1fr; }
@media (min-width: 640px) { .statgrid { grid-template-columns: 1fr 1fr; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
.panel h3 { margin-bottom: 8px; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: .9rem; margin: 8px 0; }
.kv b { text-align: right; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.badge { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; font-size: .82rem; }
.badge b { display: block; }
.badge.locked { opacity: .45; filter: grayscale(1); }
.archive-list { display: grid; gap: 10px; margin: 12px 0; }
.arch { display: grid; grid-template-columns: 1fr; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.arch .when { font-weight: 700; }
.arch .games { display: flex; gap: 8px; flex-wrap: wrap; }
.demo { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin: 10px 0; }
.demo .cov-grid { max-width: 260px; margin: 0 auto; }
.demo .cell { cursor: default; font-size: .8rem; }
.demo .cap { margin-top: 8px; font-size: .88rem; min-height: 2.6em; }
.legendbox { display: grid; gap: 6px; font-size: .9rem; margin: 10px 0; }
.legendbox .tile { width: 30px; aspect-ratio: 1; display: inline-flex; vertical-align: middle; margin-right: 8px; }
.toast-host { position: fixed; left: 0; right: 0; top: 64px; z-index: 80; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
.toast { background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; box-shadow: var(--shadow); animation: toastin .25s ease both; max-width: 90vw; text-align: center; }
.toast.badge-toast { background: var(--yellow); color: var(--on-yellow); }
@keyframes toastin { from { transform: translateY(-10px); opacity: 0; } }

/* ---------- Motion preferences ---------- */
body.reduced *, body.reduced *::before, body.reduced *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
}
body.reduced .cell.cov .ring { opacity: .5; transform: scale(1.6); }
@media (prefers-reduced-motion: reduce) { .cell.cov .ring { opacity: .5; transform: scale(1.6); } }
@media (max-width: 340px) {
  .wrap { padding: 0 10px; }
  .tiles, .colheads { gap: 3px; }
  .tile { border-width: 1px; }
  .tile .v { font-size: .56rem; }
  .tile .v.long { font-size: .5rem; }
  .tile .m { font-size: .62rem; }
  .colheads { font-size: .5rem; letter-spacing: 0; }
}
@media (max-width: 380px) {
  .tile .v { font-size: .66rem; }
  .colheads { font-size: .56rem; }
  .reveal { grid-template-columns: 72px 1fr; } .reveal svg { width: 72px; height: 112px; }
}

/* ---- src/shared/rng.js ---- */
/* Seeded random numbers (doc 9.4): mulberry32(hash(string)).
   Used by the offline build scripts and the practice modes; never for the daily puzzles at runtime. */
const Rng = (() => {
  function hash(str) {
    let h = 1779033703 ^ str.length;
    for (let i = 0; i < str.length; i++) {
      h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    return (h ^ (h >>> 16)) >>> 0;
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const seeded = (s) => mulberry32(hash(String(s)));
  function shuffle(arr, rng) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }
  const int = (rng, n) => Math.floor(rng() * n);
  const pick = (rng, arr) => arr[Math.floor(rng() * arr.length)];
  return { hash, mulberry32, seeded, shuffle, int, pick };
})();


/* ---- src/shared/compare.js ---- */
/* Phonedle compare (doc 4.3). Pure: compare(guess, answer) -> 7 cells.
   Each cell: { col, label, value (display of the GUESS), verdict: 'hit'|'close'|'miss', dir: 'up'|'down'|null, aria }
   dir points from the guess towards the answer ('up' = answer is newer/bigger/more/dearer). */
const Compare = (() => {
  const COLS = ['brand', 'type', 'released', 'screen', 'storage', 'cameras', 'price'];
  const LABELS = { brand: 'Brand', type: 'Type', released: 'Released', screen: 'Screen', storage: 'Storage', cameras: 'Cameras', price: 'Price' };
  const DIR_WORDS = {
    released: ['newer', 'older'], screen: ['bigger', 'smaller'], storage: ['more', 'less'],
    cameras: ['more', 'fewer'], price: ['dearer', 'cheaper']
  };
  const VERDICT_WORDS = { hit: 'correct', close: 'close', miss: 'not a match' };
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  const ym = (s) => { const p = s.split('-'); return Number(p[0]) * 12 + (Number(p[1]) - 1); };
  const tenths = (n) => Math.round(n * 10);
  const cents = (n) => Math.round(n * 100);

  function fmtReleased(s) { const p = s.split('-'); return MONTHS[Number(p[1]) - 1] + ' ' + p[0].slice(2); }
  function fmtStorage(gb) { return gb >= 1024 ? (gb / 1024) + 'TB' : gb + 'GB'; }
  function fmtPrice(p) { return '$' + Math.round(p).toLocaleString('en-AU'); }
  function fmtScreen(s) { return (tenths(s) / 10).toFixed(1) + '″'; }
  const TYPE_NAMES = { bar: 'Bar', fold: 'Fold', flip: 'Flip' };
  const BRAND_SHORT = { Motorola: 'Moto' };        // keeps the Brand tile readable at 360px

  function dirOf(guessVal, answerVal) {
    return answerVal > guessVal ? 'up' : answerVal < guessVal ? 'down' : null;
  }

  function build(col, value, verdict, dir) {
    let aria = LABELS[col] + ' ' + value + ', ' + VERDICT_WORDS[verdict];
    if (dir && DIR_WORDS[col]) aria += ', the answer is ' + DIR_WORDS[col][dir === 'up' ? 0 : 1];
    return { col, label: LABELS[col], value, verdict, dir: dir || null, aria };
  }

  function compare(g, a) {
    const out = [];

    // 1 Brand: same brand = hit; same maker family (nubia / Optus both ZTE) = close
    out.push(build('brand', BRAND_SHORT[g.brand] || g.brand,
      g.brand === a.brand ? 'hit' : (g.family && g.family === a.family ? 'close' : 'miss'), null));

    // 2 Type: same = hit; Fold vs Flip = close; Bar vs a folding phone = miss
    const folding = (t) => t === 'fold' || t === 'flip';
    out.push(build('type', TYPE_NAMES[g.type],
      g.type === a.type ? 'hit' : (folding(g.type) && folding(a.type) ? 'close' : 'miss'), null));

    // 3 Released: same month+year = hit; same year = close; else miss
    const gm = ym(g.released), am = ym(a.released);
    out.push(build('released', fmtReleased(g.released),
      gm === am ? 'hit' : (Math.floor(gm / 12) === Math.floor(am / 12) ? 'close' : 'miss'), dirOf(gm, am)));

    // 4 Screen: same to 0.1" = hit; within 0.2" = close
    const gs = tenths(g.screen), as = tenths(a.screen), sd = Math.abs(gs - as);
    out.push(build('screen', fmtScreen(g.screen), sd === 0 ? 'hit' : (sd <= 2 ? 'close' : 'miss'), dirOf(gs, as)));

    // 5 Storage
    out.push(build('storage', fmtStorage(g.storage), g.storage === a.storage ? 'hit' : 'miss', dirOf(g.storage, a.storage)));

    // 6 Cameras
    out.push(build('cameras', String(g.cameras), g.cameras === a.cameras ? 'hit' : 'miss', dirOf(g.cameras, a.cameras)));

    // 7 Price: same tier (within $1) = hit; within $200 = close
    const gp = cents(g.price), ap = cents(a.price), pd = Math.abs(gp - ap);
    out.push(build('price', fmtPrice(g.price), pd <= 100 ? 'hit' : (pd <= 20000 ? 'close' : 'miss'), dirOf(gp, ap)));

    return out;
  }

  const isWin = (cells) => cells.every((c) => c.verdict === 'hit');

  /* Hard mode (doc 4.7): every guess must stay consistent with all greens found so far.
     `history` = [{ guess }] of earlier guesses, `compareFn(guess)` yields cells vs the answer.
     Returns null when the guess is allowed, else a message. */
  function hardModeViolation(newGuess, history, answer) {
    for (const h of history) {
      const cells = compare(h.guess, answer);
      const against = compare(newGuess, h.guess);
      for (let i = 0; i < cells.length; i++) {
        if (cells[i].verdict === 'hit' && against[i].verdict !== 'hit') {
          return 'Hard mode: ' + cells[i].label + ' has to match ' + cells[i].value + ' from an earlier guess.';
        }
      }
    }
    return null;
  }

  return { COLS, LABELS, DIR_WORDS, compare, isWin, hardModeViolation, fmtReleased, fmtStorage, fmtPrice, fmtScreen, TYPE_NAMES };
})();

/* Coverage core: solver, deduction rules 1-5 (doc 5.6), grader and generator (doc 5.7).
   Cells are indexed i = row * N + col. `regions[i]` is the suburb index 0..N-1. */
const CoverageCore = (() => {
  const R = typeof Rng !== 'undefined' ? Rng : require('./rng.js');

  const POP = new Uint8Array(1 << 10);
  for (let i = 1; i < POP.length; i++) POP[i] = POP[i >> 1] + (i & 1);

  const parse = (str) => Array.from(str, (ch) => ch.charCodeAt(0) - 65);
  const encode = (regions) => regions.map((v) => String.fromCharCode(65 + v)).join('');

  /* ---------- Solver: row-by-row backtracking, stops at `limit` solutions ---------- */
  function findSolutions(regions, N, limit) {
    limit = limit || 2;
    const sols = [];
    const colUsed = new Uint8Array(N), regUsed = new Uint8Array(N), cols = new Int8Array(N);
    (function rec(r) {
      if (sols.length >= limit) return;
      if (r === N) { sols.push(Array.from(cols)); return; }
      for (let c = 0; c < N; c++) {
        if (colUsed[c]) continue;
        if (r > 0 && Math.abs(c - cols[r - 1]) <= 1) continue;
        const g = regions[r * N + c];
        if (regUsed[g]) continue;
        colUsed[c] = 1; regUsed[g] = 1; cols[r] = c;
        rec(r + 1);
        colUsed[c] = 0; regUsed[g] = 0;
        if (sols.length >= limit) return;
      }
    })(0);
    return sols;
  }

  /* ---------- Puzzle context (static per puzzle) ---------- */
  function makeCtx(regions, N) {
    const regCells = Array.from({ length: N }, () => []);
    regions.forEach((s, i) => regCells[s].push(i));
    const groups = { suburb: regCells, row: [], col: [] };
    for (let k = 0; k < N; k++) {
      groups.row.push(Array.from({ length: N }, (_, c) => k * N + c));
      groups.col.push(Array.from({ length: N }, (_, r) => r * N + k));
    }
    const shadow = [];
    for (let i = 0; i < N * N; i++) {
      const r = (i / N) | 0, c = i % N, set = new Set();
      for (let k = 0; k < N; k++) { set.add(r * N + k); set.add(k * N + c); }
      for (const j of regCells[regions[i]]) set.add(j);
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
        const rr = r + dr, cc = c + dc;
        if (rr >= 0 && rr < N && cc >= 0 && cc < N) set.add(rr * N + cc);
      }

  function ruleLastSpot(ctx, st) {

  function ruleShadow(ctx, st) {

  function generate(N, rng, opts) {
    opts = opts || {};

  };

    parse, encode, findSolutions, makeCtx, makeState, nextStep, applyStep, grade,
    generate, generateUnique, passesFilters, touching, RULES

   auto-crosses when Planning assist is on).  names = suburb names for this puzzle. */
const CoverageHint = (() => {
  const CC = typeof CoverageCore !== 'undefined' ? CoverageCore : require('./coverage-core.js');

  const rc = (N, i) => ({ r: ((i / N) | 0) + 1, c: (i % N) + 1 });
  const joinList = (items) => items.length <= 1 ? items.join('') : items.slice(0, -1).join(', ') + ' and ' + items[items.length - 1];
  const lineName = (axis, idx) => (axis === 'row' ? 'row ' : 'column ') + (idx + 1);
  const linesName = (axis, idxs) => (axis === 'row' ? 'rows ' : 'columns ') + joinList(idxs.map((x) => x + 1));

  /* Rule breaks on the board: returns [{cells:[a,b], reason}] */
  function findClashes(regions, N, towers) {
    const list = Array.from(towers), out = [];
    for (let x = 0; x < list.length; x++) for (let y = x + 1; y < list.length; y++) {
      const a = list[x], b = list[y];
      const ar = (a / N) | 0, ac = a % N, br = (b / N) | 0, bc = b % N;
      let reason = null;
      if (CC.touching(N, a, b)) reason = 'touch';
      else if (ar === br) reason = 'row';
      else if (ac === bc) reason = 'col';
      else if (regions[a] === regions[b]) reason = 'suburb';
      if (reason) out.push({ cells: [a, b], reason });
    }
    return out;
  }

    const N = ctx.N, nm = (s) => names[s];
    switch (step.rule) {
      case 1: {
        const p = rc(N, step.place);
        const where = 'row ' + p.r + ', column ' + p.c;
        if (step.kind === 'suburb') return nm(step.group) + ' only has one open spot left, so it needs a tower at ' + where + '.';
        const who = nm(ctx.regions[step.place]);
        return (step.kind === 'row' ? 'Row ' : 'Column ') + (step.group + 1) + ' only has one open cell left (in ' + who + '), so build at ' + where + '.';
      }

      }
      case 3:
        if (step.dir === 'suburb-in-line') {
          return nm(step.suburb) + ' only fits in ' + lineName(step.axis, step.line) + ', so no other suburb can build in ' + lineName(step.axis, step.line) + '.';
        }
        return 'Every open cell in ' + lineName(step.axis, step.line) + ' belongs to ' + nm(step.suburb) + ', so ' + nm(step.suburb) + '’s tower has to go there. Rule out its other cells.';
      case 4: {
        const p = rc(N, step.cell);
        const g = step.blackout;
        const gname = g.kind === 'suburb' ? nm(g.group) : lineName(g.kind, g.group);
        return 'A tower at row ' + p.r + ', column ' + p.c + ' would leave ' + gname + ' with nowhere to build, so rule that cell out.';
      }
      case 5: {
        const subs = joinList(step.suburbs.map(nm));
        if (step.dir === 'suburbs-in-lines') {
          return subs + ' all fit inside ' + linesName(step.axis, step.lines) + ', so no other suburb can build there.';
        }
        return linesName(step.axis, step.lines) + ' only have cells from ' + subs + ', so those suburbs must build there. Rule out their cells everywhere else.';
      }

    const cells = new Set(), lines = [];
    const addSuburb = (s) => ctx.regCells[s].forEach((i) => cells.add(i));

      case 1:
        cells.add(step.place);
        if (step.kind === 'suburb') addSuburb(step.group); else lines.push({ axis: step.kind, index: step.group });
        break;
      case 2: cells.add(step.tower); step.exclude.forEach((i) => cells.add(i)); break;
      case 3: addSuburb(step.suburb); lines.push({ axis: step.axis, index: step.line }); break;
      case 4:
        cells.add(step.cell);
        if (step.blackout.kind === 'suburb') addSuburb(step.blackout.group); else lines.push({ axis: step.blackout.kind, index: step.blackout.group });
        break;

        step.suburbs.forEach(addSuburb);

  }

  /* Main entry. Returns one of:
     { kind:'clash', cells, reason, text }
     { kind:'wrong-tower', cell, text }

      const text = k.reason === 'touch' ? 'Interference: two towers are touching (' + a + (a === b ? '' : ' and ' + b) + ').'
        : k.reason === 'row' ? 'Two towers share a row (' + a + (a === b ? '' : ' and ' + b) + ').'
        : k.reason === 'col' ? 'Two towers share a column (' + a + (a === b ? '' : ' and ' + b) + ').'
        : 'Two towers in ' + a + '. Each suburb gets exactly one.';
      return { kind: 'clash', cells: k.cells, reason: k.reason, text, highlight: { cells: k.cells, lines: [], targets: [], place: null } };
    }

    for (const t of board.towers) {

        const nmz = names[regions[t]];
        return { kind: 'wrong-tower', cell: t, text: 'Your tower in ' + nmz + ' won’t work out.', highlight: { cells: [t], lines: [], targets: [], place: null } };
      }
    }

    const hidden = Array.from(board.marks).filter((i) => solution.has(i));
    if (hidden.length) {
      return { kind: 'wrong-mark', cells: hidden, text: 'A cross is hiding a spot that needs a tower. Check your crosses in ' + joinList(Array.from(new Set(hidden.map((i) => names[regions[i]]))).sort()) + '.', highlight: { cells: hidden, lines: [], targets: [], place: null } };
    }

    // Logical sim seeded with the player's (correct) towers; skip steps the board already shows.
    const st = CC.makeState(ctx);

    for (let guard = 0; guard < 400; guard++) {
      const step = CC.nextStep(ctx, st);

        ? !board.towers.has(step.place)
        : step.exclude.some((i) => !board.marks.has(i) && !board.towers.has(i));

      }

    }
    return { kind: 'done', text: 'Nothing left to deduce. Cross off the rest and check every suburb has a tower.' };
  }

  return { analyse, describe, highlightFor, findClashes };
})();

/* ---------- Records: where each mode keeps its in-progress and finished games ---------- */
const Rec = {

    if (mode === 'archive') return { get: () => s.archive.phonedle[day] || null, make: () => (s.archive.phonedle[day] = blank()), reset: () => { delete s.archive.phonedle[day]; } };

function phonedleStatus(rec) {

  if (rec.result === 'win') return { state: 'win', text: 'Solved ' + rec.guesses.length + '/' + MAX_GUESSES };

/* Called once when a Phonedle game ends. Returns nothing; everything lands in the store. */
function finishPhonedle(mode, day, rec, answer) {
  const s = Store.s, win = rec.result === 'win';

    const st = s.phonedle.stats;
    st.played++;
    if (win) {
      st.wins++; st.dist[rec.guesses.length - 1]++;
      st.streak = st.lastDay === day - 1 ? st.streak + 1 : 1;
      st.lastDay = day; st.maxStreak = Math.max(st.maxStreak, st.streak);
    } else { st.dist[8]++; st.streak = 0; }
    if (rec.hintsUsed.length) st.hintGames++;

    if (rec.guesses.length === 1) award('first-call');

function finishCoverage(mode, day, rec, puzzle) {

  rec.bars = barsFor(rec.ms, puzzle.par, rec.hints);

    const st = s.coverage.stats, n = puzzle.size, dow = DOW_NAMES[Clock.weekday(Clock.keyForDay(day))];

    st.lastDay = day; st.maxStreak = Math.max(st.maxStreak, st.streak);

const HINT_DEFS = [
  { after: 3, title: 'Spec sheet', icon: '💻' },
  { after: 5, title: 'Colourways', icon: '🎨' },
  { after: 7, title: 'The Customer', icon: '🗣️' }
];
const FLIP_STEP = 120;                       // ms between tiles (doc 7.4)
const normQ = (s) => String(s).toLowerCase().replace(/galaxy/g, '').replace(/[^a-z0-9+]/g, '');

/* Search index: names + aliases, ignoring case, spaces and the word "Galaxy" (doc 4.4) */
const SEARCH_INDEX = PHONES.map((p) => ({
  p,
  keys: [normQ(p.name), normQ(p.brand + p.name)].concat(p.aliases.map(normQ)),
  words: (p.name + ' ' + p.aliases.join(' ')).toLowerCase().replace(/galaxy/g, '')
}));
function searchPhones(query, limit) {
  const nq = normQ(query);
  if (!nq) return [];
  const toks = String(query).toLowerCase().split(/\s+/).map(normQ).filter(Boolean);
  const out = [];
  for (const e of SEARCH_INDEX) {
    let best = 0;
    for (const k of e.keys) {
      if (k === nq) best = Math.max(best, 100);
      else if (k.startsWith(nq)) best = Math.max(best, 90 - Math.min(20, (k.length - nq.length)));
      else if (k.includes(nq)) best = Math.max(best, 50);
    }
    if (!best && toks.length > 1 && toks.every((t) => e.words.includes(t) || e.keys.some((k) => k.includes(t)))) best = 35;
    if (best) out.push({ p: e.p, score: best + (e.p.answer ? 1 : 0) });
  }
  out.sort((a, b) => b.score - a.score || (b.p.released > a.p.released ? 1 : -1));
  return out.slice(0, limit || 8).map((x) => x.p);
}
const phoneNote = (p) => p.channel === 'prepaid' ? 'Prepaid' : p.status === 'out-of-stock' ? 'Out of stock' : p.status === 'delisted' ? 'No longer sold' : p.status === 'coming-soon' ? 'Coming soon' : '';
const chipArticle = (m) => (/^[aeiou]/i.test(m) ? 'an' : 'a');
const optusLink = (p) => 'https://www.optus.com.au/' + (p.channel === 'prepaid' ? 'prepaid/phones/' : 'mobile/phones/') + p.id;
const money = (n) => '$' + n.toLocaleString('en-AU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function randomFloorAnswer() {
  const today = Clock.todayKey();
  const pool = ANSWER_POOL.filter((p) => p.status !== 'coming-soon' || (p.answerFrom && today >= p.answerFrom));
  return pool[Math.floor(Math.random() * pool.length)].id;
}

function renderPhonedle(root, mode, day) {
  teardownScreen();
  const ref = Rec.phonedle(mode, day);
  let rec = ref.get();
  if (mode === 'floor' && (!rec || rec.result)) rec = ref.make({ answer: randomFloorAnswer() });
  const answer = mode === 'floor' ? PHONE_BY_ID.get(rec.answer) : answerForDay(day);
  const R = () => rec || (rec = ref.make());
  const label = mode === 'floor' ? 'Floor Stock' : '#' + day + (mode === 'archive' ? ' · Archive' : '');
  const countsForStats = mode === 'daily';
  let busy = false, destroyed = false;

  const boardEl = h('div', { class: 'board', 'aria-label': 'Guesses' });
  const hintsEl = h('div', { class: 'hints' });
  const dockEl = h('div', { class: 'searchdock' });

  const back = h('a', { class: 'iconbtn', href: mode === 'archive' ? '#/archive' : '#/', 'aria-label': 'Back' }, '←');
  const head = h('div', { class: 'gamehead' }, back,
    h('div', { class: 'grow' }, h('h1', null, 'Phonedle ' + label), h('div', { class: 'sub' }, 'The Mystery Handset · ' + MAX_GUESSES + ' guesses')),
    h('button', { class: 'iconbtn', 'aria-label': 'How to play', onclick: () => openHowTo('phonedle') }, '?'));
  clear(root).append(h('div', { class: 'wrap' }, head, hintsEl, h('div', { class: 'colheads', 'aria-hidden': 'true' }, Compare.COLS.map((c) => h('div', null, Compare.LABELS[c]))), boardEl), dockEl);
  window.scrollTo(0, 0);

  /* ----- board ----- */
  function tileGlyph(c) {
    const g = c.verdict === 'hit' ? '✓' : c.verdict === 'close' ? '~' : '✗';
    return g + (c.dir ? (c.dir === 'up' ? ' ↑' : ' ↓') : '');
  }
  function buildRow(phone, i) {
    const cells = Compare.compare(phone, answer);
    const tiles = cells.map((c, k) => h('div', { class: 'tile ' + c.verdict, role: 'img', 'aria-label': c.aria, style: { '--i': k } },
      h('span', { class: 'v' + (c.value.length >= 7 && c.col === 'brand' ? ' long' : '') }, c.value), h('span', { class: 'm' }, tileGlyph(c))));
    const sil = phoneSVG(phone);
    return { cells, tiles, el: h('div', { class: 'guessrow', 'data-i': i }, h('div', { class: 'guessname' }, sil, phone.name), h('div', { class: 'tiles' }, tiles)) };
  }
  function reveal(row, animate, done) {
    if (!animate || reducedMotion()) { row.tiles.forEach((t) => t.classList.add('show')); done && done(); return; }
    row.tiles.forEach((t, k) => {
      setTimeout(() => {
        if (destroyed) return;
        t.classList.add('flipping'); Sound.flip();
        setTimeout(() => t.classList.add('show'), 250);
      }, k * FLIP_STEP);
    });
    setTimeout(() => done && done(), row.tiles.length * FLIP_STEP + 520);
  }
  function drawBoard(animateNewest, done) {
    clear(boardEl);
    const guesses = rec ? rec.guesses : [];
    const rows = guesses.map((id, i) => ({ id, i })).reverse();            // newest on top
    rows.forEach((r, idx) => {
      const row = buildRow(PHONE_BY_ID.get(r.id), r.i);
      boardEl.append(row.el);
      const isNew = animateNewest && idx === 0;
      reveal(row, isNew, isNew ? () => {                     // only the newest row reports back
        if (rec.result === 'win') row.el.classList.add('win');
        done && done();
      } : null);
    });
    for (let k = guesses.length; k < MAX_GUESSES; k++) {
      boardEl.append(h('div', { class: 'guessrow slots' }, h('div', { class: 'tiles' }, Compare.COLS.map(() => h('div', { class: 'tile empty' })))));
    }
  }

  /* ----- hints (doc 4.5) ----- */
  function hintBody(i) {
    if (i === 0) return 'It runs ' + chipArticle(answer.chipMaker) + ' ' + answer.chipMaker + ' chip.';
    if (i === 1) return h('span', { class: 'swatches' }, answer.colours.map((c) => h('span', { class: 'swatch' }, h('i', { style: { background: COLOUR_HEX[c] || '#777' } }), c)));
    return h('em', null, '“' + (QUOTES[answer.id] || 'No comment.') + '”');
  }
  function drawHints() {
    clear(hintsEl);
    const hard = rec ? rec.hard : Store.s.settings.hardMode;
    if (hard) { hintsEl.append(h('div', { class: 'muted', style: { fontSize: '.85rem' } }, '⚡ Hard mode: hints are off.')); return; }
    const n = rec ? rec.guesses.length : 0, used = rec ? rec.hintsUsed : [];
    HINT_DEFS.forEach((d, i) => {
      const open = used.includes(i), ready = n >= d.after && !(rec && rec.result);
      const btn = h('button', { class: 'hintbtn' + (open ? ' open' : ''), disabled: !open && !ready, 'aria-label': d.title + (open ? '' : ready ? ': reveal hint' : ': unlocks after ' + d.after + ' guesses'),
        onclick: () => { if (open) return; const r = R(); r.hintsUsed.push(i); Store.save(); drawHints(); announce(d.title + ' hint revealed.'); } },
        h('b', null, d.icon + ' ' + d.title), open ? hintBody(i) : (ready ? 'Tap to reveal 💡' : 'After ' + d.after + ' guesses'));
      hintsEl.append(btn);
    });
  }

  /* ----- search dock ----- */
  let active = 0, matches = [];
  const input = h('input', { type: 'text', id: 'phone-search', placeholder: 'Type a phone, e.g. s26u, fold 8, 17pm…', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', role: 'combobox', 'aria-expanded': 'false', 'aria-controls': 'phone-list', 'aria-autocomplete': 'list', 'aria-label': 'Guess a phone' });
  const list = h('ul', { class: 'suggest hidden', id: 'phone-list', role: 'listbox', 'aria-label': 'Matching phones' });
  const guessed = () => new Set(rec ? rec.guesses : []);
  const firstFree = () => { const g = guessed(); return matches.findIndex((p) => !g.has(p.id)); };
  function refreshMatches() { matches = searchPhones(input.value, 8); active = Math.max(0, firstFree()); }
  function drawList() {
    clear(list);
    const g = guessed();
    if (!matches.length) {
      if (input.value.trim()) { list.append(h('li', { 'aria-disabled': 'true' }, h('span', { class: 'nm muted' }, 'No phone matches that'))); list.classList.remove('hidden'); input.setAttribute('aria-expanded', 'true'); }
      else { list.classList.add('hidden'); input.setAttribute('aria-expanded', 'false'); }
      return;
    }
    matches.forEach((p, i) => {
      const li = h('li', { id: 'ph-' + i, role: 'option', 'aria-selected': i === active ? 'true' : 'false', 'aria-disabled': g.has(p.id) ? 'true' : null, onmousedown: (e) => { e.preventDefault(); pick(p); } },
        phoneSVG(p), h('span', { class: 'nm' }, p.name), phoneNote(p) ? h('span', { class: 'chip' }, phoneNote(p)) : null, g.has(p.id) ? h('span', { class: 'chip' }, 'Guessed') : null);
      list.append(li);
    });
    list.classList.remove('hidden'); input.setAttribute('aria-expanded', 'true'); input.setAttribute('aria-activedescendant', 'ph-' + active);
  }
  function closeList() { list.classList.add('hidden'); input.setAttribute('aria-expanded', 'false'); }
  input.addEventListener('input', () => { refreshMatches(); drawList(); });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      const g = guessed(), step = e.key === 'ArrowDown' ? 1 : -1;
      for (let k = 1; k <= matches.length; k++) {                       // skip phones that were already guessed
        const i = (active + step * k + matches.length * k) % matches.length;
        if (!g.has(matches[i].id)) { active = i; break; }
      }
      if (matches.length) drawList();
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (!input.value.trim() || !matches.length) return;
      const g = guessed(), p = matches[active] && !g.has(matches[active].id) ? matches[active] : matches.find((m) => !g.has(m.id));
      if (p) pick(p); else toast('You already guessed that one');
    } else if (e.key === 'Escape') { input.value = ''; matches = []; drawList(); }
  });
  input.addEventListener('blur', () => setTimeout(closeList, 120));
  input.addEventListener('focus', () => { if (input.value) { refreshMatches(); drawList(); } });

  function drawDock() {
    clear(dockEl);
    const finished = rec && rec.result;
    if (finished) {
      dockEl.append(h('div', { class: 'wrap' }, h('div', { class: 'row', style: { justifyContent: 'center' } },
        h('button', { class: 'btn primary', onclick: () => showResult() }, 'Show result'),
        mode === 'floor' ? h('button', { class: 'btn', onclick: () => { ref.reset(); renderPhonedle(root, mode, day); } }, 'Next phone') : null)));
    } else {
      dockEl.append(h('div', { class: 'wrap' }, h('div', { class: 'search' }, list, input)));
    }
  }

  function pick(phone) {
    if (busy || (rec && rec.result)) return;
    const g = guessed();
    if (g.has(phone.id)) { toast('You already guessed that one'); return; }
    const r = R();
    const hard = r.guesses.length ? r.hard : Store.s.settings.hardMode;
    if (hard) {
      const bad = Compare.hardModeViolation(phone, r.guesses.map((id) => ({ guess: PHONE_BY_ID.get(id) })), answer);
      if (bad) { toast(bad); Sound.crackle(); if (input.animate) input.animate([{ transform: 'translateX(-6px)' }, { transform: 'translateX(6px)' }, { transform: 'none' }], { duration: 250 }); return; }
    }
    if (!r.guesses.length) r.hard = hard;
    r.guesses.push(phone.id);
    const win = phone.id === answer.id;
    if (win) r.result = 'win'; else if (r.guesses.length >= MAX_GUESSES) r.result = 'loss';
    Store.save();
    input.value = ''; matches = []; active = 0; closeList();
    busy = true;
    const cells = Compare.compare(phone, answer);
    announce(phone.name + '. ' + cells.map((c) => c.aria).join('. ') + '.');
    drawHints();
    drawBoard(true, () => {
      busy = false;
      if (destroyed) return;
      if (r.result) { Sound.chime(); setTimeout(() => showResult(), 350); drawDock(); }
    });
    if (r.result) finishPhonedle(mode, day, r, answer);
  }

  /* ----- result sheet (doc 4.8) ----- */
  function showResult() {
    const r = rec, win = r.result === 'win';
    const st = Store.s.phonedle.stats;
    const share = phonedleShare(r, answer, day, label.replace(' · Archive', ''));
    const dl = h('dl', null,
      h('dt', null, 'Brand'), h('dd', null, answer.brand),
      h('dt', null, 'Type'), h('dd', null, Compare.TYPE_NAMES[answer.type]),
      h('dt', null, 'Released'), h('dd', null, Compare.fmtReleased(answer.released)),
      h('dt', null, 'Screen'), h('dd', null, Compare.fmtScreen(answer.screen) + (answer.cover ? ' (' + answer.cover.toFixed(1) + '″ cover)' : '')),
      h('dt', null, 'Storage'), h('dd', null, Compare.fmtStorage(answer.storage)),
      h('dt', null, 'Cameras'), h('dd', null, String(answer.cameras)),
      h('dt', null, 'Chip'), h('dd', null, answer.chip),
      h('dt', null, 'Optus price'), h('dd', null, money(answer.price)));
    const content = h('div', null,
      h('h2', { class: 'display' }, win ? 'Sold! 🎉' : 'They walked out to the competitor.'),
      h('p', { class: 'muted', style: { margin: '0 0 6px' } }, win ? 'Solved in ' + r.guesses.length + ' of ' + MAX_GUESSES + (r.hintsUsed.length ? ' with a hint' : '') + '.' : 'The mystery handset was…'),
      h('div', { class: 'reveal' }, phoneSVG(answer), h('div', null, h('div', { class: 'nm' }, answer.name), dl)),
      h('p', null, h('a', { href: optusLink(answer), target: '_blank', rel: 'noopener' }, 'View on optus.com.au ↗'),
        answer.approx && answer.approx.length ? h('span', { class: 'muted', style: { fontSize: '.78rem' } }, '  (some specs unconfirmed)') : null),
      countsForStats ? statsBlock(st, r, win) : null,
      h('div', { class: 'pre', 'aria-label': 'Share preview' }, share),
      fullBarsNote(mode, day),
      h('div', { class: 'row', style: { marginTop: '14px' } },
        h('button', { class: 'btn primary', onclick: () => shareText(share) }, 'Share'),
        mode === 'daily' ? h('a', { class: 'btn', href: '#/coverage', onclick: () => sheet.close() }, 'Play Coverage 🗼') : null,
        mode === 'floor' ? h('button', { class: 'btn', onclick: () => { sheet.close(); ref.reset(); renderPhonedle(root, mode, day); } }, 'Next phone') : null,
        h('a', { class: 'btn', href: mode === 'archive' ? '#/archive' : '#/', onclick: () => sheet.close() }, mode === 'archive' ? 'Back to Archive' : 'Back to Today')));
    const sheet = openSheet(content, { label: 'Phonedle result' });
  }
  function statsBlock(st, r, win) {
    const winPct = st.played ? Math.round(st.wins / st.played * 100) : 0, max = Math.max(1, ...st.dist);
    return h('div', null,
      h('div', { class: 'bigstat' }, [[st.played, 'Played'], [winPct, 'Win %'], [displayStreak(st, day), 'Streak'], [st.maxStreak, 'Max']].map((x) => h('div', null, h('b', null, x[0]), h('span', null, x[1])))),
      h('div', { class: 'dist', 'aria-label': 'Guess distribution' }, st.dist.map((n, i) => h('div', null, h('span', null, i === 8 ? 'X' : i + 1),
        h('i', { class: win && i === r.guesses.length - 1 ? 'now' : !win && i === 8 ? 'now lose' : '', style: { width: Math.max(8, n / max * 100) + '%' } }, n)))));
  }

  drawHints(); drawBoard(false); drawDock();
  if (!(rec && rec.guesses.length) && !Store.s.meta.seenHowto.phonedle) { Store.s.meta.seenHowto.phonedle = true; Store.save(); setTimeout(() => openHowTo('phonedle'), 250); }
  if (!rec || !rec.result) setTimeout(() => { if (!destroyed && matchMedia('(pointer: fine)').matches) input.focus(); }, 60);
  return mountScreen({ destroy() { destroyed = true; } });
}

function fullBarsNote(mode, day) {
  if (mode !== 'daily') return null;
  const s = Store.s, p = s.phonedle.days[day], c = s.coverage.days[day];
  if (p && p.result === 'win' && c && c.done) return h('div', { class: 'banner' }, '📶 FULL BARS! Both solved today. Streak: ' + s.fullBars.streak);
  if (p && p.result && !(c && c.done)) return h('div', { class: 'banner' }, 'Finish Coverage too and you can share a combined result.');
  return null;
}

const SUBURB_BLURBS = new Map(SUBURBS);

/* Practice Shire: unlimited runtime-generated puzzles, capped at 8x8 (doc 5.7). */
function renderPractice(root) {
  teardownScreen();
  const cur = Store.s.practice.cur;

  let size = 6;

  const go = () => {
    goBtn.disabled = true;
    setTimeout(() => {
      const rng = Rng.seeded('coverage-practice:' + Date.now());
      const p = CoverageCore.generate(size, rng, { tier: null, maxTries: 2000 });
      const nrng = Rng.seeded('practice-names:' + Date.now());
      const names = Rng.shuffle(SUBURBS.map((s) => s[0]), nrng).slice(0, size);
      Rec.coverage('practice', 0).make({ puzzle: { size, regions: p.regions, names, par: COVERAGE_WEEK.find((w) => w.size === size).par, tier: p.tier } });
      Store.save(); renderCoverage(root, 'practice', 0);

  clear(root).append(h('div', { class: 'wrap' },
    h('div', { class: 'gamehead' }, h('a', { class: 'iconbtn', href: '#/', 'aria-label': 'Back' }, '←'), h('div', { class: 'grow' }, h('h1', null, 'Practice Shire'), h('div', { class: 'sub' }, 'Unlimited puzzles · separate from your streaks'))),
    h('div', { class: 'panel', style: { marginTop: '12px' } }, h('p', null, 'Pick a size. Every puzzle has exactly one solution and can be solved by logic alone.'),
      h('div', { class: 'row' }, sizeBtns), h('div', { class: 'row', style: { marginTop: '14px' } }, goBtn))));
}

  const tbHint = h('button', { class: 'btn', 'aria-label': 'Ask the engineer for a hint', onclick: doHint }, h('span', { class: 'ic' }, '💡'), 'Hint');
  const tbAssist = h('button', { class: 'btn', 'aria-pressed': String(!!Store.s.settings.assist), 'aria-label': 'Planning assist', onclick: toggleAssist }, h('span', { class: 'ic' }, '🧭'), 'Assist');

/* ===== boot and routing ===== */
(function boot() {
  applySettings();
  const screen = document.getElementById('screen');
  document.getElementById('topbar-host').append(buildTopbar());
  const rolloverHost = document.getElementById('rollover');
  let bootKey = Clock.todayKey();

  function route(parts) {
    teardownScreen();
    closeAllSheets();
    const [a, b, c] = parts, day = Clock.dayNumber();
    let title = 'Daily Bars';
    switch (a) {
      case undefined: renderToday(screen); break;
      case 'phonedle': renderPhonedle(screen, 'daily', day); title = 'Phonedle #' + day; break;
      case 'coverage': renderCoverage(screen, 'daily', day); title = 'Coverage #' + day; break;
      case 'floor': {
        const p = Store.s.phonedle.days[day];
        if (!(p && p.result)) { toast('Finish today’s Phonedle to unlock Floor Stock'); return Router.go(''); }
        renderPhonedle(screen, 'floor', 0); title = 'Floor Stock'; break;
      }
      case 'practice': renderPractice(screen); title = 'Practice Shire'; break;
      case 'stats': renderStats(screen); title = 'Stats'; break;
      case 'archive': {
        const n = Number(c);
        if (!b) { renderArchive(screen); title = 'Archive'; break; }
        if (!(Number.isInteger(n) && n >= 1 && n < day && (b === 'phonedle' || b === 'coverage'))) return Router.go(b === 'coverage' ? 'coverage' : b === 'phonedle' ? 'phonedle' : 'archive');
        if (b === 'phonedle') { if (!Rec.phonedle('archive', n).get()) Rec.phonedle('archive', n).make(); renderPhonedle(screen, 'archive', n); }
        else { if (!Rec.coverage('archive', n).get()) Rec.coverage('archive', n).make(); renderCoverage(screen, 'archive', n); }
        title = (b === 'phonedle' ? 'Phonedle' : 'Coverage') + ' #' + n + ' (archive)';
        break;
      }
      default: return Router.go('');
    }
    document.title = title === 'Daily Bars' ? 'Daily Bars' : title + ' · Daily Bars';
    window.scrollTo(0, 0);
  }

  /* Midnight Brisbane rollover (doc 3.1): never swap a board mid-game, just offer the new puzzles. */
  function checkRollover() {
    if (Clock.todayKey() === bootKey || rolloverHost.firstChild) return;
    rolloverHost.append(h('div', { class: 'wrap wide' }, h('div', { class: 'banner', role: 'status' }, 'New puzzles are in! ',
      h('button', { class: 'btn small primary', onclick: () => { Store.save(); location.hash = '#/'; location.reload(); } }, 'Go to Today'))));
  }
  setInterval(checkRollover, 60 * 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkRollover(); });
  window.__dailyBarsCheckRollover = checkRollover;      // QA hook for the midnight test

  window.addEventListener('beforeunload', () => Store.save());
  Router.start(route);
})();
