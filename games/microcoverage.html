<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#004d55">
<title>Micro Coverage</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--teal:#00a3ad;--deep:#004d55;--yellow:#ffd100;--night:#0d1f22;--ink:#06292d;--white:#fff;--pink:#ff5a7a;--r:18px;
--font:'Fredoka',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0d1f22;color:#fff;font-family:var(--font);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
.hidden{display:none!important}
button{font-family:var(--font);cursor:pointer}
/* ---------- loading ---------- */
#loading{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#0b5b63,#062a2e 70%);z-index:50;transition:opacity .5s}
#loading .lt{font-weight:700;font-size:clamp(28px,6vw,54px);letter-spacing:.04em}
#loading .lt b{color:var(--yellow)}
#loading .bar{width:min(280px,60vw);height:10px;border-radius:9px;background:#ffffff22;margin:18px auto 0;overflow:hidden}
#loading .bar i{display:block;height:100%;width:30%;background:var(--yellow);border-radius:9px;animation:ld 1.1s ease-in-out infinite}
#loading .err{max-width:520px;margin:18px auto 0;font-size:15px;opacity:.9;text-align:center;line-height:1.4}
@keyframes ld{0%{transform:translateX(-110%)}100%{transform:translateX(340%)}}
/* ---------- menus ---------- */
#menu{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;pointer-events:none}
#menu.on{pointer-events:auto}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(18px + var(--safe-t)) 22px calc(18px + var(--safe-b));animation:scrIn .35s cubic-bezier(.2,1.4,.4,1)}
.scr.dim{background:linear-gradient(180deg,#062a2ee6,#062a2ecc 40%,#062a2ef2)}
.scr.side{background:linear-gradient(90deg,#062a2ef5 0,#062a2ee0 46%,#062a2e00 72%)}
@keyframes scrIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.top h2{margin:0;font-size:clamp(22px,4vw,34px);font-weight:700;letter-spacing:.01em}
.top h2 small{display:block;font-size:13px;font-weight:500;color:#9fe3e7;letter-spacing:.06em;text-transform:uppercase}
.back{width:46px;height:46px;border-radius:14px;border:0;background:#ffffff18;color:#fff;font-size:22px;flex:none}
.back:hover,.back:focus-visible{background:var(--yellow);color:var(--ink)}
.btn{border:0;border-radius:16px;padding:14px 20px;font-size:18px;font-weight:600;background:var(--teal);color:#fff;box-shadow:0 5px 0 #00646b;transition:transform .12s,box-shadow .12s,background .12s;position:relative;text-align:left}
.btn:hover,.btn:focus-visible,.btn.sel{background:var(--yellow);color:var(--ink);box-shadow:0 5px 0 #b89600;transform:translateY(-2px)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #00646b}
.btn.big{font-size:clamp(17px,2.8vh,22px);padding:min(18px,2.2vh) 24px}
.main-btns .btn{padding-top:min(14px,1.7vh);padding-bottom:min(14px,1.7vh)}
.btn.ghost{background:#ffffff14;box-shadow:0 5px 0 #00000040}
.btn.ghost:hover,.btn.ghost:focus-visible{background:var(--yellow);color:var(--ink)}
.btn .sub{display:block;font-size:13px;font-weight:500;opacity:.8;margin-top:2px}
.btn[disabled],.btn.locked{opacity:.45;filter:grayscale(.5);cursor:not-allowed}
.btn.locked:hover{background:var(--teal);color:#fff;transform:none}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));overflow:auto;padding:4px 4px 16px;align-content:start}
.card{border-radius:var(--r);background:#0a3b40;border:3px solid #ffffff14;padding:12px;color:#fff;text-align:left;font-size:15px;transition:transform .15s,border-color .15s,background .15s;position:relative}
.card:hover,.card:focus-visible,.card.sel{border-color:var(--yellow);transform:translateY(-3px);background:#0d4a50;outline:none}
.card h3{margin:6px 0 2px;font-size:19px}
.card .meta{font-size:13px;color:#9fe3e7}
.card canvas,.card img{width:100%;aspect-ratio:16/10;border-radius:12px;background:#062a2e;display:block}
.card .lock{position:absolute;inset:0;border-radius:15px;background:#062a2ecc;display:grid;place-items:center;text-align:center;font-size:14px;padding:10px;color:#cfe}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:#ffffff1c;margin-right:4px}
.tag.y{background:var(--yellow);color:var(--ink)}
.medal{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-left:4px;border:2px solid #0006}
.col{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;gap:6px;background:#ffffff12;border-radius:999px;padding:4px}
.pill button{border:0;background:transparent;color:#fff;font-size:15px;font-weight:600;padding:8px 14px;border-radius:999px}
.pill button.on{background:var(--yellow);color:var(--ink)}
.pill button:focus-visible{outline:2px solid var(--yellow)}
.title-wrap{margin:auto 0 28px;max-width:560px}
.logo{font-size:clamp(40px,min(9vw,12.5vh),104px);line-height:.86;font-weight:700;letter-spacing:-.01em;text-shadow:0 6px 0 #00000030}
.logo span{display:block;color:var(--yellow)}
.logo em{font-style:normal;display:inline-block;transform:rotate(-4deg);background:var(--teal);color:#fff;padding:0 14px;border-radius:16px;margin-left:6px}
.tagline{font-size:clamp(15px,min(2.4vw,3vh),21px);margin:min(14px,2vh) 0 min(18px,2.4vh);color:#d9fbfd}
.main-btns{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr));max-width:520px}
.foot{position:absolute;left:22px;right:22px;bottom:calc(10px + var(--safe-b));font-size:12px;opacity:.7;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.foot a{color:#9fe3e7}
.pts{display:inline-flex;align-items:center;gap:6px;background:#ffffff14;padding:6px 12px;border-radius:999px;font-weight:600}
.pts b{color:var(--yellow)}
.stat{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:8px;font-size:14px}
.stat .b{height:10px;border-radius:9px;background:#ffffff1a;overflow:hidden}
.stat .b i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--yellow));border-radius:9px}
.panel{background:#062a2ee8;border:2px solid #ffffff14;border-radius:22px;padding:16px;backdrop-filter:blur(4px)}
.swatch{width:40px;height:40px;border-radius:12px;border:3px solid #ffffff30;display:inline-block;position:relative}
.swatch.on{border-color:var(--yellow)}
.swatch .c{position:absolute;inset:4px;border-radius:7px}
table.res{border-collapse:collapse;width:100%;font-size:17px}
table.res td{padding:9px 10px;border-bottom:1px solid #ffffff14}
table.res tr.me td{background:#ffd10026;color:#fff;font-weight:600}
table.res td.p{width:46px;font-weight:700;color:var(--yellow);font-size:20px}
.kbd{display:inline-block;min-width:26px;padding:2px 7px;border-radius:7px;background:#ffffff1f;border-bottom:3px solid #0005;font-size:13px;font-weight:600;text-align:center}
.slider{width:100%;accent-color:var(--yellow)}
.setrow{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid #ffffff10}
.scroll{overflow:auto;min-height:0}
/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;z-index:10;pointer-events:none;font-weight:600}
.hud-tl{position:absolute;left:calc(14px + env(safe-area-inset-left,0px));top:calc(10px + var(--safe-t))}
.hud-tr{position:absolute;right:calc(14px + env(safe-area-inset-right,0px));top:calc(10px + var(--safe-t));text-align:right}
.hud-tc{position:absolute;left:50%;top:calc(10px + var(--safe-t));transform:translateX(-50%);text-align:center}
.hud-bl{position:absolute;left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(12px + var(--safe-b))}
.hud-br{position:absolute;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + var(--safe-b));text-align:right}
.pos{font-size:clamp(38px,6vw,64px);line-height:.9;text-shadow:0 3px 0 #0007}
.pos small{font-size:.45em;opacity:.85}
.time{font-size:18px;text-shadow:0 2px 0 #0007;margin-top:4px;font-variant-numeric:tabular-nums}
.time .best{opacity:.75;font-size:14px}
.split{font-size:17px;margin-top:2px;font-variant-numeric:tabular-nums}
.split.g{color:#7dff9a}.split.r{color:#ff8a8a}
.lap{font-size:clamp(20px,3vw,28px);background:#062a2ecc;padding:4px 16px;border-radius:999px;text-shadow:none}
.sig{display:flex;align-items:flex-end;gap:5px;height:48px;justify-content:flex-end}
.sig i{width:13px;border-radius:4px;background:#ffffff2e;position:relative;overflow:hidden}
.sig i b{position:absolute;left:0;right:0;bottom:0;background:var(--yellow);border-radius:4px}
.sig.boost i b{background:#7ff6ff;box-shadow:0 0 12px #7ff6ff}
.siglbl{font-size:12px;letter-spacing:.14em;opacity:.8;margin-top:3px}
.spd{font-size:clamp(30px,4.6vw,46px);line-height:1;text-shadow:0 3px 0 #0007;font-variant-numeric:tabular-nums}
.spd small{font-size:.4em;opacity:.8;margin-left:4px}
.spdbar{width:160px;height:8px;border-radius:9px;background:#ffffff26;margin-top:6px;margin-left:auto;overflow:hidden}
.spdbar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--yellow));border-radius:9px}
#minimap{width:clamp(120px,18vw,190px);height:clamp(120px,18vw,190px);border-radius:20px;background:#062a2eb0;display:block}
.nosvc{position:absolute;left:0;right:0;top:44%;text-align:center;font-size:13px;letter-spacing:.12em;color:#ffd1d1;text-shadow:0 1px 0 #000}
.ppanel{position:absolute;padding:8px 12px;border-radius:14px;background:#062a2ecc;font-size:15px;min-width:110px;border-left:6px solid}
.ppanel b{font-size:22px}
#banner{position:fixed;left:0;right:0;top:34%;z-index:12;text-align:center;pointer-events:none}
#banner .b{display:inline-block;font-size:clamp(46px,11vw,120px);font-weight:700;color:#fff;text-shadow:0 6px 0 #0008;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
#banner .b.y{color:var(--yellow)}
#banner .s{font-size:clamp(16px,2.6vw,24px);margin-top:6px;text-shadow:0 2px 0 #000a}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
#toasts{position:fixed;left:50%;top:calc(76px + var(--safe-t));transform:translateX(-50%);z-index:13;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:#062a2ee6;border:2px solid #ffffff22;padding:7px 16px;border-radius:999px;font-weight:600;font-size:clamp(15px,2.2vw,19px);animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
.toast.y{background:var(--yellow);color:var(--ink);border-color:transparent}
.toast.r{background:#c0283f;border-color:transparent}
.posfx{position:fixed;z-index:13;font-size:44px;font-weight:700;pointer-events:none;animation:posfx 1s ease-out forwards;text-shadow:0 3px 0 #0008}
@keyframes posfx{0%{transform:translateY(0) scale(.5);opacity:0}20%{transform:translateY(-10px) scale(1.15);opacity:1}100%{transform:translateY(-60px) scale(1);opacity:0}}
.taunt{position:absolute;left:50%;bottom:22%;transform:translateX(-50%);max-width:min(560px,86vw);background:#062a2ef0;border:3px solid var(--yellow);border-radius:20px;padding:12px 18px;font-size:clamp(15px,2.2vw,19px);text-align:center;animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
.taunt b{color:var(--yellow);display:block;font-size:13px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px}
/* ---------- touch ---------- */
#touch{position:fixed;inset:0;z-index:11;pointer-events:none}
#touch .tz{position:absolute;pointer-events:auto;touch-action:none}
.tsteer{left:calc(10px + env(safe-area-inset-left,0px));bottom:calc(18px + var(--safe-b));width:min(44vw,300px);height:120px;border-radius:60px;background:#062a2e88;border:2px solid #ffffff2a}
.tsteer .knob{position:absolute;top:50%;left:50%;width:84px;height:84px;margin:-42px;border-radius:50%;background:#ffffff40;border:3px solid #fff8;transition:background .1s}
.tsteer.stick{width:150px;height:150px;border-radius:50%}
.tbtn{width:74px;height:74px;border-radius:50%;background:#062a2e99;border:3px solid #ffffff55;color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;text-align:center;line-height:1.05}
.tbtn.on{background:var(--yellow);color:var(--ink);border-color:var(--yellow)}
.tbtn.big{width:92px;height:92px;font-size:16px}
.tpause{right:calc(12px + env(safe-area-inset-right,0px));top:calc(64px + var(--safe-t));width:48px!important;height:48px!important;font-size:18px!important}
/* touch mode: keep HUD clear of the thumbs */
body.touch .hud-bl{top:calc(108px + var(--safe-t));bottom:auto}
body.touch #minimap{width:clamp(92px,15vw,128px);height:clamp(92px,15vw,128px);border-radius:16px}
body.touch .hud-br{bottom:auto;top:calc(58px + var(--safe-t));right:auto;left:50%;transform:translateX(-50%);text-align:center}
body.touch .hud-br .spd{font-size:26px}
body.touch .hud-br .spdbar{margin:4px auto 0;width:110px}
body.touch .hud-tr{right:calc(74px + env(safe-area-inset-right,0px))}
body.touch .tpause{top:calc(12px + var(--safe-t))}
@media (max-width:700px){.scr.side{background:linear-gradient(180deg,#062a2ef2,#062a2ee6 60%,#062a2ef5)}
.scr.show{background:linear-gradient(180deg,#062a2e00 0,#062a2e00 26%,#062a2ef2 40%);justify-content:flex-end}
.scr.show .scroll{max-height:56vh}
.main-btns{grid-template-columns:1fr 1fr;gap:10px}.main-btns .btn .sub{display:none}.main-btns .btn,.main-btns .btn.big{font-size:16px;padding:13px 14px}
.foot{position:static;margin-top:14px}.title-wrap{margin-bottom:6px}.hud-br .spdbar{width:110px}.grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}}
@media (max-height:520px){.title-wrap{margin-top:0}.logo{font-size:54px}.tagline{margin:6px 0 10px}.btn.big{padding:12px 20px;font-size:18px}}
</style>

<body>
<canvas id="game" tabindex="0" aria-label="Micro Coverage game view"></canvas>
<div id="hud" class="hidden"></div>
<div id="banner"></div>
<div id="toasts"></div>
<div id="touch" class="hidden"></div>
<div id="menu"></div>
<div id="loading"><div><div class="lt">MICRO <b>COVERAGE</b></div><div class="bar"><i></i></div><div class="err" id="loaderr"></div></div></div>
<noscript><div style="position:fixed;inset:0;display:grid;place-items:center;background:#0d1f22;color:#fff;font:18px system-ui">Micro Coverage needs JavaScript.</div></noscript>
<script>
// surface load failures (e.g. CDN blocked) instead of a silent black screen
window.addEventListener('error', e => { const el = document.getElementById('loaderr'); if (el && document.getElementById('loading').style.display !== 'none') el.textContent = 'Could not start: ' + (e.message || 'a script failed to load') + '. Check your connection and reload.'; });
setTimeout(() => { const el = document.getElementById('loaderr'); if (el && !window.__mcBooted) el.textContent = 'Still loading… if this sticks, the 3D library may be blocked on this network.'; }, 9000);
</script>
<script type="module">
// ===== CONFIG =====
// All tunables live here. ?debug=1 exposes most of them in a live panel.
const CONFIG = {

gravity: 98,
gravityScale: 0.85,                 // g_eff ≈ 83 u/s²
camera: { elevationDeg: 35.264, yawDeg: 45, baseHalfHeight: 40, speedHalfHeight: 49, mobileHalfHeight: 36,
follow: 0.18, lookAhead: 0.35, lookAheadMax: 22, airZoom: 4, sharedMax: 95, boostPulse: 3 },
shake: { perImpulse: 1 / 400, decay: 1.5, maxOffset: 1.2, maxRollDeg: 0.6 },

collision: { carE: 0.3, carMu: 0.4, wallE: 0.2, wallMu: 0.3, propE: 0.35, propMu: 0.4 },
boost: { bars: 5, driftSlipDeg: 12, minSpeedFrac: 0.3, fillRate: 0.09, secondsPerBar: 0.4,
forceMul: 1.25, vMaxMul: 1.15, padBoost: 0.45 },

postpaid: { skill: 0.90, mistake: 0.04, reactMs: 120, catchup: 0.03, label: 'Postpaid', sub: 'Normal' },
business: { skill: 0.97, mistake: 0.01, reactMs: 60,  catchup: 0.0,  label: 'Business', sub: 'Hard' },
},
respawn: { fade: 0.35, ghost: 1.0 },
points: [10, 8, 6, 5, 4, 3, 2, 1],

// Surface table (§4.6). grip ×μ, drag (scaled by CONFIG.surfaceDragScale × speed), bump amp/freq.
const SURFACES = {
tile:    { grip: 0.90, drag: 0.0, bump: 0,    freq: 0,  color: '#e8eef0', particle: 'scuff', sound: 'squeak' },
carpet:  { grip: 1.05, drag: 0.6, bump: 0.05, freq: 9,  color: '#3d6b72', particle: 'fluff', sound: 'soft' },
wet:     { grip: 0.45, drag: 0.0, bump: 0,    freq: 0,  color: '#bfe6ee', particle: 'water', sound: 'hiss' },

gravel:  { grip: 0.75, drag: 0.5, bump: 0.10, freq: 8,  color: '#8d8a83', particle: 'dust',  sound: 'crunch' },
cable:   { grip: 0.80, drag: 0.8, bump: 0.28, freq: 13, color: '#30343a', particle: null,    sound: 'rattle' },
grating: { grip: 0.85, drag: 0.1, bump: 0.04, freq: 22, color: '#7d8a90', particle: 'spark', sound: 'clang' },

tarmac:  { grip: 1.00, drag: 0.0, bump: 0,    freq: 0,  color: '#4a5055', particle: 'scuff', sound: 'squeak' },
wood:    { grip: 0.95, drag: 0.05,bump: 0.03, freq: 10, color: '#b9875a', particle: 'scuff', sound: 'soft' },

plastic: { grip: 0.70, drag: 0.0, bump: 0,    freq: 0,  color: '#f2f2f2', particle: 'scuff', sound: 'squeak' },
kerb:    { grip: 1.00, drag: 0.1, bump: 0.16, freq: 30, color: '#00a3ad', particle: null,    sound: 'rumble' },
};
const POINT_DEFAULTS = { y: 0, w: 18, s: 'tile', L: 'wall', R: 'wall', look: 'floor', ease: 'smooth', wallH: 3.2 };
const DEBUG = typeof location !== 'undefined' && /[?&]debug=1/.test(location.search);
// ===== UTIL =====
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);

join(mode) {

: `<div class="card" style="opacity:.75"><h3>P${i + 1}</h3><div class="meta">Press <span class="kbd">Space</span> (WASD keys), <span class="kbd">I</span> (IJKL keys) or <span class="kbd">A</span> on a controller${IS_TOUCH ? ', or tap below' : ''}</div>${IS_TOUCH && !slots.some(s => s && s.src === 'touch') ? `<button class="btn" style="margin-top:8px" data-nav data-act="touch">Join with touch</button>` : ''}</div>`; }).join('')}
</div>
<div class="row" style="margin-top:8px"><div class="pill"><button data-nav data-act="ai" class="${aiFill ? 'on' : ''}">AI fill: ${aiFill ? 'on' : 'off'}</button></div>
<button class="btn big" data-nav data-act="go" ${slots.filter(Boolean).length >= (mode === 'dropped' ? 1 : 2) ? '' : 'disabled'}>Pick track →</button>
<span class="meta" style="font-size:13px">${mode === 'dropped' ? 'First to 5 round wins. Solo? AI joins in.' : 'At least two players. Change cars with ◀ ▶ or your left/right.'}</span></div>`,
{ name: 'join', back: () => { this.capture = null; this.title(); }, on: a => {
if (a === 'ai') { aiFill = !aiFill; render(); return; }
if (a === 'touch') { add('touch'); return; }
if (a.startsWith('car:')) { const [, i, d] = a.split(':'); slots[+i].car = (slots[+i].car + +d + avail.length) % avail.length; render(); return; }
if (a.startsWith('leave:')) { slots[+a.slice(6)] = null; while (slots.length && !slots[slots.length - 1]) slots.pop(); render(); return; }
if (a === 'go') go();
}, focus: '[data-act="go"]' });
};
const add = src => { if (slots.some(s => s && s.src === src)) return false; const i = slots.findIndex(s => !s); const at = i < 0 ? slots.length : i; if (at > 3) return false; slots[at] = { src, car: (at + 1) % avail.length, ready: false }; SND.ui('ok'); render(); return true; };
const go = () => {
const players = slots.filter(Boolean); if (players.length < (mode === 'dropped' ? 1 : 2)) return;
this.capture = null;
this.trackSelect(mode, (t, o) => {
const sel = Save.data.selected;
const entrants = players.map((p, i) => ({ car: avail[p.car].id, human: i, name: 'P' + (i + 1), livery: sel.livery[avail[p.car].id] || 0, cosmetics: { smoke: sel.smoke, topper: 'none', horn: sel.horn }, slot: i }));
const max = mode === 'dropped' ? 4 : 8;
if (aiFill || (mode === 'dropped' && entrants.length < 2)) RIVALS.slice(0, max - entrants.length).forEach((r, i) => entrants.push({ car: r.car, rival: r, name: r.name, color: r.color, slot: entrants.length }));
Game.startRace({ mode, track: t, laps: mode === 'dropped' ? Infinity : o.laps || 3, difficulty: o.difficulty || 'postpaid', entrants, sources: players.map(p => p.src), dropTarget: 5 });
}, () => this.join(mode));
};
// device join capture
this.capture = (code, e, pad) => {
if (UI.screen !== 'join') return false;
if (e && (e.code === 'Space' || e.code === 'KeyW') && !slots.some(s => s && s.src === 'kb1')) { add('kb1'); return true; }
if (e && (e.code === 'KeyI' || e.code === 'ShiftRight') && !slots.some(s => s && s.src === 'kb2')) { add('kb2'); return true; }
if (pad !== undefined && code === 'Enter' && !slots.some(s => s && s.src === 'pad' + pad)) { add('pad' + pad); return true; }
// per-device car cycling
const cyc = (src, d) => { const i = slots.findIndex(s => s && s.src === src); if (i < 0) return false; slots[i].car = (slots[i].car + d + avail.length) % avail.length; render(); return true; };
if (e && e.code === 'KeyA') return cyc('kb1', -1); if (e && e.code === 'KeyD') return cyc('kb1', 1);
if (e && e.code === 'KeyJ') return cyc('kb2', -1); if (e && e.code === 'KeyL') return cyc('kb2', 1);
if (pad !== undefined && (code === 'ArrowLeft' || code === 'ArrowRight') && slots.some(s => s && s.src === 'pad' + pad)) return cyc('pad' + pad, code === 'ArrowLeft' ? -1 : 1);
return false;
};
render();
},

if (car.stats.driftTime > 1) items.push([`Drifting ${car.stats.driftTime.toFixed(0)}s`, Math.round(car.stats.driftTime * 4)]);
if (car.stats.perfect) items.push(['Perfect start', 25]);
const mult = race.mode === 'gp' ? ({ prepaid: 1, postpaid: 1.25, business: 1.6 }[this.cfg.difficulty] || 1) : 1;
const total = Math.round(items.reduce((s, i) => s + i[1], 0) * mult);
return { items, total, mult };
},
onRaceDone() {
const r = this.race; if (!r || this.state !== 'race') return;
Touch.show(false); UI.hideHud();
const human = r.humans[0];
const yes = human && r.mode !== 'free' ? this.yesPoints(human, r) : { items: [], total: 0 };
if (yes.total) { Save.data.points += yes.total; }
Save.data.stats.races++; if (human && human.place === 1) Save.data.stats.wins++;
if (human && isFinite(r.laps) && r.mode !== 'dropped') Save.recordTimes(r.track.def.id, r.track.mirror, isFinite(human.bestLap) ? human.bestLap : null, human.finished && !human.projected ? human.finishTime : null, human.def.id);
Save.write();
SND.setIntensity(0);
if (r.mode === 'gp') { this.gpAfterRace(yes); return; }
Menus.results(r, yes);
},
// Grand Prix flow
startGP(cup, difficulty, carId) {
const c = CUPS.find(c => c.id === cup);
const sel = Save.data.selected;
this.session = { mode: 'gp', cup, difficulty, car: carId, tracks: c.tracks, index: 0, standings: {}, names: {}, lastOrder: null };
this.runGPRace();
},
gpEntrants() {
const s = this.session, sel = Save.data.selected;
const list = [{ car: s.car, human: 0, name: 'You', livery: sel.livery[s.car] || 0, cosmetics: { smoke: sel.smoke, topper: sel.topper, horn: sel.horn, trail: sel.trail } }]
.concat(RIVALS.map(r => ({ car: r.car, rival: r, name: r.name, color: r.color })));
// grid: first race player last; afterwards reverse championship order
if (!s.lastOrder) { list.forEach((e, i) => e.slot = i === 0 ? 7 : i - 1); }
else { const ranked = [...list.keys()].sort((a, b) => (s.standings[b] || 0) - (s.standings[a] || 0)); ranked.forEach((ei, rank) => list[ei].slot = 7 - rank); }
return list;
},
runGPRace() {
const s = this.session, t = s.tracks[s.index];
this.startRace({ mode: 'gp', track: { id: t.id, mirror: !!t.mirror }, laps: TRACKS[t.id].laps || 3, difficulty: s.difficulty, entrants: this.gpEntrants(), sources: ['any'] });
},
gpAfterRace(yes) {
const r = this.race, s = this.session;
const order = r.order;
order.forEach((c, i) => { s.standings[c.id] = (s.standings[c.id] || 0) + (CONFIG.points[i] || 0); s.names[c.id] = c.human >= 0 ? 'You' : c.name; });
s.lastOrder = order.map(c => c.id);
s.lastRace = order.map(c => ({ id: c.id, name: c.human >= 0 ? 'You' : c.name, car: c.def.name, time: c.finishTime, projected: c.projected, best: c.bestLap, human: c.human >= 0, pts: CONFIG.points[order.indexOf(c)] || 0 }));
s.yes = yes;
Menus.gpStandings(s, r);
},
gpNext() {
const s = this.session; s.index++;
if (s.index >= s.tracks.length) { this.gpFinish(); return; }
this.runGPRace();
},
gpFinish() {
const s = this.session;
const ranking = Object.keys(s.standings).map(Number).sort((a, b) => s.standings[b] - s.standings[a]);
const place = ranking.indexOf(0) + 1;
const rec = Save.data.cups[s.cup] || (Save.data.cups[s.cup] = {});
if (!rec[s.difficulty] || place < rec[s.difficulty]) rec[s.difficulty] = place;
const unlocked = [];
const u = Save.data.unlocks;
if (place <= 3 && s.cup === 'sim-only' && !u.cups.includes('bundle')) { u.cups.push('bundle'); unlocked.push('Bundle Cup + its 3 tracks'); }
if (place <= 3 && s.cup === 'bundle' && !u.cups.includes('unlimited')) { u.cups.push('unlimited'); unlocked.push('Unlimited Cup, Launch Day Madness & Dark Mode'); }
if (place === 1 && (s.difficulty === 'postpaid' || s.difficulty === 'business') && !u.mirror) { u.mirror = true; unlocked.push('Mirror tracks'); }
if (CUPS.every(c => (Save.data.cups[c.id] || {}).business === 1) && !u.cars.includes('ollie')) { u.cars.push('ollie'); unlocked.push('Ollie Special'); }
const bonus = [300, 180, 100][place - 1] || 0; Save.data.points += bonus;
Save.write();
Menus.podium(s, ranking, place, unlocked, bonus);
},
// ---------- loop ----------
frame(now) {
requestAnimationFrame(t => this.frame(t));
const raw = (now - this.last) / 1000;
let dt = Math.min(raw, 0.1); this.last = now;
this._raw = raw;
if (dt <= 0) return;
Input.pollPads();
const race = this.race;
if (this.showcase && this.showcase.on) { Showcase.update(dt); GFX.renderer.render(Showcase.scene, Showcase.camera); this.perf(dt); return; }
if (race) {
if (this.state === 'race' && race.state === 'grid' && !this.paused) { this.gridT -= dt; if (this.gridT <= 0) race.start(true); }
const live = !this.paused;
if (live) {
// controllers (read per frame, applied every physics step)
if (this.state === 'race') { if (this.autopilot) this.drive(race, dt); else race.humans.forEach((car, i) => Input.readPlayer(car.human, car, race, dt)); }
let scale = this.timeScale * (this.dbg.slow ? 0.25 : 1);
if (this.slowmoT > 0) { this.slowmoT -= dt; scale *= 0.5; }
if (FX.hitStop > 0) { FX.hitStop--; }
else {
this.acc += dt * scale;
let n = 0;
while (this.acc >= DT && n < 14) { if (race.state !== 'grid') race.step(DT); this.acc -= DT; n++; }
if (n >= 14) this.acc = 0;
}
}
const alpha = clamp(this.acc / DT, 0, 1);
updateCarVisuals(race, alpha, dt);
if (World) updateWorld(World, live ? dt : 0, race);
if (live) { carFX(race, dt); FX.update(dt); }
// camera focus
let focus = race.humans[0];
if (!focus) { focus = (race.order && race.order[0]) || race.cars[0]; }
if (Cam.mode === 'title') {
const lead = (race.order && race.order[0]) || race.cars[0];
Cam.update(dt, race, { x: lead.x, y: lead.y, z: lead.z, half: Math.max(60, Cam.baseHalf() * 1.35) });
} else Cam.update(dt, race, focus);
if (this.state === 'race') { UI.updateHud(race, dt); SND.updateEngines(race, this.paused); }
// gust debris + wind telegraph
if (live && race.env.wind.length && World) for (const wz of race.env.wind) if ((wz.phase === 'warn' || wz.phase === 'gust') && Math.random() < 0.5) { const R = race.track.routes[0], k = Math.round((wz.a + ((wz.b - wz.a + R.N) % R.N) / 2)) % R.N; FX.burst('wind', R.x[k] - wz.dir.x * 20, R.y[k], R.z[k] - wz.dir.z * 20, 1, wz.dir.x, wz.dir.z); }
if (live && World && World.fountain && Math.random() < 0.6) FX.emit(World.fountain.x + (Math.random() - 0.5), World.fountain.y, World.fountain.z + (Math.random() - 0.5), (Math.random() - 0.5) * 4, 12 + Math.random() * 4, (Math.random() - 0.5) * 4, 0.9, 0.5, '#bfe9ff', { grav: 28, drag: 0.5 });
}
GFX.post.uniforms.boost.value = race && race.humans[0] && race.humans[0].boostT > 0 ? 1 : 0;
renderFrame();
this.perf(dt);
},
perf(dt) {
// dynamic resolution (§17)
this.frameTimes.push(Math.min(this._raw ?? dt, 1) * 1000); if (this.frameTimes.length < 60) return;   // real frame time, not the clamped sim step
const avg = this.frameTimes.reduce((a, b) => a + b, 0) / this.frameTimes.length; this.frameTimes = [];
this.fps = 1000 / avg;
if (avg > 18 && GFX.dynScale > 0.6) { GFX.dynScale = Math.max(0.6, GFX.dynScale - 0.1); resize(); }
else if (avg < 14 && GFX.dynScale < 1) { this._goodT = (this._goodT || 0) + 1; if (this._goodT >= 3) { this._goodT = 0; GFX.dynScale = Math.min(1, GFX.dynScale + 0.1); resize(); } }
if (this.dbg.perf) { const el = document.getElementById('dbgperf'); if (el) el.textContent = `${this.fps.toFixed(0)} fps · ${GFX.renderer.info.render.calls} calls · ${(GFX.renderer.info.render.triangles / 1000).toFixed(0)}k tris · scale ${GFX.dynScale.toFixed(1)}`; }
},
// ---------- debug (?debug=1) ----------
async initDebug() {
addEventListener('keydown', e => {
if (e.code === 'KeyT') this.dbg.slow = !this.dbg.slow;
if (e.code === 'F4') { e.preventDefault(); this.dbg.perf = !this.dbg.perf; let el = document.getElementById('dbgperf'); if (!el) { el = document.createElement('div'); el.id = 'dbgperf'; el.style.cssText = 'position:fixed;left:8px;bottom:8px;z-index:60;font:12px monospace;background:#000a;padding:4px 8px;border-radius:6px'; document.body.appendChild(el); } el.style.display = this.dbg.perf ? '' : 'none'; }
if (e.code === 'F1') { e.preventDefault(); this.toggleLineOverlay(); }
if (e.code === 'KeyG' && this.race && this.race.humans[0]) { const c = this.race.humans[0], R = this.race.track.routes[0]; const k = (c.idx + 60) % R.N; placeCar(c, this.race.track, R.x[k], R.z[k], R.y[k], Math.atan2(R.tx[k], R.tz[k])); }
if (e.code === 'F9') { e.preventDefault(); renderFrame(); const a = document.createElement('a'); a.download = 'micro-coverage.png'; a.href = GFX.renderer.domElement.toDataURL('image/png'); a.click(); }
});
try {
const { default: GUI } = await import('lil-gui');
const gui = new GUI({ title: 'Micro Coverage tuning' }); gui.close();
const car = gui.addFolder('Car baseline (Coupe)');
for (const k of ['maxSteer', 'steerRate', 'alphaPeakDeg', 'slideFactor', 'handbrakeGrip', 'cgHeight', 'inertiaScale', 'engineBrake', 'cAero', 'cRoll', 'loadSmoothing']) car.add(CONFIG.car, k);
const g = gui.addFolder('World'); g.add(CONFIG, 'gravityScale', 0.5, 1.5); g.add(CONFIG, 'loadTransferScale', 0, 1.2); g.add(CONFIG, 'surfaceDragScale', 0, 1);
const cam = gui.addFolder('Camera'); for (const k of ['baseHalfHeight', 'speedHalfHeight', 'follow', 'lookAhead', 'lookAheadMax', 'airZoom']) cam.add(CONFIG.camera, k);
const s = gui.addFolder('Surfaces'); for (const [n, v] of Object.entries(SURFACES)) s.add(v, 'grip', 0.2, 1.5).name(n + ' grip');
const a = gui.addFolder('AI'); for (const [n, v] of Object.entries(CONFIG.ai)) { a.add(v, 'skill', 0.6, 1.1).name(n + ' skill'); a.add(v, 'mistake', 0, 0.3).name(n + ' mistakes'); }
gui.add({ apply: () => { if (this.race) for (const c of this.race.cars) { const d = fullCarDef(c.def.id); Object.assign(c.def, d); } for (const t of Object.values(this.trackCache)) t.speedCache = {}; } }, 'apply').name('Apply to cars');
gui.add({ copy: () => { navigator.clipboard && navigator.clipboard.writeText(JSON.stringify({ car: CONFIG.car, camera: CONFIG.camera, ai: CONFIG.ai, surfaces: Object.fromEntries(Object.entries(SURFACES).map(([k, v]) => [k, v.grip])) }, null, 2)); UI.toast('Tuning JSON copied', 'y'); } }, 'copy').name('Copy JSON');
} catch (e) { console.warn('lil-gui unavailable', e); }
},
toggleLineOverlay() {
if (!World || !this.race) return;
if (World.lineOverlay) { World.group.remove(World.lineOverlay); World.lineOverlay = null; return; }
const g = new THREE.Group();
for (const R of this.race.track.routes) {
const pts = []; for (let k = 0; k < R.N; k++) pts.push(new THREE.Vector3(R.x[k] + R.nx[k] * R.line[k], R.y[k] + 0.3, R.z[k] + R.nz[k] * R.line[k]));
const geo = new THREE.BufferGeometry().setFromPoints(pts);
const cols = []; const prof = speedProfile(this.race.track, fullCarDef('coupe'))[this.race.track.routes.indexOf(R)];
for (let k = 0; k < R.N; k++) { const c = new THREE.Color().setHSL(clamp(prof[k] / 70, 0, 1) * 0.33, 1, 0.5); cols.push(c.r, c.g, c.b); }
geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
g.add(new (R.closed ? THREE.LineLoop : THREE.Line)(geo, new THREE.LineBasicMaterial({ vertexColors: true, depthTest: false, transparent: true, opacity: 0.7 })));
}
g.renderOrder = 200; World.group.add(g); World.lineOverlay = g;
},
};
// car showcase (car select / garage turntable)
const Showcase = {
scene: null, camera: null, car: null, t: 0, key: '',
init() {
if (this.scene) return;
const s = this.scene = new THREE.Scene();
s.background = new THREE.Color('#0a3b40');
s.add(new THREE.HemisphereLight('#e9fbff', '#0b2a2e', 1.6));
const d = new THREE.DirectionalLight('#ffffff', 2.2); d.position.set(6, 12, 8); s.add(d);
const ped = new THREE.Mesh(new THREE.CylinderGeometry(5.2, 5.6, 0.8, 40), new THREE.MeshStandardMaterial({ color: '#004d55', roughness: 0.6 })); ped.position.y = -0.4; s.add(ped);
const ring = new THREE.Mesh(new THREE.TorusGeometry(5.4, 0.14, 8, 60), new THREE.MeshBasicMaterial({ color: PAL.yellow, toneMapped: false })); ring.rotation.x = Math.PI / 2; ring.position.y = 0.02; s.add(ring);
this.camera = new THREE.PerspectiveCamera(30, 1, 0.1, 200);
},
show(carId, livery, cosmetics) {
this.init();
const key = carId + ':' + livery + ':' + JSON.stringify(cosmetics || {});
Game.showcase = { on: true };
if (key === this.key && this.car) return;
this.key = key;
if (this.car) { this.scene.remove(this.car); }
const def = fullCarDef(carId);
const fake = { def, livery, human: 0, color: null, cosmetics: cosmetics || {} };
const { geo, at } = carGeometry(def, liveryColors(fake));
const g = new THREE.Group();
const body = new THREE.Group(); g.add(body);
body.add(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.42, metalness: 0.08 })));
const o = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: '#0b1416', side: THREE.BackSide })); o.scale.setScalar(1.05); body.add(o);
const wg = wheelGeometry(), wm = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.8 });
for (const [x, z] of [[1, 1], [-1, 1], [1, -1], [-1, -1]]) { const w = new THREE.Mesh(wg, wm); w.position.set(x * (def.width / 2 - 0.12), 0.78, z * def.wheelbase / 2); g.add(w); }
if (cosmetics && cosmetics.topper && cosmetics.topper !== 'none') makeTopper(cosmetics.topper, at.top, body);
this.body = body; this.car = g; this.scene.add(g);
},
hide() { if (Game.showcase) Game.showcase.on = false; },
update(dt) {
this.t += dt;
const a = GFX.w / GFX.h; this.camera.aspect = a; this.camera.updateProjectionMatrix();
const wide = a > 1.1;
if (wide) { this.camera.position.set(-8.5, 9, 25); this.camera.lookAt(-8.5, 1.4, 0); }
else { this.camera.position.set(0, 12, 30); this.camera.lookAt(0, -3.5, 0); }
if (this.car) { this.car.rotation.y = this.t * 0.6; this.body.position.y = Math.sin(this.t * 2.2) * 0.06; this.body.rotation.x = Math.sin(this.t * 1.7) * 0.02; this.body.rotation.z = Math.sin(this.t * 1.3) * 0.025; }
},
};
// ---------- start ----------
Game.boot().catch(err => {
console.error(err);
const el = document.getElementById('loaderr'); if (el) el.textContent = 'Something went wrong starting the game: ' + err.message;
});
</script>
