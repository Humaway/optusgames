<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JARVIS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  JARVIS trainer — a look-alike of the Amdocs CRM "JARVIS" client used in Optus stores,
  built so new starters can get familiar with the layout.

  HOW TO EXTEND (everything lives in the <script> at the bottom):
    • CONFIG ............ user ID, dealer code, version etc. (title bar + notes prefix)
    • MENUS ............. every menu, item, shortcut and submenu. Give an item an `action` id to wire it up.
    • QUICK_ACTIONS ..... the Quick Actions list in the Interaction Toolbox.
    • WINDOW_TYPES ...... windows that open in the work area (Find Caller CIM Search is the first one).
                          Add a new entry with { title, render(body, win) } and open it with JARVIS.openWindow('id').
    • ACTIONS ........... map of action id -> function. Anything without an entry shows a
                          "not available yet" message in the status bar instead of doing nothing.
-->
<style>
:root{
  --ui: Arial, "Liberation Sans", Helvetica, sans-serif;          /* Java "Dialog" font on Windows = Arial */
  --win: "Segoe UI", "Segoe UI Variable Text", Arial, sans-serif;  /* Windows 8 title bar */
  --field: Verdana, "DejaVu Sans", Geneva, sans-serif;            /* Toolbox title / notes fields */
  --teal-dark:#23434c;     /* menu text, menu highlight */
  --cyan:#01afd1;          /* window headers, buttons */
  --cyan-line:#1ab7d5;     /* button outlines */
  --slate:#4c5563;         /* toolbox headers */
  --panel:#f0f0ed;         /* toolbox background */
  --form-panel:#d8dee2;    /* grouped form panels */
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#fff}
body{font:13px/15px var(--ui);color:#222;-webkit-user-select:none;user-select:none;cursor:default}
input,select,textarea,button{font:inherit;color:inherit}
input,textarea{-webkit-user-select:text;user-select:text}
svg{display:block}

#app{display:flex;flex-direction:column;height:100vh;min-width:1100px}

/* ---------- Title bar (Windows 8 style, maximised) ---------- */
#titlebar{position:relative;flex:0 0 29px;height:29px;
  background:linear-gradient(#5bbdcb 0 1px,#66d3e2 1px 27px,#5ec3d1 27px 28px,#85c6cf 28px)}
#titlebar .app-ico{position:absolute;left:3px;top:4px;width:19px;height:19px}
#tbTitle{position:absolute;left:0;right:0;top:0;height:28px;text-align:center;
  font:15px/28px var(--win);color:#1b1b1b;white-space:pre;pointer-events:none}
.cap-btn{position:absolute;top:0;height:23px}
.cap-btn svg{margin:0 auto}
.cap-min{right:95px;width:30px}
.cap-max{right:63px;width:30px}
.cap-min:hover,.cap-max:hover{background:rgba(255,255,255,.35)}
.cap-close{right:4px;width:56px;background:#c75050;box-shadow:inset 0 1px 0 #b24747}
.cap-close:hover{background:#e04343}

/* ---------- Menu bar ---------- */
#menubar{flex:0 0 25px;height:25px;background:#f2f2f2;box-shadow:inset 0 -2px #c9c9c9,inset 0 -1px #bcbcbc;
  white-space:nowrap;position:relative;z-index:2}
.mb-item{display:inline-block;vertical-align:top;height:23px;line-height:23px;padding:0 6px;color:var(--teal-dark)}
.mb-item.open{background:var(--teal-dark);color:#fff}
.mn{text-decoration:none}
body.show-mn .mn{text-decoration:underline;text-underline-offset:2px}

/* ---------- Dropdown menus ---------- */
.menu{position:fixed;z-index:1000;background:#fafafa;border:1px solid #a0a0a0;padding:3px;
  box-shadow:inset 0 0 0 1px #d7d7d7,inset 0 0 0 2px #f0f0f0,inset 0 0 0 3px #f2f2f2}
.menu table{border-collapse:collapse;border-spacing:0}
.menu tr.mi td{height:27.5px;line-height:27.5px;padding:0;white-space:nowrap;color:var(--teal-dark)}
.menu tr.mi.chk td{height:24px;line-height:24px}
.menu tr.mi.dis td{color:#a2a2a2}
.menu tr.mi.armed:not(.dis) td{background:var(--teal-dark);color:#fff}
.menu td.ic{width:38px;position:relative}
.menu td.ic svg{position:absolute;left:10px;top:50%;transform:translateY(-50%)}
.menu tr.mi td.lb{padding-right:14px}
.menu tr.mi td.sc{padding-right:11px}
.menu.has-sub tr.mi td.sc{padding-right:4px}
.menu td.ar{width:0;position:relative}
.menu.has-sub td.ar{width:17px}
.menu td.ar i{position:absolute;left:6px;top:50%;margin-top:-4px;width:0;height:0;
  border-left:4px solid #282828;border-top:4px solid transparent;border-bottom:4px solid transparent}
.menu tr.mi.armed:not(.dis) td.ar i{border-left-color:#fff}
.menu tr.sep td{height:2px;padding:0;font-size:0;line-height:0;background:linear-gradient(#b4b4b4 0 1px,#d6d6d6 1px)}
.menu tr.mi.armed:not(.dis) td.ic svg .chk{stroke:#fff}

/* ---------- Toolbar ---------- */
#toolbar{position:relative;flex:0 0 128px;height:128px;border-bottom:1px solid #969696;background:#fff;overflow:hidden}
#toolbar > *{position:absolute}
.tb-sep{top:3px;height:122px;width:2px;border-left:1px solid #c9c9c9;border-right:1px solid #d8d8d8}
.tb-sep.rev{border-left-color:#d8d8d8;border-right-color:#c9c9c9}
.tb-sep.etched{width:3px;border-left:1px solid #e7e7e7;border-right:1px solid #f7f7f7;background:#b9b9b9}
#phonePanel{left:11px;top:3px;width:273px;height:98px;background:#d6d6d6;border:1px solid #e2e2e2;border-top-color:#eaeaea}
.st-btn{left:14px;top:5px;width:35px;height:28px;background:#e0e0e0;border-radius:5px 0 0 5px;
  box-shadow:inset 1px 1px 0 #8f8f8f,inset -1px -1px 0 #a6a6a6,0 0 0 1px #cecece}
.st-btn svg{position:absolute;left:6px;top:4px}
.st-dd{left:49px;top:5px;width:15px;height:28px;background:#fff;border-radius:0 5px 5px 0}
.st-dd i{position:absolute;left:4px;top:13px;border-top:4px solid var(--teal-dark);border-left:3px solid transparent;border-right:3px solid transparent}
.ph-btn{top:5px;width:30px;height:27px;background:#fff;border-radius:6px;box-shadow:0 0 0 1px #e6e6e6}
.ph-btn svg{position:absolute;left:4px;top:0}
.hold-lbl{left:183px;top:13px;font-size:12px;line-height:14px;color:#111}
.hold-time{left:230px;top:12px;width:37px;overflow:hidden;font-size:14px;line-height:16px;letter-spacing:1.2px;color:#111;white-space:nowrap}
.hold-dash{left:271px;top:8px;width:11px;height:4px;border-radius:2px;background:var(--cyan)}
.rdy-btn{left:81px;top:36px;width:32px;height:31px;background:#fff;border:1px solid var(--cyan-line);border-radius:6px}
.rdy-btn svg{position:absolute;left:4px;top:2px}
.home-btn{left:14px;top:73px;width:66px;height:27px;background:#fff;border-radius:5px}
.home-btn svg{position:absolute;left:25px;top:3px}
.ctx-combo{left:82px;top:73px;width:154px;height:27px;background:#fff;box-shadow:0 0 0 1px #e9e9e9}
.ctx-combo select{-webkit-appearance:none;appearance:none;border:0;outline:0;background:transparent;width:100%;height:27px;
  padding:0 22px 3px 5px;color:#464a57;font:13px var(--ui);cursor:default}
.ctx-combo svg{position:absolute;right:6px;top:10px;pointer-events:none}
.plus-btn{left:237px;top:72px;width:35px;height:28px;background:#fff;border:1px solid #41bad2;border-radius:6px}
.plus-btn svg{position:absolute;left:8px;top:5px}
.card{top:5px;height:85px;background:#d4d4d4;border-radius:5px;box-shadow:0 0 0 2px #efefec}
.tb-lbl{top:101px;line-height:15px;color:var(--teal-dark)}
.tb-btn{top:95px;height:27px;background:#fff;border:1px solid var(--cyan-line);border-radius:7px}
.tb-btn.grey{border-color:#d8d8d8}
.tb-btn svg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.tb-btn:active,.rdy-btn:active,.plus-btn:active,.home-btn:active{background:#e8f7fb}
#custField{left:875px;top:95px;width:113px;height:27px;border:1px solid #d8d8d8;border-right-color:#e0e0e0;outline:0;padding:0 4px;
  box-shadow:0 0 0 1px #f2f2f2}
#optusLogo{left:1287px;top:56px}

/* ---------- Main area ---------- */
#main{flex:1 1 auto;display:flex;min-height:0}
#toolbox{flex:0 0 387px;width:387px;position:relative;display:flex;flex-direction:column;min-height:0;
  background:var(--panel) linear-gradient(#848484 0 1px,#bcbcbc 1px 2px,#ecedef 2px 3px) no-repeat 0 0/100% 3px;padding-top:3px}
#toolbox::before,#toolbox::after{content:"";position:absolute;top:0;bottom:0;pointer-events:none;z-index:3}
#toolbox::before{left:0;width:2px;background:linear-gradient(90deg,#5e5e5e 0 1px,#8f8f8f 1px)}
#toolbox::after{right:0;width:3px;background:linear-gradient(90deg,#9a9a9a 0 1px,#6e6e6e 1px 2px,#d1d1d1 2px)}
.tbx-in{flex:1 1 auto;display:flex;flex-direction:column;margin:0 3px 0 2px;min-height:0;border-bottom:1px solid #a9a9a9}
.sec-hd{flex:0 0 25px;height:25px;line-height:28px;overflow:hidden;position:relative;background:var(--slate);
  color:#fff;font:bold 17px/29px var(--ui);letter-spacing:.7px;padding-left:7px;
  box-shadow:inset 0 1px #5e6672,inset 0 -1px #545c69}
.sec-hd.h26{flex-basis:26px;height:26px}
.sec-hd .sec-ic{position:absolute;right:4px;top:0;width:16px;height:100%;cursor:default}
.sec-hd .sec-ic svg{position:absolute;left:2px;top:50%;transform:translateY(-50%)}
.sec-gap{flex:0 0 2px;background:linear-gradient(#979899 0 1px,#d7d7d5 1px)}
.sec-gap.lt{background:linear-gradient(#f1f1ee 0 1px,#fdfdfd 1px)}
.sec-body{position:relative;min-height:0;overflow:hidden}
.sec.collapsed .sec-body{display:none}

/* Interaction Toolbox body */
#itBody{flex:547 1 0;min-height:250px}
.it-lbl{position:absolute;left:3px;line-height:15px;color:#222}
.it-title{position:absolute;left:3px;top:16px;width:377px;height:25px;border:1px solid #a7a7a7;background:#f0f0f0;
  box-shadow:0 0 0 1px #d0d0ce;font:14px/23px var(--field);color:#8d8a8a;padding-left:4px;white-space:nowrap;overflow:hidden}
.reasons{position:absolute;left:254px;top:44px;line-height:15px;color:#7b7778;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.reasons-ic{position:absolute;left:347px;top:42px;cursor:pointer}
.qa{position:absolute;left:10px;top:72px;width:362px;height:124px;background:#fff;border:1px solid #d9d9d7;border-left-color:#e2e2e0;
  box-shadow:inset 1px 0 #d8dcde}
.qa-hd{position:absolute;left:1px;top:0;width:337px;height:26px;line-height:26px;background:#becbd3;color:#71878f;
  font:bold 13px/26px var(--ui);letter-spacing:.5px;padding-left:6px;box-shadow:inset -1px 0 #90a9b8}
.qa-hdline{position:absolute;left:1px;top:26px;width:337px;height:1px;background:#e4e9ec}
.qa-list{position:absolute;left:1px;top:27px;width:337px;bottom:0;overflow:hidden}
.qa-row{height:34px;border-bottom:1px solid #d9d9d9;border-right:1px solid #d7d7d7;padding:2px 0 0 3px;line-height:30px;color:#222;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qa-row:nth-child(even){background:#fafafa}
.qa-sb{position:absolute;right:0;top:26px;bottom:0;width:22px}
.sb-btn{position:absolute;left:0;width:21px;height:22px;background:#fff;border:1px solid #a9a9a9;border-radius:7px}
.sb-btn svg{position:absolute;left:5px;top:6px}
.sb-up{top:0}
.sb-dn{bottom:0;border-color:#909090}
.sb-track{position:absolute;left:0;top:21px;bottom:21px;width:21px;background:#e0e0e0;border:1px solid #a2a2a2;border-radius:6px}
.sb-thumb{position:absolute;left:-1px;width:21px;height:12px;background:#fff;border:1px solid #8f8f8f;border-radius:6px;box-shadow:inset 0 -1px #c3c3c3}
.notes{position:absolute;left:3px;top:219px;width:377px;bottom:0;border:1px solid #a3a3a3;box-shadow:inset 0 0 0 1px #c9c9c7;
  background:#f0f0f0;font:14px/19px var(--field);color:#7a7a7a;padding:8px 7px 6px;resize:none;outline:0;margin:0}
.notes[readonly]{cursor:default}

/* Open Windows */
#owBody{flex:308 1 0;min-height:60px;padding:2px 2px 0 3px;background:linear-gradient(#c8c8c6 0 1px,#ced0d1 1px 2px,transparent 2px)}
.ow-list{height:100%;background:#fff;border:1px solid #8e939b;box-shadow:inset 0 0 0 1px #f2f2f3;overflow:auto;padding:1px}
.ow-item{height:20px;line-height:20px;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#222}
.ow-item.active{background:var(--teal-dark);color:#fff}
.ow-item.min{color:#7a7a7a}

/* Collapsed sections */
.sec.extra .sec-body{flex:250 1 0;min-height:60px;padding:2px 2px 0 3px}
.sec.extra .sec-body .ow-list{height:100%}
.tbx-foot{flex:0 0 21px;height:21px;background:var(--slate);position:relative;box-shadow:inset 0 1px #86898d,inset 0 -1px #656b75}
.tbx-foot i{position:absolute;right:7px;top:5px;border-left:6px solid #000;border-top:5px solid transparent;border-bottom:5px solid transparent}

/* Work area + internal windows */
#workarea{flex:1 1 auto;position:relative;overflow:hidden;background:#fff;border-top:1px solid #b4b4b4}
.iwin{position:absolute;display:flex;flex-direction:column;background:#fff;border-right:2px solid #61c9d7;border-bottom:2px solid #61c9d7}
.iwin.max{left:0;top:0;right:0;bottom:0}
.iwin:not(.max){border:2px solid #61c9d7;border-top:0;box-shadow:2px 3px 8px rgba(0,0,0,.25)}
.iwin.minimised{display:none}
.iwin-hd{flex:0 0 31px;height:31px;line-height:31px;background:var(--cyan);box-shadow:inset 0 -1px #6dd1e4;color:#fff;
  font:bold 17px/31px var(--ui);letter-spacing:.6px;padding-left:2px;position:relative;white-space:nowrap}
.iwin:not(.active) .iwin-hd{background:#7fcfe0}
.iwin-btns{position:absolute;right:13px;top:0;display:flex;gap:15px}
.iwin-btns span{width:28px;height:31px;position:relative}
.iwin-btns svg{position:absolute;left:7px;top:50%;transform:translateY(-50%)}
.iwin-btns span:hover{background:rgba(255,255,255,.18)}
.iwin-body{flex:1 1 auto;overflow:auto;position:relative}

/* Find Caller CIM Search form */
.fc{position:relative;padding:3px 0 12px 2px;width:1300px}
.fc-sec{height:15px;line-height:15px;margin:5px 0 4px;color:#222}
.fc-sec:first-child{margin-top:0}
.fc-panel{width:1167px;background:var(--form-panel);border-radius:5px;padding:8px 0 5px 8px}
.fc-row{display:flex;gap:6px;height:51px}
.fc-row.tall{height:58px}
.fc-cell{position:relative}
.fc-cell label,.fc-cell .lbl{display:block;height:15px;line-height:15px;margin-bottom:5px;color:#222;white-space:nowrap}
.fc-row.tall .lbl{height:22px;line-height:22px}
.fc input[type=text]{display:block;width:100%;height:27px;border:1px solid #dcdcdc;border-top-color:#dddddd;border-bottom-color:#d4d4d4;
  background:#fff;outline:0;padding:0 5px;font:13px var(--ui);color:#222}
.fc .sel{position:relative;height:28px}
.fc .sel select{-webkit-appearance:none;appearance:none;display:block;width:100%;height:28px;border:1px solid #dcdcdc;background:#fff;
  outline:0;padding:0 26px 0 5px;font:13px var(--ui);color:#222;border-radius:0}
.fc .sel svg{position:absolute;right:4px;top:10px;pointer-events:none}
.fc .sel select:disabled{background:#e0e0e0;border-color:#949494;color:#8b8b8b;box-shadow:inset 0 0 0 1px #dbdbdb}
.fc .sel.dis svg path{stroke:#8b8b8b}
.fc .chk{position:absolute;top:0;height:22px;line-height:22px;display:flex;align-items:center;gap:7px;color:#222;white-space:nowrap}
.fc .chk input{-webkit-appearance:none;appearance:none;width:14px;height:14px;margin:0;background:#fff;border:1px solid #ececec;border-radius:3px;position:relative}
.fc .chk input:checked::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid var(--teal-dark);border-width:0 2px 2px 0;transform:rotate(45deg)}
.fc-btns{position:absolute;left:1186px;top:22px;display:flex;flex-direction:column;gap:2px}
.jbtn{width:97px;height:29px;border:1px solid #3bc1db;border-radius:6px;background:#fff;color:#03afd1;font:bold 14px var(--ui);
  letter-spacing:.2px;padding:0;cursor:default}
.jbtn:hover{background:#f0fafd}
.jbtn:active{background:#dff4fa}

/* ---------- Status bar ---------- */
#statusbar{flex:0 0 30px;height:30px;position:relative;background:#fff}
#statusbar.hidden{display:none}
.sb-grip{position:absolute;top:3px;height:24px;width:2px;border-left:1px solid #c9c9c9;border-right:1px solid #d8d8d8}
.sb-red{position:absolute;left:16px;top:9px;width:14px;height:13px;border:1px solid #ff7f7f;padding:1px;background:#fff}
.sb-red::after{content:"";display:block;width:100%;height:100%;background:#f00}
#statusText{position:absolute;left:35px;right:32px;top:4px;height:22px;border:1px solid #b9b9b9;border-right-color:#c9c9c9;
  box-shadow:0 0 0 1px #e7e7e7;line-height:20px;padding-left:5px;color:#222;white-space:nowrap;overflow:hidden}
.sb-etch{position:absolute;top:4px;height:22px;width:3px;border-left:1px solid #e7e7e7;border-right:1px solid #f7f7f7;background:#b9b9b9}

/* Maximise work area (View menu) */
body.max-work #toolbar,body.max-work #toolbox{display:none}

/* ---------- Customer context (toolbar panels after authentication) ---------- */
.home-btn{color:#bdbdbd}
.home-btn.on{box-shadow:0 0 0 1px var(--cyan-line);color:var(--cyan)}
.card.sel{background:#eeeeee;box-shadow:0 0 0 2px #e9b54a}
.card .cc{position:absolute;inset:0;overflow:hidden;font-size:13px;line-height:17px;color:#1f3550}
.cc-person svg{position:absolute;left:5px;top:18px}
.cc .ln{position:absolute;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-person .ln{left:47px;right:8px}
.cc-bill svg{position:absolute;left:6px;top:13px}
.cc-bill .ln{left:49px;color:#244955}
.cc-bill .ln.v{left:159px;font-weight:bold;color:#21232d}
.cc-bill .ln.v.lnk{color:#014182;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.cc-svc{display:grid;grid-template-columns:96px auto;align-content:start;padding:4px 0 0 10px;color:#345159}
.cc-svc span{display:flex;align-items:center;gap:10px;white-space:nowrap;height:20px;line-height:20px}
.cc-svc svg{flex:0 0 16px}
.tb-link{top:101px;line-height:15px;color:#044489;font-weight:bold;text-decoration:underline;text-underline-offset:2px;cursor:pointer;white-space:nowrap;display:none;overflow:hidden;text-overflow:ellipsis}
.tb-link.plain{font-weight:normal;color:#1f3b73}
.tb-link.off{color:#879099;cursor:default}
body.has-ctx .tb-link{display:block}
.it-req{position:absolute;left:0;color:#e03030;font-size:12px;line-height:10px;display:none}
body.has-ctx .it-req{display:block}
.req::before{content:"*";position:absolute;left:-3px;top:-4px;color:#e03030;font-size:11px}

/* ---------- Generic grid (search results, interaction lists) ---------- */
.jbtn.sm{width:auto;height:23px;padding:0 9px;font-size:12px;border-radius:5px;letter-spacing:0;white-space:nowrap}
.jbtn.ic{width:44px;height:23px;padding:0;border-radius:5px;display:inline-flex;align-items:center;justify-content:center}
.jbtn.ic svg{display:block}
.gtool{display:flex;align-items:center;gap:6px;height:33px;padding:0 5px}
.gtool .sp{flex:1}
.gsel{height:23px;border:1px solid #c8c8c8;background:#fff;font:12px var(--ui);color:#222;padding:0 4px;border-radius:2px}
.gear{display:inline-flex;align-items:center;height:23px;border:1px solid #c8c8c8;border-radius:3px;background:#fff}
.gear span{display:flex;align-items:center;justify-content:center;width:30px;height:21px;border-right:1px solid #ddd}
.gear i{display:block;width:12px;height:21px;position:relative}
.gear i::after{content:"";position:absolute;left:3px;top:9px;border-top:4px solid #555;border-left:3px solid transparent;border-right:3px solid transparent}
.grid{border:1px solid #d5d5d5;background:#fff;overflow:auto;position:relative}
.grid table{border-collapse:collapse;min-width:100%;table-layout:fixed}
.grid th{position:sticky;top:0;z-index:1;background:#f1f1f1;height:26px;text-align:left;font:bold 12px var(--ui);color:#333;padding:0 6px;white-space:nowrap;
  border-bottom:1px solid #e2e2e2}
.grid th i{display:inline-block;margin-left:6px;vertical-align:1px;border-top:6px solid var(--cyan);border-left:4px solid transparent;border-right:4px solid transparent}
.grid td{height:30px;padding:0 6px;font-size:12px;color:#222;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid #ececec}
.grid tbody tr:nth-child(even) td{background:#f9f9f9}
.grid tr.on td{background:#f5b73a !important}
.grid td.lnk span{text-decoration:underline;color:#1f3b73;cursor:pointer}
.grid .flt td{height:27px;background:#fff !important;padding:1px 2px;border-bottom:1px solid #e2e2e2}

function accountHistory(a) {
  const n = DUMMY_ACCOUNTS.indexOf(a), name = a.customerName;
  const day = k => { const d = new Date(2026, 9, 18 - k * 9 - n); return d; };
  const fmt = (d, h, m) => `${d.getDate()}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()} ${h}:${String(m).padStart(2, '0')} ${h < 12 ? 'AM' : 'PM'}`.replace(/ (1[3-9]|2\d):/, (x, hh) => ` ${hh - 12}:`);
  const ints = HISTORY_TEMPLATES.interactions.filter((_, i) => (i + n) % 3 !== 0).map(([title, media], i) =>
    ({ created: fmt(day(i), 9 + ((i * 3 + n) % 8), (i * 17 + n * 7) % 60), title, media, direction: 'Inbound' }));
  const work = HISTORY_TEMPLATES.work.slice(0, 1 + (n % 3)).map(([type, status], i) =>
    ({ modified: fmt(day(i * 2), 10 + i, (n * 11 + i * 23) % 60), type, id: `24${String(n + 1).padStart(2, '0')}${310 + i * 7}A`, title: `Order for '${name}'`, status: i === 0 && n % 3 === 2 ? 'Open' : status }));
  return { ints, work };
}

/* Find Caller lookup: every filled field must match. IDs/numbers ignore spaces,
   names match from the start (case-insensitive), address/email match case-insensitively. */
function searchDummyAccounts(c) {
  const digits = s => String(s || '').replace(/\D/g, '');
  const low = s => String(s || '').trim().toLowerCase();
  const tests = [];
  const add = (val, fn) => { if (String(val || '').trim()) tests.push(fn); };
  add(c.serviceId,  a => a.services.some(s => digits(s.serviceId) === digits(c.serviceId)));
  add(c.imei,       a => a.services.some(s => digits(s.imei) === digits(c.imei)));
  add(c.simSerial,  a => a.services.some(s => digits(s.simSerial) === digits(c.simSerial)));
  add(c.streetNumber, a => low(a.address.streetNumber) === low(c.streetNumber));
  add(c.streetName, a => low(a.address.streetName).startsWith(low(c.streetName)));
  add(c.suburb,     a => low(a.address.suburb) === low(c.suburb));
  add(c.postcode,   a => a.address.postcode === String(c.postcode).trim());
  add(c.state,      a => a.address.state === c.state);
  add(c.firstName,  a => a.contacts.some(p => low(p.firstName).startsWith(low(c.firstName))));
  add(c.lastName,   a => a.contacts.some(p => low(p.lastName).startsWith(low(c.lastName))));
  add(c.phone,      a => a.contacts.some(p => digits(p.phone) === digits(c.phone)));
  add(c.email,      a => a.contacts.some(p => low(p.email) === low(c.email)));
  add(c.contactId,  a => a.contacts.some(p => p.contactId === digits(c.contactId)));
  add(c.altValue,   a => a.contacts.some(p => low(p.altValue) === low(c.altValue)));
  add(c.accountId,  a => a.accountId === digits(c.accountId));
  add(c.accountName, a => low(a.accountName).startsWith(low(c.accountName)));
  add(c.abn,        a => digits(a.abn) === digits(c.abn));
  add(c.acn,        a => digits(a.acn) === digits(c.acn));
  add(c.customerId, a => a.customerId === digits(c.customerId));
  add(c.customerName, a => low(a.customerName).startsWith(low(c.customerName)));
  add(c.billingArrangementId, a => a.billingArrangementId === digits(c.billingArrangementId));
  add(c.financialAccountId, a => a.financialAccountId === digits(c.financialAccountId));
  if (!tests.length) return null;   // nothing entered
  return DUMMY_ACCOUNTS.filter(a => tests.every(t => t(a)));
}

const digitsOf = s => String(s || '').replace(/\D/g, '');
const escHTML = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// One row per subscription, paired with the contact who uses it.
function recordsFor(accounts) {
  const rows = [];
  for (const a of accounts) for (const s of a.services) {
    rows.push({ account: a, contact: a.contacts.find(p => p.contactId === s.contactId) || a.contacts[0], service: s });
  }
  return rows;
}
function quickSearch(value) {
  const q = digitsOf(value);
  if (!q) return;
  const rows = recordsFor(DUMMY_ACCOUNTS).filter(r => digitsOf(r.service.serviceId) === q);
  JARVIS.openWindow('contactSearch', { refresh: true, rows });
  const active = rows.filter(r => r.service.status === 'Active');
  if (!rows.length) JARVIS.status(`No records found for ${value.trim()}.`);
  else if (!active.length) JARVIS.status(`Service ${rows[0].service.serviceId} is ${rows[0].service.status}. Customer authentication is only available for active services.`);
  else if (active.length === 1) openMfaDialog(active[0]);
}

        const modeFor = SEARCH_COLS.map(c => c[3] === 'nofilter' ? 'Starts with' : modes[m++].value);

/* ---------- Multi-factor Authentication dialog (Step 1 → Step 2) ----------
   Coordinates below are measured from the real JARVIS screens, in pixels from the
   dialog's top-left corner (title bar included). at()/tx() convert them for the canvas. */
const at = (x, y, w, h) => `left:${x - 7}px;top:${y - 40}px;width:${w}px;height:${h}px`;
const tx = (x, y) => `left:${x - 7}px;top:${y - 40}px`;
const maskNumber = p => { const d = digitsOf(p); return `${d.slice(0, 3)}XXXX${d.slice(-3)}`; };
const maskEmailUC = e => {
  const [u, dom] = String(e).split('@');
  const m = u.length <= 3 ? u[0] + 'X'.repeat(Math.max(1, u.length - 1)) : u[0] + 'X'.repeat(u.length - 3) + u.slice(-2);
  return `${m}@${dom}`.toUpperCase();
};
const normDate = s => {
  const t = String(s).trim();
  let m = t.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
  if (m) return `${m[1].padStart(2, '0')}/${m[2].padStart(2, '0')}/${m[3]}`;
  m = t.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? `${m[3]}/${m[2]}/${m[1]}` : t;
};
const CHECK_ICON = `<svg width="22" height="21" viewBox="0 0 22 21"><path d="M16.6 3.6A9 9 0 1 0 19.8 9.4" fill="none" stroke="#45a326" stroke-width="1.7"/>

function closeModal() { const l = $('#modalLayer'); l.classList.remove('on'); l.innerHTML = ''; }

}

/* JARVIS-style scrollbar (round buttons + thumb) driving a hidden-overflow view */
function makeScroller(view, sb, step = 19) {
  sb.innerHTML = `<div class="sb-btn sb-up">${SB_UP}</div><div class="sb-track"><div class="sb-thumb"></div></div><div class="sb-btn sb-dn">${SB_DN}</div>`;
  const track = sb.querySelector('.sb-track'), thumb = sb.querySelector('.sb-thumb');
  const max = () => Math.max(0, view.scrollHeight - view.clientHeight);
  const sync = () => {
    const th = Math.max(14, Math.round(track.clientHeight * view.clientHeight / Math.max(view.scrollHeight, 1)));
    thumb.style.height = th + 'px';
    thumb.style.top = (-1 + (max() ? view.scrollTop / max() : 0) * (track.clientHeight - th + 2)) + 'px';
  };
  const set = v => { view.scrollTop = Math.max(0, Math.min(max(), v)); sync(); };
  repeatPress(sb.querySelector('.sb-up'), () => set(view.scrollTop - step));
  repeatPress(sb.querySelector('.sb-dn'), () => set(view.scrollTop + step));
  track.addEventListener('mousedown', e => { if (e.target !== thumb) set(view.scrollTop + (e.clientY > thumb.getBoundingClientRect().top ? 1 : -1) * view.clientHeight); });
  thumb.addEventListener('mousedown', e => {
    e.preventDefault(); e.stopPropagation();
    const sy = e.clientY, st = view.scrollTop, travel = track.clientHeight - thumb.offsetHeight + 2;
    const mv = ev => set(st + (ev.clientY - sy) / Math.max(travel, 1) * max());
    const up = () => { removeEventListener('mousemove', mv); removeEventListener('mouseup', up); };
    addEventListener('mousemove', mv); addEventListener('mouseup', up);
  });
  [view, sb].forEach(el => el.addEventListener('wheel', e => { e.preventDefault(); set(view.scrollTop + Math.sign(e.deltaY) * step * 3); }, { passive: false }));
  requestAnimationFrame(sync);
}

const $ = (s, r = document) => r.querySelector(s);
const JARVIS = {
  state: { statusbar: true },
  windows: [],
  run(id, ctx = {}) {
    const fn = id && ACTIONS[id];
    if (fn) return fn(ctx);
    JARVIS.status(`${ctx.label ? '"' + ctx.label + '"' : 'This function'} is not available in the JARVIS trainer yet.`);
  },
  status(msg) {
    const el = $('#statusText');
    el.textContent = msg;
    clearTimeout(JARVIS._st);
    if (msg) JARVIS._st = setTimeout(() => { el.textContent = ''; }, CONFIG.statusMessageMs);
  },
  setStatusbar(on) {
    JARVIS.state.statusbar = on;
    $('#statusbar').classList.toggle('hidden', !on);
    const item = findItem(MENUS, it => it.action === 'view.statusbar');
    if (item) item.checked = on;
  },
  setSection(id, collapsed) {
    const sec = document.getElementById(id);
    sec.classList.toggle('collapsed', collapsed);
    sec.querySelector('.sec-ic').innerHTML = collapsed ? ICONS.secPop : ICONS.secMin;
  },

  /* ---------- Window manager ---------- */
  openWindow(type, opts = {}) {
    const def = WINDOW_TYPES[type];
    if (!def) return JARVIS.status(`Window "${type}" has not been built yet.`);
    if (def.single !== false) {
      const existing = JARVIS.windows.find(w => w.type === type);
      if (existing) {
        if (opts.refresh) {                       // re-use the open window with new content
          existing.title = opts.title || def.title;
          existing.el.querySelector('.iwin-title').textContent = existing.title;
          def.render(existing.el.querySelector('.iwin-body'), existing, opts);
        }
        JARVIS.focusWindow(existing);
        return existing;
      }
    }
    const el = document.createElement('div');
    el.className = 'iwin max';
    el.innerHTML = `<div class="iwin-hd"><span class="iwin-title"></span><div class="iwin-btns">
        <span data-b="min">${ICONS.winMin}</span><span data-b="max">${ICONS.winRestore}</span><span data-b="close">${ICONS.winClose}</span></div></div>
      <div class="iwin-body"></div>`;
    const win = { id: ++JARVIS._wid, type, title: opts.title || def.title, el, max: true, min: false };
    el.querySelector('.iwin-title').textContent = win.title;
    $('#workarea').appendChild(el);
    JARVIS.windows.push(win);
    el.addEventListener('mousedown', () => JARVIS.focusWindow(win));
    el.querySelector('[data-b=min]').onclick = e => { e.stopPropagation(); JARVIS.minimiseWindow(win); };
    el.querySelector('[data-b=max]').onclick = e => { e.stopPropagation(); JARVIS.toggleMaxWindow(win); };
    el.querySelector('[data-b=close]').onclick = e => { e.stopPropagation(); JARVIS.closeWindow(win); };
    const hd = el.querySelector('.iwin-hd');
    hd.addEventListener('dblclick', e => { if (!e.target.closest('.iwin-btns')) JARVIS.toggleMaxWindow(win); });
    hd.addEventListener('mousedown', e => startDrag(e, win));
    def.render(el.querySelector('.iwin-body'), win, opts);
    JARVIS.focusWindow(win);
    return win;
  },
  focusWindow(win) {
    win.min = false;
    win.el.classList.remove('minimised');
    JARVIS.windows.forEach(w => w.el.classList.toggle('active', w === win));
    win.el.style.zIndex = ++JARVIS._z;
    JARVIS.activeWindow = win;
    JARVIS.renderOpenWindows();
  },
  minimiseWindow(win) {
    win.min = true;
    win.el.classList.add('minimised');
    win.el.classList.remove('active');
    const next = JARVIS.windows.filter(w => !w.min).sort((a, b) => b.el.style.zIndex - a.el.style.zIndex)[0];
    if (next) JARVIS.focusWindow(next); else { JARVIS.activeWindow = null; JARVIS.renderOpenWindows(); }
  },
  toggleMaxWindow(win) {
    win.max = !win.max;
    win.el.classList.toggle('max', win.max);
    win.el.querySelector('[data-b=max]').innerHTML = win.max ? ICONS.winRestore : ICONS.winMax;
    if (!win.max) {
      const wa = $('#workarea').getBoundingClientRect();
      const n = JARVIS.windows.indexOf(win);
      const w = Math.min(1320, wa.width - 40), h = Math.min(760, wa.height - 40);
      Object.assign(win.el.style, { left: (20 + n * 24) + 'px', top: (12 + n * 24) + 'px', width: w + 'px', height: h + 'px' });
    } else {
      Object.assign(win.el.style, { left: '', top: '', width: '', height: '' });
    }
  },
  closeWindow(win) {
    win.el.remove();
    JARVIS.windows = JARVIS.windows.filter(w => w !== win);
    if (JARVIS.activeWindow === win) {
      JARVIS.activeWindow = null;
      const next = JARVIS.windows.filter(w => !w.min).pop();
      if (next) return JARVIS.focusWindow(next);
    }
    JARVIS.renderOpenWindows();
  },
  renderOpenWindows() {
    const vp = $('#viewProducts'); if (vp) vp.classList.toggle('off', JARVIS.windows.some(w => w.type === 'products'));
    const list = $('#owList');
    list.innerHTML = '';
    for (const w of JARVIS.windows) {
      const d = document.createElement('div');
      d.className = 'ow-item' + (w === JARVIS.activeWindow ? ' active' : '') + (w.min ? ' min' : '');
      d.textContent = w.title;
      d.onclick = () => JARVIS.focusWindow(w);
      list.appendChild(d);
    }
  },
  _wid: 0, _z: 10,
};
window.JARVIS = JARVIS;

function startDrag(e, win) {
  if (win.max || e.button !== 0 || e.target.closest('.iwin-btns')) return;
  const sx = e.clientX, sy = e.clientY, ox = win.el.offsetLeft, oy = win.el.offsetTop;
  const move = ev => { win.el.style.left = (ox + ev.clientX - sx) + 'px'; win.el.style.top = Math.max(0, oy + ev.clientY - sy) + 'px'; };
  const up = () => { removeEventListener('mousemove', move); removeEventListener('mouseup', up); };
  addEventListener('mousemove', move); addEventListener('mouseup', up);
  e.preventDefault();
}

/* ---------- Quick Actions list with custom scrollbar ---------- */
const QA_ROW = 34;
const qaList = $('#qaList'), qaThumb = $('#qaThumb'), qaTrack = $('#qaTrack');
QUICK_ACTIONS.forEach(q => {
  const r = document.createElement('div');
  r.className = 'qa-row';
  r.textContent = q.label;
  r.onclick = () => JARVIS.run(q.action, { label: q.label });
  qaList.appendChild(r);
});
function qaMax() { return Math.max(0, qaList.scrollHeight - qaList.clientHeight); }
function qaSet(top) {
  qaList.scrollTop = Math.max(0, Math.min(qaMax(), top));
  const travel = qaTrack.clientHeight - qaThumb.offsetHeight + 2;
  const m = qaMax();
  qaThumb.style.top = (-1 + (m ? qaList.scrollTop / m : 0) * travel) + 'px';
}
qaList.parentElement.addEventListener('wheel', e => { e.preventDefault(); qaSet(qaList.scrollTop + Math.sign(e.deltaY) * QA_ROW * 3); }, { passive: false });
function repeatPress(el, fn) {
  let t1, t2;
  el.addEventListener('mousedown', e => { e.preventDefault(); fn(); t1 = setTimeout(() => { t2 = setInterval(fn, 60); }, 350); });
  const stop = () => { clearTimeout(t1); clearInterval(t2); };
  el.addEventListener('mouseup', stop); el.addEventListener('mouseleave', stop);
}
repeatPress($('#qaUp'), () => qaSet(qaList.scrollTop - QA_ROW));
repeatPress($('#qaDown'), () => qaSet(qaList.scrollTop + QA_ROW));
qaTrack.addEventListener('mousedown', e => {
  if (e.target === qaThumb) return;
  const below = e.clientY > qaThumb.getBoundingClientRect().top;
  qaSet(qaList.scrollTop + (below ? 1 : -1) * QA_ROW * 3);
});
qaThumb.addEventListener('mousedown', e => {
  e.preventDefault(); e.stopPropagation();
  const sy = e.clientY, st = qaList.scrollTop;
  const travel = qaTrack.clientHeight - qaThumb.offsetHeight + 2;
  const move = ev => {
    const raw = st + (ev.clientY - sy) / travel * qaMax();
    qaSet(Math.round(raw / QA_ROW) * QA_ROW);
  };
  const up = () => { removeEventListener('mousemove', move); removeEventListener('mouseup', up); };
  addEventListener('mousemove', move); addEventListener('mouseup', up);
});

/* ---------- Menus ---------- */
function mnemonicHTML(label) {
  const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const i = label.indexOf('&');
  if (i < 0) return esc(label);
  return esc(label.slice(0, i)) + `<span class="mn">${esc(label[i + 1])}</span>` + esc(label.slice(i + 2));
}
const plain = l => l.replace('&', '');
function findItem(list, pred) {
  for (const m of list) {
    for (const it of (m.items || m.submenu || [])) {
      if (it === '-') continue;
      if (pred(it)) return it;
      if (it.submenu) { const f = findItem([{ items: it.submenu }], pred); if (f) return f; }
    }
  }
  return null;
}

const mb = $('#menubar');

  el.addEventListener('mousedown', e => { e.preventDefault(); menuState.top === i ? closeMenus() : openTop(i); });
  el.addEventListener('mouseenter', () => { if (menuState.top >= 0 && menuState.top !== i) openTop(i); });
  mb.appendChild(el);
});

function buildMenu(items, x, y, level) {
  const box = document.createElement('div');
  box.className = 'menu';
  if (items.some(it => it !== '-' && it.submenu)) box.classList.add('has-sub');
  const tbl = document.createElement('table');
  const rows = [];
  items.forEach((it, idx) => {
    const tr = document.createElement('tr');
    if (it === '-') { tr.className = 'sep'; tr.innerHTML = '<td colspan="4"></td>'; tbl.appendChild(tr); rows.push(null); return; }
    tr.className = 'mi' + (it.disabled ? ' dis' : '') + (it.check ? ' chk' : '');
    const icon = it.check ? (it.checked ? ICONS.check : '') : (it.icon ? ICONS[it.icon] : '');
    tr.innerHTML = `<td class="ic">${icon}</td><td class="lb">${mnemonicHTML(it.label)}</td><td class="sc">${it.shortcut || ''}</td><td class="ar">${it.submenu ? '<i></i>' : ''}</td>`;
    tr.addEventListener('mouseenter', () => armItem(level, idx, true));
    tr.addEventListener('mousedown', e => e.preventDefault());
    tr.addEventListener('click', () => activateItem(level, idx));
    tbl.appendChild(tr);
    rows.push(tr);
  });
  box.appendChild(tbl);
  box.style.left = x + 'px'; box.style.top = y + 'px';
  document.body.appendChild(box);
  // keep on screen
  const r = box.getBoundingClientRect();
  if (r.right > innerWidth) box.style.left = Math.max(0, innerWidth - r.width) + 'px';
  if (r.bottom > innerHeight) box.style.top = Math.max(0, innerHeight - r.height) + 'px';
  return { el: box, items, rows, armed: -1 };
}

function openTop(i) {
  closeMenus(true);
  menuState.top = i;
  const item = mb.children[i];
  item.classList.add('open');
  document.body.classList.add('show-mn');
  const r = item.getBoundingClientRect();
  menuState.stack = [buildMenu(MENUS[i].items, r.left, r.bottom + 1, 0)];
}
function closeMenus(keepMn) {
  menuState.stack.forEach(m => m.el.remove());
  menuState.stack = [];
  if (menuState.top >= 0) mb.children[menuState.top].classList.remove('open');
  menuState.top = -1;
  if (!keepMn && !altMode) document.body.classList.remove('show-mn');
}
function closeFrom(level) {
  while (menuState.stack.length > level) menuState.stack.pop().el.remove();
}
function armItem(level, idx, fromMouse) {
  const m = menuState.stack[level];
  if (!m) return;
  closeFrom(level + 1);
  m.rows.forEach((tr, j) => tr && tr.classList.toggle('armed', j === idx));
  m.armed = idx;
  const it = m.items[idx];
  if (it && it !== '-' && it.submenu && it.submenu.length && !it.disabled && fromMouse) openSub(level, idx);
}
function openSub(level, idx) {
  const m = menuState.stack[level];
  const tr = m.rows[idx];
  const tr_r = tr.getBoundingClientRect(), box_r = m.el.getBoundingClientRect();
  closeFrom(level + 1);
  menuState.stack.push(buildMenu(m.items[idx].submenu, box_r.right - 6, tr_r.top - 4, level + 1));
}
function activateItem(level, idx) {
  const m = menuState.stack[level];
  const it = m && m.items[idx];
  if (!it || it === '-' || it.disabled) return;
  if (it.submenu) { if (it.submenu.length) { openSub(level, idx); armItem(level + 1, firstEnabled(menuState.stack[level + 1], 0, 1)); } return; }
  altMode = false;
  closeMenus();
  JARVIS.run(it.action, { label: plain(it.label), item: it });
}
function firstEnabled(m, from, dir) {
  const n = m.items.length;
  for (let k = 0, i = from; k < n; k++, i = (i + dir + n) % n) if (m.items[i] !== '-') return i;
  return -1;
}
document.addEventListener('mousedown', e => {
  if (menuState.top >= 0 && !e.target.closest('.menu') && !e.target.closest('#menubar')) closeMenus();
}, true);
addEventListener('blur', () => { closeMenus(); altMode = false; document.body.classList.remove('show-mn'); });

/* ---------- Keyboard: Alt mnemonics, menu navigation, accelerators ---------- */
let altMode = false, altDown = false;
const ACCEL = {};
(function collect(list) {
  for (const it of list) {
    if (it === '-') continue;
    if (it.items) collect(it.items);
    if (it.submenu) collect(it.submenu);
    if (it.shortcut && !it.disabled && it.action) ACCEL[it.shortcut.toLowerCase()] = it;
  }
})(MENUS);
function comboOf(e) {
  let k = e.key.length === 1 ? e.key.toUpperCase() : e.key;
  return [(e.ctrlKey ? 'ctrl+' : ''), (e.shiftKey ? 'shift+' : ''), (e.altKey ? 'alt+' : ''), k].join('').toLowerCase();
}
document.addEventListener('keydown', e => {
  if (e.key === 'Alt') { altDown = true; return; }
  altDown = false;
  const acc = ACCEL[comboOf(e)];
  if (acc) { e.preventDefault(); closeMenus(); JARVIS.run(acc.action, { label: plain(acc.label), item: acc }); return; }

  // Alt+letter or (alt mode) letter opens a menu
  if ((e.altKey || altMode) && menuState.top < 0 && e.key.length === 1) {
    const i = MENUS.findIndex(m => { const p = m.label.indexOf('&'); return p >= 0 && m.label[p + 1].toLowerCase() === e.key.toLowerCase(); });
    if (i >= 0) { e.preventDefault(); openTop(i); armItem(0, firstEnabled(menuState.stack[0], 0, 1)); return; }
  }
  if (menuState.top < 0) { if (e.key === 'Escape' && altMode) { altMode = false; document.body.classList.remove('show-mn'); } return; }

  const level = menuState.stack.length - 1, m = menuState.stack[level];
  const move = dir => { const start = m.armed < 0 ? (dir > 0 ? 0 : m.items.length - 1) : (m.armed + dir + m.items.length) % m.items.length; armItem(level, firstEnabled(m, start, dir)); };
  switch (e.key) {
    case 'ArrowDown': e.preventDefault(); move(1); break;
    case 'ArrowUp': e.preventDefault(); move(-1); break;
    case 'ArrowRight': {
      e.preventDefault();
      const it = m.items[m.armed];
      if (it && it !== '-' && it.submenu && it.submenu.length && !it.disabled) { openSub(level, m.armed); armItem(level + 1, firstEnabled(menuState.stack[level + 1], 0, 1)); }
      else { const i = (menuState.top + 1) % MENUS.length; openTop(i); armItem(0, firstEnabled(menuState.stack[0], 0, 1)); }
      break;
    }
    case 'ArrowLeft':
      e.preventDefault();
      if (level > 0) closeFrom(level);
      else { const i = (menuState.top - 1 + MENUS.length) % MENUS.length; openTop(i); armItem(0, firstEnabled(menuState.stack[0], 0, 1)); }
      break;
    case 'Enter': e.preventDefault(); if (m.armed >= 0) activateItem(level, m.armed); break;
    case 'Escape': e.preventDefault(); if (level > 0) closeFrom(level); else { altMode = false; closeMenus(); } break;
    default:
      if (e.key.length === 1) {   // mnemonic inside an open menu
        const idx = m.items.findIndex(it => it !== '-' && it.label.includes('&') && it.label[it.label.indexOf('&') + 1].toLowerCase() === e.key.toLowerCase());
        if (idx >= 0) { e.preventDefault(); armItem(level, idx); activateItem(level, idx); }
      }
  }
}, true);
document.addEventListener('keyup', e => {
  if (e.key === 'Alt' && altDown) {   // tap Alt on its own: toggle underlines like Windows
    e.preventDefault();
    altDown = false;
    if (menuState.top >= 0) { closeMenus(); altMode = false; }
    else { altMode = !altMode; document.body.classList.toggle('show-mn', altMode); }
  }
});
document.addEventListener('mousedown', () => {
  if (altMode && menuState.top < 0) { altMode = false; document.body.classList.remove('show-mn'); }
});

/* ---------- Tooltips (data-tip) ---------- */
const tip = $('#tip');
let tipTimer;
document.addEventListener('mouseover', e => {
  const t = e.target.closest('[data-tip]');
  clearTimeout(tipTimer);
  if (!t) { tip.style.display = 'none'; return; }
  tipTimer = setTimeout(() => {
    tip.textContent = t.dataset.tip;
    tip.style.display = 'block';
    tip.style.left = Math.min(innerWidth - tip.offsetWidth - 2, lastMouse.x - 6) + 'px';
    tip.style.top = (lastMouse.y + 20) + 'px';
  }, 700);
});
const lastMouse = { x: 0, y: 0 };
document.addEventListener('mousemove', e => { lastMouse.x = e.clientX; lastMouse.y = e.clientY; });
document.addEventListener('mousedown', () => { clearTimeout(tipTimer); tip.style.display = 'none'; });

/* ---------- Start ---------- */
$('#custField').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); JARVIS.run('toolbar.quickSearch'); } });
renderTitle();
qaSet(0);
addEventListener('resize', () => qaSet(qaList.scrollTop));
</script>
</body>
