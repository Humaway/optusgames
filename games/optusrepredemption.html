const HINGE_X = new THREE.Vector3(1,0,0);
const IK = (()=>{
  const v0=new THREE.Vector3(), v1=new THREE.Vector3(), v2=new THREE.Vector3();
  const q=new THREE.Quaternion(), q2=new THREE.Quaternion();
  const m=new THREE.Matrix4();
  function solve(upper, lower, tip, targetWorld, poleWorld){
    upper.updateMatrixWorld(true);
    const A = v0.setFromMatrixPosition(upper.matrixWorld).clone();
    const B = v1.setFromMatrixPosition(lower.matrixWorld).clone();
    const C = v2.setFromMatrixPosition(tip.matrixWorld).clone();
    const lAB = A.distanceTo(B), lBC = B.distanceTo(C);
    const toT = new THREE.Vector3().subVectors(targetWorld, A);
    let lAT = toT.length();
    const maxReach = (lAB+lBC)*0.999;
    if(lAT > maxReach){ lAT = maxReach; }
    if(lAT < 1e-4) return;
    toT.normalize();

    // Interior angles from the law of cosines.
    const cosA = M.clamp((lAB*lAB + lAT*lAT - lBC*lBC)/(2*lAB*lAT), -1, 1);
    const cosB = M.clamp((lAB*lAB + lBC*lBC - lAT*lAT)/(2*lAB*lBC), -1, 1);
    const angA = Math.acos(cosA), angB = Math.acos(cosB);

    // Current plane normal, biased by the pole vector.
    const curDir = new THREE.Vector3().subVectors(C,A).normalize();
    const pole = poleWorld ? new THREE.Vector3().subVectors(poleWorld,A).normalize()
                           : new THREE.Vector3(0,0,1);
    let axis = new THREE.Vector3().crossVectors(curDir, pole);
    if(axis.lengthSq() < 1e-6) axis.set(1,0,0);
    axis.normalize();

    // Rotate the whole chain so the tip aims at the target, then bend.
    const rot = new THREE.Quaternion().setFromUnitVectors(curDir, toT);
    const upperWQ = upper.getWorldQuaternion(new THREE.Quaternion());
    const newUpperW = rot.clone().multiply(upperWQ);
    const bendAxis = axis.clone().applyQuaternion(rot);
    newUpperW.premultiply(q.setFromAxisAngle(bendAxis, -angA));
    const parentW = upper.parent ? upper.parent.getWorldQuaternion(new THREE.Quaternion())
                                 : new THREE.Quaternion();
    upper.quaternion.copy(parentW.invert().multiply(newUpperW));
    upper.updateMatrixWorld(true);
    // Elbow/knee: interior angle B maps to a bend of PI - angB about the
    // joint's hinge. Positive X swings the shin backwards, which is the only
    // direction a knee goes.
    const bendLocal = M.clamp(Math.PI - angB, 0, 2.3);
    lower.quaternion.setFromAxisAngle(HINGE_X, bendLocal);
    lower.updateMatrixWorld(true);
  }
  /* Aim a bone at a world target.

     The old version pointed the bone's +Y at the target and then REPLACED the
     bone's rotation with the result. Both are wrong for a head or a neck: +Y
     is a spine's axis, not its facing, so aiming it at anything wrenches the
     bone ninety degrees, and replacing the rotation throws the animation away.

     This works out the small additional rotation that brings the bone's own
     rest facing onto the target, clamps it, and applies it ON TOP of whatever
     the animator just posed. */
  const _lv = new THREE.Vector3(), _lv2 = new THREE.Vector3();
  const _lq = new THREE.Quaternion(), _lq2 = new THREE.Quaternion();
  const _lid = new THREE.Quaternion();
  const FWD_Z = new THREE.Vector3(0,0,1);
  function look(bone, targetWorld, weight=1, maxAngle=0.7, restDir){
    if(!targetWorld) return;
    bone.updateMatrixWorld(true);
    const p = _lv.setFromMatrixPosition(bone.matrixWorld);
    const d = _lv2.subVectors(targetWorld, p);
    if(d.lengthSq() < 1e-4) return;
    d.normalize();
    const parentQ = bone.parent
      ? bone.parent.getWorldQuaternion(_lq)
      : _lq.identity();
    const localDir = d.applyQuaternion(_lq2.copy(parentQ).invert());

    // Where the bone is facing right now, after the animation.
    const rest = restDir || FWD_Z;
    const cur = _lv.copy(rest).applyQuaternion(bone.quaternion).normalize();
    const delta = _lq2.setFromUnitVectors(cur, localDir);

    let ang = 2*Math.acos(M.clamp(Math.abs(delta.w), -1, 1));
    const k = weight * (ang > 1e-4 ? Math.min(1, maxAngle/ang) : 1);
    _lid.identity();
    _lid.slerp(delta, M.sat(k));
    bone.quaternion.premultiply(_lid);
  }
  return { solve, look };
})();

  ['footR',   'shinR',    -0.114, 0.092, 0.000],
  ['toeR',    'footR',    -0.114, 0.048, 0.135],
];

function boneDefFromWorld(list){
  const world = {};
  return list.map(([name,parent,x,y,z])=>{
    world[name] = [x,y,z];
    const p = parent ? world[parent] : [0,0,0];
    return { name, parent, pos:[x-p[0], y-p[1], z-p[2]], world:[x,y,z] };
  });
}

/* ==========================================================================

  push(boxGeometry(V(0.218,0.900,0.030), 0.140, 0.175, 0.080, 0.14), MAT.BAG);

  const geo = skinParts(parts, rig, {power:3.6});

  const S = (t, extra={})=> new THREE.MeshStandardMaterial(Object.assign({

  const mats = [
    S(lib.cloth_coat,  {color:0xffffff}),

    S(lib.skin_pale),
    S(lib.leather_boot),
    S(lib.cloth_coat,  {color:0x6b6257}),
    S(lib.cloth_shirt),
    S(lib.leather_tack),

  mats.forEach(m=>{ if(m.map){ m.map.repeat.set(2,2);

  const mesh = new THREE.SkinnedMesh(geo, mats);
  mesh.castShadow = true; mesh.receiveShadow = true;
  mesh.frustumCulled = false;
  mesh.add(rig.root);
  mesh.updateMatrixWorld(true);
  mesh.bind(rig.skeleton);

  const group = new THREE.Group();
  group.add(mesh);
  return { rig, mesh, group, mats, MAT };
}

/* ==========================================================================
   ANIM_LIBRARY — locomotion
   Cycles are emitted from an authored parameter set rather than typed key by
   key, which is how you get footfall timing that is actually correct across
   five gaits. Idle, turns and reactions are authored explicitly.
   Convention: character faces +Z. Positive thigh X swings the leg BACK.
   ========================================================================== */
const LEG_LEN = 0.84;      // hip to sole, the radius the foot swings on

function makeLocomotionClip(name, p){
  const { stride, lift, armSwing, bounce, lean, hipRoll, shoulderCounter,
          heel, dur, elbow=0.25 } = p;
  const K = (n)=>{ const a=[]; for(let i=0;i<=n;i++) a.push(i/n); return a; };
  const ph = K(4);          // 0, .25, .5, .75, 1 — contact/pass/contact/pass
  const t = ph.map(x=>x*dur);
  const tracks = {};
  const wave = (a,off)=> ph.map((x,i)=> a*Math.sin((x+off)*Math.PI*2));
  const wave2= (a,off)=> ph.map((x,i)=> a*Math.sin((x+off)*Math.PI*4));

  // Legs: opposite phase. Thigh swings, shin follows with a lag, foot rolls.
  const legs = [['thighL','shinL','footL','toeL',0],['thighR','shinR','footR','toeR',0.5]];
  for(const [th,sh,ft,to,off] of legs){
    const swing = wave(stride, off);
    tracks[th] = t.map((tt,i)=>[tt, swing[i], 0, 0]);
    // Shin: only ever bends one way (knees do not hyperextend).
    tracks[sh] = t.map((tt,i)=>{
      const s = -Math.min(0, Math.sin((ph[i]+off+0.16)*Math.PI*2)) * lift;
      return [tt, s + 0.02, 0, 0];
    });
    // Foot: heel strike then toe-off.
    tracks[ft] = t.map((tt,i)=>{
      const c = Math.sin((ph[i]+off+0.30)*Math.PI*2);
      return [tt, -swing[i]*0.55 + c*heel, 0, 0];
    });
    tracks[to] = t.map((tt,i)=>{
      const toe = Math.max(0, Math.sin((ph[i]+off+0.62)*Math.PI*2));
      return [tt, -toe*heel*1.6, 0, 0];
    });
  }
  // Arms: counter-swing to the legs, with a constant elbow break.
  const armL = wave(armSwing, 0.5), armR = wave(armSwing, 0);
  tracks.armL     = t.map((tt,i)=>[tt, armL[i], 0,  0.10]);
  tracks.armR     = t.map((tt,i)=>[tt, armR[i], 0, -0.10]);
  tracks.forearmL = t.map((tt,i)=>[tt, -elbow - Math.max(0,armL[i])*0.45, 0, 0]);
  tracks.forearmR = t.map((tt,i)=>[tt, -elbow - Math.max(0,armR[i])*0.45, 0, 0]);
  tracks.clavL    = t.map((tt,i)=>[tt, 0, 0, -armL[i]*0.12]);
  tracks.clavR    = t.map((tt,i)=>[tt, 0, 0, -armR[i]*0.12]);

  // Pelvis: vertical bounce twice per cycle, roll once, counter-yaw.
  const bob = wave2(bounce, 0.25);
  tracks.pelvis = t.map((tt,i)=>[tt, lean*0.35, wave(hipRoll,0.25)[i]*0.6, wave(hipRoll,0)[i]]);
  // Spine: lean forward with speed, counter-rotate against the hips.
  tracks.spine1 = t.map((tt,i)=>[tt, lean*0.30, wave(shoulderCounter,0.5)[i], 0]);
  tracks.spine2 = t.map((tt,i)=>[tt, lean*0.30, wave(shoulderCounter,0.5)[i]*0.7, 0]);
  tracks.spine3 = t.map((tt,i)=>[tt, lean*0.25, wave(shoulderCounter,0.5)[i]*0.4, 0]);
  // Head stays level — the single cheapest thing that makes walking read.
  tracks.neck = t.map((tt,i)=>[tt, -lean*0.55 - bob[i]*0.35, 0, 0]);
  tracks.head = t.map((tt,i)=>[tt, -lean*0.30, 0, 0]);

  const root = t.map((tt,i)=>[tt, 0, bob[i]*0.14, 0]);
  const clip = new Clip(name, dur, tracks, {root,
    events:[{t:dur*0.02,tag:'stepL'},{t:dur*0.52,tag:'stepR'}]});
  /* Distance this cycle actually carries the body: two steps, each the arc the
     planted foot sweeps through. Playback is tied to this so a given ground
     speed always plays the cycle at the rate that keeps the feet stuck to the
     floor. */
  clip.groundSpeed = 4*Math.sin(stride)*LEG_LEN/dur;
  return clip;
}

/* ==========================================================================
   PLAYER CONTROLLER
   Capsule vs heightfield with slope limit, step-up and ground snapping.
   All of it runs in fixedUpdate.
   ========================================================================== */
class Player {
  constructor(terrain, lib, scene, colliders){
    this.terrain = terrain;
    this.colliders = colliders;
    const built = buildJarrad(lib);
    this.rig = built.rig; this.mesh = built.mesh; this.mats = built.mats;
    this.object = built.group;
    scene.add(this.object);

    this.anim = new Animator(this.rig);
    buildPlayerClips(this.anim);
    this.anim.play('idle', 0);
    this.anim.setAdditive('breathe', 1.0);

    this.pos = new THREE.Vector3(0, 0, 0);
    this.vel = new THREE.Vector3();
    this.yaw = 0;              // facing
    this.desiredYaw = 0;
    this.grounded = true;
    this.groundNormal = new THREE.Vector3(0,1,0);
    this.speed = 0;
    this.crouched = false;
    this.mounted = null;
    this.turning = null;

    /* Stats (§5.3) */
    this.health = 100; this.healthMax = 100;
    this.stamina = 100; this.staminaMax = 100;
    this.composure = 100; this.composureMax = 100;
    this.reputation = 50;
    this.act = 1;

    this._tmp = new THREE.Vector3();
    this._footTargets = { L:new THREE.Vector3(), R:new THREE.Vector3() };
    this._lastGrounded = true;
    this.landTimer = 0;
    this.idleTimer = 0;
    this.stepPhase = 0;
    this.onStep = null;        // callback for footstep audio
  }

  spawn(x,z){
    this.pos.set(x, this.terrain.heightAt(x,z), z);
    this.object.position.copy(this.pos);
  }

  /* --- Costume / posture by act (§2) ------------------------------------ */
  setAct(act){
    if(this.act === act) return;
    this.act = act;
    const t = M.sat((act-1)/4);
    // Coat repairs and re-lines in teal; boots polish; the whole model lifts.
    this.mats[0].color.setRGB(M.lerp(0.55,0.98,t), M.lerp(0.53,0.98,t), M.lerp(0.50,1.00,t));
    this.mats[0].roughness = M.lerp(1.0, 0.74, t);
    this.mats[1].color.setRGB(M.lerp(0.42,1.00,t), M.lerp(0.55,1.00,t), M.lerp(0.54,1.00,t));
    this.mats[3].roughness = M.lerp(1.0, 0.46, t);
    this.mats[3].color.setRGB(M.lerp(0.62,1.0,t), M.lerp(0.60,1.0,t), M.lerp(0.58,1.0,t));
    this.postureSlump = M.lerp(1.0, 0.0, t);
  }

  get eyePos(){
    return this._tmp.set(this.pos.x, this.pos.y + (this.crouched?1.10:CFG.EYE_H), this.pos.z);
  }

  /* --- Fixed-step update ------------------------------------------------ */
  fixedUpdate(dt, input, camYaw){
    if(this.mounted){ this._updateMounted(dt); return; }

    /* Desired move direction in world space, relative to the camera. */
    const f = new THREE.Vector3(Math.sin(camYaw), 0, Math.cos(camYaw));
    const r = new THREE.Vector3(-Math.cos(camYaw), 0, Math.sin(camYaw));
    const wish = new THREE.Vector3()
      .addScaledVector(f, input.fwd)
      .addScaledVector(r, input.right);
    const mag = Math.min(1, wish.length());
    if(mag > 0.001) wish.normalize();

    /* Target speed by input magnitude and modifier keys. */
    let target = 0;
    if(mag > 0.02){
      if(this.crouched) target = CFG.SPD_WALK*0.72;
      else if(input.sprint && this.stamina > 1) target = CFG.SPD_SPRINT;
      else if(input.walk) target = CFG.SPD_WALK;
      else target = M.lerp(CFG.SPD_JOG, CFG.SPD_RUN, M.sat((mag-0.5)*2));
      target *= mag;
    }

    /* Stamina drain and recovery. */
    if(input.sprint && target > CFG.SPD_RUN && this.grounded){
      this.stamina = Math.max(0, this.stamina - 17*dt);
      if(this.stamina <= 0) target = CFG.SPD_RUN;
    } else {
      this.stamina = Math.min(this.staminaMax, this.stamina + 11*dt);
    }
    /* Health regenerates slowly out of combat; Composure recovers when calm. */
    this.health = Math.min(this.healthMax, this.health + 1.6*dt);
    this.composure = Math.min(this.composureMax, this.composure + 2.4*dt);

    /* Ground acceleration with real momentum — you cannot reverse a sprint
       instantly (§5.2). */
    const accel = this.grounded ? CFG.ACCEL_G : CFG.ACCEL_A;
    const desiredVel = wish.multiplyScalar(target);
    const dv = new THREE.Vector3().subVectors(desiredVel, this._flatVel());
    const maxDv = accel*dt*(this.grounded?1:0.35);
    if(dv.length() > maxDv) dv.setLength(maxDv);
    this.vel.x += dv.x; this.vel.z += dv.z;

    if(this.grounded && target < 0.05){
      const fr = Math.exp(-CFG.FRICTION*dt);
      this.vel.x *= fr; this.vel.z *= fr;
    }

    /* Facing: turn toward movement, but use turn-in-place clips when
       standing still and the camera has swung a long way round. */
    if(target > 0.05){
      this.desiredYaw = Math.atan2(desiredVel.x, desiredVel.z);
      const rate = CFG.TURN_RATE * (0.4 + 0.6*M.sat(1 - this.speed/CFG.SPD_SPRINT));
      this.yaw = M.angDamp(this.yaw, this.desiredYaw, rate, dt);
      this.turning = null;
    } else if(!this.turning) {
      const d = M.angDelta(this.yaw, camYaw);
      if(Math.abs(d) > 1.30){
        const clip = d>0 ? (Math.abs(d)>2.0?'turnL135':'turnL45')
                         : (Math.abs(d)>2.0?'turnR135':'turnR45');
        this.turning = { clip, t:0, from:this.yaw, to:camYaw,
                         dur:this.anim.clips[clip].duration };
        this.anim.play(clip, 0.14, true);
      }
    }
    if(this.turning){
      this.turning.t += dt;
      const k = M.smoother(M.sat(this.turning.t/this.turning.dur));
      this.yaw = this.turning.from + M.angDelta(this.turning.from, this.turning.to)*k;
      if(this.turning.t >= this.turning.dur) this.turning = null;
    }

    /* Jump / gravity. */
    if(input.jump && this.grounded && this.stamina > 8){
      this.vel.y = 6.4; this.grounded = false;
      this.stamina -= 8;
      this.anim.play('jump', 0.09, true);
    }
    this.vel.y += CFG.GRAVITY*dt;

    /* Integrate + collide. */
    this._integrate(dt);

    /* Animation state selection. */
    this.speed = Math.hypot(this.vel.x, this.vel.z);
    this._selectState(dt, input);
    this._footsteps(dt);
    this.object.position.copy(this.pos);
    this.object.rotation.y = this.yaw;
  }

  _flatVel(){ return new THREE.Vector3(this.vel.x, 0, this.vel.z); }

  _integrate(dt){
    const t = this.terrain;
    const nx = this.pos.x + this.vel.x*dt;
    const nz = this.pos.z + this.vel.z*dt;
    let ny = this.pos.y + this.vel.y*dt;

    /* Slope limit: refuse the horizontal move if the destination is steeper
       than we can climb AND is uphill. Cliffs stop you, ramps don't. */
    const hHere = t.heightAt(this.pos.x, this.pos.z);
    const hThere = t.heightAt(nx, nz);
    const slope = t.slopeAt(nx, nz);
    const climbing = hThere > hHere + 0.02;
    let px = nx, pz = nz;
    if(climbing && slope > CFG.SLOPE_LIMIT && (hThere-hHere) > CFG.STEP_UP*dt*30){
      // Slide along the contour instead of sticking to the wall.
      const n = t.normalAt(nx,nz);
      const flat = new THREE.Vector3(n.x,0,n.z).normalize();
      const v = new THREE.Vector3(this.vel.x,0,this.vel.z);
      const along = v.clone().addScaledVector(flat, -v.dot(flat));
      px = this.pos.x + along.x*dt; pz = this.pos.z + along.z*dt;
      this.vel.x = along.x; this.vel.z = along.z;
    }

    // Keep inside the world: the boundary is geography, but the array isn't.
    const lim = CFG.HALF - 6;
    px = M.clamp(px, -lim, lim); pz = M.clamp(pz, -lim, lim);

    /* Buildings are solid. Resolve horizontally first, then work out what we
       are standing on — which may be a boardwalk rather than the ground. */
    let ground = t.heightAt(px, pz);
    if(this.colliders){
      const probe = this._probe || (this._probe = new THREE.Vector3());
      probe.set(px, this.pos.y, pz);
      if(this.colliders.resolve(probe, CFG.PLAYER_R, CFG.PLAYER_H)){
        this.vel.x *= 0.55; this.vel.z *= 0.55;
      }
      px = probe.x; pz = probe.z;
      const deck = this.colliders.support(px, pz, this.pos.y, CFG.PLAYER_R);
      if(deck > ground) ground = deck;
    }
    if(ny <= ground + 0.02){
      // Ground snap with step-up.
      if(this.vel.y <= 0.01){
        if(!this._lastGrounded && this.vel.y < -5){
          this.anim.play('land', 0.06, true);
          this.landTimer = 0.4;
          const impact = Math.min(1, -this.vel.y/22);
          this.health -= impact*impact*38;
          if(this.onLand) this.onLand(impact);
        }
        ny = ground; this.vel.y = 0; this.grounded = true;
      }
    } else if(ny > ground + 0.06){
      this.grounded = false;
    }
    this._lastGrounded = this.grounded;
    this.groundNormal.copy(t.normalAt(px,pz));
    this.pos.set(px, ny, pz);
    if(this.landTimer > 0) this.landTimer -= dt;
  }

  _selectState(dt, input){
    if(this.turning) return;
    if(!this.grounded){ this.anim.play('jump', 0.12); this.idleTimer = 0; return; }
    if(this.landTimer > 0.05){ return; }
    const s = this.speed;
    if(this.crouched && s < 0.4){ this.anim.play('crouch', 0.24); return; }
    if(s < 0.22){
      this.idleTimer += dt;
      // Occasionally shift weight so standing still is never frozen.
      if(this.idleTimer > 7 + M.hash(Math.floor(this.idleTimer))*6){
        this.anim.play('idle_shift', 0.35, true); this.idleTimer = -2.4;
      } else if(this.anim.state !== 'idle_shift' || this.idleTimer >= 0){
        this.anim.play('idle', 0.30);
      }
      this.anim.speed = 1;
      return;
    }
    this.idleTimer = 0;
    /* Pick the cycle whose own ground speed is closest to how fast he is
       actually travelling, then play it at exactly the rate that speed
       demands. That is what makes it read as root motion instead of a
       treadmill. */
    let clip = 'walk', best = 1e9;
    for(const name of ['walk','jog','run','sprint']){
      const gs = this.anim.clips[name].groundSpeed;
      const err = Math.abs(Math.log(Math.max(s,0.2)/gs));
      if(err < best){ best = err; clip = name; }
    }
    this.anim.play(clip, 0.22);
    this.anim.speed = M.clamp(s/this.anim.clips[clip].groundSpeed, 0.55, 1.6);
    // Breathing doubles when working hard.
    this.anim.setAdditive('breathe', M.lerp(1.0, 2.2, M.sat((s-2)/5)));
  }

  /* Footstep events, derived from the animation phase so the sound lands on
     the frame the boot lands. */
  _footsteps(dt){
    if(!this.grounded || this.speed < 0.3){ return; }
    const clip = this.anim.clips[this.anim.state];
    if(!clip || !clip.events.length) return;
    const prev = this.stepPhase;
    this.stepPhase = (this.anim.time % clip.duration)/clip.duration;
    if(this.stepPhase < prev){ this._emitStep('L'); }
    else if(prev < 0.5 && this.stepPhase >= 0.5){ this._emitStep('R'); }
  }
  _emitStep(side){
    if(!this.onStep) return;
    const t = this.terrain;
    const s = t.splatAt(this.pos.x, this.pos.z, this.pos.y, t.slopeAt(this.pos.x,this.pos.z));
    let surface = 'dirt';
    if(s[3] > 0.45) surface = 'snow';
    else if(s[2] > 0.45) surface = 'sand';
    else if(s[0] > 0.45) surface = 'gravel';
    else if(s[1] > 0.45) surface = 'grass';
    if(t.roadAt && t.roadAt(this.pos.x, this.pos.z) > 0.35) surface = 'gravel';
    if(t.sample(t.river, this.pos.x, this.pos.z) > 0.3) surface = 'water';
    this.onStep(surface, M.sat(this.speed/CFG.SPD_SPRINT), this.pos);
  }

  _updateMounted(dt){
    const h = this.mounted;
    this.yaw = h.yaw;
    const fast = M.sat((h.speed - CFG.HORSE.TROT)/(CFG.HORSE.GALLOP-CFG.HORSE.TROT));
    this.anim.play(fast > 0.45 ? 'ride_fast' : 'ride', 0.35);
    this.anim.speed = fast > 0.45 ? M.clamp(h.speed/CFG.HORSE.GALLOP,0.7,1.4) : 1;
    this.stamina = Math.min(this.staminaMax, this.stamina + 6*dt);
  }

  /* --- Per-frame: animation, foot IK, look-at ---------------------------- */
  update(dt, lookTarget){
    // Composure visibly changes him (§5.3).
    const low = 1 - M.sat(this.composure/60);
    this.anim.setAdditive('slump', M.sat((this.postureSlump||0)*0.7 + low*0.9));
    this.anim.update(dt);

    // Root motion bob is applied to the mesh, not the collider.
    const rm = this.anim.rootMotion;
    this.mesh.position.y = rm ? rm.y : 0;

    /* Mounted, he is pinned to the saddle bone rather than to a fixed offset
       from the horse's origin. The bone carries the gait's body roll and the
       terrain pitch with it, so he stops sliding off over rough ground. */
    if(this.mounted) this._snapToSaddle();

    // IK works in world space, so the whole chain has to be current first.
    this.object.updateMatrixWorld(true);
    if(!this.mounted && this.grounded && !this.suspendIK) this._footIK();
    // A head faces +Z in this rig; a glance, not a stare.
    if(lookTarget) IK.look(this.rig.byName.head, lookTarget, 0.28, 0.60,
                           PLAYER_HEAD_FWD);
    this.rig.root.updateMatrixWorld(true);
  }

  _snapToSaddle(){
    const h = this.mounted;
    h.saddleWorld(this.pos);
    this.pos.y -= 0.92;                    // pelvis height above his own origin
    this.object.position.copy(this.pos);
    this._rideEuler = this._rideEuler || new THREE.Euler(0,0,0,'YXZ');
    this._rideEuler.set(h.pitch*0.42, h.yaw, h.bank*0.62);
    this.object.quaternion.setFromEuler(this._rideEuler);
  }

  /* Feet plant on the actual ground (§5.2). Raycast is a height query — the
     terrain is a heightfield, so this is exact and free. */
  _footIK(){
    const t = this.terrain;
    for(const side of ['L','R']){
      const foot = this.rig.byName['foot'+side];
      const shin = this.rig.byName['shin'+side];
      const thigh= this.rig.byName['thigh'+side];
      foot.updateMatrixWorld(true);
      const w = new THREE.Vector3().setFromMatrixPosition(foot.matrixWorld);
      const ground = t.heightAt(w.x, w.z) + 0.055;
      // Only correct a foot that has actually gone through the ground. Running
      // the solver every frame on every foot is what makes IK pop.
      if(w.y < ground - 0.012){
        const target = this._footTargets[side].set(w.x, ground, w.z);
        const knee = new THREE.Vector3().setFromMatrixPosition(shin.matrixWorld);
        const pole = knee.clone().add(new THREE.Vector3(
          Math.sin(this.yaw)*1.2, 0.2, Math.cos(this.yaw)*1.2));
        IK.solve(thigh, shin, foot, target, pole);
        // Roll the foot to the ground normal.
        const n = t.normalAt(w.x, w.z);
        const pitch = Math.atan2(n.z*Math.cos(this.yaw) - n.x*Math.sin(this.yaw), n.y);
        foot.rotation.x += M.clamp(pitch, -0.45, 0.45);
      }
    }
  }
}

/* ==========================================================================
   CAMERA — collision-aware spring arm (§5.1)
   ========================================================================== */
class OrbitCam {
  constructor(camera, terrain, colliders){
    this.cam = camera; this.terrain = terrain; this.colliders = colliders;
    this.yaw = 0; this.pitch = -0.16;
    this.dist = CFG.CAM.DIST; this.distVel = 0;
    this.curDist = CFG.CAM.DIST;
    this.pos = new THREE.Vector3();
    this.target = new THREE.Vector3();
    this.smoothTarget = new THREE.Vector3();
    this.fov = CFG.CAM.FOV_WALK;
    this.shakeAmp = 0; this.shakeT = 0;
    this.shakeScale = 1;         // accessibility setting
    this.mode = 'follow';
    this.aim = 0;
    this._q = new THREE.Quaternion();
    this._noise = new Noise(9911);
  }
  input(dx, dy, sens=1){
    this.yaw   -= dx*0.0025*sens;
    this.pitch -= dy*0.0021*sens;
    this.pitch = M.clamp(this.pitch, CFG.CAM.PITCH_MIN, CFG.CAM.PITCH_MAX);
  }
  addShake(a){ this.shakeAmp = Math.min(1.6, this.shakeAmp + a); }

  update(dt, focus, speed, opts={}){
    const C = CFG.CAM;
    /* Target point: shoulder-offset, lagged with a critically damped spring. */
    this.target.copy(focus);
    const k = C.K_POS*(opts.snap?4:1);
    this.smoothTarget.x = M.damp(this.smoothTarget.x, this.target.x, k, dt);
    this.smoothTarget.y = M.damp(this.smoothTarget.y, this.target.y, k*0.62, dt);
    this.smoothTarget.z = M.damp(this.smoothTarget.z, this.target.z, k, dt);

    /* Dynamic FOV by speed / aim (§5.1). */
    let wantFov = C.FOV_WALK;
    if(opts.mounted) wantFov = M.lerp(C.FOV_WALK, C.FOV_GALLOP,
                                      M.sat(speed/CFG.HORSE.GALLOP));
    else wantFov = M.lerp(C.FOV_WALK, C.FOV_SPRINT, M.sat((speed-3)/4));
    if(this.aim > 0) wantFov = M.lerp(wantFov, C.FOV_AIM, this.aim);
    this.fov = M.damp(this.fov, wantFov, 5.5, dt);

    /* Desired arm. */
    let want = opts.mounted ? C.DIST*1.42 : C.DIST;
    if(this.aim > 0) want = M.lerp(want, 1.9, this.aim);
    this.dist = M.damp(this.dist, want, C.K_DIST, dt);

    /* One convention for the whole game: a yaw of 0 faces +Z, and the camera
       sits behind the focus along -forward. The character model, the horse and
       this camera all agree, which is what makes W mean forward. */
    const cp = Math.cos(this.pitch), sp = Math.sin(this.pitch);
    const fwd = new THREE.Vector3(Math.sin(this.yaw)*cp, sp, Math.cos(this.yaw)*cp);
    const right = new THREE.Vector3(-Math.cos(this.yaw), 0, Math.sin(this.yaw));
    const head = this.smoothTarget.clone().addScaledVector(right, C.RIGHT*(1-this.aim*0.4));
    const desired = head.clone().addScaledVector(fwd, -this.dist);

    /* Collision: march from the head toward the desired position, stopping at
       terrain. Pull in hard, extend back out smoothly. */
    let hit = this.dist;
    const steps = 8;
    for(let i=1;i<=steps;i++){
      const t = i/steps;
      const p = head.clone().lerp(desired, t);
      const g = this.terrain.heightAt(p.x, p.z) + 0.42;
      // Pull in for walls as well as ground, so the camera never ends up
      // inside a saloon while the player is standing outside it.
      if(p.y < g || (this.colliders && this.colliders.blocked(p.x, p.z, 0.30))){
        hit = this.dist*t*0.94; break;
      }
    }
    if(hit < this.curDist) this.curDist = M.damp(this.curDist, hit, 26, dt);
    else this.curDist = M.damp(this.curDist, hit, 4.2, dt);
    this.curDist = Math.max(C.MIN_DIST, this.curDist);

    this.pos.copy(head).addScaledVector(fwd, -this.curDist);
    const gmin = this.terrain.heightAt(this.pos.x,this.pos.z) + 0.32;
    if(this.pos.y < gmin) this.pos.y = gmin;

    /* Handheld noise — always on, doubled in combat (§5.1). */
    this.shakeT += dt;
    const base = C.SHAKE*(1 + (opts.combat?1:0));
    const amp = base + this.shakeAmp*0.06;
    const nx = this._noise.n2(this.shakeT*1.7, 0)*amp;
    const ny = this._noise.n2(0, this.shakeT*1.9)*amp;
    const nz = this._noise.n2(this.shakeT*1.1, 5.5)*amp*0.5;
    this.shakeAmp = M.damp(this.shakeAmp, 0, 4.5, dt);

    this.cam.position.copy(this.pos);
    this.cam.lookAt(this.smoothTarget.x, this.smoothTarget.y + 0.10, this.smoothTarget.z);
    this.cam.rotateX(nx*this.shakeScale);
    this.cam.rotateY(ny*this.shakeScale);
    this.cam.rotateZ(nz*this.shakeScale);
    if(Math.abs(this.cam.fov - this.fov) > 0.01){
      this.cam.fov = this.fov; this.cam.updateProjectionMatrix();
    }
  }
}
/* ==========================================================================
   OLLIE — THE HORSE
   Correct equine anatomy and proportion. Yes Yellow coat with a warm-amber
   shadow gradient. Black mane and tail, Verlet-simulated. The head is the
   mascot — rounded, white mask, dot eyes — mounted on a real horse's neck,
   and nobody in the game ever remarks on it (§6).

   Facing convention: +Z forward, same as the player.
   ========================================================================== */

/* neck3 (0,2.08,1.16) -> head (0,2.16,1.34): up and forward, not straight up. */
const OLLIE_NECK_FWD = new THREE.Vector3(0, 0.406, 0.914).normalize();

const OLLIE_BONES = [
  ['pelvis',   null,        0.00, 1.42, -0.75],
  ['spine3',  'pelvis',     0.00, 1.48, -0.35],
  ['spine2',  'spine3',     0.00, 1.50,  0.05],
  ['spine1',  'spine2',     0.00, 1.52,  0.42],
  ['withers', 'spine1',     0.00, 1.60,  0.70],
  ['neck1',   'withers',    0.00, 1.72,  0.86],
  ['neck2',   'neck1',      0.00, 1.92,  1.02],
  ['neck3',   'neck2',      0.00, 2.08,  1.16],
  ['head',    'neck3',      0.00, 2.16,  1.34],
  ['jaw',     'head',       0.00, 2.06,  1.46],
  ['tail1',   'pelvis',     0.00, 1.44, -0.92],
  ['tail2',   'tail1',      0.00, 1.30, -1.16],
  ['tail3',   'tail2',      0.00, 1.10, -1.34],
  /* Forelegs — scapula/humerus/radius/cannon/pastern/hoof */
  ['scapL','withers',  0.30, 1.52, 0.62], ['humL','scapL',  0.32, 1.16, 0.70],
  ['radL','humL',      0.33, 0.80, 0.62], ['canL','radL',   0.33, 0.44, 0.66],
  ['pasL','canL',      0.33, 0.16, 0.68], ['hofL','pasL',   0.33, 0.05, 0.74],
  ['scapR','withers', -0.30, 1.52, 0.62], ['humR','scapR', -0.32, 1.16, 0.70],
  ['radR','humR',     -0.33, 0.80, 0.62], ['canR','radR',  -0.33, 0.44, 0.66],
  ['pasR','canR',     -0.33, 0.16, 0.68], ['hofR','pasR',  -0.33, 0.05, 0.74],
  /* Hindlegs — femur/tibia/hock/cannon/hoof */
  ['femL','pelvis',    0.30, 1.40, -0.70], ['tibL','femL',   0.32, 1.00, -0.86],
  ['hokL','tibL',      0.32, 0.62, -0.68], ['hcanL','hokL',  0.32, 0.30, -0.74],
  ['hhofL','hcanL',    0.32, 0.05, -0.78],
  ['femR','pelvis',   -0.30, 1.40, -0.70], ['tibR','femR',  -0.32, 1.00, -0.86],
  ['hokR','tibR',     -0.32, 0.62, -0.68], ['hcanR','hokR', -0.32, 0.30, -0.74],
  ['hhofR','hcanR',   -0.32, 0.05, -0.78],
];

function buildOllie(lib){
  const def = boneDefFromWorld(OLLIE_BONES);
  const rig = makeSkeleton(def);
  rig.weightScale = { pelvis:1.8, spine3:1.5, spine2:1.6, spine1:1.5,
                      withers:1.5, head:2.4, jaw:0.4,
                      scapL:0.5, scapR:0.5, humL:0.7, humR:0.7,
                      femL:0.7, femR:0.7 };
  const V=(x,y,z)=>new THREE.Vector3(x,y,z);
  const parts=[]; const push=(g,m)=>parts.push({geo:g, group:m});
  const MAT = { COAT:0, MASK:1, EYE:2, MANE:3, TACK:4, HOOF:5 };

  /* --- Barrel: two solids, deep through the girth, tucked at the flank --- */
  push(limbGeometry(V(0,1.50,0.68), V(0,1.46,-0.30), 0.40, 0.44,
       {radial:16, rings:6, squashX:0.94, squashZ:1.12, bulge:0.10}), MAT.COAT);
  push(limbGeometry(V(0,1.46,-0.26), V(0,1.44,-0.86), 0.44, 0.32,
       {radial:14, rings:4, squashX:0.96, squashZ:1.04}), MAT.COAT);
  /* Chest and shoulder mass. */
  push(blobGeometry(V(0,1.34,0.72), 0.34, 0.34, 0.30, 14), MAT.COAT);
  for(const s of [1,-1]) push(blobGeometry(V(s*0.28,1.42,0.60), 0.20,0.28,0.30,12), MAT.COAT);
  /* Croup / hindquarter — the big rounded mass that reads as horse. */
  push(blobGeometry(V(0,1.42,-0.66), 0.42, 0.38, 0.40, 16), MAT.COAT);
  for(const s of [1,-1]) push(blobGeometry(V(s*0.26,1.32,-0.62), 0.22,0.32,0.34,12), MAT.COAT);

  /* --- Neck: thick at the base, tapering, with a crest ------------------- */
  push(limbGeometry(V(0,1.62,0.72), V(0,2.10,1.20), 0.30, 0.19,
       {radial:14, rings:5, squashX:0.78, squashZ:1.06, bulge:0.06}), MAT.COAT);
  push(limbGeometry(V(0,1.74,0.76), V(0,2.18,1.14), 0.10, 0.07,
       {radial:8, rings:4, squashX:0.5}), MAT.MANE);   // crest under the mane

  /* --- The mascot head --------------------------------------------------
     A slightly squashed sphere with a flat-fronted white mask, two dot eyes,
     the notch at the upper left and the little tail at the lower left. */
  push(blobGeometry(V(0,2.16,1.34), 0.285, 0.275, 0.275, 20), MAT.COAT);
  // Notch: a small wedge bitten out of the upper left.
  push(blobGeometry(V(0.20,2.38,1.30), 0.075, 0.070, 0.075, 8), MAT.COAT);
  // The little tail/stem at the lower left.
  push(limbGeometry(V(0.235,2.00,1.30), V(0.300,1.94,1.26), 0.038, 0.020,
       {radial:6, rings:2}), MAT.COAT);
  // Mask: a rounded rectangle sitting proud of the face.
  push(blobGeometry(V(0,2.20,1.545), 0.175, 0.098, 0.075, 16), MAT.MASK);
  push(boxGeometry(V(0,2.20,1.535), 0.320, 0.170, 0.080, 0.34), MAT.MASK);
  // Dot eyes.
  for(const s of [1,-1])
    push(blobGeometry(V(s*0.083,2.205,1.605), 0.038,0.042,0.030, 10), MAT.EYE);
  // Muzzle mass under the mask so the head still reads as attached to a neck.
  push(blobGeometry(V(0,2.02,1.44), 0.150, 0.105, 0.140, 12), MAT.COAT);

  /* --- Mane: strands along the crest. Verlet-driven at runtime. --------- */
  for(let i=0;i<14;i++){
    const t = i/13;
    const y = M.lerp(1.76, 2.24, t), z = M.lerp(0.80, 1.22, t);
    const len = M.lerp(0.30, 0.20, Math.abs(t-0.4)*1.4);
    push(limbGeometry(V(0, y+0.06, z), V(M.imperfection(i,0.06), y-len, z-0.05),
         0.055, 0.020, {radial:5, rings:3, squashX:0.35}), MAT.MANE);
  }
  /* --- Tail ------------------------------------------------------------- */
  push(limbGeometry(V(0,1.44,-0.92), V(0,1.06,-1.38), 0.085, 0.055,
       {radial:8, rings:4, squashX:0.7}), MAT.MANE);
  for(let i=0;i<7;i++){
    const a = (i/7)*Math.PI*2;
    push(limbGeometry(V(Math.cos(a)*0.05,1.32,-1.16),
         V(Math.cos(a)*0.10, 0.72, -1.40+Math.sin(a)*0.06), 0.030, 0.014,
         {radial:4, rings:3}), MAT.MANE);
  }

  /* --- Legs -------------------------------------------------------------
     Real equine proportions: long forearm, short cannon, angled pastern. */
  for(const s of [1,-1]){
    // Fore
    push(limbGeometry(V(s*0.30,1.52,0.62), V(s*0.32,1.16,0.70), 0.17,0.14,
         {radial:9,rings:3,bulge:0.10}), MAT.COAT);

         {radial:8,rings:3}), MAT.COAT);
    push(limbGeometry(V(s*0.33,0.44,0.66), V(s*0.33,0.16,0.68), 0.050,0.046,
         {radial:8,rings:2}), MAT.COAT);
    push(limbGeometry(V(s*0.33,0.16,0.68), V(s*0.33,0.045,0.745), 0.048,0.062,
         {radial:9,rings:2}), MAT.HOOF);
    // Hind
    push(limbGeometry(V(s*0.30,1.40,-0.70), V(s*0.32,1.00,-0.86), 0.20,0.15,
         {radial:9,rings:3,bulge:0.16}), MAT.COAT);
    push(limbGeometry(V(s*0.32,1.00,-0.86), V(s*0.32,0.62,-0.68), 0.150,0.078,

    push(limbGeometry(V(s*0.32,0.62,-0.68), V(s*0.32,0.30,-0.74), 0.070,0.050,
         {radial:8,rings:3}), MAT.COAT);
    push(limbGeometry(V(s*0.32,0.30,-0.74), V(s*0.32,0.045,-0.79), 0.050,0.062,
         {radial:9,rings:3}), MAT.HOOF);
  }

  /* --- Tack: saddle, blanket, girth, bridle, reins ---------------------- */
  push(limbGeometry(V(0,1.86,0.30), V(0,1.84,-0.02), 0.30, 0.32,
       {radial:12, rings:3, squashX:0.92, squashZ:1.0, tipRound:false}), MAT.TACK);
  push(boxGeometry(V(0,1.90,0.26), 0.34, 0.10, 0.30, 0.28), MAT.TACK);
  push(limbGeometry(V(0,1.96,0.34), V(0,2.02,0.40), 0.055, 0.038,
       {radial:8, rings:2}), MAT.TACK);              // saddle horn
  push(limbGeometry(V(0,1.88,0.46), V(0,1.88,-0.16), 0.34, 0.34,
       {radial:12, rings:2, squashX:0.98, squashZ:1.0, tipRound:false}), MAT.MANE);
  for(const s of [1,-1]){
    push(limbGeometry(V(s*0.30,1.78,0.22), V(s*0.42,1.28,0.24), 0.030,0.028,
         {radial:5,rings:2,squashZ:0.4}), MAT.TACK);     // stirrup leather
    push(limbGeometry(V(s*0.42,1.26,0.24), V(s*0.42,1.20,0.24), 0.085,0.085,
         {radial:8,rings:1,squashZ:0.5,tipRound:false}), MAT.HOOF); // stirrup
  }
  // Bridle + reins running from the bit back to the horn.
  push(limbGeometry(V(0,2.08,1.52), V(0,2.30,1.30), 0.022,0.022,
       {radial:5,rings:2}), MAT.TACK);
  for(const s of [1,-1])
    push(limbGeometry(V(s*0.13,2.10,1.50), V(s*0.10,1.98,0.42), 0.016,0.016,
         {radial:4,rings:4}), MAT.TACK);

  const geo = skinParts(parts, rig, {power:3.6});
  const S=(t,extra={})=> new THREE.MeshStandardMaterial(Object.assign({
    map:t.map, roughnessMap:t.roughnessMap, normalMap:t.normalMap,
    roughness:1, metalness:0 }, extra));
  const mats = [
    S(lib.hide_ollie),                                                // coat
    new THREE.MeshStandardMaterial({color:0xf6f4ef, roughness:0.62}), // mask
    new THREE.MeshStandardMaterial({color:0x0a0a0a, roughness:0.30}), // eyes
    new THREE.MeshStandardMaterial({color:0x171412, roughness:0.86,
      map:lib.hide_wolf.map, normalMap:lib.hide_wolf.normalMap}),     // mane/tail
    S(lib.leather_tack),                                              // tack
    new THREE.MeshStandardMaterial({color:0x2b2622, roughness:0.52,
      metalness:0.15, map:lib.rock_grey.map}),                        // hoof/metal
  ];
  const mesh = new THREE.SkinnedMesh(geo, mats);
  mesh.castShadow = true; mesh.receiveShadow = true; mesh.frustumCulled = false;
  mesh.add(rig.root);
  mesh.updateMatrixWorld(true);
  mesh.bind(rig.skeleton);
  const group = new THREE.Group(); group.add(mesh);
  return { rig, mesh, group, mats, MAT };
}

/* ==========================================================================
   GAITS
   Each gait is generated from its real footfall order and timing. That is the
   whole trick: a trot is diagonal pairs, a canter is three-beat with a lead,
   a gallop is four-beat with a suspension phase. Get the offsets right and
   the animation reads as a horse even before the polish.
   ========================================================================== */
function makeGaitClip(name, p){
  const { offsets, dur, reach, lift, bodyBob, headBob, pitch, tailSwing,
          suspension=0, hockFold=1 } = p;
  const steps = 8;
  const t = []; for(let i=0;i<=steps;i++) t.push(i/steps*dur);
  const ph = t.map(x=>x/dur);
  const tracks = {};

  /* One leg: swing forward through the air, plant, then drive back. */
  function leg(upper, mid, lower, hoofB, off, fore){
    const up=[], md=[], lo=[], hf=[];
    for(let i=0;i<=steps;i++){
      const a = (ph[i]+off)%1;
      // Stance occupies roughly 60% of the cycle for walk, less as speed rises.
      const stanceEnd = 0.62 - suspension*0.22;
      let swing, fold;
      if(a < stanceEnd){
        const s = a/stanceEnd;                      // 0 planted fwd → 1 pushed back
        swing = M.lerp(-reach, reach, s);
        fold = 0.06 + Math.max(0,s-0.75)*0.9*lift;
      } else {
        const s = (a-stanceEnd)/(1-stanceEnd);      // recovery through the air
        swing = M.lerp(reach, -reach, M.smoother(s));
        fold = lift*Math.sin(s*Math.PI)*1.15;
      }
      // + rotation swings a limb backwards for every bone in this rig, so both
      // fore and hind sweep front-to-back through stance. No sign flip.
      up.push([t[i], swing, 0, 0]);
      md.push([t[i], (fore ?  fold*0.70 : -fold*0.85*hockFold), 0, 0]);
      lo.push([t[i], (fore ?  fold*1.00 :  fold*1.15), 0, 0]);
      hf.push([t[i], -swing*0.30 - (fore ? fold*0.5 : fold*0.4), 0, 0]);
    }
    tracks[upper]=up; tracks[mid]=md; tracks[lower]=lo; if(hoofB) tracks[hoofB]=hf;
  }
  leg('humL','radL','canL','pasL', offsets.LF, true);
  leg('humR','radR','canR','pasR', offsets.RF, true);
  leg('femL','tibL','hokL','hcanL', offsets.LH, false);
  leg('femR','tibR','hokR','hcanR', offsets.RH, false);
  // Scapulae rock with the forelegs — horses do not have fixed shoulders.
  tracks.scapL = t.map((tt,i)=>[tt, Math.sin(((ph[i]+offsets.LF)%1)*Math.PI*2)*reach*0.20,0,0]);
  tracks.scapR = t.map((tt,i)=>[tt, Math.sin(((ph[i]+offsets.RF)%1)*Math.PI*2)*reach*0.20,0,0]);

  /* Body: vertical bob at twice cycle rate, pitch with the drive. */
  tracks.pelvis = t.map((tt,i)=>[tt,
    pitch + Math.sin(ph[i]*Math.PI*4)*bodyBob*0.5, 0,
    Math.sin(ph[i]*Math.PI*2)*bodyBob*0.6]);
  tracks.spine3 = t.map((tt,i)=>[tt, -pitch*0.3, 0, Math.sin(ph[i]*Math.PI*2)*bodyBob*0.4]);
  tracks.spine2 = t.map((tt,i)=>[tt, -pitch*0.2, 0, Math.sin(ph[i]*Math.PI*2+0.6)*bodyBob*0.3]);
  tracks.spine1 = t.map((tt,i)=>[tt, -pitch*0.15, 0, 0]);
  tracks.withers= t.map((tt,i)=>[tt, Math.sin(ph[i]*Math.PI*4+1.2)*bodyBob*0.4, 0, 0]);

  /* Head bobs in sync with the gait (§6) — this is the tell for a real horse. */
  tracks.neck1 = t.map((tt,i)=>[tt, -pitch*0.5 + Math.sin(ph[i]*Math.PI*2)*headBob, 0, 0]);
  tracks.neck2 = t.map((tt,i)=>[tt, Math.sin(ph[i]*Math.PI*2+0.5)*headBob*0.7, 0, 0]);
  tracks.neck3 = t.map((tt,i)=>[tt, Math.sin(ph[i]*Math.PI*2+1.0)*headBob*0.5, 0, 0]);
  tracks.head  = t.map((tt,i)=>[tt, -Math.sin(ph[i]*Math.PI*2+1.0)*headBob*0.8, 0, 0]);

  /* Tail: lags the body, swings side to side. */
  tracks.tail1 = t.map((tt,i)=>[tt, -0.25 - pitch, Math.sin(ph[i]*Math.PI*2)*tailSwing, 0]);
  tracks.tail2 = t.map((tt,i)=>[tt, 0.10, Math.sin(ph[i]*Math.PI*2-0.7)*tailSwing*1.3, 0]);
  tracks.tail3 = t.map((tt,i)=>[tt, 0.10, Math.sin(ph[i]*Math.PI*2-1.4)*tailSwing*1.6, 0]);

  const events = [];
  for(const [k,o] of Object.entries(offsets)) events.push({t:((1-o)%1)*dur, tag:'hoof'+k});
  return new Clip(name, dur, tracks, {events});
}
