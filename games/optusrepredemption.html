/* ==========================================================================
   HORSE CONTROLLER
   ========================================================================== */
class Horse {
  constructor(terrain, lib, scene, colliders){
    this.terrain = terrain;
    this.colliders = colliders;
    const built = buildOllie(lib);
    this.rig = built.rig; this.mesh = built.mesh; this.mats = built.mats;
    this.object = built.group;
    scene.add(this.object);

    this.anim = new Animator(this.rig);
    buildOllieClips(this.anim);
    this.anim.play('graze_idle', 0);
    this.anim.setAdditive('breathe', 1.0);

    this.pos = new THREE.Vector3();
    this.yaw = 0; this.speed = 0; this.bank = 0; this.pitch = 0;
    this.rider = null;
    this.stamina = 100; this.staminaMax = 100;
    this.bond = 1;            // 0..4 (§6)
    this.dirt = 0.15;         // 0..1, visible on the coat
    this.mood = 'idle';
    this.grazing = false;
    this.followTarget = null;
    this.spokenAt = {};       // line -> time, for the no-repeat window
    this.onSpeak = null;
    this.onHoof = null;
    this.hoofPhase = 0;
    this._tmp = new THREE.Vector3();
    this.stumbleTimer = 0;
    this.rearTimer = 0;
    /* Verlet mane/tail — 16 strands as required, driven by motion + wind. */
    this.strands = [];
    for(let i=0;i<16;i++){
      this.strands.push({ p:new THREE.Vector3(), o:new THREE.Vector3(), init:false });
    }
  }

  spawn(x,z,yaw=0){
    this.pos.set(x, this.terrain.heightAt(x,z), z);
    this.yaw = yaw;
    this.object.position.copy(this.pos);
    this.object.rotation.y = yaw;
  }

  /* Where the rider sits. Taken from the spine bone rather than from a fixed
     offset on the root, so it inherits the gait's body roll, the terrain pitch
     and the bank through a turn — all the motion a rider should be glued to. */
  saddleWorld(out){
    const b = this.rig.byName.spine1;
    return (out || new THREE.Vector3()).set(0, 0.345, -0.195)
             .applyMatrix4(b.matrixWorld);
  }
  saddlePoint(){ return this.saddleWorld(new THREE.Vector3()); }
  headPoint(){
    const s = new THREE.Vector3(0, 2.16, 1.34);
    s.applyAxisAngle(new THREE.Vector3(0,1,0), this.yaw);
    return s.add(this.pos);
  }

  mount(player){
    this.rider = player; player.mounted = this;
    this.grazing = false;
    this.say('mount');
  }
  dismount(){
    if(!this.rider) return;
    const p = this.rider;
    const off = new THREE.Vector3(1.35,0,0).applyAxisAngle(new THREE.Vector3(0,1,0), this.yaw);
    p.pos.set(this.pos.x+off.x, 0, this.pos.z+off.z);
    p.pos.y = this.terrain.heightAt(p.pos.x, p.pos.z);
    p.mounted = null; p.object.rotation.set(0, this.yaw, 0);
    this.rider = null;
    this.say('dismount');
  }

  /* Contextual speech with a no-repeat window (§6). */
  say(context, force=false){
    const pool = OLLIE_LINES[context];
    if(!pool || !this.onSpeak) return;
    const now = performance.now()/1000;
    const fresh = pool.filter(l => !this.spokenAt[l] || now-this.spokenAt[l] > 300);
    const list = fresh.length ? fresh : pool;
    const line = list[(Math.random()*list.length)|0];
    if(!force && this._lastSpeak && now - this._lastSpeak < 22) return;
    this._lastSpeak = now;
    this.spokenAt[line] = now;
    this.onSpeak(line, this.headPoint());
  }

  fixedUpdate(dt, input, camYaw, world){
    const ridden = !!this.rider;
    const C = CFG.HORSE;

    if(ridden){
      /* Speed ladder: tap forward to move up a gait, back to slow. Holding
         sprint spurs into a gallop and burns stamina. */
      let want = 0;
      if(input.fwd > 0.1){
        want = input.sprint && this.stamina > 2 ? C.GALLOP
             : (input.walk ? C.WALK : C.CANTER*0.86);
        want *= Math.min(1, Math.abs(input.fwd));
      } else if(input.fwd < -0.1){ want = -C.WALK*0.7; }

      if(input.brake) want = 0;
      const rate = want > this.speed ? C.ACCEL : C.BRAKE;
      this.speed = M.damp(this.speed, want, rate, dt);

      /* Steering. A horse can pivot on the spot, so turn authority never drops
         to zero; it only tightens up as she slows. The camera does not steer
         for you — you steer, the camera watches. */
      const bondK = 0.85 + this.bond*0.075;
      const steerRate = C.TURN*bondK*M.lerp(1.35, 0.50, M.sat(this.speed/C.GALLOP));
      const authority = M.lerp(0.45, 1.0, M.sat(Math.abs(this.speed)/2.2));
      this.yaw -= input.right*steerRate*dt*authority;

      // Bank into turns.
      const turnAmt = -input.right*M.sat(this.speed/C.GALLOP);
      this.bank = M.damp(this.bank, turnAmt*0.30, 5.0, dt);

      if(this.speed > C.CANTER){
        this.stamina = Math.max(0, this.stamina - (this.speed/C.GALLOP)*13*dt);
        if(this.stamina <= 0) this.speed = Math.min(this.speed, C.TROT);
      } else {
        this.stamina = Math.min(this.staminaMax, this.stamina + 8*dt);
      }
    } else {
      /* Riderless: graze, or path back to the player when whistled. */
      if(this.followTarget){
        // Chase where he IS, not where he was when you whistled.
        if(this.followLive) this.followTarget.copy(this.followLive());
        const d = this.followTarget.clone().sub(this.pos); d.y = 0;
        const dist = d.length();
        if(dist > 3.4){
          const want = this._steer(Math.atan2(d.x,d.z), dist);
          this.yaw = M.angDamp(this.yaw, want, 3.4, dt);
          // She hurries if she is a long way off, and settles as she arrives.
          const gait = dist > 90 ? C.GALLOP : dist > 26 ? C.CANTER : C.TROT;
          this.speed = M.damp(this.speed, gait, C.ACCEL, dt);
        } else { this.speed = M.damp(this.speed,0,C.BRAKE,dt); this.followTarget=null; }
      } else {
        this.speed = M.damp(this.speed, 0, C.BRAKE, dt);
        // Head down eating is the wrong pose for a horse who is mid-sentence.
        this.grazing = !this.inScene && this.speed < 0.15;
      }
      this.stamina = Math.min(this.staminaMax, this.stamina + 6*dt);
    }

    /* Move and stick to the ground. */
    const f = new THREE.Vector3(Math.sin(this.yaw),0,Math.cos(this.yaw));
    const nx = this.pos.x + f.x*this.speed*dt;
    const nz = this.pos.z + f.z*this.speed*dt;
    const lim = CFG.HALF-8;
    this.pos.x = M.clamp(nx,-lim,lim); this.pos.z = M.clamp(nz,-lim,lim);
    /* A horse is wider than a man and will not walk through a saloon wall. */
    if(this.colliders && this.colliders.resolve(this.pos, 0.95, 2.2)){
      this.speed *= 0.55;
    }
    let gh = this.terrain.heightAt(this.pos.x, this.pos.z);
    if(this.colliders){
      const deck = this.colliders.support(this.pos.x, this.pos.z, this.pos.y, 0.95);
      if(deck > gh) gh = deck;
    }
    // Slopes slow her and pitch the body.
    const ahead = this.terrain.heightAt(this.pos.x+f.x*1.4, this.pos.z+f.z*1.4);
    const grade = (ahead - gh)/1.4;
    this.pitch = M.damp(this.pitch, M.clamp(-Math.atan(grade), -0.5, 0.5), 6, dt);
    if(grade > 0.35 && this.speed > C.TROT) this.speed *= (1 - dt*1.4);
    this.pos.y = M.damp(this.pos.y, gh, 18, dt);

    /* Stumble on rough ground at speed (§6). */
    if(this.stumbleTimer > 0) this.stumbleTimer -= dt;
    else if(this.speed > C.CANTER){
      const rough = Math.abs(this.terrain.detail(this.pos.x, this.pos.z)
                           - this.terrain.detail(this.pos.x+1.2, this.pos.z+1.2));
      if(rough > 0.52 && Math.random() < dt*0.9){
        this.stumbleTimer = 1.05;
        this.anim.play('stumble', 0.08, true);
        this.speed *= 0.55;
        this.say('fall');
        if(this.onStumble) this.onStumble();
      }
    }

    /* Gait selection blended by speed, with correct transitions. */
    if(this.rearTimer > 0){ this.rearTimer -= dt; }
    else if(this.stumbleTimer > 0.02){ /* stumble clip owns the body */ }
    else {
      const s = Math.abs(this.speed);
      if(s < 0.16){
        this.anim.play(this.grazing && !ridden ? 'graze' : 'graze_idle', 0.5);
        this.anim.speed = 1;
      }
      else if(s < C.TROT*0.82){ this.anim.play('walk',0.32);
        this.anim.speed = M.clamp(s/C.WALK,0.55,1.6); }
      else if(s < C.CANTER*0.80){ this.anim.play('trot',0.26);
        this.anim.speed = M.clamp(s/C.TROT,0.7,1.45); }
      else if(s < C.GALLOP*0.88){ this.anim.play('canter',0.26);
        this.anim.speed = M.clamp(s/C.CANTER,0.75,1.35); }
      else { this.anim.play('gallop',0.22);
        this.anim.speed = M.clamp(s/C.GALLOP,0.8,1.3); }
    }

    /* Hoofbeat events from the animation phase. */
    const clip = this.anim.clips[this.anim.state];
    if(clip && this.speed > 0.3 && this.onHoof){
      const p = (this.anim.time % clip.duration)/clip.duration;
      for(const e of clip.events){
        const et = e.t/clip.duration;
        if(this.hoofPhase < et && p >= et){
          this.onHoof(this.speed, this.pos, this.anim.state);
        }
      }
      if(p < this.hoofPhase){
        this.onHoof(this.speed, this.pos, this.anim.state);
      }
      this.hoofPhase = p;
    }

    this.object.position.copy(this.pos);
    // YXZ: yaw first, then pitch, then roll — the order a body actually moves in.
    this.object.rotation.order = 'YXZ';
    this.object.rotation.set(this.pitch*0.6, this.yaw, this.bank);

    /* Dirt accumulates as she works and washes off in rain (§6). */
    if(this.speed > 1) this.dirt = Math.min(1, this.dirt + dt*0.006*this.speed*0.2);
    if(world && world.wetness > 0.4) this.dirt = Math.max(0, this.dirt - dt*0.05);
    this.mats[0].color.setRGB(1-this.dirt*0.30, 1-this.dirt*0.33, 1-this.dirt*0.36);

    /* Contextual chatter. */
    this._chatter(dt, world);
  }

  _chatter(dt, world){
    this._chatT = (this._chatT||0) + dt;
    // She is company, not a radio. Roughly one remark a minute at most.
    if(this._chatT < 38) return;
    this._chatT = 0;
    if(Math.random() > 0.34) return;
    const C = CFG.HORSE;
    if(this.stamina < 22) return this.say('tired');
    if(this.speed > C.CANTER*1.05) return this.say('gallop');
    if(this.bond <= 1 && Math.random()<0.45) return this.say('lowBond');
    if(this.bond >= 3 && Math.random()<0.40) return this.say('highBond');
    if(world){
      if(world.nearTower)    return this.say('tower');
      if(world.inTown)       return this.say('town');
      if(world.weather==='thunderstorm') return this.say('storm');
      if(world.weather==='snow' || world.weather==='blizzard') return this.say('snow');
      if(world.isNight)      return this.say('night');
      if(world.inWater)      return this.say('water');
    }
    this.say('idle');
  }

  rear(){
    if(this.bond < 2 || this.rearTimer > 0) return false;
    this.rearTimer = 1.6;
    this.anim.play('rear', 0.10, true);
    this.speed = 0;
    return true;
  }
  /* Fan out from the direction she wants to go and take the first heading
     that is not into a wall. Enough to get her round a building or a fence;
     she is not solving a maze, she is walking round a shed. */
  _steer(desired, dist){
    if(!this.colliders) return desired;
    const probe = Math.min(9, 3.5 + dist*0.08);
    for(const off of [0, 0.30, -0.30, 0.62, -0.62, 0.95, -0.95, 1.35, -1.35]){
      const a = desired + off;
      const px = this.pos.x + Math.sin(a)*probe;
      const pz = this.pos.z + Math.cos(a)*probe;
      const mx = this.pos.x + Math.sin(a)*probe*0.5;
      const mz = this.pos.z + Math.cos(a)*probe*0.5;
      if(!this.colliders.blocked(px,pz,1.1) && !this.colliders.blocked(mx,mz,1.1)){
        // Also refuse anything she plainly cannot climb.
        const g0 = this.terrain.heightAt(this.pos.x,this.pos.z);
        const g1 = this.terrain.heightAt(px,pz);
        if((g1-g0)/probe < 0.85) return a;
      }
    }
    return desired;
  }

  whistleTo(pos, live){
    const d = this.pos.distanceTo(pos);
    const range = CFG.HORSE.WHISTLE_R * (0.55 + this.bond*0.1125);
    if(d > range) return false;
    this.followTarget = pos.clone();
    this.followLive = live || null;
    return true;
  }
  addBond(amount){
    this.bond = M.clamp(this.bond + amount, 0, 4);
  }
  brush(){ this.dirt = Math.max(0, this.dirt-0.34); this.addBond(0.12); }
  feed(){ this.stamina = this.staminaMax; this.addBond(0.20); }

  update(dt, lookTarget){
    this.anim.update(dt);
    // Skeleton must be current before the rider reads the saddle bone off it.
    this.object.updateMatrixWorld(true);
    // Mouth flap while speaking is driven by the audio envelope; the jaw bone
    // is written after the animator so it always wins.
    if(this.mouthOpen !== undefined){
      this.rig.byName.jaw.rotation.x += this.mouthOpen*0.30;
    }
    /* Her neck runs up and forward, so its rest facing is neither +Y nor +Z.
       Aiming the wrong axis is what had her upper body corkscrewing. */
    if(lookTarget && this.speed < 1.2)
      IK.look(this.rig.byName.neck3, lookTarget, 0.16, 0.42, OLLIE_NECK_FWD);
    this.rig.root.updateMatrixWorld(true);
  }
}
/* ==========================================================================
   AUDIO
   100% Web Audio synthesis. No sample files (§16). A small toolkit at the top
   and everything else derives from it — noise shaping, Karplus-Strong plucks,
   bowed and blown physical models, and formant synthesis for voices.
   ========================================================================== */
class Audio {
  constructor(){
    this.ctx = null; this.ready = false;
    this.now = ()=> this.ctx ? this.ctx.currentTime : 0;
    this.voices = {};
    this.spatial = [];      // live positional sources that track a moving emitter
    this._lastFoot = 0;
    this._lastHoof = 0;
  }

  init(){
    if(this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    this.ctx = new AC();
    const c = this.ctx;

    /* --- Bus layout ---------------------------------------------------- */
    this.master = c.createGain();  this.master.gain.value = CFG.MASTER_GAIN;
    this.limiter = c.createDynamicsCompressor();
    this.limiter.threshold.value = -8; this.limiter.knee.value = 8;
    this.limiter.ratio.value = 8; this.limiter.attack.value = 0.004;
    this.limiter.release.value = 0.20;
    this.master.connect(this.limiter).connect(c.destination);

    const bus = (name, gain)=>{
      const g = c.createGain(); g.gain.value = gain; g.connect(this.master);
      this[name] = g; return g;
    };
    bus('musicBus', 0.30);
    bus('sfxBus',   0.90);
    bus('voiceBus', 1.00);
    bus('ambBus',   0.62);

    /* Underwater / Yes-Eye low-pass across the whole SFX+music path. */
    this.worldFilter = c.createBiquadFilter();
    this.worldFilter.type = 'lowpass'; this.worldFilter.frequency.value = 20000;
    this.sfxBus.disconnect(); this.ambBus.disconnect(); this.musicBus.disconnect();
    this.sfxBus.connect(this.worldFilter);
    this.ambBus.connect(this.worldFilter);
    this.musicBus.connect(this.worldFilter);
    this.worldFilter.connect(this.master);

    /* Ducking: dialogue always sits over music (§16). */
    this.duck = c.createGain(); this.duck.gain.value = 1;
    this.musicBus.disconnect(); this.musicBus.connect(this.duck);
    this.duck.connect(this.worldFilter);

    /* Convolution reverbs generated as noise-burst impulse responses. */
    this.verbs = {
      outdoor: this._makeVerb(2.4, 0.28, 1400),
      store:   this._makeVerb(0.9, 0.55, 3200),
      cave:    this._makeVerb(3.6, 0.62, 900),
      church:  this._makeVerb(4.8, 0.48, 2200),
      board:   this._makeVerb(1.3, 0.35, 2600),
    };
    this.verbSend = c.createGain(); this.verbSend.gain.value = 0.20;
    this.verbNode = c.createConvolver(); this.verbNode.buffer = this.verbs.outdoor;
    this.verbReturn = c.createGain(); this.verbReturn.gain.value = 0.55;
    this.verbSend.connect(this.verbNode).connect(this.verbReturn).connect(this.master);

    this.listener = c.listener;
    this.ready = true;

    this._startAmbience();
    this.music = new Score(this);
  }

  resume(){ if(this.ctx && this.ctx.state==='suspended') this.ctx.resume(); }
  suspend(){ if(this.ctx && this.ctx.state==='running') this.ctx.suspend(); }

  /* Per-frame: drag every live positional voice to wherever its speaker is now. */
  update(dt){
    if(!this.ready) return;
    const t = this.now();
    for(let i=this.spatial.length-1;i>=0;i--){
      const h = this.spatial[i];
      if(t > h.until){ this.spatial.splice(i,1); continue; }
      const p = h.follow && h.follow();
      if(!p || !h.panner) continue;
      if(h.panner.positionX){
        h.panner.positionX.setTargetAtTime(p.x, t, 0.02);
        h.panner.positionY.setTargetAtTime(p.y, t, 0.02);
        h.panner.positionZ.setTargetAtTime(p.z, t, 0.02);
      } else h.panner.setPosition(p.x, p.y, p.z);
    }
    if(this.music) this.music.update(dt);
  }

  /* --- Toolkit ----------------------------------------------------------- */
  noiseBuffer(seconds=2, kind='white'){
    const c=this.ctx, n=Math.floor(c.sampleRate*seconds);
    const b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0);
    let last=0, b0=0,b1=0,b2=0;
    for(let i=0;i<n;i++){
      const w = Math.random()*2-1;
      if(kind==='pink'){
        b0=0.99765*b0+w*0.0990460; b1=0.96300*b1+w*0.2965164;
        b2=0.57000*b2+w*1.0526913;
        d[i]=(b0+b1+b2+w*0.1848)*0.28;
      } else if(kind==='brown'){
        last=(last+0.02*w)/1.02; d[i]=last*3.2;
      } else d[i]=w;
    }
    return b;
  }
  _makeVerb(dur, decay, tone){
    const c=this.ctx, n=Math.floor(c.sampleRate*dur);
    const b=c.createBuffer(2,n,c.sampleRate);
    for(let ch=0;ch<2;ch++){
      const d=b.getChannelData(ch);
      let lp=0;
      for(let i=0;i<n;i++){
        const t=i/n;
        const env=Math.pow(1-t, 1/Math.max(decay,0.05))*(1-t);
        const w=(Math.random()*2-1)*env;
        lp += (w-lp)*Math.min(1, tone/(c.sampleRate*0.5));
        // Early reflections give the space a size.
        d[i]=lp*(1 + (i<n*0.02 ? Math.random()*1.5 : 0));
      }
    }
    return b;
  }
  env(node, t, a, d, s, r, peak=1, sus=0.0){
    const g=node.gain;
    g.cancelScheduledValues(t);
    g.setValueAtTime(0.0001, t);
    g.exponentialRampToValueAtTime(Math.max(peak,0.0001), t+a);
    g.exponentialRampToValueAtTime(Math.max(peak*(sus||0.001),0.0001), t+a+d);
    g.exponentialRampToValueAtTime(0.0001, t+a+d+s+r);
    return t+a+d+s+r;
  }
  /* Spatialised output node with distance rolloff (§16). */
  panner(pos, ref=6, max=260){
    const p=this.ctx.createPanner();
    p.panningModel='HRTF'; p.distanceModel='inverse';
    p.refDistance=ref; p.maxDistance=max; p.rolloffFactor=1.1;
    if(pos) p.positionX.value=pos.x, p.positionY.value=pos.y, p.positionZ.value=pos.z;
    return p;
  }
  out(pos, verb=0.2){
    const g=this.ctx.createGain();
    if(pos){ const p=this.panner(pos); g.connect(p); p.connect(this.sfxBus);
             const s=this.ctx.createGain(); s.gain.value=verb; g.connect(s);
             s.connect(this.verbSend); }
    else { g.connect(this.sfxBus); }
    return g;
  }

  /* Karplus-Strong pluck — the guitar and the banjo in the score. */
  pluck(freq, dur, gainNode, bright=0.5, level=0.4, when=0){
    const c=this.ctx, sr=c.sampleRate;
    const N=Math.max(2, Math.floor(sr/freq));
    const buf=c.createBuffer(1, Math.ceil(sr*dur), sr);
    const d=buf.getChannelData(0);
    const ring=new Float32Array(N);
    for(let i=0;i<N;i++) ring[i]=(Math.random()*2-1);
    // Low-pass the excitation for a warmer, nylon-string attack.
    for(let k=0;k<3;k++){ let prev=ring[N-1];
      for(let i=0;i<N;i++){ ring[i]=(ring[i]+prev)*0.5; prev=ring[i]; } }
    let idx=0, prev=0;
    const damp = 0.494 + bright*0.010;
    for(let i=0;i<d.length;i++){
      const cur=ring[idx];
      const v=(cur+prev)*damp;
      prev=cur; ring[idx]=v; idx=(idx+1)%N;
      d[i]=v*level;
    }
    const src=c.createBufferSource(); src.buffer=buf;
    src.connect(gainNode); src.start(when || 0);
    return src;
  }

  /* Bowed string — a filtered sawtooth with a bow-noise transient. */
  bow(freq, t, dur, gainNode, level=0.22){
    const c=this.ctx;
    const o=c.createOscillator(); o.type='sawtooth'; o.frequency.value=freq;
    const f=c.createBiquadFilter(); f.type='lowpass';
    f.frequency.setValueAtTime(freq*2.2, t);
    f.frequency.linearRampToValueAtTime(freq*5.5, t+0.12);
    f.Q.value=1.8;
    const g=c.createGain(); g.gain.value=0;
    // Vibrato after the attack — a fiddle that vibrates immediately is a synth.
    const lfo=c.createOscillator(); lfo.frequency.value=5.4;
    const lg=c.createGain(); lg.gain.setValueAtTime(0,t);
    lg.gain.linearRampToValueAtTime(freq*0.011, t+0.28);
    lfo.connect(lg).connect(o.frequency);
    o.connect(f).connect(g).connect(gainNode);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(level, t+0.07);
    g.gain.setValueAtTime(level, t+dur*0.7);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.start(t); lfo.start(t); o.stop(t+dur+0.05); lfo.stop(t+dur+0.05);
  }

  /* Harmonica — formant-filtered saw stack with breath noise. */
  harmonica(freq, t, dur, gainNode, level=0.16){
    const c=this.ctx;
    const g=c.createGain(); g.gain.value=0; g.connect(gainNode);
    for(const [mult,amp] of [[1,1],[2,0.42],[3,0.2],[4,0.1]]){
      const o=c.createOscillator(); o.type='sawtooth'; o.frequency.value=freq*mult;
      o.detune.value=(Math.random()-0.5)*14;
      const og=c.createGain(); og.gain.value=amp*0.3;
      o.connect(og).connect(g); o.start(t); o.stop(t+dur+0.05);
    }
    const bp=c.createBiquadFilter(); bp.type='bandpass';
    bp.frequency.value=freq*3.2; bp.Q.value=2.2;
    const noise=c.createBufferSource(); noise.buffer=this.noiseBuffer(dur+0.1,'pink');
    const ng=c.createGain(); ng.gain.value=0.05;
    noise.connect(bp).connect(ng).connect(g); noise.start(t); noise.stop(t+dur);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(level,t+0.05);
    g.gain.setValueAtTime(level,t+dur*0.65);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  }

  /* --- SFX --------------------------------------------------------------
     Surfaces have correct impedance: boards resonate, sand absorbs, gravel
     scatters (§16). */
  footstep(surface, intensity, pos){
    if(!this.ready) return;
    const t=this.now();
    if(t - this._lastFoot < 0.07) return;
    this._lastFoot = t;
    const c=this.ctx;
    const P = {
      grass:  {f:420, q:1.0, dur:0.13, noise:'pink',  lvl:0.16, body:0},
      dirt:   {f:280, q:1.4, dur:0.12, noise:'brown', lvl:0.20, body:0.1},
      sand:   {f:900, q:0.7, dur:0.16, noise:'white', lvl:0.12, body:0},
      gravel: {f:1600,q:2.4, dur:0.10, noise:'white', lvl:0.22, body:0},
      snow:   {f:2400,q:0.9, dur:0.18, noise:'white', lvl:0.13, body:0},
      wood:   {f:180, q:6.0, dur:0.22, noise:'brown', lvl:0.26, body:0.55},
      stone:  {f:2200,q:3.0, dur:0.09, noise:'white', lvl:0.24, body:0.2},
      water:  {f:700, q:0.6, dur:0.30, noise:'white', lvl:0.22, body:0},
    }[surface] || {f:300,q:1.2,dur:0.12,noise:'brown',lvl:0.18,body:0};

    const out = this.out(pos, 0.12);
    const n = c.createBufferSource(); n.buffer = this.noiseBuffer(P.dur+0.05, P.noise);
    const f = c.createBiquadFilter(); f.type='bandpass';
    f.frequency.value = P.f*(0.85+Math.random()*0.3); f.Q.value = P.q;
    const g = c.createGain();
    n.connect(f).connect(g).connect(out);
    const lvl = P.lvl*(0.55+intensity*0.7);
    g.gain.setValueAtTime(lvl, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+P.dur);
    n.start(t); n.stop(t+P.dur+0.05);
    // Resonant body for boards and stone.
    if(P.body>0){
      const o=c.createOscillator(); o.type='sine';
      o.frequency.setValueAtTime(P.f*0.7,t);
      o.frequency.exponentialRampToValueAtTime(P.f*0.45,t+P.dur);
      const og=c.createGain(); og.gain.setValueAtTime(P.body*lvl,t);
      og.gain.exponentialRampToValueAtTime(0.0001,t+P.dur*1.4);
      o.connect(og).connect(out); o.start(t); o.stop(t+P.dur*1.5);
    }
    // Leather creak on the coat, quiet and occasional.
    if(Math.random()<0.3) this.creak(pos, 0.5);
  }

  hoofbeat(speed, pos, gait){
    if(!this.ready) return;
    const t=this.now();
    if(t - this._lastHoof < 0.045) return;
    this._lastHoof = t;
    const c=this.ctx;
    const hard = M.sat(speed/CFG.HORSE.GALLOP);
    const out = this.out(pos, 0.22);
    // Two-part hit: a hard click and a hollow thump. That is a hoof.
    const n=c.createBufferSource(); n.buffer=this.noiseBuffer(0.10,'white');
    const bp=c.createBiquadFilter(); bp.type='bandpass';
    bp.frequency.value=1800+Math.random()*900; bp.Q.value=3.2;
    const g=c.createGain(); g.gain.setValueAtTime(0.16+hard*0.16,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.075);
    n.connect(bp).connect(g).connect(out); n.start(t); n.stop(t+0.12);

    const o=c.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(150+Math.random()*40,t);
    o.frequency.exponentialRampToValueAtTime(64,t+0.13);
    const og=c.createGain(); og.gain.setValueAtTime(0.20+hard*0.22,t);
    og.gain.exponentialRampToValueAtTime(0.0001,t+0.17);
    o.connect(og).connect(out); o.start(t); o.stop(t+0.20);

    if(Math.random()<0.35) this.creak(pos, 0.4+hard*0.4);
  }

  creak(pos, level=0.5){
    const c=this.ctx, t=this.now();
    const out=this.out(pos, 0.1);
    const o=c.createOscillator(); o.type='sawtooth';
    const base=90+Math.random()*140;
    o.frequency.setValueAtTime(base,t);
    o.frequency.linearRampToValueAtTime(base*1.35,t+0.16);
    const f=c.createBiquadFilter(); f.type='bandpass';
    f.frequency.value=base*4; f.Q.value=7;
    const g=c.createGain(); g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.030*level,t+0.04);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.20);
    o.connect(f).connect(g).connect(out); o.start(t); o.stop(t+0.24);
  }

  whistleSfx(pos){
    const c=this.ctx, t=this.now();
    const out=this.out(pos,0.3);
    const o=c.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(900,t);
    o.frequency.linearRampToValueAtTime(1750,t+0.16);
    o.frequency.linearRampToValueAtTime(1250,t+0.42);
    const g=c.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.16,t+0.05);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.55);
    const n=c.createBufferSource(); n.buffer=this.noiseBuffer(0.6,'white');
    const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1600; bp.Q.value=6;
    const ng=c.createGain(); ng.gain.value=0.012;
    n.connect(bp).connect(ng).connect(out); n.start(t); n.stop(t+0.6);
    o.connect(g).connect(out); o.start(t); o.stop(t+0.6);
  }

  splash(pos, size=1){
    const c=this.ctx,t=this.now(); const out=this.out(pos,0.25);
    const n=c.createBufferSource(); n.buffer=this.noiseBuffer(0.6,'white');
    const f=c.createBiquadFilter(); f.type='lowpass';
    f.frequency.setValueAtTime(4200,t);
    f.frequency.exponentialRampToValueAtTime(500,t+0.45);
    const g=c.createGain(); g.gain.setValueAtTime(0.22*size,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.5);
    n.connect(f).connect(g).connect(out); n.start(t); n.stop(t+0.6);
  }

  thunder(distance){
    const c=this.ctx, t=this.now()+distance/340;   // delayed by distance (§15)
    const out=this.ctx.createGain(); out.connect(this.ambBus);
    const n=c.createBufferSource(); n.buffer=this.noiseBuffer(3.4,'brown');
    const f=c.createBiquadFilter(); f.type='lowpass';
    f.frequency.setValueAtTime(M.lerp(900,120,M.sat(distance/2500)),t);
    f.frequency.exponentialRampToValueAtTime(60,t+2.6);
    const g=c.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.55*M.lerp(1,0.12,M.sat(distance/2500)),t+0.10);
    g.gain.exponentialRampToValueAtTime(0.0001,t+3.0);
    n.connect(f).connect(g).connect(out); n.start(t); n.stop(t+3.4);
  }

  /* --- Ambience: wind bed with velocity-driven cutoff -------------------- */
  _startAmbience(){
    const c=this.ctx;
    this.windSrc = c.createBufferSource();
    this.windSrc.buffer = this.noiseBuffer(6,'pink');
    this.windSrc.loop = true;
    this.windFilter = c.createBiquadFilter();
    this.windFilter.type='bandpass'; this.windFilter.frequency.value=420;
    this.windFilter.Q.value=0.5;
    this.windGain = c.createGain(); this.windGain.gain.value=0.05;
    this.windSrc.connect(this.windFilter).connect(this.windGain).connect(this.ambBus);
    this.windSrc.start();

    // A second, higher layer for gusts through grass and pine.
    this.gustSrc = c.createBufferSource();
    this.gustSrc.buffer = this.noiseBuffer(5,'white');
    this.gustSrc.loop = true;
    this.gustFilter = c.createBiquadFilter();
    this.gustFilter.type='bandpass'; this.gustFilter.frequency.value=2400;
    this.gustFilter.Q.value=1.4;
    this.gustGain = c.createGain(); this.gustGain.gain.value=0.0;
    this.gustSrc.connect(this.gustFilter).connect(this.gustGain).connect(this.ambBus);
    this.gustSrc.start();

    // Night insects / day birds bed, swapped by time of day.
    this.lifeGain = c.createGain(); this.lifeGain.gain.value=0; 
    this.lifeGain.connect(this.ambBus);
  }
  setWind(strength, gust){
    if(!this.ready) return;
    const t=this.now();
    this.windFilter.frequency.setTargetAtTime(260+strength*820, t, 0.4);
    this.windGain.gain.setTargetAtTime(0.020+strength*0.085, t, 0.5);
    this.gustGain.gain.setTargetAtTime(gust*0.030, t, 0.25);
  }
  setUnderwater(on){
    if(!this.ready) return;
    this.worldFilter.frequency.setTargetAtTime(on?420:20000, this.now(), 0.12);
  }
  setYesEye(on){
    if(!this.ready) return;
    this.worldFilter.frequency.setTargetAtTime(on?1400:20000, this.now(), 0.18);
  }
  setReverb(space){
    if(!this.ready || !this.verbs[space]) return;
    this.verbNode.buffer = this.verbs[space];
  }

  /* ======================================================================
     VOICE — formant synthesis, one profile per character (§16).
     A glottal source (pulse + noise) through three resonant band-passes.
     Formant targets are driven by a crude phonemiser over the subtitle text,
     which is enough to make mouths move to speech convincingly.
     ====================================================================== */
  /* follow: optional () => Vector3, sampled every frame so a voice stays with
     the character who is speaking instead of being stranded where they stood. */
  speak(text, profile, pos, onMouth, onDone, follow){
    if(!this.ready){ onDone && onDone(); return null; }
    const c=this.ctx, t0=this.now()+0.02;
    const P = Object.assign({
      pitch: 120, formant: 1.0, rate: 1.0, breath: 0.10, rasp: 0.0,
      vibrato: 0.010, tic: null, vocoder: 0,
    }, profile||{});

    const phonemes = phonemise(text);
    const out = this.ctx.createGain();
    out.gain.value = 1.0;
    let pannerNode = null;
    if(pos){ pannerNode = this.panner(pos, 4, 90);
             out.connect(pannerNode); pannerNode.connect(this.voiceBus);
             const s=this.ctx.createGain(); s.gain.value=0.16;
             out.connect(s); s.connect(this.verbSend); }
    else out.connect(this.voiceBus);

    // Glottal source.
    const osc = c.createOscillator();
    osc.type = P.vocoder>0 ? 'square' : 'sawtooth';
    osc.frequency.value = P.pitch;
    const vib = c.createOscillator(); vib.frequency.value = 4.8;
    const vibG = c.createGain(); vibG.gain.value = P.pitch*P.vibrato;
    vib.connect(vibG).connect(osc.frequency);

    const breath = c.createBufferSource();
    breath.buffer = this.noiseBuffer(4,'pink'); breath.loop = true;
    const breathG = c.createGain(); breathG.gain.value = P.breath*0.25;

    const src = c.createGain();
    osc.connect(src); breath.connect(breathG).connect(src);

    // Three formants.
    const F=[];
    for(let i=0;i<3;i++){
      const f=c.createBiquadFilter(); f.type='bandpass';
      f.Q.value = [8, 10, 12][i];
      const g=c.createGain(); g.gain.value=[1.0,0.62,0.34][i];
      src.connect(f).connect(g).connect(out);
      F.push(f);
    }
    // Rasp: a touch of waveshaping for the older, drier voices.
    if(P.rasp>0){
      const ws=c.createWaveShaper();
      const n=1024, curve=new Float32Array(n);
      for(let i=0;i<n;i++){ const x=i/(n-1)*2-1;
        curve[i]=Math.tanh(x*(1+P.rasp*7))/Math.tanh(1+P.rasp*7); }
      ws.curve=curve; src.disconnect();
      src.connect(ws); F.forEach(f=>ws.connect(f));
    }

    const amp = c.createGain(); amp.gain.value = 0;
    out.gain.value = 0.001;

    let t = t0, total = 0;
    const flaps = [];
    for(const ph of phonemes){
      const dur = ph.dur / P.rate;
      const [f1,f2,f3] = ph.formants;
      F[0].frequency.setTargetAtTime(f1*P.formant, t, 0.020);
      F[1].frequency.setTargetAtTime(f2*P.formant, t, 0.020);
      F[2].frequency.setTargetAtTime(f3*P.formant, t, 0.024);
      // Pitch contour: falls across a statement, lifts on a question.
      const prog = total;
      const bend = 1 + (ph.stress?0.06:0) - prog*0.00035;
      osc.frequency.setTargetAtTime(P.pitch*bend, t, 0.05);
      const lvl = ph.voiced ? (ph.stress?0.34:0.24) : 0.09;
      out.gain.setTargetAtTime(lvl, t, 0.012);
      if(ph.silent) out.gain.setTargetAtTime(0.001, t, 0.010);
      flaps.push({t: t-t0, open: ph.open});
      t += dur; total += dur;
    }
    out.gain.setTargetAtTime(0.0001, t, 0.05);
    osc.start(t0); breath.start(t0);
    osc.stop(t+0.35); breath.stop(t+0.35);
    vib.start(t0); vib.stop(t+0.35);

    // Duck the music while anyone is speaking.
    this.duck.gain.setTargetAtTime(0.34, t0, 0.08);
    this.duck.gain.setTargetAtTime(1.0, t+0.05, 0.4);

    const dur = t - t0;
    const handle = { dur, flaps, start:performance.now()/1000, active:true,
                     panner:pannerNode, follow:follow||null };
    if(pannerNode && follow){
      handle.until = this.now() + dur + 0.2;
      this.spatial.push(handle);
    }
    if(onMouth){
      handle.timer = setInterval(()=>{
        const el = performance.now()/1000 - handle.start;
        if(el > dur){ onMouth(0); clearInterval(handle.timer); handle.active=false;
                      onDone && onDone(); return; }
        let open = 0;
        for(const f of flaps){ if(f.t <= el) open = f.open; else break; }
        // Add a little jitter so the jaw isn't a metronome.
        onMouth(open*(0.82+Math.random()*0.28));
      }, 33);
    } else {
      setTimeout(()=>{ handle.active=false; onDone && onDone(); }, dur*1000);
    }
    return handle;
  }
}

/* Crude but effective phonemiser: maps letters to formant targets and a jaw
   opening. Good enough to sell a mouth moving to speech, which is all it has
   to do (§10, §16). */
const PHONEME_TABLE = {
  a:[730,1090,2440,0.85], e:[530,1840,2480,0.55], i:[270,2290,3010,0.32],
  o:[570, 840,2410,0.72], u:[300, 870,2240,0.38], y:[300,2100,2900,0.34],
  m:[280, 900,2200,0.10], n:[280,1700,2600,0.14], ng:[280,1400,2400,0.12],
  l:[360,1300,2600,0.28], r:[420,1300,1600,0.30], w:[300, 610,2200,0.24],
  s:[400,1800,4200,0.12], z:[400,1700,3800,0.14], sh:[400,2100,3200,0.16],
  f:[400,1100,2400,0.14], v:[400,1200,2400,0.16], th:[400,1400,2600,0.16],
  t:[400,1700,3000,0.20], d:[400,1600,2600,0.22], k:[400,1900,2700,0.22],
  g:[400,1500,2400,0.24], p:[400, 900,2200,0.18], b:[400, 900,2100,0.20],
  h:[500,1500,2500,0.30], j:[350,2000,3000,0.20], c:[400,1800,3000,0.20],
  q:[400,1900,2700,0.22], x:[400,1800,3600,0.16],
};
const VOWELS = 'aeiouy';
function phonemise(text){
  const out=[];
  const clean = text.toLowerCase();
  for(let i=0;i<clean.length;i++){
    const ch = clean[i];
    if(ch===' '){ out.push({formants:[400,1200,2400], dur:0.045, voiced:false,
                            open:0.05, silent:false}); continue; }
    if('.,!?;:—-'.includes(ch)){
      out.push({formants:[400,1200,2400], dur:ch==='.'||ch==='?'||ch==='!'?0.20:0.10,
                voiced:false, open:0.02, silent:true});
      continue;
    }
    const e = PHONEME_TABLE[ch];
    if(!e) continue;
    const vowel = VOWELS.includes(ch);
    out.push({
      formants:[e[0],e[1],e[2]],
      dur: vowel ? 0.086 : 0.052,
      voiced: vowel || 'mnlrwvzbdgj'.includes(ch),
      open: e[3],
      stress: vowel && (i===0 || clean[i-1]===' '),
      silent:false,
    });
  }
  if(!out.length) out.push({formants:[500,1500,2500],dur:0.12,voiced:true,open:0.4});
  return out;
}

/* Voice profiles — one per character, distinct in pitch, formant shift,
   cadence, breathiness and a signature tic (§16). */
const VOICE = {
  jarrad_act1: { pitch: 96,  formant:0.96, rate:0.88, breath:0.30, rasp:0.30, vibrato:0.004 },
  jarrad_act5: { pitch: 108, formant:1.00, rate:1.02, breath:0.10, rasp:0.10, vibrato:0.010 },
  /* Ollie: warm mid-register with a slight vocoder edge, distinct from every
     human in the game (§6). */
  ollie:       { pitch: 148, formant:1.14, rate:1.06, breath:0.14, rasp:0.05,
                 vibrato:0.016, vocoder:1 },
  conway:      { pitch: 196, formant:1.10, rate:1.00, breath:0.16, rasp:0.02, vibrato:0.014 },
  pudmenzky:   { pitch: 84,  formant:0.90, rate:0.78, breath:0.36, rasp:0.55, vibrato:0.006 },
  mcroberts:   { pitch: 92,  formant:0.94, rate:0.86, breath:0.12, rasp:0.24, vibrato:0.005 },
  rennick:     { pitch: 116, formant:1.02, rate:0.82, breath:0.04, rasp:0.00, vibrato:0.003 },
};

/* ==========================================================================
   SCORE
   Rewritten. The old cue was one four-bar loop of plucks over a sawtooth pad
   with a noise snare on top, which is why it wore out inside a minute and
   scraped at the ears.

   Now there are six authored pieces, each with its own key, tempo, harmonic
   plan and instrumentation, and the score cross-fades between them over eight
   seconds. Exploration rotates through three of them so the same music never
   plays for more than a few minutes at a stretch.

   Everything is voiced softly: sine and triangle sources, slow attacks, and
   every part filtered before it reaches the bus. Nothing in here is a raw
   sawtooth and nothing is a burst of white noise.
   ========================================================================== */

/* Scale degrees are semitones from the tonic. Melodies are written as
   [degree, beats]; null is a rest. */
const TRACKS = {
  /* --- Exploration ---------------------------------------------------- */
  open_country: {
    bpm: 62, key: -3, feel: 'wide',
    prog: [[0,7,12],[-5,2,7],[-4,3,8],[-5,2,7]],
    bars: 4, lead: 'harmonica', leadEvery: 2,
    melody: [[12,3],[10,1],[7,4],[8,3],[7,1],[3,4],[5,2],[7,2],[3,6],[null,2]],
    pluck: 0.30, pad: 0.055, bass: 0.10, air: 0.9,
  },
  long_road: {
    bpm: 72, key: 0, feel: 'walking',
    prog: [[0,3,7],[-4,0,3],[5,8,12],[-2,3,7]],
    bars: 4, lead: 'guitar', leadEvery: 2,
    melody: [[0,2],[3,1],[5,1],[7,4],[5,2],[3,2],[2,4],[0,2],[-2,2],[0,4]],
    pluck: 0.34, pad: 0.045, bass: 0.13, air: 0.55,
  },
  high_ground: {
    bpm: 54, key: 2, feel: 'still',
    prog: [[0,7,14],[-5,0,7],[2,9,14],[-3,4,9]],
    bars: 4, lead: 'fiddle', leadEvery: 3,
    melody: [[7,6],[9,2],[12,6],[10,2],[7,4],[5,4],[3,8]],
    pluck: 0.16, pad: 0.075, bass: 0.07, air: 1.0,
  },
  /* --- Situational ------------------------------------------------------ */
  town: {
    bpm: 88, key: 0, feel: 'warm',
    prog: [[0,4,7],[5,9,12],[-3,2,7],[-5,0,4]],
    bars: 4, lead: 'guitar', leadEvery: 1,
    melody: [[7,1],[9,1],[12,2],[9,1],[7,1],[4,2],[5,1],[7,1],[9,2],[7,4]],
    pluck: 0.40, pad: 0.030, bass: 0.16, air: 0.30, swing: 0.14,
  },
  tension: {
    bpm: 78, key: -3, feel: 'low',
    prog: [[0,3,7],[0,3,8],[-2,1,5],[0,3,7]],
    bars: 4, lead: null, leadEvery: 0,
    melody: null,
    pluck: 0.12, pad: 0.085, bass: 0.22, air: 0.45, pulse: true,
  },
  negotiation: {
    bpm: 66, key: -1, feel: 'close',
    prog: [[0,3,7],[-1,3,6],[0,3,7],[-2,2,5]],
    bars: 4, lead: null, leadEvery: 0,
    melody: null,
    pluck: 0.10, pad: 0.070, bass: 0.09, air: 0.20, clock: true,
  },
};

/* Which pieces may play in each situation. Exploration has three so the road
   never sounds the same for long. */
const STATE_TRACKS = {
  explore: ['open_country','long_road','high_ground'],
  town:    ['town'],
  tension: ['tension'],
  negotiation: ['negotiation'],
  combat:  ['tension'],
};

class Score {
  constructor(audio){
    this.A = audio;
    this.ctx = audio.ctx;
    this.enabled = true;
    this.state = 'explore';

    /* A gentle shelf across the whole score, plus a slow limiter. Music should
       sit under the world, not in front of it. */
    const c = this.ctx;
    this.tone = c.createBiquadFilter();
    this.tone.type = 'lowpass'; this.tone.frequency.value = 3400;
    this.tone.Q.value = 0.4;
    this.soft = c.createDynamicsCompressor();
    this.soft.threshold.value = -26; this.soft.knee.value = 22;
    this.soft.ratio.value = 3; this.soft.attack.value = 0.15;
    this.soft.release.value = 0.6;
    this.tone.connect(this.soft).connect(audio.musicBus);

    /* Two decks, so one piece can fade out while the next fades in. */
    this.deck = [this._makeDeck(), this._makeDeck()];
    this.active = 0;
    this.deck[0].name = 'open_country';
    this.deck[0].gain.gain.value = 0.0;
    this.deck[0].target = 1;

    this.beat = 0;
    this.nextTime = 0;
    this.rotateIn = 150 + Math.random()*90;
    this.since = 0;
  }

  _makeDeck(){
    const g = this.ctx.createGain();
    g.gain.value = 0;
    g.connect(this.tone);
    return { gain:g, name:null, target:0, beat:0 };
  }

  /* ---- State ------------------------------------------------------------ */
  setState(s){
    if(this.state === s) return;
    this.state = s;
    const pool = STATE_TRACKS[s] || STATE_TRACKS.explore;
    this._crossfadeTo(pool[(Math.random()*pool.length)|0]);
  }
  _crossfadeTo(name){
    const cur = this.deck[this.active];
    if(cur.name === name) return;
    const nxt = this.deck[1-this.active];
    nxt.name = name; nxt.beat = 0; nxt.target = 1;
    cur.target = 0;
    this.active = 1-this.active;
    this.since = 0;
    this.rotateIn = 150 + Math.random()*120;
  }
  setKey(){ /* the pieces carry their own keys now */ }

  note(semi, key){ return 146.83 * Math.pow(2, (semi + key)/12); }

  update(dt){
    if(!this.enabled || !this.ctx) return;
    const t = this.A.now();
    this.since += dt;

    /* Eight-second cross-fades: long enough that you notice the music has
       changed only after it has. */
    for(const d of this.deck)
      d.gain.gain.setTargetAtTime(d.target*0.85, t, 2.6);

    // Rotate exploration pieces so the road music keeps moving.
    if(this.state === 'explore' && this.since > this.rotateIn){
      const pool = STATE_TRACKS.explore.filter(n=>n !== this.deck[this.active].name);
      this._crossfadeTo(pool[(Math.random()*pool.length)|0]);
    }

    const track = TRACKS[this.deck[this.active].name] || TRACKS.open_country;
    const spb = 60/track.bpm;
    if(this.nextTime === 0) this.nextTime = t + 0.3;
    if(this.nextTime < t - 0.12){
      this.beat += Math.max(0, Math.round((t-this.nextTime)/spb));
      this.nextTime = t + 0.08;
    }
    let guard = 0;
    while(this.nextTime < t + spb*2 && guard++ < 8){
      // Both decks are scheduled while they are audible, so a cross-fade is a
      // real overlap of two pieces rather than a cut.
      for(const d of this.deck){
        if(d.gain.gain.value < 0.004 && d.target === 0) continue;
        const tr = TRACKS[d.name];
        if(tr) this._bar(tr, d, this.nextTime, d.beat++);
      }
      this.nextTime += spb;
      this.beat++;
    }
  }

  /* ---- One beat of one piece -------------------------------------------- */
  _bar(tr, deck, t, beat){
    const spb = 60/tr.bpm;
    const inBar = beat % 4;
    const bar = Math.floor(beat/4) % tr.bars;
    const phrase = Math.floor(beat/(4*tr.bars));
    const chord = tr.prog[bar];
    const out = deck.gain;
    const key = tr.key;

    /* Pad: the bed. Slow attack, heavily filtered, never louder than a
       whisper. Enters on the downbeat of each bar and holds. */
    if(inBar === 0 && tr.pad > 0)
      this._pad(t, spb*4.4, chord, out, tr.pad, key, tr.air);

    /* Bass: root on one, fifth on three. Sine only. */
    if(tr.bass > 0){
      if(inBar === 0) this._bass(t, this.note(chord[0]-24, key), spb*1.8, out, tr.bass);
      else if(inBar === 2) this._bass(t, this.note(chord[1]-24, key), spb*1.2, out, tr.bass*0.7);
    }

    /* Guitar: a soft, damped arpeggio rather than a strum on every beat. */
    if(tr.pluck > 0){
      const sw = (tr.swing || 0)*spb;
      if(inBar === 0) this._pluck(this.note(chord[0]-12,key), 2.6, out, tr.pluck, t);
      if(inBar === 1) this._pluck(this.note(chord[1],key), 2.0, out, tr.pluck*0.6, t+sw);
      if(inBar === 2) this._pluck(this.note(chord[2],key), 2.2, out, tr.pluck*0.75, t);
      if(inBar === 3 && (phrase%2===0))
        this._pluck(this.note(chord[1]+12,key), 1.6, out, tr.pluck*0.45, t+sw);
    }

    /* Lead: only on some phrases, so the melody is an event. */
    if(tr.melody && tr.leadEvery && phrase % tr.leadEvery === 0 && beat % (4*tr.bars) === 0)
      this._melody(tr, out, t, key);

    /* Tension: a slow heartbeat under everything. */
    if(tr.pulse && inBar % 2 === 0)
      this._heart(t, out, 0.10);

    /* Negotiation: the ticking clock, but soft — a woodblock, not a click. */
    if(tr.clock){
      this._tick(t, out, 0.020);
      this._tick(t + spb*0.5, out, 0.010);
    }
  }

  /* ---- Voices ------------------------------------------------------------
     All of these are deliberately dull sources through gentle filters. A
     bright source in a game score is fatiguing within about two minutes. */
  _pad(t, dur, chord, out, level, key, air){
    const c = this.ctx;
    const bus = c.createGain(); bus.gain.value = 1; bus.connect(out);
    const lp = c.createBiquadFilter();
    lp.type='lowpass'; lp.Q.value = 0.6;
    lp.frequency.setValueAtTime(320, t);
    lp.frequency.linearRampToValueAtTime(760, t+dur*0.45);
    lp.frequency.linearRampToValueAtTime(300, t+dur);
    lp.connect(bus);
    for(let i=0;i<chord.length;i++){
      const s = chord[i];
      for(const [oct, amp] of [[-12, 1.0], [0, 0.55]]){
        const o = c.createOscillator();
        o.type = i===0 ? 'sine' : 'triangle';
        o.frequency.value = this.note(s+oct, key);
        o.detune.value = (Math.random()-0.5)*7;
        const g = c.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(level*amp, t+dur*0.38);   // slow swell
        g.gain.setValueAtTime(level*amp, t+dur*0.62);
        g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
        o.connect(g).connect(lp);
        o.start(t); o.stop(t+dur+0.1);
      }
    }
    // A breath of air over the top, filtered almost to nothing.
    if(air > 0){
      const n = c.createBufferSource();
      n.buffer = this.A.noiseBuffer(dur+0.2, 'pink');
      const bp = c.createBiquadFilter();
      bp.type='bandpass'; bp.frequency.value = 900; bp.Q.value = 0.7;
      const g = c.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(level*air*0.16, t+dur*0.4);
      g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
      n.connect(bp).connect(g).connect(bus);
      n.start(t); n.stop(t+dur);
    }
  }

  _pluck(freq, dur, out, level, t){
    const c = this.ctx;
    const lp = c.createBiquadFilter();
    lp.type='lowpass'; lp.frequency.value = Math.min(2600, freq*5.5); lp.Q.value=0.5;
    lp.connect(out);
    // Nylon-string damping and a low cutoff: warm, and it decays out of the way.
    this.A.pluck(freq, dur, lp, 0.22, level, Math.max(t, this.A.now()));
  }

  _bass(t, freq, dur, out, level){
    const c = this.ctx;
    const o = c.createOscillator(); o.type='sine'; o.frequency.value = freq;
    const lp = c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 380;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(level, t+0.06);      // no click
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(lp).connect(g).connect(out);
    o.start(t); o.stop(t+dur+0.05);
  }

  _melody(tr, out, t0, key){
    const spb = 60/tr.bpm;
    let t = t0;
    for(const [deg, beats] of tr.melody){
      const dur = beats*spb;
      if(deg !== null){
        const f = this.note(deg, key);
        if(tr.lead === 'harmonica') this._reed(f, t, dur*0.92, out, 0.075);
        else if(tr.lead === 'fiddle') this.A.bow(f, t, dur*0.92, out, 0.070);
        else this._pluck(f, dur*1.3, out, 0.22, t);
      }
      t += dur;
    }
  }

  /* A softened harmonica: the same idea as the sfx reed but with the upper
     partials rolled off so it sits in the mix instead of on top of it. */
  _reed(freq, t, dur, out, level){
    const c = this.ctx;
    const lp = c.createBiquadFilter();
    lp.type='lowpass'; lp.frequency.value = freq*3.6; lp.Q.value = 0.7;
    const g = c.createGain(); g.gain.value = 0;
    lp.connect(g).connect(out);
    for(const [mult, amp] of [[1,1],[2,0.30],[3,0.10]]){
      const o = c.createOscillator(); o.type='triangle';
      o.frequency.value = freq*mult;
      o.detune.value = (Math.random()-0.5)*9;
      const og = c.createGain(); og.gain.value = amp*0.5;
      o.connect(og).connect(lp);
      o.start(t); o.stop(t+dur+0.06);
    }
    const vib = c.createOscillator(); vib.frequency.value = 4.6;
    const vg = c.createGain();
    vg.gain.setValueAtTime(0, t);
    vg.gain.linearRampToValueAtTime(freq*0.008, t+dur*0.5);
    vib.connect(vg); vib.start(t); vib.stop(t+dur+0.06);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(level, t+0.10);      // breathy attack
    g.gain.setValueAtTime(level, t+dur*0.70);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  }

  _heart(t, out, level){
    const c = this.ctx;
    const o = c.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(72, t);
    o.frequency.exponentialRampToValueAtTime(44, t+0.30);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(level, t+0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.42);
    o.connect(g).connect(out); o.start(t); o.stop(t+0.5);
  }

  _tick(t, out, level){
    const c = this.ctx;
    const o = c.createOscillator(); o.type='sine'; o.frequency.value = 1180;
    const bp = c.createBiquadFilter(); bp.type='bandpass';
    bp.frequency.value = 1180; bp.Q.value = 6;
    const g = c.createGain();
    g.gain.setValueAtTime(level, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.085);
    o.connect(bp).connect(g).connect(out); o.start(t); o.stop(t+0.12);
  }

  /* The main theme, stated in full at the three moments that matter (§16). */
  playTheme(instrument='harmonica', level=1){
    if(!this.ctx) return 0;
    const THEME = [[0,1],[3,1],[7,2],[5,1],[3,1],[2,2],
                   [0,1],[3,1],[7,1],[10,1],[12,3],[null,1],
                   [10,1],[8,1],[7,2],[5,1],[3,1],[5,2],
                   [3,1],[2,1],[0,4],[null,2]];
    const PROG = [[0,3,7],[-2,2,5],[3,7,10],[-5,-1,2]];
    const bpm = 60, spb = 60/bpm, key = 0;
    let t = this.A.now()+0.2, bar = 0, beats = 0;
    const g = this.ctx.createGain(); g.gain.value = level*0.9;
    g.connect(this.tone);
    for(const [deg, b] of THEME){
      const dur = b*spb;
      if(deg !== null){
        const f = this.note(deg+12, key);
        if(instrument === 'harmonica') this._reed(f, t, dur*0.92, g, 0.085);
        else if(instrument === 'fiddle') this.A.bow(f, t, dur*0.92, g, 0.085);
        else this._pluck(f, dur*1.2, g, 0.26, t);
      }
      if(beats % 4 === 0){ this._pad(t, spb*4.2, PROG[bar%4], g, 0.055, key, 0.7); bar++; }
      t += dur; beats += b;
    }
    return t - this.A.now();
  }
}
/* ==========================================================================
   UI
   Diegetic-first. Health and stamina as thin arcs that fade out when full,
   a compass strip that can be turned off, and no floating icons (§17).
   ========================================================================== */
class UI {
  constructor(){
    this.vitals = document.getElementById('vitals');
    this.vctx = this.vitals.getContext('2d');
    this.compass = document.querySelector('#compass canvas');
    this.cctx = this.compass.getContext('2d');
    this.clock = document.getElementById('clock');
    this.subs = document.getElementById('subs');
    this.subWho = this.subs.querySelector('.who');
    this.subLine = this.subs.querySelector('.line');
    this.prompts = document.getElementById('prompts');
    this.toastEl = document.getElementById('toast');
    this.hud = document.getElementById('hud');
    this.bars = document.getElementById('bars');
    this.veil = document.getElementById('veil');
    this.objectiveEl = document.getElementById('objective');
    this.titleEl = document.getElementById('titleCard');
    this.promptMap = new Map();
    this.subTimer = 0;
    this.showCompass = true;
    this.subScale = 1;
    this.idleFade = 0;
  }
  show(){ this.hud.classList.add('on'); }

  /* --- Vitals: two arcs, bottom-left, fading when full ------------------- */
  drawVitals(p, horse){
    const c=this.vctx, W=this.vitals.width, H=this.vitals.height;
    c.clearRect(0,0,W,H);
    const cx=W*0.30, cy=H*0.72;
    const arc=(r, from, to, frac, col, width, glow)=>{
      c.lineCap='round';
      c.strokeStyle='rgba(18,14,10,0.55)'; c.lineWidth=width+3;
      c.beginPath(); c.arc(cx,cy,r,from,to); c.stroke();
      if(frac<=0) return;
      c.strokeStyle=col; c.lineWidth=width;
      if(glow){ c.shadowColor=col; c.shadowBlur=10; }
      c.beginPath(); c.arc(cx,cy,r,from,from+(to-from)*frac); c.stroke();
      c.shadowBlur=0;
    };
    const A0=-Math.PI*0.92, A1=-Math.PI*0.10;
    arc(78, A0, A1, p.health/p.healthMax, '#d8cbb0', 6, false);
    arc(64, A0, A1, p.stamina/p.staminaMax, '#00A3A6', 5, false);
    // Composure is the signature stat — it gets the Yes Yellow (§5.3).
    arc(50, A0, A1, p.composure/p.composureMax, '#FFD600', 5, p.composure<40);
    if(horse){
      arc(94, A0+0.16, A1-0.62, horse.stamina/horse.staminaMax,
          'rgba(255,214,0,0.55)', 3, false);
    }
    const full = p.health>=p.healthMax-0.5 && p.stamina>=p.staminaMax-0.5
              && p.composure>=p.composureMax-0.5;
    this.vitals.classList.toggle('idle', full);
  }

  /* --- Compass strip ---------------------------------------------------- */
  drawCompass(yaw){
    this.compass.parentElement.style.display = this.showCompass ? '' : 'none';
    if(!this.showCompass) return;
    const c=this.cctx, W=this.compass.width, H=this.compass.height;
    c.clearRect(0,0,W,H);
    const PPR = W/(Math.PI*1.35);        // pixels per radian shown
    const marks = [['N',0],['NE',Math.PI/4],['E',Math.PI/2],['SE',3*Math.PI/4],
                   ['S',Math.PI],['SW',-3*Math.PI/4],['W',-Math.PI/2],['NW',-Math.PI/4]];
    c.textAlign='center'; c.textBaseline='middle';
    for(const [label, ang] of marks){
      let d = M.angDelta(yaw, ang);
      const x = W/2 + d*PPR;
      if(x<-40||x>W+40) continue;
      const near = 1-Math.min(1, Math.abs(d)/1.2);
      c.globalAlpha = 0.35+near*0.55;
      c.fillStyle = (label==='N') ? '#FFD600' : '#e2d7bc';
      c.font = `${label.length>1?15:19}px "Bookman Old Style", Georgia, serif`;
      c.fillText(label, x, H*0.52);
    }
    // Minor ticks every 15°.
    for(let a=-180;a<180;a+=15){
      const ang = a*Math.PI/180;
      let d = M.angDelta(yaw, ang);
      const x = W/2 + d*PPR;
      if(x<0||x>W) continue;
      c.globalAlpha=0.22; c.fillStyle='#cbbb96';
      c.fillRect(x-0.5, H*0.86, 1, 6);
    }
    /* Objective bearing — the one the story is pointing you at. */
    if(this.objectiveBearing !== null && this.objectiveBearing !== undefined){
      const d = M.angDelta(yaw, this.objectiveBearing);
      const x = W/2 + d*PPR;
      if(x>-20 && x<W+20){
        c.globalAlpha = 1;
        c.fillStyle = '#FFD600';
        c.beginPath();
        c.moveTo(x, H*0.08); c.lineTo(x-6, H*0.36); c.lineTo(x+6, H*0.36);
        c.closePath(); c.fill();
      }
    }
    /* Waypoint bearing, if one is set. */
    if(this.waypointBearing !== null && this.waypointBearing !== undefined){
      const d = M.angDelta(yaw, this.waypointBearing);
      const x = W/2 + d*PPR;
      if(x>-20 && x<W+20){
        c.globalAlpha = 0.95;
        c.fillStyle = '#00A3A6';
        c.beginPath();
        c.moveTo(x, H*0.10); c.lineTo(x-5, H*0.32); c.lineTo(x+5, H*0.32);
        c.closePath(); c.fill();
      }
    }
    c.globalAlpha=1;
    c.fillStyle='#FFD600';
    c.fillRect(W/2-1, 2, 2, 9);
  }

  /* --- Subtitles -------------------------------------------------------- */
  say(who, line, dur, cls=''){
    this.subWho.textContent = who;
    this.subWho.className = 'who ' + cls;
    this.subLine.textContent = line;
    this.subs.classList.add('on');
    this.subs.style.fontSize = '';
    this.subs.style.transform = `translateX(-50%) scale(${this.subScale})`;
    this.subTimer = dur || (1.4 + line.length*0.045);
  }
  updateSubs(dt){
    if(this.subTimer > 0){
      this.subTimer -= dt;
      if(this.subTimer <= 0) this.subs.classList.remove('on');
    }
  }

  /* --- Contextual prompts ------------------------------------------------ */
  setPrompt(id, key, label, on){
    let el = this.promptMap.get(id);
    if(on && !el){
      el = document.createElement('div'); el.className='prompt';
      el.innerHTML = `<span></span><b></b>`;
      this.prompts.appendChild(el);
      this.promptMap.set(id, el);
      requestAnimationFrame(()=>el.classList.add('on'));
    }
    if(!el) return;
    if(on){
      el.querySelector('span').textContent = label;
      el.querySelector('b').textContent = key;
      el.classList.add('on');
    } else {
      el.classList.remove('on');
      setTimeout(()=>{ if(!el.classList.contains('on') && el.parentNode){
        el.remove(); this.promptMap.delete(id); } }, 260);
    }
  }

  toast(title, sub, dur=3.2){
    this.toastEl.querySelector('.t').textContent = title;
    this.toastEl.querySelector('.s').textContent = sub||'';
    this.toastEl.classList.add('on');
    clearTimeout(this._toastT);
    this._toastT = setTimeout(()=>this.toastEl.classList.remove('on'), dur*1000);
  }

  setObjective(text){
    if(!this.objectiveEl) return;
    this.objectiveEl.innerHTML = text ? `<b>&#9670;</b>${text}` : '';
    this.objectiveEl.classList.toggle('on', !!text);
  }
  showTitle(on){ if(this.titleEl) this.titleEl.classList.toggle('on', !!on); }

  letterbox(on, pct=11){
    const h = on ? pct+'%' : '0';
    this.bars.querySelector('.t').style.height = h;
    this.bars.querySelector('.b').style.height = h;
  }
  fade(to, ms=600){
    this.veil.style.transition = `opacity ${ms}ms ease`;
    this.veil.style.opacity = to;
  }
}

/* ==========================================================================
   LEDGER MENU
   Styled as a leather-bound company ledger with real pages (§17).
   ========================================================================== */
class Ledger {
  constructor(game){
    this.game = game;
    this.el = document.getElementById('ledger');
    this.tabs = document.getElementById('ledgerTabs');
    this.page = document.getElementById('ledgerPage');
    this.open = false;
    this.current = 'Map';
    this.pages = ['Map','Missions','Compendium','Stats','Settings','Credits'];
    for(const p of this.pages){
      const b = document.createElement('button');
      b.textContent = p;
      b.onclick = ()=>{ this.current = p; this.render(); };
      this.tabs.appendChild(b);
    }
  }
  toggle(){ this.open ? this.close() : this.show(); }
  show(){
    this.open = true; this.el.classList.add('on');
    // Hand the mouse back so the ledger can actually be used.
    if(document.pointerLockElement) document.exitPointerLock();
    this.render();
  }
  close(){
    this.open = false; this.el.classList.remove('on');
    const dom = this.game.renderer && this.game.renderer.domElement;
    if(dom && dom.requestPointerLock) dom.requestPointerLock();
  }

  render(){
    [...this.tabs.children].forEach(b=>
      b.classList.toggle('sel', b.textContent===this.current));
    const g = this.game;
    const row = (a,b)=>`<div class="row"><span>${a}</span><span>${b}</span></div>`;
    let html = '';
    switch(this.current){
      case 'Map': {
        html = `<h2>The Frontier</h2><div class="sub">Surveyed by the Grand Meridian
          Telegraph &amp; Pastoral Company</div>`;
        html += `<canvas id="mapCanvas" width="640" height="640"
                  style="width:100%;aspect-ratio:1;display:block;border-radius:3px;
                  cursor:crosshair;margin:6px 0 10px"></canvas>`;
        html += row('Region', BIOME_NAMES[g.terrain.biomeAt(g.player.pos.x, g.player.pos.z)]);
        html += row('Position', `${g.player.pos.x.toFixed(0)} E, ${(-g.player.pos.z).toFixed(0)} N`);
        html += row('Surveyed', `${g.map.percent.toFixed(1)}% of the territory`);
        html += row('Settlements found',
          `${g.towns.list.filter(t=>g.discovered.has(t.name)).length} of ${g.towns.list.length}`);
        if(g.map.waypoint){
          const d = Math.hypot(g.map.waypoint.x-g.player.pos.x,
                               g.map.waypoint.z-g.player.pos.z);
          html += row('Waypoint', `${(d/1000).toFixed(2)} km — click it again to clear`);
        } else {
          html += `<div class="hint">Scroll to zoom, drag to pan, double-click to
            reset. Click anywhere to set a waypoint — it shows on your compass in
            teal, with the current objective in yellow.</div>`;
        }
        break;
      }
      case 'Missions': {
        const st = g.story;
        html = `<h2>Contracts</h2><div class="sub">${st ? ACTS[st.act].card + ' — ' + ACTS[st.act].name : ''}</div>`;
        html += row('Current', g.objective || 'Ride into Yes Gulch');
        if(st){
          html += row('Reputation', Math.round(g.player.reputation) + ' of 100');
          html += row('Holdouts met', `${st.metCount||0} of 4`);
          html += `<h2 style="margin-top:14px">Journal</h2>`;
          const seen = st.log.slice(-8);
          for(const e of seen) html += `<div class="row"><span>${e}</span><span></span></div>`;
        }
        html += `<div class="hint">The negotiation call system and the remaining
          story missions build on this frame.</div>`;
        break;
      }
      case 'Compendium':
        html = `<h2>Compendium</h2><div class="sub">Filling in as you find things</div>`;
        html += `<h2 style="margin-top:2px">Regions</h2>`;
        for(const b of BIOME_NAMES)
          html += row(b, g.discovered.has(b) ? 'Visited' : '—');
        html += `<h2>Settlements</h2>`;
        for(const t of (g.towns ? g.towns.list : []))
          html += row(t.name, g.discovered.has(t.name) ? t.blurb : '—');
        html += `<h2>Ollie</h2>`;
        html += row('Bond', `${g.horse.bond.toFixed(1)} of 4`);
        break;
      case 'Stats':
        html = `<h2>Jarrad Gaunt</h2><div class="sub">Sales manager, unemployed</div>`;
        html += row('Health', Math.round(g.player.health));
        html += row('Stamina', Math.round(g.player.stamina));
        html += row('Composure', Math.round(g.player.composure));
        html += row('Reputation', Math.round(g.player.reputation));
        html += row('Ollie — bond', g.horse.bond.toFixed(2));
        html += row('Ollie — condition', `${Math.round((1-g.horse.dirt)*100)}% clean`);
        html += row('Time', g.tod.clockString() + `, day ${g.tod.day+1}`);
        html += row('Weather', g.weather.state);
        break;
      case 'Settings': {
        const q = QUALITY[g.quality];
        html = `<h2>Settings</h2><div class="sub">Everything here takes effect immediately</div>`;
        html += `<label>Quality<select id="setQ">${QUALITY.map((x,i)=>
          `<option value="${i}" ${i===g.quality?'selected':''}>${x.name}</option>`).join('')}
          </select></label>`;
        html += `<label>Adaptive quality<select id="setAdaptive">
          <option value="1" ${g.adaptive?'selected':''}>On</option>

        html += `<label>Mouse sensitivity<input type="range" id="setSens" min="0.2"

        html += `<label>Camera shake<input type="range" id="setShake" min="0"

          <option value="1" ${g.composer.enabled?'selected':''}>On</option>

          </select></label>`;
        html += `<label>Film grain<input type="range" id="setGrain" min="0" max="1.6"
          step="0.05" value="${g.composer.opts.grain}"></label>`;
        html += `<label>Time of day<input type="range" id="setHour" min="0" max="23.9"
          step="0.1" value="${g.tod.hour.toFixed(1)}"></label>`;
        html += `<label>Master volume<input type="range" id="setVol" min="0" max="1"
          step="0.02" value="${CFG.MASTER_GAIN}"></label>`;
        html += `<div class="hint">Hold-vs-toggle bindings and colourblind marker
