  }
  return mergeParts(parts);
}

/* ==========================================================================
   NPC
   ========================================================================== */
class NPC {
  constructor(opts){
    const { terrain, variant, palette, hat, scale, name, voice, lines,
            home, facing, scene, lib, colliders } = opts;
    this.terrain = terrain;
    this.colliders = colliders;
    this.name = name; this.voice = voice || 'conway';
    this.lines = lines || null;
    this.named = !!lines;

    const rig = makeSkeleton(boneDefFromWorld(JARRAD_BONES));
    this.rig = rig;
    const P = NPC_PALETTES[palette % NPC_PALETTES.length];
    const S=(t,col)=> new THREE.MeshStandardMaterial({
      map:t.map, roughnessMap:t.roughnessMap, normalMap:t.normalMap,
      color:col, roughness:1, metalness:0 });
    this.mats = [
      S(lib.cloth_coat,  P.coat),
      S(lib.cloth_shirt, P.shirt),
      S(lib.skin_pale,   P.skin),
      S(lib.leather_boot,0xffffff),
      S(lib.cloth_coat,  P.hat),
    ];
    this.outfit = variant.outfit;
    this.mesh = new THREE.SkinnedMesh(variant.geo, this.mats);
    this.mesh.castShadow = true; this.mesh.receiveShadow = true;
    this.mesh.frustumCulled = false;
    this.mesh.add(rig.root);
    this.mesh.updateMatrixWorld(true);
    this.mesh.bind(rig.skeleton);

    if(hat){
      const hatMesh = new THREE.Mesh(makeHat(hat),
        new THREE.MeshStandardMaterial({ map:lib.cloth_coat.map, color:P.hat,
          roughness:1 }));
      hatMesh.castShadow = true;
      rig.byName.head.add(hatMesh);
    }

    this.object = new THREE.Group();
    this.object.add(this.mesh);
    if(this.named){
      this.marker = makeNameMarker(name);
      this.marker.position.set(0, 2.05, 0);
      this.object.add(this.marker);
    }
    this.object.scale.setScalar(scale || 1);
    scene.add(this.object);

    this.anim = new Animator(rig);
    buildPlayerClips(this.anim);       // the whole player library, free
    this.anim.play('idle', 0);
    this.anim.setAdditive('breathe', 1.0);
    this.anim.time = Math.random()*4;  // desynchronise the crowd

    this.home = home.clone();
    this.pos = home.clone();
    this.pos.y = terrain.heightAt(this.pos.x, this.pos.z);
    this.yaw = facing || 0;
    this.speed = 0;
    this.target = null;
    this.waitT = 1 + Math.random()*8;
    this.route = [];
    this.spokenT = 0;
    this.active = true;
    this.trade = opts.trade || null;
    this._said = new Set();
    this.object.position.copy(this.pos);
    this.object.rotation.y = this.yaw;
  }

  setRoute(points){ this.route = points; }

  /* Simple daily rhythm: out and about by day, drifting home after dark. */
  fixedUpdate(dt, hour, playerPos){
    if(this.inScene){ this.speed = 0; return; }
    const dayTime = hour > 6.5 && hour < 20.5;

    if(this.waitT > 0 && !this.target){
      this.waitT -= dt;
      if(this.waitT <= 0){
        if(!dayTime || Math.random() < 0.3){
          this.target = this.home.clone();
        } else if(this.route.length){
          this.target = this.route[(Math.random()*this.route.length)|0].clone();
        } else {
          const a = Math.random()*Math.PI*2, r = 3 + Math.random()*9;
          this.target = this.home.clone().add(
            new THREE.Vector3(Math.cos(a)*r, 0, Math.sin(a)*r));
        }
      }
    }

    let want = 0;
    if(this.target){
      const d = new THREE.Vector3().subVectors(this.target, this.pos); d.y=0;
      const dist = d.length();
      if(dist < 0.7){
        this.target = null;
        this.waitT = dayTime ? (3 + Math.random()*14) : (10 + Math.random()*30);
      } else {
        this.yaw = M.angDamp(this.yaw, Math.atan2(d.x,d.z), 5.0, dt);
        want = dist > 3 ? CFG.SPD_WALK*M.range(Math.random, 0.72, 1.0) : CFG.SPD_WALK*0.55;
      }
    }
    /* Stand aside when the player rides straight at them. */
    const dp = Math.hypot(playerPos.x-this.pos.x, playerPos.z-this.pos.z);
    if(dp < 2.2){
      const away = new THREE.Vector3(this.pos.x-playerPos.x, 0, this.pos.z-playerPos.z);
      if(away.lengthSq() > 0.01){
        away.normalize();
        this.pos.addScaledVector(away, dt*1.6);
      }
    }

    this.speed = M.damp(this.speed, want, 6, dt);
    if(this.speed > 0.05){
      this.pos.x += Math.sin(this.yaw)*this.speed*dt;
      this.pos.z += Math.cos(this.yaw)*this.speed*dt;
    }
    // Townsfolk respect the same walls the player does.
    if(this.colliders){
      if(this.colliders.resolve(this.pos, 0.30, 1.7)) this.target = null;
      let g = this.terrain.heightAt(this.pos.x, this.pos.z);
      const deck = this.colliders.support(this.pos.x, this.pos.z, this.pos.y, 0.30);
      if(deck > g) g = deck;
      this.pos.y = M.damp(this.pos.y, g, 14, dt);
    } else {
      this.pos.y = M.damp(this.pos.y, this.terrain.heightAt(this.pos.x,this.pos.z), 14, dt);
    }
    this.object.position.copy(this.pos);
    this.object.rotation.y = this.yaw;

    if(this.spokenT > 0) this.spokenT -= dt;
  }

  update(dt, lookTarget){
    if(this.marker){
      // A slow bob, so the eye catches it without it being a beacon.
      this._mt = (this._mt||Math.random()*6) + dt;
      this.marker.position.y = 2.05 + Math.sin(this._mt*1.6)*0.075;
    }
    if(this.speed < 0.2){
      this.anim.play('idle', 0.4);
      this.anim.speed = 1;
    } else {
      const gs = this.anim.clips.walk.groundSpeed;
      this.anim.play('walk', 0.28);
      this.anim.speed = M.clamp(this.speed/gs, 0.6, 1.4);
    }
    this.anim.update(dt);
    // Mouth follows the voice envelope, the same way Ollie's does.
    if(this.mouthOpen) this.rig.byName.jaw.rotation.x += this.mouthOpen*0.34;
    if(lookTarget){
      this.object.updateMatrixWorld(true);
      IK.look(this.rig.byName.head, lookTarget, 0.24, 0.55, PLAYER_HEAD_FWD);
    }
    this.rig.root.updateMatrixWorld(true);
  }

  /* Freeze distant townsfolk: pose stays put, no clip evaluation, no IK. */
  setActive(on){ this.active = on; this.object.visible = on; }
}

/* ==========================================================================
   NPC MANAGER
   ========================================================================== */
class Townsfolk {
  constructor(terrain, lib, scene, colliders){
    this.terrain = terrain; this.lib = lib; this.scene = scene;
    this.colliders = colliders;
    this.variants = [];
    for(let i=0;i<OUTFITS.length;i++) this.variants.push(buildTownsfolkVariant(lib, i));
    this.byTown = new Map();
    this.all = [];
    this.onSpeak = null;
    this._greetT = 0;
  }

  populate(town, group){
    const rnd = M.rng(town.key.length*3301 + Math.floor(town.z));
    const spots = group.userData.npcSpots || [];
    const street = group.userData.street;
    const route = [];
    if(street){
      for(let i=0;i<6;i++){
        const t = i/5;
        route.push(new THREE.Vector3(
          M.lerp(street.start.x, street.end.x, t), 0,
          M.lerp(street.start.z, street.end.z, t)));
      }
    }
    const list = [];
    // Capped: every resident is five draw calls, and a crowd is not the point.
    const count = Math.min(spots.length, 16, 6 + Math.round(town.size*0.55));

    for(let i=0;i<count;i++){
      const spot = spots[i % spots.length];
      const vi = Math.floor(rnd()*this.variants.length);
      const variant = this.variants[vi];
      const hats = variant.outfit.hats;
      const hat = hats[Math.floor(rnd()*hats.length)];
      const npc = new NPC({
        terrain:this.terrain, lib:this.lib, scene:this.scene,
        colliders:this.colliders,
        variant, palette:Math.floor(rnd()*NPC_PALETTES.length),
        hat, scale: variant.skirt ? M.range(rnd,0.90,1.00) : M.range(rnd,0.93,1.09),
        name: variant.skirt ? 'TOWNSWOMAN' : 'TOWNSMAN',
        voice: variant.skirt ? 'conway' : (rnd()<0.5 ? 'mcroberts' : 'pudmenzky'),
        home: spot.pos.clone(), facing: spot.facing,
        trade: spot.kind,
      });
      npc.barks = TOWN_BARKS[town.character] || TOWN_BARKS.company;
      npc.setRoute(route);
      list.push(npc);
    }

    /* The town's named resident, standing outside the biggest building. */
    const named = NAMED.find(n=>n.town === town.key);
    if(named && spots.length){
      // Stand them outside the building they are associated with, so "speak to
      // the telegraph office" points at somebody who is actually there.
      const spot = spots.find(s=>s.kind === named.post) || spots[0];
      const npc = new NPC({
        terrain:this.terrain, lib:this.lib, scene:this.scene,
        colliders:this.colliders,
        variant:this.variants[named.palette % this.variants.length],
        palette:named.palette, hat:named.hat, scale:named.scale,
        name:named.name, voice:named.voice, lines:named.lines,
        home: spot.pos.clone().add(new THREE.Vector3(1.4,0,0)),
        facing: spot.facing, trade: named.post || spot.kind,
      });
      npc.id = named.id;
      npc.barks = named.lines;
      npc.setRoute([]);            // named residents keep their post
      npc.important = true;
      list.push(npc);
    }

    this.byTown.set(town.key, list);
    this.all.push(...list);
  }

  release(town){
    const list = this.byTown.get(town.key);
    if(!list) return;
    for(const npc of list){
      this.scene.remove(npc.object);
      npc.mats.forEach(m=>m.dispose());
      const i = this.all.indexOf(npc);
      if(i>=0) this.all.splice(i,1);
    }
    this.byTown.delete(town.key);
  }

  /* Weighted draw across three pools, skipping anything this person has said
     to you recently. Named characters always speak their own lines. */
  pickLine(npc){
    if(npc.lines && npc.lines.length){
      npc._li = ((npc._li|0)+1) % npc.lines.length;
      return npc.lines[npc._li];
    }
    const pool = [];
    const w = this.world || {};
    if(npc.trade && TRADE_BARKS[npc.trade]) pool.push(...TRADE_BARKS[npc.trade],
                                                      ...TRADE_BARKS[npc.trade]);
    if(npc.barks) pool.push(...npc.barks);
    const cond = [];
    if(w.hour !== undefined){
      if(w.hour > 5 && w.hour < 8)  cond.push(...CONDITION_BARKS.dawn);
      if(w.hour > 20 || w.hour < 5) cond.push(...CONDITION_BARKS.night);
      if(w.hour > 11 && w.hour < 15 && w.weather === 'clear')
        cond.push(...CONDITION_BARKS.hot);
    }
    if(w.weather === 'drizzle' || w.weather === 'downpour')
      cond.push(...CONDITION_BARKS.rain);
    if(w.weather === 'thunderstorm') cond.push(...CONDITION_BARKS.storm);
    if(w.weather === 'snow' || w.weather === 'blizzard')
      cond.push(...CONDITION_BARKS.snow);
    if(w.mounted) cond.push(...CONDITION_BARKS.mounted);
    if(w.reputation > 72) cond.push(...CONDITION_BARKS.reputationHigh);
    if(w.reputation < 28) cond.push(...CONDITION_BARKS.reputationLow);
    // Conditions get a third of the weight; they are seasoning, not the meal.
    for(let i=0;i<Math.ceil(pool.length/3) && cond.length;i++)
      pool.push(cond[i % cond.length]);
    if(!pool.length) return null;
    const fresh = pool.filter(l=>!npc._said.has(l));
    const list = fresh.length ? fresh : (npc._said.clear(), pool);
    const line = list[(Math.random()*list.length)|0];
    npc._said.add(line);
    return line;
  }

  fixedUpdate(dt, hour, playerPos){
    for(const npc of this.all){
      const d = Math.hypot(npc.pos.x-playerPos.x, npc.pos.z-playerPos.z);
      npc.setActive(d < CFG.NPC_DRAW_R);
      if(npc.marker){
        npc.marker.visible = d < 95;
        npc.marker.material.opacity = M.sat((95-d)/22) * M.sat((d-2.0)/2.0);
      }
      if(d < CFG.NPC_SIM_R) npc.fixedUpdate(dt, hour, playerPos);
    }
  }

  /* Cutscenes still need everyone posed, but nobody should start chatting
     over the top of a scripted scene. */
  updatePosesOnly(dt, playerEye){
    for(const npc of this.all){
      if(!npc.active) continue;
      npc.anim.freeze('idle', 1.35);
      npc.update(dt, null);
      if(npc.marker) npc.marker.visible = false;
    }
  }

  update(dt, playerEye, playerPos, ui, audio){
    this._greetT -= dt;
    for(const npc of this.all) if(npc.anim.frozen) npc.anim.unfreeze();
    let nearest = null, nd = 1e9;
    for(const npc of this.all){
      if(!npc.active) continue;
      const d = npc.pos.distanceTo(playerPos);
      npc.update(dt, d < 12 ? playerEye : null);
      if(d < nd){ nd = d; nearest = npc; }
    }
    /* Somebody says something when you walk past. Not everybody, not often,
       and what they say depends on who they are and what the day is doing. */
    if(nearest && nd < 5.0 && this._greetT <= 0 && nearest.spokenT <= 0){
      // A town is not a chorus. One unprompted remark every half-minute or so,
      // and the same person will not start again for a good few minutes.
      this._greetT = 26 + Math.random()*34;
      nearest.spokenT = 210;
      const line = this.pickLine(nearest);
      if(line && this.onSpeak) this.onSpeak(nearest, line);
    }
    return nearest && nd < 3.2 ? nearest : null;
  }
}
/* ==========================================================================
   THE MAP
   Drawn once at boot from the heightfield itself — every ridge, river, road
   and coastline on it is the ground you will actually ride over, because it
   is rendered from the same data the terrain mesh is built from.

   What you have not seen stays under the paper. The explored mask fills in as
   you travel, so the map is a record of where you have been rather than a
   satellite photograph handed to you at the start (§17).
   ========================================================================== */
const MAP_PX = 512;          // resolution of the baked sheet
const EXPLORE_N = 128;       // resolution of the fog-of-war mask

class WorldMap {
  constructor(terrain, roads){
    this.terrain = terrain; this.roads = roads;
    this.explored = new Uint8Array(EXPLORE_N*EXPLORE_N);
    this.waypoint = null;
    this.revealed = 0;
    this.base = null;
    /* View state: which patch of country the sheet is showing. */
    this.view = { cx:0, cz:0, zoom:1 };
    this.MAXZOOM = 8;
  }

  /* Keep the view inside the world however far it is zoomed. */
  clampView(){
    const v = this.view;
    v.zoom = M.clamp(v.zoom, 1, this.MAXZOOM);
    const span = CFG.WORLD / v.zoom;
    const lim = Math.max(0, CFG.HALF - span/2);
    v.cx = M.clamp(v.cx, -lim, lim);
    v.cz = M.clamp(v.cz, -lim, lim);
  }
  zoomAt(factor, worldPoint){
    const v = this.view;
    const before = v.zoom;
    v.zoom = M.clamp(v.zoom*factor, 1, this.MAXZOOM);
    if(worldPoint && v.zoom !== before){
      // Keep the point under the cursor pinned while the scale changes.
      const k = 1 - before/v.zoom;
      v.cx += (worldPoint.x - v.cx)*k;
      v.cz += (worldPoint.z - v.cz)*k;
    }
    this.clampView();
  }
  panBy(dxWorld, dzWorld){
    this.view.cx -= dxWorld; this.view.cz -= dzWorld;
    this.clampView();
  }
  centreOn(p){ this.view.cx = p.x; this.view.cz = p.z; this.clampView(); }

  /* ---- Bake the sheet --------------------------------------------------- */
  bake(){
    const cv = document.createElement('canvas');
    cv.width = cv.height = MAP_PX;
    const c = cv.getContext('2d');
    const img = c.createImageData(MAP_PX, MAP_PX);
    const d = img.data;
    const T = this.terrain;

    /* Hill shading from a raking north-west sun, over a biome tint. Relief
       shading is what turns a colour blob into something you can navigate. */
    for(let j=0;j<MAP_PX;j++){
      for(let i=0;i<MAP_PX;i++){
        const wx = (i/(MAP_PX-1))*CFG.WORLD - CFG.HALF;
        const wz = (j/(MAP_PX-1))*CFG.WORLD - CFG.HALF;
        const h  = T.heightAt(wx,wz);
        const k = (j*MAP_PX+i)*4;
        let r,g,b;
        if(h < CFG.SEA){
          const deep = M.sat(-h/18);
          r = M.lerp(120,46,deep); g = M.lerp(150,78,deep); b = M.lerp(158,100,deep);
        } else {
          const biome = T.biomeAt(wx,wz,h);
          const pal = [[214,196,148],   // Flats
                       [186,190,186],   // Ridge
                       [176,188,142],   // Grasslands
                       [196,164,132],   // Copperwire
                       [156,180,150]][biome];
          const alt = M.sat((h-CFG.SNOWLINE)/40);
          r = M.lerp(pal[0], 244, alt);
          g = M.lerp(pal[1], 246, alt);
          b = M.lerp(pal[2], 250, alt);
          // Relief.
          const e = CFG.WORLD/MAP_PX;
          const hx = T.heightAt(wx+e,wz), hz = T.heightAt(wx,wz+e);
          const shade = M.clamp(1 + ((h-hx) + (h-hz))*0.055, 0.55, 1.42);
          r*=shade; g*=shade; b*=shade;
          // Rivers.
          const rv = T.sample(T.river, wx, wz);
          if(rv > 0.10){
            const t = M.sat((rv-0.10)*2.2);
            r = M.lerp(r, 104, t); g = M.lerp(g, 138, t); b = M.lerp(b, 152, t);
          }
        }
        d[k]=r; d[k+1]=g; d[k+2]=b; d[k+3]=255;
      }
    }
    c.putImageData(img, 0, 0);

    /* Roads and the line, inked over the top. */
    const toPx = (wx,wz)=> [ (wx+CFG.HALF)/CFG.WORLD*MAP_PX,
                             (wz+CFG.HALF)/CFG.WORLD*MAP_PX ];
    if(this.roads){
      c.lineCap = 'round'; c.lineJoin = 'round';
      for(const r of this.roads.routes){
        c.strokeStyle = 'rgba(92,66,40,0.85)'; c.lineWidth = 2.4;
        c.beginPath();
        r.points.forEach((p,i)=>{ const [x,y]=toPx(p.x,p.z);
          i? c.lineTo(x,y) : c.moveTo(x,y); });
        c.stroke();
      }
      const rr = this.roads.railRoute;
      if(rr){
        c.strokeStyle = 'rgba(38,34,30,0.92)'; c.lineWidth = 2.6;
        c.beginPath();
        rr.points.forEach((p,i)=>{ const [x,y]=toPx(p.x,p.z);
          i? c.lineTo(x,y) : c.moveTo(x,y); });
        c.stroke();
        // Sleeper ticks, so the line reads as rail and not another road.
        c.lineWidth = 1.2;
        for(let i=0;i<rr.points.length-1;i+=6){
          const a=rr.points[i], b=rr.points[i+1];
          const [ax,ay]=toPx(a.x,a.z), [bx,by]=toPx(b.x,b.z);
          const dx=bx-ax, dy=by-ay, L=Math.hypot(dx,dy)||1;
          const nx=-dy/L*2.6, ny=dx/L*2.6;
          c.beginPath(); c.moveTo(ax+nx,ay+ny); c.lineTo(ax-nx,ay-ny); c.stroke();
        }
      }
    }
    this.base = cv;
    return cv;
  }

  /* ---- Exploration ------------------------------------------------------ */
  reveal(wx, wz, radius = 150){
    const cell = CFG.WORLD/EXPLORE_N;
    const ci = (wx+CFG.HALF)/cell, cj = (wz+CFG.HALF)/cell;
    const r = radius/cell;
    const i0=Math.max(0,Math.floor(ci-r)), i1=Math.min(EXPLORE_N-1,Math.ceil(ci+r));
    const j0=Math.max(0,Math.floor(cj-r)), j1=Math.min(EXPLORE_N-1,Math.ceil(cj+r));
    for(let j=j0;j<=j1;j++) for(let i=i0;i<=i1;i++){
      if(Math.hypot(i-ci, j-cj) > r) continue;
      const k=j*EXPLORE_N+i;
      if(!this.explored[k]){ this.explored[k]=1; this.revealed++; }
    }
  }
  get percent(){ return this.revealed/(EXPLORE_N*EXPLORE_N)*100; }

  /* Blur the mask when drawing so the edge of knowledge is a soft frontier
     rather than a staircase of squares. */
  _fogCanvas(w,h){
    if(!this._fog || this._fog.width!==EXPLORE_N){
      this._fog = document.createElement('canvas');
      this._fog.width = this._fog.height = EXPLORE_N;
    }
    const fc = this._fog.getContext('2d');
    const img = fc.createImageData(EXPLORE_N, EXPLORE_N);
    for(let i=0;i<this.explored.length;i++){
      img.data[i*4+3] = this.explored[i] ? 0 : 255;
    }
    fc.putImageData(img,0,0);
    return this._fog;
  }

  /* ---- Draw ------------------------------------------------------------- */
  draw(ctx, W, H, game){
    const S = Math.min(W,H);
    const ox = (W-S)/2, oy = (H-S)/2;
    ctx.clearRect(0,0,W,H);

    // Parchment behind everything, so unexplored country is blank paper.
    ctx.fillStyle = '#22201a';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#cbbf9d';
    ctx.fillRect(ox,oy,S,S);

    this.clampView();
    const v = this.view;
    /* The whole sheet is drawn scaled and offset, so zooming is just a wider
       destination rectangle with the view centre held in the middle. */
    const dS = S*v.zoom;
    const dx = ox + S/2 - ((v.cx + CFG.HALF)/CFG.WORLD)*dS;
    const dy = oy + S/2 - ((v.cz + CFG.HALF)/CFG.WORLD)*dS;

    ctx.save();
    ctx.beginPath(); ctx.rect(ox,oy,S,S); ctx.clip();
    // Crisp at high zoom, smooth when showing the whole territory.
    ctx.imageSmoothingEnabled = v.zoom < 3;
    if(this.base) ctx.drawImage(this.base, dx, dy, dS, dS);

    // Fog: paint the paper back over anything unvisited.
    ctx.globalCompositeOperation = 'source-over';
    ctx.imageSmoothingEnabled = true;
    const fog = this._fogCanvas();
    ctx.save();
    ctx.filter = 'blur(' + (2*Math.min(v.zoom,3)).toFixed(1) + 'px)';
    ctx.globalAlpha = 0.97;
    ctx.fillStyle = '#c6b995';
    ctx.drawImage(fog, dx, dy, dS, dS);
    ctx.restore();
    ctx.filter = 'none';

    const toPx = (wx,wz)=> [ dx + (wx+CFG.HALF)/CFG.WORLD*dS,
                             dy + (wz+CFG.HALF)/CFG.WORLD*dS ];

    /* Towns you have found. */
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for(const t of (game.towns ? game.towns.list : [])){
      if(!game.discovered.has(t.name)) continue;
      const [x,y] = toPx(t.x, t.z);
      const served = game.roads && game.roads.stations &&
                     game.roads.stations.some(s=>s.town===t.key);
      ctx.fillStyle = '#2a2118';
      ctx.beginPath(); ctx.arc(x,y,5.5,0,6.283); ctx.fill();
      ctx.fillStyle = served ? '#FFD600' : '#e8dfc8';
      ctx.beginPath(); ctx.arc(x,y,3.6,0,6.283); ctx.fill();
      ctx.font = '600 12px "Bookman Old Style", Georgia, serif';
      ctx.fillStyle = 'rgba(30,24,16,0.92)';
      ctx.fillText(t.name, x+1, y-13);
      ctx.fillStyle = '#f3ecd6';
      ctx.fillText(t.name, x, y-14);
    }

    /* Where the story is pointing you. */
    const om = game.story && game.story.markerPos();
    if(om){
      const [x,y] = toPx(om.x, om.z);
      ctx.save();
      ctx.translate(x,y);
      ctx.fillStyle = '#FFD600';
      ctx.strokeStyle = 'rgba(30,22,10,0.9)'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0,2); ctx.lineTo(-7,-12); ctx.lineTo(7,-12);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
    }

    /* Waypoint. */
    if(this.waypoint){
      const [x,y] = toPx(this.waypoint.x, this.waypoint.z);
      ctx.strokeStyle = '#00A3A6'; ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.arc(x,y,9,0,6.283); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x-13,y); ctx.lineTo(x+13,y);
      ctx.moveTo(x,y-13); ctx.lineTo(x,y+13); ctx.stroke();
    }

    /* You, and which way you are pointed. */
    const p = game.player.pos;
    const [px,py] = toPx(p.x, p.z);
    const yaw = game.player.yaw;
    ctx.save();
    // North is up on the sheet, and a yaw of 0 faces south, so the arrow is
    // rotated by PI - yaw. Rotating by -yaw pointed it exactly backwards.
    ctx.translate(px,py); ctx.rotate(Math.PI - yaw);
    ctx.fillStyle = '#b0362c';
    ctx.beginPath();
    ctx.moveTo(0,-9); ctx.lineTo(6,7); ctx.lineTo(0,4); ctx.lineTo(-6,7);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(20,16,10,0.85)'; ctx.lineWidth = 1.4; ctx.stroke();
    ctx.restore();
    ctx.restore();

    /* Border and scale bar. */
    ctx.strokeStyle = 'rgba(40,32,20,0.8)'; ctx.lineWidth = 3;
    ctx.strokeRect(ox+1.5, oy+1.5, S-3, S-3);
    const km = dS/CFG.WORLD*1000;
    ctx.strokeStyle = '#3a2f20'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(ox+16, oy+S-16); ctx.lineTo(ox+16+km, oy+S-16);
    ctx.moveTo(ox+16, oy+S-20); ctx.lineTo(ox+16, oy+S-12);
    ctx.moveTo(ox+16+km, oy+S-20); ctx.lineTo(ox+16+km, oy+S-12);
    ctx.stroke();
    ctx.textAlign='left';
    ctx.font='11px "Bookman Old Style", Georgia, serif';
    ctx.fillStyle='#3a2f20';
    ctx.fillText('1 km', ox+20+km, oy+S-16);
    ctx.textAlign='right';
    ctx.fillText(v.zoom > 1.02 ? (v.zoom.toFixed(1)+'x  ·  drag to pan')
                               : 'scroll to zoom  ·  drag to pan',
                 ox+S-16, oy+S-16);
    return { ox, oy, S, dx, dy, dS };
  }

  /* Turn a point on the sheet into a place in the world, and back. */
  fromPx(cx, cy, box){
    if(!box) return null;
    if(cx < box.ox || cx > box.ox+box.S || cy < box.oy || cy > box.oy+box.S)
      return null;
    const u = (cx-box.dx)/box.dS, w = (cy-box.dy)/box.dS;
    return new THREE.Vector3(u*CFG.WORLD - CFG.HALF, 0, w*CFG.WORLD - CFG.HALF);
  }
  /* World units per sheet pixel — used to turn a drag into a pan. */
  worldPerPx(box){ return CFG.WORLD/box.dS; }
}
/* ==========================================================================
   THE TRAIN
   A real service, not a set dressing. She runs the length of the line, stops
   at every platform, waits, whistles, and sets off again — and she is the same
   distance away whether you are watching her or not, because the timetable is
   simulated whether or not she is on screen (§13).
   ========================================================================== */
function buildLocomotive(lib){
  const parts=[];
  const P=(g,m)=>parts.push({geo:g, group:m});
  const C = { IRON:0, BRASS:1, PAINT:2, WOOD:3, GLASS:4 };

  /* Boiler, smokebox, chimney. */
  const boiler = new THREE.CylinderGeometry(0.86, 0.86, 5.0, 16);
  boiler.rotateX(Math.PI/2); boiler.translate(0, 1.90, 0.55);
  P(boiler, C.PAINT);
  for(const z of [-1.3, 0.5, 2.2]){
    const band = new THREE.TorusGeometry(0.875, 0.045, 5, 16);
    band.translate(0, 1.90, z); P(band, C.BRASS);
  }
  const smokebox = new THREE.CylinderGeometry(0.90, 0.90, 1.2, 16);
  smokebox.rotateX(Math.PI/2); smokebox.translate(0, 1.90, 3.55);
  P(smokebox, C.IRON);
  const door = new THREE.CircleGeometry(0.78, 16);
  door.translate(0, 1.90, 4.16); P(door, C.IRON);
  // Diamond stack — the shape that says frontier locomotive at any distance.
  const stackL = new THREE.CylinderGeometry(0.24, 0.30, 0.75, 10);
  stackL.translate(0, 3.05, 3.30); P(stackL, C.IRON);
  const stackU = new THREE.CylinderGeometry(0.62, 0.26, 1.15, 12);
  stackU.translate(0, 4.00, 3.30); P(stackU, C.IRON);
  const rim = new THREE.TorusGeometry(0.62, 0.055, 5, 14);
  rim.rotateX(Math.PI/2); rim.translate(0, 4.56, 3.30); P(rim, C.BRASS);
  // Steam dome and bell.
  const dome = new THREE.SphereGeometry(0.42, 12, 8, 0, 6.283, 0, 1.9);
  dome.translate(0, 2.62, 0.60); P(dome, C.BRASS);
  const bell = new THREE.ConeGeometry(0.20, 0.30, 10);
  bell.rotateX(Math.PI); bell.translate(0, 2.86, 2.30); P(bell, C.BRASS);
  const headlamp = new THREE.BoxGeometry(0.55, 0.60, 0.50);
  headlamp.translate(0, 3.05, 4.05); P(headlamp, C.IRON);
  const lens = new THREE.CircleGeometry(0.20, 12);
  lens.translate(0, 3.05, 4.31); P(lens, C.GLASS);

  /* Frame, cab, cowcatcher. */
  const frame = new THREE.BoxGeometry(2.0, 0.42, 8.6);
  frame.translate(0, 1.10, 0.20); P(frame, C.IRON);
  const cab = new THREE.BoxGeometry(2.35, 2.30, 2.60);
  cab.translate(0, 2.45, -2.60); P(cab, C.WOOD);
  const cabRoof = new THREE.BoxGeometry(2.65, 0.16, 3.00);
  cabRoof.translate(0, 3.66, -2.60); P(cabRoof, C.IRON);
  for(const sx of [-1.19, 1.19]){
    const win = new THREE.BoxGeometry(0.06, 0.80, 0.85);
    win.translate(sx, 2.95, -1.95); P(win, C.GLASS);
  }
  const catcher = new THREE.ConeGeometry(1.05, 1.40, 4, 1);
  catcher.rotateZ(Math.PI/2); catcher.rotateY(Math.PI/4);
  catcher.scale(1, 1, 0.55);
  catcher.rotateX(-Math.PI/2); catcher.translate(0, 0.72, 4.70);
  P(catcher, C.IRON);

  /* Wheels: two small leading, three drivers, with rods. */
  const wheelAt = (z, r, mat)=>{
    for(const sx of [-0.98, 0.98]){
      const w = new THREE.CylinderGeometry(r, r, 0.16, 14);
      w.rotateZ(Math.PI/2); w.translate(sx, r, z); P(w, mat);
      const hub = new THREE.CylinderGeometry(r*0.28, r*0.28, 0.22, 8);
      hub.rotateZ(Math.PI/2); hub.translate(sx, r, z); P(hub, C.BRASS);
      for(let k=0;k<6;k++){
        const sp = new THREE.BoxGeometry(0.07, r*1.7, 0.07);
        sp.rotateX(k/6*Math.PI); sp.rotateZ(Math.PI/2);
        sp.translate(sx, r, z); P(sp, mat);
      }
    }
  };
  wheelAt(3.60, 0.44, C.IRON);
  wheelAt(1.00, 0.86, C.PAINT);
  wheelAt(-0.85, 0.86, C.PAINT);
  wheelAt(-2.70, 0.86, C.PAINT);
  for(const sx of [-1.12, 1.12]){
    const rod = new THREE.BoxGeometry(0.10, 0.14, 4.0);
    rod.translate(sx, 0.86, -0.85); P(rod, C.BRASS);
    const cyl = new THREE.CylinderGeometry(0.34, 0.34, 1.3, 10);
    cyl.rotateX(Math.PI/2); cyl.translate(sx*0.92, 1.28, 2.55); P(cyl, C.IRON);
  }
  return mergeParts(parts);
}

function buildCar(lib, kind){
  const parts=[];
  const P=(g,m)=>parts.push({geo:g, group:m});
  const C = { IRON:0, BRASS:1, PAINT:2, WOOD:3, GLASS:4 };
  const L = kind==='tender' ? 5.2 : 8.6;
  const frame = new THREE.BoxGeometry(2.1, 0.40, L);
  frame.translate(0, 1.06, 0); P(frame, C.IRON);
  if(kind==='tender'){
    const body = new THREE.BoxGeometry(2.25, 1.70, L-0.4);
    body.translate(0, 2.10, 0); P(body, C.PAINT);
    // Coal, heaped.
    for(let i=0;i<9;i++){
      const c = new THREE.DodecahedronGeometry(0.30 + Math.random()*0.22, 0);
      c.translate((Math.random()-0.5)*1.5, 2.95 + Math.random()*0.2,
                  (Math.random()-0.5)*(L-1.4));
      P(c, C.IRON);
    }
  } else {
    const body = new THREE.BoxGeometry(2.45, 2.60, L);
    body.translate(0, 2.55, 0); P(body, kind==='freight' ? C.WOOD : C.PAINT);
    const roof = new THREE.BoxGeometry(2.65, 0.20, L+0.3);
    roof.translate(0, 3.92, 0); P(roof, C.IRON);
    if(kind==='coach'){
      for(let i=0;i<6;i++){
        const z = -L/2 + (i+0.5)*(L/6);
        for(const sx of [-1.24, 1.24]){
          const w = new THREE.BoxGeometry(0.06, 0.95, 0.85);
          w.translate(sx, 2.90, z); P(w, C.GLASS);
        }
      }
      for(const sz of [-L/2-0.18, L/2+0.18]){
        const plat = new THREE.BoxGeometry(2.2, 0.14, 0.9);
        plat.translate(0, 1.30, sz); P(plat, C.WOOD);
        for(const sx of [-1.0, 1.0]){
          const rail = new THREE.BoxGeometry(0.07, 1.0, 0.07);
          rail.translate(sx, 1.85, sz); P(rail, C.IRON);
        }
      }
    } else {
      for(const sz of [-1, 1]){
        const dr = new THREE.BoxGeometry(2.5, 1.9, 0.10);
        dr.translate(0, 2.35, sz*(L/2+0.01)); P(dr, C.IRON);
      }
    }
  }
  for(const z of [-L/2+1.2, L/2-1.2]){
    for(const sx of [-1.0, 1.0]){
      const w = new THREE.CylinderGeometry(0.48,0.48,0.16,12);
      w.rotateZ(Math.PI/2); w.translate(sx, 0.48, z); P(w, C.IRON);
    }
  }
  return mergeParts(parts);
}

class Train {
  constructor(roads, lib, scene, audio){
    this.roads = roads; this.audio = audio; this.scene = scene;
    this.route = roads.railRoute;
    this.stations = (roads.stations||[]).slice().sort((a,b)=>a.along-b.along);
    if(!this.route) return;

    const mats = [
      new THREE.MeshStandardMaterial({ color:0x2c2b29, roughness:0.55, metalness:0.55 }),
      new THREE.MeshStandardMaterial({ color:0xb08d3f, roughness:0.34, metalness:0.75 }),
      new THREE.MeshStandardMaterial({ color:0x1d3b3c, roughness:0.48, metalness:0.22 }),
      new THREE.MeshStandardMaterial({ map:lib.wood_dark.map,
        normalMap:lib.wood_dark.normalMap, color:0x8a6a48, roughness:0.9 }),
      new THREE.MeshStandardMaterial({ color:0x9fb6c4, roughness:0.12,
        metalness:0.3, emissive:0x000000 }),
    ];
    this.mats = mats;
    this.group = new THREE.Group();
    this.cars = [];
    const specs = [ {geo:buildLocomotive(lib), len:9.4, off:0},
                    {geo:buildCar(lib,'tender'), len:5.6, off:8.2},
                    {geo:buildCar(lib,'coach'),  len:9.0, off:14.6},
                    {geo:buildCar(lib,'coach'),  len:9.0, off:24.4},
                    {geo:buildCar(lib,'freight'),len:9.0, off:34.2} ];
    for(const s of specs){
      const m = new THREE.Mesh(s.geo, mats);
      m.castShadow = true; m.receiveShadow = true;
      this.group.add(m);
      this.cars.push({ mesh:m, off:s.off });
    }
    scene.add(this.group);

    this.dist = this.stations.length ? this.stations[0].along : 20;
    this.dir = 1;
    this.speed = 0;
    this.dwell = 6;
    this.nextStop = 1;
    this.smokeT = 0;
    this.chuffT = 0;
    this.whistled = false;
    this.headlamp = new THREE.PointLight(0xffd9a0, 0, 34, 2);
    scene.add(this.headlamp);
    this.rider = null;          // set while the player is aboard
  }

  /* Where a passenger stands: the end platform of the first coach. */
  boardPoint(out){
    const car = this.cars[2];
    if(!car) return null;
    const v = (out || new THREE.Vector3()).set(0, 1.44, -4.6);
    return v.applyMatrix4(car.mesh.matrixWorld);
  }
  /* And where they step down to. */
  alightPoint(out){
    const car = this.cars[2];
    if(!car) return null;
    const v = (out || new THREE.Vector3()).set(-3.4, 0.2, -4.6);
    return v.applyMatrix4(car.mesh.matrixWorld);
  }
  get stopped(){ return this.speed < 0.9; }

  /* Wind the service forward until she is standing at a given platform. Used
     by the "wait for the train" prompt, so nobody has to stand on a platform
     for four real minutes to find out whether the timetable works. */
  fastForwardTo(stationName, tod){
    let simulated = 0;
    for(let i=0;i<20000;i++){
      this.update(0.25, new THREE.Vector3(0,0,1e6), 0);
      simulated += 0.25;
      if(this.atStation && this.currentStation() === stationName) break;
    }
    if(tod) tod.setHour(tod.hour + simulated/3600*24/(CFG.DAY_MINUTES/60*24));
    return simulated;
  }
  get atStation(){ return this.dwell > 0; }
  /* Name of the platform she is standing at, if any. */
  currentStation(){
    if(!this.atStation) return null;
    const s = this.stations[this.nextStop];
    return s ? s.name : null;
  }
  nextStation(){
    const s = this.stations[this.nextStop];
    return s ? s.name : null;
  }

  /* Sample the alignment; the wheels sit on the rail head, not the ballast. */
  _at(d){
    const s = this.roads.sampleRoute(this.route, M.clamp(d, 0, this.route.length));
    return s;
  }

  update(dt, playerPos, nightAmt){
    if(!this.route) return;

    /* Timetable. Accelerate, run, brake into the platform, wait, go again. */
    let target = CFG.TRAIN_SPEED;
    const stop = this.stations[this.nextStop];
    if(this.dwell > 0){
      this.dwell -= dt; target = 0;
      if(this.dwell <= 0){
        this.whistled = false;
        // Reverse at the end of the line.
        if(this.nextStop >= this.stations.length-1 && this.dir > 0) this.dir = -1;
        else if(this.nextStop <= 0 && this.dir < 0) this.dir = 1;
        this.nextStop = M.clamp(this.nextStop + this.dir, 0, this.stations.length-1);
      }
    } else if(stop){
      const remaining = Math.abs(stop.along - this.dist);
      if(remaining < 90) target = M.lerp(1.2, CFG.TRAIN_SPEED, remaining/90);
      if(remaining < 2.2){ this.dwell = CFG.TRAIN_DWELL + Math.random()*10; target = 0; }
      // She whistles on the approach, every time.
      if(remaining < 150 && !this.whistled){
        this.whistled = true;
        if(this.audio && this.audio.ready) this._whistle();
      }
    }
    this.speed = M.damp(this.speed, target, target > this.speed ? 0.45 : 0.8, dt);
    this.dist += this.speed*dt*this.dir;
    this.dist = M.clamp(this.dist, 0, this.route.length);

    /* Place every vehicle along the alignment, each trailing the one ahead. */
    const up = new THREE.Vector3(0,1,0);
    const q = new THREE.Quaternion();
    for(const car of this.cars){
      const d = this.dist - car.off*this.dir;
      const a = this._at(d);
      const b = this._at(d + 2.5*this.dir);
      const dir = new THREE.Vector3().subVectors(b.pos, a.pos);
      if(this.dir < 0) dir.negate();
      if(dir.lengthSq() < 1e-6) dir.set(0,0,1);
      dir.normalize();
      car.mesh.position.set(a.pos.x, a.pos.y + 0.44, a.pos.z);
      const yaw = Math.atan2(dir.x, dir.z);
      const pitch = -Math.asin(M.clamp(dir.y, -1, 1));
      car.mesh.rotation.order = 'YXZ';
      car.mesh.rotation.set(pitch, yaw, 0);
    }

    /* Headlamp after dark. */
    const head = this.cars[0].mesh;
    this.headlamp.intensity = nightAmt*10;
    this.headlamp.visible = nightAmt > 0.15;
    this.headlamp.position.copy(head.position).add(
      new THREE.Vector3(Math.sin(head.rotation.y)*4.2, 3.0,
                        Math.cos(head.rotation.y)*4.2));
    this.mats[4].emissive.setRGB(nightAmt*0.9, nightAmt*0.7, nightAmt*0.4);

    /* Exhaust, and the beat of it. */
    const near = head.position.distanceTo(playerPos);
    this.smokeT -= dt;
    if(this.smokeT <= 0 && this.smoke && near < 420){
      this.smokeT = M.lerp(0.42, 0.10, M.sat(this.speed/CFG.TRAIN_SPEED));
      const stackPos = head.position.clone().add(new THREE.Vector3(
        Math.sin(head.rotation.y)*3.3, 4.6, Math.cos(head.rotation.y)*3.3));
      this.smoke(stackPos, this.speed);
    }
    if(this.audio && this.audio.ready && near < 260 && this.speed > 0.4){
      this.chuffT -= dt;
      if(this.chuffT <= 0){
        this.chuffT = M.lerp(0.60, 0.16, M.sat(this.speed/CFG.TRAIN_SPEED));
        this._chuff(head.position, near);
      }
    }
    this.pos = head.position;

    /* The car matrices are written above; a passenger is pinned to one of
       them, so he rides with every lurch and pitch the train has. */
    for(const car of this.cars) car.mesh.updateMatrixWorld(true);
  }

  /* Four beats to the revolution: a hiss of steam through a tapering filter. */
  _chuff(pos, dist){
    const A = this.audio, c = A.ctx, t = A.now();
    const out = A.out(pos, 0.30);
    const n = c.createBufferSource();
    n.buffer = A.noiseBuffer(0.5, 'brown');
    const f = c.createBiquadFilter(); f.type='bandpass';
    f.frequency.setValueAtTime(760, t);
    f.frequency.exponentialRampToValueAtTime(180, t+0.28);
    f.Q.value = 0.9;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.34, t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.34);
    n.connect(f).connect(g).connect(out);
    n.start(t); n.stop(t+0.4);
  }

  /* Two chime notes, a fifth apart, with the wobble a real whistle has. */
  _whistle(){
    const A = this.audio, c = A.ctx, t = A.now();
    const out = A.out(this.pos || new THREE.Vector3(), 0.45);
    for(const [f0, lvl] of [[392, 0.16],[588, 0.12],[784, 0.05]]){
      const o = c.createOscillator(); o.type='sawtooth'; o.frequency.value=f0;
      const bp = c.createBiquadFilter(); bp.type='bandpass';
      bp.frequency.value = f0*1.6; bp.Q.value = 3.5;
      const lfo = c.createOscillator(); lfo.frequency.value = 5.6;
      const lg = c.createGain(); lg.gain.value = f0*0.012;
      lfo.connect(lg).connect(o.frequency);
      const g = c.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(lvl, t+0.14);
      g.gain.setValueAtTime(lvl, t+1.1);
      g.gain.exponentialRampToValueAtTime(0.0001, t+1.9);
      o.connect(bp).connect(g).connect(out);
      o.start(t); lfo.start(t); o.stop(t+2.0); lfo.stop(t+2.0);
    }
    const air = c.createBufferSource();
    air.buffer = A.noiseBuffer(2.0, 'pink');
    const af = c.createBiquadFilter(); af.type='highpass'; af.frequency.value=1800;
    const ag = c.createGain();
    ag.gain.setValueAtTime(0.0001, t);
    ag.gain.exponentialRampToValueAtTime(0.03, t+0.14);
    ag.gain.exponentialRampToValueAtTime(0.0001, t+1.9);
    air.connect(af).connect(ag).connect(out);
    air.start(t); air.stop(t+2.0);
  }
}
/* ==========================================================================
   CUTSCENE DIRECTOR
   Camera on rails, letterboxed, with subtitles and synthesised voice. Shots
   are authored as a start and end framing plus a list of lines with their own
   timings, and the director eases between them.

   It is skippable from the first frame. A cutscene you cannot skip is a
   cutscene you resent the second time you see it (§9).
   ========================================================================== */
const FWD_HELP = new THREE.Vector3(0,0,1);
const _push = new THREE.Vector3();

class Director {
  constructor(game){
    this.game = game;
    this.active = false;
    this.shots = null;
    this.shot = 0;
    this.t = 0;
    this.onDone = null;
    this._pos = new THREE.Vector3();
    this._look = new THREE.Vector3();
    this._spoken = new Set();
  }

  /* shots: [{ dur, from:{pos,look}, to:{pos,look}, lines:[{t,who,text,voice,cls}],
              fadeIn, fadeOut, hold }] */
  /* Stage a conversation: turn both parties to face one another, hold them
     there, and cut between them as they speak. */
  converse(npc, lines, onDone){
    const g = this.game;
    const p = g.player;
    // Square up to each other.
    const dx = npc.pos.x - p.pos.x, dz = npc.pos.z - p.pos.z;
    p.yaw = p.desiredYaw = Math.atan2(dx, dz);
    p.object.rotation.y = p.yaw;
    p.vel.set(0,0,0);
    npc.yaw = Math.atan2(-dx, -dz);
    npc.object.rotation.y = npc.yaw;
    npc.target = null; npc.speed = 0; npc.waitT = 999;
    npc.inScene = true;
    g.horse.followTarget = null;
    g.horse.speed = 0;
    this.talking = npc;
    return this.play(conversationShots(g, npc, lines), ()=>{
      npc.inScene = false; npc.waitT = 3 + Math.random()*6;
      npc.mouthOpen = 0;
      this.talking = null;
      if(onDone) onDone();
    });
  }

  play(shots, onDone){
    this.shots = shots;
    this.shot = 0; this.t = 0;
    this.active = true;
    this.onDone = onDone;
    this._spoken.clear();
    this.game.ui.letterbox(true, 12);
    this.game.ui.hud.classList.add('cine');
    if(document.pointerLockElement) document.exitPointerLock();
    return this;
  }

  skip(){
    if(!this.active) return;
    this.finish();
  }

  finish(){
    this.active = false;
    /* Hand the free camera back pointing roughly where the last shot was
       looking, so control resumes without a lurch. */
    const g = this.game;
    if(g.cam && this._look){
      const p = g.player.pos;
      g.cam.yaw = Math.atan2(this._look.x - p.x, this._look.z - p.z);
      g.cam.pitch = M.clamp(g.cam.pitch, -0.35, 0.15);
      g.cam.smoothTarget.copy(g.player.eyePos);
      g.cam.curDist = CFG.CAM.DIST;
    }
    this.game.ui.showTitle(false);
    this.game.ui.letterbox(false);
    this.game.ui.hud.classList.remove('cine');
    this.game.ui.fade(0, 500);
    this.game.ui.subs.classList.remove('on');
    const dom = this.game.renderer.domElement;
    if(dom.requestPointerLock) dom.requestPointerLock();
    const cb = this.onDone; this.onDone = null;
    if(cb) cb();
  }

  update(dt){
    if(!this.active) return false;
    const s = this.shots[this.shot];
    if(!s){ this.finish(); return false; }
    this.t += dt;

    /* Ease each move so the camera arrives rather than stops. */
    const k = M.smoother(M.sat(this.t / s.dur));
    const from = typeof s.from === 'function' ? s.from() : s.from;
    const to   = typeof s.to   === 'function' ? s.to()   : s.to;
    // A framing may hand back either a vector or a function returning one.
    const val = (v)=> (typeof v === 'function' ? v() : v);
    this._pos.lerpVectors(val(from.pos), val(to.pos), k);
    this._look.lerpVectors(val(from.look), val(to.look), k);

    /* Never put the camera underground. Shot framings are offsets from an
       actor, and on sloping country an offset that clears the ground on the
       flat will be buried in a hillside — which renders as a black screen. */
    const T = this.game.terrain;
    const floor = T.heightAt(this._pos.x, this._pos.z) + 0.55;
    if(!(this._pos.y > floor)) this._pos.y = floor;
    if(this.game.colliders &&
       this.game.colliders.blocked(this._pos.x, this._pos.z, 0.4)){
      const deck = this.game.colliders.support(this._pos.x, this._pos.z,
                                               this._pos.y + 4, 0.4);
      if(deck > this._pos.y) this._pos.y = deck + 0.5;
    }
    if(!Number.isFinite(this._look.x)) this._look.copy(this._pos).add(FWD_HELP);
    /* Never let the lens end up inside its own subject. */
    const gap = this._pos.distanceTo(this._look);
    if(gap < 0.85){
      _push.copy(this._pos).sub(this._look);
      if(_push.lengthSq() < 1e-6) _push.set(0,0,1);
      this._pos.addScaledVector(_push.normalize(), 0.85 - gap);
    }

    const cam = this.game.camera;
    cam.position.copy(this._pos);
    cam.lookAt(this._look);
    if(s.fov){
      const f = M.lerp(s.fov[0], s.fov[1], k);
      if(Math.abs(cam.fov - f) > 0.01){ cam.fov = f; cam.updateProjectionMatrix(); }
    }
    // A little handheld drift, so a locked-off shot still breathes.
    const n = this.game.cam._noise;
    cam.rotateX(n.n2(this.t*0.7, 0)*0.0016);
    cam.rotateY(n.n2(0, this.t*0.8)*0.0016);

    /* The title reveal is a beat like any other. */
    if(s.title && this.t >= s.title.t && !this._spoken.has('title'+this.shot)){
      this._spoken.add('title'+this.shot);
      this.game.ui.showTitle(true);
    }

    /* Lines fire once, at their own moment inside the shot. */
    for(let i=0;i<(s.lines||[]).length;i++){
      const L = s.lines[i];
      const id = this.shot+':'+i;
      if(this.t >= L.t && !this._spoken.has(id)){
        this._spoken.add(id);
        this.game.ui.say(L.who, L.text, L.hold, L.cls || '');
        if(this.game.audio.ready && L.voice){
          const prof = VOICE[L.voice] || VOICE.jarrad_act1;
          const src = L.at ? L.at() : null;
          this.game.audio.speak(L.text, prof, src, L.mouth || null, null,
                                L.follow || null);
        }
      }
    }

    if(this.t >= s.dur){
      this.shot++; this.t = 0;
      if(this.shot >= this.shots.length){ this.finish(); return false; }
    }
    return true;
  }
}


/* ==========================================================================

/* How long this line will actually take to speak. Taken from the phonemiser
   the voice synth uses, so a shot can never be shorter than its own dialogue —
   which is what had the camera cutting to the listener while the speaker was
   still halfway through a sentence. */
function speechSeconds(text, voiceName){
  const p = VOICE[voiceName] || VOICE.jarrad_act1;
  const rate = p.rate || 1;
  let t = 0;
  for(const ph of phonemise(text)) t += ph.dur / rate;
  return t + 0.12;
}
const LINE_GAP = 0.95;      // a beat between lines, so nobody talks over anybody
const SHOT_PRE = 0.55;      // the camera settles before the first word
const SHOT_TAIL = 0.85;     // and holds after the last

/* Build a scene between the player and a character.

   Two rules the old builder broke. First, a shot must never be shorter than
   the line it carries plus a beat either side — a two-word reply was producing
   a one-and-a-half second shot, which reads as the camera flinching. Second,
   every camera stays on ONE side of the axis between the two speakers. The
   old version put the over-the-shoulder cameras on opposite sides, so the pair
   swapped places in frame on every cut.

   And it is no longer just A, B, A, B: there is a vocabulary of framings and
   the scene draws from it. */
const MIN_SHOT = 3.6;       // nothing cuts faster than this
const TWO_SHOT_UNDER = 1.7; // a very short line is played in a two-shot instead

function conversationShots(game, npc, lines){
  const P = game.player, V = (x,y,z)=>new THREE.Vector3(x,y,z);
  const eyeMe   = ()=> V(P.pos.x, P.pos.y + 1.58, P.pos.z);
  const eyeThem = ()=> V(npc.pos.x, npc.pos.y + 1.58*(npc.object.scale.y||1), npc.pos.z);
  const midEye  = ()=>{ const a=eyeMe(), b=eyeThem();
    return V((a.x+b.x)/2, (a.y+b.y)/2, (a.z+b.z)/2); };

  /* One seed per scene, so a given conversation is always cut the same way. */
  let seed = 0;
  for(let i=0;i<npc.name.length;i++) seed = (seed*31 + npc.name.charCodeAt(i))>>>0;
  seed = (seed + lines.length*7919)>>>0;
  const rnd = ()=>{ seed = (seed*1664525 + 1013904223)>>>0; return seed/4294967296; };
  const side = rnd() < 0.5 ? 1 : -1;      // chosen once; never crossed

  /* A camera placement in the two speakers' own frame: `along` runs from
     Jarrad toward the other party, `lat` is always positive so every camera
     sits on the same side of the line. */
  const cam = (on, along, lat, up)=>()=>{
    const a = eyeMe(), b = eyeThem();
    const dx = b.x-a.x, dz = b.z-a.z;
    const L = Math.hypot(dx,dz) || 1;
    const ax = dx/L, az = dz/L;
    const px = -az*side, pz = ax*side;
    const o = on === 'them' ? b : on === 'me' ? a : midEye();
    return V(o.x + ax*along + px*lat, o.y + up, o.z + az*along + pz*lat);
  };

  /* The vocabulary. Each entry gives the anchor, how far along the axis, how
     far to the side, and the height — mirrored depending on who is speaking. */
  const FRAMINGS = {
    ots:     { w:3, fov:[40,37], them:['me',   -1.05, 0.80, 0.24],
                                 me:  ['them',  1.05, 0.80, 0.24] },
    single:  { w:3, fov:[38,35], them:['them', -1.20, 1.05, 0.14],
                                 me:  ['me',    1.20, 1.05, 0.14] },
    profile: { w:1, fov:[42,39], them:['mid',   0.30, 2.10, 0.26],
                                 me:  ['mid',  -0.30, 2.10, 0.26] },
    low:     { w:1, fov:[40,36], them:['them', -1.35, 0.74,-0.44],
                                 me:  ['me',    1.35, 0.74,-0.44] },
    high:    { w:1, fov:[42,39], them:['them', -1.20, 0.68, 1.00],
                                 me:  ['me',    1.20, 0.68, 1.00] },
    wide:    { w:1, fov:[46,43], them:['mid',  -0.60, 3.30, 0.85],
                                 me:  ['mid',   0.60, 3.30, 0.85] },
    two:     { w:0, fov:[45,42], them:['mid',   0.00, 2.85, 0.58],
                                 me:  ['mid',   0.00, 2.85, 0.58] },
  };
  const DECK = [];
  for(const k of Object.keys(FRAMINGS))
    for(let i=0;i<FRAMINGS[k].w;i++) DECK.push(k);

  /* Four ways for a shot to move, so nothing is ever locked off. */
  const MOVES = [
    (a,l,u,s2)=>[a + 0.17*s2, l - 0.07, u - 0.02],   // push in
    (a,l,u,s2)=>[a - 0.15*s2, l + 0.06, u + 0.03],   // ease back
    (a,l,u,s2)=>[a + 0.05*s2, l + 0.24, u + 0.01],   // arc round
    (a,l,u,s2)=>[a + 0.06*s2, l - 0.03, u + 0.11],   // rise
  ];

  const jarradVoice = game.player.act >= 4 ? 'jarrad_act5' : 'jarrad_act1';
  const shots = [];
  let lastKind = null, moveIdx = (rnd()*MOVES.length)|0;

  /* Establish the pair before anybody speaks. */
  shots.push({ dur: 2.9,
    from: { pos: cam('mid', -0.5, 3.5, 0.95), look: midEye },
    to:   { pos: cam('mid', -0.2, 3.0, 0.72), look: midEye },
    fov: [48, 44], lines: [] });

  let i = 0;
  while(i < lines.length){
    // Consecutive lines from one person share a shot, up to three.
    let n = 1;
    while(i+n < lines.length && lines[i+n].who === lines[i].who && n < 3) n++;
    const group = lines.slice(i, i+n);
    const onThem = group[0].who === 'them';
    const who = onThem ? 'them' : 'me';

    /* Lay the lines out with a real beat between them. */
    const shotLines = [];
    let t = SHOT_PRE, speech = 0;
    for(const L of group){
      const isThem = L.who === 'them';
      const voice = isThem ? (npc.voice || 'conway') : jarradVoice;
      const d = speechSeconds(L.text, voice);
      shotLines.push({
        t, hold: d + 0.55,
        who: isThem ? npc.name : 'JARRAD GAUNT',
        cls: isThem ? 'named' : '',
        text: L.text, voice,
        at: isThem ? eyeThem : eyeMe,
        follow: isThem ? eyeThem : eyeMe,
        mouth: isThem ? (o)=>{ npc.mouthOpen = o; } : null,
      });
      t += d + LINE_GAP; speech += d;
    }
    const dur = Math.max(MIN_SHOT, t - LINE_GAP + SHOT_TAIL);

    /* Pick a framing. A very short turn is played wide, with both of them in
       frame, so a one-word reply never earns a cut of its own. */
    let kind;
    if(speech < TWO_SHOT_UNDER) kind = 'two';
    else {
      let guard = 0;
      do { kind = DECK[(rnd()*DECK.length)|0]; } while(kind === lastKind && guard++ < 8);
    }
    lastKind = kind;
    const f = FRAMINGS[kind];
    const [anchor, along, lat, up] = f[who];
    const s2 = onThem ? -1 : 1;      // "toward the speaker" along the axis
    const mv = MOVES[moveIdx++ % MOVES.length];
    const [a2, l2, u2] = mv(along, lat, up, s2);
    const lookAt = kind === 'two' || kind === 'wide' ? midEye
                 : (onThem ? eyeThem : eyeMe);

    shots.push({
      dur, kind,
      from: { pos: cam(anchor, along, lat, up), look: lookAt },
      to:   { pos: cam(anchor, a2, l2, u2),     look: lookAt },
      fov: f.fov,
      lines: shotLines,
    });
    i += n;
  }

  /* Sit on the two of them for a moment before handing control back. */
  shots.push({ dur: 2.2,
    from: { pos: cam('mid', 0.1, 2.7, 0.62), look: midEye },
    to:   { pos: cam('mid', -0.3, 3.3, 0.82), look: midEye },
    fov: [44, 47], lines: [] });

  return shots;
}

/* ==========================================================================
   STORY
   Five acts, sixteen missions (§9). What is wired here is the frame: the act
   the player is in, the objective in front of them, and the beats that move
   one to the next. The opening is authored in full.
   ========================================================================== */
const ACTS = [
  null,
  { n:1, name:'The Fall',            card:'ACT ONE' },
  { n:2, name:'The Climb',           card:'ACT TWO' },
  { n:3, name:'The Rival Exchanges', card:'ACT THREE' },
  { n:4, name:'The Low Point',       card:'ACT FOUR' },
  { n:5, name:'Redemption',          card:'ACT FIVE' },
];

class Story {
  constructor(game){
    this.game = game;
    this.act = 1;
    this.objective = null;
    this.log = [];
    this.flags = new Set();
    this.director = new Director(game);
  }

  /* An objective is a line of text AND a place. Without the second half the
     player is told to find a man in a town of forty buildings and left to it. */
  setObjective(text, hint, marker){
    this.objective = text;
    this.game.objective = text;
    this.marker = marker || null;
    this.log.push(text);
    this.game.ui.setObjective(text);
    this.game.ui.toast(text.toUpperCase(), hint || '', 5);
  }

  /* Where the current objective is, resolved live so it can follow a person. */
  markerPos(){
    if(!this.marker) return null;
    if(typeof this.marker === 'function') return this.marker();
    return this.marker;
  }
  townByKey(k){ return this.game.towns.list.find(t=>t.key===k); }
  namedNpc(id){ return this.game.folk.all.find(n=>n.id===id); }
  complete(flag){
    if(this.flags.has(flag)) return false;
    this.flags.add(flag);
    return true;
  }

  /* ---- The opening ------------------------------------------------------
     Dawn on the road out of Yes Gulch. He has been sent here, and he is not
     pretending otherwise. Ollie does most of the talking, which is the joke
     and also the point: she is the only one still on his side. */
  opening(){
    const g = this.game;
    const P = g.player.pos, H = g.horse;
    const V = (x,y,z)=> new THREE.Vector3(x,y,z);
    const at = (dx,dy,dz)=> V(P.x+dx, P.y+dy, P.z+dz);
    const head = ()=> H.headPoint();
    const face = ()=> V(P.x, P.y+1.55, P.z);

    g.ui.fade(1, 0);
    setTimeout(()=>g.ui.fade(0, 2600), 350);

    /* Framings are given in the character's OWN frame — behind, beside,
       above — not in world axes. World-axis offsets depend on which way he
       happens to be facing when the game starts, so the same shot could be a
       clean three-quarter view one run and the inside of a hill the next. */
    const rel = (side, fwd, up)=>()=>{
      const y = g.player.yaw, s2 = Math.sin(y), c2 = Math.cos(y);
      return V(P.x + s2*fwd + c2*side, P.y + up, P.z + c2*fwd - s2*side);
    };

    /* Framings that know about BOTH of them. Placing a shot on Ollie using
       only Jarrad's frame assumed she was standing in a particular spot; if
       she was not, the lens ended up inside her. These work from the axis
       between the two, exactly as the conversation scenes do, so the framing
       holds wherever she happens to be. */
    /* Jarrad and Ollie stand SIDE BY SIDE, so the axis between them runs
       across their bodies and the perpendicular runs fore-and-aft. Fixing that
       perpendicular to one sign put every camera behind them — which is why the
       shots were looking at the back of a horse and sweeping across her flank.
       The side is chosen so the lens is always in front of the pair. */
    const pair = (on, along, lat, up)=>()=>{
      const a = face(), b = head();
      const dx = b.x-a.x, dz = b.z-a.z;
      const L = Math.hypot(dx,dz) || 1;
      const ax = dx/L, az = dz/L;
      const fy = g.player.yaw;
      const fwdX = Math.sin(fy), fwdZ = Math.cos(fy);
      const sgn = (-az*fwdX + ax*fwdZ) >= 0 ? 1 : -1;
      const px = -az*sgn, pz = ax*sgn;
      const o = on === 'ollie' ? b
              : on === 'jarrad' ? a
              : V((a.x+b.x)/2, (a.y+b.y)/2, (a.z+b.z)/2);
      return V(o.x + ax*along + px*lat, o.y + up, o.z + az*along + pz*lat);
    };
    const midEye = ()=>{ const a=face(), b=head();
      return V((a.x+b.x)/2, (a.y+b.y)/2 - 0.05, (a.z+b.z)/2); };

    /* A shot is a framing plus a list of turns. Its length comes from how long
       the turns actually take to say, so the camera can never cut away from
       somebody mid-sentence. */
    const shot = (from, to, fov, turns, extra)=>{
      const lines = [];
      let t = 0.6;
      for(const turn of (turns||[])){
        const d = turn.voice ? speechSeconds(turn.text, turn.voice) : (turn.hold || 4.4);
        lines.push(Object.assign({}, turn, { t, hold: d + 0.55 }));
        t += d + 1.05;
      }
      const dur = (turns && turns.length) ? Math.max(MIN_SHOT, t + 0.5)
                                         : ((extra && extra.dur) || 4);
      return Object.assign({ dur, from, to, fov, lines }, extra || {});
    };
    const F = (pos, look)=>({ pos, look });
    const OLLIE = { who:'OLLIE', cls:'ollie', voice:'ollie', at:head, follow:head,
                    mouth:(o)=>{ g.horse.mouthOpen = o; } };
    const JAR   = { who:'JARRAD GAUNT', voice:'jarrad_act1', at:face };

    const shots = [
      /* 1 — the country, before the man. */
      shot(F(rel(-52,-62,44), ()=>V(P.x, P.y+8, P.z)),
           F(rel(-30,-34,21), ()=>V(P.x, P.y+3, P.z)), [46,52],
        [{ who:'', text:'The frontier. Eighteen days out from anywhere that has a name.',
           hold:5.0 }]),

      /* 2 — the two of them, before either says anything. */
      shot(F(pair('mid', -0.4, 3.60, 1.05), midEye),
           F(pair('mid', -0.1, 3.05, 0.82), midEye), [48,44], null, { dur: 3.2 }),

      /* 3 — over his shoulder, onto her. */
      shot(F(pair('jarrad', -1.05, 0.86, 0.26), head),
           F(pair('jarrad', -0.88, 0.78, 0.24), head), [42,39],
        [Object.assign({}, OLLIE,
          { text:"So. That's it, then. They actually did it." })]),

      /* 4 — reverse: over her shoulder, onto him. */
      shot(F(pair('ollie', 1.05, 0.86, 0.24), face),
           F(pair('ollie', 0.90, 0.80, 0.22), face), [40,37],
        [Object.assign({}, JAR,
          { text:"They did it in writing. That's the part that stings." })]),

      /* 5 — a clean single, closer. The dismissal, in his own words. */
      shot(F(pair('jarrad', 1.28, 1.02, 0.10), face),
           F(pair('jarrad', 1.10, 0.94, 0.06), face), [38,34],
        [Object.assign({}, JAR, { text:"Twelve years I sold for that company. Twelve." }),
         Object.assign({}, JAR, { text:"Rennick signs one page and I'm a frontier man with a horse and a satchel." })]),

      /* 6 — back over his shoulder, and the terms of the thing. */
      shot(F(pair('jarrad', -1.10, 0.90, 0.28), head),
           F(pair('jarrad', -0.92, 1.10, 0.24), head), [42,38],
        [Object.assign({}, OLLIE,
          { text:"Six towns. No wire between any of them. Get the line through and they take you back." })]),

      /* 7 — him, in profile across the pair. */
      shot(F(pair('mid', -0.30, 2.15, 0.30), face),
           F(pair('mid', -0.20, 2.00, 0.34), face), [42,39],
        [Object.assign({}, JAR, { text:"That's the arrangement." })]),

      /* 8 — her, and the last word. */
      shot(F(pair('ollie', -1.20, 1.00, 0.14), head),
           F(pair('ollie', -1.02, 0.92, 0.18), head), [40,37],
        [Object.assign({}, OLLIE,
          { text:"Then we'd better start talking to people. You're good at that. Allegedly." })]),

      /* 9 — pull back out to the country, and the title comes up over it. */
      shot(F(rel(-5,-6,4.2), face), F(rel(-36,-44,30), ()=>V(P.x, P.y+6, P.z)),
           [42,58], null, { dur: 11.5, title:{ t:2.6 } }),
    ];

    this.director.play(shots, ()=>{
      g.ui.toast('THE FALL', 'Act One', 5.5);
      if(g.audio.ready) g.audio.music.playTheme('harmonica', 0.85);
      setTimeout(()=>{
        const gulch = this.townByKey('gulch');
        this.setObjective('Ride into Yes Gulch',
          'Follow the road. Ollie knows the way.',
          gulch ? new THREE.Vector3(gulch.x, gulch.y, gulch.z) : null);
      }, 5200);
    });
  }

  /* ---- Beats ------------------------------------------------------------ */
  onEnterTown(town){
    if(town.key === 'gulch' && this.complete('reach_gulch')){
      this.setObjective('Speak to Clerk Halloran',
        'Outside the telegraph office. He has a name over his head.',
        ()=>{ const n = this.namedNpc('halloran');
              return n ? n.pos : new THREE.Vector3(town.x, town.y, town.z); });
    }
  }

  /* Which scene, if any, this person owes you right now. */
  scriptFor(npc){
    if(!npc || !npc.id) return null;
    if(npc.id === 'halloran'){
      if(!this.flags.has('talk_office') && this.flags.has('reach_gulch'))
        return 'halloran_first';
      if(this.flags.has('met_all') && !this.flags.has('reported'))
        return 'halloran_report';
      return null;
    }
    if(this.flags.has('talk_office') && !this.flags.has('met_'+npc.id))
      return npc.id + '_first';
    return null;
  }

  /* Returns true if a scene played, so the caller does not also fire a bark. */
  converse(npc){
    const key = this.scriptFor(npc);
    if(!key || !CONVERSATIONS[key]) return false;
    if(this.director.active) return true;
    this.director.converse(npc, CONVERSATIONS[key],
                           ()=>this._afterScene(npc, key));
    return true;
  }

  _afterScene(npc, key){
    const g = this.game;
    if(key === 'halloran_first'){
      this.complete('talk_office');
      g.player.reputation = Math.min(100, g.player.reputation + 4);
      this._nextHoldout();
      return;
    }
    if(key === 'halloran_report'){
      this.complete('reported');
      this.advance(2);
      this.setObjective('Get the line through',
        'Poles in the ground. Then we see whose name is on what.', null);
      return;
    }
    if(key.endsWith('_first')){
      this.complete('met_'+npc.id);
      this.met = this.met || [];
      if(this.met.indexOf(npc.id) < 0) this.met.push(npc.id);
      this.metCount = this.met.length;
      g.player.reputation = Math.min(100, g.player.reputation + 6);
      g.ui.toast(npc.name,
        `${['nobody','One','Two','Three','All four'][this.metCount]} of the four heard out`, 4.5);
      if(this.metCount >= 4 && this.complete('met_all')){
        this.setObjective('Return to Clerk Halloran',
          'Yes Gulch. Tell him what you found.',
          ()=>{ const n = this.namedNpc('halloran');
                const t = this.townByKey('gulch');
                return n ? n.pos : new THREE.Vector3(t.x,t.y,t.z); });
      } else this._nextHoldout();
    }
  }

  onTalk(){ /* scripted scenes handle the plot; barks handle everything else */ }

  /* Point at whichever of the four is closest and still unmet. */
  _nextHoldout(){
    const done = new Set(this.met || []);
    const remaining = NAMED.filter(n=>n.id !== 'halloran' && !done.has(n.id));
    if(!remaining.length) return;
    const p = this.game.player.pos;
    let best = remaining[0], bd = Infinity;
    for(const n of remaining){
      const t = this.townByKey(n.town);
      if(!t) continue;
      const d = Math.hypot(t.x-p.x, t.z-p.z);
      if(d < bd){ bd = d; best = n; }
    }
    const t = this.townByKey(best.town);
    const pretty = best.name.replace(/\b([A-Z])([A-Z']+)/g,
      (m,a,b)=>a+b.toLowerCase());
    this.setObjective(`Find ${pretty}`,
      `${t ? t.name : ''} — ${Math.round(bd)} m`,
      ()=>{ const n = this.namedNpc(best.id);
            return n ? n.pos : (t ? new THREE.Vector3(t.x,t.y,t.z) : null); });
  }
  advance(act){
    if(act <= this.act) return;
    this.act = act;
    this.game.player.setAct(act);
    const A = ACTS[act];
    this.game.ui.toast(A.name.toUpperCase(), A.card, 6);
    if(this.game.audio.ready) this.game.audio.music.setKey();
  }
}
/* ==========================================================================
   ENTRY
   ========================================================================== */
const GAME = new Game();
window.GAME = GAME;

window.addEventListener('resize', ()=>{
  if(!GAME.renderer) return;
  GAME.camera.aspect = innerWidth/innerHeight;
  GAME.camera.updateProjectionMatrix();
  GAME.renderer.setSize(innerWidth, innerHeight);
  GAME.composer.setSize(
    Math.floor(innerWidth*GAME.renderer.getPixelRatio()),
    Math.floor(innerHeight*GAME.renderer.getPixelRatio()));
});

document.getElementById('bootGo').addEventListener('click', ()=>{
  GAME.start();
  GAME.renderer.domElement.requestPointerLock();
});

/* Backgrounding the tab parks the frame loop but not the audio clock. Park the
   audio too, and reset the frame clock on return so the first frame back is an
   ordinary one instead of a several-second catch-up. */
document.addEventListener('visibilitychange', ()=>{
  if(!GAME.audio) return;
  if(document.hidden){ GAME.audio.suspend(); }
  else {
    GAME.audio.resume();
    GAME.last = performance.now()/1000;
    GAME.acc = 0;
    if(GAME.audio.music) GAME.audio.music.nextTime = 0;
  }
});
window.addEventListener('blur', ()=>{ if(GAME.audio) GAME.audio.suspend(); });
window.addEventListener('focus', ()=>{
  if(!GAME.audio) return;
  GAME.audio.resume();
  GAME.last = performance.now()/1000;
  GAME.acc = 0;
  if(GAME.audio.music) GAME.audio.music.nextTime = 0;
});

GAME.boot().catch(err=>{
  console.error(err);
  const line = String(err.stack||'').split('\n')[1] || '';
  document.getElementById('bootStep').innerHTML =
    'the wire went down: ' + err.message +
    '<br><span style="opacity:.55;font-size:11px">' +
    line.trim().replace(/</g,'&lt;') + ' &nbsp;·&nbsp; three r' +
    (THREE.REVISION||'?') + ' &nbsp;·&nbsp; full trace in the browser console' +
    '</span>';
});
</script>
