  shack(rnd){
    const parts=[], signs=[], lamps=[];
    const w = M.range(rnd, 3.2, 4.8), d = M.range(rnd, 3.6, 5.2);
    const h = M.range(rnd, 2.4, 3.1);
    bldBox(0, h/2, 0, w, h, d, BM.BOARD, parts);
    bldPrism(0, h, 0, w+0.2, M.range(rnd,0.55,1.0), d+0.18, BM.ROOF, parts);
    bldBox(0, 0.98, d/2+0.06, 0.88, 1.95, 0.08, BM.TIMBER, parts);
    if(rnd()<0.6) bldBox(w/3, 1.60, d/2+0.06, 0.72, 0.72, 0.06, BM.GLASS, parts);
    bldPost(w/3, -d/4, h+0.4, h+1.6, 0.075, BM.METAL, parts, 3);
    return { parts, signs, lamps, w:w+0.4, d:d+0.4, h:h+1.8 };
  },

  watertower(rnd){
    const parts=[], signs=[], lamps=[];
    const legH = M.range(rnd, 5.5, 7.6), r = 2.3;
    for(let i=0;i<4;i++){
      const a = i/4*Math.PI*2 + Math.PI/4;
      const lx = Math.cos(a)*1.55, lz = Math.sin(a)*1.55;
      const g = new THREE.CylinderGeometry(0.10, 0.15, legH, 5);
      g.applyMatrix4(new THREE.Matrix4().makeRotationAxis(
        new THREE.Vector3(-lz,0,lx).normalize(), -0.085));
      g.translate(lx*1.35, legH/2, lz*1.35);
      parts.push({geo:g, group:BM.TIMBER});
    }
    for(const yy of [legH*0.4, legH*0.75]){
      const ring = new THREE.TorusGeometry(2.2, 0.045, 4, 12);
      ring.rotateX(Math.PI/2); ring.translate(0, yy, 0);
      parts.push({geo:ring, group:BM.METAL});
    }
    const tank = new THREE.CylinderGeometry(r, r*0.98, 3.6, 14, 1, true);
    tank.translate(0, legH+1.8, 0); parts.push({geo:tank, group:BM.BOARD});
    const lid = new THREE.ConeGeometry(r*1.09, 0.9, 14);
    lid.translate(0, legH+3.95, 0); parts.push({geo:lid, group:BM.ROOF});
    const base = new THREE.CircleGeometry(r, 14);
    base.rotateX(Math.PI/2); base.translate(0, legH, 0);
    parts.push({geo:base, group:BM.BOARD});
    for(const yy of [legH+0.8, legH+2.9]){
      const b = new THREE.TorusGeometry(r+0.04, 0.055, 4, 14);
      b.rotateX(Math.PI/2); b.translate(0, yy, 0);
      parts.push({geo:b, group:BM.METAL});
    }
    return { parts, signs, lamps, w:5.4, d:5.4, h:legH+4.5 };
  },

  /* ---- Mine headframe: the silhouette that defines a copper town -------- */
  headframe(rnd){
    const parts=[], signs=[], lamps=[];
    const H = 13.5;
    for(const [ox,oz] of [[-1.5,-1.5],[1.5,-1.5],[-1.5,1.5],[1.5,1.5]]){
      const g = new THREE.CylinderGeometry(0.16, 0.22, H, 5);
      g.applyMatrix4(new THREE.Matrix4().makeRotationAxis(
        new THREE.Vector3(-oz,0,ox).normalize(), 0.075));
      g.translate(ox, H/2, oz);
      parts.push({geo:g, group:BM.TIMBER});
    }
    for(const y of [3.5, 7.0, 10.5]){
      bldBox(0, y, -1.5, 3.2, 0.14, 0.14, BM.TIMBER, parts);
      bldBox(0, y,  1.5, 3.2, 0.14, 0.14, BM.TIMBER, parts);
      bldBox(-1.5, y, 0, 0.14, 0.14, 3.2, BM.TIMBER, parts);
      bldBox( 1.5, y, 0, 0.14, 0.14, 3.2, BM.TIMBER, parts);
    }
    // Sheave wheel.
    const wheel = new THREE.TorusGeometry(1.5, 0.16, 6, 18);
    wheel.translate(0, H+0.4, 0); parts.push({geo:wheel, group:BM.METAL});
    for(let i=0;i<6;i++){
      const a=i/6*Math.PI*2;
      const sp = new THREE.BoxGeometry(0.09, 2.9, 0.09);
      sp.rotateZ(a); sp.translate(0, H+0.4, 0);
      parts.push({geo:sp, group:BM.METAL});
    }
    bldBox(0, H+0.4, 0, 0.3, 0.3, 1.0, BM.METAL, parts);
    // Ore chute running down to a bin.
    bldBox(2.6, 4.0, 0, 3.0, 0.20, 1.6, BM.BOARD, parts);
    bldBox(4.4, 2.2, 0, 2.2, 2.4, 2.0, BM.BOARD, parts);
    bldBox(0, 0.6, 0, 3.6, 1.2, 3.6, BM.TIMBER, parts);
    return { parts, signs, lamps, w:9.0, d:5.2, h:H+2 };
  },

  /* ---- Wind pump: the sound of the Flats -------------------------------- */
  windpump(rnd){
    const parts=[], signs=[], lamps=[];
    const H = M.range(rnd, 7.0, 9.5);
    for(const [ox,oz] of [[-0.9,-0.9],[0.9,-0.9],[-0.9,0.9],[0.9,0.9]]){
      const g = new THREE.CylinderGeometry(0.06, 0.11, H, 4);
      g.applyMatrix4(new THREE.Matrix4().makeRotationAxis(
        new THREE.Vector3(-oz,0,ox).normalize(), 0.105));
      g.translate(ox, H/2, oz); parts.push({geo:g, group:BM.METAL});
    }
    for(const y of [H*0.3, H*0.6, H*0.85]){
      bldBox(0, y, -0.9*(1-y/H*0.5), 1.9, 0.06, 0.06, BM.METAL, parts);
      bldBox(0, y,  0.9*(1-y/H*0.5), 1.9, 0.06, 0.06, BM.METAL, parts);
    }
    const hub = new THREE.CylinderGeometry(0.22,0.22,0.3,8);
    hub.rotateX(Math.PI/2); hub.translate(0, H+0.5, 0.4);
    parts.push({geo:hub, group:BM.METAL});
    for(let i=0;i<14;i++){
      const a = i/14*Math.PI*2;
      const bl = new THREE.BoxGeometry(0.20, 1.5, 0.03);
      bl.translate(0, 0.95, 0); bl.rotateZ(a); bl.rotateY(0.32);
      bl.translate(0, H+0.5, 0.46);
      parts.push({geo:bl, group:BM.METAL});
    }
    const rim = new THREE.TorusGeometry(1.62, 0.035, 4, 16);
    rim.translate(0, H+0.5, 0.46); parts.push({geo:rim, group:BM.METAL});
    bldBox(0, H+0.5, -1.3, 0.05, 1.1, 1.7, BM.METAL, parts);   // tail vane
    bldBox(0, 0.45, 0, 2.2, 0.9, 2.2, BM.BOARD, parts);        // tank at the foot
    return { parts, signs, lamps, w:3.6, d:3.6, h:H+2.2 };
  },

  /* ---- Tent: the whole of Signal Ridge Camp ---------------------------- */
  tent(rnd){
    const parts=[], signs=[], lamps=[];
    const w = M.range(rnd, 3.0, 4.2), d = M.range(rnd, 3.6, 5.0), h = 2.3;
    bldBox(0, 0.35, 0, w*0.94, 0.70, d*0.94, BM.BOARD, parts);
    bldPrism(0, 0.7, 0, w, h, d, BM.ROOF, parts);
    for(const sz of [-d/2, d/2]) bldPost(0, sz, 0, h+0.7, 0.055, BM.TIMBER, parts, sz);
    for(const [ox,oz] of [[-w/2-0.7,-d/2-0.7],[w/2+0.7,-d/2-0.7],
                          [-w/2-0.7,d/2+0.7],[w/2+0.7,d/2+0.7]]){
      const g = new THREE.CylinderGeometry(0.02,0.02,
        Math.hypot(1.0, h*0.8), 3);
      g.rotateX(0.7); g.translate(ox*0.75, 0.7, oz*0.75);
      parts.push({geo:g, group:BM.METAL});
    }
    return { parts, signs, lamps, w:w+1.6, d:d+1.6, h:h+0.8 };
  },

  /* ---- Railway station: platform, shelter, name board, water column ----- */
  station(rnd, name){
    const parts=[], signs=[], lamps=[];
    const PL = 26, PW = 5.2, PH = 0.95;
    // Platform, faced with timber and decked on top.
    bldBox(0, PH/2, -PW/2 - 1.4, PL, PH, PW, BM.STONE, parts);
    bldBox(0, PH+0.06, -PW/2 - 1.4, PL, 0.14, PW, BM.BOARD, parts);
    for(let i=0;i<9;i++)
      bldBox(-PL/2 + (i+0.5)*(PL/9), PH*0.5, -0.05, 0.9, PH, 0.16, BM.TIMBER, parts);
    /* Ramps at both ends, the full depth of the platform. Without them the
       platform is a metre-high wall — too tall to step onto, so you either walk
       through it or bounce off it. The ends are where a real platform ramps,
       and they are clear of the station building, unlike the back. */
    for(const end of [-1, 1]){
      for(let k=0;k<4;k++){       // four treads: 240mm each, well inside a stride
        const h = PH*(k+1)/4;
        bldBox(end*(PL/2 + 0.7 + (3-k)*1.45), h/2, -PW/2 - 1.4,
               2.9, h, PW + 0.8, BM.BOARD, parts);
      }
    }

    // Station building, back from the platform edge.
    const bw = 9.5, bd = 5.0, bh = 3.7;
    const bz = -PW - 1.4;
    bldBox(0, PH+0.13+bh/2, bz, bw, bh, bd, BM.BOARD, parts);
    bldPrism(0, PH+0.13+bh, bz, bw+0.4, 1.5, bd+0.4, BM.ROOF, parts);
    // Deep canopy over the platform — the shape that says station.
    bldBox(0, PH+0.13+bh-0.15, bz+bd/2+1.9, bw+1.2, 0.16, 3.8, BM.ROOF, parts);
    for(const sx of [-bw/2+0.4, 0, bw/2-0.4])
      bldPost(sx, bz+bd/2+3.5, PH+0.13, PH+0.13+bh-0.15, 0.085, BM.TIMBER, parts, sx*7);
    bldBox(0, PH+1.28, bz+bd/2+0.08, 1.15, 2.25, 0.12, BM.TIMBER, parts);
    for(const sx of [-bw/3.2, bw/3.2])
      bldBox(sx, PH+1.85, bz+bd/2+0.07, 1.25, 1.35, 0.08, BM.GLASS, parts);
    // Bench, and a clock over the door.
    bldBox(-bw/4, PH+0.55, bz+bd/2+0.75, 2.0, 0.10, 0.5, BM.TIMBER, parts);
    for(const sx of [-bw/4-0.85, -bw/4+0.85])
      bldBox(sx, PH+0.32, bz+bd/2+0.75, 0.10, 0.45, 0.45, BM.TIMBER, parts);
    bldBox(0, PH+3.05, bz+bd/2+0.10, 0.62, 0.62, 0.08, BM.GLASS, parts);

    // Water column at the far end of the platform.
    bldPost(PL/2-2.0, 1.2, PH, PH+4.2, 0.16, BM.METAL, parts, 3);
    bldBox(PL/2-2.0, PH+4.6, 1.2, 1.6, 1.5, 1.6, BM.BOARD, parts);
    bldBox(PL/2-3.1, PH+3.9, 1.2, 2.2, 0.20, 0.20, BM.METAL, parts);

    signs.push({ text:name, x:0, y:PH+0.13+bh+0.55, z:bz+bd/2+0.20,
                 w:6.4, h:0.85, accent:'#00A3A6', bg:'#14312f' });
    signs.push({ text:name, x:-PL/2+3.6, y:PH+1.9, z:0.18, w:4.2, h:0.62 });
    lamps.push({ x:-PL/2+4, y:PH+3.2, z:-1.2 });
    lamps.push({ x: PL/2-5, y:PH+3.2, z:-1.2 });
    return { parts, signs, lamps, w:PL+2, d:PW+bd+6, h:bh+3, platform:{PL,PW,PH} };
  },

  /* ---- Aerial mast: the reason the camp exists at all ------------------- */
  mast(rnd){
    const parts=[], signs=[], lamps=[];
    const H = M.range(rnd, 12, 17);
    bldPost(0,0, 0, H, 0.20, BM.TIMBER, parts, 5);
    for(let i=0;i<5;i++){
      const y = H*(0.35 + i*0.14);
      const len = 3.4 - i*0.42;
      bldBox(0, y, 0, len, 0.09, 0.09, BM.TIMBER, parts);
      for(const ox of [-len/2+0.2, len/2-0.2])
        bldBox(ox, y+0.18, 0, 0.10, 0.22, 0.10, BM.GLASS, parts);
    }
    for(const a of [0, 2.09, 4.19]){
      const g = new THREE.CylinderGeometry(0.03,0.03, H*1.15, 3);
      g.rotateZ(0.30); g.rotateY(a);
      g.translate(Math.cos(a)*H*0.19, H*0.48, Math.sin(a)*H*0.19);
      parts.push({geo:g, group:BM.METAL});
    }
    return { parts, signs, lamps, w:4.0, d:4.0, h:H };
  },
};

/* ---- Street furniture and outskirt features ------------------------------ */
function makeProps(rnd, kind){
  const parts=[];
  switch(kind){
    case 'hitch':
      bldPost(-1.2, 0, 0, 1.20, 0.080, BM.TIMBER, parts, 1);
      bldPost( 1.2, 0, 0, 1.20, 0.080, BM.TIMBER, parts, 2);
      bldBox(0, 1.15, 0, 2.6, 0.12, 0.12, BM.TIMBER, parts);
      break;
    case 'barrel': {
      const g = new THREE.CylinderGeometry(0.36,0.31,0.92,10);
      g.translate(0,0.46,0); parts.push({geo:g, group:BM.BOARD});
      for(const yy of [0.20,0.72]){
        const r = new THREE.TorusGeometry(0.355,0.028,4,10);
        r.rotateX(Math.PI/2); r.translate(0,yy,0);
        parts.push({geo:r, group:BM.METAL});
      }
      break;
    }
    case 'crate': bldBox(0,0.29,0, 0.72,0.58,0.62, BM.BOARD, parts, 1.4); break;
    case 'trough':
      bldBox(0,0.28,0, 2.2,0.56,0.78, BM.BOARD, parts);
      bldBox(0,0.50,0, 2.05,0.10,0.66, BM.GLASS, parts); break;
    case 'fence':
      for(let i=0;i<5;i++) bldPost(-2+i, 0, 0, 1.10, 0.058, BM.TIMBER, parts, i);
      for(const yy of [0.48, 0.98]) bldBox(0,yy,0, 4.2,0.07,0.07, BM.TIMBER, parts);
      break;
    case 'lamp':
      bldPost(0,0, 0, 2.95, 0.068, BM.METAL, parts, 4);
      bldBox(0, 3.14, 0, 0.32, 0.38, 0.32, BM.GLASS, parts);
      { const cap = new THREE.ConeGeometry(0.26, 0.26, 6);
        cap.translate(0, 3.44, 0); parts.push({geo:cap, group:BM.METAL}); }
      break;
    case 'cart':
      bldBox(0,0.85,0, 1.6,0.58,2.8, BM.BOARD, parts);
      for(const sx of [-0.9,0.9]) for(const sz of [-0.9,1.0]){
        const wl = new THREE.TorusGeometry(0.60,0.078,5,12);
        wl.rotateY(Math.PI/2); wl.translate(sx,0.62,sz);
        parts.push({geo:wl, group:BM.TIMBER});
      }
      bldBox(0,0.9,2.0, 0.10,0.10,1.6, BM.TIMBER, parts); break;
    case 'headstone': {
      const g = new THREE.BoxGeometry(0.44,0.72,0.11);
      g.translate(0,0.36,0); parts.push({geo:g, group:BM.STONE});
      const top = new THREE.CylinderGeometry(0.22,0.22,0.11,8,1,false,0,Math.PI);
      top.rotateZ(Math.PI/2); top.rotateY(Math.PI/2); top.translate(0,0.72,0);
      parts.push({geo:top, group:BM.STONE}); break;
    }
    case 'firepit': {
      for(let i=0;i<9;i++){
        const a=i/9*Math.PI*2;
        const st = new THREE.DodecahedronGeometry(0.19,0);
        st.translate(Math.cos(a)*0.78, 0.10, Math.sin(a)*0.78);
        parts.push({geo:st, group:BM.STONE});
      }
      for(let i=0;i<5;i++){
        const a=i/5*Math.PI*2;
        const lg = new THREE.CylinderGeometry(0.06,0.075,1.0,5);
        lg.rotateZ(0.95); lg.rotateY(a); lg.translate(0,0.32,0);
        parts.push({geo:lg, group:BM.TIMBER});
      }
      break;
    }
    case 'orecart': {
      bldBox(0,0.62,0, 1.0,0.62,1.5, BM.METAL, parts);
      for(const sx of [-0.55,0.55]) for(const sz of [-0.5,0.5]){
        const wl = new THREE.TorusGeometry(0.28,0.06,4,10);
        wl.rotateY(Math.PI/2); wl.translate(sx,0.28,sz);
        parts.push({geo:wl, group:BM.METAL});
      }
      break;
    }
    case 'woodpile':
      for(let r=0;r<3;r++) for(let i=0;i<5-r;i++){
        const g = new THREE.CylinderGeometry(0.11,0.11,1.5,6);
        g.rotateZ(Math.PI/2);
        g.translate((i-(4-r)/2)*0.23, 0.12+r*0.20, 0);
        parts.push({geo:g, group:BM.TIMBER});
      }
      break;
    case 'gallows':
      bldPost(-1.3,0, 0, 3.6, 0.11, BM.TIMBER, parts, 1);
      bldPost( 1.3,0, 0, 3.6, 0.11, BM.TIMBER, parts, 2);
      bldBox(0, 3.55, 0, 3.0, 0.16, 0.16, BM.TIMBER, parts);
      bldBox(0, 0.55, 0, 3.2, 0.16, 2.2, BM.BOARD, parts);
      for(const sx of [-1.3,1.3]) bldPost(sx, 1.0, 0, 0.55, 0.09, BM.TIMBER, parts, 3);
      break;
  }
  return parts;
}
/* ==========================================================================
   TOWN PLANS
   Six towns, six different shapes. A town is laid out in its own (u,v) frame —
   u runs along the main axis, v across it — and each plan draws streets, a
   square, and outskirts differently. That is what stops them all reading as
   the same street with the signs swapped.
   ========================================================================== */
const STORE_NAMES = ['DRY GOODS','ASSAY OFFICE','HARDWARE','GENERAL STORE',
  'BARBER','UNDERTAKER','TIN & WIRE','LAUNDRY','BOOTMAKER','POST & PARCEL',
  'GUNSMITH','APOTHECARY','SADDLERY','MILLINER','BUTCHER','TAILOR',
  'PHOTOGRAPHER','LAND AGENT','FEED & SEED','COOPER','WHEELWRIGHT',
  'BLACKSMITH','TOBACCONIST','SURVEYOR','WATCHMAKER','PRINT SHOP',
  'BATH HOUSE','CHOP HOUSE','ICE & COLD STORE','SIGN PAINTER','GLAZIER',
  'HARNESS MAKER','STATIONER','DENTIST','TELEGRAPH SUPPLY','GROCER',
  'BAKERY','CANDLEMAKER','ROPEWALK','LIVERY OFFICE'];
const SALOON_NAMES = ['THE BROKEN AERIAL','THE LAST BAR','THE DEAD ZONE',
  'THE FULL SIGNAL','THE PATIENT MULE','THE CUT LINE','THE RELAY'];

const PLANS = {
  /* Yes Gulch — a company town: a long graded main street, a cross street,
     a square in front of the telegraph office, freight sheds by the rail. */
  company(T, town, ctx){
    const S = 17;
    T._row(town, ctx, { u0:-S*4.6, u1:S*4.6, side: 1, streetW:17,
                        mix:['store','store','saloon','store','hotel','store',
                             'bank','store','store','store'] });
    T._row(town, ctx, { u0:-S*4.6, u1:S*4.6, side:-1, streetW:17,
                        mix:['store','store','store','office','store','store',
                             'church','store','stable','store'] });
    // Cross street, running across the main one at the far end.
    T._row(town, ctx, { u0:26, u1:26+S*3, side: 1, streetW:15, across:true,
                        mix:['store','shack','store','store','shack'] });
    T._row(town, ctx, { u0:26, u1:26+S*3, side:-1, streetW:15, across:true,
                        mix:['warehouse','store','shack','store'] });
    T._place(town, ctx, 'watertower', -S*5.4, 24, 0);
    T._place(town, ctx, 'warehouse',  -S*5.6, -26, 1);
    T._place(town, ctx, 'warehouse',  -S*4.0, -27, 1);
    T._outskirt(town, ctx, 'corral',   S*5.6,  22);
    T._outskirt(town, ctx, 'cemetery',-S*6.4, -34);
    T._props(town, ctx, { lamp:9, hitch:7, barrel:16, crate:12, trough:3,
                          cart:4, woodpile:4, fence:5 });
  },

  /* Conway Creek — the street bends with the water, and the town backs onto
     a landing where everything arrives by boat. */
  river(T, town, ctx){
    const S = 13;
    for(let i=0;i<10;i++){
      const u = -S*3.4 + i*S*0.78;
      const bend = Math.sin(i/9*Math.PI)*7.5;      // the street follows the bend
      T._place(town, ctx, ['store','store','saloon','hotel','store','store',
                           'office','store','store','church'][i],
               u, 9.5 + bend, -1);
    }
    for(let i=0;i<8;i++){
      const u = -S*3.0 + i*S*0.82;
      const bend = Math.sin((i+0.5)/8*Math.PI)*7.5;
      T._place(town, ctx, ['warehouse','store','store','stable','store',
                           'shack','store','shack'][i],
               u, -9.5 + bend, 1);
    }
    T._place(town, ctx, 'warehouse', S*3.4, -22, 1);
    T._outskirt(town, ctx, 'jetty', -S*1.2, -34);
    T._outskirt(town, ctx, 'corral', S*3.6, 20);
    T._props(town, ctx, { lamp:7, hitch:6, barrel:20, crate:16, trough:2,
                          cart:3, woodpile:3 });
  },

  /* Pudmenzky Flats — wide, spread out, and mostly empty. Buildings sit far
     apart because there is nothing here to be close to. */
  dust(T, town, ctx){
    const S = 16;
    T._row(town, ctx, { u0:-S*3.4, u1:S*3.4, side: 1, streetW:26, gap:[7,16],
                        mix:['store','saloon','store','shack'] });
    T._row(town, ctx, { u0:-S*3.2, u1:S*3.4, side:-1, streetW:26, gap:[7,16],
                        mix:['office','store','shack','stable'] });
    for(let i=0;i<5;i++)
      T._place(town, ctx, 'windpump',
        -S*3 + i*S*1.6, (i%2? 1:-1)*(30 + (i%3)*11), 0);
    T._place(town, ctx, 'watertower', S*3.8, -14, 0);
    T._outskirt(town, ctx, 'saltpan', 0, 44);
    T._outskirt(town, ctx, 'cemetery', -S*4.2, 30);
    T._props(town, ctx, { lamp:4, hitch:5, barrel:9, crate:6, trough:2,
                          fence:9, woodpile:2 });
  },

  /* McRoberts Crossing — a genuine crossroads. Two full streets meeting at
     right angles, the law on the corner, and a gallows nobody talks about. */
  law(T, town, ctx){
    const S = 15;
    T._row(town, ctx, { u0:-S*3.6, u1:-14, side: 1, streetW:16,
                        mix:['store','store','saloon','store'] });
    T._row(town, ctx, { u0:-S*3.6, u1:-14, side:-1, streetW:16,
                        mix:['store','stable','store','store'] });
    T._row(town, ctx, { u0:16, u1:S*3.6, side: 1, streetW:16,
                        mix:['hotel','store','store','store'] });
    T._row(town, ctx, { u0:16, u1:S*3.6, side:-1, streetW:16,
                        mix:['store','store','church','store'] });
    T._row(town, ctx, { u0:16, u1:16+S*2.6, side: 1, streetW:15, across:true,
                        mix:['store','store','shack'] });
    T._row(town, ctx, { u0:-16-S*2.6, u1:-16, side:-1, streetW:15, across:true,
                        mix:['bank','store','store'] });
    // The four corners of the crossing.
    T._place(town, ctx, 'courthouse',  0,  20, -1);
    T._place(town, ctx, 'jail',       14, -19,  1);
    T._place(town, ctx, 'office',    -15, -19,  1);
    T._outskirt(town, ctx, 'gallowsyard', 22, -30);
    T._outskirt(town, ctx, 'corral', -S*4.0, 26);
    T._props(town, ctx, { lamp:10, hitch:8, barrel:12, crate:9, trough:4,
                          cart:3, fence:4 });
  },

  /* Dedman Gulch — built up a slope around the headframe. Nothing is level,
     nothing is square, and the tailings are creeping toward the shacks. */
  mine(T, town, ctx){
    const S = 13;
    T._row(town, ctx, { u0:-S*2.6, u1:S*2.6, side: 1, streetW:13,
                        mix:['store','saloon','store','store','office'] });
    T._row(town, ctx, { u0:-S*2.6, u1:S*2.6, side:-1, streetW:13,
                        mix:['store','store','stable','store','store'] });
    T._place(town, ctx, 'headframe', S*2.4, -30, 1);
    T._place(town, ctx, 'warehouse', S*1.0, -30, 1);
    T._place(town, ctx, 'watertower', -S*3.0, -22, 0);
    // Shanties climbing the hill behind the street, in rough terraces.
    for(let i=0;i<12;i++){
      const row = Math.floor(i/4);
      T._place(town, ctx, 'shack',
        -S*2.2 + (i%4)*S*1.15 + row*4.5, 24 + row*11, -1);
    }
    T._outskirt(town, ctx, 'tailings', S*3.6, -46);
    T._outskirt(town, ctx, 'cemetery', -S*3.4, 30);
    T._props(town, ctx, { lamp:6, hitch:5, barrel:14, crate:12, orecart:5,
                          woodpile:5, trough:2, fence:3 });
  },

  /* Signal Ridge Camp — no permanent buildings at all. Tents in a horseshoe
     around a fire, and the masts that are the whole point of the place. */
  camp(T, town, ctx){
    for(let i=0;i<11;i++){
      const a = -1.15 + (i/10)*2.30;
      const r = 15 + (i%3)*4.5;
      T._place(town, ctx, 'tent', Math.sin(a)*r, Math.cos(a)*r, -1, a+Math.PI);
    }
    T._place(town, ctx, 'shack', -22, -6, 1);
    T._place(town, ctx, 'stable', 24, -4, -1);
    T._place(town, ctx, 'mast', -8, -30, 0);
    T._place(town, ctx, 'mast',  9, -34, 0);
    T._place(town, ctx, 'mast',  0, -46, 0);
    T._place(town, ctx, 'watertower', 26, 20, 0);
    T._props(town, ctx, { firepit:1, woodpile:6, crate:14, barrel:10,
                          hitch:3, cart:2, lamp:2 });
  },
};

/* ==========================================================================
   TOWN MANAGER
   ========================================================================== */
class Towns {
  constructor(terrain, lib, colliders){
    this.terrain = terrain; this.lib = lib; this.colliders = colliders;
    this.list = [];
    this.built = new Map();
    this.mats = this._materials(lib);
    this.propGeo = {};
    for(const k of ['hitch','barrel','crate','trough','fence','lamp','cart',
                    'headstone','firepit','orecart','woodpile','gallows']){
      this.propGeo[k] = mergeParts(makeProps(M.rng(k.length*77+k.charCodeAt(0)), k));
    }
    this.current = null;
    this._buildingThisFrame = false;
  }

  _materials(lib){
    const S=(t,extra={})=> new THREE.MeshStandardMaterial(Object.assign({
      map:t.map, roughnessMap:t.roughnessMap, normalMap:t.normalMap,
      roughness:1, metalness:0 }, extra));
    const board  = S(lib.wood_weathered, {color:0xffffff, vertexColors:true});
    const timber = S(lib.wood_dark,      {color:0xffffff, vertexColors:true});
    const roof   = S(lib.wood_dark,      {color:0xffffff, vertexColors:true});
    const stone  = S(lib.rock_grey,      {color:0xffffff, vertexColors:true});
    const metal  = S(lib.metal_iron,     {color:0xffffff, vertexColors:true,
                                          metalness:0.55, roughness:0.55});
    const glass = new THREE.MeshStandardMaterial({
      color:0x14161a, roughness:0.18, metalness:0.10, vertexColors:false,
      emissive:new THREE.Color(0xffb347), emissiveIntensity:0.0 });
    this.glass = glass;
    return [board,timber,roof,glass,stone,metal];
  }

  /* ---- Site selection + grading ----------------------------------------- */
  place(){
    const T = this.terrain;
    const taken = [];
    for(const def of TOWNS){
      const site = this._pickSite(def.near[0], def.near[1], 240, taken);
      taken.push(site);
      const radius = 34 + def.size*4.4;
      T.flattenDisc(site.x, site.z, radius, radius*0.85, site.y);
      (T.flatZones = T.flatZones || []).push(
        { x:site.x, z:site.z, r:radius, f:radius*0.85 });
      this.list.push(Object.assign({}, def, {
        x:site.x, z:site.z, y:site.y, radius,
        angle: M.rng(def.key.length*911 + def.key.charCodeAt(0))()*Math.PI*2,
      }));
    }
    return this.list;
  }

  _pickSite(cx, cz, searchR, taken=[]){
    const T = this.terrain;
    let best=null, bestScore=-1e9;
    for(let i=0;i<520;i++){
      const a = (i*2.399963), r = searchR*Math.sqrt(i/520);
      const x = M.clamp(cx + Math.cos(a)*r, -CFG.HALF+200, CFG.HALF-200);
      const z = M.clamp(cz + Math.sin(a)*r, -CFG.HALF+200, CFG.HALF-200);
      const y = T.heightAt(x,z);
      if(y < CFG.SEA + 3.0 || y > CFG.SNOWLINE - 20) continue;
      let relief = 0;
      for(let k=0;k<10;k++){
        const aa = k/10*Math.PI*2;
        relief += Math.abs(T.heightAt(x+Math.cos(aa)*36, z+Math.sin(aa)*36) - y);
      }
      /* Two towns on top of each other is worse than a town on a slope, so
         crowding is a hard reject rather than a penalty. */
      let crowded = false;
      for(const o of taken)
        if(Math.hypot(x-o.x, z-o.z) < CFG.TOWN_MIN_GAP){ crowded = true; break; }
      if(crowded) continue;
      const score = -relief*1.4 - Math.hypot(x-cx, z-cz)*0.010
                  + (T.sample(T.river,x,z) > 0.05 ? 7 : 0);
      if(score > bestScore){ bestScore=score; best={x,z,y}; }
    }
    /* If nothing legal turned up, push away from the nearest neighbour and
       take the best ground there rather than stacking two towns. */
    if(!best && taken.length){
      let near = taken[0], nd = Infinity;
      for(const o of taken){ const d=Math.hypot(cx-o.x,cz-o.z);
        if(d<nd){ nd=d; near=o; } }
      const a = Math.atan2(cz-near.z, cx-near.x);
      const x = M.clamp(near.x + Math.cos(a)*CFG.TOWN_MIN_GAP*1.15,
                        -CFG.HALF+200, CFG.HALF-200);
      const z = M.clamp(near.z + Math.sin(a)*CFG.TOWN_MIN_GAP*1.15,
                        -CFG.HALF+200, CFG.HALF-200);
      best = { x, z, y:T.heightAt(x,z) };
    }
    return best || {x:cx, z:cz, y:this.terrain.heightAt(cx,cz)};
  }

  /* ---- Town-space helpers ----------------------------------------------- */
  _toWorld(town, u, v){
    const ca=Math.cos(town.angle), sa=Math.sin(town.angle);
    return new THREE.Vector3(town.x + u*ca - v*sa, 0, town.z + u*sa + v*ca);
  }

  /* Place one building at town-space (u,v). `side` is which way it faces:
     +1 means it sits on the +v kerb and looks back toward the street. */
  _place(town, ctx, kind, u, v, side, explicitRot){
    const gen = BUILDINGS[kind];
    if(!gen) return 0;
    const name = kind==='store'  ? STORE_NAMES[(ctx.rnd()*STORE_NAMES.length)|0]
              : kind==='saloon' ? SALOON_NAMES[(ctx.rnd()*SALOON_NAMES.length)|0]
              : kind==='office' ? `${town.name.split(' ')[0].toUpperCase()} TELEGRAPH`
              : kind==='hotel'  ? `${town.name.split(' ')[0].toUpperCase()} HOTEL`
              : kind==='bank'   ? 'MERIDIAN BANK'
              : kind==='church' ? 'ST. AERIAL'
              : kind==='jail'   ? 'GAOL'
              : kind==='courthouse' ? 'COURT HOUSE'
              : kind==='warehouse'  ? 'GRAND MERIDIAN FREIGHT'
              : undefined;
    const b = gen(ctx.rnd, name);

    /* Give the building a coat of paint. Roofs and stone keep their own
       colour; only the boarding and trim take it, which is how a real street
       looks — a row of different buildings, not a row of different colours. */
    const paint = PAINTS[(ctx.rnd()*PAINTS.length)|0];
    const fade = 0.82 + ctx.rnd()*0.30;
    const body = new THREE.Color(paint.body).multiplyScalar(fade);
    const trim = new THREE.Color(paint.trim).multiplyScalar(fade);
    const roofC = new THREE.Color(ROOF_TINTS[(ctx.rnd()*ROOF_TINTS.length)|0]);
    const stoneC = new THREE.Color(0xa8a49c).multiplyScalar(0.9 + ctx.rnd()*0.22);
    const tintFor = (g)=> g===BM.BOARD ? body : g===BM.TIMBER ? trim
                        : g===BM.ROOF ? roofC : g===BM.STONE ? stoneC
                        : new THREE.Color(0xb0aca6);

    /* A building's front is its local +Z. To face the street it must look
       along -side in the town's v axis, which works out to these two angles. */
    const rot = explicitRot !== undefined ? town.angle + explicitRot
              : (side > 0 ? Math.PI - town.angle : -town.angle);
    const p = this._toWorld(town, u, v + (side ? side*b.d*0.5 : 0));
    p.y = this.terrain.heightAt(p.x, p.z);

    const mtx = new THREE.Matrix4().compose(p,
      new THREE.Quaternion().setFromEuler(new THREE.Euler(0, rot, 0)),
      new THREE.Vector3(1,1,1));

    for(const part of b.parts){
      const g = part.geo.clone(); g.applyMatrix4(mtx);
      ctx.parts.push({geo:g, group:part.group, color:tintFor(part.group)});
    }
    for(const s of b.signs)
      ctx.signs.push({ text:s.text, pos:new THREE.Vector3(s.x,s.y,s.z).applyMatrix4(mtx),
                       rot, w:s.w, h:s.h, accent:s.accent, bg:s.bg });
    for(const l of b.lamps)
      ctx.lamps.push(new THREE.Vector3(l.x,l.y,l.z).applyMatrix4(mtx));

    // Colliders come straight off the parts, in the building's own frame.
    ctx.colliderJobs.push({ parts:b.parts, mtx, rot });

    // Somewhere for a person to stand: on the boardwalk, facing the road.
    if(side){
      ctx.npcSpots.push({
        pos: this._toWorld(town, u, v - side*1.4).setY(0),
        facing: rot + Math.PI, kind });
    }
    return b.w;
  }

  /* Fill a run of street with buildings, front doors on the kerb. */
  _row(town, ctx, opts){
    const { u0, u1, side, streetW, mix, gap=[1.2,3.6], across=false } = opts;
    /* Shuffle the mix, and never place the same archetype twice running: a
       street of six identical false fronts is the tell that a town was
       generated rather than built. */
    const bag = mix.slice();
    for(let k=bag.length-1;k>0;k--){
      const j = (ctx.rnd()*(k+1))|0; [bag[k],bag[j]] = [bag[j],bag[k]];
    }
    let last = null, u = u0, i = 0;
    const kerb = side*(streetW/2);
    while(u < u1 && i < 60){
      let kind = bag[i % bag.length];
      if(kind === last && bag.length > 1) kind = bag[(i+1) % bag.length];
      last = kind;
      const w = across
        ? this._place(town, ctx, kind, side*(streetW/2 + 5.0), u, 0,
                      side>0 ? -Math.PI/2 : Math.PI/2)
        : this._place(town, ctx, kind, u + 3, kerb, side);
      if(across){
        // Across-streets run along v, so advance v instead of u.
        const b = w || 7;
        ctx.acrossCursor = (ctx.acrossCursor||0);
        u += b + M.range(ctx.rnd, gap[0], gap[1]);
      } else {
        u += (w||7) + M.range(ctx.rnd, gap[0], gap[1]);
      }
      i++;
    }
    // Boardwalk down the kerb — walkable, not solid.
    if(!across){
      const len = u - u0 + 6;
      const p = this._toWorld(town, u0 + len/2 - 3, kerb - side*0.85);
      p.y = this.terrain.heightAt(p.x, p.z);
      const g = new THREE.BoxGeometry(len, 0.22, 1.7);
      g.applyMatrix4(new THREE.Matrix4().compose(
        new THREE.Vector3(p.x, p.y+0.11, p.z),
        new THREE.Quaternion().setFromEuler(new THREE.Euler(0, town.angle, 0)),
        new THREE.Vector3(1,1,1)));
      ctx.parts.push({geo:g, group:BM.BOARD});
      ctx.walkways.push({ x:p.x, y:p.y, z:p.z, hw:len/2, hh:0.11, hd:0.85,
                          yaw:town.angle });
    }
    ctx.streetLen = Math.max(ctx.streetLen||0, u - u0);
  }

  /* A station, squared up to the permanent way rather than to the street. */
  _station(town, ctx){
    const st = this.stationFor && this.stationFor(town.key);
    if(!st) return;
    const b = BUILDINGS.station(ctx.rnd, town.name.toUpperCase());
    // Set back from the centreline so the platform edge meets the track.
    const side = new THREE.Vector3(-st.dir.z, 0, st.dir.x);
    const p = st.pos.clone().addScaledVector(side, 4.2);
    p.y = this.terrain.heightAt(p.x, p.z);
    const rot = st.angle + Math.PI/2;
    const mtx = new THREE.Matrix4().compose(p,
      new THREE.Quaternion().setFromEuler(new THREE.Euler(0, rot, 0)),
      new THREE.Vector3(1,1,1));
    const body = new THREE.Color(0xdcd3b8), trim = new THREE.Color(0x4a5f52);
    const tintFor = (g)=> g===BM.BOARD ? body : g===BM.TIMBER ? trim
                        : g===BM.ROOF ? new THREE.Color(0x5a5148)
                        : g===BM.STONE ? new THREE.Color(0x9d9890)
                        : new THREE.Color(0xb0aca6);
    for(const part of b.parts){
      const g = part.geo.clone(); g.applyMatrix4(mtx);
      ctx.parts.push({geo:g, group:part.group, color:tintFor(part.group)});
    }
    for(const s of b.signs)
      ctx.signs.push({ text:s.text,
        pos:new THREE.Vector3(s.x,s.y,s.z).applyMatrix4(mtx),
        rot, w:s.w, h:s.h, accent:s.accent, bg:s.bg });
    for(const l of b.lamps)
      ctx.lamps.push(new THREE.Vector3(l.x,l.y,l.z).applyMatrix4(mtx));
    /* A platform is nearly a metre high, so the default wall threshold made
       the whole thing solid and you could not get onto it. Raise the bar for
       the station: anything under 1.4 m here is a surface, not an obstacle. */
    ctx.colliderJobs.push({ parts:b.parts, mtx, rot });
    for(let k=0;k<4;k++)
      ctx.npcSpots.push({
        pos: p.clone().addScaledVector(new THREE.Vector3(
          Math.cos(rot), 0, -Math.sin(rot)), -8 + k*5.5),
        facing: rot, kind:'station' });
    // A short spur of road from the town out to the platform.
    ctx.propInstances.push({kind:'cart', pos:p.clone().addScaledVector(side, 7),
                            yaw:rot});
    ctx.propInstances.push({kind:'crate', pos:p.clone().addScaledVector(side, 5.6),
                            yaw:rot});
    ctx.station = { pos:p, rot };
  }

  /* Outskirt features — the things that sit beyond the last building. */
  _outskirt(town, ctx, kind, u, v){
    const rnd = ctx.rnd;
    const at = (uu,vv)=>{ const p=this._toWorld(town,uu,vv);
                          p.y=this.terrain.heightAt(p.x,p.z); return p; };
    switch(kind){
      case 'corral': {
        const R = 13;
        for(let i=0;i<22;i++){
          const a=i/22*Math.PI*2;
          const p = at(u+Math.cos(a)*R, v+Math.sin(a)*R);
          ctx.propInstances.push({kind:'fence', pos:p,
            yaw: town.angle + a + Math.PI/2, skip:(i%11===0)});
        }
        ctx.propInstances.push({kind:'trough', pos:at(u,v+R-2.5), yaw:town.angle});
        break;
      }
      case 'cemetery': {
        for(let i=0;i<16;i++){
          const gx = u + (i%4)*2.6 - 3.9, gz = v + Math.floor(i/4)*3.0 - 4.5;
          ctx.propInstances.push({kind:'headstone', pos:at(gx,gz),
            yaw: town.angle + M.imperfection(i*31, 0.12)});
        }
        for(let i=0;i<12;i++){
          const a=i/12*Math.PI*2;
          ctx.propInstances.push({kind:'fence',
            pos:at(u+Math.cos(a)*9.5, v+Math.sin(a)*9.5),
            yaw: town.angle + a + Math.PI/2});
        }
        break;
      }
      case 'gallowsyard':
        ctx.propInstances.push({kind:'gallows', pos:at(u,v), yaw:town.angle});
        for(let i=0;i<8;i++){
          const a=i/8*Math.PI*2;
          ctx.propInstances.push({kind:'fence',
            pos:at(u+Math.cos(a)*7, v+Math.sin(a)*7),
            yaw: town.angle + a + Math.PI/2});
        }
        break;
      case 'tailings':
        for(let i=0;i<9;i++){
          const p = at(u + (rnd()-0.5)*30, v + (rnd()-0.5)*22);
          const g = new THREE.ConeGeometry(M.range(rnd,3.5,7.5),
                                           M.range(rnd,2.0,4.6), 7);
          g.translate(p.x, p.y + 1.0, p.z);
          ctx.parts.push({geo:g, group:BM.STONE});
        }
        break;
      case 'saltpan':
        for(let i=0;i<7;i++){
          const p = at(u + (rnd()-0.5)*70, v + (rnd()-0.5)*40);
          const g = new THREE.CircleGeometry(M.range(rnd,5,13), 12);
          g.rotateX(-Math.PI/2);
          g.translate(p.x, p.y + 0.06, p.z);
          ctx.parts.push({geo:g, group:BM.STONE});
        }
        break;
      case 'jetty': {
        const p = at(u,v);
        const len = 22;
        const g = new THREE.BoxGeometry(3.4, 0.22, len);
        g.applyMatrix4(new THREE.Matrix4().compose(
          new THREE.Vector3(p.x, p.y+0.55, p.z),
          new THREE.Quaternion().setFromEuler(new THREE.Euler(0, town.angle, 0)),
          new THREE.Vector3(1,1,1)));
        ctx.parts.push({geo:g, group:BM.BOARD});
        ctx.walkways.push({x:p.x, y:p.y+0.44, z:p.z, hw:1.7, hh:0.11,
                           hd:len/2, yaw:town.angle});
        for(let i=0;i<8;i++){
          const pp = at(u, v - len/2 + i*(len/7));
          for(const ox of [-1.5,1.5]){
            const post = new THREE.CylinderGeometry(0.14,0.16, 1.8, 6);
            post.translate(pp.x+ox*Math.cos(town.angle), pp.y-0.2,
                           pp.z+ox*Math.sin(town.angle));
            ctx.parts.push({geo:post, group:BM.TIMBER});
          }
        }
        break;
      }
    }
  }

  /* Scatter street furniture along whatever streets the plan drew. */
  _props(town, ctx, counts){
    const rnd = ctx.rnd;
    const reach = (ctx.streetLen||60)*0.55 + 10;
    for(const [kind, n] of Object.entries(counts)){
      for(let i=0;i<n;i++){
        const u = M.range(rnd, -reach, reach);
        const side = rnd()<0.5 ? 1 : -1;
        const v = side*M.range(rnd, 5.5, 9.5);
        const p = this._toWorld(town, u, v);
        p.y = this.terrain.heightAt(p.x, p.z);
        ctx.propInstances.push({ kind, pos:p,
          yaw: town.angle + (rnd()-0.5)*0.6 });
      }
    }
  }

  /* ---- Assemble one town ------------------------------------------------ */
  _build(town){
    const ctx = {
      rnd: M.rng(town.key.length*7919 + Math.floor(town.x)),
      parts:[], signs:[], lamps:[], npcSpots:[], colliderJobs:[],
      propInstances:[], walkways:[], streetLen:0,
    };
    (PLANS[town.character] || PLANS.company)(this, town, ctx);
    this._station(town, ctx);

    const group = new THREE.Group();
    const shell = new THREE.Mesh(mergeParts(ctx.parts), this.mats);
    shell.castShadow = true; shell.receiveShadow = true;
    shell.geometry.userData.owned = true;
    group.add(shell);

    /* Props, batched per kind. */
    const byKind = {};
    for(const p of ctx.propInstances){
      if(p.skip) continue;
      (byKind[p.kind] = byKind[p.kind] || []).push(p);
    }
    const mtx = new THREE.Matrix4();
    for(const [kind, list] of Object.entries(byKind)){
      if(!this.propGeo[kind]) continue;
      const inst = new THREE.InstancedMesh(this.propGeo[kind], this.mats, list.length);
      inst.castShadow = true; inst.receiveShadow = true;
      list.forEach((p,i)=>{
        mtx.compose(p.pos, new THREE.Quaternion().setFromEuler(
          new THREE.Euler(0, p.yaw, 0)), new THREE.Vector3(1,1,1));
        inst.setMatrixAt(i, mtx);
        if(kind === 'lamp') ctx.lamps.push(p.pos.clone().setY(p.pos.y + 3.1));
        // Waist-high furniture is solid; kerb-height clutter is not worth it.
        if(kind==='trough'||kind==='cart'||kind==='orecart'||kind==='gallows')
          this.colliders.addBox(town.key, p.pos.x, p.pos.y, p.pos.z,
            1.1, 0.55, 0.6, p.yaw);
      });
      inst.instanceMatrix.needsUpdate = true;
      group.add(inst);
    }

    /* Signs. */
    for(const s of ctx.signs){
      const geo = new THREE.PlaneGeometry(s.w, s.h);
      const tex = makeSignTexture(s.text, { accent:s.accent, bg:s.bg,
        worn: town.character==='dust' ? 0.9 : 0.45 });
      const mesh = new THREE.Mesh(geo,
        new THREE.MeshStandardMaterial({ map:tex, roughness:0.9 }));
      mesh.position.copy(s.pos);
      mesh.rotation.y = s.rot;
      group.add(mesh);
    }

    /* Collision. Walls block; boardwalks, porches and the jetty carry you. */
    for(const job of ctx.colliderJobs)
      this.colliders.addFromParts(town.key, job.parts, job.mtx, job.rot,
                                  job.minHeight || 0.9);
    for(const wk of ctx.walkways)
      this.colliders.addBox(town.key, wk.x, wk.y, wk.z, wk.hw, wk.hh, wk.hd,
        wk.yaw, { solid:false, climb:true });

    group.userData.lamps = ctx.lamps;
    group.userData.npcSpots = ctx.npcSpots;
    const half = (ctx.streetLen||60)*0.5;
    group.userData.street = {
      angle: town.angle,
      start: this._toWorld(town, -half, 0).setY(this.terrain.heightAt(town.x,town.z)),
      end:   this._toWorld(town,  half, 0).setY(this.terrain.heightAt(town.x,town.z)),
    };
    group.userData.buildings = ctx.colliderJobs.length;
    group.userData.station = ctx.station || null;
    return group;
  }

  /* ---- Streaming --------------------------------------------------------- */
  update(playerPos, onBuild, onRelease){
    if(!this.scene) return null;
    let inside = null, builtOne = false;
    for(const town of this.list){
      const d = Math.hypot(playerPos.x-town.x, playerPos.z-town.z);
      if(d < town.radius + 30) inside = town;
      const have = this.built.get(town.key);
      // At most one town assembles per tick; two in a frame would be a hitch.
      if(d < CFG.TOWN_BUILD_R && !have && !builtOne){
        const g = this._build(town);
        this.scene.add(g);
        this.built.set(town.key, g);
        builtOne = true;
        onBuild && onBuild(town, g);
      } else if(d > CFG.TOWN_RELEASE_R && have){
        onRelease && onRelease(town, have);
        this.scene.remove(have);
        this.colliders.remove(town.key);
        have.traverse(o=>{
          if(o.isInstancedMesh) o.dispose();
          else if(o.geometry && o.geometry.userData.owned) o.geometry.dispose();
          if(o.material && o.material.map && o.material.map.isCanvasTexture){
            o.material.map.dispose(); o.material.dispose();
          }
        });
        this.built.delete(town.key);
      }
    }
    this.current = inside;
    return inside;
  }

  setNight(amount){ this.glass.emissiveIntensity = M.sat(amount)*1.35; }
}
/* ==========================================================================
   ROADS, THE WIRE, AND THE LINE
   Towns are joined by roads a wagon could actually take. Routes are found by
   A* over a coarse grid where the cost of a step is its length multiplied by
   how steep it is, so roads contour around hills, follow valleys, and cross
   ridges at saddles rather than charging straight over the top.

   Every road carries the telegraph beside it — which is the whole reason this
   company exists — and one route carries rail.
   ========================================================================== */

class Roads {
  constructor(terrain){
    this.terrain = terrain;
    this.routes = [];        // [{a,b,points,length,rail}]
    this.poles = [];
    this.G = CFG.ROAD_GRID;
    this.NX = Math.floor(CFG.WORLD / this.G);
  }

  _h(i,j){
    return this.terrain.heightAt(i*this.G - CFG.HALF + this.G/2,
                                 j*this.G - CFG.HALF + this.G/2);
  }

  /* ---- A* over the coarse grid ------------------------------------------
     Cost punishes grade hard and water absolutely. The heuristic is straight
     line distance, which is admissible because no step is ever cheaper than
     its own length. */
  route(ax, az, bx, bz, avoid){
    // Two attempts: an ordinary wagon road first, then a rougher track that
    // will take grades no coach would enjoy. A straight line is the last
    // resort and it means the two towns genuinely cannot be joined.
    return this._search(ax,az,bx,bz, CFG.ROAD_MAX_GRADE, avoid)
        || this._search(ax,az,bx,bz, CFG.ROAD_MAX_GRADE*1.75, avoid)
        || this._search(ax,az,bx,bz, CFG.ROAD_MAX_GRADE*1.75)
        || this._straight(ax,az,bx,bz);
  }

  _straight(ax,az,bx,bz){
    const pts=[];
    for(let k=0;k<=14;k++){
      const t=k/14, x=M.lerp(ax,bx,t), z=M.lerp(az,bz,t);
      pts.push(new THREE.Vector3(x, this.terrain.heightAt(x,z), z));
    }
    return pts;
  }

  _search(ax, az, bx, bz, maxGrade, avoid){
    const G=this.G, NX=this.NX;
    const toI = (w)=> M.clamp(Math.round((w + CFG.HALF - G/2)/G), 1, NX-2);
    const si = toI(ax), sj = toI(az), gi = toI(bx), gj = toI(bz);
    const idx = (i,j)=> j*NX+i;
    /* Binary heap. A linear scan for the cheapest open node turns A* into an
       O(n^2) crawl on a 128x128 grid, which is why the first version gave up
       and fell back to straight lines. */
    const heap = [], heapF = [];
    const push = (node, f)=>{
      heap.push(node); heapF.push(f);
      let i = heap.length-1;
      while(i > 0){
        const p = (i-1)>>1;
        if(heapF[p] <= heapF[i]) break;
        [heap[p],heap[i]]=[heap[i],heap[p]]; [heapF[p],heapF[i]]=[heapF[i],heapF[p]];
        i = p;
      }
    };
    const pop = ()=>{
      const top = heap[0];
      const n = heap.pop(), f = heapF.pop();
      if(heap.length){
        heap[0]=n; heapF[0]=f;
        let i=0;
        for(;;){
          const l=i*2+1, r=l+1; let m=i;
          if(l<heap.length && heapF[l]<heapF[m]) m=l;
          if(r<heap.length && heapF[r]<heapF[m]) m=r;
          if(m===i) break;
          [heap[m],heap[i]]=[heap[i],heap[m]]; [heapF[m],heapF[i]]=[heapF[i],heapF[m]];
          i=m;
        }
      }
      return top;
    };
    const gScore = new Float64Array(NX*NX).fill(Infinity);
    const fScore = new Float64Array(NX*NX).fill(Infinity);
    const from   = new Int32Array(NX*NX).fill(-1);
    const closed = new Uint8Array(NX*NX);
    const hCache = new Float32Array(NX*NX).fill(NaN);
    const H = (i,j)=>{ const k=idx(i,j);
      if(Number.isNaN(hCache[k])) hCache[k] = this._h(i,j);
      return hCache[k]; };
    const heur = (i,j)=> Math.hypot(i-gi, j-gj)*G;

    gScore[idx(si,sj)] = 0;
    fScore[idx(si,sj)] = heur(si,sj);
    push(idx(si,sj), fScore[idx(si,sj)]);
    let guard = 0;

    while(heap.length && guard++ < 400000){
      const cur = pop();
      if(closed[cur]) continue;
      if(cur === idx(gi,gj)){
        const pts=[];
        let n=cur;
        while(n !== -1){
          const i=n%NX, j=(n/NX)|0;
          pts.push(new THREE.Vector3(i*G-CFG.HALF+G/2, H(i,j), j*G-CFG.HALF+G/2));
          n = from[n];
        }
        return pts.reverse();
      }
      closed[cur]=1;
      const ci=cur%NX, cj=(cur/NX)|0, ch=H(ci,cj);
      for(let d=0;d<8;d++){
        const di=[1,1,0,-1,-1,-1,0,1][d], dj=[0,1,1,1,0,-1,-1,-1][d];
        const ni=ci+di, nj=cj+dj;
        if(ni<1||nj<1||ni>=NX-1||nj>=NX-1) continue;
        const nk=idx(ni,nj);
        if(closed[nk]) continue;
        const nh = H(ni,nj);
        if(nh < CFG.SEA + 1.2) continue;                 // no fords, no bridges yet
        if(avoid){
          const wx2 = ni*G-CFG.HALF+G/2, wz2 = nj*G-CFG.HALF+G/2;
          let inside = false;
          for(let z=0; z<avoid.length; z++){
            const a2 = avoid[z];
            if(Math.hypot(wx2-a2.x, wz2-a2.z) < a2.r){ inside = true; break; }
          }
          if(inside) continue;      // the line does not go through the main street
        }
        const run = Math.hypot(di,dj)*G;
        const grade = Math.abs(nh-ch)/run;
        if(grade > maxGrade) continue;                   // a wagon simply cannot
        // Steep is expensive, very steep is ruinous; flat river flats are cheap.
        const cost = run * (1 + grade*14 + Math.pow(grade*3.4, 3));
        const tentative = gScore[cur] + cost;
        if(tentative >= gScore[nk]) continue;
        from[nk]=cur; gScore[nk]=tentative;
        fScore[nk]=tentative + heur(ni,nj);
        push(nk, fScore[nk]);
      }
    }
    return null;
  }

  /* Chaikin smoothing turns the grid staircase into something a coach could
     drive, then heights are re-sampled and the profile is smoothed so the road
     rises and falls gently instead of tracking every bump. */
  /* Turn the grid staircase into a road.

     Chaikin rounds the corners; the line is then resampled to a fixed spacing
     so the vertical work below behaves predictably. The profile matters more
     than the plan: a surveyed road climbs at a steady, gentle rate and cuts or
     fills to hold it. Sampling the terrain and calling that a road is what
     produced 60% grades — the road was simply following every bump. */
  /* Railway alignment. Same idea as a road profile but the numbers are an
     order of magnitude tighter: a locomotive working on adhesion alone gives
     up somewhere around 1 in 25, so the formation is cut and filled far more
     aggressively and the curves are eased much harder. */
  _railAlign(pts){
    let p = pts;
    for(let s=0;s<5;s++){                    // five passes: railways ease slowly
      const out=[p[0]];
      for(let i=0;i<p.length-1;i++){
        const a=p[i], b=p[i+1];
        out.push(new THREE.Vector3(a.x*0.75+b.x*0.25, 0, a.z*0.75+b.z*0.25));
        out.push(new THREE.Vector3(a.x*0.25+b.x*0.75, 0, a.z*0.25+b.z*0.75));
      }
      out.push(p[p.length-1]); p = out;
    }
    const STEP = 4;
    const uni=[p[0].clone()]; let carry=0;
    for(let i=0;i<p.length-1;i++){
      const a=p[i], b=p[i+1];
      const seg=Math.hypot(b.x-a.x,b.z-a.z);
      if(seg<1e-4) continue;
      let d=STEP-carry;
      while(d<=seg){ const t=d/seg;
        uni.push(new THREE.Vector3(M.lerp(a.x,b.x,t),0,M.lerp(a.z,b.z,t))); d+=STEP; }
      carry=(carry+seg)%STEP;
    }
    uni.push(p[p.length-1].clone());
    p = uni;
    const n = p.length;
    if(n<3){ for(const q of p) q.y=this.terrain.heightAt(q.x,q.z); return p; }

    const ground = p.map(q=>this.terrain.heightAt(q.x,q.z));
    let y = ground.slice();
    const smoothPass=(arr,times)=>{
      for(let s=0;s<times;s++){
        const c=arr.slice();
        for(let i=1;i<n-1;i++) arr[i]=(c[i-1]+c[i]*2+c[i+1])*0.25;
      }
    };
    smoothPass(y, 120);                       // averaged over ~200m of formation
    const rise = CFG.RAIL_MAX_GRADE*STEP;
    for(let i=1;i<n;i++)    y[i]=M.clamp(y[i], y[i-1]-rise, y[i-1]+rise);
    for(let i=n-2;i>=0;i--) y[i]=M.clamp(y[i], y[i+1]-rise, y[i+1]+rise);
    // Deep cuttings and tall embankments are exactly what a railway does.
    const MAXDEV = 11;
    for(let i=0;i<n;i++) y[i]=M.clamp(y[i], ground[i]-MAXDEV, ground[i]+MAXDEV);
    smoothPass(y, 20);
    for(let i=1;i<n;i++)    y[i]=M.clamp(y[i], y[i-1]-rise, y[i-1]+rise);
    for(let i=n-2;i>=0;i--) y[i]=M.clamp(y[i], y[i+1]-rise, y[i+1]+rise);
    for(let i=0;i<n;i++) p[i].y=y[i];
    return p;
  }

  _smooth(pts){
    let p = pts;
    for(let s=0;s<3;s++){
      const out=[p[0]];
      for(let i=0;i<p.length-1;i++){
        const a=p[i], b=p[i+1];
        out.push(new THREE.Vector3(a.x*0.75+b.x*0.25, 0, a.z*0.75+b.z*0.25));
        out.push(new THREE.Vector3(a.x*0.25+b.x*0.75, 0, a.z*0.25+b.z*0.75));
      }
      out.push(p[p.length-1]);
      p = out;
    }

    // Uniform 5-unit spacing.
    const STEP = 5;
    const uni = [p[0].clone()];
    let carry = 0;
    for(let i=0;i<p.length-1;i++){
      const a=p[i], b=p[i+1];
      const seg = Math.hypot(b.x-a.x, b.z-a.z);
      if(seg < 1e-4) continue;
      let d = STEP - carry;
      while(d <= seg){
        const t = d/seg;
        uni.push(new THREE.Vector3(M.lerp(a.x,b.x,t), 0, M.lerp(a.z,b.z,t)));
        d += STEP;
      }
      carry = (carry + seg) % STEP;
    }
    uni.push(p[p.length-1].clone());
    p = uni;
    const n = p.length;
    if(n < 3){ for(const q of p) q.y = this.terrain.heightAt(q.x,q.z); return p; }

    const ground = p.map(q=> this.terrain.heightAt(q.x, q.z));
    let y = ground.slice();

    // Long-wavelength smoothing: 34 passes over 5-unit samples means the
    // profile is averaged across roughly 60 metres of road.
    const smoothPass = (arr, times)=>{
      for(let s=0;s<times;s++){
        const c = arr.slice();
        for(let i=1;i<n-1;i++) arr[i] = (c[i-1] + c[i]*2 + c[i+1])*0.25;
      }
    };
    smoothPass(y, 34);

    /* Hold a comfortable ruling gradient. Two sweeps: forward, then back. */
    const MAXG = 0.115, rise = MAXG*STEP;
    for(let i=1;i<n;i++)   y[i] = M.clamp(y[i], y[i-1]-rise, y[i-1]+rise);
    for(let i=n-2;i>=0;i--) y[i] = M.clamp(y[i], y[i+1]-rise, y[i+1]+rise);

    /* Cut and fill, but only so much: a road may sit in a shallow cutting or
       on a low embankment, not on a viaduct. */
    const MAXDEV = 4.5;
    for(let i=0;i<n;i++)
      y[i] = M.clamp(y[i], ground[i]-MAXDEV, ground[i]+MAXDEV);
    smoothPass(y, 8);
    for(let i=1;i<n;i++)   y[i] = M.clamp(y[i], y[i-1]-rise, y[i-1]+rise);
    for(let i=n-2;i>=0;i--) y[i] = M.clamp(y[i], y[i+1]-rise, y[i+1]+rise);

    // Both ends meet their town exactly.
    y[0] = ground[0]; y[n-1] = ground[n-1];
    for(let i=0;i<n;i++) p[i].y = y[i];
    return p;
  }

  /* ---- Build the network ------------------------------------------------
     A minimum spanning tree guarantees every town is reachable; two extra
     short links stop the map being a dead-end tree and give the player loops
     to ride. */
  build(towns){
    const n = towns.length;
    const pairs=[];
    for(let i=0;i<n;i++) for(let j=i+1;j<n;j++)
      pairs.push({i,j,d:Math.hypot(towns[i].x-towns[j].x, towns[i].z-towns[j].z)});
    pairs.sort((a,b)=>a.d-b.d);

    const parent = [...Array(n).keys()];
    const find = (x)=> parent[x]===x ? x : (parent[x]=find(parent[x]));
    const chosen=[];
    for(const p of pairs){
      const ra=find(p.i), rb=find(p.j);
      if(ra===rb) continue;
      parent[ra]=rb; chosen.push(p);
      if(chosen.length === n-1) break;
    }
    let extra = 0;
    for(const p of pairs){
      if(extra >= 2) break;
      if(chosen.some(c=>c.i===p.i && c.j===p.j)) continue;
      chosen.push(p); extra++;
    }

    for(const p of chosen){
      const A=towns[p.i], B=towns[p.j];
      const raw = this.route(A.x, A.z, B.x, B.z);
      const pts = this._smooth(raw);
      this.terrain.gradeRoad(pts, CFG.ROAD_W);
      let len=0;
      for(let i=0;i<pts.length-1;i++) len += pts[i].distanceTo(pts[i+1]);
      this.routes.push({ a:A.key, b:B.key, points:pts, length:len, rail:false });
    }

    this.towns = towns;
    this._buildRail(towns);
    return this.routes;
  }

  /* ---- The line --------------------------------------------------------
     Chooses the flattest chain of towns it can string together, routes past
     each one rather than through it, and hands back a station throat for every
     town it serves. The old version simply ran the rail alongside a road,
     which is how it ended up going straight through the main street. */
  _buildRail(towns){
    const scored = towns.map(t=>({ t, y:t.y }));
    // Start from the lowest town and greedily hop to the nearest unvisited one
    // whose height difference is something a locomotive would accept.
    scored.sort((a,b)=>a.y-b.y);
    const chain = [scored[0].t];
    const left = new Set(towns.filter(t=>t!==chain[0]));
    while(left.size && chain.length < 4){
      const from = chain[chain.length-1];
      let pick=null, bestCost=Infinity;
      for(const t of left){
        const d = Math.hypot(t.x-from.x, t.z-from.z);
        const climb = Math.abs(t.y-from.y);
        const cost = d + climb*26;            // climbing is what kills a railway
        if(cost < bestCost && climb/Math.max(d,1) < CFG.RAIL_MAX_GRADE*3.2){
          bestCost=cost; pick=t;
        }
      }
      if(!pick) break;
      chain.push(pick); left.delete(pick);
    }
    if(chain.length < 2){ this.railRoute = null; this.stations = []; return; }

    this.railTowns = chain;
    this.stations = [];
    const avoid = towns.map(t=>({x:t.x, z:t.z, r:t.radius + 6}));

    /* ONE anchor per town, offset to the side of it, shared by the leg coming
       in and the leg going out. Using a separate "in" and "out" throat either
       side of each town left a gap the width of the town at every join — which
       is where the 108% gradients were coming from. */
    const anchors = chain.map((t,i)=>{
      /* Run of the line at this town. At the two ends of the chain there is
         only one neighbour, so use the direction to it — taking prev and next
         as the same town gave a zero vector and dumped the anchor straight
         onto the town centre. */
      let ax, az;
      if(i > 0 && i < chain.length-1){
        ax = chain[i+1].x - chain[i-1].x; az = chain[i+1].z - chain[i-1].z;
      } else {
        const other = chain[i+1] || chain[i-1];
        ax = other.x - t.x; az = other.z - t.z;
      }
      const L = Math.hypot(ax,az) || 1;
      // Perpendicular to the run of the line, on whichever side is flatter.
      let bestP = null, bestScore = -Infinity;
      for(const sgn of [1,-1]){
        // Close in, so a passenger can step off the platform and walk
        // straight into town rather than hiking a quarter mile of scrub.
        const px = t.x + (-az/L)*sgn*(t.radius+10);
        const pz = t.z + ( ax/L)*sgn*(t.radius+10);
        let relief = 0;
        for(let k=0;k<6;k++){
          const a2=k/6*Math.PI*2;
          relief += Math.abs(this.terrain.heightAt(px+Math.cos(a2)*26,
                                                   pz+Math.sin(a2)*26)
                           - this.terrain.heightAt(px,pz));
        }
        const score = -relief;
        if(score > bestScore){ bestScore=score; bestP={x:px, z:pz}; }
      }
      return bestP;
    });

    const legs = [];
    for(let i=0;i<chain.length-1;i++){
      const raw = this.route(anchors[i].x, anchors[i].z,
                             anchors[i+1].x, anchors[i+1].z, avoid);
      legs.push(this._railAlign(raw));
    }

    /* Join the legs, forcing each seam to be a single shared point. */
    const pts = legs[0].slice();
    for(let i=1;i<legs.length;i++){
      const tail = pts[pts.length-1], head = legs[i][0];
      // Average the two ends so neither leg has to jump to meet the other.
      const y = (tail.y + head.y)*0.5;
      tail.set((tail.x+head.x)*0.5, y, (tail.z+head.z)*0.5);
      pts.push(...legs[i].slice(1));
    }
    /* Keep the finished alignment out of the towns. Chaikin cuts corners, and
       a cut corner near a settlement puts the track down the main street. Push
       any point that strayed inside back out, ease, and repeat — four rounds is
       enough for the curve to settle outside every town. */
    const keepOut = towns.map(t=>({x:t.x, z:t.z, r:t.radius + 4}));
    for(let round=0; round<4; round++){
      for(const p of pts){
        for(const z of keepOut){
          const dx = p.x-z.x, dz = p.z-z.z;
          const d = Math.hypot(dx,dz);
          if(d < z.r && d > 1e-3){
            p.x = z.x + dx/d*z.r;
            p.z = z.z + dz/d*z.r;
          }
        }
      }
      for(let s=0;s<6;s++){
        const cx = pts.map(q=>q.x), cz = pts.map(q=>q.z);
        for(let i=1;i<pts.length-1;i++){
          pts[i].x = (cx[i-1]+cx[i]*2+cx[i+1])*0.25;
          pts[i].z = (cz[i-1]+cz[i]*2+cz[i+1])*0.25;
        }
      }
    }
    for(const p of pts) p.y = this.terrain.heightAt(p.x, p.z);

    /* Ease the whole alignment across the joins, then re-impose the ruling
       gradient over the finished line so no seam can exceed it. */
    for(let s=0;s<150;s++){
      const c = pts.map(q=>q.y);
      for(let i=1;i<pts.length-1;i++) pts[i].y = (c[i-1]+c[i]*2+c[i+1])*0.25;
    }
    // A railway will sit in a cutting or on a bank, but not on stilts.
    for(let i=0;i<pts.length;i++){
      const g = this.terrain.heightAt(pts[i].x, pts[i].z);
      pts[i].y = M.clamp(pts[i].y, g-12, g+12);
    }
    for(let s=0;s<24;s++){
      const c = pts.map(q=>q.y);
      for(let i=1;i<pts.length-1;i++) pts[i].y = (c[i-1]+c[i]*2+c[i+1])*0.25;
    }
    for(let pass=0; pass<3; pass++){
      for(let i=1;i<pts.length;i++){
        const run = Math.hypot(pts[i].x-pts[i-1].x, pts[i].z-pts[i-1].z);
        const rise = CFG.RAIL_MAX_GRADE*Math.max(run, 0.001);
        pts[i].y = M.clamp(pts[i].y, pts[i-1].y-rise, pts[i-1].y+rise);
      }
      for(let i=pts.length-2;i>=0;i--){
        const run = Math.hypot(pts[i+1].x-pts[i].x, pts[i+1].z-pts[i].z);
        const rise = CFG.RAIL_MAX_GRADE*Math.max(run, 0.001);
        pts[i].y = M.clamp(pts[i].y, pts[i+1].y-rise, pts[i+1].y+rise);
      }
    }
    this.terrain.gradeRail(pts, CFG.RAIL_W);

    let len=0;
    for(let i=0;i<pts.length-1;i++) len += pts[i].distanceTo(pts[i+1]);
    this.railRoute = { a:chain[0].key, b:chain[chain.length-1].key,
                       points:pts, length:len, rail:true };

    /* Where is each town's platform? The point on the finished alignment
       closest to that town. */
    for(const t of chain){
      let bestI=0, bestD=Infinity, acc=0, bestAcc=0;
      for(let i=0;i<pts.length;i++){
        if(i>0) acc += pts[i-1].distanceTo(pts[i]);
        const d = Math.hypot(pts[i].x-t.x, pts[i].z-t.z);
        if(d<bestD){ bestD=d; bestI=i; bestAcc=acc; }
      }
      const i0 = M.clamp(bestI,1,pts.length-2);
      const dir = new THREE.Vector3().subVectors(pts[i0+1], pts[i0-1]).normalize();
      const sp = pts[i0].clone();
      /* Level the station yard to the height of the rail. A platform is a
         single rigid slab; if the ground under it falls away by even 150mm the
         bottom tread of its ramp becomes taller than a man can step. */
      this.terrain.flattenDisc(sp.x, sp.z, 30, 20, sp.y);
      (this.terrain.flatZones = this.terrain.flatZones || []).push(
        { x:sp.x, z:sp.z, r:30, f:20 });
      this.stations.push({ town:t.key, name:t.name,
        pos: sp, dir, along: bestAcc,
        angle: Math.atan2(dir.x, dir.z) });
    }
  }

  /* Sample a point and a direction some distance along a route. */
  sampleRoute(route, dist){
    const p = route.points;
    let acc=0;
    for(let i=0;i<p.length-1;i++){
      const seg = p[i].distanceTo(p[i+1]);
      if(acc+seg >= dist){
        const t=(dist-acc)/seg;
        return { pos:new THREE.Vector3().lerpVectors(p[i],p[i+1],t),
                 dir:new THREE.Vector3().subVectors(p[i+1],p[i]).normalize() };
      }
      acc += seg;
    }
    return { pos:p[p.length-1].clone(),
             dir:new THREE.Vector3().subVectors(p[p.length-1],p[p.length-2]).normalize() };
  }

  /* ======================================================================
     GEOMETRY — telegraph poles, wire, rail, milestones
     ====================================================================== */
  buildGeometry(lib, scene, colliders){
    const group = new THREE.Group();
    const poleParts=[], wireParts=[], railParts=[], sleeperParts=[], stoneParts=[];

    /* One pole, built once and instanced along every route. */
    const poleGeo = (()=>{
      const parts=[];
      const g = new THREE.CylinderGeometry(0.10, 0.15, 7.6, 6);
      g.translate(0, 3.8, 0); parts.push({geo:g, group:0});
      const arm = new THREE.BoxGeometry(1.75, 0.11, 0.11);
      arm.translate(0, 7.05, 0); parts.push({geo:arm, group:0});
      for(const ox of [-0.68, 0.68]){
        const ins = new THREE.CylinderGeometry(0.055,0.045,0.20,6);
        ins.translate(ox, 7.22, 0); parts.push({geo:ins, group:1});
      }
      const brace = new THREE.BoxGeometry(0.07,0.07,0.90);
      brace.translate(0, 6.72, 0); parts.push({geo:brace, group:0});
      return mergeParts(parts);
    })();

    const poleMat = [
      new THREE.MeshStandardMaterial({ map:lib.wood_dark.map,
        roughnessMap:lib.wood_dark.roughnessMap, normalMap:lib.wood_dark.normalMap,
        color:0x8a7a63, roughness:1 }),
      new THREE.MeshStandardMaterial({ color:0x2a4f52, roughness:0.25,
        metalness:0.1 }),
    ];

    /* Walk every route, dropping poles and stringing wire between them. */
    const poleMatrices=[];
    const wireSegs=[];
    for(const r of this.routes){
      let prev=null;
      for(let d=CFG.POLE_SPACING*0.5; d<r.length; d+=CFG.POLE_SPACING){
        const s = this.sampleRoute(r, d);
        const side = new THREE.Vector3(-s.dir.z, 0, s.dir.x)
                       .multiplyScalar(CFG.ROAD_W*0.5 + 2.2);
        const p = s.pos.clone().add(side);
        p.y = this.terrain.heightAt(p.x, p.z);
        const yaw = Math.atan2(s.dir.x, s.dir.z);
        poleMatrices.push(new THREE.Matrix4().compose(p,
          new THREE.Quaternion().setFromEuler(new THREE.Euler(0, yaw, 0)),
          new THREE.Vector3(1,1,1)));
        this.poles.push(p);
        if(prev) wireSegs.push([prev, p]);
        prev = p;
      }
    }
    const poles = new THREE.InstancedMesh(poleGeo, poleMat, poleMatrices.length);
    poles.castShadow = true; poles.receiveShadow = true;
    poleMatrices.forEach((m,i)=>poles.setMatrixAt(i,m));
    poles.instanceMatrix.needsUpdate = true;
    group.add(poles);

    /* Wire. Two strands per span, each hanging in a real catenary sag — a
       straight line between poles is the single most obvious tell that a
       telegraph was drawn rather than strung. */
    const wirePts=[];
    for(const [a,b] of wireSegs){
      const span = a.distanceTo(b);
      const sag = Math.min(1.5, span*0.045);
      for(const ox of [-0.68, 0.68]){
        let last=null;
        for(let k=0;k<=6;k++){
          const t=k/6;
          const x = M.lerp(a.x,b.x,t), z = M.lerp(a.z,b.z,t);
          const dir = new THREE.Vector3(b.x-a.x,0,b.z-a.z).normalize();
          const side = new THREE.Vector3(-dir.z,0,dir.x).multiplyScalar(ox);
          const y = M.lerp(a.y,b.y,t) + 7.22 - sag*4*t*(1-t);
          const p = new THREE.Vector3(x+side.x, y, z+side.z);
          if(last) wirePts.push(last.x,last.y,last.z, p.x,p.y,p.z);
          last = p;
        }
      }
    }
    if(wirePts.length){
      const wg = new THREE.BufferGeometry();
      wg.setAttribute('position', new THREE.Float32BufferAttribute(wirePts,3));
      const wire = new THREE.LineSegments(wg,
        new THREE.LineBasicMaterial({ color:0x1a1714, transparent:true,
                                      opacity:0.72, fog:true }));
      wire.frustumCulled = false;
      group.add(wire);
    }

    /* ---- Rail ----------------------------------------------------------- */
    if(this.railRoute){
      const r = this.railRoute;
      /* Ballast: a raised trapezoid the whole way, so the line reads as sitting
         ON the ground rather than being painted onto it. */
      {
        const P=[], I=[]; let vi=0;
        const stepB = 6;
        const N = Math.floor(r.length/stepB);
        for(let i=0;i<=N;i++){
          const s = this.sampleRoute(r, Math.min(i*stepB, r.length));
          const side = new THREE.Vector3(-s.dir.z,0,s.dir.x);
          const y0 = this.terrain.heightAt(s.pos.x, s.pos.z);
          const yTop = s.pos.y + 0.30;
          for(const [w,yy] of [[4.6, y0-0.4],[2.6, yTop],[-2.6, yTop],[-4.6, y0-0.4]])
            P.push(s.pos.x+side.x*w, yy, s.pos.z+side.z*w);
          if(i>0){
            const o=(i-1)*4;
            for(let k=0;k<3;k++) I.push(o+k, o+4+k, o+k+1, o+k+1, o+4+k, o+5+k);
          }
          vi+=4;
        }
        const bg = new THREE.BufferGeometry();
        bg.setAttribute('position', new THREE.Float32BufferAttribute(P,3));
        bg.setIndex(I); bg.computeVertexNormals();
        const ballast = new THREE.Mesh(bg, new THREE.MeshStandardMaterial({
          map:lib.g_scree.map, normalMap:lib.g_scree.normalMap,
          color:0x9a9086, roughness:1 }));
        ballast.receiveShadow = true; ballast.frustumCulled = false;
        group.add(ballast);
      }
      const sleeperGeo = new THREE.BoxGeometry(2.5, 0.16, 0.26);
      const sleeperMat = new THREE.MeshStandardMaterial({
        map:lib.wood_dark.map, normalMap:lib.wood_dark.normalMap,
        color:0x4a4038, roughness:1 });
      const count = Math.floor(r.length/CFG.SLEEPER_SPACING);
      const sleepers = new THREE.InstancedMesh(sleeperGeo, sleeperMat, count);
      sleepers.receiveShadow = true;
      const railPts=[[],[]];
      const mtx = new THREE.Matrix4();
      for(let i=0;i<count;i++){
        const s = this.sampleRoute(r, i*CFG.SLEEPER_SPACING);
        const side = new THREE.Vector3(-s.dir.z, 0, s.dir.x);
        // The line has its own graded formation; the sleepers sit on it.
        const base = s.pos.clone();
        base.y = s.pos.y + 0.34;
        const yaw = Math.atan2(s.dir.x, s.dir.z);
        mtx.compose(base, new THREE.Quaternion().setFromEuler(
          new THREE.Euler(0, yaw, 0)), new THREE.Vector3(1,1,1));
        sleepers.setMatrixAt(i, mtx);
        for(let k=0;k<2;k++){
          const off = (k? 1:-1)*CFG.RAIL_GAUGE*0.5;
          railPts[k].push(new THREE.Vector3(
            base.x + side.x*off, base.y + 0.20, base.z + side.z*off));
        }
      }
      sleepers.instanceMatrix.needsUpdate = true;
      group.add(sleepers);

      // Rails as continuous ribbons of steel.
      const railMat = new THREE.MeshStandardMaterial({
        color:0x5a5148, roughness:0.42, metalness:0.65 });
      for(const line of railPts){
        const P=[], I=[];
        for(let i=0;i<line.length;i++){
          const p = line[i];
          const nx = (i<line.length-1?line[i+1]:line[i-1]||p);
          const d = new THREE.Vector3().subVectors(nx,p).normalize();
          const s = new THREE.Vector3(-d.z,0,d.x).multiplyScalar(0.075);
          P.push(p.x-s.x, p.y, p.z-s.z,  p.x+s.x, p.y, p.z+s.z,
                 p.x-s.x, p.y+0.16, p.z-s.z,  p.x+s.x, p.y+0.16, p.z+s.z);
          if(i>0){
            const o=(i-1)*4;
            I.push(o+2,o+6,o+3, o+3,o+6,o+7);     // top face
            I.push(o+0,o+1,o+4, o+1,o+5,o+4);     // bottom
            I.push(o+0,o+4,o+2, o+2,o+4,o+6);     // outer web
            I.push(o+1,o+3,o+5, o+3,o+7,o+5);     // inner web
          }
        }
        const rg = new THREE.BufferGeometry();
        rg.setAttribute('position', new THREE.Float32BufferAttribute(P,3));
        rg.setIndex(I); rg.computeVertexNormals();
        const mesh = new THREE.Mesh(rg, railMat);
        mesh.castShadow = false; mesh.receiveShadow = true;
        mesh.frustumCulled = false;
        group.add(mesh);
      }
    }

    /* ---- Milestones ------------------------------------------------------
       A cut stone every so often, so the roads have a sense of distance. */
    const stoneGeo = (()=>{
      const parts=[];
      const g = new THREE.BoxGeometry(0.46, 0.86, 0.22);
      g.translate(0, 0.43, 0); parts.push({geo:g, group:0});
      const cap = new THREE.CylinderGeometry(0.24,0.24,0.12,8,1,false,0,Math.PI);
      cap.rotateZ(Math.PI/2); cap.rotateY(Math.PI/2); cap.translate(0,0.86,0);
      parts.push({geo:cap, group:0});
      return mergeParts(parts);
    })();
    const stoneMat = new THREE.MeshStandardMaterial({
      map:lib.rock_grey.map, normalMap:lib.rock_grey.normalMap,
      color:0xbdb6a6, roughness:0.92 });
    const stoneMtx=[];
    for(const r of this.routes){
      for(let d=120; d<r.length-60; d+=240){
        const s = this.sampleRoute(r, d);
        const side = new THREE.Vector3(-s.dir.z,0,s.dir.x)
                       .multiplyScalar(CFG.ROAD_W*0.5 + 1.1);
        const p = s.pos.clone().add(side);
        p.y = this.terrain.heightAt(p.x,p.z) - 0.05;
        stoneMtx.push(new THREE.Matrix4().compose(p,
          new THREE.Quaternion().setFromEuler(
            new THREE.Euler(0, Math.atan2(s.dir.x,s.dir.z)+Math.PI/2, 0)),
          new THREE.Vector3(1,1,1)));
      }
    }
    const stones = new THREE.InstancedMesh(stoneGeo, stoneMat, stoneMtx.length);
    stones.castShadow = true;
    stoneMtx.forEach((m,i)=>stones.setMatrixAt(i,m));
    stones.instanceMatrix.needsUpdate = true;
    group.add(stones);

    group.traverse(o=>{ if(o.geometry) o.geometry.userData.owned = true; });
    scene.add(group);
    this.group = group;

    /* Poles are solid. Nothing else out here is worth a collider. */
    for(const p of this.poles)
      colliders.addBox('roads', p.x, p.y, p.z, 0.20, 3.8, 0.20, 0, {climb:false});

    return group;
  }

  /* Nearest point on any road — used to tell the player they are on one. */
  nearestRoadDist(x, z){
    let best = Infinity;
    for(const r of this.routes){
      const p = r.points;
      for(let i=0;i<p.length;i+=2){
        const d = (p[i].x-x)*(p[i].x-x) + (p[i].z-z)*(p[i].z-z);
        if(d < best) best = d;
      }
    }
    return Math.sqrt(best);
  }
}
/* ==========================================================================
   NPCS — TOWNSFOLK
   Built on the same 23-bone skeleton as Jarrad, which means they inherit his
   entire clip library for nothing: walk, jog, idle, the weight-shift, the
   turns. Bodies come from four shared geometries so a town of a dozen people
   costs four skinned meshes' worth of vertex data.

   The four names the brief requires appear here as PEOPLE — Marguerite Conway,
   Old Man Pudmenzky, Sheriff McRoberts, and the Widow Dedman — matching the
   four places in the settlement module.
   ========================================================================== */

const NPC_PALETTES = [
  { coat:0x4a4238, shirt:0xcfc4a8, hat:0x2b2620, skin:0xd6ab86 },
  { coat:0x6b5a44, shirt:0xb9ae95, hat:0x3a332a, skin:0xc79a72 },

/* Hats are separate small meshes parented to the head bone, so one body can
   wear a stovepipe, a wide brim or a bonnet. */
/* A small painted plaque that floats over the head of anyone who matters.
   Sprites always face the camera, so it reads from any angle without any
   per-frame billboarding work. */
function makeNameMarker(name){
  const cv = document.createElement('canvas');
  cv.width = 512; cv.height = 128;
  const c = cv.getContext('2d');
  c.clearRect(0,0,512,128);
  // Chevron.
  c.fillStyle = '#FFD600';
  c.strokeStyle = 'rgba(24,18,10,0.85)'; c.lineWidth = 5;
  c.beginPath();
  c.moveTo(256, 96); c.lineTo(214, 40); c.lineTo(298, 40);
  c.closePath(); c.fill(); c.stroke();
  // Name above it.
  c.textAlign='center'; c.textBaseline='middle';
  let size = 30;
  do { c.font = `600 ${size}px "Bookman Old Style", Georgia, serif`; size -= 1; }
  while(c.measureText(name).width > 470 && size > 12);
  c.lineWidth = 6; c.strokeStyle = 'rgba(20,15,8,0.9)';
  c.strokeText(name, 256, 18);
  c.fillStyle = '#f6efd8';
  c.fillText(name, 256, 18);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  t.needsUpdate = true;
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({
    map:t, transparent:true, depthTest:true, depthWrite:false,
    sizeAttenuation:true, fog:false }));
  spr.scale.set(2.6, 0.65, 1);
  spr.center.set(0.5, 0);
  return spr;
}

      {radial:12, rings:2, squashZ:1.05}), group:0});
    parts.push({geo:limbGeometry(V(0,0.086,0.02), V(0,0.096,0.115), 0.100,0.070,
      {radial:10, rings:2, squashZ:0.5, tipRound:false}), group:0});
  } else if(kind==='bonnet'){
    parts.push({geo:blobGeometry(V(0,0.045,-0.02), 0.115,0.100,0.118, 12), group:0});
    parts.push({geo:limbGeometry(V(0,0.02,0.06), V(0,0.05,0.13), 0.135,0.105,
      {radial:12, rings:2, squashZ:0.55, tipRound:false}), group:0});
  } else if(kind==='wide'){

      {radial:14, rings:2}), group:0});
    parts.push({geo:limbGeometry(V(0,0.070,-0.01), V(0,0.086,-0.01), 0.255,0.248,
      {radial:16, rings:2, squashZ:1.05, tipRound:false}), group:0});
  } else {  // derby
    parts.push({geo:limbGeometry(V(0,0.070,-0.01), V(0,0.170,-0.012), 0.098,0.092,
      {radial:12, rings:2}), group:0});
