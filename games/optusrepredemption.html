            cc += sunCol*pow(max(sunCos,0.0), 9.0)*(1.0-shade)*0.75;
            cc *= mix(1.0, 0.16, uNight);
            sky = mix(sky, cc, cov*0.94);
          }

          gl_FragColor = vec4(max(sky, 0.0), 1.0);
        }`,
    });
    this.mesh = new THREE.Mesh(geo, mat);
    this.mesh.frustumCulled = false;
    this.mesh.renderOrder = -1000;
    scene.add(this.mesh);
  }
}

/* ==========================================================================
   TIME_OF_DAY
   Owns the clock, solar geometry, the light rig, fog, and the LUT blend.
   ========================================================================== */
class TimeOfDay {
  constructor(scene, sky, composer){
    this.scene = scene; this.sky = sky; this.composer = composer;
    this.hour = CFG.START_HOUR;
    this.day = 0;
    this.paused = false;
    this.scale = 24 / (CFG.DAY_MINUTES*60);       // game hours per real second

    /* Light rig: one directional key (sun or moon), one hemisphere bounce,
       one warm fill that stands in for ground bounce. */
    this.sun = new THREE.DirectionalLight(0xffffff, 3.0);
    this.sun.castShadow = true;
    const s = this.sun.shadow;
    s.mapSize.set(CFG.SHADOW_NEAR, CFG.SHADOW_NEAR);
    s.camera.near = 0.5; s.camera.far = 260;
    s.camera.left = -70; s.camera.right = 70;
    s.camera.top = 70;  s.camera.bottom = -70;
    s.bias = -0.0007; s.normalBias = 0.045;
    s.radius = 2.4;
    scene.add(this.sun); scene.add(this.sun.target);

    /* Far cascade — big, coarse, updated every 3rd frame (§20). */
    this.sunFar = new THREE.DirectionalLight(0xffffff, 0.0001);
    this.sunFar.castShadow = true;
    const sf = this.sunFar.shadow;
    sf.mapSize.set(CFG.SHADOW_FAR, CFG.SHADOW_FAR);
    sf.camera.near = 0.5; sf.camera.far = 900;
    sf.camera.left = -300; sf.camera.right = 300;
    sf.camera.top = 300; sf.camera.bottom = -300;
    sf.bias = -0.0016; sf.normalBias = 0.35;
    scene.add(this.sunFar); scene.add(this.sunFar.target);

    this.hemi = new THREE.HemisphereLight(0x9fb6d6, 0x4a4032, 0.55);
    scene.add(this.hemi);
    this.fill = new THREE.DirectionalLight(0xffd9a8, 0.20);
    scene.add(this.fill);

    this.fog = new THREE.FogExp2(0x9fb0c0, 0.0016);
    scene.fog = this.fog;

    this.sunDir = new THREE.Vector3(0,1,0);
    this.moonDir = new THREE.Vector3(0,-1,0);
    this.elev = 0;
    this._frame = 0;
  }

  /* Solar geometry. Declination fixed to late autumn on the frontier so the
     light has a low, long, golden character all game. */
  _solar(hour){
    const decl = -9.2 * Math.PI/180;
    const lat = CFG.LATITUDE;
    const H = (hour - 12) * 15 * Math.PI/180;
    const sinEl = Math.sin(lat)*Math.sin(decl) + Math.cos(lat)*Math.cos(decl)*Math.cos(H);
    const el = Math.asin(M.clamp(sinEl,-1,1));
    const az = Math.atan2(Math.sin(H),
                          Math.cos(H)*Math.sin(lat) - Math.tan(decl)*Math.cos(lat));
    // World: +X east, -Z north, +Y up. Azimuth measured from north.
    const ce = Math.cos(el);
    return new THREE.Vector3(Math.sin(az)*ce, Math.sin(el), -Math.cos(az)*ce).normalize();
  }

  setHour(h){ this.hour = ((h%24)+24)%24; }

  update(dt){
    if(!this.paused){
      this.hour += dt * this.scale;
      while(this.hour >= 24){ this.hour -= 24; this.day++; }
    }
    const h = this.hour;
    this.sunDir.copy(this._solar(h));
    // Moon lags the sun by (phase * 24h) and rides a slightly tilted path.
    const phase = ((this.day*0.0338 + 0.31) % 1);
    this.moonDir.copy(this._solar(h + 12 + phase*12)).applyAxisAngle(
      new THREE.Vector3(1,0,0), 0.09);
    this.sky.uniforms.uMoonPhase.value = phase;

    const el = this.elev = this.sunDir.y;

    /* --- Light colour & intensity --------------------------------------- */
    const dayAmt   = M.sat((el+0.02)*4.2);           // 0 at night, 1 in day
    const goldAmt  = M.sat(1 - Math.abs(el-0.10)*7); // golden-hour window
    const nightAmt = 1 - M.sat((el+0.09)*6.5);

    // Sun colour: deep amber at the horizon, near-white at noon.
    const sunC = new THREE.Color().setRGB(
      M.lerp(1.00, 1.00, dayAmt),
      M.lerp(0.46, 0.96, M.sat(el*3.0)),
      M.lerp(0.18, 0.90, M.sat(el*2.4)));
    const moonC = new THREE.Color(0.55,0.64,0.92);

    const useMoon = el < -0.03 && this.moonDir.y > 0.02;
    const key = useMoon ? this.moonDir : this.sunDir;
    const keyC = useMoon ? moonC : sunC;
    const keyI = useMoon ? 0.34*M.sat(this.moonDir.y*3) : (3.35*M.sat(el*2.6+0.06));

    this.sun.color.copy(keyC);
    this.sun.intensity = keyI;
    this.sunFar.color.copy(keyC);
    this.sunFar.intensity = keyI*0.001;   // far cascade only casts, key lights
    this.sunFar.visible = keyI > 0.02;
    this.keyDir = key;

    // Hemisphere bounce: sky above, warm ground below.
    this.hemi.color.setRGB(
      M.lerp(0.10,0.62,dayAmt) + goldAmt*0.18,
      M.lerp(0.13,0.72,dayAmt) + goldAmt*0.10,
      M.lerp(0.26,0.92,dayAmt));
    this.hemi.groundColor.setRGB(
      M.lerp(0.05,0.34,dayAmt)+goldAmt*0.12,
      M.lerp(0.05,0.29,dayAmt)+goldAmt*0.06,
      M.lerp(0.06,0.21,dayAmt));
    this.hemi.intensity = M.lerp(0.30, 0.86, dayAmt);

    this.fill.position.set(-key.x, 0.35, -key.z).normalize();
    this.fill.intensity = M.lerp(0.05, 0.24, dayAmt);
    this.fill.color.setRGB(1.0, M.lerp(0.72,0.86,dayAmt), M.lerp(0.50,0.72,dayAmt));

    /* --- Fog: aerial perspective tinted toward the sun ------------------- */
    const fogDay  = new THREE.Color(0.60,0.68,0.80);
    const fogGold = new THREE.Color(0.86,0.62,0.42);
    const fogNite = new THREE.Color(0.045,0.060,0.105);
    const fc = fogDay.clone().lerp(fogGold, goldAmt*0.75).lerp(fogNite, nightAmt);
    this.fog.color.copy(fc);
    this.sky.uniforms.uSun.value.copy(this.sunDir);
    this.sky.uniforms.uMoon.value.copy(this.moonDir);
    this.sky.uniforms.uNight.value = nightAmt;
    this.sky.uniforms.uIntensity.value = M.lerp(0.5, 1.0, dayAmt);

    /* --- LUT cross-fade (§1) --------------------------------------------
       night → dawn → day → dusk → night, keyed on sun elevation and whether
       the sun is climbing or falling. */
    const rising = Math.cos((h-12)*Math.PI/12) >= 0 ? (h < 12) : (h < 12);
    const climbing = h > 0 && h < 12.6;
    let a,b,mix;
    if(el < -0.14){ a='night'; b='night'; mix=0; }
    else if(el < 0.16){
      const t = M.sat((el+0.14)/0.30);
      a='night'; b = climbing ? 'dawn' : 'dusk'; mix=t;
    } else {
      const t = M.sat((el-0.16)/0.24);
      a = climbing ? 'dawn' : 'dusk'; b='day'; mix=t;
    }
    this.composer.setGrade(a,b,mix);

    this.dayAmt = dayAmt; this.nightAmt = nightAmt; this.goldAmt = goldAmt;
    this._frame++;
  }

  /* Keep the shadow frusta wrapped around the player. Near cascade every
     frame; far cascade every 3rd (§20). */
  followTarget(pos){
    const d = this.keyDir || this.sunDir;
    this.sun.position.set(pos.x + d.x*110, pos.y + d.y*110, pos.z + d.z*110);
    this.sun.target.position.copy(pos);
    this.sun.target.updateMatrixWorld();
    if(this._frame % 3 === 0){
      this.sunFar.position.set(pos.x + d.x*500, pos.y + d.y*500, pos.z + d.z*500);
      this.sunFar.target.position.copy(pos);
      this.sunFar.target.updateMatrixWorld();
    }
  }

  clockString(){
    const h = Math.floor(this.hour), m = Math.floor((this.hour%1)*60);
    const ampm = h<12 ? 'AM':'PM';
    const hh = h%12===0?12:h%12;
    return `${hh}:${m<10?'0':''}${m} ${ampm}`;
  }
}
/* ==========================================================================
   TERRAIN
   4096 x 4096 units, continuous, no invisible walls (§4).

   Build order inside this module:
     1. Continental base  — 2 octaves at huge scale
     2. Ridged multifractal for the mountain spine
     3. Droplet hydraulic erosion (40k droplets) — carves real drainage
     4. River carving from 4 sources, flowing downhill to the coast
     5. Splat weights by slope + altitude + moisture

   The heightfield is baked once at 512x512 (8 units/texel) and sampled
   bilinearly. Mesh vertices and physics queries call the SAME function, so
   the ground you stand on is always the ground you see.
   ========================================================================== */

const BIOME = { FLATS:0, RIDGE:1, GRASS:2, COPPER:3, DELTA:4 };
const BIOME_NAMES = ['The Yellow Flats','Signal Ridge','The Grasslands',
                     'Copperwire Basin','The Delta'];

class Terrain {
  constructor(){
    this.N = CFG.HFIELD;
    this.step = CFG.WORLD / (this.N-1);
    this.h = new Float32Array(this.N*this.N);
    this.moist = new Float32Array(this.N*this.N);
    this.river = new Float32Array(this.N*this.N);   // 0..1 river influence
    this.chunks = new Map();
    this.pending = [];
    this._v = new THREE.Vector3();
  }

  /* ---- 1-2. Base shape ------------------------------------------------- */
  generateBase(){
    const N=this.N, h=this.h;
    for(let j=0;j<N;j++){
      for(let i=0;i<N;i++){
        const wx = (i/(N-1))*CFG.WORLD - CFG.HALF;
        const wz = (j/(N-1))*CFG.WORLD - CFG.HALF;
        const u = wx/CFG.WORLD, v = wz/CFG.WORLD;

        // Continental: 2 octaves, huge scale. Sets land vs sea.
        let cont = NZ.fbm(u*1.35, v*1.35, 2)*0.5 + 0.5;

        // Coast falloff: the south-east corner drains to ocean, the rest
        // is walled by escarpment. Boundary is geography, never a wall.
        const dx = Math.max(0, Math.abs(u)-0.34), dz = Math.max(0, Math.abs(v)-0.34);
        const edge = M.sat(1 - Math.hypot(dx,dz)*4.4);
        const oceanPull = M.sat((v-0.30)*3.2) * M.sat((u+0.10)*2.2);

        // Mountain spine across the north.
        const [ru,rv] = NZ.warp(u*2.2, v*2.2, 0.22, 1.4);
        const ridgeMask = M.sat((-v - 0.10)*3.1) * M.sat(1-Math.abs(u+0.02)*1.55);
        const ridge = NZ.ridged(ru*2.6, rv*2.6, 6) * ridgeMask;

        // Mesa plateaus in the south-west: terraced, flat-topped.
        const mesaMask = M.sat((-u-0.06)*2.6) * M.sat((v-0.02)*2.4);
        let mesa = NZ.fbm(u*4.2+31, v*4.2-17, 3)*0.5+0.5;
        mesa = M.sat((mesa-0.54)*5.5);
        mesa = Math.round(mesa*3)/3;                  // terrace it
        mesa *= mesaMask;

        // Basin: Copperwire is scooped out and scarred.
        const basinMask = M.sat((u-0.10)*3.0)*M.sat(1-Math.abs(v+0.02)*2.6);
        const basin = -M.sat(NZ.fbm(u*5.5-9, v*5.5+4, 3)*0.5+0.5)*basinMask;

        /* Secondary ranges. The single spine left most of the map flat and
           featureless; three warped ridge fields at different scales and
           orientations give the country real shape wherever you stand. */
        const [r2u,r2v] = NZ.warp(u*4.1+11, v*4.1-7, 0.30, 2.2);
        const range2 = NZ.ridged(r2u*3.4, r2v*3.4, 5)
                     * M.sat(NZ.fbm(u*1.7-4, v*1.7+9, 2)*0.9+0.35);
        const [r3u,r3v] = NZ.warp(v*6.6-19, u*6.6+23, 0.26, 2.6);
        const range3 = NZ.ridged(r3u*5.2, r3v*5.2, 4)
                     * M.sat(NZ.fbm(u*2.3+15, v*2.3-11, 2)*0.85+0.20);

        /* Rolling hill country: the mid-frequency layer that stops open ground
           reading as a putting green. */
        const hills = NZ.fbm(u*13, v*13, 4)*0.5+0.5;
        const hillMask = M.sat(NZ.fbm(u*2.6-31, v*2.6+17, 2)*1.2+0.45);

        /* Badlands: inverted ridges cut into gullies and fluted walls. */
        const badMask = M.sat(NZ.fbm(u*3.1+55, v*3.1-42, 3)*1.4 - 0.28);
        const bad = (1 - NZ.ridged(u*26, v*26, 4)) * badMask;

        let hh = cont*0.30
               + ridge*0.86 + range2*0.34 + range3*0.19
               + mesa*0.30 + basin*0.12
               + hills*hillMask*0.115
               - bad*0.085;
        hh *= edge*0.85 + 0.15;
        hh -= oceanPull*0.34;
        hh += NZ.fbm(u*9.5, v*9.5, 4)*0.055;          // medium relief
        hh += NZ.fbm(u*31, v*31, 3)*0.016;            // fine relief

        h[j*N+i] = hh * CFG.PEAK - 14;
      }
    }
  }

  /* ---- 3. Droplet hydraulic erosion ------------------------------------
     Each droplet carries sediment downhill, cutting where it accelerates and
     depositing where it slows. 40k droplets over a 512² field carves real
     dendritic drainage in about a second. */
  erode(count=40000, steps=34){
    const N=this.N, h=this.h;
    const rnd = M.rng(9182736);
    const gradAt = (px,pz)=>{
      const xi=M.clamp(Math.floor(px),0,N-2), zi=M.clamp(Math.floor(pz),0,N-2);
      const fx=px-xi, fz=pz-zi;
      const i=zi*N+xi;
      const h00=h[i], h10=h[i+1], h01=h[i+N], h11=h[i+N+1];
      const gx = (h10-h00)*(1-fz) + (h11-h01)*fz;
      const gz = (h01-h00)*(1-fx) + (h11-h10)*fx;
      const hh = h00*(1-fx)*(1-fz)+h10*fx*(1-fz)+h01*(1-fx)*fz+h11*fx*fz;
      return [gx,gz,hh,xi,zi,fx,fz];
    };
    const deposit=(xi,zi,fx,fz,amt)=>{
      const i=zi*N+xi;
      h[i]      += amt*(1-fx)*(1-fz);
      h[i+1]    += amt*fx*(1-fz);
      h[i+N]    += amt*(1-fx)*fz;
      h[i+N+1]  += amt*fx*fz;
    };
    const ERODE=0.32, DEPOSIT=0.24, EVAP=0.022, CAPACITY=3.4, INERTIA=0.055,
          MINSLOPE=0.012, GRAV=5.0;
    for(let d=0;d<count;d++){
      let px = rnd()*(N-2), pz = rnd()*(N-2);
      let dx=0, dz=0, speed=1, water=1, sed=0;
      for(let s=0;s<steps;s++){
        const [gx,gz,hh,xi,zi,fx,fz] = gradAt(px,pz);
        dx = dx*INERTIA - gx*(1-INERTIA);
        dz = dz*INERTIA - gz*(1-INERTIA);
        const len = Math.hypot(dx,dz);
        if(len < 1e-5) break;
        dx/=len; dz/=len;
        const nx = px+dx, nz = pz+dz;
        if(nx<1||nx>=N-2||nz<1||nz>=N-2) break;
        const nh = gradAt(nx,nz)[2];
        const dh = nh - hh;
        const cap = Math.max(-dh, MINSLOPE)*speed*water*CAPACITY;
        if(sed > cap || dh > 0){
          const amt = dh>0 ? Math.min(dh, sed) : (sed-cap)*DEPOSIT;
          sed -= amt; deposit(xi,zi,fx,fz,amt);
        } else {
          const amt = Math.min((cap-sed)*ERODE, -dh);
          sed += amt; deposit(xi,zi,fx,fz,-amt);
        }
        speed = Math.sqrt(Math.max(0, speed*speed + (-dh)*GRAV));
        water *= (1-EVAP);
        px=nx; pz=nz;
        if(water < 0.02) break;
      }
    }
  }

  /* ---- 4. Rivers -------------------------------------------------------
     Four sources on the high ground. Each walks steepest-descent to the sea,
     carving a widening channel and painting moisture along its banks. */
  carveRivers(){
    const N=this.N, h=this.h, riv=this.river, mo=this.moist;
    const sources = [[0.42,0.16],[0.55,0.24],[0.30,0.10],[0.68,0.30]];
    const rnd = M.rng(5150);
    for(let sIdx=0;sIdx<sources.length;sIdx++){
      let x = sources[sIdx][0]*N, z = sources[sIdx][1]*N;
      let width = 2.2, depth = 1.4;
      for(let step=0; step<1400; step++){
        const xi=M.clamp(Math.round(x),1,N-2), zi=M.clamp(Math.round(z),1,N-2);
        // Carve a soft channel.
        const R = Math.ceil(width)+2;
        for(let dz=-R;dz<=R;dz++) for(let dx=-R;dx<=R;dx++){
          const ix=xi+dx, iz=zi+dz;
          if(ix<0||ix>=N||iz<0||iz>=N) continue;
          const d = Math.hypot(dx,dz);
          const w = M.sat(1 - d/(width+2));
          const cut = w*w*depth;
          const i = iz*N+ix;
          h[i] -= cut;
          riv[i] = Math.max(riv[i], w);
          mo[i]  = Math.max(mo[i], M.sat(1 - d/(width+9)));
        }
        // Steepest descent with a wander so channels meander.
        let bx=0,bz=0,best=1e9;
        for(let a=0;a<12;a++){
          const ang = a/12*Math.PI*2;
          const sx = Math.round(x+Math.cos(ang)*2.2), sz = Math.round(z+Math.sin(ang)*2.2);
          if(sx<1||sx>=N-1||sz<1||sz>=N-1) continue;
          const hh = h[sz*N+sx];
          if(hh < best){ best=hh; bx=Math.cos(ang); bz=Math.sin(ang); }
        }
        if(best>=1e9) break;
        const wob = (rnd()-0.5)*0.55;
        const ca=Math.cos(wob), sa=Math.sin(wob);
        const nx = bx*ca - bz*sa, nz = bx*sa + bz*ca;
        x += nx*2.0; z += nz*2.0;
        width  = Math.min(9.0, width + 0.0075);
        depth  = Math.min(3.4, depth + 0.0022);
        if(x<2||x>=N-2||z<2||z>=N-2) break;
        if(h[M.clamp(Math.round(z),0,N-1)*N + M.clamp(Math.round(x),0,N-1)] < CFG.SEA-1.5) break;
      }
    }
  }

  /* ---- Moisture, used by the splat and by vegetation density ---------- */
  buildMoisture(){
    const N=this.N, mo=this.moist, h=this.h;
    for(let j=0;j<N;j++) for(let i=0;i<N;i++){
      const idx=j*N+i;
      const u=i/(N-1)-0.5, v=j/(N-1)-0.5;
      let m = NZ.fbm(u*3.4+61, v*3.4-22, 4)*0.5+0.5;
      m += M.sat((v-0.18)*2.6)*0.42;                       // delta is wet
      m -= M.sat((-u-0.10)*2.4)*M.sat((v+0.02)*2.0)*0.46;  // flats are dry
      m += M.sat((CFG.SEA+3 - h[idx])*0.12)*0.5;           // low ground holds water
      m -= M.sat((h[idx]-120)/110)*0.35;                   // high ground is dry
      mo[idx] = M.sat(Math.max(m, mo[idx]));
    }
  }

  /* --- Roads ------------------------------------------------------------
     A road is written into three places: the heightfield (graded so a wagon
     could actually take it), the road mask (used by the terrain shader, the
     scatter and the footstep surface), and a centreline the props follow. */
  gradeRoad(points, width){
    if(!this.road) this.road = new Float32Array(this.N*this.N);
    return this.gradeCorridor(points, width, this.road, 0.92);
  }
  /* The permanent way gets a wider formation and is cut and filled harder:
     a railway holds its gradient through the country, it does not follow it. */
  gradeRail(points, width){
    if(!this.rail) this.rail = new Float32Array(this.N*this.N);
    return this.gradeCorridor(points, width, this.rail, 0.99);
  }
  gradeCorridor(points, width, mask, blend){
    const N=this.N, st=this.step, h=this.h, road=mask;
    const halfW = width*0.5, feather = width*1.05;
    for(let s=0;s<points.length-1;s++){
      const a=points[s], b=points[s+1];
      const seg = Math.hypot(b.x-a.x, b.z-a.z);
      const steps = Math.max(1, Math.ceil(seg/(st*0.45)));
      for(let k=0;k<=steps;k++){
        const t=k/steps;
        const wx = M.lerp(a.x,b.x,t), wz = M.lerp(a.z,b.z,t);
        const wy = M.lerp(a.y,b.y,t);
        const cx=(wx+CFG.HALF)/st, cz=(wz+CFG.HALF)/st;
        const rr=(halfW+feather)/st;
        const i0=Math.max(0,Math.floor(cx-rr)), i1=Math.min(N-1,Math.ceil(cx+rr));
        const j0=Math.max(0,Math.floor(cz-rr)), j1=Math.min(N-1,Math.ceil(cz+rr));
        for(let j=j0;j<=j1;j++) for(let i=i0;i<=i1;i++){
          const d = Math.hypot(i-cx, j-cz)*st;
          if(d > halfW+feather) continue;
          const w = 1 - M.smooth(M.sat((d-halfW)/feather));
          const idx = j*N+i;
          h[idx] = M.lerp(h[idx], wy, w*blend);
          road[idx] = Math.max(road[idx], w);
        }
      }
    }
  }

  /* The mask the terrain shader samples, so the carriageway is visibly a
     road rather than just a smooth patch of grass. */
  roadTexture(){
    const N=this.N, data=new Uint8Array(N*N*4);
    const r = this.road || new Float32Array(N*N);
    for(let i=0;i<N*N;i++){
      const v = M.sat(r[i])*255;
      data[i*4]=v; data[i*4+1]=v; data[i*4+2]=v; data[i*4+3]=255;
    }
    const t = new THREE.DataTexture(data, N, N, THREE.RGBAFormat);
    t.minFilter = t.magFilter = THREE.LinearFilter;
    t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping;
    t.colorSpace = THREE.NoColorSpace;
    t.needsUpdate = true;
    return t;
  }
  roadAt(wx,wz){ return this.road ? this.sample(this.road, wx, wz) : 0; }
  railAt(wx,wz){ return this.rail ? this.sample(this.rail, wx, wz) : 0; }
  gradedAt(wx,wz){ return Math.max(this.roadAt(wx,wz), this.railAt(wx,wz)); }

  /* Level a bench of ground for a settlement. The centre goes flat and the
     edge feathers back into the landscape, so a town sits ON the country
     rather than being stamped into it. */
  flattenDisc(wx, wz, radius, feather, targetH){
    const N=this.N, h=this.h, st=this.step;
    const cx = (wx+CFG.HALF)/st, cz = (wz+CFG.HALF)/st;
    const rr = radius/st, ff = feather/st;
    const i0=Math.max(0,Math.floor(cx-rr-ff)), i1=Math.min(N-1,Math.ceil(cx+rr+ff));
    const j0=Math.max(0,Math.floor(cz-rr-ff)), j1=Math.min(N-1,Math.ceil(cz+rr+ff));
    for(let j=j0;j<=j1;j++) for(let i=i0;i<=i1;i++){
      const d = Math.hypot(i-cx, j-cz);
      if(d > rr+ff) continue;
      const w = 1 - M.smooth(M.sat((d-rr)/Math.max(ff,1e-3)));
      const k = j*N+i;
      h[k] = M.lerp(h[k], targetH, w);
      this.river[k] *= (1-w*0.85);       // no creek running through the saloon
    }
  }

  /* Open the waterline. Heights within the band are pushed away from sea level
     so the water plane can never graze the ground and speckle it. */
  shapeShore(band=2.2){
    const h=this.h;
    for(let i=0;i<h.length;i++){
      const k = h[i] - CFG.SEA;
      if(k > -band && k < band){
        const s = Math.abs(k)/band;
        h[i] = CFG.SEA + Math.sign(k||1)*band*Math.pow(s, 0.42);
      }
    }
  }

  bake(){
    this.generateBase();
    this.erode();
    this.carveRivers();
    this.shapeShore();
    this.buildMoisture();
  }

  /* ---- Sampling ---------------------------------------------------------
     One authority for terrain height. Bilinear on the baked field plus the
     same detail noise the mesh uses, so meshes and physics never disagree. */
  detail(wx,wz){
    return NZ.fbm(wx*0.052, wz*0.052, 3)*0.62
         + NZ.fbm(wx*0.115, wz*0.115, 2)*0.16;
  }
  heightAt(wx,wz){
    const N=this.N;
    const fx = (wx + CFG.HALF)/this.step, fz = (wz + CFG.HALF)/this.step;
    const xi = M.clamp(Math.floor(fx),0,N-2), zi = M.clamp(Math.floor(fz),0,N-2);
    const tx = M.sat(fx-xi), tz = M.sat(fz-zi);
    const i = zi*N+xi, h=this.h;
    const a = h[i]*(1-tx)+h[i+1]*tx;
    const b = h[i+N]*(1-tx)+h[i+N+1]*tx;
    const base = a*(1-tz)+b*tz;
    // Detail is suppressed inside river channels so water beds stay smooth, and
    // flattened near the waterline so beaches and lake beds read as beaches.
    const rv = this.sample(this.river, wx, wz);
    const rd = Math.max(this.road ? this.sample(this.road, wx, wz) : 0,
                        this.rail ? this.sample(this.rail, wx, wz) : 0);
    const shore = M.sat(Math.abs(base - CFG.SEA)/2.6);
    let flat = 1 - rd*0.96;
    if(this.flatZones){
      for(let i=0;i<this.flatZones.length;i++){
        const z = this.flatZones[i];
        const d = Math.hypot(wx-z.x, wz-z.z);
        if(d < z.r + z.f) flat = Math.min(flat, M.smooth(M.sat((d-z.r)/z.f))*0.94+0.06);
      }
    }
    return base + this.detail(wx,wz)*(1-rv*0.85)*shore*flat;
  }

  /* A coarse height map of the waterline band, uploaded once so the water
     shader can work out how deep it is and cut itself off at the shore. */
  shoreTexture(){
    const N=this.N, data=new Uint8Array(N*N*4);
    const lo = CFG.SEA - 6, span = 24;
    for(let i=0;i<N*N;i++){
      const v = M.sat((this.h[i]-lo)/span)*255;
      data[i*4]=v; data[i*4+1]=v; data[i*4+2]=v; data[i*4+3]=255;
    }
    const t = new THREE.DataTexture(data, N, N, THREE.RGBAFormat);
    t.minFilter = t.magFilter = THREE.LinearFilter;
    t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping;
    t.colorSpace = THREE.NoColorSpace;
    t.needsUpdate = true;
    return t;
  }
  sample(arr, wx, wz){
    const N=this.N;
    const fx=(wx+CFG.HALF)/this.step, fz=(wz+CFG.HALF)/this.step;
    const xi=M.clamp(Math.floor(fx),0,N-2), zi=M.clamp(Math.floor(fz),0,N-2);
    const tx=M.sat(fx-xi), tz=M.sat(fz-zi);
    const i=zi*N+xi;
    return (arr[i]*(1-tx)+arr[i+1]*tx)*(1-tz) + (arr[i+N]*(1-tx)+arr[i+N+1]*tx)*tz;
  }
  normalAt(wx,wz,e=0.9){
    const hL=this.heightAt(wx-e,wz), hR=this.heightAt(wx+e,wz);
    const hD=this.heightAt(wx,wz-e), hU=this.heightAt(wx,wz+e);
    return this._v.set(hL-hR, 2*e, hD-hU).normalize().clone();
  }
  slopeAt(wx,wz){ return Math.acos(M.clamp(this.normalAt(wx,wz).y,-1,1)); }

  /* ---- Biome classification ------------------------------------------ */
  /* One pass for scatter queries. Height, slope, grass weight and moisture in
     three height samples instead of the ten that calling heightAt, slopeAt,
     splatAt and sample separately would cost. */
  scatterAt(wx,wz,out){
    const y  = this.heightAt(wx,wz);
    const hx = this.heightAt(wx+1.1,wz);
    const hz = this.heightAt(wx,wz+1.1);
    const slope = Math.atan(Math.hypot(y-hx, y-hz)/1.1);
    const moist = this.sample(this.moist,wx,wz);
    const biome = this.biomeAt(wx,wz,y);
    const steep = M.sstep(0.38, 0.80, slope);
    let g;
    switch(biome){
      case BIOME.RIDGE:  g = 0.72*(1-M.sat((y-CFG.SNOWLINE)/34)); break;
      case BIOME.FLATS:  g = 0.10; break;
      case BIOME.COPPER: g = 0.16; break;
      case BIOME.DELTA:  g = 0.80; break;
      default:           g = 0.72*M.lerp(0.5,1,moist);
    }
    g *= (1-steep);
    const rdv = this.road ? this.sample(this.road, wx, wz) : 0;
    const rlv = this.rail ? this.sample(this.rail, wx, wz) : 0;
    g *= M.sat(1 - Math.max(rdv, rlv)*2.4);   // nothing grows in a rut or on ballast
    out.road = rdv;
    out.y = y; out.slope = slope; out.grass = g; out.moist = moist;
    return out;
  }

  /* Regions, not quadrants.

     The old field split the whole 4096 square into four huge wedges, so from
     any given spot you could ride for ten minutes and see one biome. This
     partitions the map into heavily domain-warped cells around 330 units
     across and picks a biome per cell, weighted by that cell's own altitude
     and moisture. Neighbouring cells usually differ, so a short ride crosses
     several distinct kinds of country — while altitude and the waterline still
     override everything, because snow belongs on peaks and reeds belong in
     water no matter what the cell rolled. */
  biomeAt(wx,wz,knownH){
    const h = (knownH !== undefined) ? knownH : this.heightAt(wx,wz);
    if(h > CFG.SNOWLINE - 34) return BIOME.RIDGE;
    if(h < CFG.SEA + 3.0)     return BIOME.DELTA;

    const S = CFG.BIOME_SCALE;
    const [wu,wv] = NZ.warp(wx/S, wz/S, 0.62, 1.30);
    const ci = Math.floor(wu), cj = Math.floor(wv);
    const r = M.hash(ci*73856093 ^ cj*19349663);

    // Cell character comes from where the cell actually sits.
    const moist = this.sample(this.moist, wx, wz);
    const alt   = M.sat((h - 30)/110);
    const dry   = 1 - moist;
    const low   = 1 - M.sat((h - CFG.SEA)/26);

    const w = [
      /* FLATS  */ 0.55 + dry*1.55 - alt*0.70,
      /* RIDGE  */ 0.30 + alt*2.10,
      /* GRASS  */ 0.95 + moist*0.95 - alt*0.45,
      /* COPPER */ 0.50 + dry*0.85 + M.sat(alt*1.4-0.15)*0.55,
      /* DELTA  */ 0.28 + moist*1.35 + low*1.05,
    ];
    let sum=0; for(let i=0;i<5;i++){ w[i]=Math.max(0.02,w[i]); sum+=w[i]; }
    let acc=0, pick=r*sum;
    for(let i=0;i<5;i++){ acc+=w[i]; if(pick<=acc) return i; }
    return BIOME.GRASS;
  }

  /* ---- Splat weights (rock / grass / sand / snow) ---------------------- */
  splatAt(wx,wz,h,slope){
    const moist = this.sample(this.moist,wx,wz);
    const biome = this.biomeAt(wx,wz);
    const steep = M.sstep(0.38, 0.80, slope);
    const alt   = M.sat((h-CFG.SNOWLINE)/34);
    const dry   = 1-moist;

    // Layers: 0 rock, 1 grass/veg, 2 sand/dry, 3 snow/salt
    let a=0.05, b=0, c=0, d=0;
    if(biome===BIOME.RIDGE){ b = 0.72*(1-alt); a = 0.30 + alt*0.1; d = alt; }
    else if(biome===BIOME.FLATS){ c = 0.86; a = 0.16; d = M.sat((0.16-Math.abs(h-2)*0.08)); }
    else if(biome===BIOME.COPPER){ c = 0.34; a = 0.60; }
    else if(biome===BIOME.DELTA){ b = 0.80; c = 0.20; }
    else { b = 0.72*M.lerp(0.5,1,moist); c = 0.36*dry; a = 0.16; }

    // Slope always wins — you cannot grow grass on a cliff.
    a = M.lerp(a, 1.0, steep);
    b *= (1-steep); c *= (1-steep*0.8); d *= (1-steep*0.55);
    // Snow above the line regardless of biome.
    d = Math.max(d, alt*(1-steep*0.4));
    // River banks are wet mud, not sand.
    const rv = this.sample(this.river,wx,wz);
    if(rv>0.02){ b = M.lerp(b, 0.9, rv*0.6); c *= (1-rv*0.7); }
    // A graded road is bare, packed earth: no grass, no snow, some gravel.
    if(this.road){
      const rd = M.sat(this.sample(this.road,wx,wz)*1.15);
      if(rd > 0.01){
        b *= (1-rd); d *= (1-rd*0.9);
        a = M.lerp(a, 0.42, rd); c = M.lerp(c, 0.58, rd);
      }
    }

    const s = a+b+c+d || 1;
    return [a/s,b/s,c/s,d/s, biome];
  }

  /* Macro tint: the base palette is authentic Western — bone, ochre, sage,
     dust rose, slate. Yellow is never terrain (§2). */
  tintAt(wx,wz,biome,h){
    const n = NZ.fbm(wx*0.0034, wz*0.0034, 3)*0.5+0.5;
    const n2 = NZ.fbm(wx*0.021, wz*0.021, 2)*0.5+0.5;
    let c;
    switch(biome){
      case BIOME.FLATS:  c=[1.02,0.94,0.78]; break;
      case BIOME.RIDGE:  c=[0.86,0.92,0.90]; break;
      case BIOME.COPPER: c=[0.92,0.80,0.70]; break;
      case BIOME.DELTA:  c=[0.80,0.88,0.76]; break;
      default:           c=[0.96,0.96,0.86];
    }
    const k = 0.86 + n*0.26;
    const g = 0.94 + n2*0.13;
    return [c[0]*k*g, c[1]*k*g, c[2]*k*g];
  }

  /* =====================================================================
     CHUNK MESHES
     128-unit cells, 3 LODs by ring distance, built on a per-frame budget.
     ===================================================================== */
  buildChunkGeometry(cx,cz,res){
    const size = CFG.CHUNK;
    const ox = cx*size - CFG.HALF, oz = cz*size - CFG.HALF;
    const n = res+1;
    const pos = new Float32Array(n*n*3);
    const nrm = new Float32Array(n*n*3);
    const uv  = new Float32Array(n*n*2);
    const col = new Float32Array(n*n*3);
    const spl = new Float32Array(n*n*4);
    const idx = new Uint32Array(res*res*6);
    const cell = size/res;
    for(let j=0;j<n;j++){
      for(let i=0;i<n;i++){
        const k=j*n+i;
        const wx = ox + i*cell, wz = oz + j*cell;
        const h = this.heightAt(wx,wz);
        pos[k*3]=wx; pos[k*3+1]=h; pos[k*3+2]=wz;
        const nn = this.normalAt(wx,wz, cell*0.9);
        nrm[k*3]=nn.x; nrm[k*3+1]=nn.y; nrm[k*3+2]=nn.z;
        uv[k*2]=i/res; uv[k*2+1]=j/res;
        const slope = Math.acos(M.clamp(nn.y,-1,1));
        const s = this.splatAt(wx,wz,h,slope);
        spl[k*4]=s[0]; spl[k*4+1]=s[1]; spl[k*4+2]=s[2]; spl[k*4+3]=s[3];
        const t = this.tintAt(wx,wz,s[4],h);
        // Vertex-colour dirt: darken where water collects and in creases (§2).
        const ao = 0.80 + 0.20*M.sat((nn.y-0.55)*2.6);
        const wet = this.sample(this.river,wx,wz);
        col[k*3]  = t[0]*ao*(1-wet*0.30);
        col[k*3+1]= t[1]*ao*(1-wet*0.24);
        col[k*3+2]= t[2]*ao*(1-wet*0.16);
      }
    }
    let p=0;
    for(let j=0;j<res;j++) for(let i=0;i<res;i++){
      const a=j*n+i, b=a+1, c=a+n, d=c+1;
      idx[p++]=a; idx[p++]=c; idx[p++]=b;
      idx[p++]=b; idx[p++]=c; idx[p++]=d;
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos,3));
    g.setAttribute('normal',   new THREE.BufferAttribute(nrm,3));
    g.setAttribute('uv',       new THREE.BufferAttribute(uv,2));
    g.setAttribute('color',    new THREE.BufferAttribute(col,3));
    g.setAttribute('aSplat',   new THREE.BufferAttribute(spl,4));
    g.setIndex(new THREE.BufferAttribute(idx,1));
    g.computeBoundingSphere();
    return g;
  }
}

/* ==========================================================================
   TERRAIN MATERIAL
   MeshStandardMaterial with a 4-way splat blend injected. Extending the
   standard material rather than writing a custom one keeps shadows, fog,
   and the light rig working for free.
   ========================================================================== */
function makeTerrainMaterial(lib, roadTex){
  const mat = new THREE.MeshStandardMaterial({
    vertexColors:true, roughness:1.0, metalness:0.0,
    normalMap: lib.g_rock.normalMap,
    normalScale: new THREE.Vector2(0.55,0.55),
  });
  mat.normalMap.repeat.set(220,220);
  const uni = {
    tRock:{value:lib.g_rock.map},   tGrass:{value:lib.g_grass.map},
    tSand:{value:lib.g_sand.map},   tSnow:{value:lib.g_snow.map},
    tRockR:{value:lib.g_rock.roughnessMap}, tGrassR:{value:lib.g_grass.roughnessMap},
    tSandR:{value:lib.g_sand.roughnessMap}, tSnowR:{value:lib.g_snow.roughnessMap},
    uTile:{value:0.085}, uMacro:{value:0.0042}, uWetness:{value:0.0},
    uRoad:{value:roadTex||null}, uInvWorld:{value:1/CFG.WORLD},
  };
  mat.userData.uniforms = uni;
  mat.onBeforeCompile = (sh)=>{
    Object.assign(sh.uniforms, uni);
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', `#include <common>
        attribute vec4 aSplat;
        varying vec4 vSplat;
        varying vec3 vWPos;`)
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        vSplat = aSplat;
        vWPos = (modelMatrix*vec4(transformed,1.0)).xyz;`);
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', `#include <common>
        uniform sampler2D tRock,tGrass,tSand,tSnow;
        uniform sampler2D tRockR,tGrassR,tSandR,tSnowR;
        uniform float uTile,uMacro,uWetness,uInvWorld;
        uniform sampler2D uRoad;
        varying vec4 vSplat;
        varying vec3 vWPos;`)
      .replace('#include <map_fragment>', `
        vec4 w = vSplat / max(vSplat.x+vSplat.y+vSplat.z+vSplat.w, 1e-4);
        vec2 duv = vWPos.xz * uTile;
        // Two tiling rates blended by a macro noise kills visible repetition.
        vec2 duv2 = vWPos.xz * uTile * 0.31;
        float mblend = 0.5 + 0.5*sin(vWPos.x*uMacro*7.0)*cos(vWPos.z*uMacro*5.0);
        vec3 cRock = mix(texture2D(tRock ,duv).rgb, texture2D(tRock ,duv2).rgb, mblend*0.5);
        vec3 cGras = mix(texture2D(tGrass,duv).rgb, texture2D(tGrass,duv2).rgb, mblend*0.5);
        vec3 cSand = mix(texture2D(tSand ,duv).rgb, texture2D(tSand ,duv2).rgb, mblend*0.5);
        vec3 cSnow = mix(texture2D(tSnow ,duv).rgb, texture2D(tSnow ,duv2).rgb, mblend*0.5);
        vec3 splatCol = cRock*w.x + cGras*w.y + cSand*w.z + cSnow*w.w;
        diffuseColor.rgb *= splatCol * 2.05;
        /* The carriageway. Packed earth, darkened, with two paler wheel ruts
           worn into it — the detail that makes a road read as travelled. */
        float rdm = texture2D(uRoad, vWPos.xz*uInvWorld + 0.5).r;
        if(rdm > 0.01){
          float across = fract(vWPos.x*0.11 + vWPos.z*0.11);
          float rut = smoothstep(0.34,0.42,rdm) * (1.0-smoothstep(0.72,0.86,rdm));
          vec3 roadCol = vec3(0.230,0.196,0.156) * (0.86 + rut*0.30);
          roadCol *= 0.90 + 0.20*fract(sin(dot(floor(vWPos.xz*0.6),
                                               vec2(12.9898,78.233)))*43758.5);
          diffuseColor.rgb = mix(diffuseColor.rgb, roadCol, smoothstep(0.06,0.55,rdm));
        }
        // Wetness darkens and smooths the surface (§15).
        diffuseColor.rgb *= mix(1.0, 0.62, uWetness);`)
      .replace('#include <roughnessmap_fragment>', `
        float roughnessFactor = roughness;
        vec4 wr = vSplat / max(vSplat.x+vSplat.y+vSplat.z+vSplat.w, 1e-4);
        vec2 ruv = vWPos.xz * uTile;
        roughnessFactor *= (texture2D(tRockR ,ruv).g*wr.x
                          + texture2D(tGrassR,ruv).g*wr.y
                          + texture2D(tSandR ,ruv).g*wr.z
                          + texture2D(tSnowR ,ruv).g*wr.w) * 1.25;
        roughnessFactor = mix(roughnessFactor, 0.14, uWetness);
        roughnessFactor = clamp(roughnessFactor, 0.04, 1.0);`);
  };
  mat.customProgramCacheKey = ()=> 'terrain-splat-v2';
  return mat;
}

/* ==========================================================================
   WATER
   One shared shader for ocean, rivers and the Delta. Scrolling dual normals,
   fresnel, depth-faded shore, and a sun specular that tracks the light rig.
   ========================================================================== */
function makeWater(noiseTex, shoreTex){
  const uni = {
    uTime:{value:0}, uNoise:{value:noiseTex},
    uShore:{value:shoreTex},
    uShoreLo:{value:CFG.SEA-6}, uShoreSpan:{value:24},
    uSeaY:{value:CFG.SEA-0.25}, uInvWorld:{value:1/CFG.WORLD},
    uSun:{value:new THREE.Vector3(0,1,0)},
    uSunCol:{value:new THREE.Color(1,1,1)},
    uShallow:{value:new THREE.Color(0.12,0.30,0.32)},
    uDeep:{value:new THREE.Color(0.015,0.055,0.075)},
    uSky:{value:new THREE.Color(0.45,0.58,0.72)},
    uWind:{value:new THREE.Vector2(1,0.3)},
    uOpacity:{value:0.93},
  };
  const mat = new THREE.ShaderMaterial({
    uniforms: Object.assign(THREE.UniformsUtils.clone(THREE.UniformsLib.fog), uni),
    transparent:true, depthWrite:false, fog:true,
    vertexShader:`
      varying vec3 vWPos; varying vec2 vUv;
      uniform float uTime; uniform vec2 uWind;
      #include <fog_pars_vertex>
      void main(){
        vUv = uv;
        vec3 p = position;
        // Two crossed gerstner-ish swells, cheap but directional.
        float w1 = sin(p.x*0.09 + uTime*0.9)*cos(p.z*0.07 - uTime*0.6);
        float w2 = sin((p.x+p.z)*0.031 - uTime*0.42);
        p.y += w1*0.055 + w2*0.10;
        vec4 mvPosition = modelViewMatrix*vec4(p,1.0);
        vWPos = (modelMatrix*vec4(p,1.0)).xyz;
        gl_Position = projectionMatrix*mvPosition;
        #include <fog_vertex>
      }`,
    fragmentShader:`
      varying vec3 vWPos; varying vec2 vUv;
      uniform float uTime,uOpacity,uShoreLo,uShoreSpan,uSeaY,uInvWorld;
      uniform sampler2D uNoise, uShore;
      uniform vec3 uSun,uSunCol,uShallow,uDeep,uSky; uniform vec2 uWind;
      #include <fog_pars_fragment>
      void main(){
        /* How deep is the water here? Sampling the terrain's own height map
           means the surface stops exactly at the shoreline instead of grazing
           through every low patch of ground and speckling it grey. */
        vec2 huv = vWPos.xz*uInvWorld + 0.5;
        float ground = texture2D(uShore, huv).r*uShoreSpan + uShoreLo;
        float depth = uSeaY - ground;
        if(depth < 0.02 || huv.x < 0.0 || huv.x > 1.0 || huv.y < 0.0 || huv.y > 1.0)
          discard;

        vec2 uv1 = vWPos.xz*0.055 + uWind*uTime*0.020;
        vec2 uv2 = vWPos.xz*0.135 - uWind*uTime*0.033;
        vec3 n1 = texture2D(uNoise, uv1).rgb*2.0-1.0;
        vec3 n2 = texture2D(uNoise, uv2).rgb*2.0-1.0;
        float chop = clamp(depth*0.6, 0.25, 1.0);
        vec3 N = normalize(vec3((n1.x*0.45+n2.x*0.32)*chop, 3.0,
                                (n1.y*0.45+n2.y*0.32)*chop));
        vec3 V = normalize(cameraPosition - vWPos);
        float fres = pow(1.0 - max(dot(N,V),0.0), 4.0);

        // Colour by actual depth: green and translucent over a sand bar, dark
        // and opaque out in the channel.
        float dFade = clamp(depth/5.5, 0.0, 1.0);
        vec3 body = mix(uShallow, uDeep, dFade);
        vec3 col = mix(body, uSky, clamp(fres*1.25, 0.0, 0.80));

        vec3 H = normalize(uSun + V);
        float spec = pow(max(dot(N,H),0.0), 260.0);
        float sparkle = pow(texture2D(uNoise, uv2*2.6).b, 6.0);
        col += uSunCol*(spec*2.4 + spec*sparkle*6.0);

        // A pale band of wash where it meets the land.
        float foam = (1.0 - smoothstep(0.0, 0.55, depth))
                   * (0.55 + 0.45*sin(vWPos.x*1.7 + vWPos.z*1.3 + uTime*2.1));
        col = mix(col, vec3(0.82,0.86,0.84), clamp(foam,0.0,1.0)*0.55);

        float alpha = uOpacity * clamp(depth*2.2, 0.20, 1.0);
        gl_FragColor = vec4(col, alpha);
        #include <fog_fragment>
      }`,
  });
  mat.userData.uniforms = uni;
  return mat;
}
/* ==========================================================================
   VEGETATION
   Grass: 40,000 GPU-instanced cross-quads inside 40 units, repositioned in a
   rolling grid as the player moves, bent by a two-frequency wind (§4).
   Trees: grown recursively per species with a unique seed each, so no two
   trees in the world are identical. 3 LODs plus a billboard.
   ========================================================================== */

/* ---- GRASS ---------------------------------------------------------------
   Rewritten. The old field was cross-quads with a triangular alpha cut, which
   read as a forest of green cones, and it re-scattered every blade whenever the
   player crossed a cell boundary, so the whole field crawled as you walked.

   Now: real tapered blade geometry (8 verts, no texture, no alpha test), and
   placement derived from a hash of the WORLD cell a blade sits in. A blade at a
   given patch of ground always lands in the same spot with the same lean, so
   moving the field costs nothing visually — only the blades wrapping around the
   far edge change, and those are already faded out.

   Two rings stacked as a clipmap: a dense one underfoot and a coarse one with
   bigger blades reaching much further out, so there is no bald circle. */

function bladeGeometry(segs=3){
  const P=[], I=[];
  for(let i=0;i<=segs;i++){
    const v = i/segs;
    P.push(-1, v, 0,   1, v, 0);     // x carries the side sign, y the length
  }
  for(let i=0;i<segs;i++){
    const a=i*2, b=a+1, c=a+2, d=a+3;
    I.push(a,c,b, b,c,d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(P,3));
  g.setIndex(I);
  return g;
}

/* Deterministic per-cell hash. Same world cell, same blade, forever. */
function cellHash(x, z, salt){
  let n = (x*374761393 + z*668265263 + salt*1442695040) | 0;
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}

function makeGrassLayer(terrain, opts){
  const { spacing, cols, width, height, fadeIn, fadeOut, tiltBias } = opts;
  const COUNT = cols*cols;
  const inner = fadeIn > 0.01 ? (fadeIn - 11) : -1;

  const base = bladeGeometry(3);
  const geo = new THREE.InstancedBufferGeometry();
  geo.index = base.index;
  geo.attributes.position = base.attributes.position;

  const off   = new Float32Array(COUNT*3);
  const parm  = new Float32Array(COUNT*4);   // yaw, scale, phase, lean
  const tint  = new Float32Array(COUNT*3);
  geo.setAttribute('aOffset', new THREE.InstancedBufferAttribute(off,3));
  geo.setAttribute('aParam',  new THREE.InstancedBufferAttribute(parm,4));
  geo.setAttribute('aTint',   new THREE.InstancedBufferAttribute(tint,3));
  geo.instanceCount = 0;
  geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 1e6);

  const uni = {
    uTime:{value:0}, uWind:{value:new THREE.Vector2(1,0.25)}, uWindStr:{value:0.4},
    uCam:{value:new THREE.Vector3()},
    uFadeIn:{value:fadeIn}, uFadeOut:{value:fadeOut},
    uWidth:{value:width}, uHeight:{value:height},
    uSunDir:{value:new THREE.Vector3(0,1,0)},
    uSunCol:{value:new THREE.Color(1,1,1)},
    uAmb:{value:new THREE.Color(0.30,0.34,0.38)},
  };

  const mat = new THREE.ShaderMaterial({
    uniforms: Object.assign(THREE.UniformsUtils.clone(THREE.UniformsLib.fog), uni),
    fog:true, side:THREE.DoubleSide, transparent:false,
    vertexShader:`
      attribute vec3 aOffset; attribute vec4 aParam; attribute vec3 aTint;
      uniform float uTime,uWindStr,uFadeIn,uFadeOut,uWidth,uHeight;
      uniform vec2 uWind; uniform vec3 uCam;
      varying vec3 vTint; varying vec3 vN; varying float vV;
      #include <common>
      #include <fog_pars_vertex>
      void main(){
        float yaw = aParam.x, sc = aParam.y, phase = aParam.z, lean = aParam.w;
        float v = position.y;          // 0 at the root, 1 at the tip
        float side = position.x;
        vV = v; vTint = aTint;

        float d = length(aOffset.xz - uCam.xz);
        float fIn  = uFadeIn <= 0.01 ? 1.0 : smoothstep(uFadeIn - 9.0, uFadeIn, d);
        float fOut = 1.0 - smoothstep(uFadeOut - 12.0, uFadeOut, d);
        float fade = clamp(fIn*fOut, 0.0, 1.0);

        float h  = uHeight * sc * fade;
        float hw = uWidth  * sc * (1.0 - v*0.86) * mix(0.55, 1.0, fade);

        // Two-frequency wind, plus the blade's own resting lean.
        float g = sin(dot(aOffset.xz, vec2(0.16,0.11)) + uTime*1.25 + phase)
                + sin(dot(aOffset.xz, vec2(0.71,-0.47)) + uTime*3.60 + phase)*0.34;
        float bend = lean + uWindStr*0.95*g;

        // The blade arcs over rather than shearing: quadratic in v, and it
        // loses height as it leans, the way a real stem does.
        float y = v*h - bend*bend*v*v*h*0.22;
        float z = bend*v*v*h*0.55;
        vec3 local = vec3(side*hw, y, z);

        float c = cos(yaw), s = sin(yaw);
        vec3 rot = vec3(local.x*c - local.z*s, local.y, local.x*s + local.z*c);
        vec3 wp = aOffset + rot;

        // Face normal, softened toward straight up so grass shades gently.
        vec3 nl = normalize(vec3(0.0, bend*0.55*v, 1.0));
        vN = normalize(vec3(nl.x*c - nl.z*s, nl.y, nl.x*s + nl.z*c));

        vec4 mvPosition = viewMatrix*vec4(wp,1.0);
        gl_Position = projectionMatrix*mvPosition;
        #include <fog_vertex>
      }`,
    fragmentShader:`
      varying vec3 vTint; varying vec3 vN; varying float vV;
      uniform vec3 uSunDir, uSunCol, uAmb;
      #include <common>
      #include <fog_pars_fragment>
      void main(){
        // Lit for real against the sun rig, so grass changes with the sky
        // instead of sitting there flat and fluorescent.
        vec3 N = normalize(mix(vN, vec3(0.0,1.0,0.0), 0.55));
        if(!gl_FrontFacing) N = -N;
        float ndl  = max(dot(N, uSunDir), 0.0);
        float wrap = max(dot(-N, uSunDir), 0.0)*0.30;   // light through the blade
        float ao   = mix(0.38, 1.0, vV);                // dark down in the sward
        vec3 col = vTint * (uAmb + uSunCol*(ndl*0.95 + wrap)) * ao;
        gl_FragColor = vec4(col, 1.0);
        #include <fog_fragment>
      }`,
  });
  mat.userData.uniforms = uni;

  const mesh = new THREE.Mesh(geo, mat);
  mesh.frustumCulled = false;
  mesh.castShadow = false; mesh.receiveShadow = false;

  /* Each world cell maps to a fixed slot by modulo, so the buffer scrolls like
     a torus: walking forward only recomputes the strip of cells that just came
     into range, never the whole field. Rebuilding all 28,000 cells on every
     step cost 145ms and hitched constantly; this costs well under a
     millisecond. Rejected cells keep a slot with scale 0, which collapses their
     triangles to nothing. */
  const half = cols>>1;
  const wrap = (v)=>{ const m = v % cols; return m < 0 ? m + cols : m; };
  const scat = { y:0, slope:0, grass:0, moist:0 };
  let lastCX = null, lastCZ = null, originX = 0, originZ = 0;

  function writeCell(ix, iz){
    const slot = wrap(iz)*cols + wrap(ix);
    const o = slot*3, q = slot*4;
    const keepR = cellHash(ix,iz,1);
    if(keepR > density){ parm[q+1] = 0; return; }
    const wx = ix*spacing + (cellHash(ix,iz,2)-0.5)*spacing*1.15;
    const wz = iz*spacing + (cellHash(ix,iz,3)-0.5)*spacing*1.15;
    if(inner > 0){
      const dx = wx-originX, dz = wz-originZ;
      if(dx*dx + dz*dz < inner*inner){ parm[q+1] = 0; return; }
    }
    terrain.scatterAt(wx,wz,scat);
    if(scat.y < CFG.SEA + 0.2 || scat.slope > 0.72 ||
       scat.grass < 0.30 + cellHash(ix,iz,4)*0.30){ parm[q+1] = 0; return; }

    off[o]=wx; off[o+1]=scat.y; off[o+2]=wz;
    parm[q]   = cellHash(ix,iz,5)*Math.PI*2;
    parm[q+1] = 0.62 + cellHash(ix,iz,6)*0.72;
    parm[q+2] = cellHash(ix,iz,7)*6.28;
    parm[q+3] = tiltBias + (cellHash(ix,iz,8)-0.5)*0.45;
    const dry = 1-scat.moist;
    const varn = 0.86 + cellHash(ix,iz,9)*0.30;
    tint[o]   = (0.30 + dry*0.30)*varn;
    tint[o+1] = (0.42 - dry*0.08)*varn;
    tint[o+2] = (0.16 - dry*0.05)*varn;
  }

  let density = 1;
  function reposition(px, pz, dens){
    const cx = Math.round(px/spacing), cz = Math.round(pz/spacing);
    const densChanged = Math.abs(dens - density) > 0.001;
    density = dens;
    originX = px; originZ = pz;
    if(!densChanged && cx===lastCX && cz===lastCZ) return;

    const full = densChanged || lastCX === null ||
                 Math.abs(cx-lastCX) >= cols || Math.abs(cz-lastCZ) >= cols;
    if(full){
      for(let iz=cz-half; iz<cz+half; iz++)
        for(let ix=cx-half; ix<cx+half; ix++) writeCell(ix,iz);
    } else {
      const dx = cx-lastCX, dz = cz-lastCZ;
      if(dx !== 0){
        const from = dx>0 ? lastCX+half : cx-half;
        const to   = dx>0 ? cx+half     : lastCX-half;
        for(let ix=from; ix<to; ix++)
          for(let iz=lastCZ-half; iz<lastCZ+half; iz++) writeCell(ix,iz);
      }
      if(dz !== 0){
        const from = dz>0 ? lastCZ+half : cz-half;
        const to   = dz>0 ? cz+half     : lastCZ-half;
        for(let iz=from; iz<to; iz++)
          for(let ix=cx-half; ix<cx+half; ix++) writeCell(ix,iz);
      }
      /* The inner cut of a coarse ring is measured from the player, not the
         grid, so its boundary cells have to be revisited as he moves. */
      if(inner > 0){
        const r = Math.ceil((inner+spacing*2)/spacing);
        for(let iz=cz-r; iz<=cz+r; iz++)
          for(let ix=cx-r; ix<=cx+r; ix++) writeCell(ix,iz);
      }
    }
    lastCX=cx; lastCZ=cz;
    geo.instanceCount = cols*cols;
    geo.attributes.aOffset.needsUpdate = true;
    geo.attributes.aParam.needsUpdate  = true;
    geo.attributes.aTint.needsUpdate   = true;
  }

  return { mesh, uni, reposition, forceRebuild:()=>{ lastCX=null; },
           get count(){ return geo.instanceCount; } };
}

/* Near ring underfoot, coarse ring out to the horizon line. */
function makeGrassField(terrain, quality){
  const q = quality || 1;
  const near = makeGrassLayer(terrain, {
    spacing:0.42, cols:CFG.GRASS_NEAR_COLS, width:0.030, height:0.62,
    fadeIn:0, fadeOut:CFG.GRASS_NEAR_R, tiltBias:0.30 });
  const far = makeGrassLayer(terrain, {
    spacing:1.55, cols:CFG.GRASS_FAR_COLS, width:0.085, height:1.05,
    fadeIn:CFG.GRASS_NEAR_R-10, fadeOut:CFG.GRASS_FAR_R, tiltBias:0.34 });
  return {
    layers:[near, far],
    add(scene){ scene.add(near.mesh); scene.add(far.mesh); },
    reposition(px,pz,d){ near.reposition(px,pz,d); far.reposition(px,pz,d*0.85); },
    forceRebuild(){ near.forceRebuild(); far.forceRebuild(); },
    update(t, wind, windStr, cam, sunDir, sunCol, amb){
      for(const l of [near,far]){
        const u = l.uni;
        u.uTime.value = t;
        u.uWind.value.copy(wind);
        u.uWindStr.value = windStr;
        u.uCam.value.copy(cam);
        u.uSunDir.value.copy(sunDir);
        u.uSunCol.value.copy(sunCol);
        u.uAmb.value.copy(amb);
      }
    },
    get count(){ return near.count + far.count; },
  };
}

/* ---- TREES ---------------------------------------------------------------
   Recursive branching. Species parameters differ enough that a pine, a
   cottonwood, a gum and a cypress are structurally different plants, not
   the same plant recoloured. */
const TREE_SPECIES = {
  pine:      { h:[9,17],  taper:0.70, splits:2, angle:[0.42,0.68], depth:4,
               lenFall:0.70, radBase:0.30, leafSize:[1.5,2.6], leafPer:3,
               canopy:'conic', bark:'bark_pine',   leaf:'leaf_pine'  },
  cottonwood:{ h:[8,14],  taper:0.62, splits:3, angle:[0.52,0.95], depth:3,
               lenFall:0.74, radBase:0.34, leafSize:[2.2,3.6], leafPer:4,
               canopy:'round', bark:'bark_cotton', leaf:'leaf_broad' },
  gum:       { h:[10,19], taper:0.66, splits:2, angle:[0.34,0.86], depth:5,
               lenFall:0.76, radBase:0.28, leafSize:[1.8,3.0], leafPer:3,
               canopy:'open',  bark:'bark_gum',    leaf:'leaf_gum'   },
  cypress:   { h:[11,20], taper:0.72, splits:2, angle:[0.30,0.55], depth:3,
               lenFall:0.72, radBase:0.44, leafSize:[2.0,3.2], leafPer:4,
               canopy:'weep',  bark:'bark_cotton', leaf:'leaf_broad' },
  snag:      { h:[6,11],  taper:0.55, splits:2, angle:[0.60,1.25], depth:3,
               lenFall:0.66, radBase:0.26, leafSize:[0,0],     leafPer:0,
               canopy:'none',  bark:'bark_gum',    leaf:'leaf_dry'   },
};

function growTree(species, seed, lod=0){
  const S = TREE_SPECIES[species];
  const rnd = M.rng(seed);
  const trunkPts = [], trunkIdx = [];
  const leafM = new THREE.Matrix4();
  const leafMats = [];
  const height = M.range(rnd, S.h[0], S.h[1]);
  const radialSegs = lod===0 ? 7 : (lod===1 ? 5 : 3);
  const maxDepth  = lod===0 ? S.depth : (lod===1 ? S.depth-1 : S.depth-2);

  // A branch is a tapered tube swept along a slightly curved axis.
  function branch(origin, dir, len, rad, depth){
    const segs = depth===0 ? (lod===0?5:3) : 2;
    let p = origin.clone(), d = dir.clone().normalize();
    const ringStart = trunkPts.length/3;
    for(let s=0;s<=segs;s++){
      const t = s/segs;
      const r = rad*M.lerp(1, S.taper, t);
      // Build a ring perpendicular to d.
      const up = Math.abs(d.y)>0.95 ? new THREE.Vector3(1,0,0) : new THREE.Vector3(0,1,0);
      const right = new THREE.Vector3().crossVectors(d,up).normalize();
      const fwd = new THREE.Vector3().crossVectors(right,d).normalize();
      for(let k=0;k<radialSegs;k++){
        const a = (k/radialSegs)*Math.PI*2;
        // Nothing is perfectly round.
        const wob = 1 + M.imperfection(seed+depth*13+k, 0.14);
        const px = p.x + (right.x*Math.cos(a)+fwd.x*Math.sin(a))*r*wob;
        const py = p.y + (right.y*Math.cos(a)+fwd.y*Math.sin(a))*r*wob;
        const pz = p.z + (right.z*Math.cos(a)+fwd.z*Math.sin(a))*r*wob;
        trunkPts.push(px,py,pz);
      }
      if(s<segs){
        const step = len/segs;
        p.addScaledVector(d, step);
        // Curve: gravity droop plus a random wander. Cypress weeps hard.
        const droop = S.canopy==='weep' ? 0.16 : 0.045;
        d.y -= droop*(depth+1)*0.22;
        d.x += (rnd()-0.5)*0.13; d.z += (rnd()-0.5)*0.13;
        d.normalize();
      }
    }
    // Stitch the rings.
    for(let s=0;s<segs;s++){
      for(let k=0;k<radialSegs;k++){
        const a = ringStart + s*radialSegs + k;
        const b = ringStart + s*radialSegs + (k+1)%radialSegs;
        const c = a + radialSegs, dd = b + radialSegs;
        trunkIdx.push(a,c,b, b,c,dd);
      }
    }
    if(depth >= maxDepth){
      // Leaf cluster: a few crossed cards oriented outward from the tip.
      if(S.leafPer>0 && lod<2){
        for(let i=0;i<S.leafPer;i++){
          const sz = M.range(rnd, S.leafSize[0], S.leafSize[1]);
          const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(
            rnd()*Math.PI, rnd()*Math.PI*2, rnd()*0.7));
          const pos = p.clone().addScaledVector(d, len*0.3)
            .add(new THREE.Vector3((rnd()-0.5)*sz*0.5,(rnd()-0.5)*sz*0.4,(rnd()-0.5)*sz*0.5));
          leafM.compose(pos, q, new THREE.Vector3(sz,sz,sz));
          leafMats.push(leafM.clone());
        }
      }
      return;
    }
    // Split.
    const n = S.splits + ((rnd()<0.34)?1:0);
    const baseAng = M.range(rnd, S.angle[0], S.angle[1]);
    for(let i=0;i<n;i++){
      const roll = (i/n)*Math.PI*2 + rnd()*0.8;
      const axis = new THREE.Vector3(Math.cos(roll),0,Math.sin(roll));
      const nd = d.clone().applyAxisAngle(axis, baseAng*M.range(rnd,0.7,1.3)).normalize();
      // Conic species keep a dominant leader; round species don't.
      const scale = (S.canopy==='conic' && i===0) ? 0.94 : M.range(rnd,0.62,0.84);
      branch(p.clone(), nd, len*S.lenFall*scale, rad*S.taper*0.86, depth+1);
    }
  }

  branch(new THREE.Vector3(0,0,0), new THREE.Vector3(
    M.imperfection(seed,0.10), 1, M.imperfection(seed+7,0.10)),
    height*0.42, S.radBase*(height/12), 0);

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(trunkPts,3));
  g.setIndex(trunkIdx);
  g.computeVertexNormals();
  // Cheap UVs from world-ish position; bark tiles vertically.
  const pa = g.attributes.position, uvs = new Float32Array(pa.count*2);
  for(let i=0;i<pa.count;i++){
    uvs[i*2]   = (Math.atan2(pa.getZ(i), pa.getX(i))/(Math.PI*2)+0.5)*2.0;
    uvs[i*2+1] = pa.getY(i)*0.22;
  }
  g.setAttribute('uv', new THREE.BufferAttribute(uvs,2));
  // Vertex-colour dirt at the base (§2).
  const cols = new Float32Array(pa.count*3);
  for(let i=0;i<pa.count;i++){
    const y = pa.getY(i);
    const dirt = M.sat(1 - y/2.4);
    cols[i*3]   = M.lerp(1.0, 0.46, dirt);
    cols[i*3+1] = M.lerp(1.0, 0.42, dirt);
    cols[i*3+2] = M.lerp(1.0, 0.36, dirt);
  }
  g.setAttribute('color', new THREE.BufferAttribute(cols,3));
  g.computeBoundingSphere();
  return { trunk:g, leaves:leafMats, height, species };
}

/* Foliage card geometry — one crossed pair, reused by every leaf cluster. */
function leafCardGeometry(){
  const g = new THREE.BufferGeometry();
  const P=[], U=[], I=[], N=[];
  const add=(o,ax,ay,az,bx,by,bz)=>{
    P.push(-ax*0.5,-ay*0.5,-az*0.5,  ax*0.5,-ay*0.5,az*0.5,
            ax*0.5, ay*0.5, az*0.5, -ax*0.5, ay*0.5,-az*0.5);
    U.push(0,0, 1,0, 1,1, 0,1);
    for(let i=0;i<4;i++) N.push(bx,by,bz);
    I.push(o,o+1,o+2, o,o+2,o+3);
  };
  add(0, 1,1,0, 0,0,1);
  add(4, 0,1,1, 1,0,0);
  g.setAttribute('position', new THREE.Float32BufferAttribute(P,3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(U,2));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(N,3));
  g.setIndex(I);
  return g;
}

/* ==========================================================================
   VEGETATION MANAGER
   Per-chunk instanced batches. One InstancedMesh per (species, lod) per
   chunk keeps draw calls low and lets a chunk be dropped in one go.
   ========================================================================== */
class Vegetation {
  constructor(terrain, lib, windUniform){
    this.terrain = terrain;
    this.lib = lib;
    this.leafGeo = leafCardGeometry();
    this.wind = windUniform;
    /* Pre-grow a palette of trees per species. Each chunk picks from the
       palette with a per-instance scale and yaw, so the world reads as
       infinitely varied while the vertex data stays tiny. */
    this.palette = {};
    for(const sp of Object.keys(TREE_SPECIES)){
      this.palette[sp] = [];
      for(let v=0; v<4; v++){
        this.palette[sp].push([
          growTree(sp, 1000+v*77+sp.length*13, 0),
          growTree(sp, 1000+v*77+sp.length*13, 1),
          growTree(sp, 1000+v*77+sp.length*13, 2),
        ]);
      }
    }
    this.barkMats = {};
    this.leafMats = {};
    for(const sp of Object.keys(TREE_SPECIES)){
      const S = TREE_SPECIES[sp];
      this.barkMats[sp] = new THREE.MeshStandardMaterial({
        map:lib[S.bark].map, roughnessMap:lib[S.bark].roughnessMap,
        normalMap:lib[S.bark].normalMap, roughness:1, metalness:0,
        vertexColors:true });
      this.barkMats[sp].map.repeat.set(1,1);
      this.leafMats[sp] = this._leafMaterial(lib[S.leaf]);
    }
  }

  /* Leaves get a wind vertex offset and alpha test. Double-sided with a
     softened normal so cards don't read as flat black from behind. */
  _leafMaterial(texSet){
    const m = new THREE.MeshStandardMaterial({
      map:texSet.map, alphaTest:0.42, transparent:false,
      side:THREE.DoubleSide, roughness:0.86, metalness:0,
      normalMap:texSet.normalMap,
    });
    const uni = { uTime:{value:0}, uWind:{value:new THREE.Vector2(1,0.25)},
                  uWindStr:{value:0.5} };
    m.userData.uniforms = uni;
    m.onBeforeCompile = (sh)=>{
      Object.assign(sh.uniforms, uni);
      sh.vertexShader = sh.vertexShader
        .replace('#include <common>', `#include <common>
          uniform float uTime,uWindStr; uniform vec2 uWind;`)
        .replace('#include <begin_vertex>', `#include <begin_vertex>
          vec3 wp = (modelMatrix*vec4(transformed,1.0)).xyz;
          float g = sin(wp.x*0.21 + wp.z*0.17 + uTime*1.15)
                  + sin(wp.x*0.63 - wp.z*0.48 + uTime*3.4)*0.35;
          float amp = uWindStr*0.30*clamp(wp.y*0.09,0.0,1.6);
          transformed.x += uWind.x*g*amp;
          transformed.z += uWind.y*g*amp;`);
    };
    m.customProgramCacheKey = ()=>'leafwind-v1';
    return m;
  }

  /* Density and species mix per biome. */
  _speciesFor(biome, rnd, moist, h){
    if(biome===BIOME.RIDGE) return h>CFG.SNOWLINE-30 ? 'snag' : 'pine';
    if(biome===BIOME.DELTA) return rnd()<0.72 ? 'cypress' : 'gum';
    if(biome===BIOME.FLATS) return rnd()<0.72 ? 'snag' : 'gum';
    if(biome===BIOME.COPPER) return 'snag';
    return rnd()<0.6 ? 'cottonwood' : 'gum';
  }
  _densityFor(biome, moist, slope, h){
    if(slope > 0.62) return 0;
    if(h < CFG.SEA+0.4) return 0;
    let d;
    switch(biome){
      case BIOME.RIDGE:  d = 0.55*M.sat(1-(h-CFG.SNOWLINE)/40); break;
      case BIOME.DELTA:  d = 0.48; break;
      case BIOME.FLATS:  d = 0.030; break;
      case BIOME.COPPER: d = 0.045; break;
      default:           d = 0.14*M.lerp(0.35,1.4,moist);
    }
    return d;
  }

  /* Build all tree instances for one chunk at one LOD. */
  buildChunk(cx,cz,lod){
    const group = new THREE.Group();
    const size = CFG.CHUNK;
    const ox = cx*size - CFG.HALF, oz = cz*size - CFG.HALF;
    const rnd = M.rng(cx*73856093 ^ cz*19349663);
    const buckets = {};   // species -> [{pos, yaw, scale, variant}]
    const TRIES = 110;
    for(let i=0;i<TRIES;i++){
      const wx = ox + rnd()*size, wz = oz + rnd()*size;
      const h = this.terrain.heightAt(wx,wz);
      const slope = this.terrain.slopeAt(wx,wz);
      const biome = this.terrain.biomeAt(wx,wz);
      const moist = this.terrain.sample(this.terrain.moist,wx,wz);
      // No timber in the middle of a road or a town.
      if(this.terrain.roadAt && this.terrain.roadAt(wx,wz) > 0.14) continue;
      if(this.terrain.flatZones){
        let inTown = false;
        for(const z of this.terrain.flatZones)
          if(Math.hypot(wx-z.x, wz-z.z) < z.r*0.94){ inTown = true; break; }
        if(inTown) continue;
      }
      const dens = this._densityFor(biome, moist, slope, h);
      if(rnd() > dens) continue;
      // Clumping: trees like company.
      const clump = NZ.fbm(wx*0.011, wz*0.011, 3)*0.5+0.5;
      if(rnd() > 0.22 + clump*1.05) continue;
      const sp = this._speciesFor(biome, rnd, moist, h);
      (buckets[sp] = buckets[sp] || []).push({
        x:wx, y:h, z:wz,
        yaw: rnd()*Math.PI*2,
        scale: M.range(rnd, 0.72, 1.32),
        variant: (rnd()*4)|0,
        lean: M.imperfection(((wx*13+wz*7)|0), 0.055),
      });
    }
    const mtx = new THREE.Matrix4(), q = new THREE.Quaternion(),
          e = new THREE.Euler(), v = new THREE.Vector3(), sV = new THREE.Vector3();
    for(const sp of Object.keys(buckets)){
      const list = buckets[sp];
      // Group by palette variant so each variant gets one InstancedMesh.
      for(let vi=0; vi<4; vi++){
        const sub = list.filter(t=>t.variant===vi);
        if(!sub.length) continue;
        const tree = this.palette[sp][vi][Math.min(lod,2)];
        const trunkMesh = new THREE.InstancedMesh(tree.trunk, this.barkMats[sp], sub.length);
        trunkMesh.castShadow = lod===0;
        trunkMesh.receiveShadow = true;
        // Leaves: every leaf card of every instance in one batch.
        const leafCount = tree.leaves.length * sub.length;
        let leafMesh = null;
        if(leafCount>0){
          leafMesh = new THREE.InstancedMesh(this.leafGeo, this.leafMats[sp], leafCount);
          leafMesh.castShadow = false;
          leafMesh.receiveShadow = false;
        }
        let li=0;
        for(let k=0;k<sub.length;k++){
          const t = sub[k];
          e.set(t.lean, t.yaw, t.lean*0.7);
          q.setFromEuler(e);
          v.set(t.x, t.y-0.25, t.z);
          sV.set(t.scale,t.scale,t.scale);
          mtx.compose(v,q,sV);
          trunkMesh.setMatrixAt(k, mtx);
          if(leafMesh){
            for(let m=0;m<tree.leaves.length;m++){
              const lm = tree.leaves[m].clone().premultiply(mtx);
              leafMesh.setMatrixAt(li++, lm);
            }
          }
        }
        trunkMesh.instanceMatrix.needsUpdate = true;
        group.add(trunkMesh);
        if(leafMesh){ leafMesh.instanceMatrix.needsUpdate = true; group.add(leafMesh); }
      }
    }
    group.userData.treeCount = Object.values(buckets).reduce((a,b)=>a+b.length,0);
    return group;
  }

  update(t, windDir, windStr){
    for(const sp of Object.keys(this.leafMats)){
      const u = this.leafMats[sp].userData.uniforms;
      u.uTime.value = t;
      u.uWind.value.copy(windDir);
      u.uWindStr.value = windStr;
    }
  }
}
/* ==========================================================================
   RIG_SYSTEM
   Skeletons are authored as flat bone lists in parent-local space. Geometry
   is built from parametric limb solids in bind-pose world space and then
   auto-skinned by distance to the bone segments — a real skinning solve, not
   rigid parts parented to bones. That is the difference between a character
   that bends and a marionette.
   ========================================================================== */

function makeSkeleton(def){
  const bones = [], byName = {};
  for(const d of def){
    const b = new THREE.Bone();
    b.name = d.name;
    b.position.set(d.pos[0], d.pos[1], d.pos[2]);
    if(d.rot) b.rotation.set(d.rot[0], d.rot[1], d.rot[2]);
    byName[d.name] = b;
    if(d.parent){ byName[d.parent].add(b); } 
    bones.push(b);
  }
  const root = byName[def[0].name];
  root.updateMatrixWorld(true);
  // Cache the bind-pose world position of every bone for skinning + IK.
  const bindPos = {};
  for(const b of bones){
    bindPos[b.name] = new THREE.Vector3().setFromMatrixPosition(b.matrixWorld);
  }
  return { bones, byName, root, bindPos,
           skeleton: new THREE.Skeleton(bones) };
}

/* ---- Limb solids ---------------------------------------------------------
   A tapered, slightly bent tube between two points with an optional
   cross-section squash. Everything on every character is built from this
   plus spheres, so silhouettes stay coherent. */
function limbGeometry(a, b, r0, r1, opts={}){
  const { radial=8, rings=5, squashX=1, squashZ=1, bulge=0, tipRound=true } = opts;
  const dir = new THREE.Vector3().subVectors(b,a);
  const len = dir.length();
  dir.normalize();
  /* Pick the reference axis so that squashX always means world X for an
     upright limb. With (1,0,0) here the cross product handed back +Z as the
     "right" axis, which silently swapped squashX and squashZ on every vertical
     limb in the game — Jarrad's chest was being built 0.46 deep and 0.27 wide
     instead of the other way round. */
  const up = Math.abs(dir.y)>0.96 ? new THREE.Vector3(0,0,-1) : new THREE.Vector3(0,1,0);
  const right = new THREE.Vector3().crossVectors(dir,up).normalize();
  const fwd = new THREE.Vector3().crossVectors(right,dir).normalize();
  const P=[], N=[], U=[], I=[];
  for(let s=0;s<=rings;s++){
    const t = s/rings;
    let r = M.lerp(r0,r1,t);
    r *= 1 + Math.sin(t*Math.PI)*bulge;               // muscle belly
    const cy = len*t;
    for(let k=0;k<=radial;k++){
      const ang = (k/radial)*Math.PI*2;
      const cx = Math.cos(ang)*r*squashX, cz = Math.sin(ang)*r*squashZ;
      const p = a.clone().addScaledVector(dir,cy)
                 .addScaledVector(right,cx).addScaledVector(fwd,cz);
      P.push(p.x,p.y,p.z);
      const n = right.clone().multiplyScalar(Math.cos(ang))
                .addScaledVector(fwd, Math.sin(ang)).normalize();
      N.push(n.x,n.y,n.z);
      U.push(k/radial, t);
    }
  }
  for(let s=0;s<rings;s++) for(let k=0;k<radial;k++){
    const i0 = s*(radial+1)+k, i1=i0+1, i2=i0+radial+1, i3=i2+1;
    I.push(i0,i2,i1, i1,i2,i3);
  }
  // Caps
  if(tipRound){
    const capA = P.length/3;
    P.push(a.x,a.y,a.z); N.push(-dir.x,-dir.y,-dir.z); U.push(0.5,0);
    for(let k=0;k<radial;k++) I.push(capA, k, (k+1)%radial);
    const capB = P.length/3;
    const bp = a.clone().addScaledVector(dir,len);
    P.push(bp.x,bp.y,bp.z); N.push(dir.x,dir.y,dir.z); U.push(0.5,1);
    const base = rings*(radial+1);
    for(let k=0;k<radial;k++) I.push(capB, base+(k+1)%radial, base+k);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(P,3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(N,3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(U,2));
  g.setIndex(I);
  return g;
}

function blobGeometry(center, rx, ry, rz, seg=12, squish=null){
  const g = new THREE.SphereGeometry(1, seg, Math.max(6,seg>>1));
  g.scale(rx,ry,rz);
  if(squish) g.applyMatrix4(squish);
  g.translate(center.x, center.y, center.z);
  return g;
}

function boxGeometry(center, sx, sy, sz, bevel=0){
  const g = new THREE.BoxGeometry(sx,sy,sz, 2,2,2);
  if(bevel>0){
    // Pull the corners in slightly — a hard bevel reads as manufactured.
    const p = g.attributes.position;
    for(let i=0;i<p.count;i++){
      const x=p.getX(i),y=p.getY(i),z=p.getZ(i);
      const k = 1-bevel*(Math.abs(x)/(sx/2))*(Math.abs(y)/(sy/2));
      p.setXYZ(i, x, y*k, z*k);
    }
    g.computeVertexNormals();
  }
  g.translate(center.x,center.y,center.z);
  return g;
}

/* ---- Merge + auto-skin ---------------------------------------------------
   parts: [{ geo, group }] where group is a material slot index.
   The weight solve finds the closest point on each bone's segment (bone →
   parent) and weights by an inverse-power falloff, keeping the best 4. */
function skinParts(parts, rig, opts={}){
  const { power=3.2, maxDist=0.62 } = opts;
  // Merge with groups so one SkinnedMesh can carry several materials.
  const posArr=[], nrmArr=[], uvArr=[], idxArr=[], groups=[];
  let vOff=0, iOff=0;
  for(const part of parts){
    const g = part.geo;
    const p=g.attributes.position, n=g.attributes.normal, u=g.attributes.uv;
    const idx = g.index;
    for(let i=0;i<p.count;i++){
      posArr.push(p.getX(i),p.getY(i),p.getZ(i));
      nrmArr.push(n.getX(i),n.getY(i),n.getZ(i));
      uvArr.push(u?u.getX(i):0, u?u.getY(i):0);
    }
    const cnt = idx ? idx.count : p.count;
    for(let i=0;i<cnt;i++) idxArr.push((idx?idx.getX(i):i)+vOff);
    groups.push({start:iOff, count:cnt, material:part.group|0});
    vOff += p.count; iOff += cnt;
  }

  // Bone segments in bind-pose world space.
  const segs = [];
  for(const b of rig.bones){
    const bp = rig.bindPos[b.name];
    const par = b.parent && b.parent.isBone ? rig.bindPos[b.parent.name] : bp;
    segs.push({ name:b.name, a:par, b:bp,
                idx: rig.bones.indexOf(b),
                weightScale: (rig.weightScale && rig.weightScale[b.name]) || 1 });
  }

  const vCount = posArr.length/3;
  const skinIdx = new Uint16Array(vCount*4);
  const skinWgt = new Float32Array(vCount*4);
  const v = new THREE.Vector3(), ab = new THREE.Vector3(), av = new THREE.Vector3();
  const scratch = [];
  for(let i=0;i<vCount;i++){
    v.set(posArr[i*3], posArr[i*3+1], posArr[i*3+2]);
    scratch.length = 0;
    for(const s of segs){
      ab.subVectors(s.b, s.a);
      const l2 = ab.lengthSq();
      let t = 0;
      if(l2 > 1e-8){
        av.subVectors(v, s.a);
        t = M.sat(av.dot(ab)/l2);
      }
      const cx = s.a.x + ab.x*t, cy = s.a.y + ab.y*t, cz = s.a.z + ab.z*t;
      const d = Math.hypot(v.x-cx, v.y-cy, v.z-cz);
      const w = s.weightScale / Math.pow(Math.max(d, 0.012), power);
      scratch.push([s.idx, w, d]);
    }
    scratch.sort((a,b)=> b[1]-a[1]);
    let sum=0;
    for(let k=0;k<4;k++){
      const e = scratch[k];
      // Ignore bones that are absurdly far — stops a hand pulling on a boot.
      const w = (e && e[2] < maxDist*6) ? e[1] : 0;
      skinIdx[i*4+k] = e ? e[0] : 0;
      skinWgt[i*4+k] = w; sum += w;
    }
    if(sum<=0){ skinWgt[i*4]=1; sum=1; }
    for(let k=0;k<4;k++) skinWgt[i*4+k] /= sum;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(posArr,3));
  geo.setAttribute('normal',   new THREE.Float32BufferAttribute(nrmArr,3));
  geo.setAttribute('uv',       new THREE.Float32BufferAttribute(uvArr,2));
  geo.setAttribute('skinIndex',  new THREE.Uint16BufferAttribute(skinIdx,4));
  geo.setAttribute('skinWeight', new THREE.Float32BufferAttribute(skinWgt,4));
  geo.setIndex(idxArr.length>65535 ? new THREE.Uint32BufferAttribute(idxArr,1)
                                   : new THREE.Uint16BufferAttribute(idxArr,1));
  for(const g of groups) geo.addGroup(g.start, g.count, g.material);
  geo.computeBoundingSphere();
  return geo;
}

/* ==========================================================================
   ANIM_LIBRARY / ANIM_STATE_MACHINE
   Clips are plain data: per-bone euler keyframes plus optional root motion.
   Poses are blended as quaternions with weights, in layers, with a bone mask
   for the upper-body override. Every transition has an authored blend time.
   ========================================================================== */

class Clip {
  /* tracks: { boneName: [[t, rx,ry,rz], ...] }
     root:   [[t, x,y,z], ...]  (optional, in metres, additive to the pelvis) */
  constructor(name, duration, tracks, opts={}){
    this.name = name; this.duration = duration; this.tracks = tracks;
    this.loop = opts.loop !== false;
    this.root = opts.root || null;
    this.events = opts.events || [];       // [{t, tag}]
  }
  _sampleTrack(keys, t){
    const n = keys.length;
    if(n===1) return keys[0];
    let i=0;
    while(i<n-1 && keys[i+1][0] <= t) i++;
    const k0 = keys[i], k1 = keys[Math.min(i+1,n-1)];
    const span = (k1[0]-k0[0]) || 1;
    const f = M.smooth(M.sat((t-k0[0])/span));   // smoothstep = ease in/out
    return [t,
      M.lerp(k0[1],k1[1],f), M.lerp(k0[2],k1[2],f), M.lerp(k0[3],k1[3],f)];
  }
  /* Write euler samples into a target pose map. */
  sample(t, out){
    const time = this.loop ? ((t % this.duration)+this.duration)%this.duration
                           : M.clamp(t,0,this.duration);
    for(const name in this.tracks){
      const s = this._sampleTrack(this.tracks[name], time);
      let e = out[name];
      if(!e) e = out[name] = {x:0,y:0,z:0};
      e.x = s[1]; e.y = s[2]; e.z = s[3];
    }
    if(this.root){
      const s = this._sampleTrack(this.root, time);
      out.__root = {x:s[1], y:s[2], z:s[3]};
    }
    return out;
  }
}

/* A pose is { boneName: {x,y,z} } in euler radians, relative to bind. */
function blendPose(a, b, w, out){
  for(const k in a){
    if(k==='__root') continue;
    const A=a[k], B=b[k];
    let o = out[k] || (out[k]={x:0,y:0,z:0});
    if(B){ o.x=M.lerp(A.x,B.x,w); o.y=M.lerp(A.y,B.y,w); o.z=M.lerp(A.z,B.z,w); }
    else { o.x=A.x*(1-w); o.y=A.y*(1-w); o.z=A.z*(1-w); }
  }
  for(const k in b){
    if(k==='__root' || out[k]!==undefined && a[k]) continue;
    if(a[k]) continue;
    const B=b[k];
    let o = out[k] || (out[k]={x:0,y:0,z:0});
    o.x=B.x*w; o.y=B.y*w; o.z=B.z*w;
  }
  const ra = a.__root, rb = b.__root;
  if(ra || rb){
    const A = ra||{x:0,y:0,z:0}, B = rb||{x:0,y:0,z:0};
    out.__root = { x:M.lerp(A.x,B.x,w), y:M.lerp(A.y,B.y,w), z:M.lerp(A.z,B.z,w) };
  }
  return out;
}
function addPose(base, add, w){
  for(const k in add){
    if(k==='__root') continue;
    let o = base[k] || (base[k]={x:0,y:0,z:0});
    o.x += add[k].x*w; o.y += add[k].y*w; o.z += add[k].z*w;
  }
  return base;
}
function copyPose(src, out){
  for(const k in src){
    if(k==='__root'){ out.__root = {...src.__root}; continue; }
    let o = out[k] || (out[k]={x:0,y:0,z:0});
    o.x=src[k].x; o.y=src[k].y; o.z=src[k].z;
  }
  return out;
}
function zeroPose(out){
  for(const k in out){ if(k==='__root') continue;
    out[k].x=out[k].y=out[k].z=0; }
  if(out.__root){ out.__root.x=out.__root.y=out.__root.z=0; }
  return out;
}

class Animator {
  constructor(rig){
    this.rig = rig;
    this.clips = {};
    this.state = null;
    this.prev = null;
    this.blend = 1;
    this.blendTime = 0.2;
    this.time = 0;
    this.prevTime = 0;
    this.speed = 1;
    /* Scratch poses — allocated once, reused every frame. */
    this.pA = {}; this.pB = {}; this.pOut = {}; this.pLayer = {};
    this.overrides = [];    // [{clip, time, weight, mask, speed, loop}]
    this.additives = [];    // [{clip, time, weight, speed}]
    this.bind = {};
    for(const b of rig.bones) this.bind[b.name] = b.rotation.clone();
    this._e = new THREE.Euler();
    this._q = new THREE.Quaternion();
  }
  add(clip){ this.clips[clip.name] = clip; return clip; }
  /* Cross-fade to a new state. Re-requesting the current state is a no-op,
     so callers can spam play() from the controller. */
  play(name, blendTime=0.2, restart=false){
    if(this.state===name && !restart) return;
    if(!this.clips[name]) return;
    this.prev = this.state; this.prevTime = this.time;
    this.state = name; this.time = 0;
    this.blendTime = Math.max(0.001, blendTime);
    this.blend = this.prev ? 0 : 1;
  }
  playOverride(name, mask, weight=1, fade=0.18, loop=true, speed=1){
    const existing = this.overrides.find(o=>o.name===name);
    if(existing){ existing.target = weight; return existing; }
    const o = { name, clip:this.clips[name], time:0, weight:0, target:weight,
                mask, fade, loop, speed };
    if(o.clip) this.overrides.push(o);
    return o;
  }
  stopOverride(name){ const o=this.overrides.find(o=>o.name===name); if(o) o.target=0; }
  setAdditive(name, weight, speed=1){
    let a = this.additives.find(x=>x.name===name);
    if(!a){ a = {name, clip:this.clips[name], time:0, weight:0, target:weight, speed};
            if(a.clip) this.additives.push(a); }
    else a.target = weight;
    return a;
  }

  /* Hold a single pose and stop evaluating anything else. Used for cutscenes:
     a character breathing and shifting weight a metre from the lens reads as
     twitching, not as life. */
  freeze(name, t=0){ this.frozen = name; this.frozenT = t; }
  unfreeze(){ this.frozen = null; }

  update(dt){
    if(this.frozen && this.clips[this.frozen]){
      zeroPose(this.pA);
      this.clips[this.frozen].sample(this.frozenT, this.pA);
      for(const b of this.rig.bones){
        const p = this.pA[b.name], bd = this.bind[b.name];
        if(p) b.rotation.set(bd.x+p.x, bd.y+p.y, bd.z+p.z);
        else  b.rotation.copy(bd);
      }
      this.rootMotion = null;
      return;
    }
    this.time += dt*this.speed;
    this.prevTime += dt*this.speed;
    if(this.blend < 1) this.blend = M.sat(this.blend + dt/this.blendTime);

    /* Base layer: current state cross-faded from the previous one. */
    const cur = this.clips[this.state];
    if(!cur) return;
    zeroPose(this.pA); cur.sample(this.time, this.pA);
    let base = this.pA;
    if(this.blend < 1 && this.clips[this.prev]){
      zeroPose(this.pB); this.clips[this.prev].sample(this.prevTime, this.pB);
      base = blendPose(this.pB, this.pA, this.blend, this.pOut);
    }
    copyPose(base, this.pLayer);

    /* Additive layers: breathing, idle noise, injury. */
    for(let i=this.additives.length-1;i>=0;i--){
      const a = this.additives[i];
      a.time += dt*a.speed;
      a.weight = M.damp(a.weight, a.target, 6, dt);
      if(a.weight < 0.002 && a.target===0){ this.additives.splice(i,1); continue; }
      const p = {}; a.clip.sample(a.time, p);
      addPose(this.pLayer, p, a.weight);
    }

    /* Override layer: masked upper-body clips (aiming, tipping the hat,
       carrying, lasso twirl). Replaces rather than adds. */
    for(let i=this.overrides.length-1;i>=0;i--){
      const o = this.overrides[i];
      o.time += dt*o.speed;
      o.weight = M.damp(o.weight, o.target, 1/Math.max(o.fade,0.01), dt);
      if(o.weight < 0.002 && o.target===0){ this.overrides.splice(i,1); continue; }
      const p = {}; o.clip.sample(o.time, p);
      for(const k in p){
        if(k==='__root') continue;
        if(o.mask && !o.mask[k]) continue;
        const t = this.pLayer[k] || (this.pLayer[k]={x:0,y:0,z:0});
        t.x = M.lerp(t.x, p[k].x, o.weight);
        t.y = M.lerp(t.y, p[k].y, o.weight);
        t.z = M.lerp(t.z, p[k].z, o.weight);
      }
    }

    /* Write to the skeleton, relative to bind. */
    for(const b of this.rig.bones){
      const p = this.pLayer[b.name];
      const bd = this.bind[b.name];
      if(p) b.rotation.set(bd.x+p.x, bd.y+p.y, bd.z+p.z);
      else   b.rotation.copy(bd);
    }
    this.rootMotion = this.pLayer.__root || null;
  }
}

/* ---- Two-bone IK ---------------------------------------------------------
   Used for foot planting on slopes and stairs, and for putting hands on the
   saddle horn. Solves in world space, writes local rotations. */
