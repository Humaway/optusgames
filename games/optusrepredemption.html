    }
    this.page.innerHTML = html;
    if(this.current==='Settings') this._wireSettings();
    if(this.current==='Map') this._wireMap();
  }

  _wireMap(){
    const g = this.game;
    const cv = document.getElementById('mapCanvas');
    if(!cv) return;
    const ctx = cv.getContext('2d');
    let box = g.map.draw(ctx, cv.width, cv.height, g);
    const redraw = ()=>{ box = g.map.draw(ctx, cv.width, cv.height, g); };
    const toCanvas = (e)=>{
      const r = cv.getBoundingClientRect();
      return [ (e.clientX-r.left)/r.width*cv.width,
               (e.clientY-r.top)/r.height*cv.height ];
    };

    /* Wheel zooms about the cursor, so you can push into a town rather than
       zooming to the middle and hunting for it. */
    cv.onwheel = (e)=>{
      e.preventDefault();
      const [cx,cy] = toCanvas(e);
      const at = g.map.fromPx(cx, cy, box);
      g.map.zoomAt(e.deltaY < 0 ? 1.22 : 1/1.22, at);
      redraw();
    };

    /* Drag pans. A drag is not a click, so a waypoint is only set if the
       pointer barely moved. */
    let dragging = false, moved = 0, lastX = 0, lastY = 0;
    cv.onpointerdown = (e)=>{
      dragging = true; moved = 0;
      [lastX,lastY] = toCanvas(e);
      cv.setPointerCapture(e.pointerId);
    };
    cv.onpointermove = (e)=>{
      if(!dragging) return;
      const [cx,cy] = toCanvas(e);
      const k = g.map.worldPerPx(box);
      g.map.panBy((cx-lastX)*k, (cy-lastY)*k);
      moved += Math.abs(cx-lastX) + Math.abs(cy-lastY);
      lastX = cx; lastY = cy;
      redraw();
    };
    cv.onpointerup = (e)=>{
      dragging = false;
      if(moved > 5) return;                  // that was a pan, not a pick
      const [cx,cy] = toCanvas(e);
      const p = g.map.fromPx(cx, cy, box);
      if(!p) return;
      const near = 120/g.map.view.zoom;
      if(g.map.waypoint && g.map.waypoint.distanceTo(p) < near) g.map.waypoint = null;
      else g.map.waypoint = p;
      this.render();
    };
    cv.ondblclick = ()=>{ g.map.view.zoom = 1; g.map.view.cx = g.map.view.cz = 0;
                          redraw(); };

    // Keep it live while it is open: the arrow should move as the world does.
    clearInterval(this._mapTimer);
    this._mapTimer = setInterval(()=>{
      if(!this.open || this.current!=='Map'){ clearInterval(this._mapTimer); return; }
      if(!dragging) redraw();
    }, 250);
  }

  _wireSettings(){
    const g = this.game, $=(id)=>document.getElementById(id);
    $('setQ').onchange = e=>{ g.adaptive=false; $('setAdaptive').value='0';
                              g.setQuality(+e.target.value); };
    $('setAdaptive').onchange = e=>{ g.adaptive = e.target.value==='1'; };
    $('setSens').oninput = e=>{ g.sensitivity = +e.target.value; };
    $('setShake').oninput = e=>{ g.cam.shakeScale = +e.target.value; };
    $('setSub').oninput = e=>{ g.ui.subScale = +e.target.value; };
    $('setComp').onchange = e=>{ g.ui.showCompass = e.target.value==='1'; };
    $('setPost').onchange = e=>{ g.composer.enabled = e.target.value==='1';
                                 g.composer.failed = false; };
    $('setGrain').oninput = e=>{ g.composer.opts.grain = +e.target.value; };
    $('setHour').oninput = e=>{ g.tod.setHour(+e.target.value); };
    $('setVol').oninput = e=>{ if(g.audio.ready) g.audio.master.gain.value = +e.target.value; };
  }
}

/* ==========================================================================
   WEATHER
   A state machine with real transitions, not instant swaps (§15).
   ========================================================================== */
const WEATHER_STATES = {
  clear:        { cloud:0.16, wind:0.30, rain:0,    fog:0.0009, next:['clear','overcast'] },
  overcast:     { cloud:0.72, wind:0.44, rain:0,    fog:0.0016, next:['clear','drizzle','overcast'] },
  drizzle:      { cloud:0.82, wind:0.50, rain:0.30, fog:0.0024, next:['overcast','downpour'] },
  downpour:     { cloud:0.95, wind:0.72, rain:0.85, fog:0.0034, next:['drizzle','thunderstorm'] },
  thunderstorm: { cloud:1.00, wind:0.92, rain:1.00, fog:0.0040, next:['downpour'] },
  fog:          { cloud:0.55, wind:0.10, rain:0,    fog:0.0110, next:['overcast','clear'] },
  duststorm:    { cloud:0.60, wind:1.00, rain:0,    fog:0.0090, next:['clear'] },
  snow:         { cloud:0.86, wind:0.46, rain:0.55, fog:0.0038, next:['overcast','blizzard'] },
  blizzard:     { cloud:1.00, wind:1.00, rain:0.95, fog:0.0120, next:['snow'] },
};

class Weather {
  constructor(scene, sky, tod, audio){
    this.scene=scene; this.sky=sky; this.tod=tod; this.audio=audio;
    this.state='clear'; this.target='clear'; this.blend=1;
    this.timer=90; this.wetness=0; this.snowDepth=0;
    this.windDir = new THREE.Vector2(0.82,0.57).normalize();
    this.windStr = 0.30; this.gust = 0;
    this.cur = {...WEATHER_STATES.clear};
    this.thunderTimer = 0;
    this.flash = 0;
    this.flashLight = new THREE.DirectionalLight(0xdfe8ff, 0);
    this.flashLight.position.set(60,180,40);
    scene.add(this.flashLight);
    this._t = 0;
  }
  force(state){ this.target=state; this.blend=0; this.timer=140; }

  update(dt, playerPos, biome){
    this._t += dt;
    this.timer -= dt;
    if(this.timer <= 0){
      const opts = WEATHER_STATES[this.target].next.slice();
      // Biome bias: snow on the Ridge, dust on the Flats, fog in the Delta.
      if(biome===BIOME.RIDGE && Math.random()<0.55) opts.push('snow');
      if(biome===BIOME.FLATS && Math.random()<0.35) opts.push('duststorm');
      if(biome===BIOME.DELTA && Math.random()<0.45) opts.push('fog');
      this.target = opts[(Math.random()*opts.length)|0];
      this.blend = 0;
      this.timer = 110 + Math.random()*220;
    }
    if(this.blend < 1){
      this.blend = M.sat(this.blend + dt/24);       // 24s transitions
      if(this.blend >= 1) this.state = this.target;
    }
    const from = WEATHER_STATES[this.state], to = WEATHER_STATES[this.target];
    for(const k of ['cloud','wind','rain','fog'])
      this.cur[k] = M.lerp(from[k], to[k], this.blend);

    /* Wind: a slowly rotating direction plus gusts. */
    const drift = NZ.n2(this._t*0.017, 4.2)*0.6;
    const ang = Math.atan2(this.windDir.y, this.windDir.x) + drift*dt;
    this.windDir.set(Math.cos(ang), Math.sin(ang));
    this.gust = M.sat(NZ.n2(this._t*0.35, 11.1)*0.5+0.5);
    this.windStr = this.cur.wind*(0.72 + this.gust*0.5);

    /* Accumulation. */
    if(this.cur.rain > 0.05 && this.state!=='snow' && this.state!=='blizzard')
      this.wetness = Math.min(1, this.wetness + dt*this.cur.rain*0.10);
    else this.wetness = Math.max(0, this.wetness - dt*0.030);
    if((this.state==='snow'||this.state==='blizzard') && this.cur.rain>0.1)
      this.snowDepth = Math.min(1, this.snowDepth + dt*0.020);
    else this.snowDepth = Math.max(0, this.snowDepth - dt*0.004);

    /* Lightning: a real flash light plus thunder delayed by distance (§15). */
    this.flash = Math.max(0, this.flash - dt*7);
    if(this.state==='thunderstorm'){
      this.thunderTimer -= dt;
      if(this.thunderTimer <= 0){
        this.thunderTimer = 5 + Math.random()*16;
        this.flash = 1;
        const dist = 300 + Math.random()*2400;
        this.audio && this.audio.thunder(dist);
      }
    }
    this.flashLight.intensity = this.flash*this.flash*7.5;

    /* Push into the sky and fog. */
    this.sky.uniforms.uCloud.value = this.cur.cloud;
    this.sky.uniforms.uWind.value.copy(this.windDir);
    this.tod.fog.density = this.cur.fog;
    if(this.audio) this.audio.setWind(this.windStr, this.gust*this.cur.wind);
  }
}

/* ==========================================================================
   PARTICLES
   One pooled, GPU-instanced points system covering dust, rain, snow, ash,
   embers, pollen and fireflies (§15). Pooled so nothing allocates per frame.
   ========================================================================== */
class Particles {
  constructor(scene, count=6000){
    this.count = count;
    const geo = new THREE.BufferGeometry();
    this.pos = new Float32Array(count*3);
    this.vel = new Float32Array(count*3);
    this.life = new Float32Array(count);
    this.maxLife = new Float32Array(count);
    this.size = new Float32Array(count);
    this.col = new Float32Array(count*3);
    geo.setAttribute('position', new THREE.BufferAttribute(this.pos,3));
    geo.setAttribute('aSize', new THREE.BufferAttribute(this.size,1));
    geo.setAttribute('color', new THREE.BufferAttribute(this.col,3));
    geo.setDrawRange(0,0);
    this.free = []; for(let i=count-1;i>=0;i--) this.free.push(i);
    this.active = 0;

    const mat = new THREE.ShaderMaterial({
      uniforms:{ uScale:{value: 340} },
      transparent:true, depthWrite:false, blending:THREE.NormalBlending,
      vertexShader:`
        attribute float aSize;
        // 'color' is declared for us by vertexColors:true — declaring it again
        // is a redefinition error, not a safety net.
        varying vec3 vCol; varying float vFade;
        uniform float uScale;
        void main(){
          vCol = color;
          vec4 mv = modelViewMatrix*vec4(position,1.0);
          gl_PointSize = max(1.0, aSize*uScale/max(-mv.z,1.0));
          vFade = clamp(1.0 - (-mv.z)/220.0, 0.0, 1.0);
          gl_Position = projectionMatrix*mv;
        }`,
      fragmentShader:`
        varying vec3 vCol; varying float vFade;
        void main(){
          vec2 d = gl_PointCoord-0.5;
          float a = smoothstep(0.5,0.06,length(d));
          if(a<0.02) discard;
          gl_FragColor = vec4(vCol, a*vFade);
        }`,
      vertexColors:true,
    });
    this.points = new THREE.Points(geo, mat);
    this.points.frustumCulled = false;
    this.geo = geo;
    scene.add(this.points);
    this.density = 1;
  }
  spawn(x,y,z, vx,vy,vz, life, size, r,g,b){
    if(!this.free.length) return -1;
    const i = this.free.pop();
    this.pos[i*3]=x; this.pos[i*3+1]=y; this.pos[i*3+2]=z;
    this.vel[i*3]=vx; this.vel[i*3+1]=vy; this.vel[i*3+2]=vz;
    this.life[i]=life; this.maxLife[i]=life; this.size[i]=size;
    this.col[i*3]=r; this.col[i*3+1]=g; this.col[i*3+2]=b;
    return i;
  }
  update(dt, wind, windStr){
    let maxUsed = 0, live = 0;
    for(let i=0;i<this.count;i++){
      if(this.life[i] <= 0){ this.size[i]=0; continue; }
      this.life[i] -= dt;
      if(this.life[i] <= 0){ this.size[i]=0; this.free.push(i); continue; }
      this.vel[i*3]   += wind.x*windStr*dt*1.2;
      this.vel[i*3+2] += wind.y*windStr*dt*1.2;
      this.pos[i*3]   += this.vel[i*3]*dt;
      this.pos[i*3+1] += this.vel[i*3+1]*dt;
      this.pos[i*3+2] += this.vel[i*3+2]*dt;
      // Fade out by shrinking; alpha comes from the shader radial falloff.
      const t = this.life[i]/this.maxLife[i];
      this.size[i] = this.size[i] * (t>0.2 ? 1 : 0.94);
      maxUsed = i; live++;
    }
    this.active = live;
    this.geo.setDrawRange(0, this.count);
    this.geo.attributes.position.needsUpdate = true;
    this.geo.attributes.aSize.needsUpdate = true;
    this.geo.attributes.color.needsUpdate = true;
  }
  /* --- Emitters ---------------------------------------------------------- */
  hoofDust(pos, speed, surface){
    const n = Math.round(M.lerp(1,5,M.sat(speed/14))*this.density);
    const c = surface==='sand' ? [0.86,0.78,0.60]
            : surface==='snow' ? [0.95,0.96,1.00]
            : surface==='ash'  ? [0.30,0.28,0.26] : [0.62,0.56,0.44];
    for(let i=0;i<n;i++)
      this.spawn(pos.x+(Math.random()-0.5)*0.7, pos.y+0.06, pos.z+(Math.random()-0.5)*0.7,
        (Math.random()-0.5)*1.1, 0.5+Math.random()*0.9, (Math.random()-0.5)*1.1,
        0.9+Math.random()*0.9, 0.22+Math.random()*0.32, c[0],c[1],c[2]);
  }
  rain(camPos, amount, wind, windStr){
    const n = Math.round(amount*38*this.density);
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2, r=Math.random()*26;
      this.spawn(camPos.x+Math.cos(a)*r, camPos.y+14+Math.random()*8, camPos.z+Math.sin(a)*r,
        wind.x*windStr*5, -17-Math.random()*7, wind.y*windStr*5,
        1.3, 0.055, 0.62,0.70,0.80);
    }
  }
  snow(camPos, amount, wind, windStr){
    const n = Math.round(amount*22*this.density);
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2, r=Math.random()*24;
      this.spawn(camPos.x+Math.cos(a)*r, camPos.y+12+Math.random()*8, camPos.z+Math.sin(a)*r,
        wind.x*windStr*2.4+(Math.random()-0.5), -1.1-Math.random()*0.9,
        wind.y*windStr*2.4+(Math.random()-0.5),
        7, 0.10, 1,1,1);
    }
  }
  dustMotes(camPos, sunAmt){
    if(Math.random() > 0.5*this.density) return;
    const a=Math.random()*Math.PI*2, r=3+Math.random()*14;
    this.spawn(camPos.x+Math.cos(a)*r, camPos.y-0.5+Math.random()*3.5, camPos.z+Math.sin(a)*r,
      (Math.random()-0.5)*0.24, (Math.random()-0.3)*0.14, (Math.random()-0.5)*0.24,
      6+Math.random()*5, 0.030+Math.random()*0.026,
      1.0*sunAmt, 0.94*sunAmt, 0.78*sunAmt);
  }
  fireflies(camPos){
    if(Math.random()>0.25*this.density) return;
    const a=Math.random()*Math.PI*2, r=4+Math.random()*18;
    this.spawn(camPos.x+Math.cos(a)*r, camPos.y+0.3+Math.random()*2.2, camPos.z+Math.sin(a)*r,
      (Math.random()-0.5)*0.4, (Math.random()-0.4)*0.25, (Math.random()-0.5)*0.4,
      5+Math.random()*4, 0.075, 0.85, 1.0, 0.35);
  }
  /* Locomotive exhaust: dark and fast at the stack, pale and slow as it
     lifts and cools. */
  smoke(pos, speed){
    const n = Math.round(M.lerp(2, 6, M.sat(speed/12))*this.density);
    for(let i=0;i<n;i++){
      const dark = 0.24 + Math.random()*0.30;
      this.spawn(pos.x+(Math.random()-0.5)*0.5, pos.y, pos.z+(Math.random()-0.5)*0.5,
        (Math.random()-0.5)*0.9, 2.6+Math.random()*1.8, (Math.random()-0.5)*0.9,
        4.5+Math.random()*3.5, 0.55+Math.random()*0.55,
        dark, dark*0.96, dark*0.94);
    }
  }
  breath(pos, dir){
    for(let i=0;i<3;i++)
      this.spawn(pos.x+dir.x*0.2, pos.y, pos.z+dir.z*0.2,
        dir.x*1.4+(Math.random()-0.5)*0.4, 0.25+Math.random()*0.2,
        dir.z*1.4+(Math.random()-0.5)*0.4,
        1.1, 0.09+Math.random()*0.07, 0.92,0.94,0.98);
  }
  splash(pos){
    for(let i=0;i<10;i++)
      this.spawn(pos.x+(Math.random()-0.5)*0.5, pos.y+0.05, pos.z+(Math.random()-0.5)*0.5,
        (Math.random()-0.5)*2.4, 1.6+Math.random()*1.8, (Math.random()-0.5)*2.4,
        0.7, 0.055, 0.70,0.80,0.86);
  }
}
/* ==========================================================================
   COLLISION
   Buildings are solid. A uniform grid holds oriented boxes; anything that
   moves resolves against the boxes in the cells it overlaps.

   Two jobs, not one:
     · block   — you cannot walk through a wall
     · support — you CAN walk onto a boardwalk, a porch or a loading dock,
                 because a box top under your feet counts as ground

   Everything is axis-aligned in its own local frame and rotated by a single
   yaw, which is all a frontier town ever needs and is far cheaper than a
   general convex solver.
   ========================================================================== */
class Colliders {
  constructor(cell = 10){
    this.cell = cell;
    this.grid = new Map();          // "i,j" -> [box, ...]
    this.groups = new Map();        // owner key -> [box, ...]
    this._tmp = new THREE.Vector3();
  }
  _key(i,j){ return i + ',' + j; }
  _cellsFor(b, fn){
    const c = this.cell;
    const r = Math.hypot(b.hw, b.hd);
    const i0 = Math.floor((b.x - r)/c), i1 = Math.floor((b.x + r)/c);
    const j0 = Math.floor((b.z - r)/c), j1 = Math.floor((b.z + r)/c);
    for(let j=j0;j<=j1;j++) for(let i=i0;i<=i1;i++) fn(this._key(i,j));
  }

  /* hw/hh/hd are half-extents. y is the BOTTOM of the box.

     Long boxes — a station platform, a 170-metre boardwalk — are split into
     cell-sized pieces along their own axes before they go in the grid. A
     single box that spans twenty cells has to be registered by its
     circumradius, which is both wasteful and leaky: the broadphase would miss
     it in exactly the places you were standing on it. */
  addBox(owner, x, y, z, hw, hh, hd, yaw = 0, opts = {}){
    const cellsX = Math.ceil((hw*2)/this.cell);
    const cellsZ = Math.ceil((hd*2)/this.cell);
    if(cellsX*cellsZ > 1 && cellsX*cellsZ <= 512){
      const cy = Math.cos(yaw), sy = Math.sin(yaw);
      const sw = hw/cellsX, sd = hd/cellsZ;
      let first = null;
      for(let i=0;i<cellsX;i++) for(let j=0;j<cellsZ;j++){
        const lx = -hw + sw*(2*i+1), lz = -hd + sd*(2*j+1);
        const wx = x + lx*cy + lz*sy;
        const wz = z - lx*sy + lz*cy;
        const piece = this._push(owner, wx, y, wz, sw, hh, sd, yaw, opts);
        if(!first) first = piece;
      }
      return first;
    }
    return this._push(owner, x, y, z, hw, hh, hd, yaw, opts);
  }

  _push(owner, x, y, z, hw, hh, hd, yaw, opts){
    const b = { x, y, z, hw, hh, hd,
                c: Math.cos(-yaw), s: Math.sin(-yaw),
                top: y + hh*2, solid: opts.solid !== false,
                climb: opts.climb !== false };
    this._cellsFor(b, k=>{
      let arr = this.grid.get(k);
      if(!arr) this.grid.set(k, arr = []);
      arr.push(b);
    });
    let g = this.groups.get(owner);
    if(!g) this.groups.set(owner, g = []);
    g.push(b);
    return b;
  }

  /* Add every box a building needs from its own local part list. */
  addFromParts(owner, parts, mtx, yaw, minHeight = 0.9){
    // minHeight is the line between "wall" and "floor" for this structure.
    const v = new THREE.Vector3();
    for(const part of parts){
      const g = part.geo;
      if(!g.boundingBox) g.computeBoundingBox();
      const bb = g.boundingBox;
      const hh = (bb.max.y - bb.min.y)/2;
      v.set((bb.min.x+bb.max.x)/2, bb.min.y, (bb.min.z+bb.max.z)/2)
       .applyMatrix4(mtx);
      // Anything shorter than a knee is not a wall — it is a floor. Porches,
      // decks and loading docks become surfaces you can step up onto.
      const low = hh*2 < minHeight;
      this.addBox(owner, v.x, v.y, v.z,
        (bb.max.x-bb.min.x)/2, hh, (bb.max.z-bb.min.z)/2, yaw,
        low ? { solid:false, climb:true } : {});
    }
  }

  remove(owner){
    const g = this.groups.get(owner);
    if(!g) return;
    const dead = new Set(g);
    for(const b of g) this._cellsFor(b, k=>{
      const arr = this.grid.get(k);
      if(!arr) return;
      const kept = arr.filter(x=>!dead.has(x));
      if(kept.length) this.grid.set(k, kept); else this.grid.delete(k);
    });
    this.groups.delete(owner);
  }

  _near(x, z, radius, fn){
    const c = this.cell;
    const i0 = Math.floor((x-radius)/c), i1 = Math.floor((x+radius)/c);
    const j0 = Math.floor((z-radius)/c), j1 = Math.floor((z+radius)/c);
    for(let j=j0;j<=j1;j++) for(let i=i0;i<=i1;i++){
      const arr = this.grid.get(this._key(i,j));
      if(arr) for(let k=0;k<arr.length;k++) fn(arr[k]);
    }
  }

  /* Highest box top the mover could be standing on. Anything within stepUp of
     the feet counts, which is what lets you walk up onto a boardwalk without
     a jump and without a ramp. */
  support(x, z, feetY, radius, stepUp = CFG.STEP_UP){
    let best = -Infinity;
    this._near(x, z, radius, b=>{
      if(!b.climb) return;
      if(b.top > feetY + stepUp) return;         // that is a wall, not a step
      if(b.top < best) return;
      const dx = x-b.x, dz = z-b.z;
      const lx = dx*b.c - dz*b.s, lz = dx*b.s + dz*b.c;
      if(Math.abs(lx) > b.hw + radius*0.6) return;
      if(Math.abs(lz) > b.hd + radius*0.6) return;
      best = b.top;
    });
    return best;
  }

  /* Push a capsule out of anything it is inside. Resolves on the axis of least
     penetration in the box's own frame, so you slide along a wall instead of
     sticking to it. Boxes whose top is below the mover's feet + step are
     ignored: those are things you are standing on, not things in your way. */
  resolve(pos, radius, height, stepUp = CFG.STEP_UP){
    let hit = false;
    for(let iter=0; iter<3; iter++){
      let moved = false;
      this._near(pos.x, pos.z, radius + 3, b=>{
        if(!b.solid) return;
        if(b.top <= pos.y + stepUp) return;      // walkable, handled by support
        if(b.y >= pos.y + height) return;        // overhead, e.g. a balcony
        const dx = pos.x-b.x, dz = pos.z-b.z;
        const lx = dx*b.c - dz*b.s, lz = dx*b.s + dz*b.c;
        const ox = b.hw + radius - Math.abs(lx);
        const oz = b.hd + radius - Math.abs(lz);
        if(ox <= 0 || oz <= 0) return;
        let px=0, pz=0;
        if(ox < oz) px = Math.sign(lx || 1)*ox; else pz = Math.sign(lz || 1)*oz;
        // Back into world space (inverse of the yaw used above).
        pos.x += px*b.c + pz*b.s;
        pos.z += -px*b.s + pz*b.c;
        moved = true; hit = true;
      });
      if(!moved) break;
    }
    return hit;
  }

  /* Cheap line-of-sight test, used to keep the camera out of buildings. */
  blocked(x, z, radius){
    let any = false;
    this._near(x, z, radius, b=>{
      if(any || !b.solid) return;
      const dx = x-b.x, dz = z-b.z;
      const lx = dx*b.c - dz*b.s, lz = dx*b.s + dz*b.c;
      if(Math.abs(lx) < b.hw+radius && Math.abs(lz) < b.hd+radius) any = true;
    });
    return any;
  }
  get count(){ let n=0; for(const g of this.groups.values()) n+=g.length; return n; }
}
/* ==========================================================================
   WORLD_STREAMER
   128-unit cells. Load radius 5, unload at 7. Chunk contents build on a
   staggered per-frame budget so there is never a hitch (§3.4). Distant terrain
   renders as one low-res mesh with baked colour, always visible, so the
   horizon is never empty.
   ========================================================================== */
class WorldStreamer {
  constructor(scene, terrain, veg, terrainMat){
    this.scene=scene; this.terrain=terrain; this.veg=veg; this.mat=terrainMat;
    this.loaded = new Map();          // "cx,cz" -> {group, lod}
    this.queue = [];
    this.lastCell = null;
  }
  key(cx,cz){ return cx+','+cz; }

  /* LOD ring: near cells get 64 quads across, the outer ring 16. */
  lodFor(d){ return d<=1 ? 0 : (d<=3 ? 1 : 2); }
  resFor(lod){ return [48,24,12][lod]; }

  request(px,pz, radius){
    const cx = Math.floor((px+CFG.HALF)/CFG.CHUNK);
    const cz = Math.floor((pz+CFG.HALF)/CFG.CHUNK);
    if(this.lastCell && this.lastCell[0]===cx && this.lastCell[1]===cz
       && this.queue.length===0) return;
    this.lastCell=[cx,cz];
    const want = new Set();
    for(let dz=-radius; dz<=radius; dz++){
      for(let dx=-radius; dx<=radius; dx++){
        const d = Math.max(Math.abs(dx),Math.abs(dz));
        if(d > radius) continue;
        const X=cx+dx, Z=cz+dz;
        if(X<0||Z<0||X>=CFG.CHUNKS||Z>=CFG.CHUNKS) continue;
        const k=this.key(X,Z);
        want.add(k);
        const lod = this.lodFor(d);
        const have = this.loaded.get(k);
        if(!have){
          if(!this.queue.find(q=>q.k===k))
            this.queue.push({k, cx:X, cz:Z, lod, d});
        } else if(have.lod !== lod && !this.queue.find(q=>q.k===k)){
          this.queue.push({k, cx:X, cz:Z, lod, d, replace:true});
        }
      }
    }
    // Unload beyond the hysteresis ring.
    for(const [k, entry] of this.loaded){
      const [X,Z] = k.split(',').map(Number);
      const d = Math.max(Math.abs(X-cx), Math.abs(Z-cz));
      if(d > CFG.UNLOAD_R){ this._dispose(entry); this.loaded.delete(k); }
    }
    // Nearest first.
    this.queue.sort((a,b)=>a.d-b.d);
  }

  /* Only chunk-owned geometry is freed. Tree trunks and leaf cards come from
     the shared palette and must survive the chunk that borrowed them. */
  _dispose(entry){
    this.scene.remove(entry.group);
    entry.group.traverse(o=>{
      if(o.isInstancedMesh) o.dispose();
      if(o.geometry && o.geometry.userData.owned) o.geometry.dispose();
    });
  }

  /* Build within a time budget. Never more than CHUNK_BUDGET_MS per frame. */
  pump(budgetMs = CFG.CHUNK_BUDGET_MS){
    const t0 = performance.now();
    let built = 0;
    while(this.queue.length && performance.now()-t0 < budgetMs){
      const job = this.queue.shift();
      const old = this.loaded.get(job.k);
      const group = new THREE.Group();
      const geo = this.terrain.buildChunkGeometry(job.cx, job.cz, this.resFor(job.lod));
      geo.userData.owned = true;
      const mesh = new THREE.Mesh(geo, this.mat);
      mesh.receiveShadow = true;
      mesh.castShadow = job.lod === 0;
      group.add(mesh);
      if(job.lod < 2){
        const trees = this.veg.buildChunk(job.cx, job.cz, job.lod);
        group.add(trees);
      }
      this.scene.add(group);
      if(old) this._dispose(old);
      this.loaded.set(job.k, {group, lod:job.lod});
      built++;
    }
    return built;
  }

  /* One coarse mesh for the whole world, always drawn, so the horizon reads.

     It has to sit strictly BELOW the streamed terrain everywhere, or its long
     64-unit facets punch up through the real ground and paint flat grey slabs
     across the landscape. Each vertex therefore takes the MINIMUM height over
     its own cell footprint, not the height at its exact centre, and the whole
     sheet is dropped a further margin below that. */
  buildDistant(){
    const N = 128;
    const SPAN = CFG.WORLD*1.5;
    const g = new THREE.PlaneGeometry(SPAN, SPAN, N, N);
    g.rotateX(-Math.PI/2);
    const p = g.attributes.position;
    const col = new Float32Array(p.count*3);
    const cell = SPAN/N;
    /* Minimum over the cell, on a 5x5 stencil, then a 3x3 min-filter across the
       vertex grid. The filter is the part that actually guarantees it: once a
       vertex holds the minimum of its whole neighbourhood, nothing bilinear
       interpolation does between two vertices can rise above the ground that
       lies between them. */
    const S = 5, rows = N+1;
    const minH = new Float32Array(p.count);
    for(let i=0;i<p.count;i++){
      const x=p.getX(i), z=p.getZ(i);
      let m = Infinity;
      for(let a=0;a<S;a++) for(let b=0;b<S;b++){
        const sx = M.clamp(x + (a/(S-1)-0.5)*cell, -CFG.HALF+1, CFG.HALF-1);
        const sz = M.clamp(z + (b/(S-1)-0.5)*cell, -CFG.HALF+1, CFG.HALF-1);
        const hh = this.terrain.heightAt(sx,sz);
        if(hh < m) m = hh;
      }
      minH[i] = m;
    }
    const filt = new Float32Array(p.count);
    for(let j=0;j<rows;j++) for(let i2=0;i2<rows;i2++){
      let m = Infinity;
      for(let dj=-1;dj<=1;dj++) for(let di=-1;di<=1;di++){
        const jj=j+dj, ii=i2+di;
        if(jj<0||jj>=rows||ii<0||ii>=rows) continue;
        const v = minH[jj*rows+ii];
        if(v < m) m = v;
      }
      filt[j*rows+i2] = m;
    }
    for(let i=0;i<p.count;i++){
      const x=p.getX(i), z=p.getZ(i);
      const cx = M.clamp(x,-CFG.HALF+1,CFG.HALF-1);
      const cz = M.clamp(z,-CFG.HALF+1,CFG.HALF-1);
      const h = filt[i];
      // Beyond the playable square the land falls away to sea and escarpment.
      const out = Math.max(Math.abs(x)-CFG.HALF, Math.abs(z)-CFG.HALF, 0);
      p.setY(i, h - CFG.DISTANT_DROP - out*0.12 - (out>0? 4:0));
      const b = this.terrain.biomeAt(cx,cz);
      const t = this.terrain.tintAt(cx,cz,b,h);
      const alt = M.sat((h-CFG.SNOWLINE)/34);
      const k = 0.34;
      col[i*3]  = M.lerp(t[0]*k, 0.92, alt);
      col[i*3+1]= M.lerp(t[1]*k, 0.94, alt);
      col[i*3+2]= M.lerp(t[2]*k, 0.98, alt);
    }
    g.setAttribute('color', new THREE.BufferAttribute(col,3));
    g.computeVertexNormals();
    const m = new THREE.MeshStandardMaterial({vertexColors:true, roughness:1,
      metalness:0, fog:true});
    const mesh = new THREE.Mesh(g,m);
    mesh.renderOrder = -5;
    mesh.frustumCulled = false;
    this.scene.add(mesh);
    return mesh;
  }
}

/* ==========================================================================
   INPUT
   Keyboard + mouse with pointer lock, and the Gamepad API as a secondary
   path (§1). Every hold has a toggle option in Settings.
   ========================================================================== */
class Input {
  constructor(dom){
    this.keys = {};
    this.fwd=0; this.right=0;
    this.sprint=false; this.walk=false; this.jump=false; this.brake=false;
    this.mouseDX=0; this.mouseDY=0;
    this.locked=false;
    this.pressed = {};
    dom.addEventListener('click', ()=>{ if(!this.locked) dom.requestPointerLock(); });
    document.addEventListener('pointerlockchange', ()=>{
      this.locked = document.pointerLockElement === dom;
    });
    document.addEventListener('mousemove', e=>{
      if(!this.locked) return;
      this.mouseDX += e.movementX; this.mouseDY += e.movementY;
    });
    window.addEventListener('keydown', e=>{
      if(!this.keys[e.code]) this.pressed[e.code]=true;
      this.keys[e.code]=true;
      if(['Space','Tab','KeyE','KeyF'].includes(e.code)) e.preventDefault();
    });
    window.addEventListener('keyup', e=>{ this.keys[e.code]=false; });
    window.addEventListener('blur', ()=>{ this.keys={}; });
  }
  once(code){ if(this.pressed[code]){ this.pressed[code]=false; return true; } return false; }
  endFrame(){ this.pressed = {}; this.mouseDX=0; this.mouseDY=0; }

  poll(){
    const k=this.keys;
    let f=0,r=0;
    if(k.KeyW||k.ArrowUp) f+=1;
    if(k.KeyS||k.ArrowDown) f-=1;
    if(k.KeyD||k.ArrowRight) r+=1;
    if(k.KeyA||k.ArrowLeft) r-=1;
    this.sprint = !!(k.ShiftLeft||k.ShiftRight);
    this.walk = !!(k.AltLeft||k.AltRight);
    this.brake = !!k.KeyC;
    this.jump = !!k.Space;

    /* Gamepad overrides when a stick is actually being pushed. */
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    for(const p of pads){
      if(!p) continue;
      const dz=(v)=>Math.abs(v)<0.16?0:v;
      const lx=dz(p.axes[0]||0), ly=dz(p.axes[1]||0);
      if(lx||ly){ r=lx; f=-ly; }
      const rx=dz(p.axes[2]||0), ry=dz(p.axes[3]||0);
      this.mouseDX += rx*26; this.mouseDY += ry*22;
      if(p.buttons[6] && p.buttons[6].value>0.4) this.sprint=true;
      if(p.buttons[0] && p.buttons[0].pressed) this.jump=true;
      break;
    }
    const mag=Math.hypot(f,r);
    if(mag>1){ f/=mag; r/=mag; }
    this.fwd=f; this.right=r;
  }
}

/* ==========================================================================
   GAME
   ========================================================================== */
class Game {
  constructor(){
    this.quality = 1;
    this.adaptive = true;
    this.sensitivity = 1.0;
    this.discovered = new Set();
    this.objective = 'Learn the country. Find the Gulch.';
    this.frameTimes = [];
    this.acc = 0;
    this.last = performance.now()/1000;
    this.elapsed = 0;
    this.paused = false;
  }

  /* --- BOOT: real steps, real progress bar (§1) ------------------------- */
  async boot(){
    const bar = document.getElementById('bootBar');
    const step = document.getElementById('bootStep');
    const pct = document.getElementById('bootPct');
    const STEPS = [
      ['laying out the frontier',        ()=>this._renderer()],
      ['baking pigment and grain',       ()=>this._textures()],
      ['raising the ranges',             ()=>this._terrainBase()],
      ['forty passes of rain',           ()=>this._erode()],
      ['cutting the rivers to the sea',  ()=>this._rivers()],
      ['surveying six townsites',        ()=>this._towns()],
      ['routing the roads',              ()=>this._roads()],
      ['hanging the sky',                ()=>this._sky()],
      ['grinding the colour grades',     ()=>this._post()],
      ['growing things that have roots', ()=>this._veg()],
      ['articulating a man',             ()=>this._player()],
      ['articulating a horse',           ()=>this._horse()],
      ['tuning the wire',                ()=>this._audio()],
      ['raising the townsfolk',          ()=>this._folk()],
      ['building Yes Gulch',             ()=>this._homeTown()],
      ['drawing the map',                ()=>this._map()],
      ['getting up steam',               ()=>this._train()],
      ['setting the scene',              ()=>this._story()],
      ['populating the near country',    ()=>this._firstChunks()],
    ];
    let done = 0;
    for(const [label, fn] of STEPS){
      step.textContent = label;
      await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
      await fn();
      done++;
      const p = Math.round(done/STEPS.length*100);
      bar.style.width = p+'%'; pct.textContent = p+'%';
    }
    step.textContent = 'ready';
    document.getElementById('bootGo').classList.add('ready');
  }

  _renderer(){
    this.renderer = new THREE.WebGLRenderer({
      antialias:true, powerPreference:'high-performance', stencil:false });
    this.renderer.outputColorSpace = THREE.SRGBColorSpace;
    this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
    this.renderer.toneMappingExposure = CFG.EXPOSURE;
    this.renderer.shadowMap.enabled = true;
    this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    this.renderer.setPixelRatio(Math.min(devicePixelRatio, CFG.MAX_PIXEL_RATIO));
    this.renderer.setSize(innerWidth, innerHeight);
    document.getElementById('stage').appendChild(this.renderer.domElement);

    this.scene = new THREE.Scene();
    this.camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, 0.28, 3400);
    this.noiseTex = makeNoiseTexture(256);
  }

  _textures(){
    this.lib = TEX.init();
  }
  _terrainBase(){
    this.terrain = new Terrain();
    this.terrain.generateBase();
  }
  _erode(){ this.terrain.erode(40000, 34); }
  _rivers(){
    this.terrain.carveRivers();
    this.terrain.shapeShore();
  }
  /* Townsites are chosen and levelled BEFORE moisture, the shore texture or a
     single chunk is meshed, so everything downstream sees the graded ground. */
  _towns(){
    this.colliders = new Colliders(10);
    this.towns = new Towns(this.terrain, this.lib, this.colliders);
    this.towns.place();
  }
  /* Roads are routed and graded before moisture, the shore texture or a single
     chunk is meshed, so everything downstream sees the finished ground. */
  _roads(){
    this.roads = new Roads(this.terrain);
    this.roads.build(this.towns.list);
    // Towns on the line need to know where their platform goes.
    this.towns.stationFor = (key)=>
      (this.roads.stations || []).find(s=>s.town===key) || null;
    this.terrain.buildMoisture();
  }

  _sky(){
    this.sky = new Sky(this.scene, this.noiseTex);
    this.roadTex = this.terrain.roadTexture();
    this.terrainMat = makeTerrainMaterial(this.lib, this.roadTex);
    /* Water: one big plane at sea level plus the Delta. Rivers read through
       the wet splat and the carved channels. */
    this.waterMat = makeWater(this.noiseTex, this.terrain.shoreTexture());

    const wgeo = new THREE.PlaneGeometry(CFG.WORLD*1.2, CFG.WORLD*1.2, 160, 160);
    wgeo.rotateX(-Math.PI/2);
    this.water = new THREE.Mesh(wgeo, this.waterMat);
    this.water.position.y = CFG.SEA - 0.25;
    this.water.renderOrder = 2;
    this.water.frustumCulled = false;
    this.scene.add(this.water);
  }

  _post(){
    const pr = this.renderer.getPixelRatio();
    this.composer = new Composer(this.renderer, this.scene, this.camera,
      Math.floor(innerWidth*pr), Math.floor(innerHeight*pr));
    this.tod = new TimeOfDay(this.scene, this.sky, this.composer);
  }

  _veg(){
    this.towns.scene = this.scene;
    this.roads.buildGeometry(this.lib, this.scene, this.colliders);
    this.veg = new Vegetation(this.terrain, this.lib);
    this.grass = makeGrassField(this.terrain, this.quality);
    this.grass.add(this.scene);
    this.particles = new Particles(this.scene, 6000);
    this.weather = new Weather(this.scene, this.sky, this.tod, null);
    this.streamer = new WorldStreamer(this.scene, this.terrain, this.veg, this.terrainMat);
    this.distant = this.streamer.buildDistant();
  }

  _player(){
    this.player = new Player(this.terrain, this.lib, this.scene, this.colliders);
    /* Open on the road just outside Yes Gulch. */
    const home = this.towns.list[0];
    const out = this.roads.routes.find(r=>r.a===home.key || r.b===home.key);
    let sx = home.x + home.radius*0.85, sz = home.z + home.radius*0.35;
    if(out){
      const along = Math.min(out.length*0.55, home.radius + 42);
      const s = this.roads.sampleRoute(out, along);
      sx = s.pos.x; sz = s.pos.z;
    }
    this.player.spawn(sx, sz);
    // Never wake up inside a wall.
    this.colliders.resolve(this.player.pos, CFG.PLAYER_R, CFG.PLAYER_H);
    this.player.object.position.copy(this.player.pos);
    this.player.setAct(1);
    this.cam = new OrbitCam(this.camera, this.terrain, this.colliders);
    this.cam.yaw = 2.1;
    this.cam.smoothTarget.copy(this.player.eyePos);
    this.ui = new UI();
    this.ledger = new Ledger(this);
    this.input = new Input(this.renderer.domElement);
  }

  _horse(){
    this.horse = new Horse(this.terrain, this.lib, this.scene, this.colliders);
    this.horse.spawn(this.player.pos.x + 3.2, this.player.pos.z + 1.4, 2.4);
    this.horse.bond = 2.0;
  }

  _audio(){
    this.audio = new Audio();
    /* Wiring — every emitter routes through the audio module. */
    this.player.onStep = (surface, intensity, pos)=>{
      this.audio.footstep(surface, intensity, pos);
      if(surface==='sand'||surface==='gravel')
        this.particles.hoofDust(pos, intensity*4, surface);
      if(surface==='water'){ this.audio.splash(pos,0.5); this.particles.splash(pos); }
    };
    this.player.onLand = (impact)=>{ this.cam.addShake(impact*0.9); };
    this.horse.onHoof = (speed,pos,gait)=>{
      this.audio.hoofbeat(speed,pos,gait);
      const t=this.terrain;
      const s=t.splatAt(pos.x,pos.z,pos.y,t.slopeAt(pos.x,pos.z));
      const surf = s[3]>0.4?'snow' : s[2]>0.4?'sand' : s[0]>0.4?'gravel':'dirt';
      this.particles.hoofDust(pos, speed, surf);
    };
    this.horse.onStumble = ()=> this.cam.addShake(0.7);
    this.horse.onSpeak = (line, pos)=>{
      this.ui.say('OLLIE', line, undefined, 'ollie');
      this.audio.speak(line, VOICE.ollie, pos,
        (open)=>{ this.horse.mouthOpen = open; },
        ()=>{ this.horse.mouthOpen = 0; },
        ()=> this.horse.headPoint());        // the voice rides with her
    };
  }

  _folk(){
    this.folk = new Townsfolk(this.terrain, this.lib, this.scene, this.colliders);
    this.folk.onSpeak = (npc, line)=>{
      this.ui.say(npc.name, line, undefined, npc.named ? 'named' : '');
      this.audio.speak(line, VOICE[npc.voice] || VOICE.conway,
        npc.pos.clone().setY(npc.pos.y+1.6), null, null,
        ()=> npc.pos.clone().setY(npc.pos.y+1.6));
    };
    /* Two lamps follow whichever windows are nearest — a full point light per
       lamp post would cost more than the whole town is worth. */
    this.townLights = [];
    for(let i=0;i<CFG.TOWN_LIGHTS;i++){
      const l = new THREE.PointLight(0xffb14a, 0, 16, 2);
      l.visible = false; this.scene.add(l); this.townLights.push(l);
    }
  }

  /* The largest town is the one you start beside, and it is the most
     expensive to assemble. Build it during boot so the only noticeable town
     build in the whole game happens behind the loading bar. */
  _homeTown(){
    const home = this.towns.list[0];
    const g = this.towns._build(home);
    this.scene.add(g);
    this.towns.built.set(home.key, g);
    this.folk.populate(home, g);
    this.discovered.add(home.name);
  }

  _train(){
    this.train = new Train(this.roads, this.lib, this.scene, this.audio);
    this.train.smoke = (pos, speed)=> this.particles.smoke(pos, speed);
  }

  _story(){
    this.story = new Story(this);
  }

  _map(){
    this.map = new WorldMap(this.terrain, this.roads);
    this.map.bake();
    this.map.reveal(this.player.pos.x, this.player.pos.z, 220);
  }

  async _firstChunks(){
    this.streamer.request(this.player.pos.x, this.player.pos.z, 3);
    // Build the opening cell set up front so the first frame is complete.
    for(let i=0;i<40 && this.streamer.queue.length;i++){
      this.streamer.pump(60);
      await new Promise(r=>setTimeout(r,0));
    }
    this.grass.reposition(this.player.pos.x, this.player.pos.z, 1);
    this.setQuality(this.quality);
  }

  /* --- Quality ---------------------------------------------------------- */
  setQuality(i){
    this.quality = M.clamp(i,0,QUALITY.length-1);
    const q = QUALITY[this.quality];
    this.renderer.setPixelRatio(Math.min(devicePixelRatio, q.pr));
    this.renderer.setSize(innerWidth, innerHeight);
    this.composer.setSize(
      Math.floor(innerWidth*this.renderer.getPixelRatio()),
      Math.floor(innerHeight*this.renderer.getPixelRatio()));
    this.composer.opts.ssao = q.ssao;
    this.composer.opts.bloom = q.bloom;
    this.composer.setSSAOScale(q.ssaoScale);
    this.tod.sun.shadow.mapSize.set(q.shadow, q.shadow);
    const sm = this.tod.sun.shadow.map;
    if(sm && typeof sm.dispose === 'function'){ sm.dispose(); }
    this.tod.sun.shadow.map = null;
    this.tod.sunFar.visible = q.cascades > 2;
    this.particles.density = q.particles;
    this.grass.forceRebuild();
    this.grassDensity = q.grass;
    this.drawRadius = q.drawR;
  }

  start(){
    document.getElementById('boot').classList.add('gone');
    setTimeout(()=>{ const b=document.getElementById('boot'); if(b) b.style.display='none'; }, 1600);
    this.ui.show();
    this.audio.init();
    this.audio.resume();
    this.weather.audio = this.audio;
    /* The main theme, stated properly at the Act I title card (§16). */
    this.audio.music.setState('explore');
    /* Ollie stands on his RIGHT, half a pace ahead, angled in toward him.
       Offsetting her in world axes meant she could end up anywhere relative to
       his facing — including directly behind the camera's shot on her, which
       is how the opening ended up framed on the inside of her foreleg. */
    const y0 = this.player.yaw;
    const fx = Math.sin(y0), fz = Math.cos(y0);      // his forward
    const rx = -Math.cos(y0), rz = Math.sin(y0);     // his right
    this.horse.spawn(this.player.pos.x + rx*2.15 + fx*0.45,
                     this.player.pos.z + rz*2.15 + fz*0.45,
                     y0 + 0.42);
    this.loop();
    setTimeout(()=>this.story.opening(), 500);
  }

  /* --- FIXED-STEP SIMULATION (§3.1) -------------------------------------- */
  fixed(dt){
    const inp = this.input;
    this.tod.update(dt);
    const biome = this.terrain.biomeAt(this.player.pos.x, this.player.pos.z);
    this.weather.update(dt, this.player.pos, biome);
    this.discovered.add(BIOME_NAMES[biome]);
    if(this.map) this.map.reveal(this.player.pos.x, this.player.pos.z,
                                 this.player.mounted ? 185 : 150);

    /* Settlements assemble and release around the player; their residents
       only think when he is close enough to notice them. */
    const town = this.towns.update(this.player.pos,
      (t,g)=>{ this.folk.populate(t,g);
               this.discovered.add(t.name); },
      (t)=> this.folk.release(t));
    this.folk.fixedUpdate(dt, this.tod.hour, this.player.pos);
    if(town && town !== this._enteredTown){
      this._enteredTown = town;
      this.ui.toast(town.name.toUpperCase(), town.blurb, 4.5);
      if(this.story) this.story.onEnterTown(town);
    } else if(!town) this._enteredTown = null;

    /* Nothing takes input during a cutscene. The frame loop already hands the
       camera to the director, but the SIMULATION was still reading the
       keyboard, so you could walk out of your own scene. */
    if(this.story && this.story.director.active){
      const still = { fwd:0, right:0, sprint:false, walk:false,
                      jump:false, brake:true };
      this.player.vel.set(0,0,0);
      this.player.turning = null;
      this.horse.followTarget = null;
      this.horse.fixedUpdate(dt, still, this.horse.yaw, this.worldState());
      if(!this.player.mounted) this.player.fixedUpdate(dt, still, this.player.yaw);
      if(this.audio.update) this.audio.update(dt);
      return;
    }

    if(this.aboard){
      // Pinned to the carriage; his own locomotion is switched off.
      this.horse.fixedUpdate(dt, {fwd:0,right:0}, this.cam.yaw, this.worldState());
    } else if(this.player.mounted){
      this.horse.fixedUpdate(dt, inp, this.cam.yaw, this.worldState());
      this.player.fixedUpdate(dt, inp, this.cam.yaw);
    } else {
      this.horse.fixedUpdate(dt, {fwd:0,right:0}, this.cam.yaw, this.worldState());
      this.player.fixedUpdate(dt, inp, this.cam.yaw);
    }
    if(this.audio.update) this.audio.update(dt);
  }

  _nearestStation(pos){
    if(!this.roads || !this.roads.stations) return null;
    let best=null, bd=Infinity;
    for(const s of this.roads.stations){
      const d = Math.hypot(s.pos.x-pos.x, s.pos.z-pos.z);
      if(d < bd){ bd=d; best=s; }
    }
    return best ? { s:best, d:bd } : null;
  }

  worldState(){
    return {
      isNight: this.tod.nightAmt > 0.6,
      weather: this.weather.target,
      wetness: this.weather.wetness,
      inWater: this.terrain.sample(this.terrain.river,
                 this.horse.pos.x, this.horse.pos.z) > 0.4,
      inTown: !!this.towns.current,
      nearTower: false,
    };
  }

  /* --- PER-FRAME --------------------------------------------------------- */
  frame(dt){
    const inp = this.input, p = this.player, h = this.horse;
    if(!(this.story && this.story.director.active)){
      p.suspendIK = false; h.inScene = false;
      if(p.anim.frozen) p.anim.unfreeze();
      if(h.anim.frozen) h.anim.unfreeze();
    }

    /* A cutscene takes the camera and the controls; everything else in the
       world carries on around it. */
    if(this.story && this.story.director.active){
      if(inp.once('Escape') || inp.once('Space')) this.story.director.skip();
      // Swallow look input so the camera does not lurch when control returns.
      inp.mouseDX = 0; inp.mouseDY = 0;
      this.story.director.update(dt);
      this.ui.updateSubs(dt);
      /* Foot IK re-solves the legs every frame against the ground. It is what
         you want while walking and exactly what you do not want while a camera
         is a metre from the subject, so it is off for the duration. */
      p.suspendIK = true; h.inScene = true;
      p.anim.freeze('idle', 1.35);
      h.anim.freeze('graze_idle', 2.10);
      h.update(dt, null);
      p.update(dt, null);
      this.folk.updatePosesOnly(dt, p.eyePos.clone());

      /* The world does not stop for a cutscene: terrain keeps streaming, the
         sky keeps moving, and the grass is still lit and placed around the
         camera. Skipping all of it was leaving the scene standing in a bald,
         unlit patch of country. */
      this.tod.followTarget(this.camera.position);
      this.streamer.request(this.camera.position.x, this.camera.position.z,
                            this.drawRadius);
      this.streamer.pump();
      this.grass.reposition(this.camera.position.x, this.camera.position.z,
                            this.grassDensity);
      this._sunLit = (this._sunLit || new THREE.Color());
      this._ambLit = (this._ambLit || new THREE.Color());
      this._sunLit.copy(this.tod.sun.color)
          .multiplyScalar(M.clamp(this.tod.sun.intensity*0.30, 0, 1.5));
      this._ambLit.copy(this.tod.hemi.color)
          .multiplyScalar(this.tod.hemi.intensity*0.62);
      this.grass.update(this.elapsed, this.weather.windDir, this.weather.windStr,
        this.camera.position, this.tod.sunDir, this._sunLit, this._ambLit);
      this.veg.update(this.elapsed, this.weather.windDir, this.weather.windStr);
      this.sky.uniforms.uTime.value = this.elapsed;
      const wu2 = this.waterMat.userData.uniforms;
      wu2.uTime.value = this.elapsed;
      wu2.uSun.value.copy(this.tod.sunDir);
      this.water.position.x = this.camera.position.x;
      this.water.position.z = this.camera.position.z;
      this.towns.setNight(this.tod.nightAmt);
      this._placeTownLights();
      if(this.train) this.train.update(dt, this.camera.position, this.tod.nightAmt);
      this.particles.update(dt, this.weather.windDir, this.weather.windStr);

      this.composer.render(this.elapsed);
      inp.endFrame();
      return;
    }

    /* Camera look. */
    if(inp.locked || Math.abs(inp.mouseDX)+Math.abs(inp.mouseDY) > 0)
      this.cam.input(inp.mouseDX, inp.mouseDY, this.sensitivity);

    /* Interactions. */
    const mountDist = p.mounted ? 0 : p.pos.distanceTo(h.pos);
    this.ui.setPrompt('mount','E', p.mounted?'Dismount':'Mount Ollie',
                      p.mounted || mountDist < 3.4);
    this.ui.setPrompt('whistle','Q','Whistle', !p.mounted && mountDist >= 3.4);
    this.ui.setPrompt('brush','R','Brush Ollie', !p.mounted && mountDist < 3.0);
    this.ui.setPrompt('rear','X','Rear up', p.mounted && h.bond>=2);
    this.ui.setPrompt('ledger','Tab','Ledger', true);

    if(inp.once('KeyE')){
      if(p.mounted) h.dismount();
      else if(mountDist < 3.4) h.mount(p);
    }
    if(inp.once('KeyQ') && !p.mounted){
      p.anim.playOverride('whistle', UPPER_MASK, 1, 0.10, false);
      setTimeout(()=>p.anim.stopOverride('whistle'), 1000);
      this.audio.whistleSfx(p.pos);
      if(h.whistleTo(p.pos, ()=>this.player.pos))
        this.ui.toast('', `Ollie is coming — ${Math.round(h.pos.distanceTo(p.pos))}m`, 2.2);
      else this.ui.toast('', 'Too far. She cannot hear you.', 2.2);
    }
    if(inp.once('KeyR') && !p.mounted && mountDist<3.0){
      h.brush(); this.ui.toast('','Ollie: bond '+h.bond.toFixed(1), 1.6);
      h.say('highBond', true);
    }
    if(inp.once('KeyX') && p.mounted) h.rear();
    if(inp.once('KeyH')) p.anim.playOverride('tip_hat', UPPER_MASK, 1, 0.10, false),
                         setTimeout(()=>p.anim.stopOverride('tip_hat'), 1350);
    if(inp.once('KeyC')) p.crouched = !p.crouched;
    if(inp.once('Tab')){ this.ledger.toggle(); this.tod.paused = this.ledger.open; }
    if(inp.once('F3')) document.getElementById('dbg').classList.toggle('on');
    /* Escape hatch: a shader that will not compile on a given driver shows up
       as a black screen rather than an exception, so post can always be cut. */
    if(inp.once('F4')){
      this.composer.enabled = !this.composer.enabled;
      this.composer.failed = false;
      this.ui.toast(this.composer.enabled ? 'POST-PROCESSING ON' : 'POST-PROCESSING OFF',
                    'F4 to toggle', 2.4);
    }
    if(inp.once('Escape') && this.ledger.open){ this.ledger.close(); this.tod.paused=false; }
    if(inp.once('KeyT')) this.tod.setHour(this.tod.hour + 3);

    /* Animation + IK. */
    const lookAt = p.mounted ? null : h.headPoint();
    // Horse first: the rider is pinned to her saddle bone, so her skeleton has
    // to be solved for this frame before he reads it.
    h.update(dt, p.mounted ? null : p.eyePos.clone());
    p.update(dt, (!p.mounted && p.pos.distanceTo(h.pos)<7) ? lookAt : null);

    /* Camera. */
    const focus = p.mounted
      ? h.pos.clone().add(new THREE.Vector3(0,1.95,0))
      : p.eyePos.clone().add(new THREE.Vector3(0, p.crouched?-0.1:0, 0));
    this.cam.update(dt, focus, p.mounted ? h.speed : p.speed,
                    { mounted: !!p.mounted });
    this.tod.followTarget(p.pos);

    /* Streaming + grass. */
    this.streamer.request(p.pos.x, p.pos.z, this.drawRadius);
    this.streamer.pump();
    this.grass.reposition(p.pos.x, p.pos.z, this.grassDensity);
    this._sunLit = (this._sunLit || new THREE.Color());
    this._ambLit = (this._ambLit || new THREE.Color());
    this._sunLit.copy(this.tod.sun.color)
        .multiplyScalar(M.clamp(this.tod.sun.intensity*0.30, 0, 1.5));
    this._ambLit.copy(this.tod.hemi.color)
        .multiplyScalar(this.tod.hemi.intensity*0.62);
    this.grass.update(this.elapsed, this.weather.windDir, this.weather.windStr,
      this.camera.position, this.tod.sunDir, this._sunLit, this._ambLit);
    this.veg.update(this.elapsed, this.weather.windDir, this.weather.windStr);

    /* Sky + water uniforms. */
    this.sky.uniforms.uTime.value = this.elapsed;
    const wu = this.waterMat.userData.uniforms;
    wu.uTime.value = this.elapsed;
    wu.uSun.value.copy(this.tod.sunDir);
    wu.uSunCol.value.copy(this.tod.sun.color).multiplyScalar(
      M.sat(this.tod.sun.intensity*0.35));
    wu.uWind.value.copy(this.weather.windDir);
    this.water.position.x = p.pos.x; this.water.position.z = p.pos.z;
    this.terrainMat.userData.uniforms.uWetness.value = this.weather.wetness*0.85;

    /* Particles. */
    const W = this.weather;
    if(W.cur.rain > 0.03){
      if(W.state==='snow'||W.state==='blizzard')
        this.particles.snow(this.camera.position, W.cur.rain, W.windDir, W.windStr);
      else
        this.particles.rain(this.camera.position, W.cur.rain, W.windDir, W.windStr);
    }
    if(this.tod.dayAmt > 0.35 && W.cur.cloud < 0.7)
      this.particles.dustMotes(this.camera.position, this.tod.dayAmt);
    const biome = this.terrain.biomeAt(p.pos.x, p.pos.z);
    if(biome===BIOME.DELTA && this.tod.nightAmt > 0.5)
      this.particles.fireflies(this.camera.position);
    // Breath vapour in cold air (§15).
    if(p.pos.y > 130 || W.state==='snow' || W.state==='blizzard'){
      this._breathT = (this._breathT||0) - dt;
      if(this._breathT <= 0){
        this._breathT = 2.6 + Math.random();
        const f = new THREE.Vector3(Math.sin(p.yaw),0,Math.cos(p.yaw));
        this.particles.breath(p.eyePos.clone(), f);
        if(p.mounted || p.pos.distanceTo(h.pos)<9)
          this.particles.breath(h.headPoint(), f);
      }
    }
    this.particles.update(dt, W.windDir, W.windStr);

    /* Audio listener follows the camera (§16). */
    if(this.audio.ready){
      const L = this.audio.listener, c = this.camera;
      const fwd = new THREE.Vector3(0,0,-1).applyQuaternion(c.quaternion);
      const up = new THREE.Vector3(0,1,0).applyQuaternion(c.quaternion);
      if(L.positionX){
        L.positionX.value=c.position.x; L.positionY.value=c.position.y;
        L.positionZ.value=c.position.z;
        L.forwardX.value=fwd.x; L.forwardY.value=fwd.y; L.forwardZ.value=fwd.z;
        L.upX.value=up.x; L.upY.value=up.y; L.upZ.value=up.z;
      } else { L.setPosition(c.position.x,c.position.y,c.position.z);
               L.setOrientation(fwd.x,fwd.y,fwd.z,up.x,up.y,up.z); }
      // Music state follows the world: town/tension hooks land with the
      // mission engine; for now speed and night drive it.
      if(!this.towns.current){
        const st = (p.mounted && h.speed > CFG.HORSE.CANTER) ? 'tension' : 'explore';
        if(this.audio.music.state !== st) this.audio.music.setState(st);
      }
    }

    /* The service runs whether or not anybody is watching it. */
    if(this.train) this.train.update(dt, p.pos, this.tod.nightAmt);

    /* Townsfolk, lamplight and the town's own sound. */
    this.folk.world = {
      hour: this.tod.hour, weather: this.weather.target,
      mounted: !!p.mounted, reputation: p.reputation,
    };
    this.nearNpc = this.folk.update(dt, p.eyePos.clone(), p.pos, this.ui, this.audio);
    this.towns.setNight(this.tod.nightAmt);
    this._placeTownLights();
    const inTown = this.towns.current;
    if(inTown !== this._lastTown){
      this._lastTown = inTown;
      if(this.audio.ready){
        this.audio.music.setState(inTown ? 'town' : 'explore');
        this.audio.setReverb(inTown ? 'store' : 'outdoor');
      }
    }
    /* --- Riding the line ------------------------------------------------ */
    const tr = this.train;
    if(tr && tr.route){
      const bp = tr.boardPoint(this._bp || (this._bp = new THREE.Vector3()));
      const nearTrain = bp ? p.pos.distanceTo(bp) : 999;
      if(this.aboard){
        p.pos.copy(bp);
        p.object.position.copy(p.pos);
        p.object.rotation.set(0, tr.cars[2].mesh.rotation.y, 0);
        p.anim.play(tr.stopped ? 'idle' : 'idle_shift', 0.4);
        this.ui.setPrompt('board','E',
          tr.stopped ? `Step down${tr.currentStation()?' at '+tr.currentStation():''}`
                     : 'Hold on — moving', true);
        if(inp.once('KeyE') && tr.stopped){
          const ap = tr.alightPoint();
          p.pos.set(ap.x, this.terrain.heightAt(ap.x, ap.z), ap.z);
          this.colliders.resolve(p.pos, CFG.PLAYER_R, CFG.PLAYER_H);
          p.object.position.copy(p.pos);
          this.aboard = false;
          this.ui.setPrompt('board','E','',false);
          // Ollie travelled in the stock car; she is waiting on the platform.
          h.spawn(ap.x - Math.sin(p.yaw)*4, ap.z - Math.cos(p.yaw)*4, p.yaw);
          h.say('dismount', true);
          this.ui.toast(tr.currentStation() || 'THE LINE', 'End of the line for now', 3);
        }
      } else {
        const canBoard = nearTrain < 5.2 && tr.stopped && !p.mounted;
        this.ui.setPrompt('board','E',
          `Board the train${tr.nextStation()?' — '+tr.nextStation():''}`, canBoard);
        if(canBoard && inp.once('KeyE')){
          this.aboard = true;
          if(p.mounted) h.dismount();
          this.ui.toast('ABOARD', 'Step down when she stops. E to alight.', 4);
        }
        /* Standing on a platform with no train in sight: wait for one, rather
           than stand there for four real minutes finding out when she is due. */
        const plat = this._nearestStation(p.pos);
        const canWait = plat && !canBoard && !p.mounted && plat.d < 24;
        this.ui.setPrompt('wait','Y', `Wait for the train — ${plat?plat.s.name:''}`,
                          !!canWait);
        if(canWait && inp.once('KeyY')){
          const waited = tr.fastForwardTo(plat.s.name, this.tod);
          this.ui.toast('THE TRAIN IS IN',
            `You waited ${Math.round(waited/60)} minutes`, 3.5);
        }
      }
    }

    this.ui.setPrompt('talk','F',
      this.nearNpc ? `Speak to ${this.nearNpc.named ? this.nearNpc.name : 'them'}`
                   : '', !!this.nearNpc);
    if(this.nearNpc && inp.once('KeyF')){
      const n = this.nearNpc;
      // If this person owes the story a scene, play it. Otherwise, a remark.
      if(!(this.story && this.story.converse(n))){
        const line = this.folk.pickLine(n);
        if(line) this.folk.onSpeak(n, line);
      }
      n.spokenT = 6;
      p.anim.playOverride('tip_hat', UPPER_MASK, 1, 0.10, false);
      setTimeout(()=>p.anim.stopOverride('tip_hat'), 1350);
    }

    /* HUD. */
    this.ui.drawVitals(p, h);
    /* Compass bearings.

       A yaw of 0 faces +Z, which is SOUTH in this world, and bearings run
       clockwise from north. So bearing = PI - yaw, not yaw + PI: adding PI
       gets north right by luck and then has east and west the wrong way round,
       which is why the strip slid the wrong way when you turned. */
    const bearing = (dx, dz)=> Math.PI - Math.atan2(dx, dz);
    const om = this.story && this.story.markerPos();
    this.ui.objectiveBearing = om ? bearing(om.x - p.pos.x, om.z - p.pos.z) : null;
    this.ui.waypointBearing = this.map && this.map.waypoint
      ? bearing(this.map.waypoint.x - p.pos.x, this.map.waypoint.z - p.pos.z)
      : null;
    this.ui.drawCompass(Math.PI - this.cam.yaw);
    this.ui.updateSubs(dt);
    document.getElementById('clock').textContent =
      `${this.tod.clockString()} · ${this.towns.current ? this.towns.current.name
                                                        : BIOME_NAMES[biome]}`;

    /* Render. */
    this.composer.render(this.elapsed);
    inp.endFrame();
  }

  /* Only a handful of real lights exist; they chase the nearest lamps so a
     town glows after dark without paying for a light per post. */
  _placeTownLights(){
    const night = this.tod.nightAmt;
    if(night < 0.12){
      for(const l of this.townLights) l.visible = false;
      return;
    }
    const cands = [];
    for(const [key, g] of this.towns.built){
      for(const p of (g.userData.lamps||[])){
        const d = p.distanceToSquared(this.player.pos);
        if(d < 3600) cands.push([d, p]);
      }
    }
    cands.sort((a,b)=>a[0]-b[0]);
    for(let i=0;i<this.townLights.length;i++){
      const l = this.townLights[i];
      if(i < cands.length){
        l.position.copy(cands[i][1]);
        l.visible = true;
        l.intensity = night*9.5*M.sat(1 - cands[i][0]/3600);
      } else l.visible = false;
    }
  }

  /* --- Adaptive quality: watch a 2s window and step down (§20) ---------- */
  _adapt(ms){
    this.frameTimes.push(ms);
    if(this.frameTimes.length > 120) this.frameTimes.shift();
    if(!this.adaptive || this.frameTimes.length < 110) return;
    const avg = this.frameTimes.reduce((a,b)=>a+b,0)/this.frameTimes.length;
    if(avg > 21.5 && this.quality < QUALITY.length-1){
      this.setQuality(this.quality+1); this.frameTimes.length = 0;
    } else if(avg < 11.5 && this.quality > 0){
      this.setQuality(this.quality-1); this.frameTimes.length = 0;
    }
  }

  loop(){
    requestAnimationFrame(()=>this.loop());
    try { this._tick(); }
    catch(err){
      if(!this._errShown){
        this._errShown = true;
        console.error(err);
        document.getElementById('dbg').classList.add('on');
        document.getElementById('dbg').textContent =
          'RUNTIME ERROR (see console)\n' + err.message + '\n' +
          String(err.stack||'').split('\n').slice(0,4).join('\n');
      }
    }
  }

  _tick(){
    const t = performance.now()/1000;
    let dt = t - this.last;
    this.last = t;
    if(this.ledger.open){ dt = 0; }
    dt = Math.min(dt, CFG.MAX_DT);
    this.elapsed += dt;
    const t0 = performance.now();
    // Poll before the fixed steps so simulation never runs a frame behind input.
    this.input.poll();

    /* All gameplay, physics and AI in fixedUpdate (§3.1). */
    this.acc += dt;
    let steps = 0;
    while(this.acc >= CFG.FIXED_DT && steps < 5){
      this.fixed(CFG.FIXED_DT);
      this.acc -= CFG.FIXED_DT;
      steps++;
    }
    this.frame(dt);
    this._adapt(performance.now()-t0);

    const dbg = document.getElementById('dbg');
    if(dbg.classList.contains('on')){
      const r = this.renderer.info.render;
      dbg.textContent =
        `${(1/Math.max(dt,0.0001)).toFixed(0)} fps   ${(performance.now()-t0).toFixed(1)} ms\n`+
        `quality  ${QUALITY[this.quality].name}\n`+
        `draws    ${r.calls}   tris ${(r.triangles/1000).toFixed(0)}k\n`+
        `chunks   ${this.streamer.loaded.size} (+${this.streamer.queue.length} queued)\n`+
        `towns    ${this.towns.built.size} built   folk ${this.folk.all.length}\n`+
        `colliders ${this.colliders.count}   road ${this.terrain.roadAt(this.player.pos.x,this.player.pos.z).toFixed(2)}\n`+
        `map      ${this.map ? this.map.percent.toFixed(1) : 0}% surveyed` +
        (this.train && this.train.route ? `   train ${(this.train.speed*3.6).toFixed(0)} km/h` : '') + `\n`+
        `grass    ${this.grass.count}\n`+
        `particles ${this.particles.active}\n`+
        `pos      ${this.player.pos.x.toFixed(0)}, ${this.player.pos.y.toFixed(1)}, ${this.player.pos.z.toFixed(0)}\n`+
        `three    r${THREE.REVISION}   post ${this.composer.enabled && !this.composer.failed ? 'on':'off'}\n`+
        `sun elev ${(this.tod.elev*57.3).toFixed(1)}°   ${this.tod.clockString()}\n`+
        `weather  ${this.weather.state} → ${this.weather.target} (${(this.weather.blend*100).toFixed(0)}%)`;
    }
  }
}

/* ---- Painted signage -----------------------------------------------------
   Canvas 2D and system fonts only. A sign is a texture, so each one is unique
   without a single image file. */
function makeSignTexture(text, opts={}){
  const { w=512, h=160, bg='#2a2118', ink='#e6dcc0', accent=null,
          serif=true, worn=0.5 } = opts;
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const c = cv.getContext('2d');
  c.fillStyle = bg; c.fillRect(0,0,w,h);

  // Plank seams and grain, so a sign reads as painted wood, not a decal.
  c.globalAlpha = 0.16; c.strokeStyle = '#000'; c.lineWidth = 2;
  for(let y=h*0.33; y<h; y+=h*0.34){ c.beginPath(); c.moveTo(0,y); c.lineTo(w,y); c.stroke(); }
  for(let i=0;i<180;i++){
    c.globalAlpha = 0.05 + Math.random()*0.06;
    c.fillStyle = Math.random()<0.5 ? '#000' : '#fff';
    c.fillRect(Math.random()*w, Math.random()*h, 40+Math.random()*120, 1);
  }
  c.globalAlpha = 1;

  if(accent){
    c.strokeStyle = accent; c.lineWidth = 5;
    c.strokeRect(11, 11, w-22, h-22);
  }
  const family = serif ? '"Bookman Old Style", Georgia, serif'
                       : '"Trebuchet MS", "Gill Sans", sans-serif';
  let size = Math.floor(h*0.42);
  c.textAlign = 'center'; c.textBaseline = 'middle';
  do { c.font = `${size}px ${family}`; size -= 2; }
  while(c.measureText(text).width > w*0.86 && size > 12);
  c.fillStyle = 'rgba(0,0,0,0.55)';
  c.fillText(text, w/2+3, h/2+3);
  c.fillStyle = ink;
  c.fillText(text, w/2, h/2);

  // Wear: scratch the paint back off.
  c.globalCompositeOperation = 'destination-out';
  for(let i=0;i<Math.floor(worn*260);i++){
    c.globalAlpha = 0.05 + Math.random()*0.18;
    c.beginPath();
    c.ellipse(Math.random()*w, Math.random()*h, 1+Math.random()*9,
              1+Math.random()*3, Math.random()*3.14, 0, 6.28);
    c.fill();
  }
  c.globalCompositeOperation = 'source-over';
  c.globalAlpha = 1;

  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  t.needsUpdate = true;
  return t;
}

/* ---- Geometry merge (no skinning; buildings do not bend) ---------------- */
function mergeParts(parts){
  const pos=[], nrm=[], uv=[], col=[], idx=[], groups=[];
  let vOff=0, iOff=0;
  for(const part of parts){
    const g = part.geo;
    const p=g.attributes.position, n=g.attributes.normal, u=g.attributes.uv;
    // Per-part vertex colour: this is how one shared material paints forty
    // buildings forty different colours without forty draw calls.
    const c = part.color || WHITE_TINT;
    for(let i=0;i<p.count;i++){
      pos.push(p.getX(i),p.getY(i),p.getZ(i));
      nrm.push(n?n.getX(i):0, n?n.getY(i):1, n?n.getZ(i):0);
      uv.push(u?u.getX(i):0, u?u.getY(i):0);
      col.push(c.r, c.g, c.b);
    }
    const cnt = g.index ? g.index.count : p.count;
    for(let i=0;i<cnt;i++) idx.push((g.index?g.index.getX(i):i)+vOff);
    groups.push({start:iOff, count:cnt, material:part.group|0});
    vOff += p.count; iOff += cnt;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  geo.setAttribute('normal',   new THREE.Float32BufferAttribute(nrm,3));
  geo.setAttribute('uv',       new THREE.Float32BufferAttribute(uv,2));
  geo.setAttribute('color',    new THREE.Float32BufferAttribute(col,3));
  geo.setIndex(idx.length>65535 ? new THREE.Uint32BufferAttribute(idx,1)
                                : new THREE.Uint16BufferAttribute(idx,1));
  // Merge adjacent groups that share a material — fewer draw calls.
  groups.sort((a,b)=>a.material-b.material || a.start-b.start);
  for(const g of groups) geo.addGroup(g.start, g.count, g.material);
  geo.computeBoundingSphere();
  return geo;
}

const BM = { BOARD:0, TIMBER:1, ROOF:2, GLASS:3, STONE:4, METAL:5 };

function bldBox(x,y,z, w,h,d, group, parts, uvScale=0.5){
  const g = new THREE.BoxGeometry(w,h,d);
  const uvA = g.attributes.uv;
  for(let i=0;i<uvA.count;i++)
    uvA.setXY(i, uvA.getX(i)*w*uvScale, uvA.getY(i)*h*uvScale);
  g.translate(x,y,z);
  parts.push({geo:g, group});
  return g;
}
function bldPrism(x,y,z, w,h,d, group, parts){
  const hw=w/2, hd=d/2;
  const P=[ -hw,0,-hd,  hw,0,-hd,  hw,0,hd,  -hw,0,hd,   0,h,-hd,  0,h,hd ];
  const I=[ 0,4,1, 2,5,3, 0,3,5, 0,5,4, 1,4,5, 1,5,2, 0,1,2, 0,2,3 ];
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(P,3));
  g.setIndex(I); g.computeVertexNormals();
  const uvArr = new Float32Array(12);
  for(let i=0;i<6;i++){ uvArr[i*2]=P[i*3]*0.4; uvArr[i*2+1]=P[i*3+2]*0.4; }
  g.setAttribute('uv', new THREE.BufferAttribute(uvArr,2));
  g.translate(x,y,z);
  parts.push({geo:g, group});
}
function bldPost(x,z, y0,y1, r, group, parts, seed=0){
  const g = new THREE.CylinderGeometry(r*(0.92+M.imperfection(seed,0.08)), r,
                                       y1-y0, 6, 1);
  g.translate(x, (y0+y1)/2, z);
  parts.push({geo:g, group});
}
/* A porch: floor, roof, posts, and the rail that makes it a place to stand. */
function bldPorch(parts, w, d, depth, height, rail, rnd){
  bldBox(0, height, d/2+depth/2, w+0.3, 0.16, depth, BM.ROOF, parts);
  bldBox(0, 0.10, d/2+depth/2, w+0.5, 0.20, depth+0.3, BM.BOARD, parts);
  for(const sx of [-w/2+0.3, w/2-0.3])
    bldPost(sx, d/2+depth-0.15, 0.2, height, 0.075, BM.TIMBER, parts, sx*13);
  if(rail){
    for(const sx of [-w/2+0.3, w/2-0.3])
      bldBox(sx, 0.72, d/2+depth-0.15, 0.10, 1.0, 0.10, BM.TIMBER, parts);
    bldBox(0, 1.02, d/2+depth-0.15, w*0.55, 0.09, 0.09, BM.TIMBER, parts);
  }
}
function bldWindows(parts, w, d, y, count, ww, wh){
  for(let i=0;i<count;i++){
    const sx = count===1 ? 0 : -w/2 + (i+0.5)*(w/count);
    bldBox(sx, y, d/2+0.23, ww, wh, 0.08, BM.GLASS, parts);
  }
}

    const cap = new THREE.ConeGeometry(1.9, 2.0, 8);
    cap.translate(0, 1.0+H+4.2, 0); parts.push({geo:cap, group:BM.ROOF});
    for(const [ox,oz] of [[0,1.35],[0,-1.35],[1.35,0],[-1.35,0]])
      bldBox(ox, 1.0+H+1.8, oz, ox?0.06:1.3, 1.3, oz?0.06:1.3, BM.GLASS, parts);
    for(let i=0;i<5;i++){
      const sx=-w/2+0.8+i*((w-1.6)/4);
      bldPost(sx, d/2+1.6, 1.0, 1.0+H-0.2, 0.24, BM.TIMBER, parts, i*31);
    }
    bldBox(0, 1.0+H-0.1, d/2+1.6, w+0.6, 0.35, 3.4, BM.ROOF, parts);
    bldBox(0, 0.10, d/2+1.7, w+0.8, 0.20, 3.6, BM.BOARD, parts);
    bldBox(0, 2.35, d/2+0.16, 1.70, 2.70, 0.14, BM.TIMBER, parts);
    bldWindows(parts, w*0.8, d, 3.2, 4, 1.05, 1.9);
    signs.push({ text:name, x:0, y:1.0+H-0.55, z:d/2+3.32, w:w*0.62, h:0.68 });
    lamps.push({ x:-w/2+0.9, y:3.2, z:d/2+3.2 });
    lamps.push({ x: w/2-0.9, y:3.2, z:d/2+3.2 });
    return { parts, signs, lamps, w:w+1.4, d:d+4.4, h:H+7 };
  },

  /* ---- Jail: small, stone, barred ------------------------------------- */

  /* ---- Warehouse / freight depot --------------------------------------- */
  warehouse(rnd, name){
    const parts=[], signs=[], lamps=[];
    const w = M.range(rnd, 12, 17), d = 9.5, H = 5.4;
    bldBox(0, H/2, 0, w, H, d, BM.BOARD, parts);
    bldPrism(0, H, 0, w+0.35, 1.7, d+0.3, BM.ROOF, parts);

    bldBox(0, 0.55, d/2+1.5, w+0.4, 1.10, 3.0, BM.BOARD, parts);
    for(let i=0;i<5;i++)
      bldPost(-w/2+(i+0.5)*(w/5), d/2+2.8, 0, 1.05, 0.09, BM.TIMBER, parts, i*9);
    bldBox(0, 3.3, d/2+2.9, w+0.5, 0.16, 0.25, BM.ROOF, parts);
    for(const sx of [-w/4, w/4])
      bldBox(sx, 2.6, d/2+0.14, 2.6, 2.9, 0.14, BM.TIMBER, parts);

      bldBox(-w/2+(i+0.5)*(w/6), 4.5, d/2+0.13, 0.85, 0.85, 0.08, BM.GLASS, parts);

  stable(rnd, name){

  office(rnd, name){

    bldBox(0, 0.32, 0, w+0.8, 0.64, d+0.8, BM.STONE, parts);
