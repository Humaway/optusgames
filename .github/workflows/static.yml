# .github/workflows/static.yml
#
# Builds the site and deploys it in one run, so everything that goes live
# always matches the commit being deployed:
#
#   1. Small WebP copies of every thumbnail (thumbs/sm, thumbs/lg). The page
#      loads these instead of the multi-MB originals, which is most of what
#      makes it fast. Keep uploading full-size images as normal.
#   2. The vault: games tagged "Vault" in index.html are cut out of the
#      published page and copied into every vault/*.json file, so they're not
#      in the live page source.
#   3. updates.json, the "last updated" manifest, minus any vault game.
#
# This used to be two workflows. The manifest one committed updates.json back
# to the repo, but GitHub never starts a workflow from a push made with the
# built-in GITHUB_TOKEN, so that commit was never deployed. The site always
# shipped the previous push's manifest and ran one update behind.
#
# Replaces update-manifest.yml. Delete that file.

name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0      # full history, otherwise git log has nothing to read

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Shrink thumbnails
        run: |
          pip install --quiet pillow
          python - <<'EOF'
          from pathlib import Path
          from PIL import Image, ImageOps

          # sm = cards (the page shows them at ~240-400px), lg = the big hero panel
          SIZES = {"sm": (800, 800), "lg": (1600, 1600)}
          src = Path("thumbnails")
          made = 0
          for p in sorted(src.rglob("*")) if src.is_dir() else []:
              if p.suffix.lower() not in {".png", ".jpg", ".jpeg", ".webp", ".gif", ".bmp"}:
                  continue
              rel = p.relative_to(src).with_suffix(".webp")
              try:
                  with Image.open(p) as im:
                      im = ImageOps.exif_transpose(im)
                      alpha = im.mode in ("RGBA", "LA", "P") or "transparency" in im.info
                      im = im.convert("RGBA" if alpha else "RGB")
                      for name, box in SIZES.items():
                          out = Path("thumbs") / name / rel
                          out.parent.mkdir(parents=True, exist_ok=True)
                          small = im.copy()
                          small.thumbnail(box, Image.Resampling.LANCZOS)   # never upscales
                          small.save(out, "WEBP", quality=80, method=4)
                  made += 1
              except Exception as e:
                  # one bad file shouldn't stop a deploy; the page falls back to the original
                  print(f"::warning file={p}::Couldn't shrink this image: {e}")
          print(f"Made small copies of {made} thumbnails.")
          EOF

      - name: Build vault + updates.json
        run: |
          node <<'EOF'
          const { execSync } = require("node:child_process");
          const fs = require("node:fs");
          const path = require("node:path");
          const vm = require("node:vm");

          // ---- last commit for every game page --------------------------------
          // Every file the hub can link to. Widen the regex if you add folders.
          const tracked = execSync("git ls-files", { encoding: "utf8" })
            .split("\n")
            .filter(f => /^(.*\/)?games\/.+\.html$/i.test(f));

          const files = {};
          for (const f of tracked) {
            const raw = execSync(
              `git log -1 --format=%cI%x00%h%x00%s -- ${JSON.stringify(f)}`,
              { encoding: "utf8" }
            ).trim();
            if (!raw) continue;
            const [date, sha, message] = raw.split("\0");
            files[f] = { date, sha, message };
          }

          // ---- vault -----------------------------------------------------------
          // Games tagged "Vault" come out of the published index.html and go into
          // every vault/*.json, along with their "last updated" info. Any game in
          // a vault (tagged or listed in a vault file) is left out of updates.json.
          const repoPath = url => String(url || "").replace(/^\.?\//, "");
          const isVault = g => (g.tags || []).some(t => String(t).toLowerCase() === "vault");
          const vaultFiles = fs.existsSync("vault")
            ? fs.readdirSync("vault").filter(f => /^[0-9a-f]{32}\.json$/.test(f)).map(f => path.join("vault", f))
            : [];
          const hidden = new Set();

          try {
            const html = fs.readFileSync("index.html", "utf8");
            const m = html.match(/const\s+GAMES\s*=\s*(\[[\s\S]*?\r?\n\]);/);
            if (!m) throw new Error("couldn't find `const GAMES = [ ... ];` in index.html");
            const games = vm.runInNewContext("(" + m[1] + ")", {}, { timeout: 2000 });
            if (!Array.isArray(games)) throw new Error("GAMES isn't a list");

            const tagged = games.filter(isVault);
            if (tagged.length && !vaultFiles.length) {
              throw new Error(tagged.length + " game(s) are tagged Vault but there's no vault/*.json file to put them in");
            }

            // read every vault file first, so one typo can't leave things half-done
            const vaults = vaultFiles.map(vf => {
              try { return { vf, data: JSON.parse(fs.readFileSync(vf, "utf8")) }; }
              catch (e) { throw new Error(vf + " isn't valid JSON (" + e.message + ")"); }
            });

            for (const { vf, data } of vaults) {
              const own = Array.isArray(data) ? data : (Array.isArray(data.games) ? data.games : []);
              const seen = new Set(own.map(g => repoPath(g.url)));
              const merged = own.concat(tagged.filter(g => !seen.has(repoPath(g.url))));
              const updates = {};
              for (const g of merged) {
                const p = repoPath(g.url);
                hidden.add(p);
                if (files[p]) updates[p] = files[p];
              }
              const out = Object.assign({}, Array.isArray(data) ? {} : data, { games: merged, updates });
              fs.writeFileSync(vf, JSON.stringify(out, null, 2) + "\n");
            }

            if (tagged.length) {
              const pub = games.filter(g => !isVault(g));
              fs.writeFileSync("index.html",
                html.replace(m[0], () => "const GAMES = " + JSON.stringify(pub, null, 2) + ";"));
            }
            console.log(`Vault: ${tagged.length} tagged game(s) moved into ${vaultFiles.length} vault file(s).`);
          } catch (e) {
            // Never block a deploy over this. The page still hides tagged games
            // from the shelf; they're just readable in the page source until fixed.
            console.log(`::warning::Vault step skipped: ${e.message}. Vault games are still hidden on the page but visible in its source.`);
          }

          // ---- updates.json ----------------------------------------------------
          const pubFiles = Object.fromEntries(Object.entries(files).filter(([f]) => !hidden.has(f)));
          fs.writeFileSync(
            "updates.json",
            JSON.stringify({
              generated: new Date().toISOString(),
              commit: (process.env.GITHUB_SHA || "").slice(0, 7),
              files: pubFiles
            }, null, 2) + "\n"
          );
          console.log(`Wrote ${Object.keys(pubFiles).length} entries to updates.json (${hidden.size} vault path(s) left out).`);
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository (plus everything generated above)
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
