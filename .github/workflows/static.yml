# .github/workflows/static.yml
#
# Builds updates.json and deploys the site in the same run, so the manifest
# that goes live always matches the commit being deployed.
#
# This used to be two workflows. The manifest one committed updates.json back
# to the repo, but GitHub never starts a workflow from a push made with the
# built-in GITHUB_TOKEN, so that commit was never deployed. The site always
# shipped the previous push's manifest and ran one update behind.
#
# Replaces update-manifest.yml. Delete that file.

name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0      # full history, otherwise git log has nothing to read

      - name: Generate updates.json
        run: |
          node <<'EOF'
          const { execSync } = require("node:child_process");
          const fs = require("node:fs");

          // Every file the hub can link to. Widen the regex if you add folders.
          const tracked = execSync("git ls-files", { encoding: "utf8" })
            .split("\n")
            .filter(f => /^(.*\/)?games\/.+\.html$/i.test(f));

          const files = {};
          for (const f of tracked) {
            const raw = execSync(
              `git log -1 --format=%cI%x00%h%x00%s -- ${JSON.stringify(f)}`,
              { encoding: "utf8" }
            ).trim();
            if (!raw) continue;
            const [date, sha, message] = raw.split("\0");
            files[f] = { date, sha, message };
          }

          fs.writeFileSync(
            "updates.json",
            JSON.stringify({
              generated: new Date().toISOString(),
              commit: (process.env.GITHUB_SHA || "").slice(0, 7),
              files
            }, null, 2) + "\n"
          );
          console.log(`Wrote ${Object.keys(files).length} entries.`);
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository (plus the updates.json generated above)
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
